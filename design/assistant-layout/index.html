<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 助手 · 布局重构稿「副驾台」</title>
<!-- 令牌直接取产品那一份：这一稿不另起一套色与尺寸（落地时它就是同一套）。 -->
<link rel="stylesheet" href="../../web/styles/tokens.css">
<link rel="stylesheet" href="demo.css">
</head>
<body>

<!-- 图标只有这一份几何：16px 描边，与产品 ui.js 的 ICONS 同一套画法 -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3l1.9 4.6L18.5 9.5 13.9 11.4 12 16l-1.9-4.6L5.5 9.5l4.6-1.9L12 3z"/><path d="M18.5 15.5l.8 1.9 1.9.8-1.9.8-.8 1.9-.8-1.9-1.9-.8 1.9-.8.8-1.9z"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 7.5V12l3 2"/></symbol>
    <symbol id="i-panel" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="2"/><path d="M14.5 5v14"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M15.5 15.5L20 20"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3.5H7.5a1.5 1.5 0 0 0-1.5 1.5v14a1.5 1.5 0 0 0 1.5 1.5h9a1.5 1.5 0 0 0 1.5-1.5V8z"/><path d="M13.5 3.5V8H18"/></symbol>
    <symbol id="i-img" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M4 17l4.5-4.5 3.5 3.5 3-3L20 17"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="1.5"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M4.5 12h13"/><path d="M12.5 6.5l6 5.5-6 5.5"/></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></symbol>
    <symbol id="i-warn" viewBox="0 0 24 24"><path d="M12 4.5l8.5 15h-17l8.5-15z"/><path d="M12 10v4M12 16.4v.2"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M5 7h14M10 7V5.5h4V7M6.5 7l1 12.5h9L17.5 7"/></symbol>
  </defs>
</svg>

<div class="stage" id="stage">

  <!-- ================= 宿主应用（背景示意：生成工作台骨架） ================= -->
  <aside class="host-sb" aria-hidden="true">
    <span class="host-brand"></span>
    <span class="host-nav"></span><span class="host-nav"></span><span class="host-nav"></span>
    <span class="host-nav"></span><span class="host-nav"></span>
    <span class="host-nav"></span>
  </aside>

  <main class="host-main" aria-hidden="true">
    <div class="host-bar">
      <span class="host-tab">视频</span><span class="host-tab">图像</span><span class="host-tab">语音</span>
      <span class="host-model">Kling 2.1</span>
    </div>
    <div class="host-cols">
      <div class="host-form">
        <div class="host-f"><i>提示词</i><b>雨夜街道，湿沥青路面反着霓虹…</b></div>
        <div class="host-f"><i>时长</i><b>4 秒</b></div>
        <div class="host-f"><i>比例</i><b>16:9</b></div>
        <div class="host-f"><i>条数</i><b>1</b></div>
        <div class="host-est">估价 ¥0.42</div>
      </div>
      <div class="host-wall">
        <div class="host-tile"></div><div class="host-tile"></div>
        <div class="host-tile"></div><div class="host-tile"></div>
        <div class="host-tile"></div><div class="host-tile"></div>
      </div>
    </div>
  </main>

  <!-- ================= 副驾台 ================= -->
  <section class="deck" id="deck" aria-label="AI 助手">

    <!-- 宽度把手（真产品那根 .ac-grip）：拖左沿调宽，记在本机（360–760） -->
    <div class="deck-grip" id="deckGrip" title="拖动调宽（记在本机）"></div>
    <!-- 浮窗档的下沿把手：拖下沿调高（真产品 .ac-grip-b） -->
    <div class="deck-grip-b" id="deckGripB" title="拖动调高（记在本机）"></div>

    <!-- 顶栏：跟真产品同一排 —— 名字 · 在哪一页 · 固定 / 新建 / 历史 / 收起 -->
    <header class="deck-hd">
      <span class="deck-tt"><svg class="ic" aria-hidden="true"><use href="#i-spark"/></svg>AI 助手</span>
      <span class="deck-here" id="deckHere">在 生成工作台</span>
      <span class="deck-sp"></span>
      <span class="deck-live" id="deckLive" hidden><i></i>在等 1 条</span>
      <button class="dk-ico" type="button" id="modeBtn" title="固定到右侧 / 改成浮窗"><svg class="ic" aria-hidden="true"><use href="#i-panel"/></svg></button>
      <button class="dk-ico" type="button" id="newBtn" title="新建会话（另开一段对话，这一段留在历史里）"><svg class="ic" aria-hidden="true"><use href="#i-plus"/></svg></button>
      <button class="dk-ico" type="button" id="histBtn" title="历史会话" aria-expanded="false"><svg class="ic" aria-hidden="true"><use href="#i-clock"/></svg></button>
      <button class="dk-ico" type="button" title="收起"><svg class="ic" aria-hidden="true"><use href="#i-x"/></svg></button>
    </header>

    <!-- 历史会话：沿用真产品那一块浮层（标题行 + 搜索 + 列表），只做优化 -->
    <div class="deck-drop" id="histBox" hidden>
      <div class="drop-scrim" id="histScrim"></div>
      <div class="hist-pop" role="dialog" aria-label="历史会话">
        <div class="hist-hd">
          <b>历史会话</b>
          <span class="hist-sum" id="histSum">—</span>
          <button class="dk-ico sm" type="button" id="histClose" title="关掉"><svg class="ic" aria-hidden="true"><use href="#i-x"/></svg></button>
        </div>
        <div class="hist-q">
          <svg class="ic sm" aria-hidden="true"><use href="#i-search"/></svg>
          <input type="search" id="histQ" placeholder="搜索会话标题或内容…" aria-label="搜索会话标题或内容">
        </div>
        <div class="hist-list" id="histList"></div>
      </div>
    </div>

    <!-- 工单流 -->
    <div class="deck-stream" id="deckStream"></div>

    <!-- 输入坞 -->
    <footer class="deck-comp">
      <!-- 附件区：这是**文件**（真产品里 .ac-files 那排）。
           素材引用不走这里 —— 它落在正文里，见输入框中那段高亮。 -->
      <div class="comp-files">
        <span class="comp-files-l">附件</span>
        <span class="file-chip"><svg class="ic sm" aria-hidden="true"><use href="#i-file"/></svg>参考图.png<button class="file-x" type="button" title="撤掉这个附件">×</button></span>
        <span class="comp-note">拖资产卡到悬浮球或这里 = 引用，正文里会高亮</span>
      </div>
      <div class="comp-ta">
        <!-- 拖进来的素材在正文里就是一段高亮文字：
             这一稿保留「[引用素材：…]」那圈字（真产品靠它识别，见 REF_MARK 正则），
             但**去掉了那个 ✕** —— 删字就够了（键盘选中那段文字删），
             删字之后这条引用就**作废**（正文是真相，见 DESIGN.md §7.3）。 -->
        <div class="ta-in" contenteditable="true" role="textbox" aria-multiline="true" aria-label="问点什么">照这版提示词生成一条 4 秒的视频
<span class="ref-mark" contenteditable="false" id="taRef">[引用素材：雨夜街道-候选 1]<span class="ref-tip"><img src="../materials-layout/assets/prop-umbrella.jpg" alt=""><span class="ref-tip-b"><b>雨夜街道-候选 1</b><span>图片 · 资产 la_91b2 · 任务 task_7f21</span></span></span></span></div>
      </div>
      <!-- 引用被改坏时的一句回执（真产品是 note() 那条一行小字） -->
      <div class="comp-warn" id="refWarn" hidden>输入框里那段引用文字被改过了 —— 这条引用已经去掉，这一轮助手不会再拿到它。</div>
      <div class="comp-foot">
        <button class="comp-btn" type="button"><svg class="ic sm" aria-hidden="true"><use href="#i-file"/></svg>文件</button>
        <span class="comp-hint">Enter 发送 · Shift+Enter 换行</span>
        <span class="comp-sp"></span>
        <button class="comp-send" type="button">发送<svg class="ic sm" aria-hidden="true"><use href="#i-send"/></svg></button>
      </div>
    </footer>
  </section>

  <!-- 悬浮球：面板收起时它才是唯一看得见的助手入口；拖资产到它上面 = 引用 -->
  <button class="ac-ball" id="acBall" type="button" title="AI 助手（可以拖动；把素材卡拖到这里 = 引用）">
    <svg class="ic" aria-hidden="true"><use href="#i-spark"/></svg>
    <span class="ac-dot">1</span>
  </button>
</div>

<!-- 演示控制条：只给看稿子的人，不属于产品 -->
<div class="demo-bar">
  <span class="demo-lb">稿子控制</span>
  <button type="button" data-demo="mode" id="dMode">切形态</button>
  <button type="button" data-demo="rail" id="dRail">开历史会话</button>
  <button type="button" data-demo="trace" id="dTrace">展开工序</button>
  <button type="button" data-demo="empty" id="dEmpty">空态</button>
  <button type="button" data-demo="theme" id="dTheme">深浅档</button>
  <button type="button" data-demo="drop" id="dDrop">拖放到球</button>
  <button type="button" data-demo="break" id="dBreak">改坏引用</button>
</div>

<script src="data.js"></script>
<script src="demo.js"></script>
</body>
</html>
