<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 设计稿独立页：只开同源静态资源，脚本一律外部文件（跟产品的 CSP 规矩一致） -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data: blob:; connect-src 'none'; object-src 'none'; base-uri 'self'">
<title>拾帧 · 设置（重设计稿）</title>
<link rel="stylesheet" href="demo.css">
</head>
<body>

<!-- 设计稿外壳：只在稿子里存在，产品界面里没有这一条 -->
<div class="demo-chrome">
  <div class="demo-chrome-l">
    <span class="demo-chrome-t">拾帧 · 设置（重设计稿）</span>
    <span class="demo-chrome-note">浅色主题 · 内容取自真机本机那份 .data · 这一稿只出稿子，不动产品代码</span>
  </div>
  <div class="demo-chrome-r">
    <span>改造前对照</span>
    <a href="shots/before-settings-viewport.png" target="_blank">真机首屏</a>
    <a href="shots/before-settings.png" target="_blank">真机整页</a>
  </div>
</div>

<!-- 应用外壳的缩略：设置页在产品里就长在侧栏右边，这一段是给稿子一个位置 -->
<div class="app">
  <aside class="app-side">
    <div class="app-logo">
      <span class="app-logo-badge">AI</span>
      <span class="app-logo-t">AI 创作工作台</span>
    </div>

    <div class="app-nav-h">工作空间</div>
    <nav class="app-nav">
      <span class="app-nav-i"><svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="1.8" y="3" width="12.4" height="10" rx="1.5"/><path d="M4.6 3v10M11.4 3v10M1.8 6.2h2.8M1.8 9.8h2.8M11.4 6.2h2.8M11.4 9.8h2.8"/></svg>导演台</span>
      <span class="app-nav-i"><svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="5.5" r="2.5"/><path d="M1.5 13.5c0-2.5 2-4 4.5-4s4.5 1.5 4.5 4"/><path d="M11 3.6a2.5 2.5 0 0 1 0 4.8M12 9.8c1.6.5 2.5 1.8 2.5 3.7"/></svg>素材库</span>
      <span class="app-nav-i"><svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 1.8 7.2 5 10.5 6.2 7.2 7.4 6 10.6 4.8 7.4 1.5 6.2 4.8 5Z"/><path d="M12 9.5l.6 1.6 1.6.6-1.6.6-.6 1.6-.6-1.6-1.6-.6 1.6-.6Z"/></svg>生成工作台</span>
      <span class="app-nav-i"><svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m8 2 1.9 3.9 4.3.6-3.1 3 .7 4.3L8 11.8 4.2 13.8l.7-4.3-3.1-3 4.3-.6Z"/></svg>我的收藏</span>
      <span class="app-nav-i"><svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 1.8 14 5v6l-6 3.2L2 11V5Z"/><path d="M2 5l6 3.2L14 5M8 8.2v6"/></svg>资产库</span>
      <span class="app-nav-i"><svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 13.5h12"/><rect x="3" y="8" width="2.6" height="4"/><rect x="7" y="4.5" width="2.6" height="7.5"/><rect x="11" y="6.5" width="2.6" height="5.5"/></svg>用量与余额</span>
    </nav>

    <div class="app-side-gap"></div>

    <div class="app-bal-h">账户余额</div>
    <div class="app-bal">
      <div class="app-bal-c">
        <div class="app-bal-n">产品看本机</div>
        <div class="app-bal-v">产物自动存本机已关；本机已有 0 份</div>
      </div>
      <div class="app-bal-c">
        <div class="app-bal-n">SparkCine</div>
        <div class="app-bal-v">可用 784 积分 · 冻结 0 积分</div>
      </div>
    </div>

    <div class="app-foot">
      <span class="app-foot-i on"><svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="2.4"/><path d="M8 1.5v1.8M8 12.7v1.8M14.5 8h-1.8M3.3 8H1.5M12.6 3.4l-1.3 1.3M4.7 11.3l-1.3 1.3M12.6 12.6l-1.3-1.3M4.7 4.7 3.4 3.4"/></svg>设置</span>
      <span class="app-foot-i"><svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 8a5.5 5.5 0 1 1-1.7-4"/><path d="M13.8 1.6v3h-3"/></svg>换背景</span>
    </div>
  </aside>

  <div class="app-main">
    <div class="set">
      <!-- 目录轨：左边这一列就是新稿的主体 -->
      <aside class="rl" id="rail" aria-label="设置目录">
        <div class="rl-search">
          <svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 4 4"/></svg>
          <input id="railSearch" type="search" placeholder="找一项设置（密钥、目录、分页…）" autocomplete="off" spellcheck="false">
        </div>
        <div class="rl-scroll" id="railScroll"></div>
        <div class="rl-foot"><span class="dot"></span><span>改完就自动存进本机</span></div>
      </aside>

      <!-- 右：一条连续滚动的文档（15 张卡排成一条，滚到哪一栏就接着滚下一栏） -->
      <section class="dt" id="detail">
        <div class="dt-scroll" id="dtScroll"></div>
        <div class="dt-foot">
          <span id="dtPos">—</span>
          <span class="sp"></span>
          <span class="dt-save"><span class="dot"></span>改完就存本机 · 刚刚存过</span>
        </div>
      </section>
    </div>
  </div>
</div>

<script src="data.js"></script>
<script src="demo.js"></script>
</body>
</html>
