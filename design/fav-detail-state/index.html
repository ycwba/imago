<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的收藏 · 卡片与详情稿</title>
<!-- 这一稿是「设计稿」，不是产品代码：web/ 与 server/ 一行未动。
     令牌与公共件直接引真文件（只读引用）；深色档是 tokens.css 的深色那一段自动派生。 -->
<link rel="stylesheet" href="../../web/styles/tokens.css">
<link rel="stylesheet" href="../../web/styles/ui.css">
<link rel="stylesheet" href="../../web/styles/sidebar.css">
<!-- 公共卡片件：与资产库那一稿引的是**同一份**（状态牌 / 就地展开 / 账条 / 诊断块 / 展开带子） -->
<link rel="stylesheet" href="../shared-kit/card-kit.css">
<link rel="stylesheet" href="demo.css">
</head>
<body class="demo-fv">

<!-- ══ 应用侧栏（真外壳，窄形态 56px：图标 + 两字短标签） ══ -->
<div class="sidebar">
  <div class="sb-brand"><span class="sb-logo" title="点击收起 / 展开侧边栏">AI</span>
    <span class="sb-brand-txt"><span class="sb-name">AI 创作工作台</span><span class="sb-sub">本地优先 · 数据留在本机</span></span></div>
  <nav>
    <a href="#" data-page="director.html"><span class="ic"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="1.9" y="3" width="12.2" height="10" rx="1.5"/><path d="M4.7 3v10M11.3 3v10M1.9 8h12.2"/></svg></span><span class="lb">导演台</span><span class="sh">导演</span></a>
    <a href="#" data-page="chars.html"><span class="ic"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="6.1" cy="5.5" r="2.4"/><path d="M2.2 13.1c0-2.2 1.8-3.7 3.9-3.7s3.9 1.5 3.9 3.7"/><path d="M10.6 3.4a2.3 2.3 0 0 1 0 4.3"/><path d="M11.7 9.8c1.6.5 2.7 1.8 2.7 3.3"/></svg></span><span class="lb">素材库</span><span class="sh">素材</span></a>
    <a href="#" data-page="studio.html"><span class="ic"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6.3 2.2l1 2.4 2.4 1-2.4 1-1 2.4-1-2.4-2.4-1 2.4-1z"/><path d="M11.8 8.6l.7 1.6 1.6.7-1.6.7-.7 1.6-.7-1.6-1.6-.7 1.6-.7z"/></svg></span><span class="lb">生成工作台</span><span class="sh">生成</span></a>
    <a href="#" data-page="favorites.html" class="active"><span class="ic"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2.6l1.7 3.5 3.8.5-2.8 2.7.7 3.8L8 11.3l-3.4 1.8.7-3.8L2.5 6.6l3.8-.5z"/></svg></span><span class="lb">我的收藏</span><span class="sh">收藏</span></a>
    <a href="#" data-page="assets.html"><span class="ic"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2l5.5 3v6L8 14l-5.5-3V5z"/><path d="M2.5 5L8 8l5.5-3M8 8v6"/></svg></span><span class="lb">资产库</span><span class="sh">资产</span></a>
    <a href="#" data-page="usage.html"><span class="ic"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.6 13.4V2.6M2.6 13.4h10.8"/><path d="M5.6 11V7.4M8.2 11V4.8M10.8 11V8.8"/></svg></span><span class="lb">用量与余额</span><span class="sh">用量</span></a>
  </nav>
  <div class="sb-bottom" id="sbBalance">
    <div class="sb-bal-sum">
      <div class="p"><span class="ic"><svg viewBox="0 0 16 16" width="11" height="11" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="5.4"/><path d="M10 6.2c-.4-.7-1.1-1-2-1-1.1 0-1.9.5-1.9 1.3 0 .9.8 1.2 1.9 1.4 1.2.2 2 .6 2 1.5s-.9 1.4-2 1.4c-1 0-1.7-.4-2.1-1.1M8 3.8v8.4"/></svg></span><b>4</b><span class="u">家余额</span></div>
      <div class="sb-bal-dots"><i class="ok"></i><i class="ok"></i><i class="ok"></i><i class="ok"></i></div>
    </div>
  </div>
  <div class="sb-bottom">
    <a class="sb-set" href="#" data-page="settings.html"><span class="ic"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="2.1"/><path d="M8 2.2v1.5M8 12.3v1.5M2.2 8h1.5M12.3 8h1.5M3.9 3.9l1 1M11.1 11.1l1 1M12.1 3.9l-1 1M4.9 11.1l-1 1"/></svg></span><span class="lb">设置</span></a>
    <button class="sb-set" id="sbTheme" type="button" title="切换亮色 / 暗色背景"><span class="ic"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 9.6A5.2 5.2 0 0 1 6.4 3 5.4 5.4 0 1 0 13 9.6z"/></svg></span><span class="lb">换背景</span></button>
  </div>
</div>

<div id="app">
  <div class="page-main fv-page">
    <div class="fv-mat" id="fvMat">

      <!-- ══ 页头：找东西的一行 ══ -->
      <header class="fv-head">
        <div class="fv-title">
          <h1 class="page-h1">★ 我的收藏</h1>
          <div class="fv-sub" id="fvSub">17 条</div>
        </div>
        <div class="fv-tools">
          <input type="search" id="fvQ" placeholder="搜索名称 / 提示词 / 备注" aria-label="搜索收藏">
          <button class="tool" id="fvAi" type="button" title="按搜索框里那句话，让文字 AI 挑出合适的收藏">✦ AI 找素材</button>
          <button class="ghost" id="fvUpload" type="button">↑ 上传本地文件</button>
        </div>
      </header>

      <!-- ══ 概览条：这批收藏的字节还在不在本机（本地优先的产品该有的第一眼事实） ══ -->
      <div class="fv-sum" id="fvSum"></div>

      <!-- ══ 一行筛选 + 摆法 ══ -->
      <div class="fv-filters">
        <span class="ui-seg" id="fvType" role="group" aria-label="按类型筛选"></span>
        <span class="sp" style="flex:1"></span>
        <span class="viewtoggle" id="fvView" role="group" aria-label="展示样式切换">
          <button type="button" class="active" data-view="grid" title="网格">
            <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="5.5" height="5.5" rx="1"/><rect x="8.5" y="2" width="5.5" height="5.5" rx="1"/><rect x="2" y="8.5" width="5.5" height="5.5" rx="1"/><rect x="8.5" y="8.5" width="5.5" height="5.5" rx="1"/></svg></button>
          <button type="button" data-view="compact" title="紧凑">
            <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="3.4" height="3.4" rx="0.8"/><rect x="6.3" y="2" width="3.4" height="3.4" rx="0.8"/><rect x="10.6" y="2" width="3.4" height="3.4" rx="0.8"/><rect x="2" y="6.3" width="3.4" height="3.4" rx="0.8"/><rect x="6.3" y="6.3" width="3.4" height="3.4" rx="0.8"/><rect x="10.6" y="6.3" width="3.4" height="3.4" rx="0.8"/></svg></button>
          <button type="button" data-view="list" title="清单">
            <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M5.6 4h8M5.6 8h8M5.6 12h8"/><path d="M2.8 4h.01M2.8 8h.01M2.8 12h.01"/></svg></button>
        </span>
      </div>

      <!-- ══ 主体：卡片网格（自己滚） ══ -->
      <div class="fv-body" id="fvBody" data-kit-scope>
        <main class="fv-list" id="fvList"></main>
      </div>

      <footer class="fv-foot">
        <span class="pginfo" id="fvPgi"></span>
      </footer>
    </div>
  </div>
</div>

<script src="../shared-kit/card-kit.js"></script>
<script src="data.js"></script>
<script type="module" src="demo.js"></script>
</body>
</html>
