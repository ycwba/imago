<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的收藏 · 布局稿</title>
<!-- 这一稿是「设计稿」，不是产品代码：web/ 与 server/ 一行未动。
     令牌与公共件直接引真文件（只读引用），所以稿子里的颜色、圆角、按钮
     与产品里现在跑的完全是同一套；深色档是 tokens.css 的深色那一段自动派生。 -->
<link rel="stylesheet" href="../../web/styles/tokens.css">
<link rel="stylesheet" href="../../web/styles/ui.css">
<link rel="stylesheet" href="../../web/styles/sidebar.css">
<link rel="stylesheet" href="demo.css">
</head>
<body class="demo-fav">

<!-- ══ 应用侧栏：真外壳（满形态 232px），结构原样从真机取下来 ══ -->
<div id="sidebar-host"></div>

<div id="app">
  <div class="page-main fav-page page-shell" id="favPage">

    <!-- ══ ① 页头：一行摆完，不再分两道工具条 ══ -->
    <header class="fv-head">
      <h1 class="page-h1">
        <span class="fv-star" aria-hidden="true"><svg viewBox="0 0 16 16" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2.6l1.7 3.5 3.8.5-2.8 2.7.7 3.8L8 11.3l-3.4 1.8.7-3.8L2.5 6.6l3.8-.5z"/></svg></span>
        我的收藏
      </h1>
      <div class="fv-head-r">
        <input type="search" id="fvSearch" placeholder="搜索名称 / 提示词 / 备注" aria-label="搜索收藏">
        <button class="tool acc" id="fvAi" type="button" title="把搜索框里那句话交给文字 AI，按名称 / 类型 / 备注挑出收藏"><span class="ic"><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6.3 2.2l1 2.4 2.4 1-2.4 1-1 2.4-1-2.4-2.4-1 2.4-1z"/><path d="M11.8 8.6l.7 1.6 1.6.7-1.6.7-.7 1.6-.7-1.6-1.6-.7 1.6-.7z"/></svg></span>AI 找素材</button>
        <button class="ghost" id="fvUpload" type="button"><span class="ic"><svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 10.6V3.4M5.2 6.2 8 3.4l2.8 2.8M3.4 12.6h9.2"/></svg></span>上传本地文件</button>
      </div>
    </header>

    <!-- ══ ② 概览条：这批收藏的字节有多少真在这台机器上 ══ -->
    <section class="fv-gauge" id="fvGauge" aria-label="收藏概览">
      <div class="gv-line">
        <span class="gv-tot"><b id="gvTotal">0</b> 项</span>
        <span class="gv-warn" id="gvWarn" hidden></span>
        <span class="gv-sp"></span>
        <button class="ghost mini" id="fvPull" type="button">存回本机（<b id="gvPullN">0</b>）</button>
      </div>
      <div class="gv-bar" id="gvBar" role="img" aria-label="本机与云端的占比">
        <span class="gv-lab">本机 <b id="gvLocal">0</b></span>
        <i class="gv-track"><i class="gv-fill" id="gvFill"></i></i>
        <span class="gv-lab">云端 <b id="gvCloud">0</b></span>
      </div>
    </section>

    <!-- ══ ③ 筛选与视图：一行，左边是筛选，右边是摆法 ══ -->
    <div class="fv-tools">
      <div class="fv-chips" id="fvChips" role="group" aria-label="按类型筛选"></div>
      <div class="fv-tools-r">
        <span class="ui-seg" id="fvLayout" role="group" aria-label="对照两种摆法">
          <button type="button" class="on" data-layout="new">新版</button>
          <button type="button" data-layout="old">现状</button>
        </span>
        <span class="viewtoggle" id="fvView" role="group" aria-label="摆法">
          <button type="button" class="active" data-view="rows" title="摘录行"><svg viewBox="0 0 14 14" width="15" height="15" fill="currentColor" aria-hidden="true"><rect x="0.6" y="1" width="12.8" height="3.2" rx="1.2"/><rect x="0.6" y="5.4" width="12.8" height="3.2" rx="1.2"/><rect x="0.6" y="9.8" width="12.8" height="3.2" rx="1.2"/></svg></button>
          <button type="button" data-view="wall" title="缩略墙"><svg viewBox="0 0 14 14" width="15" height="15" fill="currentColor" aria-hidden="true"><rect x="0.6" y="0.6" width="5.6" height="5.6" rx="1.4"/><rect x="7.8" y="0.6" width="5.6" height="5.6" rx="1.4"/><rect x="0.6" y="7.8" width="5.6" height="5.6" rx="1.4"/><rect x="7.8" y="7.8" width="5.6" height="5.6" rx="1.4"/></svg></button>
        </span>
      </div>
    </div>

    <!-- ══ ④ 主体 ══ -->
    <div class="fv-body" id="fvBody"></div>

    <div class="pager-row" id="fvPager">
      <button class="ghost" type="button">上一页</button>
      <span class="pginfo">1 / 1</span>
      <button class="ghost" type="button">下一页</button>
    </div>
  </div>
</div>

<!-- ══ 更多操作的小浮层（移出收藏收在这里，不再红色常驻） ══ -->
<div class="fv-menu" id="fvMenu" hidden role="menu"></div>

<script src="sidebar.js"></script>
<script src="data.js"></script>
<script src="demo.js"></script>
</body>
</html>
