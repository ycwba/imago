<!-- ══ 素材详情：整屏层（盖住素材台，右边这一块全是它） ══ -->
<div class="md-layer" id="layer">
  <header class="md-head" id="mdHead"></header>
  <div class="md-body">
    <aside class="md-media" id="mdMedia"></aside>
    <div class="md-doc" id="mdDoc"></div>
  </div>
  <footer class="md-foot" id="mdFoot"></footer>
</div>

<!-- 演示用的状态切换条（不属于设计本体，出图时隐藏） -->
<div class="demo-switch" id="demoSwitch">
  <span class="ds-t">稿子状态</span>
  <button type="button" data-state="new" class="on">新建素材</button>
  <button type="button" data-state="newPick">新建 · 出图后</button>
  <button type="button" data-state="actor">编辑 · 角色</button>
  <button type="button" data-state="scene">编辑 · 场景</button>
  <button type="button" data-state="prop">编辑 · 道具</button>
</div>
