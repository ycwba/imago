<!-- 导演台的 DOM 模板与样式；行为全在 engine.js（index.js 把 mount(document, window) 跑起来）。 -->
<style>


  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font-ui);
    background: var(--bg); color: var(--txt); overflow: hidden;
  }
  /* 页面骨架：头部 + 三栏，默认占满一屏、由各栏自己滚；
     窄窗口下会被下面的 @media 放开成「内容多高就多高」，交给页面整体滚动。 */
  /* --dock-h 是轨道坞的高度：默认封顶值走组件尺寸令牌 --sz-dock（行多时轨道区自己滚），
     拖过之后由公共件 Wb.split 往这个数上写一行行内样式（拖出来的那个高度）。
     ⚠ 名字要跟 Wb.split 的 varName 对得上号（它写的是 '--' + varName）：写成 dock_h 就落到
     --dock_h 上，而 CSS 读的是 --dock-h —— 对不上号时把手看着能拖、坞纹丝不动。 */
  .page-main { --shell-px: var(--sp-32); --dock-h: var(--sz-dock); --strip-h: 190px; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  /* 顶部那一行现在是**公共页头** .phead（全站唯一一份）：身份（导演台）
     + 上下文（当前项目：短片数 / 项目名 / 已保存）+ 动作（导出）。
     导演台不再自己一套 header —— 它与另外六页是同一副契约，
     只是「当前项目」这一档是它特有的。导演台整页不滚，所以这里不吸顶。
     横向留白读 .page-main 上的 --shell-px（与全站同一枚 32px，760 以下 14px）——
     页头与下面三栏都读它 → 标题与三栏的左缘永远对齐。
     ⚠ 这一页的壳不留左右白（.layout 自己带 padding），所以页头的内缩写在**盒子**上：
     左右 margin 各一枚 --shell-px，公共那一份 .phead 的左右 padding 是 0 ——
     于是分隔线的起止 == 三栏内容列的起止（与另外六页同一口径，不再通栏到视口缘）。 */
  .phead { margin: 0 var(--shell-px); }
  /* 导出按钮容器：按钮由 web/domain/export-formats.js 表现画，display:contents 让它们
     仍按页头动作区的 flex + gap 排，不因为多包一层而改变间距。 */
  #exportBtns { display: contents; }
  /* 页头这一排同时摆着短片切换钮与导出钮 —— 一行里的原子控件只许 --sz-ctl 一档：
     以前切换钮走胶囊档 24、导出钮 32，两种高度并存。 */
  header .phead-chip { border-radius: var(--radius-6); height: var(--sz-ctl); padding: 0 var(--sp-12);
    max-width: var(--sz-pname); }
  header button.phead-chip { font-size: var(--fs-13); }
  /* 按钮上念的是当前短片名（不是「我的短片 N」）：名字长到截断为止，全文在 title 里。
     改名不在这一格 —— 页头只报「现在是哪一部」，改与整理都在它点开的那份菜单里就地做。 */
  #projLabel { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* 那颗按钮与它点开的菜单共用一个定位容器；按钮要能在窄窗里被压短，容器得允许缩。 */
  .phead-proj { position: relative; min-width: 0; }
  header .saved { color: var(--ok); font-size: var(--fs-12); white-space: nowrap; }
  /* 顶部那行操作提示：低调的小字，出现几秒后自己淡出，不打断操作 */
  header .opstate { font-size: var(--fs-12); color: var(--sub); opacity: 0; transition: opacity var(--dur-280);
    max-width: 42ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  header .opstate.show { opacity: 1; }
  header .opstate.ok { color: var(--ok); }
  header .bal { font-size: var(--fs-12); color: var(--sub); }
  header .bal b { color: var(--txt); }
  /* 页头那颗比例下拉：外面是 Dropdowns 包出来的 .dd，按页头按钮的高度压扁一档，
     不然 36px 的默认高度会把整行顶高、和旁边的 .ghost 对不齐。 */
  .head-dd { display: inline-flex; width: 106px; flex: 0 0 auto; }
  .head-dd .dd { width: 100%; }
  .head-dd .dd-btn { height: 30px; padding: 0 var(--sp-8); font-size: var(--fs-12); border-radius: var(--radius-4); }
  /* 顶部横幅 #banner 的样式在 ui.css（全站那一份），这里不再抄。 */
  .layout { --sp0: clamp(198px, 19%, 270px); --sp1: clamp(298px, 28%, 400px); display: flex; gap: var(--sp-16); padding: var(--sp-16) var(--shell-px); flex: 1 1 auto; min-height: 0; position: relative; }
  .col { background: var(--panel); border: var(--hair) solid var(--line); border-radius: var(--radius-4); overflow-y: auto; }
  .col::-webkit-scrollbar { width: 8px; } .col::-webkit-scrollbar-thumb { background: var(--scroll); border-radius: var(--radius-4); }
  /* 三栏占比可拖：拖过之后宽度写死成 --sp0 / --sp1（存在 localStorage 的 dir_split），
     没拖过就用下面这组 clamp 的弹性默认值。min-width 仍然兜着，别拖到内容摆不下。 */
  /* 左栏是**一整块**：表头 / 列表 / 加场景 / 生成全部四段固定在同一张卡里，
     纵向滚动只发生在中间那份列表上。以前 #scenesBox 少了 min-height:0，
     flex 子项的 min-height:auto 让列表按内容撑高，整栏于是既滚列表又滚整列（表头与按钮会被滚走）。 */
  .col-left { flex: 0 1 var(--sp0); min-width: 198px; display: flex; flex-direction: column;
    overflow: hidden; }
  .col-left > .left-head, .col-left > .add-scene, .col-left > .gen-all { flex: 0 0 auto; }
  /* 左栏滚动条：跟 .col 一样细，别用系统粗条压住分镜行 */
  #scenesBox { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; }
  #scenesBox::-webkit-scrollbar { width: 8px; }
  #scenesBox::-webkit-scrollbar-track { background: transparent; }
  #scenesBox::-webkit-scrollbar-thumb { background: var(--line); border-radius: var(--radius-6); }
  #scenesBox::-webkit-scrollbar-thumb:hover { background: var(--sub); }
  /* 中栏：flex-basis 写 0（不是 auto）——auto 会让基准尺寸跟着内容走，候选条一变多/变宽，
     三栏占比就跟着飘；basis:0 之后中栏宽度只由容器与两侧栏决定。
     中栏是「看片台」不套外框（两侧编辑器有卡框，功能区分靠它 —— 用户点名）。 */
  .col-mid { flex: 1 1 0%; min-width: 0; background: none; border: 0; border-radius: 0;
    position: relative; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  /* 正文自己滚（页面不滚）：候选多了也不会把播放器顶出视口，顺序条钉在栏底不动。 */
  .mid-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; }
  .mid-body::-webkit-scrollbar { width: 8px; }
  .mid-body::-webkit-scrollbar-thumb { background: var(--scroll); border-radius: var(--radius-4); }
  /* 顺序条（原来点「顺序」才出现的那一栏）常驻、高度按内容封顶；条内换行，多了自己滚。 */
  .shot-strip-host { flex: 0 0 auto; max-height: var(--strip-h); display: flex; flex-direction: column;
    background: var(--panel); border-top: var(--hair) solid var(--line); }
  .shot-strip-host[hidden] { display: none; }
  /* 剪辑态视频栏不滚（用户点名）：`.player-wrap` 设成 size 容器，播放盒宽直接由容器高（cqh）
     与栏宽（cqw）现算 —— 拖轨道坞（--dock-h）、改窗口全程跟手，不再靠整栏重画时 JS 现量
     （那份旧量法在拖坞之后不重算，旧盒高溢出 `.player-wrap`，中栏就出滚动条）。
     min 三参一次压住三个上限：栏宽、可用高折算宽、生成态同款的 56vh 封顶；cqw/cqh 指 content-box，
     自动扣掉这一层的 16/16/8 padding。生成态不进这几条，仍是 calc(56vh * 16 / 9)。
     ⚠ container-type:size 让这一层不再由内容撑高（高度只来自 flex 分配）—— 往这里塞流式内容会被裁。 */
  .col-mid.is-trim .player-wrap { flex: 1 1 auto; min-height: 0; container-type: size; }
  .col-mid.is-trim .player-box { width: min(100cqw, calc(100cqh * 16 / 9), calc(56vh * 16 / 9)); }
  /* 盒宽已由 min() 封死，video 的 max-height 放开：矮窗那档 44vh 的媒体查询会在可用高不足时
     把 16:9 压扁；显式排除全屏（全屏那条 100%/100% 不许被这枚特异度更高的规则盖住）。 */
  .col-mid.is-trim .player-box:not(:fullscreen) video { max-height: none; }
  .col-mid.is-trim .mid-body { overflow: hidden; }
  .col-mid.is-trim .mid-tools { flex: 0 0 auto; }
  .col-right { flex: 0 1 var(--sp1); min-width: 298px; }
  /* ---------- 窗口尺寸自适应 ----------
     栏宽用 clamp 跟着窗口平滑缩放（不再固定像素），中间播放区吃掉剩下的空间；
     窄到三栏摆不下时整体堆叠成单列、页面本身滚动；再窄/再矮就收紧留白。 */
  @media (max-width: 1200px) {
    .layout { gap: var(--sp-12); padding: var(--sp-12) var(--shell-px); }
    header .opstate { display: none; }
  }
  @media (max-width: 1100px) {
    /* 窄窗口下顶部按钮换到第二行，别把「导演台」与它右边那一格短片名挤成竖排。
       换行的是**动作区**（.phead-acts），说明槽（.phead-sub）直接不画 ——
       让说明占满一整行会把按钮挤到第三行去。 */
    header .phead-sub { display: none; }
    header .phead-acts { flex: 1 1 100%; justify-content: flex-end; }
  }
  @media (max-width: 900px) {
    html, body { height: auto; }
    body { overflow: auto; }
    /* 关键：把「一屏高 + 裁掉溢出」的骨架放开，否则堆叠出来的内容被裁掉、页面滚不动 */
    .page-main { height: auto; min-height: 100vh; overflow: visible; }
    /* 三栏摆不下：分镜 + 播放/时间线 并排一行（保留「边看边挑」），编辑区整行放到下面 */
    .layout { flex-wrap: wrap; padding: var(--sp-8) var(--shell-px); gap: var(--sp-8); }
    .col { overflow: visible; flex: 0 0 auto; min-width: 0; }
    .col-left { flex: 0 0 clamp(168px, 22%, 226px); max-height: 44vh; overflow-y: auto; }
    .col-mid { flex: 1 1 360px; min-width: 300px; }
    .col-right { flex: 1 1 100%; }
    /* 视频栏定高一档（主规则那一条 clamp）：窄窗下候选条与顺序条更要完整可见，不再放宽 */
  }
  @media (max-width: 760px) {
    /* 很窄：彻底单列，每块整行 */
    .col-left, .col-mid, .col-right { flex: 1 1 100%; max-height: none; }
    .col-left { max-height: 44vh; }
  }
  /* 窄到 760 以下：横向留白跟全站同一枚（--sp-14），页头与三栏一起收 */
  @media (max-width: 760px) {
    .page-main { --shell-px: var(--sp-16); }
  }
  @media (max-width: 760px) {
    .layout { padding: var(--sp-8) var(--shell-px); }
  }
  /* 矮窗口（横向拉长、纵向不够）：先把头部和留白压扁，播放区别把整屏占满。
     横向留白不跟着压 —— 页头、三栏、轨道底板读同一枚 --shell-px，只压纵向。 */
  @media (max-height: 620px) {
    .layout { padding: var(--sp-8) var(--shell-px); }
    .player-box video, .player-empty { max-height: 44vh; }
    .col-left { max-height: 38vh; }
  }
  button { font-family: inherit; }
  /* 本页按钮统一方正一点：共享的 .ghost/.dd 圆角在导演台收小 */
  .ghost, .ghost.mini, .dd-btn, .dd-opt { border-radius: var(--radius-4); }
  /* .ghost / .pri / .lb-btn / #lightbox 等公共组件样式统一来自 ui.css */

  /* 左栏 */
  /* 短片切换菜单：与左栏分镜列表同一套样式。
     .page-main 是 overflow:hidden，项目一多下半截就没有出路 —— 菜单自己滚。 */
  #projMenu { padding: var(--sp-8); max-height: 60vh; overflow-y: auto; }
  .pm-head { font-size: var(--fs-11); color: var(--sub); padding: var(--sp-8) var(--sp-8) var(--sp-4); }
  .pm-row { display: flex; align-items: center; gap: var(--sp-8); padding: var(--sp-4) var(--sp-8); border-radius: var(--radius-4); cursor: pointer;
    margin-bottom: var(--sp-4); font-size: var(--fs-13); border: var(--hair) solid transparent; border-left: var(--hair-3) solid transparent; }
  .pm-row:hover { background: var(--panel2); }
  .pm-row.sel { background: var(--acc-tint-10); border-color: var(--line); border-left: var(--hair-3) solid var(--acc); }
  .pm-name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pm-cnt { color: var(--sub); font-size: var(--fs-11); }
  .pm-ops { display: flex; align-items: center; gap: var(--sp-2); flex: 0 0 auto; visibility: hidden; }
  .pm-row:hover .pm-ops, .pm-row.sel .pm-ops { visibility: visible; }
  .pm-btn { display: inline-flex; align-items: center; justify-content: center; height: 22px; min-width: 22px;
    padding: 0 var(--sp-4); border: var(--hair) solid var(--line); border-radius: var(--radius-4); background: none; color: var(--sub);
    font-size: var(--fs-11); line-height: 1; cursor: pointer; transition: all var(--dur-120); }
  .pm-btn:hover { border-color: var(--acc); color: var(--acc); }
  .pm-btn.danger:hover { border-color: var(--err); color: var(--err); }
  .pm-add { margin-top: var(--sp-4); padding-top: var(--sp-8); border-top: var(--hair) solid var(--line); font-size: var(--fs-13);
    color: var(--acc); padding: var(--sp-8) var(--sp-8) var(--sp-4); border-radius: var(--radius-4); cursor: pointer; }
  .pm-add:hover { background: var(--panel2); }
  /* 项目文件：菜单底部**默认折叠**的一组入口。标题行是这一组的「头」（小字、次级色），
     摊开的内容整组缩进一条竖线里 —— 一眼看出这几行长在「项目文件 · 导入 / 导出」下面，
     而不是与上面那串短片行同级。行内文字用正文色而不是强调色：它只是菜单里的一段，
     不需要像主按钮那样抢眼。
     单起一类，不复用 .pm-add —— 那边「＋ 新建项目组」是按 .pm-add 找出来点的。 */
  .pm-io-box { margin-top: var(--sp-8); padding-top: var(--sp-4); border-top: var(--hair) solid var(--line); }
  .pm-io-toggle { display: flex; align-items: center; gap: var(--sp-8); padding: var(--sp-8);
    border-radius: var(--radius-4); font-size: var(--fs-12); color: var(--sub); cursor: pointer; }
  .pm-io-toggle:hover { background: var(--panel2); color: var(--txt); }
  .pm-io-toggle svg, .pm-io svg { flex: 0 0 auto; width: var(--sz-ico); height: var(--sz-ico); }
  /* 摊开那一组的边界：左侧一条竖线 + 缩进。它就是「这几行属于上面那行」的那条边。 */
  .pm-io-body { margin: 0 0 var(--sp-4) var(--sp-8); padding-left: var(--sp-8);
    border-left: var(--hair-2) solid var(--line); }
  .pm-io { display: flex; align-items: center; gap: var(--sp-8); padding: var(--sp-8);
    border-radius: var(--radius-4); font-size: var(--fs-13); color: var(--txt); cursor: pointer; }
  .pm-io:hover { background: var(--panel2); }
  .pm-io-name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pm-io-hint { color: var(--sub); font-size: var(--fs-11); white-space: nowrap;
    max-width: 48%; overflow: hidden; text-overflow: ellipsis; }
  /* 拆分按钮：整行仍是同样的内边距与字号，所以和「导入项目文件」一样高；
     行尾那半格**撑满整行高**（自成一个热区），用一条竖细线分开，悬停只亮它自己。 */
  .pm-io-split { padding: 0; align-items: stretch; }
  .pm-io-split:hover { background: none; }
  .pm-io-main { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: var(--sp-8);
    padding: var(--sp-8); border-radius: var(--radius-4) 0 0 var(--radius-4); }
  .pm-io-main:hover { background: var(--panel2); }
  .pm-io-more { flex: 0 0 auto; display: flex; align-items: center; padding: 0 var(--sp-8) 0 var(--sp-4);
    border-left: var(--hair) solid var(--line); border-radius: 0 var(--radius-4) var(--radius-4) 0; color: var(--sub); }
  .pm-io-more:hover { background: var(--panel2); color: var(--txt); }
  .pm-io-more[aria-expanded="true"] { color: var(--txt); }
  .pm-io-more[aria-expanded="true"] svg { transform: rotate(180deg); }
  /* 拆分按钮摊开的次级：再缩进一格 + 左侧细线。不挂 absolute 浮层 —— #projMenu 自己是
     max-height 的滚动容器，浮层会被裁掉；缩进的一行跟着菜单一起滚。 */
  .pm-io-sub { margin: 0 0 var(--sp-4) var(--sp-8); padding-left: var(--sp-8);
    border-left: var(--hair) solid var(--line); }
  /* 当前短片没归组时的「按项目组导出」：位置留着，但点不动，一眼看出是没范围可导。 */
  .pm-io-off { color: var(--sub); opacity: .6; cursor: default; }
  .pm-io-off:hover { background: none; }
  /* 项目组头：组名 + 几部短片 + 改名 / 删组。组里的短片在下面缩进一格。
     「未分组」那一档没有组操作（它不是组，只是没归组的那些）。 */
  .pm-group { display: flex; align-items: center; gap: var(--sp-8); padding: var(--sp-8) var(--sp-8) var(--sp-4); margin-top: var(--sp-4);
    font-size: var(--fs-12); color: var(--sub); border-top: var(--hair) solid var(--line); cursor: pointer; }
  .pm-group:first-of-type { margin-top: 0; border-top: none; }
  .pm-group.none { color: var(--sub); opacity: .85; }
  .pm-gname { color: var(--txt); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pm-group.none .pm-gname { font-weight: 400; }
  .pm-group .pm-ops { visibility: hidden; }
  .pm-group:hover .pm-ops { visibility: visible; }
  /* 项目组可展开 / 收起：收起时不画组内短片行，组头与条数仍在。 */
  .pm-gfold { display: inline-flex; align-items: center; justify-content: center; width: var(--sp-16); height: var(--sp-16);
    padding: 0; border: 0; border-radius: var(--radius-4); background: none; color: var(--sub); cursor: pointer; }
  .pm-gfold:hover { background: var(--panel2); color: var(--acc); }
  .pm-gfold svg { width: var(--sz-ico); height: var(--sz-ico); }
  .pm-group.folded .pm-gname { color: var(--sub); }
  /* 组里的每一部短片都缩进一格，让「谁属于哪一组」一眼看得出来。 */
  .pm-row.pm-in-group { margin-left: var(--sp-8); border-left: var(--hair-2) solid var(--line); }
  /* 就地改名：名称那一格当场换成输入框 + 保存 / 取消（Enter 保存 · Esc 收回），不弹表单窗
     —— 与素材页「新建组」那一行同一副画法。 */
  .pm-edit { flex: 1 1 auto; width: 100%; min-width: 0; box-sizing: border-box; height: var(--sz-ctl-sm);
    padding: 0 var(--sp-8); border: var(--hair) solid var(--acc-line-32); border-radius: var(--radius-4);
    background: var(--input); color: var(--txt); font-size: var(--fs-13); font-family: inherit; }
  .pm-edit:focus { outline: none; box-shadow: var(--focus-shadow); }
  /* 就地移组：点「文件夹」在那一行下面摊开一个下拉（公共 Dropdowns），选一处就归位。 */
  .pm-move { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-8);
    margin: calc(-1 * var(--sp-2)) 0 var(--sp-4) var(--sp-8); padding: var(--sp-4) var(--sp-8);
    border: var(--hair) solid var(--line); border-radius: var(--radius-4); background: var(--panel2); }
  .pm-move .dd { flex: 1 1 140px; min-width: 0; }
  /* 改组名之后对素材库那一组的追问：写在原位，点完就收（它不是第二份数据，只是同一件事的另一半）。
     墨用 `--warn` 压在自己那枚不透明淡底上 —— 说明条不是正文，别用 `--txt`。 */
  .pm-note { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-8); color: var(--warn);
    margin: var(--sp-4) 0 var(--sp-4) var(--sp-8); padding: var(--sp-4) var(--sp-8);
    border-left: var(--hair-3) solid var(--warn); border-radius: var(--radius-4);
    background: var(--warn-tint); font-size: var(--fs-12); }
  /* 新建项目组的草稿行：填名字 + 建组 / 取消，都在菜单里（占的正是「＋ 新建项目组」那一格）。 */
  .pm-newg { display: flex; align-items: center; gap: var(--sp-4);
    margin-top: var(--sp-4); padding: var(--sp-8) var(--sp-8) var(--sp-4); border-top: var(--hair) solid var(--line); }
  /* 就地二次确认（公共 Confirm.arm）把图标换成一句话：那颗格子得容得下文字。
     武装期间鼠标一挪开就自动还原，所以整行的操作列在这时候保持可见，不让它跟着 hover 收起。 */
  .pm-btn.armed { min-width: 0; width: auto; padding: 0 var(--sp-8); white-space: nowrap; }
  .pm-row:has(.armed) .pm-ops, .pm-group:has(.armed) .pm-ops { visibility: visible; }

  .left-head { display: flex; align-items: center; gap: var(--sp-8); padding: var(--sp-12) var(--sp-16); border-bottom: var(--hair) solid var(--line); }
  .left-head b { font-size: var(--fs-14); }
  .left-head { flex-wrap: wrap; }
  .left-head > b { flex: 0 0 auto; font-size: var(--fs-13); white-space: nowrap; }
  .left-head .script-btn { flex: 1 1 0; min-width: 0; height: 28px; box-sizing: border-box;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: var(--fs-12); line-height: 1; color: var(--acc); background: var(--acc-tint-10);
    border: 0; border-radius: var(--radius-4); padding: 0 var(--sp-8); cursor: pointer;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: background var(--dur-120); }
  .left-head .script-btn:hover { background: var(--sel-bg); }
  /* 「剧本」是次级入口：与「拆分镜」并排，但只占自己那份宽度（左栏最窄时两枚会换行，不挤没字） */
  .left-head .script-btn.sec { flex: 0 0 auto; color: var(--sub); background: transparent;
    border: var(--hair) solid var(--line); }
  .left-head .script-btn.sec:hover { color: var(--acc); border-color: var(--acc); background: var(--acc-tint-10); }
  .scene-block { padding: var(--sp-8) var(--sp-8) var(--sp-4); }
  /* 场景之间靠留白分区（照参考图，不画分隔线） */
  .scene-block + .scene-block { margin-top: var(--sp-8); padding-top: var(--sp-8); }
  .scene-head { display: flex; align-items: center; gap: var(--sp-4); margin-bottom: var(--sp-8); }
  /* min-width:0 是关键：input 默认宽度会把整列顶出横向滚动条 */
  .scene-head input { flex: 1; min-width: 0; background: transparent; border: var(--hair) solid transparent; border-radius: var(--radius-4);
    color: var(--txt); font-size: var(--fs-13); font-weight: 600; padding: var(--sp-4) var(--sp-8); }
  .scene-head input:hover, .scene-head input:focus { border-color: var(--line); background: var(--input); outline: none; }
  .scene-head .sc-cnt { flex: 0 0 auto; font-size: var(--fs-11); color: var(--sub); font-variant-numeric: tabular-nums; }
  /* 场景头按钮：纯图标，无边框无底色（悬停才浮出淡底），删除用垃圾桶 */
  .scene-head .icon-btn { flex: 0 0 auto; width: 26px; height: 26px; display: inline-flex; align-items: center; justify-content: center;
    border: 0; border-radius: var(--radius-4); background: none; color: var(--sub); cursor: pointer; font-size: var(--fs-14); line-height: 1;
    transition: background var(--dur-120), color var(--dur-120); }
  .scene-head .icon-btn:hover { background: var(--panel2); color: var(--acc); }
  .scene-head .icon-btn.del:hover { background: var(--err-tint); color: var(--err); }
  /* 武装后的红底 + 掏出来的墨由公共的 `.armed`（带 !important）画；这里只剩几何：
     图标按钮要撑成「真删?」那一小条，所以放开定宽。 */
  .scene-head .icon-btn.armed { width: auto; padding: 0 var(--sp-8); font-size: var(--fs-11); }
  /* 场景图那一格：与旁边的图标按钮同宽同高，有图时是一张 24×24 的方图。
     position:relative 是给右上角那颗 × 用的（它绝对定位在这一格里面，不另占布局）。 */
  .scene-head .sc-thumb { position: relative; flex: 0 0 auto; width: 26px; height: 26px; padding: 0; overflow: hidden;
    display: inline-flex; align-items: center; justify-content: center; border: var(--hair) dashed var(--line); border-radius: var(--radius-4);
    background: none; color: var(--sub); cursor: pointer; transition: border-color var(--dur-120), background var(--dur-120); }
  .scene-head .sc-thumb:hover { border-color: var(--acc); color: var(--acc); background: var(--panel2); }
  .scene-head .sc-thumb:not(.none) { border-style: solid; }
  .scene-head .sc-thumb .sp { width: 100%; height: 100%; object-fit: cover; display: block; }
  /* × 平时不占视觉（只有悬停才浮出来）—— 常驻的话每一行右上角都挂一个红叉，左栏会变成一片叉 */
  .scene-head .sc-thumb .sp-x { position: absolute; right: var(--sp-2); top: var(--sp-2); width: 14px; height: 14px; border-radius: var(--radius-4);
    display: none; align-items: center; justify-content: center; background: color-mix(in srgb, var(--media-bg) var(--a-60), transparent); color: var(--on-acc); cursor: pointer; }
  .scene-head .sc-thumb:hover .sp-x { display: inline-flex; }
  .scene-head .sc-thumb .sp-x .ic { line-height: 0; }
  .shot-item { display: flex; align-items: center; gap: var(--sp-8); padding: var(--sp-4) var(--sp-8) var(--sp-4) var(--sp-16); height: 54px; box-sizing: border-box;
    border-radius: var(--radius-4); cursor: pointer; margin-bottom: var(--sp-4); position: relative; }
  .shot-item:hover { background: var(--panel2); }
  /* 选中：淡紫底从左侧竖条之后才开始铺，圆角不裹住竖条 */
  .shot-item.sel, .shot-item.sel:hover { background: linear-gradient(to right, transparent 0 12px, var(--sel-bg) 12px); }
  /* 独立的选中竖条（自己的圆角，不与行背景连成一体） */
  .shot-item.sel::before { content: ''; position: absolute; left: var(--sp-4); top: var(--sp-8); bottom: var(--sp-8); width: 4px;
    border-radius: var(--radius-4); background: var(--acc); }
  .shot-item .num { font-size: var(--fs-12); font-weight: 600; color: var(--txt); opacity: .62; width: 17px; flex: 0 0 17px; text-align: center;
    font-variant-numeric: tabular-nums; }
  /* 方形缩略图：46×46；内容按原比例完整放进框里（不裁切）；出画后才用黑底留白 */
  .shot-item .sthumb-wrap { position: relative; flex: 0 0 46px; width: 46px; height: 46px; border-radius: var(--radius-4); overflow: hidden; }
  .shot-item .sthumb { width: 46px; height: 46px; min-height: 46px; max-height: 46px; border-radius: var(--radius-4);
    background: transparent; object-fit: contain; display: block; overflow: hidden; }
  /* 出画前 / 没有画面：一块纯灰底（不放图标）；出画后（.ready）才露黑底做留白 */
  .shot-item .tph { position: absolute; inset: 0; background: var(--thumbbg); }
  .shot-item .sthumb-wrap.ready .tph { display: none; }
  .shot-item .sthumb-wrap.ready .sthumb:not(.empty) { background: var(--media-bg); }
  /* 没有画面的镜头：一块纯灰底（不显示图标）
     注意：ui.css 里有个全局 .empty{padding: var(--sp-64) 0}，这里必须 padding:0 覆盖掉 */
  .shot-item .sthumb.empty { display: block; padding: 0; background: var(--thumbbg) !important; }
  .shot-item .pbar { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: color-mix(in srgb, var(--media-bg) var(--a-35), transparent); }
  .shot-item .pbar i { display: block; height: 100%; background: var(--acc); transition: width var(--dur-280); }
  .shot-item .sinfo { flex: 1; min-width: 0; }
  .shot-item .sname { font-size: var(--fs-13); font-weight: 600; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .shot-item .smeta { font-size: var(--fs-11); line-height: 1.35; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .shot-item .smeta .okc { color: var(--ok); }
  .shot-item .smeta .runc { color: var(--warn); }
  .shot-item .smeta .errc { color: var(--err); }
  /* 操作按钮：悬停时浮在行尾的小托盘里（不占布局、不是白底）。
     托盘与图标都走主题色：以前这排行是**深底作用域**，托盘另配了一套深浅两档的固定色；
     现在轨道跟着主题走，托盘就用面板色（悬停那一行本身是 --panel2，托盘压在它上面分得开）。 */
  .shot-item .ops { display: flex; gap: var(--sp-2); position: absolute; right: var(--sp-8); top: 50%; transform: translateY(-50%);
    padding: var(--sp-4); border-radius: var(--radius-4); visibility: hidden; background: var(--panel); }
  .shot-item:hover .ops { visibility: visible; }
  .shot-item .ops .op-btn { width: 23px; height: 23px; min-width: 23px; padding: 0; border: 0; background: none;
    border-radius: var(--radius-4); color: var(--sub); font-size: var(--fs-12); line-height: 1; }
  .shot-item .ops .op-btn:hover { color: var(--acc); background: var(--sel-bg); }
  .shot-item .ops .op-btn.danger:hover { color: var(--err); background: var(--err-tint); }
  /* 拖动：只有被拖动的那一行有阴影/高亮；投放位置只画一条细插入线 */
  /* 助手写完 / 点「定位」时闪两下：告诉用户「就是这一格」，不改变选中与视图。 */
  @keyframes shotFlash { 0%, 100% { box-shadow: inset 0 0 0 0 transparent; } 30% { box-shadow: inset 0 0 0 var(--hair-2) var(--acc); } }
  /* 助手执行 / 定位那一下的「闪」：轨道上的块亮两下，不移动视图。
     类由 engine/timeline.js 的 flashBlocks 按到期时刻补进重画（直接加在节点上会被重画换掉）。 */
  @keyframes tlBlockFlash { 0%, 100% { box-shadow: inset 0 0 0 0 transparent; } 30% { box-shadow: inset 0 0 0 var(--hair-2) var(--acc); } }
  .tl-board .tl-clip.flash, .tl-board .tl-voice.flash, .tl-board .tl-cap.flash { animation: tlBlockFlash var(--dur-1200) ease-out 2; }
  /* 拖动画面段：被拖的那一块淡下去（手指底下换成跟手的浮层），其余块「让位」时有过渡 ——
     以前每跨过一格是瞬间跳一下，看不出「把别人挤开」这件事。 */
  .tl-board .tl-clip.is-dragged { z-index: 8; opacity: .55; }
  .tl-board.is-dragging .tl-clip:not(.is-dragged) { transition: left var(--dur-120) ease, width var(--dur-120) ease; }
  /* 拖动浮层：这一段的胶片条原样搬过来跟着手指（元素由 engine/edit.js 现建现删）。 */
  .tl-drag-ghost { position: fixed; z-index: 120; height: 56px; pointer-events: none; overflow: hidden;
    border-radius: var(--radius-4); border: var(--hair-2) solid var(--acc); background: var(--media-bg);
    box-shadow: var(--shadow-4); opacity: .94; }
  .tl-drag-ghost .tl-strip { position: absolute; inset: 0; display: flex; overflow: hidden; }
  .tl-drag-ghost .tl-strip i { flex: 0 0 var(--cell); height: 100%; background-size: cover; background-position: center; }
  .tl-drag-ghost .tl-strip i.gap { background-color: var(--panel2); }
  .tl-drag-ghost i.ph { display: block; height: 100%; background: var(--panel2); }
  .shot-item.flash { animation: shotFlash var(--dur-1200) ease-out 2; }
  .shot-item.dragging { opacity: .92; background: var(--panel);
    box-shadow: 0 0 0 var(--hair) var(--acc), 0 10px 26px color-mix(in srgb, var(--media-bg) var(--a-18), transparent); position: relative; z-index: 5; }
  .shot-item.drag-over { box-shadow: inset 0 2px 0 0 var(--acc); }
  .shot-item[draggable="true"] { cursor: grab; }
  .add-scene { margin: var(--sp-8) var(--sp-12); width: calc(100% - 24px); padding: var(--sp-8); text-align: center; border: var(--hair) dashed var(--line);
    border-radius: var(--radius-4); color: var(--sub); font-size: var(--fs-13); cursor: pointer; background: none; }
  .add-scene:hover { color: var(--acc); border-color: var(--acc); }
  /* 剪辑态左栏：**分镜列表留着**（剪的时候也要能换镜），但那份列表只列**已选用候选**的镜头；
     生成态那几颗（剧本 / 拆分镜 / 加一个场景 / 生成全部分镜）一律让位 ——
     剪辑态左栏答的是「这一镜剪到哪了」，不是「下一批生成什么」（用户点名）。
     「导入视频 / 素材」是项目级动作，留着。
     ⚠ 场景头与镜头行里的那几颗（场景图 / 新建镜头 / 删除场景 / 抓手·复制·删除）是
     **JS 里就不画**（见 engine.js 的 renderScenes），不靠这条 CSS 藏 ——
     藏起来但处理器还绑着，就是「点不动的那颗按钮」。
     历史编辑记录收成**底部一块折叠区**（原生 details：不用 JS、不用额外状态）。
     以前整列换成「历史 + 素材」—— 左栏在两态里答的是两个完全不同的问题，
     剪辑时想换一镜都找不到列表（用户点名：左右栏功能区分）。 */
  .col-left.editing > .add-scene, .col-left.editing > .gen-all { display: none; }
  .col-left.editing .left-head #scriptEditBtn, .col-left.editing .left-head #scriptBtn { display: none; }
  #editLeft { display: none; }
  .col-left.editing > #editLeft { display: block; flex: 0 0 auto; max-height: 42%; overflow-y: auto; overflow-x: hidden;
    border-top: var(--hair) solid var(--line); background: var(--panel2); }
  #editLeft .el-hist { display: block; }
  #editLeft .el-hist > summary { display: flex; align-items: center; gap: var(--sp-8); cursor: pointer;
    padding: var(--sp-8) var(--sp-12); font-size: var(--fs-13); color: var(--sub); font-weight: 600;
    list-style: none; user-select: none; }
  #editLeft .el-hist > summary::-webkit-details-marker { display: none; }
  #editLeft .el-hist > summary::before { content: "▸"; font-size: var(--fs-11); color: var(--sub); transition: transform var(--dur-180); }
  #editLeft .el-hist[open] > summary::before { transform: rotate(90deg); }
  #editLeft .el-hist > summary:hover { color: var(--txt); }
  #editLeft .el-hist .hn { flex: 1 1 auto; }
  #editLeft .el-hist .n { font-weight: 400; color: var(--sub); }
  #editLeft .el-hist .el-body { padding: 0 var(--sp-12) var(--sp-12); }
  .hist-list { display: flex; flex-direction: column; gap: var(--sp-4); }
  .hist-row { display: flex; align-items: center; gap: var(--sp-8); padding: var(--sp-4) var(--sp-8);
    border: var(--hair) solid var(--line); border-radius: var(--radius-4); background: var(--input);
    cursor: pointer; font-size: var(--fs-12); text-align: left; }
  .hist-row:hover { border-color: var(--acc); }
  /* 「当前生效的那一版」点亮 + 左边一道强调色（日志里一眼看出指针停在哪）。
     `.mark` 是流水记录（回退 / 重做）—— 它们也是一条记录，只是名字前面带一枚小标。 */
  .hist-row.now { border-color: var(--acc); background: var(--sel-bg); }
  .hist-row .hk { flex: none; font-size: var(--fs-11); color: var(--sub); padding: 0 var(--sp-4);
    border: var(--hair) solid var(--line); border-radius: var(--radius-4); }
  .hist-row.now .hk { color: var(--acc); border-color: var(--acc); }
  .hist-row.branch .hn { color: var(--sub); }
  .hist-row .hn { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hist-row .ht { flex: none; font-size: var(--fs-11); color: var(--sub); font-variant-numeric: tabular-nums; }
  .hist-empty { font-size: var(--fs-12); color: var(--sub); padding: var(--sp-8) var(--sp-2); line-height: 1.6; }
  #editLeft .hint { margin-top: 0; }
  .gen-all { margin-top: auto; padding: var(--sp-12); border-top: var(--hair) solid var(--line); }
  .gen-all button { width: 100%; padding: var(--sp-12); font-size: var(--fs-14); }
  /* 状态区只有一条进度条（填充 = 已完成 / 全部），不写文案；空态与常态的面板高度同一份。
     flex 收住子项的 margin：否则条收起时 9px 外边距跟着消失，面板会矮一截。 */
  .gen-all .gen-all-status { display: flex; align-items: flex-end; height: calc(var(--sp-8) + var(--sp-16)); }
  .gen-all .gen-all-prog { display: flex; align-items: center; width: 100%; height: var(--sp-16); }
  .gen-all .gen-all-prog[hidden] { display: none; }
  .gen-all .gen-all-prog > i { flex: 1 1 auto; height: var(--sp-4); border-radius: var(--radius-4);
    background: var(--panel2); border: var(--hair) solid var(--line); overflow: hidden; }
  .gen-all .gen-all-prog > i > b { display: block; height: 100%; width: 0; background: var(--acc);
    transition: width var(--dur-280); }

  /* 中栏 */
  .mid-head { display: flex; align-items: center; gap: var(--sp-8); padding: var(--sp-12) var(--sp-16); border-bottom: var(--hair) solid var(--line); flex-wrap: wrap; }
  .mid-head .no { font-size: var(--fs-16); font-weight: 700; color: var(--acc); flex: 0 0 auto; }
  .mid-head input.sname { background: transparent; border: var(--hair) solid transparent; border-radius: var(--radius-4); color: var(--txt); font-size: var(--fs-14); font-weight: 600; padding: var(--sp-4) var(--sp-8); flex: 0 1 150px; min-width: 90px; }
  .mid-head input.sname:hover, .mid-head input.sname:focus { border-color: var(--line); background: var(--input); outline: none; }
  /* 一行放不下就整体换行：meta 保持可读宽度（早前被挤成竖排单字），按钮不换行不压缩 */
  .mid-head .meta { color: var(--sub); font-size: var(--fs-12); flex: 1 1 150px; min-width: 90px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mid-head .sp { flex: 0 0 2px; }
  .mid-head button { flex: 0 0 auto; white-space: nowrap; }
  .player-wrap { padding: var(--sp-16) var(--sp-16) var(--sp-8); position: relative; }
  /* 播放区：**固定的标准横屏 16:9**（2026-10 用户点名）。
     宽按高算（`calc(56vh * 16 / 9)`）并居中 —— 左右栏与下栏（轨道坞）拖动时它一个像素不动；
     以前 `width:100%` 跟着列宽走，拖一下栏预览就跟着变形。
     画面本身的真实宽高另有一枚角标（.arbadge，写的是这一镜的尺寸），竖屏素材在框里留黑边
     （object-fit: contain），比例尺永远是 16:9。剪辑态 / 生成态吃同一条规则，切换时视频栏不动。 */
  .player-box { position: relative; width: calc(56vh * 16 / 9); max-width: 100%; margin: 0 auto; }
  /* 自制播放控件：只保留播放 / 暂停，时间跳转请在「剪辑」里插针 */
  .player-box video { width: 100%; height: auto; aspect-ratio: 16 / 9; max-height: 56vh; border-radius: var(--radius-4);
    background: var(--media-bg); display: block; object-fit: contain; cursor: pointer; }
  /* 剪辑态「无感播放」的两个甲板叠在一起（见 TlPlay）：
     前面那个（不带 .back）撑着整个盒子的高度并可见，后面那个叠在它上面、透明、不接点击，
     用来提前把下一段加载并定到入点 —— 换段时只是把 .back 换个人戴，接缝上看不出换了素材。
     .back 是绝对定位的替换元素：宽高交还给盒子（inset:0 + 100%），跟主甲板共用
     前面那一个由 aspect-ratio 撑出来的同一块高度，不用自己的内在尺寸。 */
  .player-box video.back { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; pointer-events: none; }
  /* 黑场（画面被删掉的那一格）在预览里走的那几秒：甲板没有素材，就把当前那一帧压成纯黑。
     不用 `visibility:hidden` —— 那会把 16:9 的盒子一起收掉，画面当场塌一下再弹回来。 */
  .player-box video.blackout { filter: brightness(0); }
  /* 图片段（静止画面）那一层：走到图片时盖住两个甲板（甲板此刻压黑）。
     画幅与 `video` 同一条（16:9 盒子由视频甲板撑起来），图片按 contain 居中；没打开时完全不占位。 */
  .player-box .player-still { display: none; position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: contain; background: var(--media-bg); border-radius: var(--radius-4); z-index: 1; cursor: pointer; }
  .player-box .player-still.on { display: block; }
  /* 转场层：播放头进入段尾那一小段窗口才盖上来，`--transition-progress` 从 0 走到 1。
     九种预设各是一条效果（淡入 / 闪白 / 左推 / 上推 / 中间分开 / 缩放 / 模糊 / …）；
     层里放的是下一段的媒体元素，播完这段窗口就整层撤掉。 */
  .preview-transition-layer { position: absolute; inset: 0; z-index: 2; overflow: hidden; border-radius: var(--radius-4);
    opacity: var(--transition-progress); pointer-events: none; }
  .preview-transition-layer[hidden] { display: none; }
  .preview-transition-layer img,
  .preview-transition-layer video { width: 100%; height: 100%; display: block; object-fit: contain; background: var(--media-bg); }
  .preview-transition-layer.type-wipe-left { clip-path: inset(0 0 0 calc((1 - var(--transition-progress)) * 100%)); opacity: 1; }
  .preview-transition-layer.type-wipe-up { clip-path: inset(calc((1 - var(--transition-progress)) * 100%) 0 0); opacity: 1; }
  .preview-transition-layer.type-split { clip-path: inset(0 calc((1 - var(--transition-progress)) * 50%)); opacity: 1; }
  .preview-transition-layer.type-zoom img,
  .preview-transition-layer.type-zoom video { transform: scale(calc(1.12 - var(--transition-progress) * .12)); }
  .preview-transition-layer.type-blur img,
  .preview-transition-layer.type-blur video { filter: blur(calc((1 - var(--transition-progress)) * var(--sp-12))); }
  .preview-transition-layer.type-flash i { position: absolute; inset: 0; opacity: .7; background: var(--on-acc); }
  /* 播放器那一排：按钮的尺寸与「svg 在不在圆心」只在这里定一份。
     原来是 `line-height: 40px; text-align: center` —— 那套**只对文字有效**：
     按钮里塞的是 `<svg>`（`icon()` 出的一层 `.ic`），基线一掉就把图标拽到圆心下方，
     用户点名的「播放 / 暂停 / 声音那颗按钮的 svg 没在中心」就是这个。
     改成 flex 居中并把 padding 归零；`flex: none` 别让时间在窄屏时把圆按钮压扁。
     hover 不再 `scale(1.06)`：鼠标划过就弹大一下，一整排在抖（用户点名）。
     尺寸 32px：播放/暂停、声音、全屏三颗**同一个大小**，比原来的 40px 小一档。 */
  .pb-btn { width: 32px; height: 32px; flex: none; border: 0; border-radius: 50%; padding: 0;
    background: color-mix(in srgb, var(--media-bg) var(--a-55), transparent); color: var(--on-acc); cursor: pointer;
    display: flex; align-items: center; justify-content: center; transition: background var(--dur-120); }
  .pb-btn:hover { background: color-mix(in srgb, var(--media-bg) var(--a-72), transparent); }
  /* 播放器浮层（横贯画面下方的一条）：
     左下 = 播放/暂停 + 时长读数；右下 = 声音 + 全屏（**两颗挨着，全屏在最右下角**，用户点名）。
     中间那根 `.sp` 把两边撑开，所以两种播放器共用同一条、同一份标记（`pbBarHTML`）。 */
  .pb-bar { position: absolute; left: var(--sp-12); right: var(--sp-12); bottom: var(--sp-12); z-index: 4; display: flex; align-items: center; gap: var(--sp-8); }
  .pb-bar .sp { flex: 1 1 auto; }
  .pb-time { background: color-mix(in srgb, var(--media-bg) var(--a-55), transparent); color: var(--on-acc); font-size: var(--fs-12); padding: var(--sp-4) var(--sp-8); border-radius: var(--radius-6);
    font-variant-numeric: tabular-nums; letter-spacing: .3px; white-space: nowrap; }
  /* 右上角那一格只写**画面尺寸**（剪辑时与不剪辑时同一个样子，见 updateArBadge） */
  .player-wrap .arbadge { position: absolute; right: var(--sp-32); top: var(--sp-24); z-index: 4; background: color-mix(in srgb, var(--media-bg) var(--a-60), transparent); color: var(--on-acc); font-size: var(--fs-11); padding: var(--sp-2) var(--sp-8); border-radius: var(--radius-4); }
  /* 全屏：进 `:fullscreen` 的是整块 `.player-box`（见 bindPbFull 那四个落点）。
     UA 只把**这一个盒子**撑满视口并铺黑底，它管不到盒子里的子元素 —— 而上面那条 `.player-box video`
     带着 `height: clamp(…)` 的定高，
     于是全屏里看到的是「一整块黑屏，顶上挂着一条几百像素高的画面，剩下全是黑的」，
     比例尺那 4px 圆角也贴在屏幕角上。
     这一档把画幅交回 `object-fit: contain`（本来就是它 —— 黑边居中），尺寸闸整条放开；
     剪辑态那两个甲板叠在左上角（`video.back` 绝对定位），铺满之后仍然严丝合缝。
     特异度 (0,2,1) 高于两条媒体查询里的 `.player-box video` (0,1,1)，所以那一档的 `max-height`
     在全屏下不会反过来压制这一条。 */
  .player-box:fullscreen { background: var(--media-bg); }
  .player-box:fullscreen video { width: 100%; height: 100%; max-height: none; border-radius: 0; }
  .player-box:fullscreen .player-still { border-radius: 0; }
  .player-empty { width: calc(56vh * 16 / 9); max-width: 100%; aspect-ratio: 16 / 9; max-height: 56vh; background: var(--input);
    border-radius: var(--radius-4); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--sp-8); }
  .player-empty .pe-ic { font-size: var(--fs-42); opacity: .5; }
  .player-empty .pe-t { font-size: var(--fs-16); font-weight: 700; color: var(--txt); }
  .player-empty .pe-d { font-size: var(--fs-13); color: var(--sub); }
  .player-empty .pe-task { margin-top: var(--sp-16); width: min(460px, 86%); display: flex; flex-direction: column; gap: var(--sp-8); }
  .player-empty .pe-row { display: flex; flex-wrap: wrap; gap: var(--sp-8) var(--sp-8); font-size: var(--fs-12); color: var(--txt);
    background: var(--panel2); border: var(--hair) solid var(--line); border-radius: var(--radius-4); padding: var(--sp-8) var(--sp-8); text-align: left; }
  .player-empty .pe-row .k { color: var(--sub); }
  .player-empty .pe-row .v { margin-right: var(--sp-8); font-variant-numeric: tabular-nums; }
  .cand-thumb.addcand { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--sp-4);
    height: 74px; border: var(--hair-1-5) dashed var(--line); color: var(--sub); background: none; }
  .cand-thumb.addcand:hover { border-color: var(--acc); color: var(--acc); }
  .cand-thumb.addcand.big { width: 168px; height: 84px; }
  .cand-thumb.addcand .plusic { display: flex; }
  .cand-thumb.addcand .pt { font-size: var(--fs-12); }
  .cand-thumb.addcand .pd { font-size: var(--fs-11); opacity: .8; }
  /* 候选条：翻页 / 展开那一簇**浮在右缘**（不再占排版宽度，缩略图能多用掉那一百多像素）。 */
  .cand-strip { position: relative; display: flex; align-items: center; gap: var(--sp-12); padding: var(--sp-8) var(--sp-16); }
  .cand-strip .thumbs { display: flex; gap: var(--sp-8); flex: 1; min-width: 0;
    flex-wrap: nowrap; overflow-x: auto; overflow-y: hidden; padding-bottom: var(--sp-8); }
  /* 展开：换行铺开、瓦片变大，一屏看完所有候选 */
  .cand-strip.expanded { align-items: flex-start; }
  .cand-strip.expanded .thumbs { flex-wrap: wrap; overflow: visible; padding-bottom: 0; }
  /* 展开只是**换行**，卡片尺寸与不展开时一模一样（用户点名）：
     放大卡片会让「展开」看起来像换了一副界面，而它要做的只是把同一排摊成几行。 */
  .cand-strip .thumbs::-webkit-scrollbar { height: 8px; }
  .cand-strip .thumbs::-webkit-scrollbar-thumb { background: var(--line); border-radius: var(--radius-6); }
  .cand-strip .thumbs > * { flex: 0 0 auto; }
  .cand-thumb .candno { position: absolute; left: var(--sp-4); top: var(--sp-4); z-index: 2; min-width: 18px; height: 18px; padding: 0 var(--sp-4);
    display: flex; align-items: center; justify-content: center; border-radius: var(--radius-4); background: color-mix(in srgb, var(--media-bg) var(--a-60), transparent); color: var(--on-acc);
    font-size: var(--fs-11); font-weight: 600; font-variant-numeric: tabular-nums; }
  .cand-pager { display: flex; align-items: center; gap: var(--sp-4); margin-left: auto; flex: 0 0 auto; }
  /* 展开 / 翻条 / 条数收成一簇紧凑图标：以前那颗「展开」带文字、四颗之间各留 8px，
     一条候选条右边被吃掉一百多像素（用户点名占地太多）。现在整簇浮在缩略图右缘，
     两枚箭头夹着「1 / 2」，展开是同一簇最后那一颗。
     底色必须是不透明的 --panel：强制夜间模式那类扩展逐条改写声明，声明里直接写
     color-mix(…, transparent) 解析不了就整条跳过 —— 全页变黑、这一簇还是白的；
     且缩略图从底下滚过，读数也不该由背后的像素决定。 */
  .cand-pager { position: absolute; right: var(--sp-8); top: 50%; transform: translateY(-50%); z-index: 3;
    display: flex; align-items: center; gap: var(--sp-2); margin: 0; padding: var(--sp-2) var(--sp-4);
    border: var(--hair) solid var(--line); border-radius: var(--radius-999);
    background: var(--panel); box-shadow: var(--shadow-1); }
  .cand-pager .ghost { min-width: 24px; padding: 0 var(--sp-4); border: 0; background: none; }
  .cand-pager .ghost:hover { background: var(--input); }
  .cand-pager .cand-count { min-width: 34px; text-align: center; font-size: var(--fs-11); }
  /* 缩略图可以滚到控件底下再出来：给右端留出走位，否则最后一条永远被压住 */
  .cand-strip .thumbs { padding-right: calc(var(--sp-64) * 2); scroll-padding-right: calc(var(--sp-64) * 2); }
  .cand-thumb { position: relative; width: 118px; border-radius: var(--radius-4); overflow: hidden; cursor: pointer; border: var(--hair-2) solid transparent; transition: border-color var(--dur-120), box-shadow var(--dur-120); }
  /* 三档强调色是一条梯度，谁都不盖掉谁：
     hover = 32% 强调描边（鼠标在这儿，但这一条不是答案）
     cur（正在预览的那一条）= 整圈实心强调描边
     sel（选用进成片的那一条）= 同一圈实心描边 + 内一圈强调环 + 右下角那枚实底角标
     以前 hover 与 cur 是同一个数（鼠标一移就看不出哪条在预览），sel 又借时间线轨道
     那枚「就绪」标记绿（`--mark-ready`）—— 「哪一条在用」是选中，不是状态色。 */
  .cand-thumb:hover { border-color: var(--acc-line-32); }
  .cand-thumb.cur { border-color: var(--acc); }
  /* 「已选用」是一枚**角标**（右下角），不是压在画面上的横幅：左上角是序号、右上角是锁，
     三个角各管一件事，谁都不遮别人的脸。
     角标压在视频像素上 → 实底用强调色、墨从实底里掏（`--panel`）：深色档的强调色是浅的，
     白字压上去只有 2.x:1；原先那层 90% 面板色的**透明**淡底等于让「能不能读」由背后那些像素决定。 */
  .cand-thumb.sel { border-color: var(--acc); box-shadow: inset 0 0 0 var(--hair) var(--acc-line-32); }
  .cand-thumb.sel::after { content: "✓ 选用"; position: absolute; right: var(--sp-4); bottom: var(--sp-4); z-index: 2;
    background: var(--acc); color: var(--panel);
    font-size: var(--fs-11); line-height: 14px; padding: 0 var(--sp-4); border-radius: var(--radius-4); font-weight: 600; }
  .cand-thumb .lockbadge { position: absolute; top: var(--sp-4); right: var(--sp-4); z-index: 2; display: flex; align-items: center;
    padding: var(--sp-2); border-radius: var(--radius-4); background: color-mix(in srgb, var(--media-bg) var(--a-50), transparent); color: var(--on-acc); }
  .cand-thumb img, .cand-thumb video { width: 100%; height: 72px; object-fit: contain; display: block; background: transparent; }
  .cand-thumb .tph { position: absolute; left: 0; right: 0; top: 0; height: 72px; background: var(--thumbbg); }
  .cand-thumb.ready .tph { display: none; }
  .cand-thumb.ready img, .cand-thumb.ready video { background: var(--media-bg); }
  .cand-thumb .pending { width: 100%; height: 72px; display: flex; align-items: center; justify-content: center;
    background: var(--input); color: var(--sub); font-size: var(--fs-12); line-height: 1; text-align: center; }
  .cand-thumb .pending.fail { color: var(--err); }
  .cand-thumb .pending.draft { color: var(--acc); border: var(--hair) dashed var(--acc-line-32); background: none; }
  /* 草稿候选：这条候选自己的描述 */
  /* 动作行：左边「导入」，右边「选用 / 取消选用 / 锁定 / 删除」（用户点名把导入挪到这一排）。 */
  .cand-acts { display: flex; align-items: center; gap: var(--sp-8); padding: 0 var(--sp-16) var(--sp-8); }
  .cand-acts .sp { flex: 1 1 auto; }
  /* 尾段容器只当透明包装（display:contents 不生成盒子）：里面的按钮直接参与 .cand-acts
     的 flex 排版，间隔与对齐跟没包之前一模一样；它的存在只为给快路径圈出可整块替换的范围。 */
  .cand-acts .rest { display: contents; }
  /* 取消选用 / 选用是同一格的两面（.faces：grid 同格叠放 + 右对齐）：露出来的那面永远贴着
     锁定，不在用的那面挂 .off（visibility 隐身，宽度照常撑着这一格）——
     这一排随轮询重画，按钮一挪，点下去就落在别的键上。 */
  .cand-acts .faces { display: grid; justify-items: end; }
  .cand-acts .faces > button { grid-area: 1 / 1; }
  .cand-acts .off { visibility: hidden; }
  /* 武装二次确认（这排里只有删除那颗）在这排里保持 .ghost 的 padding：
     默认画法会另改 padding，宽了一格就把左边的锁定 / 选用横推开。 */
  .cand-acts button.armed { padding: var(--sp-4) var(--sp-12); }
  .mid-tools { display: flex; align-items: center; gap: var(--sp-8); padding: var(--sp-4) var(--sp-16) var(--sp-8); flex-wrap: wrap; }
  .mid-tools .ghost { display: inline-flex; align-items: center; gap: var(--sp-4); white-space: nowrap; }
  .mid-tools .total { margin-left: auto; color: var(--sub); font-size: var(--fs-13); }
  .mid-tools .ghost.active { color: var(--acc); border-color: var(--acc); }
  /* 入出点那一行（现在住在**右栏**：剪辑软件里数值编辑归片段检视器，不该压在时间线底下）。
     一行装下：一句说明 + 两个秒数框 + 一颗「应用」+ 一句脚注；窄栏里让它换行，不挤成一团。 */
  .trim-editor { padding: var(--sp-2) 0 var(--sp-8); display: flex; align-items: center; gap: var(--sp-8); font-size: var(--fs-13); color: var(--sub); flex-wrap: wrap; }
  .trim-editor input { width: 64px; padding: var(--sp-4) var(--sp-8); background: var(--input); border: var(--hair) solid var(--line); border-radius: var(--radius-4); color: var(--txt); font-size: var(--fs-13); }
  /* 候选条那排的计数：芯片，不再是一句灰字（「第 1 / 5 条」的数字自己会跳）。 */
  .cand-pager .cand-count { font-size: var(--fs-12); color: var(--sub); font-variant-numeric: tabular-nums;
    padding: var(--sp-4) var(--sp-8); border: var(--hair) solid var(--line); border-radius: var(--radius-6);
    background: var(--input); }
  /* 拖动某一格换顺序时那根「插到这儿」的竖线：只在这一趟拖动里存在，松手就撤。
     画它而不是把格子拖着走 —— 整排在拖动中途重排会把正在拖的那个节点销毁（旧病）。 */
  .tl-drop { position: absolute; top: 0; bottom: 0; width: 3px; border-radius: var(--radius-4); background: var(--acc);
    box-shadow: 0 0 0 var(--hair) color-mix(in srgb, var(--media-bg) var(--a-50), transparent); pointer-events: none; z-index: 9; }
  .tl-drop::before { content: ""; position: absolute; top: calc(-1 * var(--sp-8)); left: calc(-1 * var(--sp-4)); width: 11px; height: 11px;
    border-radius: 50%; background: var(--acc); }
  /* 右栏那三个落点（这一段 / 配音 / 字幕）：开关本体是公共 `.ui-seg`（选中态与显隐由
     paintVcCard 一处翻）。三个词一行放得下（298px 栏宽下每格约 92px），不用再换行。 */
  .vc-tabs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); width: 100%; height: auto;
    margin: var(--sp-8) 0 var(--sp-2); border-radius: var(--radius-6); }
  .vc-tabs[hidden] { display: none; }
  .vc-tabs > button { height: var(--sz-ctl); font-size: var(--fs-12); padding: 0 var(--sp-4);
    overflow: hidden; text-overflow: ellipsis; }
  .vc-tabs > button + button { border-left: 0; }
  /* 预览字幕叠层：`100cqh` 要一个尺寸容器（.sub-wrap），字号才跟着画面高度走。 */
  .sub-wrap { position: absolute; inset: 0; z-index: 3; pointer-events: none; container-type: size; overflow: hidden; border-radius: var(--radius-4); }
  .sub-ov { position: absolute; left: 6%; right: 6%; text-align: center; line-height: 1.28; font-weight: 600; color: var(--on-acc);
    font-size: calc(var(--fs-54) / 1080 * 100cqh);
    text-shadow: 0 2px 6px rgba(0,0,0,.9), 0 0 2px #000; white-space: pre-wrap; }
  .sub-ov-bottom { bottom: 9%; }
  .sub-ov-middle { top: 50%; transform: translateY(-50%); }
  .sub-ov-top { top: 8%; }
  .sub-ov.hl { background: color-mix(in srgb, var(--media-bg) var(--a-55), transparent); border-radius: var(--radius-6); padding: .18em .45em; }
  /* 右栏「字幕」那一列 */
  .sub-list { display: flex; flex-direction: column; gap: var(--sp-8); margin-top: var(--sp-8); max-height: 300px; overflow-y: auto; }
  .sub-row { border: var(--hair) solid var(--line); border-radius: var(--radius-6); background: var(--panel2); padding: var(--sp-4) var(--sp-8); }
  .sub-meta { display: flex; align-items: center; gap: var(--sp-8); font-size: var(--fs-11); color: var(--sub); }
  .sub-tag { flex: none; padding: 0 var(--sp-4); border-radius: var(--radius-4); background: var(--acc-tint-10); color: var(--acc); }
  /* 起止两框：能直接输数的读数（与轨道把手同一份账，subSetTime 一个出口落回源秒）。 */
  .sub-t { width: 58px; font-variant-numeric: tabular-nums; font-size: var(--fs-12); padding: var(--sp-2) var(--sp-4); }
  .sub-unit { color: var(--sub); font-size: var(--fs-11); }
  /* 播放头压着的那一条点亮（capRowHTML 的 is-now）：与轨道上那一排高亮读同一段时间覆盖。 */
  .sub-row.is-now { border-color: var(--acc); background: var(--acc-tint-10); }
  .sub-pos { font-size: var(--fs-11); padding: var(--sp-2) var(--sp-4); }
  .sub-hl { display: inline-flex; align-items: center; gap: var(--sp-2); white-space: nowrap; cursor: pointer; }
  .sub-row [data-cap-del] { margin-left: auto; }
  .sub-ta { width: 100%; margin-top: var(--sp-4); font-size: var(--fs-12); line-height: 1.35; resize: vertical; min-height: 30px; }
  .player-box:fullscreen .sub-wrap { border-radius: 0; }
  /* 音量 / 倍速滑块的壳（卡片里两枚一组：上面那枚管指着的那一个，下面「整轨」那枚管这一排每一条）。
     音量 0–400%（超过 100% 的部分只在成片 / 导出里生效，浏览器给 <video>/<audio> 的音量封顶 1），
     倍速 0.25–4。 */
  .tl-vol { display: inline-flex; align-items: center; gap: var(--sp-4); padding: 0 var(--sp-8) 0 var(--sp-2);
    border-left: var(--hair) solid var(--line); }
  .tl-vol input[type=range] { width: 116px; height: 14px; accent-color: var(--pri); cursor: pointer; }
  .tl-vol .vv { font-size: var(--fs-12); min-width: 42px; text-align: center; font-variant-numeric: tabular-nums; color: var(--sub); }
  .tl-vol.off { opacity: .45; }
  .tl-vol.off input[type=range] { pointer-events: none; cursor: default; }
  /* 右栏那张「这一段 / 这一句」卡：单条的音量与倍速、整轨的音量与倍速、淡入淡出、入出点。
     这些以前挂在轨道上面那一排（`.tl-tools`）里，和那一排剪子挤一行 —— 再加一枚倍速就放不下，
     而「指着谁就改谁的参数」这件事本来就该和右栏那句落点说明在一起（落点 + 参数 = 一件事的两半）。 */
  .tl-adj { margin-top: var(--sp-12); padding: var(--sp-8) var(--sp-12); border: var(--hair) solid var(--line); border-radius: var(--radius-10);
    background: var(--panel2); display: flex; flex-direction: column; gap: var(--sp-8); }
  .tl-adj .adj-row { display: flex; align-items: center; gap: var(--sp-8); }
  .tl-adj .adj-row > .lab { flex: none; font-size: var(--fs-12); color: var(--sub); min-width: 30px; }
  /* 卡片里不复用条上那道左分隔线（`.tl-vol` 自带的 border-left 是给横排那一行分栏用的） */
  .tl-adj .tl-vol { border-left: none; padding: 0; flex: 1; min-width: 0; }
  .tl-adj input[type=range] { flex: 1 1 auto; min-width: 0; max-width: 160px; }
  /* 右栏那几格（paintVcCard 只翻 hidden，节点不销毁）。
     组里沿用的是整张卡那 8px 间隔 —— 不设这一条，倍速与画面轨两行会贴成一格。
     `[hidden]` 必须显式压掉：这一条自己写了 display:flex，浏览器默认的「hidden 就藏起来」会被它盖掉
     （与 ui.css 的 `.tool[hidden]` 同一个坑）。 */
  .tl-adj .grp { display: flex; flex-direction: column; gap: var(--sp-8); }
  .tl-adj .grp[hidden], .ed-body .grp[hidden] { display: none; }
  /* 剪辑右栏「这一条上的配音」那一小列（与轨道上的块是同一批数据，不是第二份账） */
  .vc-list { display: flex; flex-direction: column; gap: var(--sp-4); }
  .vc-row { display: flex; align-items: center; gap: var(--sp-8); font-size: var(--fs-12); padding: var(--sp-4) var(--sp-8);
    border: var(--hair) solid var(--line); border-radius: var(--radius-6); background: var(--input); }
  /* 区块间距的唯一一份：`.grp` 里第一层标题 / 按钮排的落位，页面里不再手写内联 margin。 */
  .ed-body .grp > .ed-label { margin-top: var(--sp-16); }
  .ed-body .grp > .btn-row { margin-top: var(--sp-4); }
  .vc-row b { flex: 0 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 42%; }
  .vc-row span { color: var(--sub); font-size: var(--fs-11); margin-left: auto; white-space: nowrap; }
  /* 剪辑右栏「台词」那一档的两段清单：一行 = 一镜的一句台词（说话人缩略图 / 名字 + 镜号 + 两个时间读数）。
     已生成 / 未生成按这一镜有没有同句配音现判（不是另记一份状态）。
     `.one` 那一格只装当前这一镜的一行：那是写作入口，不该留一条会滚动的空匣子。 */
  .line-list { display: flex; flex-direction: column; gap: var(--sp-4); max-height: 220px; overflow: auto; padding-right: var(--sp-2); }
  .line-list.one { max-height: none; overflow: visible; }
  .line-row { display: flex; align-items: flex-start; gap: var(--sp-8); padding: var(--sp-4) var(--sp-8); border: var(--hair) solid var(--line);
    border-radius: var(--radius-6); background: var(--input); cursor: pointer; min-width: 0; }
  .line-row:hover { border-color: var(--acc); }
  .line-row.on { border-color: color-mix(in srgb, var(--mark-ready) var(--a-55), transparent); background: color-mix(in srgb, var(--mark-ready) var(--a-8), transparent); }
  /* 说话人那一格：素材库里对上就画缩略图，对不上画占位图（名字仍照写，见 lines.js 的 speakerOf） */
  .line-row .lr-thumb { flex: none; width: 34px; height: 34px; border-radius: var(--radius-4); overflow: hidden;
    background: var(--thumbbg); display: flex; align-items: center; justify-content: center; }
  .line-row .lr-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .line-row .lr-ph { display: flex; align-items: center; justify-content: center; color: var(--sub); opacity: .65; }
  .line-row .lr-body { flex: 1 1 auto; min-width: 0; }
  .line-row .lr-top { display: flex; align-items: center; gap: var(--sp-8); font-size: var(--fs-11); min-width: 0; cursor: pointer; }
  /* 两个读数一行摆齐：镜号 + 这一句在成片那一轨上占的那几秒（与轨道上那个斜纹占位同一把尺子 lineSpanAt）。
     数字用等宽字形：拖倍速时那两位一直在变，比例字体会把这一格抖成一跳一跳。 */
  .line-row .lr-when { display: flex; flex-wrap: wrap; gap: var(--sp-8); margin-top: var(--sp-2); font-size: var(--fs-11);
    color: var(--sub); font-variant-numeric: tabular-nums; }
  .line-row .lr-thumb { cursor: pointer; }
  .line-row .lr-ta { width: 100%; margin-top: var(--sp-4); min-height: 26px; resize: vertical;
    font-size: var(--fs-12); line-height: 1.45; }
  /* 说话的人：名字本身就是输入框（不再另挂一条「谁说的」）。
     平时看起来就是那行名字；悬停 / 聚焦才浮出边框，避免每行都像表单。 */
  .line-row .lr-name { flex: 0 1 34%; min-width: 72px; max-width: 150px; height: 22px; margin: 0;
    padding: 0 var(--sp-4); font-size: var(--fs-12); font-weight: 600; color: var(--txt);
    background: transparent; border-color: transparent; }
  .line-row .lr-name:hover { border-color: var(--line); background: var(--input); }
  .line-row .lr-name:focus { border-color: var(--acc); background: var(--input); }
  .line-row .lr-name::placeholder { color: var(--sub); font-weight: 400; }
  .line-row .lr-top em { margin-left: auto; font-style: normal; font-size: var(--fs-11); padding: 0 var(--sp-4);
    border-radius: var(--radius-4); flex: none; }
  .line-row .lr-top em.done { color: var(--sub); background: color-mix(in srgb, var(--pal-gray) var(--a-12), transparent); }
  .line-row .lr-top em.none { color: var(--sub); background: transparent; border: var(--hair) dashed var(--line); }
  /* 剪辑态那一格的状态说明整块已删（镜头统计那一行 + 成片陈旧那句长提示）；
     合并进度条更早那一轮就删了 —— 合成的进度只写在「导出成片」那颗按钮上 */
  /* 顺序模式的镜头缩略图条：每个镜头一张 */
  .shot-strip { display: flex; flex-wrap: wrap; align-content: flex-start; gap: var(--sp-8);
    padding: var(--sp-8) var(--sp-16) var(--sp-8); overflow-y: auto; overflow-x: hidden; }
  .shot-strip::-webkit-scrollbar { width: 8px; }
  .shot-strip::-webkit-scrollbar-thumb { background: var(--scroll); border-radius: var(--radius-4); }
  .strip-item { position: relative; flex: 0 0 auto; width: 96px; border: var(--hair-2) solid transparent; border-radius: var(--radius-4);
    overflow: hidden; cursor: pointer; background: var(--input); transition: border-color var(--dur-120), transform var(--dur-120); }
  .strip-item:hover { transform: translateY(-2px); }
  .strip-item.sel { border-color: var(--acc); }
  .strip-item.ready { box-shadow: 0 0 0 var(--hair) color-mix(in srgb, var(--mark-ready) var(--a-50), transparent) inset; }
  .strip-item video, .strip-item img { width: 100%; height: 54px; object-fit: contain; display: block; background: transparent; }
  .strip-item .tph { position: absolute; left: 0; right: 0; top: 0; height: 54px; background: var(--thumbbg); }
  .strip-item .ph { background: var(--thumbbg); }
  .strip-item.mready .tph { display: none; }
  .strip-item.mready video, .strip-item.mready img { background: var(--media-bg); }
  .strip-item .ph { width: 100%; height: 54px; display: flex; align-items: center; justify-content: center;
    background: transparent; font-size: var(--fs-16); color: var(--sub); line-height: 1; opacity: .6; }
  .strip-item .sn { position: absolute; left: var(--sp-4); top: var(--sp-4); font-size: var(--fs-11); padding: 0 var(--sp-4); border-radius: var(--radius-4);
    background: color-mix(in srgb, var(--media-bg) var(--a-60), transparent); color: var(--on-acc); }
  .strip-item .st { display: block; font-size: var(--fs-11); color: var(--sub); text-align: center; padding: var(--sp-4) 0; background: var(--panel); }

  /* 右栏 */
  .ed-head { display: flex; align-items: center; justify-content: space-between; padding: var(--sp-12) var(--sp-16); border-bottom: var(--hair) solid var(--line); }
  .ed-head b { font-size: var(--fs-14); } .ed-head .no { color: var(--sub); font-size: var(--fs-12); }
  /* 右栏是「表头 + 滚动正文 + 钉底的动作行」三段：#edCol 自己不滚（.col 那条 overflow 归零），
     滚的只是 .ed-body —— 于是「生成这一镜」永远悬在右栏底部，不用把提示词与素材区滚完才够得着。 */
  #edCol { display: flex; flex-direction: column; overflow: hidden; }
  #edCol .ed-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; }
  .ed-body { padding: var(--sp-12) var(--sp-16) var(--sp-24); }
  /* 生成参数：整块套用图片工作台「高级设置」卡片（结构与样式见 ui.css 的 .adv / .row） */
  #advBox { margin: 0 0 var(--sp-16); }
  #advBox .dur-range { width: 100%; accent-color: var(--pri); cursor: pointer; }
  #advBox .dur-num { display: flex; align-items: center; gap: var(--sp-8); min-width: 96px; }
  /* 与同一张卡里的下拉、按钮取同一层底：这里以前只画一条 --line 描边，白卡上像一块凹格，
     而紧挨着的「已开启」那排是凸的 —— 同一列控件的厚度得一致，所以描边改用 --shadow-ctl 里的
     那一圈（border 让位给影，否则描边 + 影边叠成 2px）。 */
  #advBox .dur-num input[type="number"] { width: 100%; padding: var(--sp-8) var(--sp-8); background: var(--control-bg);
    border: var(--hair) solid transparent; border-radius: var(--radius-6); color: var(--txt); text-align: center; font-size: var(--fs-13);
    box-shadow: var(--shadow-ctl); outline: none;
    transition: border-color var(--dur-120), background var(--dur-120), box-shadow var(--dur-120); }
  #advBox .dur-num input[type="number"]:hover:not(:focus) { background: var(--control-hover); }
  #advBox .dur-num input[type="number"]:focus { border-color: var(--acc); box-shadow: var(--focus-shadow); }
  #advBox .dur-num input[type="number"]::-webkit-outer-spin-button,
  #advBox .dur-num input[type="number"]::-webkit-inner-spin-button { opacity: 1; }
  #advBox .dur-num span { font-size: var(--fs-12); color: var(--sub); white-space: nowrap; }
  /* .ed-label 本体与 .cnt 已提到 ui.css（工作台素材区共用同一份），这里只留本页独有的 .mini */
  .ed-label .mini { font-size: var(--fs-11); padding: var(--sp-2) var(--sp-8); border-radius: var(--radius-4); }
  #edPrompt { width: 100%; min-height: 150px; background: var(--input); border: var(--hair) solid var(--line); border-radius: var(--radius-4); color: var(--txt); font-size: var(--fs-13); line-height: 1.6; padding: var(--sp-8) var(--sp-12); resize: vertical; font-family: inherit; outline: none; }
  #edPrompt:focus { border-color: var(--acc); }
  /* 提示词框里的 @素材高亮：镜像层铺在 textarea 底下，只给 @片段 画底。
     字号 / 行高 / 内边距 / 边框宽度必须与 #edPrompt **逐项一致**，否则高亮会错位。 */
  .ta-wrap { position: relative; }
  .ta-back { position: absolute; left: 0; top: 0; right: 0; bottom: 0; overflow: hidden; pointer-events: none;
    white-space: pre-wrap; word-wrap: break-word; color: transparent;
    font-family: inherit; font-size: var(--fs-13); line-height: 1.6; padding: var(--sp-8) var(--sp-12); border: var(--hair) solid transparent; }
  /* 灰底就够了 —— 底下那条 `inset 0 -2px` 的深色描边在正文里像一条下划线，
     和「@ 是引用」这件事没关系，看着只是脏。底色跟着主题走（见 :root 的 --atbg）。 */
  .ta-back .ta-at { background: var(--atbg); border-radius: var(--radius-4); }
  /* 鼠标滑过 @片段 时那张小卡（挂在 body 上、position:fixed，见 hoverAt） */
  #atPeek { position: fixed; z-index: 61; display: flex; align-items: center; gap: var(--sp-8); padding: var(--sp-8) var(--sp-8);
    background: var(--panel); border: var(--hair) solid var(--line); border-radius: var(--radius-6); box-shadow: var(--shadow-2); pointer-events: none; }
  #atPeek .pk-t { width: 40px; height: 40px; flex: 0 0 40px; border-radius: var(--radius-4); overflow: hidden;
    background: var(--thumbbg); display: flex; align-items: center; justify-content: center; color: var(--sub); }
  #atPeek .pk-t img { width: 100%; height: 100%; object-fit: cover; display: block; }
  #atPeek .pk-n { font-size: var(--fs-13); color: var(--txt); font-weight: 600; }
  #atPeek .pk-k { font-size: var(--fs-11); color: var(--sub); }
  /* 提示词里 @ 引用的候选浮层。挂在 body 上、position:fixed —— 右栏编辑器每次重画都换节点，
     挂在编辑器里面会跟着丢；位置按光标（或 `@素材` 那颗按钮）现算，见 mentionPlace / caretXY。 */
  #mentionBox { position: fixed; z-index: 60; width: 328px; max-height: 268px; overflow-y: auto;
    background: var(--panel); border: var(--hair) solid var(--line); border-radius: var(--radius-6); box-shadow: var(--shadow-2); padding: var(--sp-4); }
  /* 一行 = 缩略图 · @名字 · 右边一列「类型 · 来源」 */
  #mentionBox .mt-i { display: flex; align-items: center; gap: var(--sp-8); padding: var(--sp-8) var(--sp-8); border-radius: var(--radius-4); cursor: pointer; }
  #mentionBox .mt-i.on { background: var(--panel2); }
  #mentionBox .mt-i.off { opacity: .55; }          /* 没有预览图：引用不了，压暗并写明原因 */
  #mentionBox .mt-t { width: 30px; height: 30px; flex: 0 0 30px; border-radius: var(--radius-4); overflow: hidden;
    background: var(--thumbbg); display: flex; align-items: center; justify-content: center; color: var(--sub); }
  #mentionBox .mt-t img { width: 100%; height: 100%; object-fit: cover; display: block; }
  #mentionBox .mt-n { flex: 1; min-width: 0; font-size: var(--fs-13); color: var(--txt); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #mentionBox .mt-k { flex: 0 0 auto; max-width: 52%; font-size: var(--fs-11); color: var(--sub); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* 行尾那个 › 是「这一条还有别的图可挑」的提示（悬停会滑出二级菜单） */
  #mentionBox .mt-i.has-sub::after { content: '›'; margin-left: var(--sp-2); font-size: var(--fs-14); line-height: 1; color: var(--sub); }
  #mentionBox .mt-empty { padding: var(--sp-8); font-size: var(--fs-12); color: var(--sub); line-height: 1.7; }
  /* @ 浮层的二级菜单：鼠标停在某个角色上时，从右边滑出一列「这一位有哪些图」。
     挂在 body 上、position:fixed —— 浮层自己是 overflow-y:auto，放里面会被裁掉。 */
  #mentionSub { position: fixed; z-index: 62; width: 272px; max-height: 300px; overflow-y: auto;
    background: var(--panel); border: var(--hair) solid var(--line); border-radius: var(--radius-6); box-shadow: var(--shadow-2); padding: var(--sp-4); }
  #mentionSub .ms-h { padding: var(--sp-4) var(--sp-8) var(--sp-4); font-size: var(--fs-11); color: var(--sub); }
  #mentionSub .ms-i { display: flex; align-items: center; gap: var(--sp-8); padding: var(--sp-4) var(--sp-8); border-radius: var(--radius-4); cursor: pointer; }
  #mentionSub .ms-i:hover { background: var(--panel2); }
  #mentionSub .ms-t { width: 34px; height: 34px; flex: 0 0 34px; border-radius: var(--radius-4); overflow: hidden;
    background: var(--thumbbg); display: flex; align-items: center; justify-content: center; color: var(--sub); }
  #mentionSub .ms-t img { width: 100%; height: 100%; object-fit: cover; display: block; }
  #mentionSub .ms-n { flex: 1; min-width: 0; font-size: var(--fs-13); color: var(--txt); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #mentionSub .ms-k { flex: 0 0 auto; font-size: var(--fs-11); color: var(--sub); }

  /* 输入框右上角那颗 `@素材`：底色加深，一眼看得出是个入口 */
  .ed-label .at-btn { font-size: var(--fs-12); padding: var(--sp-4) var(--sp-8); margin-right: var(--sp-8); border-radius: var(--radius-10); cursor: pointer;
    color: var(--acc); background: var(--sel-bg); border: var(--hair) solid var(--acc-line-32); }
  .ed-label .at-btn:hover { border-color: var(--acc); }

  /* 「提到素材」那排芯片：底色加深；鼠标移上去弹一张预览（名字 + 图片）。
     预览朝**下**弹：编辑器那一列是 `overflow-y: auto`，朝上会被列的上边缘裁掉。 */
  .mchips { display: flex; flex-wrap: wrap; gap: var(--sp-8); margin-top: var(--sp-8); }
  .mchip { position: relative; display: inline-flex; align-items: center; gap: var(--sp-8); padding: var(--sp-4) var(--sp-8) var(--sp-4) var(--sp-4);
    border-radius: var(--radius-10); cursor: pointer; color: var(--acc);
    background: var(--sel-bg); border: var(--hair) solid var(--acc-line-32); }
  .mchip:hover { border-color: var(--acc); }
  .mchip > img { width: 20px; height: 20px; border-radius: 50%; object-fit: cover; display: block; background: var(--thumbbg); }
  .mchip .mn { font-size: var(--fs-12); max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mchip .peek { display: none; position: absolute; left: 0; top: calc(100% + var(--sp-8)); z-index: 62; padding: var(--sp-8);
    border-radius: var(--radius-6); background: var(--panel); border: var(--hair) solid var(--line);
    box-shadow: var(--shadow-2); text-align: center; }
  .mchip:hover .peek { display: block; }
  .mchip .peek img { width: 132px; height: 132px; object-fit: cover; border-radius: var(--radius-4); display: block; background: var(--thumbbg); }
  .mchip .peek b { display: block; margin-top: var(--sp-4); font-size: var(--fs-12); color: var(--txt); font-weight: 600; }
  .mchip .peek i { display: block; font-style: normal; font-size: var(--fs-11); color: var(--sub); }
  /* 提示词与画面素材那两行的动作按钮都用 ui.css 的 .btn-row / .tool（与三个工作台同一套，
     AI 那几颗的画法在 window.aiBtnHTML / InlinePolish.btnHTML），这里不再另立一套 */
  /* 素材槽位的样式（.assets-grid / .asset-slot / .rvthumb / 互斥禁用）已收进 ui.css，工作台同用 */
  /* 动作行钉在 #edCol 底部（在 .ed-body 之外、不再随正文滚动）：底色与栏一致、上缘一道分隔线，
     悬浮固定但不遮正文 —— 正文滚到头也接在这条线下面。 */
  .ed-footer { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-8);
    flex: 0 0 auto; margin: 0 calc(-1 * var(--sp-16)) 0; padding: var(--sp-8) var(--sp-16) var(--sp-12);
    border-top: var(--hair) solid var(--line); background: var(--panel); border-radius: 0 0 var(--radius-4) var(--radius-4); }
  .ed-footer .can { font-size: var(--fs-12); color: var(--ok); }
  .ed-footer .can.no { color: var(--warn); }
  .ed-footer .pri { padding: var(--sp-8) var(--sp-24); font-size: var(--fs-14); }
  .ed-footer .est { font-size: var(--fs-12); color: var(--sub); margin-right: auto; }
  .ed-raw { margin-top: var(--sp-8); }
  /* 接上一镜尾帧：勾选条与首帧槽里的占位。槽位本体仍用 ui.css 的 .asset-slot，
     这里只加「接续」这一档的边色与两颗小按钮。 */
  .chain-row { display: flex; align-items: center; gap: var(--sp-8); margin: var(--sp-4) 0 var(--sp-8);
    padding: var(--sp-4) var(--sp-8); border: var(--hair) dashed var(--line); border-radius: var(--radius-6);
    font-size: var(--fs-12); color: var(--sub); cursor: pointer; }
  .chain-row.on { border-style: solid; border-color: var(--acc); color: var(--txt); background: var(--acc-tint-10); }
  .chain-row input { margin: 0; }
  .chain-row em { margin-left: auto; font-style: normal; font-size: var(--fs-11); color: var(--sub); }
  .chain-row.on em { color: var(--acc); }
  .chain-row input:disabled { cursor: not-allowed; }
  .asset-slot.chain { border-style: solid; border-color: var(--acc); color: var(--acc); }
  .asset-slot .chain-ops { display: flex; gap: var(--sp-4); margin-top: var(--sp-4); }
  .asset-slot .chain-ops .mini { padding: var(--sp-2) var(--sp-8); font-size: var(--fs-11); }
  .hint { font-size: var(--fs-11); color: var(--sub); margin-top: var(--sp-8); }
  /* 导出拆分按钮：主钮（导出成片）+ 尾部 chevron，点开列其余去向
     （FCPXML / 媒体包 / 工程目录）。浮层挂在按钮组自己的 absolute 容器里（不是 body）：
     页头是常驻 DOM，不会被重建冲掉。
     这一颗是页头唯一的主操作，所以两半都穿公共主按钮那身（`.pri`：淡强调底 + 强调墨），
     而不是各穿一份中性 `.ghost` —— 中性底换配色时一个像素都不动，页头的主操作看着就和
     它左边那颗短片名胶囊一样普通。两半之间用强调描边分隔；`.pri` 自己 `border:0`，
     所以分隔线写在这一格上（权重也压过 `.pri`）。 */
  .exp-split { display: inline-flex; align-items: stretch; position: relative; flex: 0 0 auto; }
  .exp-split > .pri { border-radius: var(--radius-4); }
  .exp-split > .pri:first-child { border-top-right-radius: 0; border-bottom-right-radius: 0; }
  .exp-split > .exp-more { border-top-left-radius: 0; border-bottom-left-radius: 0; padding: 0 var(--sp-8);
    border-left: var(--hair) solid var(--acc-line-32); }
  .exp-split > .exp-more .ui-icon { transition: transform var(--dur-180); }
  /* 浮层开着 = 这一整颗正处于「按下了」：底部一圈内嵌强调环 + chevron 翻面，
     与 ui.css 的 `.dd.open .dd-btn` 说的是同一件事。 */
  .exp-split:has(.exp-menu:not([hidden])) > .pri { box-shadow: inset 0 0 0 var(--hair) var(--acc); }
  .exp-split:has(.exp-menu:not([hidden])) > .exp-more .ui-icon { transform: rotate(180deg); }
  .exp-menu { position: absolute; right: 0; top: calc(100% + var(--sp-4)); z-index: 80; min-width: 190px;
    background: var(--panel); border: var(--hair) solid var(--line); border-radius: var(--radius-4);
    box-shadow: var(--shadow-4); padding: var(--sp-4); }
  .exp-menu[hidden] { display: none; }
  .exp-menu > button { display: flex; align-items: center; gap: var(--sp-8); width: 100%; text-align: left;
    padding: var(--sp-8) var(--sp-8); border: 0; border-radius: var(--radius-4); background: none;
    color: var(--txt); font-size: var(--fs-13); cursor: pointer; white-space: nowrap; }
  /* 浮层里的一行 hover：强调墨压在强调淡底上（同 `.dd-opt:hover`），
     不是压在 `--panel2` 那枚中性底上 —— 强调色配中性底是第五种画法。 */
  .exp-menu > button:hover { background: var(--acc-tint-10); color: var(--acc); }
  /* #lbCount / #lbBar 的样式统一在 ui.css 的灯箱那一段 */
  dialog.script { background: var(--panel); color: var(--txt); border: var(--hair) solid var(--line); border-radius: var(--radius-4); padding: var(--sp-24); width: 520px; max-width: 92vw; margin: auto; }
  dialog.script::backdrop { background: color-mix(in srgb, var(--media-bg) var(--a-60), transparent); }
  dialog.script textarea { width: 100%; height: 200px; background: var(--input); border: var(--hair) solid var(--line); border-radius: var(--radius-4); color: var(--txt); font-size: var(--fs-13); padding: var(--sp-8); font-family: inherit; resize: vertical; }
  dialog.script .tip { font-size: var(--fs-12); color: var(--sub); margin: var(--sp-8) 0 var(--sp-12); }
  .script-row { display: flex; gap: var(--sp-8); justify-content: flex-end; }
  /* 小图标按钮：与图片工作台的 .ghost 同一套观感（透明底 + 细描边 + 悬停主题色） */
  .op-btn { display: inline-flex; align-items: center; justify-content: center; height: 26px; min-width: 26px; padding: 0 var(--sp-8);
    border: var(--hair) solid var(--line); border-radius: var(--radius-4); background: none; color: var(--sub);
    font-size: var(--fs-12); line-height: 1; cursor: pointer; user-select: none; transition: all var(--dur-120); }
  .op-btn:hover { border-color: var(--acc); color: var(--acc); }
  .op-btn.danger:hover { border-color: var(--err); color: var(--err); }
  .op-btn.armed { width: auto; }
  .op-btn.grip { cursor: grab; }
  .op-btn.grip:active { cursor: grabbing; }
  .op-btn.addshot { height: 26px; padding: 0 var(--sp-12); font-size: var(--fs-12); flex: 0 0 auto; white-space: nowrap; }
  .op-btn.addshot:hover { border-color: var(--ok); color: var(--ok); }

  /* ============================================================================
     剪辑态时间线板（#tlBoard）：整块由 `web/director/engine/timeline.js` 现画。
     形状与参考项目同一条路子 —— 一条横向滚动的轨道区就是内容层，刻度尺、标记条、
     轨道与播放头**共用同一次 scrollLeft**；左列（眼睛 / 锁 / 名字）与右列逐行对齐，
     两边的行高都从这一组 `--tlh-*` 取（声明在板上，两列都继承得到）。
     高度两种口径（与左右栏同一套）：没拖过按内容、封顶 --dock-h；拖过之后
     `data-split-fixed` 挂上，那个像素就是板高，轨道区自己竖着滚。
     ============================================================================ */
  .tl-board { --tl-side-w: 116px; --tlh-tools: 40px; --tlh-ruler: 22px; --tlh-marker: 20px;
    --tlh-image: 54px; --tlh-voice: 40px; --tlh-cap: 30px; --tlh-foot: 26px; --cell: 64px;
    position: relative; display: flex; flex-direction: column; flex: 0 0 auto;
    min-width: 0; max-height: var(--dock-h); margin: 0 var(--shell-px) var(--sp-12);
    background: var(--panel); border: var(--hair) solid var(--line); border-radius: var(--radius-10);
    /* 板子自己不再裁溢出：坞把手是**骑在上沿**的那一条（Wb.split 插进来的），
       裁掉上半截就只剩 5px 可抓 —— 用户点名的「底栏拖不动」有一半是它。
       内容该裁的那一层交给 `.tl-board-in`。 */
    overflow: visible; }
  /* `min-height: 0`：flex 子项默认按内容给最小高度，不加这一条就算把 --dock-h 拖到 48，
     板子仍被内容撑在 234 —— 用户点名的「拖不到最底下、轨道挡不住」。 */
  .tl-board[data-split-fixed] { flex: 0 0 var(--dock-h); max-height: none; min-height: 0; }
  .tl-board[hidden] { display: none; }
  /* 坞把手：整条通长、14px 的抓取带骑在板子上沿，中间一枚加宽的抓手 ——
     以前那一条只有 36px、还被板子裁掉一半，看着像「没有把手」。 */
  .tl-board > .wb-split-y { top: calc(-1 * var(--sp-8)); height: var(--sp-16); z-index: 9; }
  .tl-board > .wb-split-y i { width: 54px; height: var(--hair-3); }
  /* 重画只换这一层：拖高把手（Wb.split 插在 .tl-board 上的第一个子节点）住在它外面。 */
  .tl-board-in { display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0;
    overflow: hidden; border-radius: inherit; }

  /* ---------------- 工具条 ---------------- */
  .tl-board .tl-tools { display: flex; align-items: center; gap: var(--sp-4); flex: 0 0 auto;
    min-height: var(--tlh-tools); padding: 0 var(--sp-8); border-bottom: var(--hair) solid var(--line);
    background: var(--panel); }
  .tl-board .tl-tgroup { display: flex; align-items: center; gap: var(--sp-2); }
  .tl-board .tl-tb { display: inline-flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; padding: 0; border: 0; border-radius: var(--radius-6);
    background: none; color: var(--sub); cursor: pointer; transition: background var(--dur-120), color var(--dur-120); }
  .tl-board .tl-tb:hover { background: var(--panel2); color: var(--txt); }
  .tl-board .tl-tb:active { background: var(--input); }
  .tl-board .tl-tb:focus-visible { outline: var(--hair-2) solid var(--acc); outline-offset: var(--hair); }
  .tl-board .tl-tb.is-on { color: var(--acc); background: var(--sel-bg); }
  .tl-board .tl-tb[disabled] { opacity: .35; cursor: not-allowed; }
  .tl-board .tl-zoom { min-width: 52px; padding: 0 var(--sp-4); text-align: center;
    font-size: var(--fs-11); color: var(--sub); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .tl-board .tl-sep { flex: 0 0 auto; width: var(--hair); align-self: stretch;
    margin: var(--sp-8) var(--sp-4); background: var(--line); }
  .tl-board .tl-grow { flex: 1 1 auto; }
  .tl-board .tl-total { padding-right: var(--sp-8); font-size: var(--fs-12); color: var(--sub);
    font-variant-numeric: tabular-nums; white-space: nowrap; }
  .tl-board .tl-selgroup { position: relative; }
  .tl-board .tl-selmode { width: auto; gap: var(--sp-4); padding: 0 var(--sp-8); color: var(--txt); }
  .tl-board .tl-selmode-name { font-size: var(--fs-12); }
  .tl-board .tl-menu { position: absolute; z-index: 90; top: calc(100% + var(--sp-4)); left: 0;
    min-width: 168px; padding: var(--sp-4); background: var(--panel);
    border: var(--hair) solid var(--line); border-radius: var(--radius-10); box-shadow: var(--shadow-4); }
  .tl-board .tl-menu[hidden] { display: none; }
  .tl-board .tl-menu-row { display: flex; align-items: center; gap: var(--sp-8); width: 100%;
    padding: var(--sp-4) var(--sp-8); border: 0; border-radius: var(--radius-6);
    background: none; color: var(--txt); font-size: var(--fs-12); text-align: left; cursor: pointer; }
  .tl-board .tl-menu-row:hover { background: var(--panel2); }
  .tl-board .tl-menu-row.is-on { color: var(--acc); background: var(--acc-tint-10); }

  /* ---------------- 刻度尺（自己一道，在滚动区外面） ---------------- */
  .tl-board .tl-ruler-row { display: flex; flex: 0 0 auto; height: var(--tlh-ruler);
    border-bottom: var(--hair) solid var(--line); background: var(--panel2); }
  .tl-board .tl-corner { display: flex; align-items: center; flex: 0 0 var(--tl-side-w); min-width: 0;
    padding: 0 var(--sp-8); border-right: var(--hair) solid var(--line); overflow: hidden; }
  .tl-board .tl-corner-txt { font-size: var(--fs-11); color: var(--sub); white-space: nowrap; }
  .tl-board .tl-ruler-clip { position: relative; flex: 1 1 auto; min-width: 0; overflow: hidden; }
  .tl-board .tl-ruler-inner { position: absolute; left: 0; top: 0; height: 100%; will-change: transform; }
  .tl-board .tl-tick { position: absolute; top: 0; bottom: 0; width: var(--hair); background: none; }
  .tl-board .tl-tick::after { content: ""; position: absolute; left: 0; bottom: 0;
    width: var(--hair); height: 6px; background: color-mix(in srgb, var(--sub) var(--a-34), transparent); }
  .tl-board .tl-tick.major::after { height: 9px; background: color-mix(in srgb, var(--sub) var(--a-60), transparent); }
  .tl-board .tl-tick em { position: absolute; left: var(--sp-4); top: var(--sp-4); font-style: normal;
    font-size: var(--fs-11); line-height: 1; color: var(--sub); white-space: nowrap;
    font-variant-numeric: tabular-nums; }
  .tl-board .tl-ruler-head { position: absolute; left: 0; top: 0; bottom: 0; width: var(--hair-2); margin-left: calc(-1 * var(--sp-2));
    background: var(--acc); pointer-events: none; will-change: transform; }
  .tl-board .tl-ruler-head::after { content: ""; position: absolute; left: calc(-1 * var(--sp-4)); top: 0;
    width: 10px; height: 8px; border-radius: 0 0 var(--radius-4) var(--radius-4); background: var(--acc); }
  .tl-board .tl-ruler-snap { position: absolute; top: 0; bottom: 0; width: var(--hair);
    background: var(--warn); pointer-events: none; }
  .tl-board .tl-ruler-snap[hidden] { display: none; }

  /* ---------------- 主体：左列 + 轨道区 ---------------- */
  .tl-board .tl-body { display: flex; flex: 1 1 auto; min-height: 0; }
  .tl-board .tl-labels { position: relative; flex: 0 0 var(--tl-side-w); min-width: 0; overflow: hidden;
    border-right: var(--hair) solid var(--line); background: var(--panel); }
  .tl-board .tl-labels-inner { position: absolute; left: 0; top: 0; width: 100%; will-change: transform; }
  .tl-board .tl-label { display: flex; align-items: center; gap: var(--sp-4); min-width: 0;
    padding: 0 var(--sp-8); border-bottom: var(--hair) solid var(--line); background: var(--panel); }
  .tl-board .tl-label.is-markers { height: var(--tlh-marker); background: var(--panel2); cursor: pointer; }
  .tl-board .tl-label[data-row^="image-"] { height: var(--tlh-image); }
  .tl-board .tl-label[data-row^="voice-"] { height: var(--tlh-voice); }
  .tl-board .tl-label[data-row^="caption-"] { height: var(--tlh-cap); }
  .tl-board .tl-label-ic { display: inline-flex; flex: 0 0 auto; color: var(--sub); }
  .tl-board .tl-flag { display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto;
    width: 19px; height: 19px; padding: 0; border: 0; border-radius: var(--radius-4);
    background: none; color: var(--sub); cursor: pointer; }
  .tl-board .tl-flag:hover { background: var(--panel2); color: var(--txt); }
  .tl-board .tl-name { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; font-size: var(--fs-12); color: var(--txt); }
  .tl-board .tl-count { flex: 0 0 auto; font-size: var(--fs-11); color: var(--sub);
    font-variant-numeric: tabular-nums; }
  .tl-board .tl-label.is-off .tl-name { color: var(--sub); }
  .tl-board .tl-label.is-off .tl-flag[data-eye] { color: var(--sub); opacity: .7; }
  .tl-board .tl-label.is-locked .tl-flag[data-lock] { color: var(--warn); }
  .tl-board .tl-label.is-locked .tl-name { color: var(--warn); }

  .tl-board .tl-scroll { position: relative; flex: 1 1 auto; min-width: 0; min-height: 0;
    overflow: auto; outline: none; background: var(--input); scrollbar-width: thin;
    scrollbar-color: var(--scroll) transparent; }
  .tl-board .tl-scroll:focus-visible { box-shadow: inset 0 0 0 var(--hair-2) color-mix(in srgb, var(--acc) var(--a-50), transparent); }
  .tl-board .tl-scroll::-webkit-scrollbar { width: 10px; height: 10px; }
  .tl-board .tl-scroll::-webkit-scrollbar-thumb { background: var(--scroll); border-radius: var(--radius-6); }
  .tl-board .tl-scroll::-webkit-scrollbar-track { background: transparent; }
  .tl-board .tl-content { position: relative; min-height: 100%;
    background-image: linear-gradient(90deg, color-mix(in srgb, var(--line) var(--a-72), transparent) var(--hair), transparent var(--hair));
    background-size: var(--tl-grid) 100%; background-repeat: repeat-x; }

  /* ---------------- 播放头 / 吸附线 ---------------- */
  .tl-board .tl-playhead { position: absolute; left: 0; top: 0; bottom: 0; z-index: 8; width: var(--hair-2);
    margin-left: calc(-1 * var(--sp-2)); background: var(--acc); pointer-events: none; will-change: transform; }
  .tl-board .tl-playhead-knob { position: absolute; left: 50%; top: 0; width: 9px; height: 9px;
    transform: translateX(-50%); border-radius: 0 0 var(--radius-4) var(--radius-4); background: var(--acc); }
  .tl-board .tl-snap-line { position: absolute; top: 0; bottom: 0; z-index: 7; width: var(--hair);
    background: var(--warn); pointer-events: none; }
  .tl-board .tl-snap-line[hidden] { display: none; }

  /* ---------------- 标记条（四类 × 五色，颜色落在 --mc 上） ---------------- */
  .tl-board .tl-marker-rail { position: relative; height: var(--tlh-marker);
    border-bottom: var(--hair) solid var(--line); background: var(--panel2); }
  .tl-board .tl-rail-hint { position: absolute; left: var(--sp-8); top: var(--sp-4);
    font-size: var(--fs-11); color: var(--sub); white-space: nowrap; }
  .tl-board .tl-marker { position: absolute; top: var(--sp-2); z-index: 2; display: inline-flex;
    align-items: center; justify-content: center; width: 17px; height: 16px; transform: translateX(-50%); padding: 0;
    border: 0; border-radius: var(--radius-4); background: color-mix(in srgb, var(--mc) var(--a-18), transparent);
    color: var(--mc); cursor: pointer; }
  .tl-board .tl-marker:hover { background: color-mix(in srgb, var(--mc) var(--a-34), transparent); }
  /* 选中那一枚：与块同一套亮环（强调色描边一圈），标记本身已经染了它自己的颜色，不再改底色。 */
  .tl-board .tl-marker.is-selected { box-shadow: 0 0 0 var(--hair-2) var(--acc); }
  /* 范围标记那一条带子是**能拎的**：整条拖 = 挪这一段的起点，右沿那一小截 = 改止点
     （手势在 edit.js：`[data-band]` / `[data-band-tail]`）。带子压在针层下面，
     只让带子自己吃指针，别把整条轨的手势抢走。 */
  .tl-board .tl-marker-band { position: absolute; top: var(--sp-2); height: 5px; border-radius: var(--radius-4);
    background: color-mix(in srgb, var(--mc) var(--a-34), transparent); cursor: grab; z-index: 1; }
  .tl-board .tl-marker-band:active { cursor: grabbing; }
  .tl-board .tl-band-tail { position: absolute; right: calc(-1 * var(--sp-2)); top: calc(-1 * var(--sp-2));
    width: var(--sp-4); height: 9px; border-radius: var(--radius-4); background: var(--mc); cursor: ew-resize; }
  .tl-board .tl-band-tail:hover { filter: brightness(1.2); }
  .tl-board .color-cyan { --mc: var(--acc); }
  .tl-board .color-amber { --mc: var(--warn); }
  .tl-board .color-violet { --mc: var(--pri); }
  .tl-board .color-rose { --mc: var(--err); }
