  .tl-board .color-green { --mc: var(--ok); }

  /* ---------------- 轨道与行 ---------------- */
  .tl-board .tl-track { position: relative; }
  .tl-board .tl-lane { position: relative; border-bottom: var(--hair) solid var(--line); }
  .tl-board .tl-lane.is-image { height: var(--tlh-image); background: color-mix(in srgb, var(--panel) var(--a-34), transparent); }
  .tl-board .tl-lane.is-voice { height: var(--tlh-voice); background: color-mix(in srgb, var(--panel) var(--a-20), transparent); }
  .tl-board .tl-lane.is-caption { height: var(--tlh-cap); background: color-mix(in srgb, var(--panel) var(--a-20), transparent); }
  .tl-board .tl-lane-hint { position: absolute; left: var(--sp-8); top: 50%; transform: translateY(-50%);
    font-size: var(--fs-11); color: var(--sub); white-space: nowrap; pointer-events: none; }
  .tl-board .tl-overflow { padding: var(--sp-4) var(--sp-8); font-size: var(--fs-11); color: var(--warn); }
  /* 隐藏 / 锁定：块照画在原位置（收一轨不改行高、不挪别的行），手势层由 edit.js 拒绝编辑 */
  .tl-board .tl-lane.is-off > .tl-clip,
  .tl-board .tl-lane.is-off > .tl-voice,
  .tl-board .tl-lane.is-off > .tl-cap { opacity: .38; filter: saturate(.35); }
  .tl-board .tl-lane.is-locked > .tl-clip,
  .tl-board .tl-lane.is-locked > .tl-voice,
  .tl-board .tl-lane.is-locked > .tl-cap { cursor: default; }
  /* 上下拖到某一行之上：那一行自己亮起来（配合那根竖线，说清「松手就落到这一行」）。
     拖到最后一行之下时没有行可亮，那一行是松手才新开的 —— 那句提示由 `hint()` 说。 */
  .tl-board .tl-lane.is-drop { background: color-mix(in srgb, var(--acc) var(--a-14), transparent);
    box-shadow: inset 0 0 0 var(--hair) color-mix(in srgb, var(--acc) var(--a-50), transparent); }

  /* ---------------- 画面段（胶片带 + 名称 / 倍速 / 静音） ---------------- */
  .tl-board .tl-clip { position: absolute; top: var(--sp-4); bottom: var(--sp-4);
    border: var(--hair) solid var(--line); border-radius: var(--radius-6); overflow: hidden;
    background: var(--thumbbg); cursor: grab; user-select: none; transition: border-color var(--dur-120), box-shadow var(--dur-120); }
  .tl-board .tl-clip:hover { border-color: color-mix(in srgb, var(--acc) var(--a-60), transparent); }
  .tl-board .tl-clip:active { cursor: grabbing; }
  .tl-board .tl-clip.is-selected { border-color: var(--acc);
    box-shadow: 0 0 0 var(--hair-2) color-mix(in srgb, var(--acc) var(--a-50), transparent); }
  .tl-board .tl-clip.is-locked { cursor: default; }
  .tl-board .tl-block-in { position: absolute; inset: 0; overflow: hidden; }
  .tl-board .tl-strip { position: absolute; inset: 0; display: flex; flex-direction: row; overflow: hidden; }
  .tl-board .tl-fr { flex: 0 0 var(--cell); height: 100%; background-size: cover;
    background-position: center; background-color: var(--thumbbg); border-right: var(--hair) solid color-mix(in srgb, var(--media-bg) var(--a-20), transparent); }
  .tl-board .tl-fr.gap { background-color: var(--panel2);
    background-image: repeating-linear-gradient(135deg, color-mix(in srgb, var(--txt) var(--a-8), transparent) 0 5px, transparent 5px 10px); }
  .tl-board .tl-strip.is-image { display: block; background-size: auto 100%; background-repeat: repeat-x; background-position: left center; }
  .tl-board .tl-clip-top { position: absolute; left: 0; right: 0; top: 0; z-index: 2; display: flex;
    align-items: center; gap: var(--sp-4); padding: var(--sp-2) var(--sp-8); pointer-events: none;
    background: linear-gradient(to bottom, color-mix(in srgb, var(--media-bg) var(--a-55), transparent), transparent); }
  .tl-board .tl-clip-name { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; font-size: var(--fs-11); font-weight: 600; color: var(--on-acc); }
  .tl-board .tl-spd { flex: 0 0 auto; padding: 0 var(--sp-4); border-radius: var(--radius-4);
    background: color-mix(in srgb, var(--media-bg) var(--a-60), transparent); color: var(--on-acc);
    font-size: var(--fs-11); font-variant-numeric: tabular-nums; }
  .tl-board .tl-mute { position: absolute; right: var(--sp-4); bottom: var(--sp-4); z-index: 3;
    display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; padding: 0;
    border: 0; border-radius: var(--radius-4); background: color-mix(in srgb, var(--media-bg) var(--a-50), transparent);
    color: var(--on-acc); cursor: pointer; }
  .tl-board .tl-mute:hover { background: color-mix(in srgb, var(--media-bg) var(--a-72), transparent); }
  .tl-board .tl-mute.is-on { color: var(--err); }
  .tl-board .tl-lock-ic { position: absolute; left: var(--sp-4); bottom: var(--sp-4); z-index: 3;
    display: inline-flex; color: var(--on-acc); background: color-mix(in srgb, var(--media-bg) var(--a-50), transparent);
    border-radius: var(--radius-4); padding: var(--sp-2); }

  /* ---------------- 配音 ---------------- */
  .tl-board .tl-voice { position: absolute; top: var(--sp-4); bottom: var(--sp-4);
    border: var(--hair) solid color-mix(in srgb, var(--acc) var(--a-34), transparent);
    border-radius: var(--radius-6); overflow: hidden; cursor: grab; user-select: none;
    background: var(--acc-soft);
    transition: border-color var(--dur-120), box-shadow var(--dur-120); }
  .tl-board .tl-voice:hover { border-color: color-mix(in srgb, var(--acc) var(--a-72), transparent); }
  .tl-board .tl-voice:active { cursor: grabbing; }
  .tl-board .tl-voice.is-selected { border-color: var(--acc);
    box-shadow: 0 0 0 var(--hair-2) color-mix(in srgb, var(--acc) var(--a-50), transparent); }
  .tl-board .tl-voice.is-locked { cursor: default; }
  .tl-board .tl-wave { position: absolute; left: 0; right: 0; top: 0; bottom: 0; display: flex;
    align-items: center; gap: var(--sp-2); padding: var(--sp-4) var(--sp-4); opacity: .5; pointer-events: none; }
  .tl-board .tl-wave > i { flex: 1 1 0; min-width: 1px; border-radius: var(--radius-4); background: var(--acc); }
  .tl-board .tl-voice-txt { position: absolute; left: var(--sp-8); right: var(--sp-8); top: 50%; z-index: 2;
    transform: translateY(-50%); overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
    font-size: var(--fs-11); color: var(--txt); pointer-events: none; }

  /* ---------------- 字幕 ---------------- */
  .tl-board .tl-cap { position: absolute; top: var(--sp-2); bottom: var(--sp-2);
    border: var(--hair) solid color-mix(in srgb, var(--ok) var(--a-34), transparent);
    border-radius: var(--radius-6); overflow: hidden; cursor: grab; user-select: none;
    background: var(--ok-tint);
    transition: border-color var(--dur-120), box-shadow var(--dur-120); }
  .tl-board .tl-cap:hover { border-color: color-mix(in srgb, var(--ok) var(--a-72), transparent); }
  .tl-board .tl-cap:active { cursor: grabbing; }
  .tl-board .tl-cap.is-selected { border-color: var(--ok);
    box-shadow: 0 0 0 var(--hair-2) color-mix(in srgb, var(--ok) var(--a-50), transparent); }
  .tl-board .tl-cap.is-locked { cursor: default; }
  .tl-board .tl-cap-txt { position: absolute; left: var(--sp-8); right: var(--sp-8); top: 50%;
    transform: translateY(-50%); overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
    font-size: var(--fs-11); color: var(--txt); pointer-events: none; }

  /* ---------------- 两端的剪裁把手 ---------------- */
  /* 裁边把手（z-index 7）：必须压过转场菱形那一层（6）—— 菱形的命中区横在切缝正中，
     以前 18×18 居中那块正好盖住两侧各 8px 把手在行中段的可抓区，用户点名的「切缝处裁不动」。
     把手从行顶 16px 之下起步：行顶那条 16px 的横带让给转场菱形（两件事不打架）。 */
  .tl-board .tl-h { position: absolute; top: var(--sp-16); bottom: 0; z-index: 7; width: 8px; cursor: ew-resize; }
  .tl-board .tl-h.is-start { left: 0; }
  .tl-board .tl-h.is-end { right: 0; }
  .tl-board .tl-h::after { content: ""; position: absolute; top: 26%; bottom: 26%; width: var(--hair-2);
    border-radius: var(--radius-4); background: var(--acc); opacity: 0;
    transition: opacity var(--dur-120); }
  .tl-board .tl-h.is-start::after { left: var(--sp-2); }
  .tl-board .tl-h.is-end::after { right: var(--sp-2); }
  .tl-board .tl-clip:hover > .tl-h::after, .tl-board .tl-voice:hover > .tl-h::after,
  .tl-board .tl-cap:hover > .tl-h::after,
  .tl-board .tl-clip.is-selected > .tl-h::after, .tl-board .tl-voice.is-selected > .tl-h::after,
  .tl-board .tl-cap.is-selected > .tl-h::after { opacity: .9; }

  /* ---------------- 连接点 ◇（点一下开转场浮层） ---------------- */
  .tl-board .tl-junctions { position: absolute; left: 0; top: 0; z-index: 6; height: var(--tlh-image);
    pointer-events: none; }
  .tl-board .tl-junctions[hidden] { display: none; }
  /* 转场菱形：命中区 32×16、占行顶那条横带（0–16px，把手从 16px 之下才起步）——
     整条命中区都归菱形，点它开转场浮层；捏切缝 16px 以下的中段裁边 / 拖切点。
     菱形 12px 带 1px 描边的键帽底，骑在缝上看得见摸得着 —— 以前 18×18 居中那枚
     被把手压住点不动（「切点没有转场按钮」），缩小之后又一找不着。 */
  .tl-board .tl-junction { position: absolute; top: 0; display: inline-flex; align-items: center;
    justify-content: center; width: 32px; height: var(--sp-16); margin: 0 0 0 calc(-1 * var(--sp-16));
    padding: 0; border: 0; background: none; cursor: pointer; pointer-events: auto; }
  .tl-board .tl-junction-dot { width: 12px; height: 12px; border: var(--hair-1-5) solid var(--sub);
    border-radius: var(--radius-4); background: var(--panel); transform: rotate(45deg);
    box-shadow: var(--shadow-1); transition: border-color var(--dur-120), background var(--dur-120); }
  .tl-board .tl-junction:hover .tl-junction-dot { border-color: var(--acc);
    background: var(--acc-soft); }
  .tl-board .tl-junction.has-tr .tl-junction-dot { border-color: var(--acc); background: var(--acc); }

  /* ---------------- 底部读数行 ---------------- */
  .tl-board .tl-foot { display: flex; align-items: center; gap: var(--sp-8); flex: 0 0 auto;
    min-height: var(--tlh-foot); padding: 0 var(--sp-8); border-top: var(--hair) solid var(--line);
    background: var(--panel2); }
  .tl-board .tl-read { font-size: var(--fs-11); color: var(--txt); font-variant-numeric: tabular-nums; }
  .tl-board #tlT0 { color: var(--acc); }
  .tl-board .tl-foot-sep { font-size: var(--fs-11); color: var(--sub); }
  .tl-board .tl-foot-hint { margin-left: auto; min-width: 0; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; font-size: var(--fs-11); color: var(--sub); }

  /* ---------------- 转场浮层（九个预置 + 时长） ---------------- */
  .tl-board .tl-pop { position: absolute; z-index: 90; width: 304px; max-width: calc(100% - var(--sp-16));
    max-height: 60vh; overflow-y: auto; padding: var(--sp-8);
    background: var(--panel); border: var(--hair) solid var(--line); border-radius: var(--radius-10);
    box-shadow: var(--shadow-4); }
  .tl-board .tl-pop[hidden] { display: none; }
  .tl-board .tl-pop-head { display: flex; align-items: center; justify-content: space-between;
    margin-bottom: var(--sp-8); font-size: var(--fs-13); color: var(--txt); }
  .tl-board .tl-pop-presets { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--sp-8); }
  .tl-board .tl-pop-preset { display: flex; flex-direction: column; align-items: center; gap: var(--sp-4);
    padding: var(--sp-4); border: var(--hair) solid transparent; border-radius: var(--radius-6);
    background: none; color: var(--sub); font-size: var(--fs-11); cursor: pointer; }
  .tl-board .tl-pop-preset:hover { background: var(--panel2); color: var(--txt); }
  .tl-board .tl-pop-preset.is-on { border-color: var(--acc); color: var(--acc); background: var(--acc-tint-10); }
  .tl-board .tl-trp { position: relative; display: block; width: 72px; height: 36px; overflow: hidden;
    border-radius: var(--radius-4); background: var(--input); }
  .tl-board .tl-trp::before, .tl-board .tl-trp::after { content: ""; position: absolute; inset: 0; }
  .tl-board .tl-trp.t-none::before { background: linear-gradient(90deg, var(--acc) 0 49.5%, var(--line) 49.5% 50.5%, var(--sub) 50.5% 100%); }
  .tl-board .tl-trp.t-fade::before { background: linear-gradient(90deg, var(--acc), var(--acc2) 46%, var(--sub) 54%, var(--sub)); }
  .tl-board .tl-trp.t-zoom::before { background: var(--sub); }
  .tl-board .tl-trp.t-zoom::after { inset: 26% 34%; border-radius: var(--radius-4); background: var(--acc); }
  .tl-board .tl-trp.t-flash::before { background: linear-gradient(90deg, var(--acc) 0 40%, var(--on-acc) 50%, var(--sub) 60% 100%); }
  .tl-board .tl-trp.t-wipe-left::before { background: var(--sub); }
  .tl-board .tl-trp.t-wipe-left::after { background: linear-gradient(105deg, var(--acc) 0 40%, transparent 40% 100%); }
  .tl-board .tl-trp.t-wipe-up::before { background: var(--sub); }
  .tl-board .tl-trp.t-wipe-up::after { background: linear-gradient(0deg, var(--acc) 0 50%, transparent 50% 100%); }
  .tl-board .tl-trp.t-blur::before { background: linear-gradient(90deg, var(--acc), color-mix(in srgb, var(--acc) var(--a-50), var(--sub)) 40% 60%, var(--sub)); }
  .tl-board .tl-trp.t-split::before { background: linear-gradient(90deg, var(--acc) 0 32%, var(--input) 32% 36%, var(--sub) 36% 68%, var(--input) 68% 72%, var(--acc2) 72% 100%); }
  .tl-board .tl-trp.t-glitch::before { background: repeating-linear-gradient(0deg, var(--acc) 0 3px, var(--err) 3px 5px, var(--sub) 5px 9px); }
  .tl-board .tl-trp.t-glitch::after { inset: 40% 0; background: color-mix(in srgb, var(--media-bg) var(--a-50), transparent); }
  .tl-board .tl-pop-dur { display: flex; align-items: center; gap: var(--sp-8); margin-top: var(--sp-8);
    font-size: var(--fs-12); color: var(--sub); }
  .tl-board .tl-pop-dur.is-off { opacity: .45; }
  .tl-board .tl-pop-dur input[type=range] { flex: 1 1 auto; min-width: 0; accent-color: var(--pri); cursor: pointer; }
  .tl-board .tl-pop-dur em { flex: 0 0 auto; font-style: normal; color: var(--txt);
    font-variant-numeric: tabular-nums; }

  /* ---------------- 工具条上的计数角标 ---------------- */
  /* 「这一片有几枚标记 / 选中了几块」压在按钮右上角：按钮本身要说的是「这是干什么的」，
     数不在那儿读。0 时整块不画（由画它的那一句 hidden 决定），不留一个空圈。
     墨取掏出来的面板色而不是白 —— 实底是 `--acc`，深色档那一枚是**浅色**，白字压不住（只有 `--pri` 两档都深）。 */
  .tl-board .tl-badge { position: absolute; top: calc(-1 * var(--sp-2)); right: calc(-1 * var(--sp-2));
    min-width: 15px; height: 15px; padding: 0 var(--sp-4); border-radius: var(--radius-999);
    background: var(--acc); color: var(--panel); font-size: var(--fs-11); font-weight: 600;
    line-height: 15px; text-align: center; font-variant-numeric: tabular-nums; pointer-events: none; }
  .tl-board .tl-badge[hidden] { display: none; }

  /* ---------------- 块上的右键菜单（一条 = 一个动作） ---------------- */
  /* 挂在板上（不是 body）：它跟着板的位置走，滚动与重画都不用重新算落点；
     绝对定位的 left/top 由 `showCtx` 按点击处现写。 */
  .tl-board .tl-ctx { position: absolute; z-index: 95; min-width: 148px; padding: var(--sp-4);
    border: var(--hair) solid var(--line); border-radius: var(--radius-6); background: var(--panel);
    box-shadow: var(--shadow-2); display: flex; flex-direction: column; gap: var(--sp-2); }
  .tl-board .tl-ctx-row { display: flex; align-items: center; gap: var(--sp-8); padding: var(--sp-4) var(--sp-8);
    border: 0; border-radius: var(--radius-6); background: none; color: var(--txt);
    font-size: var(--fs-12); text-align: left; cursor: pointer; }
  .tl-board .tl-ctx-row:hover { background: var(--panel2); }
  .tl-board .tl-ctx-row:focus-visible { outline: var(--hair-2) solid var(--acc); outline-offset: calc(-1 * var(--sp-2)); }

  /* ---------------- 标记面板（工具条那颗 flag 展开的那一块） ---------------- */
  /* 就地浮在板右上角：它索引的是**这条时间线**上的标记，跳到哪一枚 = 把播放头挪过去。
     列表自己竖着滚（`.tl-mpanel-list`），面板整体不跟着长 —— 长出去就顶到轨道外面了。 */
  .tl-board .tl-mpanel { position: absolute; z-index: 94; top: var(--sp-8); right: var(--sp-8);
    width: 316px; max-height: calc(100% - var(--sp-16)); display: flex; flex-direction: column;
    border: var(--hair) solid var(--line); border-radius: var(--radius-10); background: var(--panel);
    box-shadow: var(--shadow-2); color: var(--txt); font-size: var(--fs-12); }
  .tl-board .tl-mpanel-head { display: flex; align-items: center; gap: var(--sp-8);
    padding: var(--sp-8) var(--sp-8); border-bottom: var(--hair) solid var(--line); }
  .tl-board .tl-mpanel-title { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: var(--sp-8);
    font-weight: 600; color: var(--txt); }
  .tl-board .tl-mpanel-search { display: flex; align-items: center; gap: var(--sp-8); color: var(--sub);
    padding: var(--sp-8) var(--sp-8); }
  .tl-board .tl-mpanel-search input { flex: 1 1 auto; min-width: 0; height: var(--sz-ctl);
    padding: 0 var(--sp-8); border: var(--hair) solid var(--line); border-radius: var(--radius-6);
    background: var(--input); color: var(--txt); font-size: var(--fs-12); }
  .tl-board .tl-mpanel-chips { display: flex; flex-wrap: wrap; gap: var(--sp-4); padding: 0 var(--sp-8) var(--sp-8); }
  .tl-board .tl-mpanel-list { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 0 var(--sp-8) var(--sp-8);
    display: flex; flex-direction: column; gap: var(--sp-2); scrollbar-width: thin; }
  .tl-board .tl-mpanel-list .empty { padding: var(--sp-8); }
  .tl-board .tl-mp-row { display: flex; align-items: center; gap: var(--sp-8); width: 100%; padding: var(--sp-4) var(--sp-8);
    border: var(--hair) solid transparent; border-radius: var(--radius-6); background: none; color: var(--txt);
    font-size: var(--fs-12); text-align: left; cursor: pointer; }
  .tl-board .tl-mp-row:hover { background: var(--panel2); }
  .tl-board .tl-mp-row.is-on { border-color: var(--acc); background: var(--acc-tint-10); }
  .tl-board .tl-mp-ic { flex: 0 0 auto; display: inline-flex; color: var(--mc); }
  .tl-board .tl-mp-name { flex: 1 1 auto; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .tl-board .tl-mp-time { flex: 0 0 auto; color: var(--sub); font-variant-numeric: tabular-nums; }
  .tl-board .tl-mpanel-detail { display: flex; flex-direction: column; gap: var(--sp-8);
    padding: var(--sp-8) var(--sp-8); border-top: var(--hair) solid var(--line); }
  .tl-board .tl-mp-field { display: flex; align-items: center; gap: var(--sp-8); }
  .tl-board .tl-mp-field > span { flex: 0 0 44px; color: var(--sub); }
  .tl-board .tl-mp-field input, .tl-board .tl-mp-field textarea { flex: 1 1 auto; min-width: 0;
    padding: 0 var(--sp-8); border: var(--hair) solid var(--line); border-radius: var(--radius-6);
    background: var(--input); color: var(--txt); font-size: var(--fs-12); font-family: inherit; }
  .tl-board .tl-mp-field input { height: var(--sz-ctl); }
  .tl-board .tl-mp-field textarea { padding: var(--sp-4) var(--sp-8); resize: vertical; }
  .tl-board .tl-mp-field input[type=number] { font-variant-numeric: tabular-nums; }
  .tl-board .tl-mp-types, .tl-board .tl-mp-colors { display: flex; flex-wrap: wrap; gap: var(--sp-4); align-items: center; }
  .tl-board .tl-mp-chip { display: inline-flex; align-items: center; gap: var(--sp-4); padding: var(--sp-4) var(--sp-8);
    border: var(--hair) solid var(--line); border-radius: var(--radius-999); background: none; color: var(--sub);
    font-size: var(--fs-11); cursor: pointer; white-space: nowrap; }
  .tl-board .tl-mp-chip:hover { color: var(--txt); border-color: color-mix(in srgb, var(--acc) var(--a-60), transparent); }
  .tl-board .tl-mp-chip.is-on { color: var(--acc); border-color: var(--acc); background: var(--acc-tint-10); }
  .tl-board .tl-mp-chip.is-danger:hover { color: var(--err); border-color: var(--err); }
  .tl-board .tl-mp-color { width: 18px; height: 18px; padding: 0; border-radius: var(--radius-999);
    border: var(--hair) solid var(--line); background: var(--mc); cursor: pointer; }
  .tl-board .tl-mp-color.is-on { box-shadow: 0 0 0 var(--hair-2) var(--acc); }
  .tl-board .tl-mp-acts { display: flex; align-items: center; gap: var(--sp-4); }
  .tl-board .tl-mpanel-foot { display: flex; align-items: center; gap: var(--sp-4);
    padding: var(--sp-8) var(--sp-8); border-top: var(--hair) solid var(--line); }
  .tl-board .tl-mp-sum { color: var(--sub); font-size: var(--fs-11); white-space: nowrap; }

</style>
<body>

<div class="page-main">
<header class="phead">
  <div class="phead-id">
    <h1 class="phead-h1">导演台</h1>
  </div>
  <div class="phead-meta">
    <div class="phead-proj">
      <button type="button" class="phead-chip" id="projSwitch"><span data-icon="film" data-size="13"></span> <span id="projLabel">未命名短片</span> <span data-icon="chevronDown" data-size="11"></span></button>
      <div id="projMenu" hidden style="position:absolute;top:calc(100% + var(--sp-8));left:0;background:var(--panel);border:var(--hair) solid var(--line);border-radius:var(--radius-4);min-width:250px;z-index:80;box-shadow:var(--shadow-4);padding:var(--sp-8)"></div>
    </div>
    <span class="saved" id="saveState">已保存</span>
  </div>
  <span class="phead-sub"></span>
  <div class="phead-acts">
    <!-- 普通提示就写在这行小字里，几秒后淡出：不再每点一下都弹浮层 -->
    <span class="opstate" id="opState"></span>
    <!-- 导出入口只剩中栏的「导入视频 / 素材」（同一份 AssetPicker）。
         导出出口（成片 / FCPXML / 媒体包 / 工程目录）由 web/domain/export-formats.js 那张表现画现绑：
         一颗拆分按钮 —— 主钮「导出成片」，尾部 chevron 的浮层里收其余三种去向。
         这里只有**导出**，没有任何「播放」：看效果走剪辑态那条轨的实时预览。 -->
    <span id="exportBtns"></span>
  </div>
  <input type="file" id="importMediaFile" accept="video/mp4,video/quicktime,video/webm,video/x-matroska" hidden>
  <!-- 项目文件（完整工程 .json）的入口挂在 #projMenu 里，选择器本体放菜单外：
       菜单每次会整栏重画，放在里面会把还没读的那个 input 一起冲掉。 -->
  <input type="file" id="projPackFile" accept=".json,application/json" hidden>
</header>
<div id="banner" hidden></div>   <!-- 出错 / 异常时才出现；内容由 web/ui/ui.js 的 ErrBanner 写，样式在 ui.css -->

<div class="layout">
  <div class="col col-left">
    <div class="left-head">
      <b>分镜 <span id="scCount">0</span></b>
      <button class="script-btn sec" id="scriptEditBtn" title="台词在剪辑右栏「台词」那一档改"><span data-icon="docTab" data-size="13"></span> 剧本</button>
      <button class="script-btn" id="scriptBtn" title="AI 分镜：拆新的 / 改现有 / 接着往下拆"><span data-icon="docTab" data-size="13"></span> 拆分镜</button>
    </div>
    <div id="scenesBox"></div>
    <!-- 剪辑态左栏：历史编辑记录 + 素材入口（renderScenes 按剪辑模式翻显隐） -->
    <div id="editLeft" hidden></div>
    <button class="add-scene" id="addScene">＋ 加一个场景</button>
    <div class="gen-all">
      <button class="pri" id="genAll">生成全部分镜</button>
      <!-- 左栏状态区只有一条进度条：完成量看条的填充，不写文案。
           按钮的文案与可用状态跟生成计划**同一份**（genAllPlan）—— 计划一变，两处一起变，
           不会出现「写着可生成 2 镜，按钮却说是全部」。 -->
      <div class="gen-all-status">
        <div class="gen-all-prog" id="genAllProg" hidden><i><b></b></i></div>
      </div>
      <div id="genAllRaw" hidden></div>
    </div>
  </div>

  <!-- 中栏分两段：`.mid-body` 是整片重画的那一层（播放器 / 候选条 / 动作行 / 总长），
       `.shot-strip-host` 是**常驻**的镜头顺序条 —— 它不进重画，高度按内容封顶。 -->
  <div class="col col-mid" id="midCol">
    <div class="mid-body" id="midBody"></div>
    <div class="shot-strip-host" id="shotStripHost" hidden>
      <div class="shot-strip" id="shotStrip"></div>
    </div>
  </div>

  <div class="col col-right" id="edCol"></div>
</div>

<!-- 剪辑态时间线板：铺满页面宽度的底栏。顶部那根把手由公共件 Wb.split 生成（与左右栏同一套：
     同样的外观、悬停光标、双击复位、落盘口径），拖它把上面三栏顶矮。
     板面整块由 `web/director/engine/timeline.js` 现画（工具条 / 刻度尺 / 标尺层 / 轨道 / 弹层），
     生成态整块 hidden —— 三栏布局两种模式同一份，视频栏定高不动。 -->
<div class="tl-board" id="tlBoard" hidden>
  <!-- 板里那一整套由 Timeline.render() 整块重画；把手是 Wb.split 插在 .tl-board 上的第一个子节点，
       必须住在被重画的那一层**外面**（否则每次重画都把它抹掉）。 -->
  <div class="tl-board-in" id="tlBoardBody"></div>
</div>

<dialog class="script" id="scriptDlg">
  <b style="font-size:var(--fs-14)">粘贴剧本，一键拆分镜</b>
  <div class="tip">每行会变成一个分镜；以「#」开头的行作为场景名。</div>
  <textarea id="scriptText" placeholder="第一镜的描述…
第二镜的描述…
…"></textarea>
  <div class="script-row">
    <button class="ghost" id="scriptCancel">取消</button>
    <button class="pri" id="scriptOk" style="padding:var(--sp-8) var(--sp-16)">拆分</button>
  </div>
</dialog>


</body>
