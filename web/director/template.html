  #mentionSub { position: fixed; z-index: 62; width: 272px; max-height: 300px; overflow-y: auto;
    background: var(--panel); border: var(--hair) solid var(--line); border-radius: var(--radius-6); box-shadow: 0 10px 28px color-mix(in srgb, var(--dir-ink-8) var(--a-16), transparent); padding: var(--sp-4); }
  #mentionSub .ms-h { padding: var(--sp-5) var(--sp-8) var(--sp-4); font-size: var(--fs-11); color: var(--sub); }
  #mentionSub .ms-i { display: flex; align-items: center; gap: var(--sp-8); padding: var(--sp-5) var(--sp-8); border-radius: var(--radius-4); cursor: pointer; }
  #mentionSub .ms-i:hover { background: var(--panel2); }
  #mentionSub .ms-t { width: 34px; height: 34px; flex: 0 0 34px; border-radius: var(--radius-4); overflow: hidden;
    background: var(--thumbbg); display: flex; align-items: center; justify-content: center; color: var(--sub); }
  #mentionSub .ms-t img { width: 100%; height: 100%; object-fit: cover; display: block; }
  #mentionSub .ms-n { flex: 1; min-width: 0; font-size: var(--fs-12-5); color: var(--txt); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #mentionSub .ms-k { flex: 0 0 auto; font-size: var(--fs-10-5); color: var(--sub); }

  /* 输入框右上角那颗 `@素材`：底色加深，一眼看得出是个入口 */
  .ed-label .at-btn { font-size: var(--fs-12); padding: var(--sp-3) var(--sp-10); margin-right: var(--sp-8); border-radius: var(--radius-12); cursor: pointer;
    color: var(--acc); background: color-mix(in srgb, var(--dir-indigo) var(--a-16), transparent); border: var(--hair) solid color-mix(in srgb, var(--dir-indigo) var(--a-35), transparent); }
  .ed-label .at-btn:hover { background: color-mix(in srgb, var(--dir-indigo) var(--a-28), transparent); }

  /* 「提到素材」那排芯片：底色加深；鼠标移上去弹一张预览（名字 + 图片）。
     预览朝**下**弹：编辑器那一列是 `overflow-y: auto`，朝上会被列的上边缘裁掉。 */
  .mchips { display: flex; flex-wrap: wrap; gap: var(--sp-6); margin-top: var(--sp-6); }
  .mchip { position: relative; display: inline-flex; align-items: center; gap: var(--sp-6); padding: var(--sp-3) var(--sp-10) var(--sp-3) var(--sp-4);
    border-radius: var(--radius-12); cursor: pointer; color: var(--acc);
    background: color-mix(in srgb, var(--dir-indigo) var(--a-16), transparent); border: var(--hair) solid color-mix(in srgb, var(--dir-indigo) var(--a-34), transparent); }
  .mchip:hover { background: color-mix(in srgb, var(--dir-indigo) var(--a-30), transparent); }
  .mchip > img { width: 20px; height: 20px; border-radius: 50%; object-fit: cover; display: block; background: var(--thumbbg); }
  .mchip .mn { font-size: var(--fs-12); max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mchip .peek { display: none; position: absolute; left: 0; top: calc(100% + var(--sp-6)); z-index: 62; padding: var(--sp-6);
    border-radius: var(--radius-6); background: var(--panel); border: var(--hair) solid var(--line);
    box-shadow: 0 10px 24px color-mix(in srgb, var(--dir-ink-8) var(--a-18), transparent); text-align: center; }
  .mchip:hover .peek { display: block; }
  .mchip .peek img { width: 132px; height: 132px; object-fit: cover; border-radius: var(--radius-4); display: block; background: var(--thumbbg); }
  .mchip .peek b { display: block; margin-top: var(--sp-5); font-size: var(--fs-12); color: var(--txt); font-weight: 600; }
  .mchip .peek i { display: block; font-style: normal; font-size: var(--fs-10-5); color: var(--sub); }
  .polish { font-size: var(--fs-12); color: var(--acc); background: color-mix(in srgb, var(--dir-indigo) var(--a-8), transparent); border: var(--hair) solid color-mix(in srgb, var(--dir-indigo) var(--a-30), transparent); border-radius: var(--radius-4); padding: var(--sp-6) var(--sp-12); cursor: pointer; margin-bottom: var(--sp-12); }
  /* 提示词下方那行动作按钮用 ui.css 的 .btn-row / .tool（与三个工作台同一套），这里不再另立一套 */
  /* 素材槽位的样式（.assets-grid / .asset-slot / .rvthumb / 互斥禁用）已收进 ui.css，生成工作台同用 */
  .ed-footer { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-10); margin-top: var(--sp-16); padding-top: var(--sp-12); border-top: var(--hair) solid var(--line); }
  .ed-footer .can { font-size: var(--fs-12); color: var(--ok); }
  .ed-footer .can.no { color: var(--warn); }
  .ed-footer .pri { padding: var(--sp-10) var(--sp-20); font-size: var(--fs-14); }
  .ed-footer .est { font-size: var(--fs-11-5); color: var(--sub); margin-right: auto; }
  .ed-raw { margin-top: var(--sp-8); }
  /* 接上一镜尾帧：勾选条与首帧槽里的占位。槽位本体仍用 ui.css 的 .asset-slot，

  .chain-row { display: flex; align-items: center; gap: var(--sp-8); margin: var(--sp-4) 0 var(--sp-8);
    padding: var(--sp-4) var(--sp-8); border: var(--hair) dashed var(--line); border-radius: var(--radius-6);
    font-size: var(--fs-12); color: var(--sub); cursor: pointer; }
  .chain-row.on { border-style: solid; border-color: var(--acc); color: var(--txt); background: color-mix(in srgb, var(--dir-indigo) var(--a-8), transparent); }

  .chain-row.on em { color: var(--acc); }

  .asset-slot.chain { border-style: solid; border-color: var(--acc); color: var(--acc); }
  .asset-slot .chain-ops { display: flex; gap: var(--sp-4); margin-top: var(--sp-4); }
  .asset-slot .chain-ops .mini { padding: var(--sp-2) var(--sp-6); font-size: var(--fs-10-5); }
  .hint { font-size: var(--fs-11); color: var(--sub); margin-top: var(--sp-8); }
  /* #lbCount / #lbBar 的样式统一在 ui.css 的灯箱那一段 */
  dialog.script { background: var(--panel); color: var(--txt); border: var(--hair) solid var(--line); border-radius: var(--radius-4); padding: var(--sp-20); width: 520px; max-width: 92vw; margin: auto; }
  dialog.script::backdrop { background: color-mix(in srgb, var(--media-bg) var(--a-60), transparent); }
  dialog.script textarea { width: 100%; height: 200px; background: var(--input); border: var(--hair) solid var(--line); border-radius: var(--radius-3); color: var(--txt); font-size: var(--fs-13); padding: var(--sp-10); font-family: inherit; resize: vertical; }
  dialog.script .tip { font-size: var(--fs-11-5); color: var(--sub); margin: var(--sp-8) 0 var(--sp-12); }
  .script-row { display: flex; gap: var(--sp-8); justify-content: flex-end; }
  /* 小图标按钮：与图片工作台的 .ghost 同一套观感（透明底 + 细描边 + 悬停主题色） */
  .op-btn { display: inline-flex; align-items: center; justify-content: center; height: 26px; min-width: 26px; padding: 0 var(--sp-6);
    border: var(--hair) solid var(--line); border-radius: var(--radius-4); background: none; color: var(--sub);
    font-size: var(--fs-12); line-height: 1; cursor: pointer; user-select: none; transition: all var(--dur-150); }
  .op-btn:hover { border-color: var(--acc); color: var(--acc); }
  .op-btn.danger:hover { border-color: var(--err); color: var(--err); }
  .op-btn.armed { border-color: var(--err); color: var(--err); background: color-mix(in srgb, var(--dir-red-2) var(--a-8), transparent); width: auto; }
  .op-btn.grip { cursor: grab; }
  .op-btn.grip:active { cursor: grabbing; }
  .op-btn.addshot { height: 26px; padding: 0 var(--sp-12); font-size: var(--fs-12); flex: 0 0 auto; white-space: nowrap; }
  .op-btn.addshot:hover { border-color: var(--ok); color: var(--ok); }

</style>
<body>

<div class="page-main">
<header>
  <span class="brand">导演台</span>
  <div style="position:relative">
    <span class="tab" id="projSwitch" style="cursor:pointer"><span data-icon="film" data-size="13"></span> 我的短片 <b id="projCount">1</b> <span data-icon="chevronDown" data-size="11"></span></span>
    <div id="projMenu" hidden style="position:absolute;top:calc(100% + var(--sp-8));left:0;background:var(--panel);border:var(--hair) solid var(--line);border-radius:var(--radius-4);min-width:250px;z-index:80;box-shadow:var(--shadow-16);padding:var(--sp-6)"></div>
  </div>
  <input class="pname" id="projName" value="新项目">
  <span class="saved" id="saveState">已保存</span>
  <!-- 普通提示就写在这行小字里，几秒后淡出：不再每点一下都弹浮层 -->
  <span class="opstate" id="opState"></span>
  <span class="sp"></span>
  <!-- 导入侧两块：FCPXML 项目 / 最近导出里找回那一份。
       本机视频与资产库素材都走中栏的「导入视频 / 素材」（同一份 AssetPicker），页头不再并排。
       旧「导入项目 / 导出项目」（JSON 引用清单）已按 2026-10 用户要求删掉：
       项目进出统一走 FCPXML，换机时素材用「导出媒体包」。 -->
  <button class="ghost" id="importFcpBtn" title="导入 Final Cut Pro / 达芬奇导出的 FCPXML：保留镜头顺序、入出点、倍速、配音位置与字幕；本机资产库认得出的素材直接接上，第三方外链导入后自动存一份到本机"><span data-icon="upload" data-size="13"></span> 导入 FCPXML</button>
  <input type="file" id="importFcpFile" accept=".fcpxml,.xml,application/xml,text/xml" hidden>
  <button class="ghost" id="recentExportsBtn" title="最近 50 次导出：下载，或复制一份到本机资产库"><span data-icon="clock" data-size="13"></span> 最近导出</button>
  <!-- 导出出口（成片 / 素材 / FCPXML / 媒体包）由 web/domain/export-formats.js 那张表现画现绑：
       按钮文字、图标、title、顺序全在表里，加一种导出不再动这里。
       这里只有**导出**，没有任何「播放」：看效果走剪辑 → 全片那一排的实时预览。 -->
  <span id="exportBtns"></span>
  <input type="file" id="importMediaFile" accept="video/mp4,video/quicktime,video/webm,video/x-matroska" hidden>
</header>
<div id="banner" hidden></div>   <!-- 出错 / 异常时才出现；内容由 web/ui/ui.js 的 ErrBanner 写，样式在 ui.css -->

<div class="layout">
  <div class="col col-left">
    <div class="left-head">
      <b>分镜 <span id="scCount">0</span></b>
      <button class="script-btn sec" id="scriptEditBtn" title="剧本：每一镜的画面写成一份可编辑的稿子；台词不在这里，在剪辑右栏「台词」那一档改"><span data-icon="docTab" data-size="13"></span> 剧本</button>
      <button class="script-btn" id="scriptBtn" title="AI 分镜：贴剧本拆一份新的 / 对着现有分镜说一句话让它改 / 接着往下拆"><span data-icon="docTab" data-size="13"></span> 拆分镜</button>
    </div>
    <div id="scenesBox"></div>
    <button class="add-scene" id="addScene">＋ 加一个场景</button>
    <div class="gen-all">
      <button class="pri" id="genAll">生成全部分镜</button>
      <div class="gen-all-est" id="genAllEst" hidden></div>
      <div class="note" id="genAllNote"></div>
      <div id="genAllRaw" hidden></div>
    </div>
  </div>

  <div class="col col-mid" id="midCol"></div>

  <div class="col col-right" id="edCol"></div>
</div>

<dialog class="script" id="scriptDlg">
  <b style="font-size:var(--fs-14)">粘贴剧本，一键拆分镜</b>
  <div class="tip">每行会变成一个分镜；以「#」开头的行作为场景名。</div>
  <textarea id="scriptText" placeholder="第一镜的描述…
第二镜的描述…
…"></textarea>
  <div class="script-row">
    <button class="ghost" id="scriptCancel">取消</button>
    <button class="pri" id="scriptOk" style="padding:var(--sp-8) var(--sp-18)">拆分</button>
  </div>
</dialog>


</body>
