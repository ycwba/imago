<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>视频工作台 · 拾帧</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem('dir_theme')||'light'}catch(e){}</script>
<link rel="stylesheet" href="ui.css">
<style>
  :root {
    --bg:#f2f3f9; --panel:#ffffff; --panel2:#f3f4f9; --line:#e4e6f0;
    --txt:#23262f; --sub:#8a8fa3; --acc:#6957e8; --acc2:#8b5cf6; --ok:#16a34a; --err:#dc2626; --pri:#7c5cff; --input:#f6f7fb;
  }
  html[data-theme="dark"] {
    --bg:#0b0d13; --panel:#141722; --panel2:#191d2b; --line:#262b3d;
    --txt:#eef0f6; --sub:#8f97ab; --acc:#6c8cff; --acc2:#a06cff; --ok:#4ade80; --err:#ff7a7a; --input:#0f1219;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(900px 500px at 85% -5%, rgba(108,140,255,.14), transparent 60%),
      radial-gradient(700px 500px at -10% 100%, rgba(160,108,255,.10), transparent 60%),
      var(--bg);
    color: var(--txt); min-height: 100vh;
  }
  header {
    position: sticky; top: 0; z-index: 5; backdrop-filter: blur(12px);
    background: var(--panel); border-bottom: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between;
    padding: 13px 28px;
  }
  .logo { font-size: 17px; font-weight: 700; letter-spacing: .4px; }
  .logo em { font-style: normal; background: linear-gradient(90deg, var(--acc), var(--acc2));
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  .refresh { width: 22px; height: 22px; padding: 0; border: 0; border-radius: 50%;
    background: transparent; color: var(--sub); font-size: 13px; cursor: pointer;
    transition: transform .5s, color .15s; line-height: 22px; }
  .refresh:hover { color: var(--acc); }
  /* 两栏布局（.layout / .col-left / .col-right #result / 滚动条）在 ui.css 的
     「工作台共用布局」里统一定义：三页必须同宽，不要在这里再抄一份。 */
  /* 更窄的窗口：收紧留白、缩小磁贴与缩略图，卡片动作换行更好点
     （.btn-row / .tool 的窄屏收敛在 ui.css 里，三台一起） */
  @media (max-width: 720px) {
    textarea { min-height: 118px; font-size: 13.5px; }
    .mat { width: 54px; height: 54px; }
    .thumb { width: 56px; height: 56px; }
    .pinl { padding: 8px; }
    .pinl-ft { gap: 6px; }
    .task .acts { gap: 6px; }
    .task .acts .ghost { padding: 5px 9px; font-size: 11.5px; }
  }

  /* ---- 左栏 ---- */
  .prompt-box { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 6px 0; transition: border-color .15s; }
  .prompt-box.over { border-color: var(--acc); }
  textarea { width: 100%; min-height: 150px; padding: 12px; background: transparent; color: var(--txt);
    border: 0; border-radius: 8px; font-size: 14px; font-family: inherit; outline: none; resize: vertical; }
  /* .btn-row / .tool 动作磁贴行统一在 ui.css（三台同款同尺寸） */
  .thumbs { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 6px 10px; }
  .thumbs:empty { display: none; }
  .thumb { position: relative; width: 60px; height: 60px; border-radius: 6px; overflow: hidden;
    border: 1px solid var(--line); transition: transform .12s, border-color .12s; }
  .thumb:hover { border-color: var(--acc); transform: translateY(-2px); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
  .thumb .rank { position: absolute; left: 3px; top: 3px; padding: 0 5px; border-radius: 4px;
    background: rgba(0,0,0,.7); color: #fff; font-size: 10px; line-height: 15px; }
  .thumb button { position: absolute; top: 2px; right: 2px; width: 16px; height: 16px; padding: 0;
    border: 0; border-radius: 50%; background: rgba(0,0,0,.65); color: #fff; font-size: 10px;
    line-height: 16px; cursor: pointer; }

  .adv { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; margin-top: 16px; }
  .adv-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; cursor: pointer; user-select: none; }
  .adv-head h2 { font-size: 13.5px; font-weight: 600; }
  .adv-head .sum { font-size: 12px; color: var(--sub); display: flex; align-items: center; gap: 6px; }
  .adv-head .chev { transition: transform .2s; color: var(--sub); font-size: 11px; }
  .adv.closed .chev { transform: rotate(-90deg); }
  .adv.closed .adv-body { display: none; }
  .adv-body { padding: 4px 16px 16px; border-top: 1px solid var(--line); }
  /* 素材行：动作磁贴下面一排，一个素材一块（见 ui.css 的 .mat） */
  #inputArea { padding: 0 6px 10px; }
  #inputArea:empty { display: none; }

  label { display: block; font-size: 12px; color: var(--sub); margin: 12px 0 5px; }
  select, input { width: 100%; padding: 9px 11px; background: var(--input); color: var(--txt);
    border: 1px solid var(--line); border-radius: 6px; font-size: 13.5px; font-family: inherit; outline: none;
    transition: border-color .15s; }
  select:focus, input:focus { border-color: var(--acc); }
  select { appearance: none; -webkit-appearance: none; cursor: pointer;
    background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%238f97ab' stroke-width='1.6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E");
    background-repeat: no-repeat; background-position: right 11px center; padding-right: 28px; }
  select option { background: var(--panel2); color: var(--txt); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .costbar { display: flex; justify-content: space-between; align-items: center; margin-top: 16px;
    padding: 10px 13px; background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; font-size: 12.5px; }
  .costbar b { color: var(--acc); font-size: 14px; }
  .costbar .note { color: var(--sub); font-size: 11.5px; }
  /* 生成按钮、#status、#goWhy 的样式在 ui.css 的「工作台共用布局」里（三页一份），这里不再抄 */
  .err { color: var(--err); } .ok { color: var(--ok); }

  /* ---- 右栏：任务列表 ----
     .tasks-head / .tab / .sp / .pginfo / .pgroup 用 ui.css 那一份（三台共用，数值一致） */
  .task { display: flex; gap: 13px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; padding: 12px; margin-bottom: 12px;
    transition: border-color .15s, box-shadow .15s, transform .12s; }
  .task:hover { border-color: var(--acc); box-shadow: 0 4px 16px rgba(0,0,0,.07); transform: translateY(-1px); }
  .task .timg { width: 160px; height: 96px; border-radius: 6px; overflow: hidden; flex: 0 0 auto;
    background: var(--panel2); cursor: zoom-in; display: flex; flex-direction: column;
    align-items: center; justify-content: center; color: var(--sub); font-size: 11px; align-self: flex-start;
    border: 1px solid var(--line); }
  .task .timg video { width: 100%; height: 100%; object-fit: cover; }
  .task .tmain { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .task .meta1 { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--sub); }
  .task .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); display: inline-block; }
  .task .dot.run { background: #fbbf24; animation: blink 1.2s infinite; }
  .task .dot.fail { background: var(--err); }
  @keyframes blink { 50% { opacity: .3; } }
  .spin-dot { width: 18px; height: 18px; border: 2px solid #c4c9dc; border-top-color: var(--acc);
    border-radius: 50%; animation: rot .8s linear infinite; display: inline-block; margin-bottom: 4px; }
  @keyframes rot { to { transform: rotate(360deg); } }
  .task .date { margin-left: auto; }
  .task .tprompt { font-size: 13px; line-height: 1.5; margin: 5px 0; color: var(--txt); cursor: pointer;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .task .tprompt:hover { color: var(--acc); }
  /* 失败原因（创建失败 / 中断 / 平台报错）：直接写在卡片上，不用点开详情才看得到 */
  .task .terr { font-size: 11.5px; line-height: 1.45; color: var(--err); margin: -2px 0 5px; word-break: break-word;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .task .meta2 { font-size: 12px; color: var(--sub); }
  .task .acts { margin-top: auto; display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
  .task .acts .ghost { padding: 5px 13px; border-radius: 6px; }
  .empty { color: var(--sub); font-size: 13px; text-align: center; padding: 70px 0; }
  /* 详情展开：中性配色（不要强调色，避免“加紫色元素”） */
  .tdetail { border: 1px solid var(--line); margin-top: 10px; padding: 9px 12px;
    background: var(--panel2); border-radius: 6px;
    font-size: 12.5px; color: var(--sub); white-space: pre-wrap; word-break: break-all; line-height: 1.7; }
  .lib-tip { font-size: 12px; color: var(--sub); }

        .ver { font-size: 10.5px; color: var(--sub); opacity: .5; text-align: center; padding: 6px 0 18px; }
  /* 灯箱等公共组件样式统一来自 ui.css */
</style>
<script src="ui.js"></script>
<script src="workbench.js"></script>
<script src="assetlib.js"></script>
<script src="sidebar.js"></script>
</head>
<body class="wb2">
<div class="page-main">
<div class="layout">
  <!-- 左栏 -->
  <div class="col-left">
    <div class="prompt-box" id="promptBox">
      <textarea id="prompt" placeholder="描述这一段视频的画面、镜头运动与氛围…" title="下方小方块可上传素材（参考图 / 首尾帧 / 参考视频 / 音频，随所选模型变化）"></textarea>
      <div class="btn-row">
        <!-- 动作行：主操作靠左，危险动作「一键清空」用 .sp 顶到行尾（免得和主操作并排误点）；润色结果就地展开在素材行下面 -->
        <button class="tool acc" id="polishBtn" title="调用文字AI改写提示词（密钥在「设置」配置）"><span class="ic" data-icon="sparkles" data-size="14"></span>AI 润色</button>
        <span class="sp"></span>
        <button class="tool danger" id="clearRefs" title="清空提示词与已选参考素材"><span class="ic" data-icon="trash" data-size="14"></span>一键清空</button>
      </div>
      <!-- 素材行：一个素材一块缩略图，后面跟该类型的「＋」（随所选模型的能力出现） -->
      <div class="slot-row mat-row" id="inputArea"></div>
      <div id="polishInline" hidden></div>
    </div>

    <div class="adv" id="adv">
      <div class="adv-head" id="advHead">
        <h2><span data-icon="gear" data-size="14"></span> 高级设置</h2>
        <span class="sum"><span id="advSum"></span><span class="chev">▼</span></span>
      </div>
      <div class="adv-body">
        <!-- 参数按模型能力动态出现：没声明的项不渲染（见 renderParamOptions） -->
        <div class="adv-grid">
          <div><label>模型</label><select id="model"></select></div>
          <div id="tierWrap"><label>档位</label><select id="tier"></select></div>
          <div id="resWrap"><label>画质</label><select id="res"></select></div>
          <div id="durWrap"><label>时长（秒）</label><select id="dur"></select></div>
          <div id="arWrap"><label>画面比例</label><select id="ar"></select></div>
        </div>
        <div class="adv-grid" style="margin-top:10px">
          <div><label>生成条数</label><select id="draw"></select></div>
        </div>
        <!-- 布尔参数（如「生成音频」）：模型在能力声明里写了才出现，选项是开/关 -->
        <div class="adv-grid" style="margin-top:10px" id="boolRows"></div>
        <div class="hint" id="capHint" style="display:none;font-size:11.5px;color:var(--sub);margin-top:8px"></div>
      </div>
    </div>

    <div class="costbar"><span id="costTxt">估价中…</span><span class="note" id="mode">文生视频</span></div>
    <button class="go" id="go">生成视频</button>
    <div class="hint" id="goWhy"></div>
    <div id="status"></div>
    <!-- 提交还在等平台响应时的提示（含秒数与「仍然再提交」）。**不用遮罩弹窗**：
         状态行 #status 谁都可能写，这块只由 renderPendingHint 写，互不抢 -->
    <div class="hint" id="pendingHint" style="display:none;font-size:11.5px;margin-top:6px"></div>
  </div>

  <!-- 右栏 -->
  <div class="col-right">
    <div class="tasks-head">
      <span class="tab">我的任务</span>
      <span class="sp"></span>
      <span class="pgroup">
        <input id="searchBox" placeholder="搜索提示词 / ID" autocomplete="off" spellcheck="false">
        <button class="ghost" id="searchBtn">搜索</button>
        <span class="pgsep"></span>
        <button class="ghost" id="pgPrev" style="display:none">‹ 上一页</button>
        <span class="pginfo" id="pgInfo">第 1 页</span>
        <button class="ghost" id="pgNext" style="display:none">下一页 ›</button>
        <input type="number" id="gotoPage" min="1" placeholder="跳页">
        <button class="ghost" id="gotoBtn">跳转</button>
        <!-- 刷新和翻页是一组动作（都只影响这一屏列表），放同一个组里才不会因为换行被拆成两行 -->
        <button class="ghost" id="sync" title="重新从平台取回这一屏列表"><span data-icon="refresh" data-size="13"></span> 刷新</button>
      </span>
    </div>
    <div id="result"></div>
  </div>
</div>

<!-- 灯箱 DOM 由 workbench.js 的 Wb.lightbox 创建（结构全站一份）-->
<div class="ver">视频工作台 · 与图片工作台同款 · 经本地代理 · 详情走路由</div>

<script>
'use strict';
const $ = id => document.getElementById(id);
const fmtMicros = m => '¥' + (Number(m || 0) / 1e6).toFixed(2);
const TIER_ZH = { fast: '快速', standard: '标准', enhanced: '增强', quality: '品质' };
const ST_ZH = Wb.ST;   // 状态文案统一由 workbench.js 提供（三台一致）
const QZ = { draft: '草稿', standard: '标准', final: '精修' };
let REG = { providers: [] };

/* ============ 模型输入（参考图 / 参考视频 / 参考音频 / 首帧 / 尾帧）============
   能上传什么由「当前模型的能力」决定：
     · SparkCine 走 /models 接口的真实声明（inputs 的 role / media_type / max）
     · 其他平台回退到 registry 里声明的 modes
   每个入口都走同一份统一选择器（资产库 / 我的收藏 / 本地上传三个档位）；拖文件进输入框也收。        */
const fileToDataURL = f => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(f); });
/* 已选素材的显示地址：外链（资产库里的签名地址）走本地 /getv 路由，本地资产 / DataURL 原样 */
const mediaOf = it => ((window.Api && Api.mediaSrc) ? Api.mediaSrc((it && (it.src || it.url)) || '') : ((it && (it.src || it.url)) || ''));
const srcToDataURL = async src => {
  // 外链统一经本地代理取回（/getv 支持 Range），页面只碰同源地址
  const r = await fetch((window.Api && Api.mediaSrc) ? Api.mediaSrc(src) : src);
  if (!r.ok) throw new Error('素材读取失败 HTTP ' + r.status);
  return await fileToDataURL(await r.blob());
};
const ROLE_ZH = { first_frame: '首帧图', last_frame: '尾帧图', reference_image: '参考图', reference_video: '参考视频', reference_audio: '参考音频' };
const SLOT_DEF = {
  image:       { label: '参考图',   ic: icon('image', 14), accept: 'image/*', role: 'reference_image' },
  video:       { label: '参考视频', ic: icon('film', 14), accept: 'video/*', role: 'reference_video' },
  audio:       { label: '参考音频', ic: icon('mic', 14), accept: 'audio/*', role: 'reference_audio' },
  /* 首帧槽位也能直接选视频：自动取该视频的**最后一帧**当首帧图
     （「把已有视频接着往下生成」的常见做法）。videoFrame 声明选视频时取哪一帧；
     没声明 videoFrame 的槽位只收图片。抓帧全在浏览器里做（见 Wb.vframe）。 */
  frame_first: { label: '首帧图',   ic: '⏮', accept: 'image/*,video/*', role: 'first_frame', videoFrame: 'last',
    hint: '图片；选视频则取其最后一帧' },
  frame_last:  { label: '尾帧图',   ic: '⏭', accept: 'image/*', role: 'last_frame' },
};
/* ---------- 浏览器内取视频帧（首帧槽位选视频时用） ----------
   实现收敛在 workbench.js 的 Wb.vframe（导演台的「接上一镜尾帧」也用同一份）：
   <video> 解码 → seek → canvas 抓帧，不经过任何服务端；素材地址必须同源（外链统一走 /getv，同源且支持 Range），
   否则 canvas 被污染、抓帧会失败。这里只把返回项补上槽位 kind —— 取哪一帧由 SLOT_DEF 的 videoFrame 声明。 */
async function frameItemFromVideoFile(f, kind) {
  const it = await Wb.vframe.fromFile(f, (SLOT_DEF[kind] || {}).videoFrame || 'last');
  it.kind = kind;
  return it;
}
let inputs = { image: [], video: [], audio: [], frame_first: [], frame_last: [] };
let slots = [];              // 当前模型可用槽位 [{kind, max, role}]

/* 可用输入槽位 = 这个模型声明接受的输入 role（Capabilities.specs：registry 的 inputRoles 为准，
   能力接口补上限）。以前这里只看上游 /models 的 modes.inputs，于是「上游没声明的 role 就整个消失」
   —— 例如 SparkCine 视频只声明了 reference_image / reference_audio，首尾帧、参考视频的入口会不见。 */
const ROLE_KIND = { reference_image: 'image', reference_video: 'video', reference_audio: 'audio',
  first_frame: 'frame_first', last_frame: 'frame_last' };
function modelSlots() {
  const { model } = currentModel();
  const specs = (window.Capabilities && model) ? Capabilities.specs(model)
    : ((model && model.options && model.options.inputSpecs) || []);
  const merged = [];
  specs.forEach(sp => {
    const kind = ROLE_KIND[sp.role];
    if (!kind) return;
    const hit = merged.find(y => y.kind === kind);
    if (hit) hit.max = Math.max(hit.max, sp.max || 1);      // 同 kind 取更大上限
    /* accept / maxBytes 也是声明的一部分（平台收什么文件、单文件多大）：
       本地上传档位的 accept 与弹窗标题里的说明都跟着它走，页面不再写死 image/*、video/*。 */
    else merged.push({ kind, max: Math.max(1, sp.max || 1), role: sp.role, group: sp.group,
      accept: sp.accept || '', maxBytes: sp.maxBytes || 0 });
  });
  return merged;
}
/* 已经放进来、但当前模型不接受的素材（换模型后会遇到）：界面明说 + 拦住提交，不静默丢掉 */
function unsupportedKinds() {
  const have = new Set(slots.map(s => s.kind));
  return Object.keys(SLOT_DEF).filter(k => !have.has(k) && slotItems(k).length);
}
function slotItems(kind) { return inputs[kind] || (inputs[kind] = []); }
/* 槽位素材的 blob 地址（本地上传 / 视频取帧产生的）必须显式回收：
   以前增删几次就攒一堆 blob URL，图片/视频的解码结果一直挂在内存里。 */
function releaseItemUrl(it) {
  const u = it && it.url;
  if (u && String(u).startsWith('blob:')) { try { URL.revokeObjectURL(u); } catch (e) {} it.url = ''; }
}
function removeSlotItem(kind, i) {
  const arr = slotItems(kind);
  const hit = arr[i];
  if (!hit) return;
  arr.splice(i, 1);
  releaseItemUrl(hit);
}
function clearSlot(kind) {
  slotItems(kind).forEach(releaseItemUrl);
  inputs[kind] = [];
}
/* 占位文案只补一句「从素材行看不出来」的信息：当前模型一个素材槽都没有。
   有槽位时素材行本身就写着类型，不再把类型列表抄一遍到输入框里。 */
function updateInputHint() {
  const ta = $('prompt');
  if (!ta) return;
  ta.placeholder = slots.length
    ? '描述这一段视频的画面、镜头运动与氛围…'
    : '描述这一段视频的画面、镜头运动与氛围…（当前模型只支持纯文字生成，换模型可解锁参考素材）';
}

/* 互斥（同样来自模型能力声明，见 Capabilities）
   已经放了素材的那一组，与它互斥的槽位就点不动了；清空已选的那一组即可恢复。
   界面据此动态变化（例如参考图 ↔ 首尾帧：模型声明两者属于不同请求模式时只能二选一）。 */
function usedRoles() { return slots.filter(s => slotItems(s.kind).length).map(s => s.role).filter(Boolean); }
function blockedSlotKinds() {
  if (!window.Capabilities || !Capabilities.blockedRoles) return new Set();
  const blocked = Capabilities.blockedRoles(currentModel().model, usedRoles());
  return new Set(slots.filter(s => s.role && blocked.has(s.role)).map(s => s.kind));
}
function conflictHint(blockedKinds) {
  const label = k => SLOT_DEF[k].label;
  // 已经同时用上了互斥的两组（历史 / 导入数据）→ 先说这个，再说「哪些槽位被挡住」
  if (window.Capabilities) {
    const bad = Capabilities.illegalPairs(currentModel().model, usedRoles());
    if (bad.length) {
      return '已同时选了互斥的两组：' + bad.map(([a, b]) => '「' + (ROLE_ZH[a] || a) + ' + ' + (ROLE_ZH[b] || b) + '」').join('、')
        + '，本模型一次请求只能用一组，请清空其中一组';
    }
  }
  const blockers = slots.filter(s => slotItems(s.kind).length).map(s => label(s.kind));
  const blocked = slots.filter(s => blockedKinds.has(s.kind)).map(s => label(s.kind));
  return blocked.length
    ? `「${blockers.join(' / ')}」与「${blocked.join(' / ')}」不能同时使用（本模型声明一次请求只能选一组），清空后可切换`
    : '';
}
/* 互斥说明就地反馈：闪一下槽位旁那行说明（不用底部状态栏，更不用顶部横幅） */
let slotHintTimer = null;
function flashSlotHint(msg) {
  const el = document.querySelector('#inputArea .slot-hint');
  if (!el) { if (msg) setStatus('<span class="err">' + msg + '</span>'); return; }
  if (msg) el.textContent = msg;
  el.classList.remove('flash');
  void el.offsetWidth;
  el.classList.add('flash');
  clearTimeout(slotHintTimer);
  slotHintTimer = setTimeout(() => {
    el.classList.remove('flash');
    if (el.isConnected) el.textContent = conflictHint(blockedSlotKinds());
  }, 2400);
}

/* ---------- 复用（来自资产库的「复用」入口）----------
   把提示词与素材填进来：图片→参考图、视频→参考视频、音频→参考音频。
   若当前模型不支持该输入槽位，自动切换到支持它的模型。 */
function modelSupportsSlot(kind) {
  const { model } = currentModel ? currentModel() : { model: null };
  if (!model) return false;
  const role = (SLOT_DEF[kind] || {}).role;
  return Capabilities.specs(model).some(sp => sp.role === role);
}
function findModelWithSlot(kind) {
  const role = (SLOT_DEF[kind] || {}).role;
  for (const pr of (REG?.providers || []).filter(x => x.kind === 'video')) {
    for (const m of pr.models) {
      if (Capabilities.specs(m).some(sp => sp.role === role)) return { prov: pr, model: m };
    }
  }
  return null;
}
async function applyReuseFromAssets() {
  let p2 = null;
  try { p2 = JSON.parse(localStorage.getItem('sk_reuse') || 'null'); } catch {}
  if (!p2 || !p2.assetId && !p2.prompt) return;
  localStorage.removeItem('sk_reuse');
  if (p2.prompt) { $('prompt').value = p2.prompt; $('prompt').dispatchEvent(new Event('input')); }
  const kind = p2.kind === 'video' ? 'video' : p2.kind === 'audio' ? 'audio' : 'image';
  if (!p2.assetId) { setStatus('<span class="ok">✓ 已复用提示词</span>'); return; }
  // 当前模型不支持该槽位 → 自动换模型
  let swapped = '';
  if (!modelSupportsSlot(kind)) {
    const hit = findModelWithSlot(kind);
    if (!hit) {
      setStatus('<span class="err">当前平台没有支持「' + SLOT_DEF[kind].label + '」的模型，已只填入提示词</span>');
      return;
    }
    const sel = $('model');
    if (sel) {
      const val = hit.prov.id + '::' + hit.model.id;
      if ([...sel.options].some(o => o.value === val)) { sel.value = val; }
      else { sel.innerHTML = sel.innerHTML + `<option value="${esc(val)}">${esc(hit.prov.name)} · ${esc(hit.model.name)}</option>`; sel.value = val; }
      sel.dispatchEvent(new Event('change'));
      swapped = hit.model.name;
    }
  }
  slots = modelSlots();
  const sl = slots.find(x => x.kind === kind);
  if (!sl) { setStatus('<span class="err">切到的模型也不支持「' + SLOT_DEF[kind].label + '」，已只填入提示词</span>'); return; }
  const arr = slotItems(kind);
  if (arr.some(x => x.assetId === p2.assetId)) { setStatus('该素材已在「' + SLOT_DEF[kind].label + '」里'); return; }
  if (arr.length >= sl.max) { setStatus('<span class="err">' + SLOT_DEF[kind].label + '已满（最多 ' + sl.max + '）</span>'); return; }
  // 与已选素材互斥的槽位不能加（例如已选首尾帧时不能再加参考图）
  if (blockedSlotKinds().has(kind)) { flashSlotHint(SLOT_DEF[kind].label + '与已选素材互斥，无法加入；先清空已选素材再复用'); return; }
  arr.push({
    assetId: p2.assetId, url: '/asset/' + p2.assetId + '?v=2', src: '/asset/' + p2.assetId + '?v=2',
    name: (p2.prompt || '复用素材').slice(0, 14), type: p2.kind === 'video' ? '视频' : p2.kind === 'audio' ? '音频' : '图片',
    kind, fromLib: true,
  });
  renderInputArea();
  if (typeof updateMode === 'function') updateMode();
  setStatus('<span class="ok">✓ 已复用：提示词 + ' + SLOT_DEF[kind].label + (swapped ? '（原模型不支持，已自动切到 ' + swapped + '）' : '') + '</span>');
}

async function bootReuse() {
  try { await applyReuseFromAssets(); } catch (e) { setStatus('<span class="err">复用失败：' + e.message + '</span>'); }
}
function renderInputArea() {
  const area = $('inputArea');
  if (!area) return;
  closeSlotMenu();
  slots = modelSlots();
  updateInputHint();
  area.innerHTML = '';
  if (!slots.length) return;         // 输入框的 placeholder 已说明「当前模型只支持纯文字生成」，不再重复一行
  const blockedKinds = blockedSlotKinds();     // 与已选素材互斥的槽位（由模型能力声明推导）
  /* 一个素材一块缩略图：选了几张就看得见几张（图片 / 视频出画面，音频出图标），
     每种类型后面再跟一个「＋」添加块（点它 = 本地文件 / 资产库）。 */
  slots.forEach(sl => {
    const def = SLOT_DEF[sl.kind];
    const items = slotItems(sl.kind);
    const full = items.length >= sl.max;
    const blocked = blockedKinds.has(sl.kind);
    items.forEach((it, i) => {
      const b = document.createElement('div');
      b.className = 'mat' + (blocked ? ' blocked' : '');
      const cap = def.label + (items.length > 1 ? ' ' + (i + 1) : '');
      const name = it.name || (it.fromLib ? '资产库素材' : '本地文件');
      const fromVid = it.fromVideo ? '（取自视频《' + it.fromVideo + '》的' + (def.videoFrame === 'first' ? '第一帧' : '最后一帧') + '）' : '';
      b.title = cap + '：' + name + fromVid + '（点击管理这个槽位：移除 / 再加）';
      const media = it.type === '视频'
        ? Wb.thumbs.mediaHTML(mediaOf(it))
        : it.type === '音频' ? ''
          : Wb.thumbs.mediaHTML(mediaOf(it), { type: 'image', mediaAttrs: 'onerror="this.parentElement.classList.add(\'broken\')"' });
      b.innerHTML = media + (it.type === '音频' ? `<span class="ic">${icon('mic', 18)}</span>` : '')
        + `<span class="lb bot">${cap}</span><button class="x" title="移除这个素材">×</button>`;
      /* 素材预览都走公共缩略图缓存：以前每次 renderInputArea() 都新建 <video preload=metadata> /
         裸 <img>，每回都要重新经代理取一次元数据或原图 —— 表现就是「素材缩略图闪一下才出来」。 */
      if (it.type !== '音频') Wb.thumbs.bind(b, b.querySelector('video, img'), mediaOf(it));
      b.querySelector('.x').onclick = e => {
        e.stopPropagation();
        removeSlotItem(sl.kind, i);
        renderInputArea(); updateMode();
      };
      b.onclick = e => { e.stopPropagation(); openSlotMenu(b, sl, blocked); };
      area.appendChild(b);
    });
    if (!full) {
      const a = document.createElement('div');
      a.className = 'mat add' + (blocked ? ' blocked' : '');
      a.title = blocked
        ? def.label + '：与已选素材互斥（本模型一次请求只能选一组），清空已选后可添加'
        : def.label + '：点击选择素材（资产库 / 我的收藏 / 本地上传，已有 ' + items.length + ' / ' + sl.max + '）'
          + (def.hint ? '。' + def.hint : '');
      a.innerHTML = `<span class="ic">${items.length ? '+' : def.ic}</span><span class="lb">${items.length ? '再加' : def.label}</span>`;
      a.onclick = e => {
        e.stopPropagation();
        if (blocked) { flashSlotHint(conflictHint(blockedKinds)); return; }
        openSlotMenu(a, sl, false);
      };
      area.appendChild(a);
    }
  });
  const hint = conflictHint(blockedKinds);
  if (hint) area.insertAdjacentHTML('beforeend', `<span class="slot-hint">${hint}</span>`);
  /* 换模型后剩下的、新模型不接受的素材：槽位已经不显示了，但素材还在 inputs 里。
     这里明说并给一键清空，同时 updateGoState() 会拦住提交（不静默丢掉用户选的素材）。 */
  const stray = unsupportedKinds();
  if (stray.length) {
    const box = document.createElement('div');
    box.className = 'slot-hint warn';
    box.innerHTML = '当前模型不支持已选的「' + stray.map(k => SLOT_DEF[k].label).join(' / ') + '」，'
      + '<a href="#" class="lnk">清空这些素材</a> 或换回支持的模型';
    box.querySelector('.lnk').onclick = e => {
      e.preventDefault();
      stray.forEach(k => clearSlot(k));
      renderInputArea(); updateMode();
    };
    area.appendChild(box);
  }
  updateGoState();
}

/* 生成按钮的就绪状态：提示词为空 / 没有可用模型 / 互斥非法 / 有当前模型不接受的素材 → 禁用并说明。
   按钮禁用只是一层提示，提交时还会再校验一次（见下方 go 的 onclick）。 */
function submitBlockReason() {
  const { prov, model } = currentModel();
  if (!prov || !model) return '注册路由里没有可用的视频模型';
  // 长度下限不写死：注册表里只有语音台声明了 tts.minChars，视频侧没有长度声明 = 非空即可
  if (!$('prompt').value.trim()) return '请输入提示词';
  if (unsupportedKinds().length) return '已选素材里有当前模型不支持的类型';
  if (window.Capabilities && usedRoles().length) {
    const bad = Capabilities.illegalPairs(model, usedRoles());
    if (bad.length) return '「' + bad.map(([a, b]) => (ROLE_ZH[a] || a) + ' + ' + (ROLE_ZH[b] || b)).join('、') + '」不能同时使用，请先清空其中一组';
  }
  return '';
}
/* 就绪状态交给公共实现（workbench.js 的 Wb.ready）：按钮禁用与悬停说明一直在，
   按钮下方那行原因等用户在左栏真动过手才显示，不要一打开页面就刷屏。 */
function updateGoState() {
  if (window.Wb) Wb.ready({ btn: 'go', tip: 'goWhy', scope: '.col-left', reason: submitBlockReason });
}

/* 小菜单：选择来源 / 管理已选项（blocked：与已选素材互斥 → 只读可删，不能再加） */
let slotMenuEl = null;
function closeSlotMenu() { if (slotMenuEl) { slotMenuEl.remove(); slotMenuEl = null; } }
function openSlotMenu(anchorEl, sl, blocked) {
  closeSlotMenu();
  const def = SLOT_DEF[sl.kind];
  const items = slotItems(sl.kind);
  const full = items.length >= sl.max;
  const noAdd = full || blocked;
  const m = document.createElement('div');
  m.className = 'slot-menu';
  m.innerHTML = `<div class="hd">${def.ic} ${def.label}（${items.length}/${sl.max}）</div>` +
    (blocked ? '<div class="hd err">与已选素材互斥，只能移除</div>' : '') +
    items.map((it, i) => `<div class="mi"><span>${it.type === '视频' ? icon('film', 14) : it.type === '音频' ? icon('mic', 14) : icon('image', 14)}</span>
      <span class="nm">${(it.name || (it.fromLib ? '资产库素材' : '素材')).replace(/</g, '&lt;')}</span>
      ${it.fromLib ? '<span class="tag">资产库</span>' : ''}
      <button class="x" data-rm="${i}">×</button></div>`).join('') +
    (items.length ? '<div class="sep"></div>' : '') +
    `<button data-add="lib" ${noAdd ? 'disabled' : ''}>${icon('box', 13)} 选素材（资产库 / 收藏 / 本地）</button>` +
    (items.length ? `<button data-add="clear">${icon('trash', 12)} 清空这一项</button>` : '');
  document.body.appendChild(m);
  const r = anchorEl.getBoundingClientRect();
  m.style.left = Math.max(8, Math.min(window.innerWidth - m.offsetWidth - 8, r.left)) + 'px';
  m.style.top = Math.min(window.innerHeight - m.offsetHeight - 8, r.bottom + 6) + 'px';
  slotMenuEl = m;

  m.querySelectorAll('[data-rm]').forEach(btn => btn.onclick = e => {
    e.stopPropagation();
    removeSlotItem(sl.kind, +btn.dataset.rm);
    renderInputArea(); updateMode();
  });
  const libBtn = m.querySelector('[data-add="lib"]');
  if (libBtn) libBtn.onclick = async e => {
    e.stopPropagation();
    closeSlotMenu();
    const acceptsVideo = def.accept.includes('video');
    // 资产库里图片 / 视频 / 语音（语音工作台生成的音频）都能选；
    // 收视频的槽位（含「选视频取尾帧」的首帧）都列出视频
    const types = def.accept.includes('image') ? (acceptsVideo ? ['图片', '视频'] : ['图片'])
      : acceptsVideo ? ['视频'] : ['音乐', '音频'];
    const room = sl.max - slotItems(sl.kind).length;
    /* 「这个槽位收什么样的文件」这句话现算（inputRoles 的 accept / maxBytes + 提交模板的 requiresAudio），
       不是写死在标题里的死文案 —— 平台改了上限，弹窗提示跟着变。 */
    let slotNote = '';
    if (window.Capabilities && Capabilities.ruleText) {
      const { prov, model } = currentModel();
      const bits = [Capabilities.ruleText(model, sl.role)];
      const tpl = (window.Api && Api.inputTemplate) ? Api.inputTemplate(prov, sl.role) : null;
      if (tpl && tpl.requiresAudio) bits.push('需含音频轨');
      slotNote = bits.filter(Boolean).join(' · ');
    }
    const list = await AssetPicker.open({ types, multiple: sl.max > 1, limit: room,
      /* 标题里那句「收什么样文件」和「本地上传」档位的 accept 都来自模型的能力声明
         （inputRoles.accept / maxBytes）；平台没声明就什么都不加，不写死规矩。 */
      title: '选择' + def.label + (slotNote ? '（' + slotNote + '）' : ''),
      upload: sl.accept ? { accept: sl.accept } : undefined });
    if (!list.length) return;
    let added = 0;
    for (const en of list) {
      const arr = slotItems(sl.kind);
      if (arr.length >= sl.max) break;
      /* 选择器顶部「本地上传」档位挑的文件：本体在 en.file 上，
         和拖进输入框的文件走同一条入槽逻辑（含首帧槽位「选视频取尾帧」） */
      if (en.file) { await addSlotFiles(sl.kind, [en.file]); added++; continue; }
      if (en.type === '视频' && !acceptsVideo) continue;
      if (en.type === '图片' && !def.accept.includes('image')) continue;
      if (arr.some(x => x.assetId === en.assetId)) continue;
      /* 首帧槽位选的是视频 → 取回字节后在本机取它的最后一帧当首帧图 */
      if (en.type === '视频' && def.videoFrame) {
        setStatus('正在从资产库视频里取' + (def.videoFrame === 'last' ? '尾' : '首') + '帧…');
        try {
          const blob = await AssetTransfer.blobOf(en.dl || en.src);
          const name = ((en.prompt || 'video').replace(/\s+/g, ' ').trim().slice(0, 14) || 'video') + '.mp4';
          const vf = new File([blob], name, { type: blob.type || 'video/mp4' });
          arr.push(await frameItemFromVideoFile(vf, sl.kind));
          added++;
          setStatus('<span class="ok">✓ 已取该视频的最后一帧作为' + def.label + '</span>');
        } catch (err) { setStatus('<span class="err">取帧失败：' + err.message + '</span>'); }
        continue;
      }
      const item = { assetId: en.assetId, url: Api.mediaSrc(en.src), name: (en.prompt || '').slice(0, 14) || '资产',
        type: en.type, kind: sl.kind, fromLib: true, src: en.src };
      /* 远端签名地址会过期（缩略图看不到、提交也会失败），非本平台的 id（本地资产 / 别家平台）也不能直接引用：
         这两种都先取回字节存成本地对象 */
      const usableId = window.AssetTransfer && AssetTransfer.isPlatformId(en.assetId);
      if (en.type === '图片' && (!usableId || !/^\/asset\//.test(String(en.src || '')))) {
        try {
          const blob = await AssetTransfer.blobOf(en.dl || en.src);
          const f = new File([blob], (item.name || 'ref') + '.png', { type: blob.type || 'image/png' });
          item.file = f; item.url = URL.createObjectURL(f); item.src = item.url; delete item.assetId;
        } catch {}
      }
      arr.push(item);
      added++;
    }
    renderInputArea(); updateMode();
    if (added) setStatus('<span class="ok">✓ 已加入 ' + added + ' 个素材</span>');
  };
  const clr = m.querySelector('[data-add="clear"]');
  if (clr) clr.onclick = e => {
    e.stopPropagation();
    clearSlot(sl.kind);
    renderInputArea(); updateMode();
  };
}
document.addEventListener('click', closeSlotMenu);

/* 右栏任务列表：详情展开用事件委托（列表重渲染也不会失效） */
$('result').addEventListener('click', e => {
  const card = e.target.closest('.task');
  if (!card || !card._setOpen) return;
  // 按钮与提示词区域已由卡片内直接绑定处理；这里只兜底「卡片空白处」
  if (e.target.closest('.dt') || e.target.closest('.tprompt')) return;
  if (e.target.closest('button') || e.target.closest('.timg') || e.target.closest('.tdetail')) return;
  card._setOpen(card._det.hidden);
});

/* 本地文件入槽：拖进输入框、以及统一选择器顶部的「本地上传」档位，共用这一条 */
async function addSlotFiles(kind, fileList) {
  const files = [...fileList];
  const def = SLOT_DEF[kind] || SLOT_DEF.image;
  const sl = slots.find(x => x.kind === kind);
  /* 当前模型没有这个入口（能力声明里没有这个 role）→ 直接拒绝：
     以前这里会把文件收进一个不显示的槽位，用户看着像没反应，提交时才多出一句「不支持」。 */
  if (!sl) { setStatus('<span class="err">当前模型不支持「' + def.label + '」这类素材（可用入口见输入框下方的小方块）</span>'); return; }
  const max = sl.max;
  if (blockedSlotKinds().has(kind)) { flashSlotHint(def.label + '与已选素材互斥，请先清空已选素材'); return; }
  for (const f of files) {
    const arr = slotItems(kind);
    if (arr.length >= max) { setStatus('<span class="err">' + def.label + '最多 ' + max + ' 个</span>'); break; }
    const isVid = f.type.startsWith('video/'), isAud = f.type.startsWith('audio/');
    if (isAud && !def.accept.includes('audio')) { setStatus('<span class="err">' + def.label + '不支持音频文件</span>'); continue; }
    if (isVid) {
      if (def.videoFrame) {
        /* 首帧槽位选视频：取它的最后一帧当首帧图（全在本机做，见 Wb.vframe） */
        setStatus('正在从视频《' + (f.name || '') + '》取' + (def.videoFrame === 'last' ? '尾' : '首') + '帧…');
        try { arr.push(await frameItemFromVideoFile(f, kind)); setStatus('<span class="ok">✓ 已取该视频的最后一帧作为' + def.label + '</span>'); }
        catch (err) { setStatus('<span class="err">取帧失败：' + err.message + '</span>'); }
        continue;
      }
      if (!def.accept.includes('video')) { setStatus('<span class="err">' + def.label + '不支持视频文件</span>'); continue; }
      arr.push({ file: f, url: URL.createObjectURL(f), name: f.name, type: '视频', kind, fromLib: false });
      continue;
    }
    if (!def.accept.includes('image')) { setStatus('<span class="err">' + def.label + '不支持图片文件</span>'); continue; }
    arr.push({ file: f, url: URL.createObjectURL(f), name: f.name, type: isAud ? '音频' : '图片', kind, fromLib: false });
  }
  renderInputArea(); updateMode();
}
$('clearRefs').onclick = () => {
  inputs = { image: [], video: [], audio: [], frame_first: [], frame_last: [] };
  $('prompt').value = '';
  InlinePolish.clear($('polishInline'));
  renderInputArea(); updateMode();
};
const box = $('promptBox');
['dragover', 'dragenter'].forEach(ev => box.addEventListener(ev, e => { e.preventDefault(); box.classList.add('over'); }));
box.addEventListener('dragleave', e => { if (!box.contains(e.relatedTarget)) box.classList.remove('over'); });
box.addEventListener('drop', e => {
  e.preventDefault(); box.classList.remove('over');
  const f = e.dataTransfer.files[0];

/* 把素材上传成目标平台的资产（哪个平台由模板声明决定，页面不写死平台）。
   onStage：上传阶段与真实进度（见 ui.js 的 uploadStageText），由调用方决定怎么显示。 */

async function buildInputEntries(prov, model, allIn) {
  const entries = [];

    if (tpl && tpl.needsUpload) {
      const label = SLOT_DEF[k].label;

/* ============ 提交的等待窗口与收尾 ============
   平台的创建接口不一定很快回响应：VGENV 实测有 60~120 秒才回的情况（浏览器侧对 create 开到 150 秒，
   代理侧 120 秒）。**把按钮一路禁用等它，等于把用户锁死一两分钟** —— 所以这里把等待拆成两段：
     · 前台最多 SUBMIT_UI_MS（按钮禁用窗口就只覆盖这一段），平台正常响应时行为和以前一样；
     · 超过就把这次提交交给后台继续等（trackSubmit 里挂的 then），按钮立刻交回用户，
       响应回来后再按任务号补插卡片并提示 —— 用户不用盯着一个灰按钮等。
   代价是「按钮恢复后再点生成」有可能和那次还没落地的提交撞车，所以结算前再点会先拦一下：
   不弹遮罩弹窗，只在按钮下面写一行提示 + 一个「仍然再提交」，点它 / 10 秒内再点一次即可继续。 */
const SUBMIT_UI_MS = 12000;      // 前台等待上限（超过就转后台，按钮交回）
const RESUBMIT_ARM_MS = 10000;   // 提示后多少秒内再点一次算「确认要再提交」
const pendingSubmits = [];       // 还在等平台响应 / 结果未知的提交（决定「再点生成」要不要先拦）
let submitRun = 0;               // 每次点生成的批次号（判断这一批里有没有失败的）
let armedAt = 0;                 // 上一次拦下提交的时间（再点一次视为确认）
const unresolvedSubmit = () => pendingSubmits.find(s => s.state !== 'settled') || null;

function armResubmit() {
  armedAt = Date.now();          // 只拦一次：10 秒内再点就直接提交，不再问第二遍
  renderPendingHint();
  Toast.warn('上一次提交还在等平台响应：再点一次「生成视频」就会再提交一份');
}

/* 一次提交的全过程：POST 是唯一真凭据，但结果无论早晚都要落到卡片上。
   返回的 Promise 只用于前台的限时等待，后台也挂着同一份收尾（所以前台超时 ≠ 放弃这次提交）。 */
function trackSubmit(prov, t, runId) {
  const rec = { run: runId, prov: prov.id, at: Date.now(), prompt: t.prompt, model: t.model, state: 'inflight' };
  /* 早已结算的记录不用留着（只用来判断「有没有还没落地的提交」） */
  const cutoff = Date.now() - 10 * 60 * 1000;
  for (let i = pendingSubmits.length - 1; i >= 0; i--) {

  if (!p) {
    /* 列表里查不到这条任务号。刚提交的可能会有一两轮还没同步上，宽限几次；
       连续几轮都没有 = 平台那边已经没有它了 —— 以前这里只抛错，卡片会永远停在「排队中」转圈，
       界面一声不吭（用户看到的正是「状态不对」）。 */
    t.miss = (t.miss || 0) + 1;
    const why = '平台上找不到这条任务（列表里已经没有它了，任务号 ' + String(t.vid).slice(0, 16) + '）';
    if (t.miss >= 3) { t.status = 'failed'; t.error = why; }
    throw new Error(why);
  }
  applyPoll(t, prov, p);
}
const running = t => Wb.isRunning(t);
/* 轮询交给公共轮询器：没任务不发请求、连续失败会提示、切走标签页暂停、状态变化才重绘 */
/* 轮询：任务都来自平台，这里只负责把「还在跑的」那几条的状态刷新回来（卡片全部来自接口） */
const poller = Wb.poller({
  label: '视频', interval: 4000,
  tasks: () => serverItems,
  isRunning: t => running(t) && !!t.vid,
  sig: t => t.status + '|' + t.media + '|' + t.priceText + '|' + (t.error || ''),
  pollOne,
  onChange: () => { renderAll(); },
});
const pollRunning = () => poller.kick();

/* ============ 卡片渲染 ============ */
/* 卡片列表：复用/重绘/空态/无效记录提示条都由 workbench.js 的 Wb.cards 管（与图片台、语音台同一份） */
const list = Wb.cards.create({
  box: 'result',
  keyOf: t => taskKey(t),
  sigOf: t => cardSig(t),
  paint: (el, t) => paintCard(el, t),        // 卡片内容与交互仍由本页画（缩略图节点复用也在里面）
  emptyHTML: () => '<div class="empty">还没有任务，写好提示词点「生成视频」</div>',
  /* 某个平台的列表这次没取回来时要在列表上方说出来（以前 serverFailed 算出来了却没人看，
     表现就是右栏静默少一半卡片、或者干脆空着，用户不知道是没数据还是没拉到） */
  notesHTML: () => Wb.loadNote(serverErrs, 'vRetryLoad'),
  /* 入场动画只播一次（Web Animations；不用 class 是因为元素被移动时 class 里的动画会重新触发） */
  onNew: el => { try { el.animate([{ opacity: 0, transform: 'translateY(6px)' }, { opacity: 1, transform: 'translateY(0)' }], { duration: 280, easing: 'ease-out' }); } catch {} },
});
function renderAll() {
  const items = pager.slice();
  pager.update();
  list.paint(items);
}
/* 详情展开状态与内容缓存：列表因轮询/操作重渲染后，展开的面板不会自己收起来 */
const openDetail = new Set();
const taskKey = t => Wb.taskKey(t);
/* 卡片内容指纹：只有字段真的变了才重绘这张卡（避免每轮轮询/每批加载把整列表重建导致闪烁） */
const cardSig = t => [t.status, t.media, t.priceText, t.error, t.prompt, t.provider, t.model, t.tier, t.res, t.ar, t.dur,
  (t.media && Wb.thumbs.get(t.media)) ? 'i' : 'v'].join('|');   // 首帧缓存到手后要重画成 <img>（否则一直挂着 video 重新取流）

function cardInnerHTML(t) {
  const run = running(t), failed = ['failed', 'cancelled'].includes(t.status);
  const date = t.ts ? new Date(t.ts).toLocaleDateString() + ' ' + new Date(t.ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
  return `
    <div class="timg">${run ? '<span class="spin-dot"></span>' + (t.status === 'queued' ? '排队中' : '生成中') : failed ? '<span style="color:var(--err)">' + (ST_ZH[t.status] || '失败') + '</span>' : t.media ? Wb.thumbs.mediaHTML(t.media) : '加载中…'}</div>
    <div class="tmain">
      <div class="meta1"><span class="dot${run ? ' run' : failed ? ' fail' : ''}"></span><span>${ST_ZH[t.status] || t.status}</span><span class="date">${date}</span></div>
      <div class="tprompt" title="${(t.prompt || '').replace(/"/g, '&quot;')}">${(t.prompt || '').replace(/</g, '&lt;') || '(无提示词)'}</div>
      ${failed && t.error ? `<div class="terr" title="${String(t.error).replace(/"/g, '&quot;')}">${Wb.esc(t.error)}</div>` : ''}
      <div class="meta2">${[provLabelOf(t.provider), t.model, t.res, t.ar, t.dur != null ? t.dur + 's' : '', t.priceText ? '费用 ' + t.priceText : ''].filter(Boolean).join(' · ')}</div>
      <div class="acts">${Wb.actsHTML(t, {
        preview: !!t.media, previewLabel: '预览',
        cancel: run, retry: failed && !!t.prompt,
      })}</div>
      <div class="tdetail" hidden></div>
    </div>`;
}
/* 事件绑定 + 展开状态恢复（新建卡片与重绘卡片共用） */
function bindCard(d, t) {
  const det = d.querySelector('.tdetail');
  const key = taskKey(t);
  const dtBtn = d.querySelector('.dt');
  const setOpen = nowOpen => {
    if (nowOpen) openDetail.add(key); else openDetail.delete(key);
    det.hidden = !nowOpen;
    d.classList.toggle('open', nowOpen);   // 展开靠 .task.open .tdetail{display:block}（ui.css），只改 hidden 不够
    dtBtn.textContent = nowOpen ? '▾ 收起' : '▾ 详情';
    if (nowOpen) {
      Wb.detail.render(t, det);                 // 详情面板与资产库同一套实现（见 workbench.js 的 Wb.detail）
      try { det.scrollIntoView && det.scrollIntoView({ block: 'nearest' }); } catch {}
    }
  };
  // 恢复上次的展开状态（列表重渲染后不丢）
  if (openDetail.has(key)) {
    det.hidden = false;
    d.classList.add('open');
    dtBtn.textContent = '▾ 收起';
    if (!det.dataset.rendered) { det.dataset.rendered = '1'; Wb.detail.render(t, det); }
  } else {
    det.hidden = true;
    dtBtn.textContent = '▾ 详情';
  }
  d.dataset.tkey = key;                    // 事件委托用：卡片 ↔ 任务对象
  d._setOpen = setOpen;                    // 委托处理器调用 / 直接绑定使用
  d._det = det;
  // 直接绑定（主路径）：按钮与提示词区域
  dtBtn.onclick = e => { e.stopPropagation(); e.preventDefault(); setOpen(det.hidden); };
  const tpEl = d.querySelector('.tprompt');
  if (tpEl) tpEl.onclick = e => { e.stopPropagation(); e.preventDefault(); setOpen(det.hidden); };
  const pv = d.querySelector('.pv');
  if (pv) pv.onclick = () => Wb.lightbox.open(t);
  d.querySelector('.timg').onclick = () => { if (t.media) Wb.lightbox.open(t); };
  /* 动作按钮统一由 Wb.bindActs 接线：确认弹窗、忙碌态、失败提示三台一致 */
  Wb.bindActs(d, t, {
    fileName: fileNameOf(t),
    onDetail: () => setOpen(det.hidden),
    onPreview: () => Wb.lightbox.open(t),
    onCancel: async () => {
      // 取消失败不再静默吞掉，也不再谎报「已取消」
      await Wb.cancelTask(Api.prov(t.provider), t.vid);
      t.status = 'cancelled'; renderAll();
      Toast.ok('已取消');
    },
    /* 重试：用这条任务原来的提示词与参数重新提交（参考素材只在当次会话里带着，刷新后没有）
       —— 提交成功后同样从接口取回卡片，本地不留记录。
       等待窗口与主按钮同一套（trackSubmit + SUBMIT_UI_MS）：平台慢慢不回时不再把这张卡的按钮锁死。 */
    onRetry: async () => {
      const p = Api.prov(t.provider) || Api.prov('video');
      const settled = trackSubmit(p, { model: t.model, prompt: t.prompt, tier: t.tier || 'fast', dur: t.dur || 5,
        res: t.res || '768p', ar: t.ar || '16:9', boolParams: t.boolParams || null, inputEntries: t.inputEntries || [] });
      await Promise.race([settled, new Promise(r => setTimeout(r, SUBMIT_UI_MS))]);
      if (!unresolvedSubmit()) Toast.ok('已重新提交（正在取回列表）');
    },
  });
  return d;
}
/* 重绘已有卡片：内容换新，但缩略媒体节点复用（出过画的 <img> 不重新解码，也不闪） */
function paintCard(d, t) {
  const oldMedia = d.querySelector('.timg video, .timg img');
  const oldKey = oldMedia ? oldMedia.getAttribute('data-thumb-key') : null;
  d.innerHTML = cardInnerHTML(t);
  if (oldKey && oldMedia.tagName === 'IMG') {
    // 按归一化后的缓存键比对：媒体地址每轮刷新都可能重新签名，直接比 src 永远命不中
    const nm = [...d.querySelectorAll('.timg img')].find(x => x.getAttribute('data-thumb-key') === oldKey);
    if (nm) nm.replaceWith(oldMedia);
  }
  bindThumb(d, t);
  return bindCard(d, t);
}
/* 缩略图出画处理（懒加载 + 抽首帧缓存，见 workbench.js 的 Wb.thumbs） */
function bindThumb(d, t) {
  const wrap = d.querySelector('.timg');
  if (!wrap) return;
  const media = wrap.querySelector('video[data-src], video[src], img');
  if (media) Wb.thumbs.bind(wrap, media, t.media || '');
}

/* ============ 详情：与资产库共用 Wb.detail（workbench.js） ============ */
/* 以前这里自己写一份 renderDetail + fmtDetail + promptBlockHTML，和资产库那份字段解释不一致；
   现在只提供适配器：提示词 / 状态 / 平台 / 任务号 / 页面专有行。 */
Wb.detail.init({
  prompt: t => t.prompt,
  status: t => t.status,
  provider: t => (REG.providers || []).find(p => p.id === t.provider) || null,
  taskId: t => t.vid || '',
  rows: t => [['档位', t.tier], ['分辨率', t.res], ['比例', t.ar], ['时长', t.dur != null ? t.dur + ' 秒' : ''],
    ['费用', t.priceText], ['错误', t.error], ['任务ID', t.vid || (t.assetId ? t.assetId : '（本地导入，无任务ID）')]],
});

/* ============ 灯箱预览 + 保存落点：全部走公共模块（workbench.js）============
   以前这里自己写一份 #lbVideo 灯箱、一份 ensureDir/saveToDir/saveAsOnce ——
   图片台、语音台、资产库、收藏也各有一份，现在五页共用 Wb.lightbox + Wb.saver。 */
Wb.lightbox.init({
  list: () => mergedAll().filter(x => x.media),        // 翻页范围 = 当前列表里有画面的任务
  keyOf: t => taskKey(t),
  srcOf: t => t.media || '',
  nameOf: t => fileNameOf(t),
  kindOf: t => 'video',
  info: (t, el) => [
    (REG.providers || []).find(p => p.id === t.provider)?.name || t.provider,
    t.model,
    t.dur ? t.dur + 's' : '',
    t.ar,
    (el && el.videoWidth) ? el.videoWidth + '×' + el.videoHeight + 'px' : '',
    Wb.mediaSize(t.media).then(n => (n ? Wb.fmtSize(n) : '')),   // 体积实测（上游不返回）
  ],
});
Wb.saver.init({ dirKey: 'dir_video', pickerId: 'skLib_dir_video', label: '视频', status: setStatus });
function fileNameOf(t) {
  const p = (t.prompt || 'video').replace(/\s+/g, ' ').trim().slice(0, 24);
  const d = new Date(t.ts || Date.now()), pad = n => String(n).padStart(2, '0');
  const raw = `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())} ${p || 'video'}.mp4`;
  return raw.replace(/[\\/:*?"<>|\x00-\x1f]/g, '-');
}

/* ============ 工具 ============ */
function setStatus(html) { $('status').innerHTML = html; }
$('searchBtn').onclick = () => { searchQ = $('searchBox').value.trim().toLowerCase(); renderAll(); };
$('searchBox').addEventListener('keydown', e => { if (e.key === 'Enter') { searchQ = $('searchBox').value.trim().toLowerCase(); renderAll(); } });
/* 分页按钮 / 跳页 / 滚动续拉：都由 Wb.pager 驱动（口径与语音台一致） */
pager.bindButtons();
pager.bindScroll('result');
$('gotoBtn').onclick = () => pager.gotoInput('gotoPage');
$('gotoPage').addEventListener('keydown', e => { if (e.key === 'Enter') pager.gotoInput('gotoPage'); });
/* 提示条上的「重试」：列表是重建出来的，所以用事件委托绑在容器上（见上面 notesHTML） */
$('result').addEventListener('click', e => {
  if (e.target && e.target.id === 'vRetryLoad') { e.target.disabled = true; loadServer(1, true); }
});
$('sync').onclick = async () => {
  const b = $('sync'); const oldHtml = b.innerHTML;
  b.disabled = true; b.title = '正在刷新…';      // 只改禁用态与提示，不动文字（文字一变旁边按钮就挪）
  serverGen++;                                   // 作废正在飞的旧批次
  serverCursors = {}; serverHasMore = true;
  serverPages = 0; pager.setPage(0);        // 刷新回到第一页（页码归 Wb.pager 管，以前这里还有个用不到的本地 page 变量）
  try { await loadServer(1); loadServer(1); } catch {}
  tally.run(true);                    // 总数跟着刷新重数（不 await：文案先照旧，数完自己变精确）
  renderAll(); await pollRunning();
  b.disabled = false; b.title = ''; b.innerHTML = oldHtml;
  if (PAGE_MODE === 'more') setTimeout(autoLoadMore, 60);   // 一屏没填满就继续拉（工具条上不再有「加载更多」按钮）
};
/* 滚动续拉与「一屏没填满」都由 Wb.pager.bindScroll + ensureFilled 负责 */
const autoLoadMore = () => pager.ensureFilled(pager.page + 1);
window.addEventListener('resize', () => { if (PAGE_MODE === 'more') autoLoadMore(); }, { passive: true });
const themeBtn2El = $('themeBtn2');
if (themeBtn2El) themeBtn2El.onclick = () => {
  const t = (document.documentElement.dataset.theme === 'dark') ? 'light' : 'dark';
  document.documentElement.dataset.theme = t;
  localStorage.setItem('dir_theme', t);
};

/* ============ 启动 ============ */
(async () => {
  try { REG = await Api.registry(); } catch { REG = { providers: [] }; }
  if (window.Api) Api.setRegistry(REG);   // 统一接口层复用同一份注册表
  renderModelOptions(); renderParamOptions();     // 先用 registry 兜底渲染，不等能力接口
  // 首屏：上次缓存的任务先画出来（SparkCine 列表接口本身要 6~14 秒）；卡片一律来自接口，本地不留记录
  if (!serverEntries.length) {
    const cached = readVCache();
    if (cached.length) { serverEntries = cached; toServerItems(cached); }
  }
  renderAll();
  /* 缩略图首帧缓存（IndexedDB）：读出来直接当图片用 —— 不用再为每张卡取一次视频元数据 */
  Wb.thumbs.hydrate().then(n => { if (n) { try { renderAll(); } catch {} } }).catch(() => {});
  loadServer(1).then(() => loadServer(1)).catch(() => {})
    .then(() => { tally.run(); if (PAGE_MODE === 'more') setTimeout(autoLoadMore, 60); });   // 动态加载模式下把首屏填满
  pollRunning();
  await bootReuse();      // 若是从资产库「复用」跳转过来，填入提示词与素材（必要时自动换模型）
  // 模型能力动态获取（分辨率 / 档位 / 比例 / 时长以上游实际支持为准）；返回后再刷新参数下拉
  try { await Capabilities.load(REG); } catch {}
  renderModelOptions(); renderParamOptions();
})();
</script>
</div>
