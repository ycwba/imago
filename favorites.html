<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('dir_theme')||'light'}catch(e){}</script>
<title>我的收藏 · 拾帧</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236d5cf5'/%3E%3Ctext x='16' y='22' font-family='system-ui,-apple-system,Segoe UI,sans-serif' font-size='15' font-weight='700' fill='%23fff' text-anchor='middle'%3EAI%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="ui.css">
<style>

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--txt); min-height: 100vh; }
  .page-main { padding: 30px 40px 60px; }
  @media (max-width: 760px) { .page-main { padding: 18px 14px 40px; } .grid.view-compact { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; } .view-list .card .thumb { width: 108px; flex-basis: 108px; height: 78px; } }
  h1 { font-size: 24px; margin: 0 0 8px; display: flex; align-items: center; gap: 8px; }
  .desc { font-size: 14px; color: var(--sub); line-height: 1.7; max-width: 760px; }
  .toolbar { margin: 20px 0 6px; }   /* flex / 间距 / 换行在 ui.css */
  .toolbar2 { display: flex; align-items: center; gap: 10px; margin: 0 0 16px; flex-wrap: wrap; }
  .toolbar input[type=search] { flex: 0 1 320px; }   /* 盒子的样式在 ui.css，这里只留本页的宽度 */
  /* ---------- 展示样式（开关本体在 workbench.js 的 Wb.viewToggle，与资产库同一份） ----------
     基样式＝「紧凑」档（方块网格，只留缩略图 + 两行标题）；「列表」档用 .grid.view-list 覆盖成横条。
     选择器必须带 .grid 前缀，否则抢不过 .grid 自己的 display 声明。 */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; position: relative;
    transition: border-color .15s, box-shadow .15s, transform .12s; }
  .card:hover { border-color: var(--acc); box-shadow: 0 6px 20px rgba(0,0,0,.09); transform: translateY(-2px); }
  .card .thumb { height: 96px; background: var(--thumbbg, #e2e5ee); display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .card .thumb img, .card .thumb video { width: 100%; height: 100%; object-fit: contain; background: #000; display: block; }
  .card .thumb .audio { display: flex; flex-direction: column; align-items: center; gap: 6px; color: var(--sub); font-size: 12px; }
  .card .body { padding: 7px 9px 9px; }
  .card .t { font-size: 12px; line-height: 1.5; margin-bottom: 4px; word-break: break-word;
    -webkit-line-clamp: 2; display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; }
  .card .m { font-size: 11.5px; color: var(--sub); }
  .card .note { margin-top: 8px; }
  .card .note textarea { width: 100%; min-height: 34px; max-height: 90px; resize: vertical; font-size: 12px; line-height: 1.5;
    padding: 5px 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--input); color: var(--txt);
    font-family: inherit; outline: none; }
  .card .note textarea:focus { border-color: var(--acc); }
  .card .note .hint { font-size: 10.5px; color: var(--sub); margin-top: 3px; }
  .card .acts { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  /* 以前缩略图右上角还压着一颗星（.unfav），它和下面那颗「移出收藏」是**同一个动作**
     （都走 dropItem → Confirm → Fav.remove）：一页全是要移除的东西，再挂一颗「已收藏」的星
     既重复又盖住了画面。移除入口只留「移出收藏」那一颗 —— 它在操作行里、与复用/下载并列，
     不挡内容，也不用猜那颗星是「标记」还是「按钮」。 */
  .drop { outline: 2px dashed var(--acc); outline-offset: -6px; }
  /* 列表档：横条一行一条，把紧凑档藏起来的元信息/备注/按钮全部展开 */
  .grid.view-compact { gap: 10px; }
  .view-list .card { display: flex; align-items: stretch; }
  .view-list .card .thumb { width: 168px; height: 104px; flex: 0 0 168px; border-right: 1px solid var(--line); }
  .view-list .card .body { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; padding: 10px 12px 12px; }
  .view-list .card .t { font-size: 13.5px; -webkit-line-clamp: unset; display: block; overflow: visible; }
  .view-list .card .m { display: block; }
  .view-list .card .note { display: block; }
  .view-list .card .acts { display: flex; }
</style>
</head>
<body>
<div class="page-main">
  <h1 id="title"><span id="tic"></span>我的收藏</h1>

  <div class="toolbar">
    <div class="chips" id="chips"></div>
    <input type="search" id="q" placeholder="搜索名称 / 提示词 / 备注">
    <!-- AI 找素材：与搜索框同一行、直接读搜索框里的话，结果就地筛这个列表（不再另开输入窗口） -->
    <button class="tool acc" id="aiFindBtn" title="在收藏里找：把搜索框里那句话交给文字 AI，按名称 / 类型 / 备注挑出收藏"></button>
    <span id="aiChip"></span>
    <span class="cnt" id="cnt"></span>
  </div>
  <div class="toolbar2">
    <span class="sp"></span>
    <span class="viewtoggle" id="fView"></span>
    <button class="ghost" id="pullBtn" title="把当前筛选里「本机还没有那份字节」的收藏取回本机资产库；本地上传的那一批不算（字节本来就在浏览器里）"></button>
    <button class="ghost" id="uploadBtn"></button>
    <input type="file" id="uploadFile" multiple hidden>
  </div>

  <div class="grid" id="grid"></div>
  <div id="gridEnd" style="height:1px"></div>   <!-- 动态加载模式下的续拉哨兵 -->
  <div class="pager-row" id="pagerRow">
    <button class="ghost" id="pgPrev">‹ 上一页</button>
    <span class="pginfo" id="pgInfo"></span>
    <button class="ghost" id="pgNext">下一页 ›</button>
  </div>
</div>

<script src="ui.js"></script>
<script src="workbench.js"></script>
<script src="sidebar.js"></script>
<script src="ident.js"></script>
<script src="assetlib.js"></script>
<script>
(function () {
  const $ = id => document.getElementById(id);
  const esc = s => window.esc(s);
  $('tic').innerHTML = window.icon ? icon('star', 20) : '';
  $('uploadBtn').innerHTML = (window.icon ? icon('upload', 13) : '') + ' 上传本地文件';
  /* 这颗按钮的字要就地改（进度写在 .tx 上），所以图标与文字分两个格子 ——
     整颗 `textContent = …` 会把图标一起抹掉（见 ui.js 的 btnText）。
     ⚠ 这里**不调** paintPullBtn：它按这一屏现算、要读 viewItems（下面才 `let` 声明），
     在这里调会撞 TDZ（`Cannot access 'viewItems' before initialization`）把整份脚本当场打断。
     初始绘制在 render() 那一趟（viewItems 就绪之后；boot 里 render() 是同步跑到的）。 */

  let filter = 'all';
  let aiPick = null;            // AI 找出来的收藏（key 集合），非空时只显示这些
  let aiRank = null;            // AI 给的次序（key → 名次，最合适的排 0）；只有它挑过才照这个名次排
  let aiWhy = '';               // AI 自报的一句话理由，显示在条件芯片上
  let renderSeq = 0;            // 渲染令牌：异步画卡片时若又触发了一轮，旧的那轮立即放弃（否则卡片会重复）
  const TYPES = [['all', '全部'], ['图片', '图片'], ['视频', '视频'], ['音频', '音频'], ['文件', '其它']];
  const byType = (it, t) => t === 'all' || (t === '音频' ? window.isAudioType(it.type) : it.type === t);
  /* 字节只有一种说法（ui.js 的 fmtBytes，全站共用）：以前这一页自己写了一份没有 GB 档的，
     4 GB 的成片显示成 4096.0 MB；0 字节还显示成空串（「未知」与「空文件」看起来一样）。 */
  const fmtSize = b => window.fmtBytes(b);

  /* ---------- 顺序只有两种，界面上一颗都挑不了 ----------
     AI 挑过 → 照 AI 给的名次排（最合适的在前）；没挑过 → 照存盘顺序（`Fav.add` 把新的 unshift 到最前）。
     以前这里有一排排序芯片（时间 / 名称 / 类型 / 平台 / 时长），档位存 `dir_fav_sort`：
     那是个纯显示偏好，换台机器要重新配一遍，而收藏攒多了真正用的是搜索框与「AI 找素材」。 */
  const aiRankOf = it => (aiRank && aiRank.has(it.key) ? aiRank.get(it.key) : Number.MAX_SAFE_INTEGER);
  function orderItems(items) {
    return aiRank ? items.slice().sort((a, b) => aiRankOf(a) - aiRankOf(b)) : items;
  }

  /* 芯片行走 ui.js 的 Chips（与资产库 / 角色库 / 用量同一份）；这里只给「这一档有多少条」。 */
  function paintChips() {
    const items = Fav.list();
    window.Chips.render($('chips'), TYPES, filter,
      v => { filter = v; resetPaging(); render(); },
      { count: v => items.filter(x => byType(x, v)).length });
  }

  let viewItems = [];            // 当前视图的条目（灯箱翻页范围 = 它）
  /* ---------- 展示样式 + 分页 ----------
     开关与分页都走公共实现（Wb.viewToggle / Wb.pager），和资产库同一套行为：
     每页条数、翻页还是滚动续拉，都在「设置 → 列表分页 → 我的收藏」里配。 */
  /* 默认档与「取存储 || 退回默认」的读法只有一份（ui.js 的 pageModeOf / pageSizeOf，
     默认档现读它上面那张 PAGE_TARGETS）：页面里抄一份 'page' / 24，设置页改了默认值这一页还是旧的。 */
  const PAGE_MODE = window.pageModeOf('favorites');
  const PAGE_SIZE = window.pageSizeOf('favorites');
  let morePages = 1;             // 动态加载模式：已经拉了几页
  /* 与资产库、素材库同一颗开关（workbench.js 的 Wb.viewToggle）：有几档、叫什么只由 ui.js 的
     window.VIEW_MODES 点一次名，这里不抄第二份。
     旧的第三档「卡片」与紧凑长得一样（图标还撞成了两个「紧凑」），已并掉；
     存档里的旧值 card/compact 由 viewToggle 现算，认不出来时回落到第一档（列表）。 */
  const viewToggle = Wb.viewToggle.create({
    el: 'fView', key: 'dir_fav_view', target: 'grid',
  });
  const shownCount = () => PAGE_MODE === 'more' ? Math.min(viewItems.length, morePages * PAGE_SIZE) : viewItems.length;
  /* 页码/信息文案算的是「整个视图有多少条」，所以 pager.items 给全量，具体显示哪几条由 pageItems 决定 */
  function pageItems() {
    return PAGE_MODE === 'more' ? viewItems.slice(0, shownCount()) : pager.slice(viewItems);
  }
  function resetPaging() { morePages = 1; pager.setPage(0); }
  const pager = Wb.pager.create({
    mode: PAGE_MODE, pageSize: PAGE_SIZE,
    items: () => viewItems,
    hasMore: () => PAGE_MODE === 'more' && shownCount() < viewItems.length,
    render: () => render(),
  });
  pager.bindButtons();
  /* 灯箱 + 详情：与资产库 / 三个工作台共用 Wb.lightbox / Wb.detail（workbench.js）。
     收藏以前点了没有任何反应（本地文件只是 blob 地址，直接打开会跳出页面）。 */
  const favFileName = it => {
    /* 本地上传的文件保留它自己的名字（那是用户起的，不该被改写）。其余与资产库 / 工作台同一形状，
       三块读法都在 ui.js（`fileStamp` 拼时间、`fileSafe` 洗名字、`fileExtOf` 推扩展名，§J ⑲ 守着）。
       以前这一页有**两份**下载名：灯箱里这一份、卡片那颗「下载」按钮又自己拼了一份，
       两份都没洗非法字符（提示词里的 `/ \ : * ? " < > |` 变成文件名的方式是各浏览器自己定），
       而且没有扩展名兜底 —— 一条没带 format 的收藏下回来是个没有尾缀的文件，双击打不开。 */
    if (it.kind === 'local' && it.name) return it.name;
    return window.fileStamp(it.ts) + ' ' + window.fileSafe(it.prompt || it.name || '素材', 24) + '.' + window.fileExtOf(it);
  };
  const favKind = it => window.mediaKindOf(it.type);
  /* 「去工作台哪一栏」必须与 `studio.html` 分段开关上那三个名字逐字一致（视频 / 图像 / 音频）。
     以前这一句里 audio 写成「语音」，而那一栏的按钮写着「音频」—— 提示指着页面上不存在的那一栏。 */
  const reuseTabZh = t => ({ video: '视频', image: '图像', audio: '音频' })[window.mediaKindOf(t)];
  Wb.detail.init({
    prompt: it => it.prompt || it.name || '',
    status: it => (it.kind === 'local' ? '本地文件' : '已收藏'),
    rows: it => [
      ['来源', it.kind === 'local' ? '本地上传' : (it.providerName || '资产库')],
      ['类型', it.type],
      ['格式', it.format ? String(it.format).toUpperCase() : ''],
      ['大小', it.size ? fmtSize(it.size) : ''],
      ['时长', it.duration ? it.duration + 's' : ''],
      ['备注', it.note || ''],
      ['收藏时间', window.fmtWhen(it.ts)],
    ],
  });
  Wb.lightbox.init({
    list: () => viewItems,
    keyOf: it => it.key,
    srcOf: it => Fav.urlOf(it),              // 本地文件要读 IndexedDB，所以是 Promise
    nameOf: favFileName,
    kindOf: favKind,
    info: (it, el) => {
      const w = (el && (el.videoWidth || el.naturalWidth)) || 0;
      const h = (el && (el.videoHeight || el.naturalHeight)) || 0;
      return [w ? w + '×' + h + 'px' : '', fmtSize(it.size), it.duration ? it.duration + 's' : '',
        it.kind === 'local' ? '本地文件' : (it.providerName || '资产库'), it.type,
        it.format ? String(it.format).toUpperCase() : '', it.note ? '备注：' + it.note : ''];
    },
  });

  /* 一张卡的缩略图（首屏 + 过期地址回源后重画都走这里，别写两份）。
     本地收藏的 blob: 地址每次重建都不一样 —— 直接拿它当缓存键等于「抽好的首帧永远命不中」，
     所以本地用 fileKey 做稳定键（见 workbench.js 的 Wb.thumbs.keyOf / bind 的 identity 参数）；
     远程用 /getv 地址，keyOf 内部会归一化成 host+path，签名换了键也不变。 */
  function thumbFor(it, url) {
    const kind = window.mediaKindOf(it.type);
    if (!url) return { html: '<div class="thumb"></div>', tkey: '' };
    const tkey = it.kind === 'local' && it.fileKey ? 'fav-file:' + it.fileKey : url;
    const html = kind === 'audio'
      ? `<div class="thumb"><div class="audio">${window.icon ? icon('mic', 26) : ''}<span>${esc(window.fileExtOf(it).toUpperCase())}${it.duration ? ' · ' + it.duration + 's' : ''}</span></div></div>`
      : kind === 'video' ? `<div class="thumb">${Wb.thumbs.mediaHTML(url, { key: tkey })}</div>`
      : `<div class="thumb">${Wb.thumbs.mediaHTML(url, { key: tkey, type: 'image', mediaAttrs: 'loading="lazy"' })}</div>`;
    return { html, tkey };
  }

  async function render() {
    const seq = ++renderSeq;
    paintChips();
    paintAiChip();
    viewToggle && viewToggle.apply();
    const q = $('q').value.trim();
    const items = orderItems((q ? Fav.search(q) : Fav.list())
      .filter(x => byType(x, filter) && (!aiPick || aiPick.has(x.key))));   // 灯箱的翻页范围 = 当前视图（搜索/筛选后，不受分页影响）
    viewItems = items;
    paintPullBtn();          // 「存回本机（N）」按这一屏现算：筛选/搜索/存完都要跟着换数
    $('cnt').textContent = items.length ? '共 ' + items.length + ' 项' : '';
    const grid = $('grid');
    if (!items.length) {
      grid.innerHTML = '<div class="empty">还没有收藏。去「资产库」点卡片上的 ☆，或点右上角「上传本地文件」。</div>';
      $('pagerRow').style.display = 'none';
      return;
    }
    const shown = pageItems();
    $('pagerRow').style.display = '';
    pager.update();
    grid.innerHTML = '';
    /* 先把所有缩略图地址并发取好（最多 6 个并发），再按顺序建卡片：
       以前在 for 循环里逐条 await Fav.urlOf —— 本地收藏要读 IndexedDB、远程的走代理，
       收藏多了首屏肉眼可见地卡。 */
    const itemsArr = shown;
    const urls = new Array(itemsArr.length);
    let nextIdx = 0;
    await Promise.all(Array.from({ length: Math.min(6, itemsArr.length) }, async () => {
      while (nextIdx < itemsArr.length) {
        const i = nextIdx++;
        if (seq !== renderSeq) return;
        urls[i] = await Fav.urlOf(itemsArr[i]).catch(() => '');
      }
    }));
    if (seq !== renderSeq) return;          // 已经有更新的一轮在画，放弃这一轮
    for (let ii = 0; ii < itemsArr.length; ii++) {
      const it = itemsArr[ii];
      if (seq !== renderSeq) return;
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.key = it.key;
      const url = urls[ii] || '';
      /* 本地收藏的 blob: 地址每次重建都不一样 —— 直接拿它当缓存键等于「抽好的首帧永远命不中」。
         用 fileKey 做稳定键（见 workbench.js 的 Wb.thumbs.keyOf / bind 的 identity 参数）。 */
      const t = thumbFor(it, url);
      const thumb = t.html;
      const tkey = t.tkey;
      card.innerHTML = `${thumb}
        <div class="body">
          <div class="t">${esc(it.prompt || it.name || '(无描述)')}</div>
          <div class="m">${esc([it.kind === 'local' ? '本地文件' : (it.providerName || '资产库'), it.type, it.format ? String(it.format).toUpperCase() : '', it.size ? fmtSize(it.size) : '', it.duration ? it.duration + 's' : ''].filter(Boolean).join(' · '))}</div>
          <div class="note"><textarea placeholder="写备注：这条素材是干什么用的（搜索和 AI 都会用它）" rows="2">${esc(it.note || '')}</textarea></div>
          <div class="acts">
            ${/* 本地文件也给这一颗：它的字节在本机 IndexedDB 里，带过去的是文件号（fileKey），
               以前这一颗只画给资产类收藏，本地文件连入口都没有 —— 而它才是真能保证还在本机的那一批。 */
              (it.kind === 'asset' || it.fileKey)
                ? `<button class="ghost reuse" title="带着这条素材去${reuseTabZh(it.type)}那一栏">复用</button>` : ''}
            <button class="ghost dl">下载</button>
            <button class="ghost danger rm">移出收藏</button>
          </div>
        </div>`;
      /* 点缩略图 / 标题 → 预览（与资产库同一个灯箱：左右切换、键盘、下载、详情） */
      card.querySelector('.thumb').onclick = e => { e.stopPropagation(); Wb.lightbox.open(it); };
      card.querySelector('.t').onclick = e => { e.stopPropagation(); Wb.lightbox.open(it); };
      card.querySelector('.thumb').style.cursor = 'zoom-in';
      const tw = card.querySelector('.thumb');
      const tm = tw && tw.querySelector('video[data-src], video[src], img');
      if (tm) Wb.thumbs.bind(tw, tm, url, null, tkey);      // 首帧缓存 + 懒加载（见 workbench.js 的 Wb.thumbs）
      const ta = card.querySelector('.note textarea');
      let noteTimer = null;
      /* 备注保存：只写存储、不重画列表。
         以前 Fav.setNote 会派发 fav-change → 页面监听里 render() → 整块 innerHTML 重建，
         结果是「打字打一半输入框失焦、光标跳到开头」。 */
      const saveNote = () => { Fav.setNote(it.key, ta.value, { silent: true }); };
      ta.addEventListener('input', () => { clearTimeout(noteTimer); noteTimer = setTimeout(saveNote, 600); });
      ta.addEventListener('blur', () => { clearTimeout(noteTimer); saveNote(); });
      ta.onclick = e => e.stopPropagation();
      /* 移出收藏：本地文件的文件本体也会一起删（不可恢复），所以要确认一下 */
      const dropItem = async () => {
        const isLocal = it.kind === 'local';
        const ok = await Confirm.ask({
          title: '移出收藏？', danger: true, okLabel: '移出',
          body: isLocal ? '这是本地上传的文件，移出后文件本体也会从浏览器里删除，不可恢复。' : '只从「我的收藏」移出，资产库里的素材不受影响。',
        });
        if (!ok) return;
        Fav.remove(it.key);
        render();
      };
      card.querySelector('.rm').onclick = e => { e.stopPropagation(); dropItem(); };
      const dl = card.querySelector('.dl');
      dl.onclick = async e => {
        e.stopPropagation();
        dl.disabled = true; dl.textContent = '下载中…';
        try {
          const b = await Fav.blobOf(it);
          if (!b) throw new Error('取不到文件');
          Net.save(b, favFileName(it));
          dl.textContent = '已开始下载';
        } catch (err) { dl.textContent = '下载失败'; }
        setTimeout(() => { dl.disabled = false; dl.textContent = '下载'; }, 1800);
      };
      const ru = card.querySelector('.reuse');
      if (ru) ru.onclick = e => {
        e.stopPropagation();
        /* 载荷归公共那一份（`Wb.reuse`）。本地文件**不能带 `url` 里那条 blob: 地址** ——
           blob 地址属于当前这份文档，跳页就失效；它能带走的只有本机文件号（fileKey），
           工作台那头按号去 IndexedDB 取字节。以前这一条只把 assetId 递过去，
           而本地文件压根没有资产号，等于什么都没带。 */
        Wb.reuse.go(it.kind === 'local'
          ? { from: 'favorites', type: it.type, fileKey: it.fileKey, name: it.name, prompt: it.prompt || '' }
          : { from: 'favorites', type: it.type, assetId: it.assetId, src: url, prompt: it.prompt || '' });
      };
      grid.appendChild(card);
    }
    resignSome(itemsArr, seq).catch(e => console.warn('[fav] 过期回源失败', e));
  }

  /* 一张卡的缩略图就地重画（「过期地址回源换新」与「刚把字节存回本机」两条路都要它，别写两份）。
     只换那一个 .thumb 节点，不整表 render —— 备注框正在打字时整表重画会把光标弄丢。
     地址由调用方递进来：过期回源那一路手里已经是新地址了，这里再走一次 Fav.urlOf
     会拿到存储里那份还没落盘的旧地址（写回是 debounce 的）。 */
  function repaintThumb(it, url) {
    const card = Array.from($('grid').children).find(x => x.dataset.key === it.key);
    const old = card && card.querySelector('.thumb');
    if (!old || !url) return;
    const t = thumbFor(it, url);
    old.outerHTML = t.html;
    const tw = card.querySelector('.thumb');
    tw.style.cursor = 'zoom-in';
    tw.onclick = e => { e.stopPropagation(); Wb.lightbox.open(it); };
    const tm = tw.querySelector('video[data-src], video[src], img');
    if (tm) Wb.thumbs.bind(tw, tm, url, null, t.tkey);
  }

  /* 签名过期的外链放进 <img>/<video> 就是 403 破图（收藏放几天后必然遇到）：
     首屏照旧先画出来，这里放后台按任务号回源换新地址，换到了只重画那一张卡 ——
     整表 render 会把正在输入的备注和滚动位置打断。新地址由 Fav.resignSome 顺手写回存储
     （过期判定与按平台批量回源只在 assetlib.js 的 Api.healMedia 有一份），
     下次打开就是新鲜的，不用每回都吃一轮 403。 */
  async function resignSome(items, seq) {
    await Fav.resignSome(items, (it, next) => {
      if (seq !== renderSeq) return;
      repaintThumb(it, next);
    });
  }

  $('q').oninput = () => { resetPaging(); render(); };
  $('aiFindBtn').innerHTML = (window.icon ? icon('sparkles', 14) : '') + ' AI 找素材';

  /* AI 找素材：话就写在搜索框里，点一下就地筛这个列表 —— 与资产库页、统一选择器同一套做法。
     以前这里弹一个独立输入窗口（两个框填的是同一件事，人要在两处来回跳），
     旁边还挂着一个「AI 从资产库找并收藏」—— 那是资产库的活，收藏页只管挑已有的。 */
  function paintAiChip() {
    window.AiChip.paint('aiChip', { text: aiPick ? window.AiChip.picked(aiPick.size, aiWhy) : '', onClear: clearAiPick });
  }
  /* 撤掉 AI 条件 = 把那一族的三个字段一起收回（公共层 `AiFind.clear` 只做这一件事）。
     AI 的名次一清，顺序就退回存盘那一种（新添加的在前）—— 这一页没有可挑的档位，
     所以不是「回到某个用户挑过的排序」。 */
  function clearAiPick() { window.AiFind.clear(AI); }
  /* 闸门、按钮忙态、JSON 契约、名次与理由的记账都在公共层那一份里（`assetlib.js` 的 `AiFind`），
     这一页只交代「库里有什么可挑」「它该返回哪个字段」「挑完写回哪三个变量」。
     以前这两道闸走 `Toast.info` —— 而 ok/info 默认是静音的（`sk_quiet_ok`），
     于是「搜索框里没字就点 AI 找素材」在素材库会说一句、在这一页按了什么都没发生。
     公共层把那句交回 `say`（写进按钮旁边那行读数，就地、不静音）。 */
  const AI = {
    label: 'AI 找素材',
    btn: () => $('aiFindBtn'),
    ask: () => $('q').value,
    focus: () => $('q').focus(),
    emptyMsg: '还没有收藏：在各工作台产物上点 ☆，或用右边的「上传本地文件」',
    noneMsg: 'AI 没找到合适的收藏（换个说法再试）',
    roster: () => Fav.list(),
    field: 'keys',
    known: k => Fav.has(k),
    payload: q => ({ 需求: q, 我的收藏: Fav.text(100) }),
    sys: '你是素材管家：用户会用一句话描述需求，你要从他「我的收藏」清单里挑出最合适的若干条。\n'
      + '规则：\n'
      + '1. 只输出 JSON，不要任何解释、不要 markdown 代码块。格式：{"keys":["收藏ID"],"summary":"一句话说明挑了什么"}\n'
      + '2. 优先级：备注（备注写的是用途）> 名称/描述 > 类型。\n'
      + '3. 宁缺毋滥：确实没有合适的就返回空数组，不要硬凑。\n'
      + '4. summary 说清你按什么理解的需求，界面会显示给用户看。',
    /* apply 只写那三个字段：清芯片走的也是它，把「放开类型档」写进来就变成
       「点 ✕ 连我挑过的 图片/视频/音频 那一档也给我改了」。
       keys 的顺序本身就是「最合适在前」（提示词里写了优先级），aiRank 记下来照着排 ——
       以前这份顺序被整份丢掉，画出来还是存盘顺序。 */
    apply: s => { aiPick = s.pick; aiRank = s.rank; aiWhy = s.why; },
    onPick: () => { $('q').value = ''; filter = 'all'; },   // 原话已翻成 key；挑的是跨档的一批，档还锁着就看不见
    done: () => { resetPaging(); render(); },
    /* 挑中了不另写一句：芯片上已经写了「AI 挑的 N 条 · 理由」，#cnt 保留 render 算出来的条数就够
       （以前两处各说一遍）。只有没挑中/失败才顶上去说一句，公共层把它排在 done 之后 —— 重画会重写这一行。 */
    say: t => { $('cnt').textContent = t; },
  };
  const runAiFind = () => window.AiFind.run(AI);
  $('aiFindBtn').onclick = runAiFind;
  $('q').addEventListener('keydown', e => { if (e.key === 'Escape') { $('q').value = ''; clearAiPick(); } });

  /* ---------- 「存回本机」：把这一屏里本机还没有那份字节的收藏取回本机 ----------
     为什么这一页不跟着「不显示云端任务」一起筛，却要单独有这么一颗按钮：
     收藏存的是人自己挑过的东西，按「本机有没有副本」把它们藏掉，用户看到的只是
     「我的收藏凭空少了一批」—— 判据的副作用不该糊在人的数据上。所以这一页照旧全画，
     只给一条把字节真正取回本机的路，存没存由人决定。
     落盘走 `AssetLocal.pullMany`（与后台自动镜像同一条链：同一份身份判据、同一道去重、
     同一份按类型另存），所以存回本机之后生成工作台与资产库立刻也认得这一份，
     不需要在那两页再存第二遍。 */
  /* 按钮上的字与「还剩几条」按此刻这一屏现算，画法与措辞走公共层那一份
     （AssetLocal.pullBtn，与生成工作台 / 资产库 / 素材库那三颗同一套说法）：
     以前它在初始化时写死一次，筛完、搜完、存完都还挂着最初那个数 —— 看着像按钮没反应。 */
  function paintPullBtn() {
    AssetLocal.pullBtn($('pullBtn'), pullScope().length, { what: '收藏', more: '本地上传的那一批不算。' });
  }
  function pullScope() {
    const seen = new Set();
    return viewItems.filter(it => {
      if (it.kind === 'local') return false;        // 字节本来就在浏览器库里，不用下
      if (!it.key || seen.has(it.key)) return false;
      seen.add(it.key);
      return !AssetLocal.hasLocalAddr(it.src || it.dl || '');
    });
  }
  const pullName = it => String(it.prompt || it.name || '这一条').slice(0, 12);
  async function pullLocal() {
    const todo = pullScope();
    const btn = $('pullBtn');
    if (!todo.length) {
      /* 一句实话，并且要说清「为什么没有可下的」—— 只回「都存好了」会让人以为按钮坏了。 */
      Toast.info(viewItems.some(x => x.kind !== 'local')
        ? '这一屏要存的本机都已经有了（本地上传的那一批不算，它的字节本来就在浏览器里）'
        : '这一屏只有本地上传的文件，字节本来就在浏览器里，不用存');
      return;
    }
    AssetLocal.pullStart(btn);
    /* 循环、计数、回执措辞全部走公共层 `AssetLocal.pullMany / pullReceipt`
       （收藏、素材库、资产库三颗「存回本机」共用那一份），这一页只留它自己那两笔：
       存好了要把本机地址写回收藏项、并只重画那一张卡。 */
    const s = await AssetLocal.pullMany(todo.map(it => ({
      entry: it, name: pullName(it),
      apply: u => { Fav.localize(it, u); repaintThumb(it, u); },
    })), { onProgress: (done, total) => btnText(btn, '存回本机 ' + done + ' / ' + total) });
    AssetLocal.pullEnd(btn);
    /* 整颗按此刻这一屏重画：图标与「还剩几条」都回到当前状态（全失败时也不能停在没有图标那一版）。 */
    paintPullBtn();
    AssetLocal.pullReceipt(s, { nothing: '这一屏没有需要存的收藏' });
  }
  $('pullBtn').onclick = pullLocal;

  $('uploadBtn').onclick = () => $('uploadFile').click();
  $('uploadFile').onchange = async e => {
    const files = [...(e.target.files || [])];
    e.target.value = '';
    if (!files.length) return;
    $('uploadBtn').disabled = true;
    const old = $('uploadBtn').innerHTML;
    $('uploadBtn').textContent = '正在保存…';
    // 上传失败要说出来（以前是空 catch，拖 10 个文件失败几个完全不知道）
    let ok = 0; const fail = [];
    for (const f of files) {
      try { await Fav.addLocalFile(f); ok++; }
      catch (err) { fail.push((f && f.name ? f.name : '文件') + '：' + err.message); }
    }
    if (fail.length) Toast.err(`有 ${fail.length} 个文件没能加入收藏：` + fail.slice(0, 3).join('；') + (fail.length > 3 ? ' 等' : ''));
    else if (ok) Toast.ok('已加入 ' + ok + ' 个文件');
    $('uploadBtn').disabled = false;
    $('uploadBtn').innerHTML = old;
    render();
  };
  // 拖拽本地文件到页面也能收藏
  document.addEventListener('dragover', e => { e.preventDefault(); document.body.classList.add('drop'); });
  document.addEventListener('dragleave', e => { if (e.target === document.documentElement) document.body.classList.remove('drop'); });
  document.addEventListener('drop', async e => {
    if (!e.dataTransfer || !e.dataTransfer.files || !e.dataTransfer.files.length) return;
    e.preventDefault();
    document.body.classList.remove('drop');
    let ok = 0; const fail = [];
    for (const f of [...e.dataTransfer.files]) {
      try { await Fav.addLocalFile(f); ok++; }
      catch (err) { fail.push((f && f.name ? f.name : '文件') + '：' + err.message); }
    }
    if (fail.length) Toast.err(`有 ${fail.length} 个文件没能加入收藏：` + fail.slice(0, 3).join('；') + (fail.length > 3 ? ' 等' : ''));
    else if (ok) Toast.ok('已加入 ' + ok + ' 个文件');
    render();
  });
  Wb.thumbs.hydrate().then(n => { if (n) render(); }).catch(() => {});   // 首帧缓存：有就直接当图片用
  /* 动态加载模式：滚到哨兵就再多拉一页（收藏是本地数据，不用请求，只要别一次画几百张卡片） */
  /* 动态加载模式：滚到哨兵就再多拉一页（收藏是本地数据，不用请求，只要别一次画几百张卡片）。
     触发机制走 Wb.pager.sentinel（全站一份）；守卫与「续拉之后做什么」是本页自己的账。 */
  Wb.pager.sentinel('gridEnd', () => {
    if (PAGE_MODE !== 'more' || shownCount() >= viewItems.length) return;
    morePages++;
    render();
  });
  // 收藏变化：本页是 fav-change，其它标签页是 storage 事件（都要重画列表）
  window.addEventListener('fav-change', () => render());
  window.addEventListener('storage', e => { if (!e.key || e.key === 'fav_items') render(); });
  if (window.Dropdowns) Dropdowns.build(document);
  /* 首屏画完再去本机归档里补提示词（同一份东西在资产库有提示词、这一页却写「(无描述)」的根因：
     收藏项存的是建卡那一刻的快照，当时归档还没补齐就一直空着）。
     补完**不整块重画** —— render() 会把正在敲的备注框一起换掉、光标跳走，
     所以只把卡片上那一行标题的文本换掉。 */
  render().then(() => Fav.refillPrompts(() => {
    const map = new Map(Fav.list().map(x => [x.key, x]));
    $('grid').querySelectorAll('.card[data-key]').forEach(card => {
      const it = map.get(card.dataset.key);
      const t = it && card.querySelector('.t');
      if (t) t.textContent = it.prompt || it.name || '(无描述)';
    });
  }));
})();
</script>
</body>
</html>
