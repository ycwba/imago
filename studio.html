<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>生成工作台 · 拾帧</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236d5cf5'/%3E%3Ctext x='16' y='22' font-family='system-ui,-apple-system,Segoe UI,sans-serif' font-size='15' font-weight='700' fill='%23fff' text-anchor='middle'%3EAI%3C/text%3E%3C/svg%3E">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('dir_theme')||'light'}catch(e){}</script>
<link rel="stylesheet" href="ui.css">
<style>

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(900px 500px at 85% -5%, rgba(108,140,255,.14), transparent 60%),
      radial-gradient(700px 500px at -10% 100%, rgba(160,108,255,.10), transparent 60%),
      var(--bg);
    color: var(--txt); min-height: 100vh;
  }
  /* 两栏布局（.layout / .col-left / .col-right #result / 滚动条）在 ui.css 的
     「工作台共用布局」里统一定义：页面 <style> 里不要再抄一份。 */

  /* ---------- 左栏顶部：类型切换（左） + 模型下拉（右） ---------- */
  .st-top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .st-top .ui-seg { flex: 0 0 auto; }
  .st-top .st-model { flex: 1 1 auto; min-width: 0; display: flex; justify-content: flex-end; }
  .st-top .st-model select { width: 100%; max-width: 340px; }
  /* 「现在在服务的是哪一家 / 能力来自哪边」那一行：换类型时内容跟着换 */
  .st-sub { font-size: 11.5px; color: var(--sub); margin: 0 2px 10px; min-height: 15px; }
  .st-sub.warn { color: var(--warn, #b45309); }

  /* ---------- 提示词区 ---------- */
  .prompt-box { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 6px 0; transition: border-color .15s; }
  .prompt-box.over { border-color: var(--acc); box-shadow: 0 0 0 3px rgba(108,140,255,.12); }
  textarea { width: 100%; min-height: 132px; padding: 12px; background: transparent; color: var(--txt);
    border: 0; border-radius: 8px; font-size: 14px; font-family: inherit; outline: none; resize: vertical; }
  /* 输入框下面那一行：语音的字数（超了就红）。贴着输入框，不占右边那排按钮的位置 */
  .prompt-hint { padding: 0 12px 8px; font-size: 11.5px; line-height: 1.5; color: var(--sub); }
  .prompt-hint.bad { color: var(--err, #dc2626); }
  .prompt-box .slot-row { padding: 0 6px 8px; }
  .prompt-box .slot-row:empty { display: none; }
  /* 语音台的「风格 / 音色描述」是提示词之外唯一必填项，单独一行，别塞进高级设置里 */
  .style-row { padding: 0 6px 10px; }
  .style-row label { display: block; font-size: 12px; color: var(--sub); margin-bottom: 5px; }
  .style-row input { width: 100%; }

  /* ---------- 高级设置（三种类型共用这一个容器，内容按类型重建） ---------- */
  /* 面板的底色 / 描边 / 圆角在 ui.css；这里只留它没有的两条：上边距、裁掉圆角让头行贴边。 */
  .adv { margin-top: 12px; overflow: hidden; }
  /* 字号、字重、以及那个把默认 h2 外边距和行高压掉的 margin:0 / line-height 都在 ui.css；
     本页之前把整条重写了一遍，等于把那两行顺手又放了回去（头行凭空高出一截）。
     这里只补公共没有的 —— 让标题里那个图标跟文字对齐。 */
  .adv-head h2 { display: flex; align-items: center; gap: 6px; }
  /* .adv 这一组的排版（间距、字号、列宽、折叠动画）统一在 ui.css，导演台用的是同一份。
     这里只留它没有的：.adv 的上边距与裁圆角、标题里图标的 flex 对齐。 */
  .adv-grid + .adv-grid { margin-top: 10px; }
  .adv-grid label { display: block; font-size: 12px; color: var(--sub); margin-bottom: 5px; }
  .adv-grid select, .adv-grid input { width: 100%; }
  .costbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 12px;
    font-size: 12.5px; color: var(--sub); flex-wrap: wrap; }
  .costbar .note { color: var(--sub); }
  .hint { font-size: 11.5px; color: var(--sub); }
  .ver { text-align: center; font-size: 11.5px; color: var(--sub); padding: 14px 0 4px; }

  /* ---------- 左栏：素材槽磁贴的排布 ----------
     磁贴长什么样只有 ui.css 那一份；这里只管这一页怎么排。ui.css 的 .assets-grid 是
     导演台那套「固定三列」，原样搬过来会把一个槽拉成 300 多 px 的巨砖（这一页轨道比
     导演台窄，槽位常常只剩一两个），看上去就是「磁贴大小不一、竖排参差」。
     改成按容器宽度自动排的等宽方块：几列是算出来的，不是写死的。
     排列顺序照导演台右栏：图片类槽位进方格网格，参考视频 / 参考音频整行横排（.slot-wide）。 */
  #inputArea .assets-grid { grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); }
  #inputArea .asset-slot { min-width: 0; }
  /* 名字较长的素材（本地文件名）别把磁贴撑变形 */
  #inputArea .asset-slot > .sub { max-width: 100%; overflow-wrap: anywhere; }
  #inputArea > .slot-wide { margin-top: 9px; }
  /* 拖到**某一格**上时的落点提示（比整块高亮更具体：这一格就是要收下它的那一栏，
     拖到首帧就进首帧）。落点判据见下面 #inputArea 上那几条委托监听。 */
  #inputArea .asset-slot.drop-on { border-color: var(--acc); border-style: solid; background: rgba(108,140,255,.10);
    box-shadow: 0 0 0 3px rgba(108,140,255,.16); }
  /* 拆分片段面板的选项行 */
  .split-opts { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12px; color: var(--sub); }
  .split-opts select { padding: 4px 8px; background: var(--input); border: 1px solid var(--line); border-radius: 3px; color: var(--txt); font-size: 12px; }
  /* 「自定义」那一档就地展开的输入框：跟上一个下拉一样高，整行还是 flex-wrap，窄屏会自己掉下一行 */
  .split-opts input { padding: 4px 8px; background: var(--input); border: 1px solid var(--line); border-radius: 3px; color: var(--txt); font-size: 12px; width: 212px; }
  .split-opts input:focus { outline: none; border-color: var(--acc, #6957e8); }

  /* ---------- 右栏：历史资产库 ---------- */
  .hist-filters { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .hist-filters .sp { flex: 1; }
  /* 类型筛选那一排**不许被挤窄**：`.ui-seg` 自带 overflow:hidden，右栏一窄它就会把
     最后一颗切掉半截（看着就像那颗「没有公共样式」了）。数字位数一变宽度就变
     （全部 12 → 全部 491），所以这里给它自然宽度，挤不下就整排换行。 */
  .hist-filters > .ui-seg { flex: 0 0 auto; }
  /* 卡片改成「画面在上、信息在下」的竖版网格：视频要能在小栏里直接看，
     132×96 的横版小图放不下原生播放器（ui.css 的 .task 是给列表用的横版）。 */
  body.wb2 .col-right #result { display: grid; grid-template-columns: repeat(auto-fill, minmax(268px, 1fr));
    gap: 12px; align-content: start; }
  body.wb2 .col-right #result .task { flex-direction: column; gap: 8px; margin-bottom: 0; padding: 10px; }
  body.wb2 .col-right #result .task .timg { width: 100%; height: auto; aspect-ratio: 16 / 9; cursor: default; align-self: stretch; }
  body.wb2 .col-right #result .task .timg img,
  body.wb2 .col-right #result .task .timg video { width: 100%; height: 100%; object-fit: cover; }
  body.wb2 .col-right #result .task .timg.sound { aspect-ratio: 16 / 7; }
  body.wb2 .col-right #result .task .timg audio { width: 100%; }
  /* 卡片内的播放按钮：视频 / 音频共用一套（bindCardPlay 接线）。播放中淡出，鼠标移回画面才回来 */
  #result .timg.playable { position: relative; }
  /* 播放键在**左下角**（不覆盖画面中心，中心要留给首帧） */
  #result .timg.playable .tplay { position: absolute; left: 8px; bottom: 8px; z-index: 4; width: 34px; height: 34px;
    border-radius: 50%; border: 0; cursor: pointer; display: flex; align-items: center; justify-content: center;
    color: #fff; background: rgba(12, 14, 22, .68); box-shadow: 0 2px 10px rgba(0, 0, 0, .35);
    transition: opacity .15s, transform .15s; }
  #result .timg.playable .tplay:hover { transform: scale(1.08); }
  #result .timg.playable .tplay svg { width: 15px; height: 15px; fill: currentColor; margin-left: 2px; }
  #result .timg.playable .tplay svg rect { margin-left: -2px; }
  #result .timg.playable.playing .tplay { opacity: 0; pointer-events: none; }
  #result .timg.playable:hover.playing .tplay { opacity: 1; pointer-events: auto; }
  /* 音频卡：一个大音频符号做背景（不是空白占位），播放器叠在上面 */
  #result .timg.sound { background: var(--panel2, #f3f4f9); justify-content: center; }
  #result .timg.sound .tbg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: var(--line, #e4e6f0); pointer-events: none; }
  #result .timg.sound .tbg svg { width: 46px; height: 46px; fill: none; stroke: currentColor; stroke-width: 1.2; }
  #result .timg.sound audio { position: relative; z-index: 2; width: 100%; margin-top: 14px; }
  body.wb2 .col-right #result .task .tmain { gap: 5px; }
  body.wb2 .col-right #result .task .tprompt { max-height: 2.9em; overflow: hidden; }
  body.wb2 .col-right #result .task .meta2 { overflow-wrap: anywhere; }
  body.wb2 .col-right #result .task .acts { margin-top: 2px; }
  /* 拖拽提示：卡片可拖到左栏当参考素材（鼠标按住时给个明确的抓手） */
  body.wb2 .col-right #result .task { cursor: grab; }
  body.wb2 .col-right #result .task.dragging { opacity: .45; }
  body.wb2 .col-right #result .task .acts,
  body.wb2 .col-right #result .task .tdetail,
  body.wb2 .col-right #result .task .timg video,
  body.wb2 .col-right #result .task .timg audio { cursor: auto; }
  .card-badge { display: inline-flex; align-items: center; gap: 5px; }
  .card-badge .ui-tag { margin: 0; }
  /* 卡片顶部那一行：类型 + 状态芯片在左、时间在右 */
  #result .card-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  #result .card-top .date { font-size: 11.5px; color: var(--sub); white-space: nowrap; }
  /* 网格里那些要占满整行的（空态、平台读取失败提示条） */
  body.wb2 .col-right #result > .list-note,
  body.wb2 .col-right #result > .empty { grid-column: 1 / -1; }
  /* 「输入模式」那一排：单颗胶囊的样式在 ui.css 的 .ui-pill，这里只管怎么排。
     换行放在最后一条 —— 说明句要占满一行，芯片挤在左边。 */
  .mode-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: -2px 0 10px; }
  .mode-row .ui-pill { font-size: 12px; padding: 4px 10px; }
  .mode-row .why { flex-basis: 100%; font-size: 11.5px; color: var(--sub); }

  @media (max-width: 720px) {
    textarea { min-height: 112px; font-size: 13.5px; }
    .st-top { flex-wrap: wrap; }
    .st-top .st-model { flex: 1 1 100%; justify-content: flex-start; }
    .st-top .st-model select { max-width: none; }
    body.wb2 .col-right #result { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
  }
</style>
</head>
<body class="wb2">
<div class="page-main">
<div class="layout">
  <!-- 左栏：① 类型 + 模型 → ② 提示词与素材槽 → ③ 高级设置 → ④ 生成 -->
  <div class="col-left">
    <div class="st-top">
      <div class="ui-seg" id="typeSeg" role="tablist" aria-label="生成类型">
        <button type="button" class="on" data-t="video">视频</button>
        <button type="button" data-t="image">图像</button>
        <button type="button" data-t="audio">音频</button>
      </div>
      <div class="st-model"><select id="model"></select></div>
    </div>
    <div class="st-sub" id="stSub"></div>

    <div class="prompt-box" id="promptBox">
      <textarea id="prompt" spellcheck="false"></textarea>
      <!-- 语音的字数提示：型号声明的上下限就摆在这儿，别等点生成才被拦下（L16） -->
      <div class="prompt-hint" id="promptHint" hidden></div>
      <div class="btn-row">
        <button class="tool acc" id="polishBtn" title="调用文字AI改写提示词（密钥在「设置」配置）"><span class="ic" data-icon="sparkles" data-size="14"></span>AI 润色</button>
        <!-- 拆分片段批量生成：只有图像栏有（视频 / 语音没有「一段描述拆几张」这种用法） -->
        <button class="tool" id="splitBtn" hidden title="把这段描述拆成几张图的提示词，确认后逐条提交（每条都是一条真任务）"><span class="ic" data-icon="sparkles" data-size="14"></span>拆分片段生成</button>
        <span class="sp"></span>
        <button class="tool danger" id="clearAll" title="清空提示词、素材与参数"><span class="ic" data-icon="trash" data-size="14"></span>一键清空</button>
      </div>
      <div id="polishInline" hidden></div>
      <!-- 拆分的选项面板：就地问（张数 / 维度），不开弹窗；规划结果在公共 PromptReview 里过一遍才提交 -->
      <div class="pinl" id="splitInline" hidden>
        <div class="pinl-hd">
          <span class="pinl-tt">拆分片段批量生成</span>
          <span class="pinl-note">每张是一条独立任务（逐条提交、各自计费）；下方槽里的参考图会一起带去</span>
        </div>
        <div class="split-opts">
          <label>张数 <select id="splitCount">
            <option value="">自动（AI 按内容定 2–6 张）</option>
            <option>2</option><option>3</option><option>4</option><option>5</option><option>6</option>
          </select></label>
          <label>拆分维度 <select id="splitDim">
            <option value="">自动（AI 选最自然的）</option>
            <option>按时间顺序</option>
            <option>按场景变化</option>
            <option>按动作或状态阶段</option>
            <!-- 自定义：勾了就地多出一个输入框，自己写拆法（上面四项覆盖不了的写法靠它） -->
            <option value="__custom">自定义…</option>
          </select></label>
          <label id="splitDimCustomWrap" hidden><input id="splitDimCustom" maxlength="60"
            placeholder="例：按主角情绪变化 / 按道具出现的先后顺序"></label>
          <span class="sp"></span>
          <button class="tool acc" id="splitGo">开始规划</button>
          <button class="tool" id="splitCancel">取消</button>
        </div>
      </div>
      <!-- 语音台的「音色设计」必填项：只有那一种模型才出现 -->
      <div class="style-row" id="styleRow" hidden>
        <label>风格 / 音色描述 <span style="color:var(--err)">*</span>（音色设计模型必填）</label>
        <input id="style" class="ui-inp" placeholder="例：一位温柔的年轻女声，语速偏慢，适合睡前故事">
      </div>
      <!-- 「输入模式」：平台把「一次请求能同时用哪些素材」写在能力声明里（Capabilities.combos），
           这一排就按那份声明出现或消失。只有把素材分成互斥几档的平台（VGENV 的首尾帧 / 参考素材 /
           视频换人）才会画它；没有这种声明的家一个芯片都不会出现，槽位沿用原来的互斥置灰。 -->
      <div class="ed-label" id="modeHead" hidden><span>输入模式</span><span class="cnt" id="modeHeadNote"></span></div>
      <div class="mode-row" id="modeRow" hidden></div>
      <!-- 素材行：排列照导演台右栏那套（栏目标签行 → 方格网格 → 全宽横排槽位）。
           一个素材一块缩略图（随所选模型的能力出现；右栏卡片可直接拖进来） -->
      <div class="ed-label" id="slotHead" hidden><span>参考素材</span><span class="cnt" id="slotHeadNote"></span></div>
      <div class="slot-wrap" id="inputArea"></div>
    </div>

    <div class="adv" id="adv">
      <div class="adv-head" id="advHead">
        <h2><span data-icon="gear" data-size="14"></span> <span id="advTitle">高级设置</span></h2>
        <span class="sum"><span id="advSum"></span><span class="chev">▼</span></span>
      </div>
      <div class="adv-body" id="advBody"></div>
      <div class="hint" id="capHint" style="font-size:11.5px;color:var(--sub);margin-top:10px"></div>
    </div>

    <div class="costbar"><span id="costTxt">估价中…</span><span class="note" id="mode">文生视频</span></div>
    <button class="go" id="go">生成视频</button>
    <div class="hint" id="goWhy"></div>
    <div id="status"></div>
    <!-- 提交还在等平台响应时的提示（含秒数与「仍然再提交」）。**不用遮罩弹窗**：
         状态行 #status 谁都可能写，这块只由 renderPendingHint 写，互不抢 -->
    <div class="hint" id="pendingHint" style="display:none;font-size:11.5px;margin-top:6px"></div>
  </div>

  <!-- 右栏：三种类型合在一起的历史资产库 -->
  <div class="col-right">
    <div class="tasks-head">
      <span class="tab">历史资产库</span>
      <span class="sp"></span>
      <span class="pgroup">
        <input type="search" id="searchBox" placeholder="搜索提示词 / ID" autocomplete="off" spellcheck="false">
        <button class="ghost" id="searchBtn">搜索</button>
        <span class="pgsep"></span>
        <button class="ghost" id="pgPrev" style="display:none">‹ 上一页</button>
        <span class="pginfo" id="pgInfo">第 1 页</span>
        <button class="ghost" id="pgNext" style="display:none">下一页 ›</button>
        <input type="number" id="gotoPage" min="1" placeholder="跳页">
        <button class="ghost" id="gotoBtn">跳转</button>
        <button class="ghost" id="sync" title="重新从各平台取回这一屏列表"><span data-icon="refresh" data-size="13"></span> 刷新</button>
      </span>
    </div>
    <div class="hist-filters">
      <!-- 类型分类由数据现算（paintKinds）：注册表里声明了哪些媒体类型、资产库里真有哪几类，就出现哪几个 -->
      <div class="ui-seg" id="histFilter" role="tablist" aria-label="按类型筛选"></div>
      <span class="sp"></span>
      <span class="hint" id="histNote"></span>
      <button class="ghost" id="winAll" title="默认只看最近 30 天；点这里看全部">查看全部</button>
    </div>
    <div id="result"></div>
  </div>
</div>
<!-- 灯箱 DOM 由 workbench.js 的 Wb.lightbox 创建（结构全站一份）-->
<div class="ver">生成工作台 · 视频 / 图像 / 音频 · 右栏卡片可拖到左栏当参考素材</div>
</div>

<script src="ui.js"></script>
<script src="workbench.js"></script>
<script src="ident.js"></script>
<script src="assetlib.js"></script>
<script src="sidebar.js"></script>
<script>
'use strict';
/* ============================================================================
   生成工作台 —— 图片 / 视频 / 语音三个工作台合并成这一页。
   ① 左栏顶部：类型分段开关（左）+ 模型下拉（右），类型决定下面挂哪一套表单
   ② 左栏下方：提示词 + 素材槽 + 高级设置（三种类型共用同一套壳，内容按类型重建）
   ③ 右栏：三种类型合在一起的历史资产库（可按类型筛、卡片内联播放、整张卡可拖到左栏当参考素材）
   ---------------------------------------------------------------------------
   三种类型共用哪些东西（别再各写一份）：素材槽与能力声明（Capabilities.specs/rule）、
   提交前的校验与「结果未知 → 核对列表」记账、统一选择器 AssetPicker、缩略图缓存 Wb.thumbs、
   卡片列表 Wb.cards、动态加载 Wb.pager、详情 Wb.detail、灯箱 Wb.lightbox、下载 Wb.save、

   只看上游 /models 的 modes.inputs 的话，「上游没声明的 role 就整个消失」。
   有「输入模式」声明时再按选中那一档过滤一次，数量也照那一档的（9 张参考图在换人档必须恰好 1 张）。 */
function modelSlots() {

    : ((model && model.options && model.options.inputSpecs) || []);
  const cb = comboNow();
  const inCombo = cb ? new Set((cb.roles || []).map(r => r.role)) : null;
  const merged = [];
  specs.forEach(sp => {

/* 本地文件入槽：拖进输入框、选择器顶部的「本地上传」、以及右栏卡片拖进来，共用这一条 */
async function addSlotFiles(kind, fileList) {
  const files = [...fileList];
  const def = SLOT_DEF[kind] || SLOT_DEF.image;
  const sl = slots.find(x => x.kind === kind);
  if (!sl) { setStatus('<span class="err">当前型号不支持「' + def.label + '」这类素材（可用入口见输入框下方的小方块）</span>'); return 0; }
  const max = sl.max;
  if (blockedSlotKinds().has(kind)) { flashSlotHint(def.label + '与已选素材互斥，请先清空已选素材'); return 0; }
  let added = 0;
  for (const f of files) {
    const arr = slotItems(kind);
    if (arr.length >= max) { setStatus('<span class="err">' + def.label + '最多 ' + max + ' 个</span>'); break; }
    const isAud = f.type.startsWith('audio/'), isVid = f.type.startsWith('video/');
    if (isAud && !def.accept.includes('audio')) { setStatus('<span class="err">' + def.label + '不支持音频文件</span>'); continue; }
    if (isVid) {
      if (def.videoFrame) {
        setStatus('正在从视频《' + (f.name || '') + '》取' + (def.videoFrame === 'last' ? '尾' : '首') + '帧…');
        try { arr.push(await Wb.vframe.fromFile(f, def.videoFrame)); arr[arr.length - 1].kind = kind; added++; setStatus('<span class="ok">✓ 已取该视频的最后一帧作为' + def.label + '</span>'); }
        catch (err) { setStatus('<span class="err">取帧失败：' + err.message + '</span>'); }
        continue;
      }
      if (!def.accept.includes('video')) { setStatus('<span class="err">' + def.label + '不支持视频文件</span>'); continue; }
      arr.push({ file: f, url: URL.createObjectURL(f), name: f.name, type: '视频', kind, fromLib: false });
      added++;
      continue;
    }
    if (!def.accept.includes('image')) { setStatus('<span class="err">' + def.label + '不支持图片文件</span>'); continue; }
    arr.push({ file: f, url: URL.createObjectURL(f), name: f.name, type: isAud ? '音频' : '图片', kind, fromLib: false });
    added++;

/* 点空槽：走公共选择器（资产库 / 我的收藏 / 本地上传三个档位，导演台与三个工作台同一份） */
async function openSlotPicker(sl) {
  const def = SLOT_DEF[sl.kind];
  const room = slotRoom(sl);
  if (room <= 0) { Toast.err(def.label + '已满（最多 ' + sl.max + ' 个）'); return; }
  const { model } = currentModel();
  /* 规则按**当前输入模式**取（同一角色在换人档必须恰好 1 张，在参考素材档能到 9 张）。
     这一格还能「选一段视频就地取帧」时，本地上传那道体积闸要放宽到这一家给视频的上限：
     传上来的 mp4 只在浏览器里取一帧，真正提交的是那张 PNG，用图片的 5 MB 去拦一段
     本来就只当素材来源的视频，等于把这个功能当场拦死（放宽只是少拦，平台仍会按它自己的规矩拒）。 */
  const rule = (window.Capabilities && Capabilities.rule) ? Capabilities.rule(model, sl.role, cur().combo) : null;
  const vidBytes = def.videoFrame && window.Capabilities && Capabilities.rule
    ? (Capabilities.rule(model, 'reference_video', cur().combo).maxBytes || 0) : 0;
  if (rule && vidBytes > (rule.maxBytes || 0)) rule.maxBytes = vidBytes;
  const upAccept = [sl.accept, def.videoFrame ? 'video/*' : ''].filter(Boolean).join(',');
  const list = await AssetPicker.open({
    types: slotTypes(sl), multiple: room > 1, limit: room,
    rule: rule || null,
    title: '选择' + def.label + (room > 1 ? '（还能加 ' + room + ' 个）' : ''),
    upload: upAccept ? { accept: upAccept } : undefined,
  });

  if (!list || !list.length) return;
  let added = 0;
  for (const en of list) {
    const arr = slotItems(sl.kind);
    if (arr.length >= sl.max) break;
    if (en.file) { added += await addSlotFiles(sl.kind, [en.file]); continue; }
    if (en.type === '视频' && !def.accept.includes('video') && !def.videoFrame) continue;
    if (en.type === '图片' && !def.accept.includes('image')) continue;
    if (en.assetId && arr.some(x => x.assetId === en.assetId)) continue;
    if (en.type === '视频' && def.videoFrame) {
      setStatus('正在从资产库视频里取' + (def.videoFrame === 'last' ? '尾' : '首') + '帧…');
      try {
        const blob = await AssetTransfer.blobOf(en.dl || en.src);
        const name = ((en.prompt || 'video').replace(/\s+/g, ' ').trim().slice(0, 14) || 'video') + '.mp4';
        const vf = new File([blob], name, { type: blob.type || 'video/mp4' });
        const it = await Wb.vframe.fromFile(vf, def.videoFrame); it.kind = sl.kind;
        arr.push(it); added++;
        setStatus('<span class="ok">✓ 已取该视频的最后一帧作为' + def.label + '</span>');
      } catch (err) { setStatus('<span class="err">取帧失败：' + err.message + '</span>'); }
      continue;
    }
    const item = { assetId: en.assetId, url: Api.mediaSrc(en.src), name: (en.prompt || '').slice(0, 14) || '资产',
      type: en.type, kind: sl.kind, fromLib: true, src: en.src };
    const usableId = window.AssetTransfer && AssetTransfer.isPlatformId(en.assetId);
    if (en.type === '图片' && (!usableId || !/^\/asset\//.test(String(en.src || '')))) {
      try {
        const blob = await AssetTransfer.blobOf(en.dl || en.src);
        const f = new File([blob], (item.name || 'ref') + '.png', { type: blob.type || 'image/png' });
        item.file = f; item.url = URL.createObjectURL(f); item.src = item.url; delete item.assetId;
      } catch (e) {}
    }
    arr.push(item); added++;
  }
  renderInputArea(); updateMode();
  if (added) setStatus('<span class="ok">✓ 已加入 ' + added + ' 个素材</span>');
}

  cur().prompt = ''; cur().style = ''; cur().topBools = {};
  $('prompt').value = ''; $('style').value = '';
  InlinePolish.clear($('polishInline'));
  renderInputArea(); renderParams(); updateMode(); refreshEst(); setStatus('');
};

/* ============================ ⑧ AI 润色（三种类型共用一个入口，三套素材说明） ============================ */
function polishImageList() {
  const srcOf = it => it.file || it.src || it.url;
  const out = [];
  const m = inputs();
  if (TYPE === 'audio') return out;
  (m.image || []).forEach((it, i) => { const s = srcOf(it); if (s) out.push({ label: '参考图 ' + (i + 1), src: s }); });
  (m.frame_first || []).forEach(it => { const s = srcOf(it); if (s) out.push({ label: '首帧（开头画面）', src: s }); });
  (m.frame_last || []).forEach(it => { const s = srcOf(it); if (s) out.push({ label: '尾帧（结尾画面）', src: s }); });
  return out;
}
function polishMaterials() {
  const m = inputs();
  if (TYPE === 'audio') {
    const n = (m.audio || []).length;
    const items = [];
    for (let i = 0; i < n; i++) items.push({ label: '参考音频' + (n > 1 ? ' ' + (i + 1) : ''), kind: '音频', sent: false, hint: '按这个音色来念' });
    return items;
  }
  const items = polishImageList().map(x => ({ label: x.label, kind: '图片', sent: true }));
  const nVid = (m.video || []).length, nAud = (m.audio || []).length;
  for (let i = 0; i < nVid; i++) items.push({ label: '参考视频' + (nVid > 1 ? ' ' + (i + 1) : ''), kind: '视频', sent: false, hint: '沿用它的运镜和节奏' });
  for (let i = 0; i < nAud; i++) items.push({ label: '参考音频' + (nAud > 1 ? ' ' + (i + 1) : ''), kind: '音频', sent: false, hint: '沿用它的节奏' });
  return items;
}

/* 文字 AI 回的拆分方案 → [{label,prompt}]：剥 markdown 代码块、兼容数组/对象包层，
   段名取 label/name/title，给的是秒数（t/time）时翻成「第 N 秒」。 */
function parseSegs(txt) {
  let s = String(txt || '').trim().replace(/^```(?:json)?\s*/i, '').replace(/\s*```\s*$/, '').trim();
  let v = null;
  try { v = JSON.parse(s); } catch (e) {
    const m = s.match(/(\[[\s\S]*\]|\{[\s\S]*\})/);
    if (m) { try { v = JSON.parse(m[1]); } catch (e2) {} }
  }
  const list = Array.isArray(v) ? v : (v && (v.frames || v.segments || v.shots || v.list));
  if (!Array.isArray(list)) return [];
  return list.map((f, i) => {
    let label = String(f && (f.label || f.name || f.title) || '').trim();
    if (!label) {
      const t = f && (f.t ?? f.time);
      const sec = (t !== undefined && t !== null && t !== '') ? parseFloat(t) : NaN;
      label = isFinite(sec) ? ('第 ' + sec + ' 秒') : ('片段 ' + (i + 1));
    }
    return { label: label.slice(0, 12), prompt: String(f && (f.prompt || f.desc || f.text) || '').trim().slice(0, 600) };
  }).filter(x => x.prompt).slice(0, 8);
}

/* 按当前输入 + 槽位参考图请文字 AI 出拆分方案（原输入框一个字不动）。 */
async function planImageSegments() {
  const src = ($('prompt').value || '').trim();
  const cnt = ($('splitCount').value || '').trim();
  /* 维度取值的判据只有 isCustomDim() 一处：选了「自定义」就用他自己写的，原样传给文字 AI
     —— 别替他改写成「按场景变化」那类预设，那正是他自己不要的；
     选了却没填就当没选（退回「你选最自然的」），不要把半句话发过去。 */
  const dim = isCustomDim() ? ($('splitDimCustom').value || '').trim() : ($('splitDim').value || '').trim();
  let user = '把下面这段描述拆成图片提示词：\n' + src;
  user += '\n\n张数：' + (cnt ? ('恰好 ' + cnt + ' 张，一张不多一张不少') : '你按内容复杂度定（2 到 6 张）');
  user += '\n拆分维度：' + (dim || '你选最自然的（时间先后 / 场景变化 / 动作阶段都行，拆法写进每个片段名）');
  const pm = polishMaterials();
  if (pm.length) user += '\n' + TextAI.materialNote(pm);
  user += '\n只返回 JSON。';
  let images = [];
  try { images = (await TextAI.polishImages(REG, polishImageList(), { max: 6 })).images; }
  catch (e) { console.warn('[拆分] 参考图附带失败：', e.message); }
  const txt = await TextAI.chat(REG, TextAI.prompt('img_split'), user, { images });
  const segs = parseSegs(txt);
  if (!segs.length) throw new Error('文字 AI 没有给出可用的拆分方案，换一条描述或再试一次');
  return segs;
}

/* 批量提交：参考图只传一次，逐条 createImageOnce（每张各自计费，不用 max_outputs 并批 ——
   每条提示词不同，本来就没法并）。单张失败不整批中止；传输层「结果未知」的那几张单独点出来
   —— 可能已受理，别重复生成。不走 trackSubmit：那是拦「同一次提交点两下」的，批量是 N 次有意提交。 */
async function submitImageBatch(segs, prov, model) {
  $('go').disabled = true;
  try {
    setStatus('批量生成 ' + segs.length + ' 张：正在上传参考图…');
    const assetIds = await uploadImageRefs(prov);
    const created = [];
    let failed = 0, uncertain = 0;
    for (let i = 0; i < segs.length; i++) {
      const sg = segs[i];
      try {
        setStatus('批量生成 ' + segs.length + ' 张（' + (i + 1) + '/' + segs.length + '）：' + escA(sg.label));
        const out = await withCreateRetry(() => createImageOnce(prov, model, sg.prompt, assetIds, 1), '第 ' + (i + 1) + ' 张「' + escA(sg.label) + '」创建失败，');
        /* 占位条目要显示得出「这一条是哪一段」，所以带提示词与片段名 ——
           只有 id 的话右栏会插出一排没有说明的空白卡。 */
        if (out.taskId) created.push({ provider: prov.id, id: out.taskId, prompt: sg.prompt,
          extra: { tier: val('tier'), res: val('res'), ar: val('ar'), dur: Number(val('dur')) || 0, model: (model && model.id) || '' } });
        else if (out.sync) await saveSyncImages(prov, model, sg.prompt, out.sync);
      } catch (e) {
        if (maybeSubmitErr(e)) { uncertain++; console.warn('[拆分] 片段「' + sg.label + '」结果未知：', e.message); }
        else { failed++; console.warn('[拆分] 片段「' + sg.label + '」提交失败：', e.message); }
      }
    }
    if (created.length) await adoptTasks(created);
    try { await loadServer(1); } catch (e) {}
    tally.run(true);
    if (uncertain) { try { await loadServer(1, true); } catch (e) {} }
    const parts = ['已提交 ' + segs.length + ' 张（右栏已列出）'];
    if (failed) parts.push(failed + ' 张失败（原因见控制台）');
    if (uncertain) parts.push(uncertain + ' 张当时没等到平台响应（可能已受理，以右栏列表为准，别重复生成）');
    setStatus(parts.join('；'));
  } finally { updateGoState(); }
}

/* ============================ ⑨ 提交（三条 create 路径，记账只有一份） ============================
   「上一条提交还在等平台响应」这套记账三台共用：重复提交 = 重复扣费，
   所以按钮禁用、结果未知时的后台核对、以及那句「仍然再提交」都收在这里。 */
const SUBMIT_UI_MS = 12000, RESUBMIT_ARM_MS = 10000;
const pendingSubmits = [];
let submitRun = 0, armedAt = 0;
const unresolvedSubmit = () => pendingSubmits.find(s => s.state !== 'settled') || null;
const resubmitArmed = () => armedAt && Date.now() - armedAt < RESUBMIT_ARM_MS;
/* 「结果未知」只按真正的传输层异常判（超时 / 断连 / 上游响应超时）：
   这些情况下请求可能已经到了平台，界面必须说「正在核对列表」而不是「失败」——
   否则用户会再点一次，那就是重复扣费。
   判据本体在 assetlib.js 的 Api.maybeSubmitted（就住在给它打 maybeSubmitted 标记的那一行旁边），
   这一行只是委托 —— 以前这里是页面自己写的一份正则，与导演台各写一遍，
   助手那条路径干脆没有（把超时判成了「失败」，用户重问一次就是第二次扣费）。 */
const maybeSubmitErr = e => !!(window.Api && Api.maybeSubmitted ? Api.maybeSubmitted(e) : false);
function trackSubmit(rec, work) {
  const at = Date.now();
  rec.at = at; rec.state = 'inflight';
  pendingSubmits.push(rec);
  /* 已结清的记录留十分钟只为让那句提示能收尾，再早就没必要 */
  while (pendingSubmits.length > 8) pendingSubmits.shift();
  renderPendingHint();
  const late = () => Date.now() - at > SUBMIT_UI_MS;
  const settled = Promise.resolve().then(work).then(r => {
    rec.state = 'settled';
    if (late()) Toast.ok('平台刚受理（等了 ' + Math.round((Date.now() - at) / 1000) + ' 秒）：任务已取回列表');
    renderPendingHint();
    return r;
  }, e => {
    rec.failed = true;
    if (maybeSubmitErr(e)) {
      rec.state = 'uncertain'; rec.note = (e && e.message) || '请求中断';
      setStatus('<span class="warn">平台可能已受理（' + rec.note + '），正在后台核对列表…</span>');
      loadServer(1, true).catch(() => {}).then(() => {
        rec.state = 'settled';
        setStatus('<span class="warn">已核对列表：上面有这条任务就是成功了，别重复生成</span>');
        renderPendingHint();
      });
    } else {
      rec.state = 'settled';
      setStatus('<span class="err">创建失败：' + escA(String((e && e.message) || e)) + '</span>');
      renderPendingHint();
    }
    if (late()) Toast.err('创建失败：' + String((e && e.message) || e));
    throw e;
  });
  settled.catch(() => {});
  return settled;
}
function armResubmit() {
  armedAt = Date.now();
  Toast.warn('上一次提交还在等平台响应：再点一次「生成」就会再提交一份');
  renderPendingHint();
}
function renderPendingHint() {
  const box = $('pendingHint');
  if (!box) return;
  const un = unresolvedSubmit();
  if (!un) { box.style.display = 'none'; box.innerHTML = ''; stopPendingTick(); return; }
  startPendingTick();
  const secs = Math.max(1, Math.round((Date.now() - un.at) / 1000));
  box.style.display = '';
  box.innerHTML = '<span class="warn">上一条提交还在等平台响应（已 ' + secs + ' 秒）：'
    + (un.state === 'inflight' ? '请求已经发出去了，平台受理后会自己出现在右边列表里。'
      : '平台可能已受理（' + escA(un.note || '响应丢了') + '），正在核对列表。')
    + '</span> 再点生成会再提交一份（可能重复扣费）：<a href="#" id="forceSubmit">仍然再提交</a>';
  const b = $('forceSubmit');
  if (b) b.onclick = e => { e.preventDefault(); armedAt = Date.now(); $('go').click(); };
}
/* 「上一条提交还在等平台响应（已 N 秒）」这一行每秒要走一次，但**只在真有未决提交时**才走：
   以前是一条永不停、不看可见性的 setInterval —— 一张什么都没提交的页面也每秒醒一次，
   而切到后台时那一行根本没人看（这一页在 iframe 里，切走页面时定时器还会跟着文档一起没，
   但标签页不可见的那几分钟纯属白跑）。定时器的起停由 renderPendingHint 自己管。 */
let pendingTick = null;
function startPendingTick() { if (!pendingTick) pendingTick = setInterval(() => { if (document.hidden) return; renderPendingHint(); }, 1000); }
function stopPendingTick() { if (pendingTick) { clearInterval(pendingTick); pendingTick = null; } }
/* 回到前台时立刻补一次（隐藏的秒数不刷新，回来要当场说对，而不是再等一秒） */
document.addEventListener('visibilitychange', () => { if (!document.hidden) renderPendingHint(); });

/* 幂等键：不是每家平台都认（registry 的 create.idempotencyKey 声明，VGENV / MiMo 是 false），
   给了对方不认的请求头，严格的上游会直接 400。 */
const idemHeader = prov => ((prov && prov.create && prov.create.idempotencyKey === false) || !(window.crypto && crypto.randomUUID))
  ? {} : { 'Idempotency-Key': crypto.randomUUID() };
/* 平台的提示词编译失败可以安全重试（任务没创建、没扣费），统一按 assetlib 的判定来，
   页面别各写一份正则。 */
async function withCreateRetry(doCreate, msg) {
  try { return await doCreate(); }
  catch (e) {
    if (window.Api && Api.isRetryableCreateError && Api.isRetryableCreateError(e)) {
      setStatus('<span class="warn">' + msg + '正在自动重试一次…</span>');
      await new Promise(r => setTimeout(r, 1200));
      return await doCreate();
    }
    throw e;
  }
}
async function uploadToPlatform(prov, blob, name, mime, onStage, role) {
  return await AssetTransfer.toAsset(prov.id, blob, { reg: REG, name, contentType: mime, onStage, role });
}
/* 素材 → 提交体里的条目：平台声明 needsUpload 的先传成资产，其余走 DataURL
   （有些平台的 reference_image 模板收的是它自己能取到的公网地址，本机回环地址它访问不到）。 */
async function buildInputEntries(prov, model) {
  const entries = [];
  const m = inputs();
  for (const k of Object.keys(SLOT_DEF)) {
    if (k === 'audio' && TYPE === 'audio') continue;          // 语音台的参考音频走音色复刻字段，不进 inputEntries
    for (const x of (m[k] || [])) {
      const role = SLOT_DEF[k].role;
      const tpl = (window.Api && Api.inputTemplate) ? Api.inputTemplate(prov, role) : null;
      if (tpl && tpl.needsUpload) {
        const label = SLOT_DEF[k].label;
        const onStage = (st, info) => { const t = uploadStageText(st, info, label); if (t) setStatus(t); };
        const blob = await AssetTransfer.blobOf(x.file || x.src || x.url, onStage);
        const mime = (x.file && x.file.type) || blob.type
          || (x.type === '视频' ? 'video/mp4' : x.type === '音频' ? 'audio/mpeg' : 'image/png');
        const aid = await uploadToPlatform(prov, blob, x.name || (label + (mime.includes('video') ? '.mp4' : '')), mime, onStage, role);
        if (aid) entries.push({ role, assetId: aid });
      } else {
        const url = x.file ? await AssetTransfer.toDataURL(x.file) : await srcToDataURL(x.src || x.url);
        if (url) entries.push({ role, url });
      }
    }
  }
  return entries;
}

/* ---------- 视频：一条一个任务，按「生成条数」循环提交 ---------- */
async function createVideoOnce(prov, model, prompt, entries) {
  /* ⚠ `model` 是**模型对象**（`currentModel()` 给的是 `{prov, model}` 两个对象），
     而提交给平台的 `model` 字段要的是**型号 id 字符串**（VGENV 是 `minimax/h3`、
     SparkCine 是 `h3-video`）。这里以前写的是裸 `model` —— 于是上游收到一个对象，
     报的是「model must be a string / must match /^…\/…$/」，
     而那句话与用户在界面上做的事毫无关系（图片那一路的 `createImageOnce` 一直写的是 `model.id`，
     两边不一致正是这个 bug 藏这么久的原因）。
     `Api.createBody` 现在也有一道类型闸（传对象会当场报错并说清是哪一项），这里是它的上游修正。 */
  const modelId = (model && model.id) || String(model || '');
  if (!modelId) throw new Error('没选出要用的视频型号 —— 在左栏「型号」里挑一个再点生成');
  /* 这一次请求的形状（有「输入模式」声明的平台才有；没有就两个空串 = 与合并前同一个提交体）。
     `creation_intent` 是**上游字段**（省略 = 普通生成，person_replacement = 动作换人）；
     `mode` 不是字段 —— 平台按送上来的素材自己推断，它只用来判声明里的 when / hide，
     走 `shape` 这个上下文递进 createBody，永远不进请求体（这一家「未知字段会被拒绝」）。
     `caps` 同样只当上下文：**不递它就没有「这一行给不给」的判据** —— 界面按那一行画出了 Turbo，
     提交体却把它判成不提供而漏掉，两边各算一半比都不算更难查。 */
  const cb = comboNow();
  const shape = { mode: (cb && cb.mode) || '', intent: (cb && cb.intent) || '', caps: shapeCaps() };
  /* 这几档**从 plan 的 payload 来**，不再逐个 `val()` 直读 DOM：面板藏着某一档时 DOM 里留着的是
     上一家的那个值，直读就是「界面没有这一档、提交体却带着它」（AGENTS §2 反复拦的那件事）。
     payload 只装声明了且真发得出去的那几项，未声明的一律缺席。 */
  const ap = advPlan(model, 'video').payload;
  const t = { model: modelId, prompt, tier: ap.tier || '', res: ap.res || '', ar: ap.ar || '',
    dur: Number(ap.duration) || 0, size: ap.size || '', entries };
  const bools = readBoolParams();
  const d = await Api.request(prov, 'create', {
    method: 'POST', headers: idemHeader(prov),
    log: { type: '视频生成', meta: { 模型档位: t.tier, 分辨率: t.res, 画幅: t.ar || t.size, 时长: t.dur ? t.dur + 's' : '',
      输入模式: cb ? comboLabel(cb) : '',
      顶层参数: shapeFieldsSummary(),
      参考素材: entries.length ? entries.length + ' 个' : '',
      生成音频: bools.generate_audio !== undefined ? (bools.generate_audio ? '是' : '否') : '',
      平台润色: (function () { const t = topBoolParams(); const on = Object.keys(t).filter(k => t[k]); return on.length ? '是' : ''; })() } },
    body: Api.createBody(prov, { model: t.model, prompt: t.prompt, tier: t.tier, duration: t.dur, res: t.res, ar: t.ar,
      size: t.size, creation_intent: shape.intent, shape, inputEntries: t.entries,
      params: Object.assign({}, bools, topBoolParams(), shapeFieldParams()) }),
  });

  if (d.error) throw new Error(d.error.message || '创建失败');
  const p = Api.parseItem(prov, d) || {};
  /* 任务号优先按 registry 声明的 list.map.id 取（MiniMax 是 task_id、SiliconFlow 视频是 requestId、
     早先那几家是 id）—— 只认 d.id 的话，声明里换过字段名的平台拿回来的就是 undefined：
     任务建了、界面却不接管轮询，卡片永远不出现在列表里（也不报错，最难查的一种）。 */
  return { taskId: p.genId || d.id || d.task_id || d.requestId || d.job_id || p.assetId, priceText: Api.priceText(prov, p) };
}
/* ---------- 图片：一次请求出 N 张，按平台声明的 max_outputs 分批 ---------- */
async function createImageOnce(prov, model, prompt, assetIds, n) {
  const inputs2 = [];
  /* 「哪几档进提交体」由同一份 plan 判（声明了才带）—— 以前这里按 qualities / aspect_ratios /
     sizes / output_formats 各判一遍，那是回落判据之外的第二个「平台收不收这一项」的口径。 */
  const ap = advPlan(model, 'image').payload;
  ['quality', 'ar', 'size', 'format'].forEach(k => { if (ap[k] !== undefined) inputs2.push({ k: k, v: ap[k] }); });
  const std = { model: model.id, prompt };
  for (const x of inputs2) std[x.k] = x.v;
  /* 张数只用 plan 判「这一家收不收 count 这个字段」，值取**分批后的 n**（一次点生成按
     max_outputs 切批发好几条，下拉那一档是「一共几张」，比它更具体）。 */
  if (ap.count !== undefined) std.count = n;
  if (assetIds.length) std.inputs = assetIds.map(id => ({ role: 'reference_image', asset_id: id }));
  /* 平台在 create.topBools / create.shapeFields 里声明的那几项，图像台这一路也必须真的带上。
     那两排控件现在是**按声明给三种类型都渲染**的（以前只在视频台画），而这一路只递 std 里那几样、
     params 一个没带 —— 于是「高级设置里画得出来、提交体里一个字都没有」，正是本项目反复要拦的那一类。
     今天生图这一族还没声明过顶层开关（带过去的是空对象），但判据与视频那一路同一份：
     声明一出现就到提交体，不用再改这里。
     `shape` 取 topBoolCtx()：图像台没有「输入模式」，mode / intent 就是空串，与画面那块同一个上下文。 */
  std.params = Object.assign({}, topBoolParams(), shapeFieldParams());
  std.shape = topBoolCtx();
  const d = await Api.request(prov, 'create', {
    method: 'POST', headers: idemHeader(prov),
    log: { type: '图片生成', meta: { 画质: ap.quality || '', 画幅: ap.ar || '', 格式: ap.format || '',
      本批张数: n > 1 ? n + ' 张' : '', 参考图: assetIds.length ? assetIds.length + ' 张' : '',
      顶层参数: shapeFieldsSummary() } },
    body: Api.createBody(prov, std),
  });
  if (d.error) throw new Error(d.error.message || '创建失败');
  /* 同步返回的平台（OpenAI 兼容生图那类）当场就给图，没有任务号 —— 照 registry 的 create.sync 取数，
     取不到再走原来的「建任务 → 轮询」。别在这里 if (prov.id === …)，形状由平台自己声明。 */
  const sync = Api.syncMedia(prov, d);
  if (sync) return { sync, priceText: '' };
  const p = Api.parseItem(prov, d) || {};
  return { taskId: d.id || p.assetId, priceText: Api.priceText(prov, p) };
}
/* 同步拿回来的图：取回字节 → 存进本机资产库（外链有效期很短，列表里放外链明天就全裂）。
   走 AssetTransfer.blobOf（内部 /getfile）取字节，和别的素材转存同一条路。 */
async function saveSyncImages(prov, model, prompt, items) {
  const out = [];
  for (const it of items) {
    let b64 = it.b64 || '';
    if (!b64 && it.url) {
      const onStage = (st, info) => { const t = uploadStageText(st, info, '产物'); if (t) setStatus(t); };
      const blob = await AssetTransfer.blobOf(it.url, onStage);
      if (!blob) continue;
      b64 = dataURLToB64(await AssetTransfer.toDataURL(blob));
    }
    if (!b64) continue;
    const url = it.url || '';
    const ext = (url.match(/\.(png|jpe?g|webp)(?:\?|$)/i) || [])[1];
    const fmt = (ext || String((model.options || {}).defaults?.output_format || 'png')).toLowerCase().replace('jpg', 'jpeg');
    const saved = await Api.saveLocalAsset({
      name: '生图-' + (prompt || '').replace(/\s+/g, ' ').trim().slice(0, 16) + '.' + fmt,
      mime: fmt === 'jpeg' ? 'image/jpeg' : (fmt === 'webp' ? 'image/webp' : 'image/png'),
      format: fmt === 'jpeg' ? 'jpeg' : fmt, data: b64,
      meta: { prompt, model: model.id, provider: prov.id },
    });
    out.push({ id: saved.assetId || saved.id, url: saved.url || ('/asset/' + (saved.assetId || saved.id)) });
  }
  return out;
}
/* ---------- 语音：同步合成（上游没有任务号），本机记录就是唯一凭据 ---------- */
const pcm16ToWav = (b64, sr) => AiGen.pcm16ToWav(b64, sr);
const b64FromBuf = buf => AiGen.b64FromBuf(buf);
/* 十六进制 → base64。MiniMax 的 t2a_v2 把音频放在 data.audio，官方文档写的是**十六进制**
   （官方 WebSocket 指南明确写「用十六进制解码，别当 base64」），而 /local-assets 收的是 base64。
   文档与第三方示例在这一点上不一致，所以认不出合法十六进制时**退回按 base64 试一次**，
   两种都解不出才报错 —— 宁可多试一次，也不要让人对着一个能用的接口发愣。 */
function hexToB64(hex) {
  const h = String(hex || '').trim();
  if (!h || h.length % 2 || !/^[0-9a-fA-F]+$/.test(h)) return '';
  const bytes = new Uint8Array(h.length / 2);
  for (let i = 0; i < bytes.length; i++) bytes[i] = parseInt(h.substr(i * 2, 2), 16);
  let s = '';
  for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s);
}
async function audioRefBase64() {
  const it = slotItems('audio')[0];
  if (!it) return '';
  let blob = it.file || null;
  if (!blob && it.src) blob = await AssetTransfer.blobOf(it.src || it.url);
  if (!blob) return '';
  return await AssetTransfer.toDataURL(blob);
}
async function synthAudio(t) {
  const prov = currentModel().prov;
  const tts = (prov && prov.tts) || {};
  const mode = t.voiceMode || 'preset';
  const useRef = mode === 'clone';
  const voiceValue = useRef ? (await audioRefBase64()) : (mode === 'design' ? '' : t.voice);
  const res = await Api.create(prov, {
    model: t.model, text: t.text, style: t.style || '', voice: voiceValue, format: t.format,
    textRole: tts.textRole || 'assistant', styleRole: tts.styleRole || 'user',
    ...(t.bools || {}),
    log: false,                       // 同步合成没有平台任务号：归档在提交时按本地任务号做
  });
  let b64 = Api.pickPath(res, tts.responsePath || 'choices.0.message.audio.data');
  if (b64 && tts.encoding === 'hex') {
    const hx = hexToB64(b64);
    if (hx) b64 = hx;
    else console.warn('[studio] 声明 tts.encoding=hex，但返回值不是合法十六进制，按 base64 处理');
  }
  if (!b64) throw new Error('接口没有返回音频数据（检查 registry 里 tts.responsePath 声明）');
  let outB64 = b64, fmt = t.format;
  if (t.format === 'pcm16') { outB64 = b64FromBuf(pcm16ToWav(b64, tts.pcmSampleRate || 24000)); fmt = 'wav'; }
  const mime = (tts.mime || {})[fmt] || 'audio/wav';
  const name = '语音-' + (t.text || '').replace(/\s+/g, ' ').trim().slice(0, 18) + '.' + fmt;
  const saved = await Api.saveLocalAsset({ name, mime, format: fmt, data: outB64,
    meta: { prompt: t.text, model: t.model, voice: useRef ? '参考音频复刻' : t.voice, provider: prov.id,
      chars: (t.text || '').length, usage: (res && res.usage) || null } });
  return { assetId: saved.assetId || saved.id, url: saved.url || ('/asset/' + (saved.assetId || saved.id)),
    format: fmt, bytes: saved.bytes || 0, usageText: '', priceText: '', transcript: '' };
}

    renderPendingHint();
    if (!pendingSubmits.some(s => s.run === runId && s.failed)) { /* 成功路径各自写过 ✓ */ }
  }
};
async function submitVideo(rec, prov, model, uiDeadline) {
  const prompt = $('prompt').value.trim();
  /* 「生成条数」要真的提交这么多条。
     以前 draw 读出来之后**再也没被用过**：循环早被删掉，只留下了下拉、估价乘法与那句
     「已创建 N 个任务」的文案 —— 于是选4 条时界面报 4 个任务、估价按 4 条报，右栏只出现 1 张卡。
     视频平台的 create 请求体里没有条数字段（图像那栏的 count 是真的塞进 body 的），
     所以多条只能**一条一个任务**地提交，与图像栏同一形状（见 submitImage 的循环）。 */
  const draw = Math.max(1, Number(val('draw')) || 1);
  const allIn = Object.keys(SLOT_DEF).flatMap(k => (inputs()[k] || []).map(x => ({ k, x })));
  let entries = [];
  if (allIn.length) {
    if (window.Capabilities) {
      const keep = Capabilities.submitRoles(model, allIn.map(({ k }) => SLOT_DEF[k].role));
      if (keep && keep.drop && keep.drop.length) {
        setStatus('<span class="warn">这个型号不收：' + keep.drop.map(r => ROLE_ZH[r] || r).join('、') + '，已不带去</span>');
      }
    }
    setStatus('处理输入素材…');
    entries = await buildInputEntries(prov, model);
  }
  const created = [];
  let failed = 0;
  for (let i = 0; i < draw; i++) {
    /* 界面时限：多提交几条时每一条都要留在这一轮里，别让后面的几条被时限砍掉 */
    const left = uiDeadline - Date.now();
    const p = trackSubmit(rec, async () => {
      const r = await withCreateRetry(() => createVideoOnce(prov, model, prompt, entries), '平台的提示词编译服务这次出错（任务未创建、未扣费），');
      /* `extra` 是给占位条目显示用的（右栏要立刻有一条写着「第几段、什么参数」的卡）。
         ⚠ 这里**不能**读 `createVideoOnce` 里那个 `t` —— 那是另一个函数的局部变量
         （上一版就是抄了 `t.dur`，结果整条提交路径抛 `t is not defined`：
         界面表现是「点生成什么都不发生」，而 §A 那条判据只查裸函数调用、
         查不到 `t.dur` 这种成员访问，所以它没被拦住）。参数一律从**当前界面**现取。 */
      const dur0 = Number(val('dur')) || 0;
      if (r && r.taskId) created.push({ id: r.taskId, provider: prov.id, prompt,
        extra: { tier: val('tier'), res: val('res'), ar: val('ar'), dur: dur0, model: (model && model.id) || '' } });
      tally.run(true);
      return r;
    });
    /* ⚠ `Promise.race` **不吞 reject**：p 一旦失败，这一句就把异常抛出 `submitVideo`，
       下面那句 `try { await p } catch { failed++ }` 永远接不到 —— 于是
       ① 循环中断，剩下的条数不再提交（这一半要等某家视频平台在 /models 里声明
          max_outputs > 1 才可能发生：没有声明时 modelLimits 返回 1，drawWrap 整块藏着，
          循环只跑一次）；
       ② **单条失败时也中招** —— 末尾那句「创建失败…」根本没机会写，而
          `$('go').onclick` 的 catch 注释写着「记账层已经写过状态行了」，
          于是状态行停在上一句（比如「正在取回…」），用户看不到失败。
       这里只把 race 的抛出**接住**（失败由下面那句 await p 统一记账，不会记两次），
       p 本身仍然等完 —— 不等完的话后面的几条会被时间上限砍掉。 */
    if (left > 0) { try { await Promise.race([p, new Promise(r => setTimeout(r, left))]); } catch (e) { /* 下面记账 */ } }
    try { await p; } catch (e) { failed++; }
  }
  if (created.length) {
    setStatus('<span class="ok">✓ 已提交 ' + created.length + ' 条任务，右栏已经能看到（生成完成会自动出现在上面）</span>'
      + (failed ? '<span class="warn">（另有 ' + failed + ' 条没提交出去）</span>' : ''));
    adoptTasks(created).catch(() => {});
  } else setStatus('<span class="err">创建失败</span>' + (failed ? '（' + failed + ' 条都提交失败）' : ''));
}

async function submitImage(rec, prov, model) {

  const perReq = Math.max(1, lim.maxOut);
  const created = [];

  let failed = 0;
  for (let left = total; left > 0; left -= perReq) {
    const n = Math.min(perReq, left);
    const p = trackSubmit(rec, async () => {
      const r = await withCreateRetry(() => createImageOnce(prov, model, prompt, assetIds, n), '平台的提示词编译服务这次出错（任务未创建、未扣费），');
      if (r && r.taskId) created.push({ id: r.taskId, provider: prov.id, prompt,
        extra: { tier: val('tier'), res: val('res'), ar: val('ar'), quality: val('quality'), size: val('size'), model: (model && model.id) || '' } });
      else if (r && r.sync) synced.push(...r.sync);

      return r;
    });
    try { await p; } catch (e) { failed++; }
  }
  /* 同步返回的平台（OpenAI 兼容生图那类）没有任务号：当场把产物取回存本机，

  if (created.length) {
    setStatus('<span class="ok">✓ 已提交 ' + created.length + ' 条任务，右栏已经能看到（生成完成会自动出现在上面）</span>');
    adoptTasks(created).catch(() => {});
  } else if (!synced.length) setStatus('<span class="err">创建失败</span>');
}

       以前两种都套同一个门槛 `(need || 1) * PAGE_SIZE` —— 不带参数时它等于
       「本地已经有 PAGE_SIZE(24) 条就什么都不做」，而首屏一次就拉回一整个来源的 limit
       （平台一般声明 100 条），于是**再往下滚永远一页都不拉**：
       表现就是「右栏只能看到第一批资产，怎么滚都不再出来」。两种语义在这里分开。 */
    if (need) {
      let guard = 0;
      const floor = Math.max(1, need) * PAGE_SIZE;
      while (serverHasMore && guard++ < 20 && filteredItems().length < floor) await loadServer(1);
      return;                       // 跳页：凑够就收手，不让公共层接着追轮
    }
    /* 不带参数：这一趟只拉**一页**（= 平台上声明的一整批，一般 100 条）。
       「还贴着底就再来一轮」与单飞锁在 Wb.pager（makePuller / bindScroll）那一处，全站一份 ——
       所以一次滚到底的手势照样能连着拉好几页，而这里不必自己写追轮循环。
       同步 return（到底了）就等于告诉公共层「别再追了」。 */
    if (!serverHasMore) return;
    return loadServer(1);
  },
});

/* ---------- 复用：把一条历史素材的提示词 + 素材填进左栏 ---------- */
/* 一条素材的类型 → 能收它的槽位（按优先级）。这张表要分成两半用：
   `slotKindFor` 只在「当前型号真的收」的那些里挑第一个，而跨页复用还得能说出
   「换个型号就收得下」—— 所以整份候选列在这儿，而不是藏在筛选之后。 */
const SLOT_CANDS = { 视频: ['video', 'frame_first'], 音频: ['audio'], 图片: ['image', 'frame_first', 'frame_last'] };
const slotCands = mtype => SLOT_CANDS[mtype === '视频' ? '视频' : (isAudioType(mtype) ? '音频' : '图片')] || SLOT_CANDS['图片'];
function slotKindFor(mtype) { return slotCands(mtype).find(k => slots.some(x => x.kind === k)) || null; }
function findModelWithSlot(kinds) {
  const arr = (Array.isArray(kinds) ? kinds : [kinds]).map(k => (SLOT_DEF[k] || {}).role).filter(Boolean);
  if (!arr.length) return null;
  for (const p of provGroups()) for (const m of (p.models || [])) if (Capabilities.specs(m).some(sp => arr.includes(sp.role))) return { p, m };
  return null;
}
/* 「一条素材推进它那一类的槽位」全站只有这一份：右栏卡片拖进左栏、详情面板的「复用这次创作」、
   资产库 / 收藏 / 素材库跨页带过来的那一条，三个入口都走它。
   以前跨页那一份是另写的，少了两条判据 —— 槽位与已选素材互斥（拖拽那份会先挡）、
   首帧槽位收到视频要在浏览器里抽最后一帧（拖拽那份会绕开「直接引用地址」的快速路径），
   于是复用一段视频进首帧槽塞进去的是视频直链，要到提交才被平台拒。
   三个入口唯一允许不一样的地方是**能不能替用户换型号**：跨页复用与「复用这次创作」能
   （用户点它就是为了让这条素材进得去），拖拽不能（那会悄悄换掉他挑好的型号）。
   它不抛错：取字节失败也归成一个 `why` 交回调用方，由各自的界面说话。 */
async function refIntoSlot(mtype, p, o) {
  const auto = !!(o && o.autoSwitch);
  /* forceKind：素材被**直接拖到某个槽位上**时用（拖到首帧就进首帧，不再按素材类型猜入口）。
     不传就照旧按素材类型找它那一类槽位。 */
  let kind = (o && o.forceKind) || slotKindFor(mtype);
  if (!kind && auto) {
    const hit = findModelWithSlot(slotCands(mtype));
    if (hit) { $('model').value = hit.p.id + '::' + hit.m.id; $('model').dispatchEvent(new Event('change')); kind = slotKindFor(mtype); }
  }
  if (!kind) return { ok: false, code: 'noslot', why: (auto ? '没有哪个型号收' + mtype + '这类素材' : '当前型号没有能接收' + mtype + '的入口') };
  const def = SLOT_DEF[kind];
  /* 当前**输入模式**不收这一类素材，而同一个型号有收得下它的模式 → 先切到那一档。
     切模式既不删素材也不花钱，所以三个入口都可以替用户做（这与「能不能替用户换型号」是两件事，
     后者仍归 o.autoSwitch 管 —— 拖拽时悄悄换掉他挑好的型号才是坏事）。 */
  if (!slots.some(x => x.kind === kind)) {
    const fit = comboCovering([def.role]);
    if (fit && fit.id !== cur().combo) setCombo(fit.id);   // setCombo 里会 paintLeft，slots 随之重算
  }
  const arr = slotItems(kind), sl = slots.find(x => x.kind === kind);

  /* 槽位不存在就不能再往下走：以前只靠 slotKindFor 保证这件事，加了 forceKind 得自己挡一道，
     否则 `arr.length >= sl.max` 会抛在 undefined 上。 */
  if (!sl) return { ok: false, code: 'noslot', why: '当前型号没有「' + def.label + '」这个入口（换型号或清空已选素材再试）' };
  if (blockedSlotKinds().has(kind)) return { ok: false, code: 'blocked', why: def.label + '与已选素材互斥，请先清空已选素材' };
  if (arr.length >= sl.max) return { ok: false, code: 'full', why: def.label + '已满（最多 ' + sl.max + ' 个）' };
  const src = String(p.src || '');
  const idn = p.assetId ? String(p.assetId) : '';
  /* 同一条素材只认身份：有资产号按号比，只有地址的按地址比。
     以前只比 assetId，而素材库递过来的两边资产号都是空 —— 「这条已经在槽里」当场成立，
     第二条素材被静默丢掉，看着就是「点了没反应」。 */
  if (arr.some(x => (idn ? String(x.assetId) === idn : (!!src && (x.src === src || x.url === src)))))
    return { ok: false, code: 'dup', why: '这条素材已经在「' + def.label + '」里了' };
  const name = String(p.name || '').replace(/\s+/g, ' ').trim().slice(0, 14) || mtype;
  /* 平台/本机资产里能直接引用的：不必再取一遍字节。首帧槽位收到的是视频时不能走这条
     （要走 addSlotFiles 里的抽帧那一步，它只认 File）。 */
  if (idn && /^\/asset\//.test(src) && !(mtype === '视频' && def.videoFrame)) {
    arr.push({ assetId: idn, url: src, src, name, type: mtype, kind, fromLib: true });
    renderInputArea(); updateMode(); updateGoState();
    return { ok: true, kind, name };
  }
  if (!src && !p.fileKey) return { ok: false, code: 'nosrc', why: '这条素材既没有本机地址也没有本机文件号，取不到字节' };
  setStatus('正在取回素材字节…');
  let blob = null;
  try {
    /* 收藏里的本地文件：字节在本机 IndexedDB 里，只有一个号，既没有资产号也没有地址。 */
    blob = p.fileKey ? await Fav.fileOf({ kind: 'local', fileKey: p.fileKey })
      : await AssetTransfer.blobOf(p.dl || (window.Api && Api.mediaSrc ? Api.mediaSrc(src) : src));
  } catch (err) {
    return { ok: false, code: 'nobytes', why: '取回素材失败：' + ((err && err.message) || err) };
  }
  if (!blob || !blob.size) return { ok: false, code: 'nobytes', why: '这条素材的字节取不到了（本机文件可能已经不在了）' };
  const f = new File([blob], name + (mtype === '视频' ? '.mp4' : isAudioType(mtype) ? '.mp3' : '.png'),
    { type: blob.type || 'application/octet-stream' });
  const n = await addSlotFiles(kind, [f]);
  if (!n) return { ok: false, code: 'rejected', why: def.label + '没收这条素材（类型或体积不在这一栏的声明里）' };
  return { ok: true, kind, name };
}
/* 复用一条产物，「复用」复的是**提示词与参数**，不是把那条产物本身再当素材塞进参考槽。
   以前无条件 `refIntoSlot(it.mtype, …)` —— 于是「复用一条视频」的结果是：
     切到视频栏 + 填上那条视频的提示词 + **把那条视频又放进「参考视频」槽**，
   而参考视频的语义是「拿这条视频当画面/运动参考」，用户复用它是为了照着再来一条，
   不是拿它当参考 —— 于是界面上多了一条他自己没要求的素材，
   提交时它也跟着发出去（视频平台的参考视频往往另收一笔或根本不收这个 role）。

   判据（`it.asMaterial`）只有调用方给，两个入口都是 false：
     · 详情面板那颗「复用」—— 复的是提示词；
     · 资产库 / 收藏 / 素材库跨页过来的那条 —— 同理。
   真的要把一条素材塞进槽时，走的是 @ 素材 / 拖拽 / 挑选器那几条路（它们直接调 refIntoSlot，
   根本不经过这里），所以这个开关不需要第二个真值 —— **别再加一条「有时候要填」的入口**，
   那会立刻长成第二个实现。 */
async function reuseInto(it) {
  const wantType = it.mtype === '视频' ? 'video' : isAudioType(it.mtype) ? 'audio' : 'image';
  if (TYPE !== wantType) setType(wantType, true);
  if (it.prompt) $('prompt').value = it.prompt;
  /* 型号先定下来：参数下拉是**按型号声明**画出来的，型号没定就设值等于设在一个
     马上就要被重画掉的节点上（setType / model 的 change 都会跑 renderParams）。 */
  if (it.model) {
    const g = provGroups().find(p => (p.models || []).some(m => m.id === it.model));
    if (g) { $('model').value = g.id + '::' + it.model; $('model').dispatchEvent(new Event('change')); }
  }
  /* 参数也一起带过去（E7）：以前只带提示词与型号，满意某张图的画幅与质量想照着再来一版，
     复用后全跳回默认，得逐个重选。这些值本来就随条目存在，直接取，不另记一份。
     下拉的 id 就是这几个名字（见那一块模板）；**当前类型/型号没声明的那一栏根本没有那个节点**，
     取到 null 就跳过 —— 那是能力驱动该有的样子（型号不支持这档就不摆）。
     设完要 renderParams()：下拉的 options 是按声明填的，光改 value 不通知它就是「按钮上写着 A、
     真实选中的是 B」（与 PromptForm 里 sync select 是同一条道理）。 */
  const REUSE_KEYS = ['tier', 'res', 'ar', 'dur', 'quality', 'size'];
  const want = {};
  for (const k of REUSE_KEYS) if (it[k] != null && it[k] !== '') want[k] = String(it[k]);
  /* **顺序很重要**：先让 renderParams 把下拉按型号声明填好，再照它**已有的那些选项**设值。
     反过来（先设值再 renderParams）的话重画会把它按默认档覆盖回去 ——
     症状就是「参数带过来了，但界面上还是默认的那一档」，而用户看不出为什么。 */
  if (Object.keys(want).length) {
    try { renderParams(); } catch (e) {}
    for (const k of Object.keys(want)) {
      const el = $(k);
      if (!el || el.tagName !== 'SELECT') continue;
      const opts = Array.from(el.options || []).map(o => String(o.value));
      /* 只填**声明里有**的那一档：用户存的是 1080p 而这个型号只声明到 768p 时，
         硬填会得到一个界面上不存在的值（那正是「界面承诺兑现不了」的一种）。 */
      if (opts.length && opts.indexOf(want[k]) < 0) continue;
      try {
        el.value = want[k];
        if (window.Dropdowns && Dropdowns.sync) Dropdowns.sync(el);
      } catch (e) {}
    }
    try { paintSubNote(); refreshEst(); updateGoState(); } catch (e) {}
  }
  /* 素材地址在三个入口里有三种带法（详情面板那条条目用 media / raw，跨页载荷用 src），
     这里一次归一，槽位那一层只认 src。 */
  const src = it.src || it.media || it.raw || '';
  const has = !!src || !!it.assetId || !!it.fileKey;
  const r = (has && it.asMaterial)
    ? await refIntoSlot(it.mtype, { src, assetId: it.assetId, dl: it.dl, fileKey: it.fileKey,
      name: it.name || it.prompt }, { autoSwitch: true })
    : null;
  renderInputArea(); updateMode(); updateGoState();
  if (r && !r.ok) { setStatus('<span class="' + (r.code === 'dup' ? 'warn' : 'err') + '">'
    + escA(r.why + (it.prompt ? '（提示词已经填上）' : '')) + '</span>'); return; }
  const bits = [];
  if (it.prompt) bits.push('提示词');
  if (it.model) bits.push('型号');
  if (r && r.ok) bits.push('1 个' + it.mtype + '素材');
  /* 说清「那条视频没被当成参考」—— 复用一条视频而界面不说，用户会以为漏了；
     说清了就变成一个可核对的事实：带过来的是提示词与参数。 */
  const dropped = (has && !it.asMaterial)
    ? (wantType === 'video'
      ? '（这一条视频本身没有进「参考视频」槽 —— 复用带过来的是提示词与参数；要拿它当参考请用「@ 素材」）'
      : '（这一条素材本身没有进槽 —— 要拿它当参考请用「@ 素材」）')
    : '';
  setStatus('<span class="ok">✓ 已复用：' + bits.join(' + ') + '</span>'
    + (dropped ? '<span class="warn">　' + dropped + '</span>' : ''));
}
/* 资产库 / 收藏 / 素材库「拿去生成」带过来的那一条（localStorage.sk_reuse，用完即删）。
   载荷由 `Wb.reuse.go` 拼（三页那一份），里面**可以只有地址**：素材库存的是一张图本身的地址、
   收藏里的本地文件只有一个本机文件号，两边都没有平台资产号，所以这里不能替它编一个
   `/asset/undefined` —— 以前正是这一句让那两页的复用永远进不了槽位。 */
async function applyReuseFromAssets() {
  let p2 = null;
  try { p2 = JSON.parse(readLS('sk_reuse', '') || 'null'); } catch (e) {}
  if (!p2) return;
  try { localStorage.removeItem('sk_reuse'); } catch (e) {}
  const mtype = p2.kind === 'video' ? '视频' : p2.kind === 'audio' ? '音频' : '图片';
  const src = p2.src || (p2.assetId ? '/asset/' + p2.assetId + '?v=2' : '');
  if (!src && !p2.fileKey && !p2.prompt) return;
  await reuseInto({ mtype, src, assetId: p2.assetId || '', dl: p2.dl || '', fileKey: p2.fileKey || '',
    name: p2.name || '', prompt: p2.prompt || '', model: '' });
}

/* 拖到**某个具体槽位**上：直接用用户指的那一栏，不再按素材类型猜入口。

async function dropRefMediaInto(kind, p) {
  const def = SLOT_DEF[kind];
  if (!slots.some(s => s.kind === kind)) { setStatus('<span class="err">当前型号没有「' + def.label + '」这个入口</span>'); return; }
  const mtype = p.mtype || '图片';
  /* 类型不对就当场说清，不进 refIntoSlot —— 它的快速路径（资产号 + /asset/ 地址）不看 accept，
     放进去的话「把图拖到参考音频那一格」会被当成一条参考音频收下。 */
  if (!slotTakesType(kind, mtype)) { setStatus('<span class="err">' + def.label + '不收' + mtype + '素材</span>'); return; }
  const r = await refIntoSlot(mtype, p, { forceKind: kind });
  if (r.ok) { setStatus('<span class="ok">✓ 已把《' + escA(r.name || mtype) + '》加入' + def.label + '</span>'); return; }
  if (r.code === 'blocked') { flashSlotHint(r.why); return; }
  setStatus('<span class="err">' + escA(r.why) + '</span>');
}
/* 落在某一格上时那三种载荷的分派：右栏卡片（本页自己的 mime 契约）、
   资产库 / 收藏页那套旧契约（application/x-asset-id）、操作系统拖进来的文件。 */
async function dropOntoSlot(kind, dt) {
  const def = SLOT_DEF[kind];
  if (!def) return;
  if (!slots.some(s => s.kind === kind)) { setStatus('<span class="err">当前型号没有「' + def.label + '」这个入口</span>'); return; }
  const raw = dt.getData('application/x-studio-ref');
  if (raw) {
    let p = null; try { p = JSON.parse(raw); } catch (err) {}
    if (p && (p.src || p.assetId)) { await dropRefMediaInto(kind, p); return; }
  }
  const aid = dt.getData('application/x-asset-id');
  if (aid) { await dropRefMediaInto(kind, { mtype: '图片', assetId: aid, src: '/asset/' + aid + '?v=2', dl: '/asset/' + aid + '?dl=1' }); return; }
  const files = [...(dt.files || [])];
  if (!files.length) return;
  const n = await addSlotFiles(kind, files);
  if (n) setStatus('<span class="ok">✓ 已把 ' + n + ' 个文件加入' + def.label + '</span>');
}
/* 落点判据**委托在 #inputArea 上**：槽位节点每次重画都会换，绑在节点上会跟着丢。
   命中某一格就 stopPropagation —— 不再走下面那条「整块按类型自动落位」的老路（否则会加两遍）。 */
['dragover', 'dragenter'].forEach(ev => $('inputArea').addEventListener(ev, e => {
  const el = e.target && e.target.closest ? e.target.closest('[data-slot]') : null;
  if (!el || !dragHasPayload(e.dataTransfer)) return;
  e.preventDefault();
  e.stopPropagation();
  slotRowOver(false);          // 落到具体某一格上时，整块那圈高亮让位给这一格
  markSlotOver(el);
}));
$('inputArea').addEventListener('dragleave', e => {
  if (overSlot && (!e.relatedTarget || !overSlot.contains(e.relatedTarget))) clearSlotOver();
});
$('inputArea').addEventListener('drop', async e => {
  const el = e.target && e.target.closest ? e.target.closest('[data-slot]') : null;
  if (!el) return;             // 没落在具体槽位上 → 交给下面 #promptBox 那条按类型自动落位的老路
  e.preventDefault();
  e.stopPropagation();
  clearSlotOver();
  slotRowOver(false);
  await dropOntoSlot(el.dataset.slot, e.dataTransfer);
});
/* 拖拽取消 / 在别处松手时把落点提示收掉（不然那一格会一直亮着） */
window.addEventListener('drop', clearSlotOver);
window.addEventListener('dragend', clearSlotOver);
/* 落在输入框其余位置：仍按素材类型自动落位（老行为） */
['dragover', 'dragenter'].forEach(ev => $('promptBox').addEventListener(ev, e => {
  if (!dragHasPayload(e.dataTransfer)) return;
  e.preventDefault(); slotRowOver(true);
}));
$('promptBox').addEventListener('dragleave', e => { if (!$('promptBox').contains(e.relatedTarget)) slotRowOver(false); });
$('promptBox').addEventListener('drop', async e => {
  e.preventDefault(); slotRowOver(false);
  const dt = e.dataTransfer;
  if (!dt) return;
  /* ① 右栏卡片拖过来的（这一页自己产的 mime 契约） */
  const raw = dt.getData('application/x-studio-ref');
  if (raw) {
    let p = null;
    try { p = JSON.parse(raw); } catch (err) {}
    if (p && (p.src || p.assetId)) { await dropRefMedia(p); return; }
  }
  /* ② 资产库 / 收藏页那套旧契约（application/x-asset-id） */
  const aid = dt.getData('application/x-asset-id');
  if (aid) {
    await dropRefMedia({ mtype: '图片', assetId: aid, src: '/asset/' + aid + '?v=2', dl: '/asset/' + aid + '?dl=1' });
    return;
  }
  /* ③ 从操作系统拖进来的文件：按类型落到对应槽位 */
  const files = [...(dt.files || [])];
  if (!files.length) return;
  const has = k => slots.some(x => x.kind === k);
  for (const f of files) {
    const want = f.type.startsWith('video/')
      ? (has('video') ? 'video' : (has('frame_first') ? 'frame_first' : null))
      : f.type.startsWith('audio/') ? (has('audio') ? 'audio' : null)
        : (has('image') ? 'image' : has('frame_first') ? 'frame_first' : (has('frame_last') ? 'frame_last' : null));
    if (!want) { setStatus('<span class="err">当前型号没有可接收该文件的入口</span>'); return; }
    await addSlotFiles(want, [f]);
  }
});
/* 拖进左栏：与「复用这次创作」、跨页复用走同一份投递（判据、抽帧、取字节都在 `refIntoSlot` 里）。
   唯一不一样的是**不替用户换型号** —— 拖素材时把人家挑好的型号悄悄换掉比拒绝更糟。 */
async function dropRefMedia(p) {
  const mtype = p.mtype || '图片';
  const r = await refIntoSlot(mtype, p);
  if (r.ok) { setStatus('<span class="ok">✓ 已把《' + (r.name || mtype) + '》加入' + SLOT_DEF[r.kind].label + '</span>'); return; }
  if (r.code === 'blocked') { flashSlotHint(r.why); return; }
  if (r.code === 'dup') { setStatus(escA(r.why)); return; }
  setStatus('<span class="err">' + escA(r.why) + (r.code === 'noslot' ? '（换型号或清空已选素材再试）' : '') + '</span>');
}

/* ---------- 左栏整块重画（切类型 / 换型号之后） ---------- */
function paintLeft() {
  renderModelOptions();          // 型号下拉按当前类型重建（每种类型各记各的）
  slots = modelSlots();
  /* 「拆分片段生成」只有图像栏有；切走时把它的选项面板一起收掉（润色面板在分段开关那里已经清了） */
  $('splitBtn').hidden = TYPE !== 'image';
  if (TYPE !== 'image') $('splitInline').hidden = true;
  renderParams();
  renderInputArea();
  paintSubNote();
  updateMode();
  updateGoState();
  refreshEst();
  syncStyleRow();      // 「风格 / 音色描述」那一行的显隐跟着类型+型号走（见 syncStyleRow 那段）
}

/* ============================ ⑪ 启动 ============================ */
(async () => {
  TYPE = readTypeFromURL() || readLS('studio_type', '') || 'video';
  if (!TYPES[TYPE]) TYPE = 'video';
  const picks = loadPicks();
  ST[TYPE].model = picks[TYPE] || '';
  ST[TYPE].prompt = readLS('studio_prompt_' + TYPE, '');
  $('prompt').value = ST[TYPE].prompt;
  /* 拆分维度的自定义写法跟提示词一样是自己写的东西，重开一次页面不该要人重打一遍。
     只存那一句；选哪一档仍由下拉自己管（默认落在「自动」，那个输入框也就看不见）。 */
  $('splitDimCustom').value = readLS('studio_split_dim_custom', '');
  setType(TYPE, false);
  try { REG = await Api.registry(); } catch (e) { REG = { providers: [] }; }
  if (window.Api) Api.setRegistry(REG);
  renderModelOptions();
  /* 首屏先用本地缓存画出来（只缓存终态条目），再等平台列表覆盖 —— 别让首屏空着等十几秒 */
  if (!serverEntries.length) {
    const cached = LIST_CACHE.read();
    if (cached.length) serverEntries = cached;
  }
  loadAudioTasks();
  paintLeft();
  Wb.thumbs.hydrate().then(n => { if (n) { try { renderAll(); } catch (e) {} } }).catch(() => {});
  /* tally（后台数总数）挪到首批到位之后再跑（S4）：以前它与 loadServer(1) **背靠背**发起，
     两边都落到 AssetLib.load()、来源集合也一样，等于首屏白白多打一轮列表请求
     （首屏 ≈4 次 list，后台计数 maxPages:3 ≈12 次）。数不准时显示的「共 M+ 页」本来就有意如此
     —— 别为了「早点有数」把 run(true) 提前到首屏之前，那样 pager.total 会先报 0。 */
  loadServer(1).then(() => { if (PAGE_MODE === 'more') setTimeout(autoLoadMore, 60); })
    .catch(() => {})
    .then(() => { tally.run(); });
  poller.kick();
  renderAll();
  pager.bindButtons();
  pullMore = pager.bindScroll('result');

  try { await Capabilities.load(REG); } catch (e) {}
  renderModelOptions();
  paintLeft();
  refreshCaps();

  if (/[?&]reuse=1/.test(location.search || '')) {
    try { await applyReuseFromAssets(); } catch (e) { setStatus('<span class="err">复用失败：' + escA(String(e && e.message || e)) + '</span>'); }
  }
})().catch(e => {
  setStatus('<span class="err">启动失败：' + escA(String((e && e.message) || e)) + '</span>');
  console.error('[studio] 启动失败', e);
});
/* 提示词按类型各存一份：合并成一页之后切类型再切回来，写到一半的东西不该丢。
   落盘走 250 ms 防抖（S5）：localStorage 是**同步**写，以前每敲一个字就写一次，
   连续输入时这段同步 I/O 全压在主线程上。内存里的 cur().prompt 仍然逐字更新，
   所以防抖只推迟「写盘」，不影响任何读它的逻辑；pagehide 里那句同步补写保证不丢内容，
   但必须先把定时器清掉 —— 否则卸载后还会再触发一次孤儿写。 */
let promptLsTimer = 0;
$('prompt').addEventListener('input', () => {
  cur().prompt = $('prompt').value;
  clearTimeout(promptLsTimer);
  promptLsTimer = setTimeout(() => { promptLsTimer = 0; writeLS('studio_prompt_' + TYPE, $('prompt').value); }, 250);
});
$('style').addEventListener('input', () => { cur().style = $('style').value; });
window.addEventListener('pagehide', () => { clearTimeout(promptLsTimer); promptLsTimer = 0; writeLS('studio_prompt_' + TYPE, $('prompt').value); saveAudioTasks(); });
</script>
