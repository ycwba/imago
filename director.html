<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('dir_theme')||'light'}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>导演台 · 视频生成与剪辑</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236d5cf5'/%3E%3Ctext x='16' y='22' font-family='system-ui,-apple-system,Segoe UI,sans-serif' font-size='15' font-weight='700' fill='%23fff' text-anchor='middle'%3EAI%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="ui.css">
<style>

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--txt); overflow: hidden;
  }
  /* 页面骨架：头部 + 三栏，默认占满一屏、由各栏自己滚；
     窄窗口下会被下面的 @media 放开成「内容多高就多高」，交给页面整体滚动。 */
  .page-main { height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  header {
    display: flex; align-items: center; gap: 14px; padding: 10px 20px;
    border-bottom: 1px solid var(--line); background: var(--panel); flex: 0 0 auto;
  }
  header .brand { font-weight: 700; font-size: 15px; color: var(--acc); }
  header .tab { font-size: 13px; background: var(--panel2); border: 1px solid var(--line); border-radius: 4px; padding: 5px 12px; }
  header .tab b { color: var(--acc); }
  header input.pname { width: 260px; padding: 6px 10px; background: var(--input); border: 1px solid var(--line); border-radius: 4px; color: var(--txt); font-size: 13px; }
  header .saved { color: var(--ok); font-size: 12px; }
  /* 顶部那行操作提示：低调的小字，出现几秒后自己淡出，不打断操作 */
  header .opstate { font-size: 12px; color: var(--sub); opacity: 0; transition: opacity .25s;
    max-width: 42ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  header .opstate.show { opacity: 1; }
  header .opstate.ok { color: var(--ok); }
  header .sp { flex: 1; }
  header .bal { font-size: 12px; color: var(--sub); }
  header .bal b { color: var(--txt); }
  /* 顶部横幅 #banner 的样式在 ui.css（全站那一份），这里不再抄。 */
  .layout { display: flex; gap: 16px; padding: 14px 20px; flex: 1 1 auto; min-height: 0; position: relative; }
  .col { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; overflow-y: auto; }
  .col::-webkit-scrollbar { width: 8px; } .col::-webkit-scrollbar-thumb { background: #2a3046; border-radius: 3px; }
  /* 三栏占比可拖：拖过之后宽度写死成 --sp0 / --sp1（存在 localStorage 的 dir_split），
     没拖过就用下面这组 clamp 的弹性默认值。min-width 仍然兜着，别拖到内容摆不下。 */
  .col-left { flex: 0 1 var(--sp0, clamp(198px, 19%, 270px)); min-width: 198px; display: flex; flex-direction: column; }
  /* 左栏滚动条：跟 .col 一样细，别用系统粗条压住分镜行 */
  #scenesBox { overflow-x: hidden; }
  #scenesBox::-webkit-scrollbar { width: 8px; }
  #scenesBox::-webkit-scrollbar-track { background: transparent; }
  #scenesBox::-webkit-scrollbar-thumb { background: var(--line); border-radius: 5px; }
  #scenesBox::-webkit-scrollbar-thumb:hover { background: var(--sub); }
  /* 中栏：flex-basis 写 0（不是 auto）——auto 会让基准尺寸跟着内容走，候选条一变多/变宽，
     三栏占比就跟着飘；basis:0 之后中栏宽度只由容器与两侧栏决定，候选多少都不影响占比。 */
  .col-mid { flex: 1 1 0%; min-width: 0; }
  .col-right { flex: 0 1 var(--sp1, clamp(298px, 28%, 400px)); min-width: 298px; }
  /* ---------- 窗口尺寸自适应 ----------
     栏宽用 clamp 跟着窗口平滑缩放（不再固定像素），中间播放区吃掉剩下的空间；
     窄到三栏摆不下时整体堆叠成单列、页面本身滚动；再窄/再矮就收紧留白。 */
  @media (max-width: 1200px) {
    .layout { gap: 12px; padding: 12px 14px; }
    header { gap: 10px; padding: 9px 14px; }
    header input.pname { width: 180px; }
  }
  @media (max-width: 900px) {
    html, body { height: auto; }
    body { overflow: auto; }
    /* 关键：把「一屏高 + 裁掉溢出」的骨架放开，否则堆叠出来的内容被裁掉、页面滚不动 */
    .page-main { height: auto; min-height: 100vh; overflow: visible; }
    /* 三栏摆不下：分镜 + 播放/时间线 并排一行（保留「边看边挑」），编辑区整行放到下面 */
    .layout { flex-wrap: wrap; padding: 10px; gap: 10px; }
    .col { overflow: visible; flex: 0 0 auto; min-width: 0; }
    .col-left { flex: 0 0 clamp(168px, 22%, 226px); max-height: 44vh; overflow-y: auto; }
    .col-mid { flex: 1 1 360px; min-width: 300px; }
    .col-right { flex: 1 1 100%; }
    .player-box video, .player-empty { max-height: min(420px, 40vh); }
  }
  @media (max-width: 620px) {
    /* 很窄：彻底单列，每块整行 */
    .col-left, .col-mid, .col-right { flex: 1 1 100%; max-height: none; }
    .col-left { max-height: 44vh; }
  }
  @media (max-width: 700px) {
    header { flex-wrap: wrap; }
    header input.pname { width: 100%; order: 9; }
    header { padding: 8px 10px; gap: 8px; }
    .layout { padding: 8px; }
  }
  /* 矮窗口（横向拉长、纵向不够）：先把头部和留白压扁，播放区别把整屏占满 */
  @media (max-height: 620px) {
    header { padding: 6px 12px; gap: 10px; }
    .layout { padding: 10px 12px; }
    .player-box video, .player-empty { max-height: 260px; }
    .col-left { max-height: 38vh; }
  }
  button { font-family: inherit; }
  /* 本页按钮统一方正一点：共享的 .ghost/.dd 圆角在导演台收小 */
  .ghost, .ghost.mini, .dd-btn, .dd-opt { border-radius: 4px; }
  /* .ghost / .lb-btn / #lightbox 等公共组件样式统一来自 ui.css */
  .pri { background: var(--pri); border: 0; color: #fff; font-weight: 600;
    border-radius: 4px; cursor: pointer; transition: filter .15s; }
  .pri:hover:disabled { filter: none; } .pri:hover:not(:disabled) { filter: brightness(1.15); }
  .pri:disabled { opacity: .45; cursor: not-allowed; }

  /* 左栏 */
  /* 我的短片下拉：与左栏分镜列表同一套样式 */
  #projMenu { padding: 6px; }
  .pm-head { font-size: 11px; color: var(--sub); padding: 6px 9px 4px; }
  .pm-row { display: flex; align-items: center; gap: 9px; padding: 5px 9px; border-radius: 4px; cursor: pointer;
    margin-bottom: 3px; font-size: 12.5px; border: 1px solid transparent; border-left: 3px solid transparent; }
  .pm-row:hover { background: var(--panel2); }
  .pm-row.sel { background: rgba(124,92,255,.08); border-color: var(--line); border-left: 3px solid var(--pri); }
  .pm-name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pm-cnt { color: var(--sub); font-size: 10.5px; }
  .pm-ops { display: flex; align-items: center; gap: 2px; flex: 0 0 auto; visibility: hidden; }
  .pm-row:hover .pm-ops, .pm-row.sel .pm-ops { visibility: visible; }
  .pm-btn { display: inline-flex; align-items: center; justify-content: center; height: 22px; min-width: 22px;
    padding: 0 5px; border: 1px solid var(--line); border-radius: 4px; background: none; color: var(--sub);
    font-size: 11px; line-height: 1; cursor: pointer; transition: all .15s; }
  .pm-btn:hover { border-color: var(--acc); color: var(--acc); }
  .pm-btn.danger:hover { border-color: var(--err); color: var(--err); }
  .pm-add { margin-top: 5px; padding-top: 7px; border-top: 1px solid var(--line); font-size: 12.5px;
    color: var(--acc); padding: 7px 9px 5px; border-radius: 4px; cursor: pointer; }
  .pm-add:hover { background: var(--panel2); }

  .left-head { display: flex; align-items: center; gap: 8px; padding: 13px 14px; border-bottom: 1px solid var(--line); }
  .left-head b { font-size: 14px; }
  .left-head { flex-wrap: wrap; }
  .left-head > b { flex: 0 0 auto; font-size: 12.5px; white-space: nowrap; }
  .left-head .script-btn { flex: 1 1 0; min-width: 0; height: 28px; box-sizing: border-box;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 11.5px; line-height: 1; color: var(--acc); background: rgba(108,140,255,.14);
    border: 0; border-radius: 4px; padding: 0 8px; cursor: pointer;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: background .15s; }
  .left-head .script-btn:hover { background: rgba(108,140,255,.24); }
  .scene-block { padding: 8px 10px 4px; }
  /* 场景之间靠留白分区（照参考图，不画分隔线） */
  .scene-block + .scene-block { margin-top: 6px; padding-top: 10px; }
  .scene-head { display: flex; align-items: center; gap: 4px; margin-bottom: 7px; }
  /* min-width:0 是关键：input 默认宽度会把整列顶出横向滚动条 */
  .scene-head input { flex: 1; min-width: 0; background: transparent; border: 1px solid transparent; border-radius: 3px;
    color: var(--txt); font-size: 13px; font-weight: 600; padding: 4px 6px; }
  .scene-head input:hover, .scene-head input:focus { border-color: var(--line); background: var(--input); outline: none; }
  .scene-head .sc-cnt { flex: 0 0 auto; font-size: 10.5px; color: var(--sub); font-variant-numeric: tabular-nums; }
  /* 场景头按钮：纯图标，无边框无底色（悬停才浮出淡底），删除用垃圾桶 */
  .scene-head .icon-btn { flex: 0 0 auto; width: 26px; height: 26px; display: inline-flex; align-items: center; justify-content: center;
    border: 0; border-radius: 4px; background: none; color: var(--sub); cursor: pointer; font-size: 14px; line-height: 1;
    transition: background .15s, color .15s; }
  .scene-head .icon-btn:hover { background: var(--panel2); color: var(--acc); }
  .scene-head .icon-btn.del:hover { background: rgba(220,38,38,.08); color: var(--err); }
  .scene-head .icon-btn.armed { width: auto; padding: 0 7px; background: rgba(220,38,38,.08); color: var(--err); font-size: 11px; }
  /* 场景图那一格：与旁边的图标按钮同宽同高，有图时是一张 24×24 的方图。
     position:relative 是给右上角那颗 × 用的（它绝对定位在这一格里面，不另占布局）。 */
  .scene-head .sc-thumb { position: relative; flex: 0 0 auto; width: 26px; height: 26px; padding: 0; overflow: hidden;
    display: inline-flex; align-items: center; justify-content: center; border: 1px dashed var(--line); border-radius: 4px;
    background: none; color: var(--sub); cursor: pointer; transition: border-color .15s, background .15s; }
  .scene-head .sc-thumb:hover { border-color: var(--acc); color: var(--acc); background: var(--panel2); }
  .scene-head .sc-thumb:not(.none) { border-style: solid; }
  .scene-head .sc-thumb .sp { width: 100%; height: 100%; object-fit: cover; display: block; }
  /* × 平时不占视觉（只有悬停才浮出来）—— 常驻的话每一行右上角都挂一个红叉，左栏会变成一片叉 */
  .scene-head .sc-thumb .sp-x { position: absolute; right: 1px; top: 1px; width: 14px; height: 14px; border-radius: 3px;
    display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.62); color: #fff; cursor: pointer; }
  .scene-head .sc-thumb:hover .sp-x { display: inline-flex; }
  .scene-head .sc-thumb .sp-x .ic { line-height: 0; }
  .shot-item { display: flex; align-items: center; gap: 10px; padding: 4px 8px 4px 16px; height: 54px; box-sizing: border-box;
    border-radius: 4px; cursor: pointer; margin-bottom: 3px; position: relative; }
  .shot-item:hover { background: var(--panel2); }
  /* 选中：淡紫底从左侧竖条之后才开始铺，圆角不裹住竖条 */
  .shot-item.sel { background: linear-gradient(to right, rgba(124,92,255,0) 0 12px, rgba(124,92,255,.10) 12px); }
  .shot-item.sel:hover { background: linear-gradient(to right, rgba(124,92,255,0) 0 12px, rgba(124,92,255,.16) 12px); }
  /* 独立的选中竖条（自己的圆角，不与行背景连成一体） */
  .shot-item.sel::before { content: ''; position: absolute; left: 4px; top: 6px; bottom: 6px; width: 4px;
    border-radius: 3px; background: var(--pri); }
  .shot-item .num { font-size: 12px; font-weight: 600; color: var(--txt); opacity: .62; width: 17px; flex: 0 0 17px; text-align: center;
    font-variant-numeric: tabular-nums; }
  /* 方形缩略图：46×46；内容按原比例完整放进框里（不裁切）；出画后才用黑底留白 */
  .shot-item .sthumb-wrap { position: relative; flex: 0 0 46px; width: 46px; height: 46px; border-radius: 4px; overflow: hidden; }
  .shot-item .sthumb { width: 46px; height: 46px; min-height: 46px; max-height: 46px; border-radius: 4px;
    background: transparent; object-fit: contain; display: block; overflow: hidden; }
  /* 出画前 / 没有画面：一块纯灰底（不放图标）；出画后（.ready）才露黑底做留白 */
  .shot-item .tph { position: absolute; inset: 0; background: var(--thumbbg); }
  .shot-item .sthumb-wrap.ready .tph { display: none; }
  .shot-item .sthumb-wrap.ready .sthumb:not(.empty) { background: #000; }
  /* 没有画面的镜头：一块纯灰底（不显示图标）
     注意：ui.css 里有个全局 .empty{padding:60px 0}，这里必须 padding:0 覆盖掉 */
  .shot-item .sthumb.empty { display: block; padding: 0; background: var(--thumbbg) !important; }
  .shot-item .pbar { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(0,0,0,.35); }
  .shot-item .pbar i { display: block; height: 100%; background: var(--acc); transition: width .4s; }
  .shot-item .sinfo { flex: 1; min-width: 0; }
  .shot-item .sname { font-size: 13px; font-weight: 600; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .shot-item .smeta { font-size: 11px; line-height: 1.35; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .shot-item .smeta .okc { color: var(--ok); }
  .shot-item .smeta .runc { color: var(--warn); }
  .shot-item .smeta .errc { color: var(--err); }
  /* 操作按钮：悬停时浮在行尾的淡紫小托盘里（不占布局、不是白底） */
  .shot-item .ops { display: flex; gap: 1px; position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    padding: 3px; border-radius: 4px; visibility: hidden; background: #eae7fb; }
  html[data-theme="dark"] .shot-item .ops { background: #2a2550; }
  .shot-item:hover .ops { visibility: visible; }
  .shot-item .ops .op-btn { width: 23px; height: 23px; min-width: 23px; padding: 0; border: 0; background: none;
    border-radius: 3px; color: #5b5f72; font-size: 12px; line-height: 1; }
  html[data-theme="dark"] .shot-item .ops .op-btn { color: #b9bdd0; }
  .shot-item .ops .op-btn:hover { color: var(--acc); background: rgba(108,140,255,.18); }
  .shot-item .ops .op-btn.danger:hover { color: var(--err); background: rgba(220,38,38,.14); }
  /* 拖动：只有被拖动的那一行有阴影/高亮；投放位置只画一条细插入线 */
  .shot-item.dragging { opacity: .92; background: var(--panel);
    box-shadow: 0 0 0 1px var(--acc), 0 10px 26px rgba(0,0,0,.18); position: relative; z-index: 5; }
  .shot-item.drag-over { box-shadow: inset 0 2px 0 0 var(--acc); }
  .shot-item[draggable="true"] { cursor: grab; }
  .add-scene { margin: 8px 12px; width: calc(100% - 24px); padding: 9px; text-align: center; border: 1px dashed var(--line);
    border-radius: 4px; color: var(--sub); font-size: 12.5px; cursor: pointer; background: none; }
  .add-scene:hover { color: var(--acc); border-color: var(--acc); }
  .gen-all { margin-top: auto; padding: 12px; border-top: 1px solid var(--line); }
  .gen-all button { width: 100%; padding: 11px; font-size: 14px; }
  .gen-all .note { text-align: center; font-size: 11px; color: var(--sub); margin-top: 7px; }
  .gen-all .note .ok { color: var(--ok); }
  .gen-all .note .err { color: var(--err); }

  /* 中栏 */
  .mid-head { display: flex; align-items: center; gap: 10px; padding: 13px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .mid-head .no { font-size: 18px; font-weight: 700; color: var(--acc); flex: 0 0 auto; }
  .mid-head input.sname { background: transparent; border: 1px solid transparent; border-radius: 3px; color: var(--txt); font-size: 15px; font-weight: 600; padding: 3px 8px; flex: 0 1 150px; min-width: 90px; }
  .mid-head input.sname:hover, .mid-head input.sname:focus { border-color: var(--line); background: var(--input); outline: none; }
  /* 一行放不下就整体换行：meta 保持可读宽度（早前被挤成竖排单字），按钮不换行不压缩 */
  .mid-head .meta { color: var(--sub); font-size: 12px; flex: 1 1 150px; min-width: 90px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mid-head .sp { flex: 0 0 2px; }
  .mid-head button { flex: 0 0 auto; white-space: nowrap; }
  .player-wrap { padding: 14px 16px 6px; position: relative; }
  .player-box { position: relative; }
  /* 自制播放控件：只保留播放 / 暂停，时间跳转请在「剪辑」里插针 */
  .player-box video { width: 100%; aspect-ratio: 16 / 9; max-height: 420px; border-radius: 4px;
    background: #000; display: block; object-fit: contain; cursor: pointer; }
  .pb-btn { position: absolute; left: 12px; bottom: 12px; width: 40px; height: 40px; border: 0; border-radius: 50%;
    background: rgba(0,0,0,.55); color: #fff; font-size: 15px; line-height: 40px; text-align: center; cursor: pointer;
    transition: background .15s, transform .12s; }
  .pb-btn:hover { background: rgba(0,0,0,.75); transform: scale(1.06); }
  /* 播放器左下浮层：播放/暂停 · 声音开关 · 时长（同一条、同一风格） */
  .pb-bar { position: absolute; left: 12px; bottom: 12px; display: flex; align-items: center; gap: 8px; }
  .pb-bar .pb-btn { position: static; }
  .pb-time { background: rgba(0,0,0,.55); color: #fff; font-size: 11.5px; padding: 5px 10px; border-radius: 8px;
    font-variant-numeric: tabular-nums; letter-spacing: .3px; white-space: nowrap; }
  .player-wrap .arbadge { position: absolute; right: 28px; top: 26px; background: rgba(0,0,0,.6); color: #fff; font-size: 11px; padding: 2px 8px; border-radius: 3px; }
  .player-empty { aspect-ratio: 16 / 9; max-height: 420px; width: 100%; background: var(--input);
    border-radius: 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
  .player-empty .pe-ic { font-size: 42px; opacity: .5; }
  .player-empty .pe-t { font-size: 16px; font-weight: 700; color: var(--txt); }
  .player-empty .pe-d { font-size: 12.5px; color: var(--sub); }
  .player-empty .pe-task { margin-top: 16px; width: min(460px, 86%); display: flex; flex-direction: column; gap: 6px; }
  .player-empty .pe-row { display: flex; flex-wrap: wrap; gap: 6px 10px; font-size: 12px; color: var(--txt);
    background: var(--panel2); border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px; text-align: left; }
  .player-empty .pe-row .k { color: var(--sub); }
  .player-empty .pe-row .v { margin-right: 8px; font-variant-numeric: tabular-nums; }
  .cand-thumb.addcand { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    height: 74px; border: 1.5px dashed var(--line); color: var(--sub); background: none; }
  .cand-thumb.addcand:hover { border-color: var(--acc); color: var(--acc); }
  .cand-thumb.addcand.big { width: 168px; height: 84px; }
  .cand-thumb.addcand .plusic { display: flex; }
  .cand-thumb.addcand .pt { font-size: 12px; }
  .cand-thumb.addcand .pd { font-size: 10.5px; opacity: .8; }
  .cand-strip { display: flex; align-items: center; gap: 12px; padding: 8px 16px; }
  .cand-strip .thumbs { display: flex; gap: 8px; flex: 1; min-width: 0;
    flex-wrap: nowrap; overflow-x: auto; overflow-y: hidden; padding-bottom: 6px; }
  /* 展开：换行铺开、瓦片变大，一屏看完所有候选 */
  .cand-strip.expanded { align-items: flex-start; }
  .cand-strip.expanded .thumbs { flex-wrap: wrap; overflow: visible; padding-bottom: 0; }
  .cand-strip.expanded .cand-thumb { width: 148px; }
  .cand-strip.expanded .cand-thumb img, .cand-strip.expanded .cand-thumb video { height: 92px; }
  .cand-strip.expanded .cand-thumb .tph,

  .cand-strip .thumbs::-webkit-scrollbar { height: 8px; }

  .cand-strip .thumbs > * { flex: 0 0 auto; }
  .cand-thumb .candno { position: absolute; left: 4px; top: 4px; z-index: 2; min-width: 18px; height: 18px; padding: 0 4px;
    display: flex; align-items: center; justify-content: center; border-radius: 3px; background: rgba(0,0,0,.6); color: #fff;

  .cand-pager { display: flex; align-items: center; gap: 8px; margin-left: auto; flex: 0 0 auto; }
  .cand-thumb { position: relative; width: 118px; border-radius: 4px; overflow: hidden; cursor: pointer; border: 2px solid transparent; transition: border-color .12s; }
  .cand-thumb:hover { border-color: var(--acc); }
  .cand-thumb.cur { border-color: var(--pri); }
  .cand-thumb.sel::after { content: "✓ 用这条"; position: absolute; bottom: 4px; left: 4px; background: rgba(74,222,128,.9); color: #063; font-size: 10.5px; padding: 2px 6px; border-radius: 3px; font-weight: 600; }
  .cand-thumb .lockbadge { position: absolute; top: 4px; right: 4px; z-index: 2; display: flex; align-items: center;
    padding: 2px; border-radius: 3px; background: rgba(0,0,0,.45); color: #fff; }
  .cand-thumb img, .cand-thumb video { width: 100%; height: 72px; object-fit: contain; display: block; background: transparent; }
  .cand-thumb .tph { position: absolute; left: 0; right: 0; top: 0; height: 72px; background: var(--thumbbg); }
  .cand-thumb.ready .tph { display: none; }
  .cand-thumb.ready img, .cand-thumb.ready video { background: #000; }
  .cand-thumb .pending { width: 100%; height: 72px; display: flex; align-items: center; justify-content: center;
    background: var(--input); color: var(--sub); font-size: 11.5px; line-height: 1; text-align: center; }
  .cand-thumb .pending.fail { color: var(--err); }
  .cand-thumb .pending.draft { color: var(--acc); border: 1px dashed var(--line); background: none; }
  /* 草稿候选：这条候选自己的描述 */
  .cand-acts { margin-left: auto; display: flex; gap: 7px; }
  .mid-tools { display: flex; align-items: center; gap: 8px; padding: 4px 16px 8px; flex-wrap: wrap; }
  .mid-tools .ghost { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
  .mid-tools .total { margin-left: auto; color: var(--sub); font-size: 12.5px; }
  .mid-tools .ghost.active { color: var(--acc); border-color: var(--acc); }
  .trim-editor { padding: 4px 16px 10px; display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--sub); flex-wrap: wrap; }
  .trim-editor input { width: 70px; padding: 5px 8px; background: var(--input); border: 1px solid var(--line); border-radius: 4px; color: var(--txt); font-size: 12.5px; }
  .timeline-wrap { padding: 12px 16px 20px; }
  .tl-tabs { display: flex; gap: 6px; margin-bottom: 8px; }
  .tl-tabs button { font-size: 12px; padding: 4px 14px; border-radius: 4px; border: 1px solid var(--line); background: none; color: var(--sub); cursor: pointer; }
  .tl-tabs button.active { background: rgba(124,92,255,.2); color: var(--acc); border-color: rgba(124,92,255,.5); }
  /* 剪辑模式的轨道：`.tl-bar` 从「一条横排」改成「几行竖排」——
     画面行（本镜：按源视频秒定位的多段）/ 画面行（全片：按成片秒比例的格子）/ 声音行。
     行与行共用同一根时间基，所以声音块能画在它所属那一段的正下方。 */
  /* 行距 ≥ 18px：红色端点上下各超出格子 6px、定位插针各超出 8px（见下两段），
     按「两行之间的常规间距」贴在一起时，上一行的剪子会插进下一行、插针的尾也会压住工具条 ——
     这就是「预留上下空间」的落点，别随手把它收回去。 */
  .tl-bar { display: flex; flex-direction: column; gap: 18px; margin: 18px 0 14px; }
  .tl-vrow { position: relative; height: 46px; border: 1px solid var(--line); border-radius: 4px; background: var(--input); }
  .tl-film { display: flex; height: 34px; border: 1px solid var(--line); border-radius: 4px; overflow: visible; background: var(--input); }
  .tl-vrow .tl-seg { position: absolute; top: 0; bottom: 0; }
  /* 全片那一排的格子是 flex 行里的正常流（`flex:…` 定宽），**必须自己带 position**：
     少了它，格子里 `.frs { position:absolute; inset:0 }` 找不到定位祖先（.tl-film / .tl-bar 都没 position），
     会一路逃到视口级容器 → 切片铺满整列、轨道上只剩一条空槽（本轮修掉的那个 bug）。 */
  .tl-film .tl-seg { position: relative; }
  .tl-bar .tl-seg { background: rgba(124,92,255,.25); border-right: 1px solid var(--bg); cursor: pointer;
    display: flex; align-items: center; justify-content: center; font-size: 10.5px; color: var(--acc); min-width: 12px; border-radius: 4px; }
  .tl-seg.sel { background: rgba(124,92,255,.55); color: #fff; }
  /* 悬停 / 选中时切片提到全不透明（平时 .9 是为了让紫底透一点，看得出这是「可点的一条」） */
  .tl-bar .tl-seg:hover .frs, .tl-seg.sel .frs { opacity: 1; }
  .tl-seg .lab { position: absolute; left: 3px; bottom: 1px; font-size: 9.5px; line-height: 1.1;
    color: inherit; text-shadow: 0 1px 2px rgba(0,0,0,.55); pointer-events: none; z-index: 5; white-space: nowrap; }
  /* 轨道上的切片图：一格铺几帧（后台解码填充，见 fillSlices） */
  .tl-seg .frs { position: absolute; inset: 0; display: flex; overflow: hidden; border-radius: 4px; opacity: .9; }
  .tl-seg .frs .fr { flex: 1 1 0; min-width: 0; background-size: cover; background-position: center; }
  /* 帧与帧之间一道细线：「一段铺了几帧」看得出边界，不然几张画面拼在一起像一整张图 */
  .tl-seg .frs .fr + .fr { border-left: 1px solid rgba(0,0,0,.4); }
  .tl-seg .frs .fr.gap { background: repeating-linear-gradient(45deg, rgba(255,255,255,.06) 0 4px, transparent 4px 8px); }
  .tl-seg .frs.none::after { content: "取不到画面"; font-size: 9.5px; color: var(--sub); margin: auto; }
  /* 被裁掉的头 / 尾：灰色遮罩 */
  .tl-seg .mask { position: absolute; top: 0; bottom: 0; background: rgba(132,136,152,.55); pointer-events: none; z-index: 2; }
  .tl-seg .mask.l { left: 0; border-radius: 4px 0 0 4px; }
  .tl-seg .mask.r { right: 0; border-radius: 0 4px 4px 0; }
  /* 红色端点：上下各比紫条高 6px（一致高出），无圆形把手，直接拖 */
  .tl-seg .cut { position: absolute; top: -6px; bottom: -6px; width: 8px; background: #ef4444; border-radius: 3px; }
  .tl-seg .cut.drag { width: 12px; cursor: ew-resize; z-index: 4; }
  .tl-seg .cut.drag:hover { background: #ff6b6b; }
  /* 剪辑定位插针：点轨道任意位置跳转并暂停，四把剪子剪的就是它指着的那一段
     （挂在行上而不是格子里：段与段之间有缝，格子内的针会跟着段一起挪动） */
  .tl-pin { position: absolute; top: -8px; bottom: -8px; width: 2px; background: #fff;
    box-shadow: 0 0 0 1px rgba(0,0,0,.45); pointer-events: none; z-index: 6; }
  .tl-pin::before { content: ""; position: absolute; top: -5px; left: -4px; width: 10px; height: 10px;
    border-radius: 50% 50% 50% 0; background: #fff; transform: rotate(-45deg); }
  .tl-seg .cut.l { left: 0; } .tl-seg .cut.r { right: 0; }
  /* 声音轨：块的位置 = 它锚定的那一段在时间基上的位置 */
  .tl-lane { position: relative; height: 26px; border: 1px dashed var(--line); border-radius: 4px; background: rgba(124,92,255,.05); }
  .tl-lane .tl-v { position: absolute; top: 2px; height: 20px; min-width: 22px; display: flex; align-items: center; gap: 3px;
    padding: 0 5px; border-radius: 3px; font-size: 10px; line-height: 1; cursor: pointer; overflow: hidden; white-space: nowrap;
    background: rgba(34,197,94,.3); border: 1px solid rgba(34,197,94,.55); color: var(--txt); }
  .tl-lane .tl-v.sel { background: rgba(34,197,94,.6); color: #fff; }
  .tl-lane .tl-v .vt { overflow: hidden; text-overflow: ellipsis; }
  .tl-lane .tl-v .x { border: 0; background: none; color: inherit; cursor: pointer; padding: 0; display: flex; }
  .tl-lane .lane-hint { position: absolute; left: 6px; top: 5px; font-size: 10.5px; color: var(--sub); }
  .tl-empty { padding: 8px 10px; font-size: 11.5px; color: var(--sub); }
  .tl-tools { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin: 8px 0 6px; }
  .tl-tools .ghost { font-size: 12px; padding: 4px 10px; }
  .tl-hint { font-size: 11.5px; color: var(--sub); margin-left: 4px; }
  /* 剪辑右栏「这一条上的配音」那一小列（与轨道上的块是同一批数据，不是第二份账） */
  .vc-list { display: flex; flex-direction: column; gap: 4px; }
  .vc-row { display: flex; align-items: center; gap: 8px; font-size: 12px; padding: 4px 6px;
    border: 1px solid var(--line); border-radius: 4px; background: var(--input); }
  .vc-row b { flex: 0 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 42%; }
  .vc-row span { color: var(--sub); font-size: 11px; margin-left: auto; white-space: nowrap; }
  .tl-time { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--sub); margin-top: 10px; }
  /* 顺序模式的镜头缩略图条：每个镜头一张 */
  .shot-strip { display: flex; gap: 8px; padding: 4px 16px 14px; overflow-x: auto; }
  .strip-item { position: relative; flex: 0 0 auto; width: 96px; border: 2px solid transparent; border-radius: 4px;
    overflow: hidden; cursor: pointer; background: var(--input); transition: border-color .12s, transform .12s; }
  .strip-item:hover { transform: translateY(-2px); }
  .strip-item.sel { border-color: var(--pri); }
  .strip-item.ready { box-shadow: 0 0 0 1px rgba(74,222,128,.5) inset; }
  .strip-item video, .strip-item img { width: 100%; height: 54px; object-fit: contain; display: block; background: transparent; }
  .strip-item .tph { position: absolute; left: 0; right: 0; top: 0; height: 54px; background: var(--thumbbg); }
  .strip-item .ph { background: var(--thumbbg); }
  .strip-item.mready .tph { display: none; }
  .strip-item.mready video, .strip-item.mready img { background: #000; }
  .strip-item .ph { width: 100%; height: 54px; display: flex; align-items: center; justify-content: center;
    background: transparent; font-size: 16px; color: var(--sub); line-height: 1; opacity: .6; }
  .strip-item .sn { position: absolute; left: 3px; top: 3px; font-size: 10px; padding: 0 5px; border-radius: 3px;
    background: rgba(0,0,0,.65); color: #fff; }
  .strip-item .st { display: block; font-size: 10.5px; color: var(--sub); text-align: center; padding: 3px 0; background: var(--panel); }

  /* 右栏 */
  .ed-head { display: flex; align-items: center; justify-content: space-between; padding: 13px 16px; border-bottom: 1px solid var(--line); }
  .ed-head b { font-size: 14px; } .ed-head .no { color: var(--sub); font-size: 12px; }
  .ed-body { padding: 12px 16px 20px; }
  /* 生成参数：整块套用图片工作台「高级设置」卡片（结构与样式见 ui.css 的 .adv / .row） */
  #advBox { margin: 0 0 14px; }
  #advBox .dur-range { width: 100%; accent-color: var(--pri); cursor: pointer; }
  #advBox .dur-num { display: flex; align-items: center; gap: 6px; min-width: 96px; }
  #advBox .dur-num input[type="number"] { width: 100%; padding: 8px 10px; background: var(--input);
    border: 1px solid var(--line); border-radius: 4px; color: var(--txt); text-align: center; font-size: 13px;
    outline: none; transition: border-color .15s; }
  #advBox .dur-num input[type="number"]:focus { border-color: var(--acc); }
  #advBox .dur-num input[type="number"]::-webkit-outer-spin-button,
  #advBox .dur-num input[type="number"]::-webkit-inner-spin-button { opacity: 1; }
  #advBox .dur-num span { font-size: 12px; color: var(--sub); white-space: nowrap; }
  /* .ed-label 本体与 .cnt 已提到 ui.css（生成工作台素材区共用同一份），这里只留本页独有的 .mini */
  .ed-label .mini { font-size: 11px; padding: 2px 9px; border-radius: 3px; }
  #edPrompt { width: 100%; min-height: 150px; background: var(--input); border: 1px solid var(--line); border-radius: 3px; color: var(--txt); font-size: 13px; line-height: 1.6; padding: 10px 12px; resize: vertical; font-family: inherit; outline: none; }
  #edPrompt:focus { border-color: var(--acc); }
  /* 提示词框里的 @素材高亮：镜像层铺在 textarea 底下，只给 @片段 画底。
     字号 / 行高 / 内边距 / 边框宽度必须与 #edPrompt **逐项一致**，否则高亮会错位。 */
  .ta-wrap { position: relative; }
  .ta-back { position: absolute; left: 0; top: 0; right: 0; bottom: 0; overflow: hidden; pointer-events: none;
    white-space: pre-wrap; word-wrap: break-word; color: transparent;
    font-family: inherit; font-size: 13px; line-height: 1.6; padding: 10px 12px; border: 1px solid transparent; }
  /* 灰底就够了 —— 底下那条 `inset 0 -2px` 的深色描边在正文里像一条下划线，
     和「@ 是引用」这件事没关系，看着只是脏。底色跟着主题走（见 :root 的 --atbg）。 */
  .ta-back .ta-at { background: var(--atbg, rgba(35, 38, 47, .13)); border-radius: 3px; }
  /* 鼠标滑过 @片段 时那张小卡（挂在 body 上、position:fixed，见 hoverAt） */
  #atPeek { position: fixed; z-index: 61; display: flex; align-items: center; gap: 8px; padding: 6px 9px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 10px 24px rgba(20,24,40,.18); pointer-events: none; }
  #atPeek .pk-t { width: 40px; height: 40px; flex: 0 0 40px; border-radius: 4px; overflow: hidden;
    background: var(--thumbbg, #e2e5ee); display: flex; align-items: center; justify-content: center; color: var(--sub); }
  #atPeek .pk-t img { width: 100%; height: 100%; object-fit: cover; display: block; }
  #atPeek .pk-n { font-size: 12.5px; color: var(--txt); font-weight: 600; }
  #atPeek .pk-k { font-size: 10.5px; color: var(--sub); }
  /* 提示词里 @ 引用的候选浮层。挂在 body 上、position:fixed —— 右栏编辑器每次重画都换节点，
     挂在编辑器里面会跟着丢；位置按光标（或 `@素材` 那颗按钮）现算，见 mentionPlace / caretXY。 */
  #mentionBox { position: fixed; z-index: 60; width: 328px; max-height: 268px; overflow-y: auto;
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 10px 28px rgba(20,24,40,.16); padding: 4px; }
  /* 一行 = 缩略图 · @名字 · 右边一列「类型 · 来源」 */
  #mentionBox .mt-i { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 4px; cursor: pointer; }
  #mentionBox .mt-i.on { background: var(--panel2); }
  #mentionBox .mt-i.off { opacity: .55; }          /* 没有预览图：引用不了，压暗并写明原因 */
  #mentionBox .mt-t { width: 30px; height: 30px; flex: 0 0 30px; border-radius: 4px; overflow: hidden;
    background: var(--thumbbg, #e2e5ee); display: flex; align-items: center; justify-content: center; color: var(--sub); }
  #mentionBox .mt-t img { width: 100%; height: 100%; object-fit: cover; display: block; }
  #mentionBox .mt-n { flex: 1; min-width: 0; font-size: 12.5px; color: var(--txt); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #mentionBox .mt-k { flex: 0 0 auto; max-width: 52%; font-size: 10.5px; color: var(--sub); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* 行尾那个 › 是「这一条还有别的图可挑」的提示（悬停会滑出二级菜单） */
  #mentionBox .mt-i.has-sub::after { content: '›'; margin-left: 1px; font-size: 14px; line-height: 1; color: var(--sub); }
  #mentionBox .mt-empty { padding: 10px; font-size: 12px; color: var(--sub); line-height: 1.7; }
  /* @ 浮层的二级菜单：鼠标停在某个角色上时，从右边滑出一列「这一位有哪些图」。
     挂在 body 上、position:fixed —— 浮层自己是 overflow-y:auto，放里面会被裁掉。 */
  #mentionSub { position: fixed; z-index: 62; width: 272px; max-height: 300px; overflow-y: auto;
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 10px 28px rgba(20,24,40,.16); padding: 4px; }
  #mentionSub .ms-h { padding: 5px 8px 4px; font-size: 11px; color: var(--sub); }
  #mentionSub .ms-i { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 4px; cursor: pointer; }
  #mentionSub .ms-i:hover { background: var(--panel2); }
  #mentionSub .ms-t { width: 34px; height: 34px; flex: 0 0 34px; border-radius: 4px; overflow: hidden;
    background: var(--thumbbg, #e2e5ee); display: flex; align-items: center; justify-content: center; color: var(--sub); }
  #mentionSub .ms-t img { width: 100%; height: 100%; object-fit: cover; display: block; }
  #mentionSub .ms-n { flex: 1; min-width: 0; font-size: 12.5px; color: var(--txt); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #mentionSub .ms-k { flex: 0 0 auto; font-size: 10.5px; color: var(--sub); }

  /* 输入框右上角那颗 `@素材`：底色加深，一眼看得出是个入口 */
  .ed-label .at-btn { font-size: 12px; padding: 3px 10px; margin-right: 8px; border-radius: 12px; cursor: pointer;
    color: var(--acc); background: rgba(108,140,255,.16); border: 1px solid rgba(108,140,255,.35); }
  .ed-label .at-btn:hover { background: rgba(108,140,255,.28); }

  /* 「提到素材」那排芯片：底色加深；鼠标移上去弹一张预览（名字 + 图片）。
     预览朝**下**弹：编辑器那一列是 `overflow-y: auto`，朝上会被列的上边缘裁掉。 */
  .mchips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .mchip { position: relative; display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 4px;
    border-radius: 12px; cursor: pointer; color: var(--acc);
    background: rgba(108,140,255,.16); border: 1px solid rgba(108,140,255,.34); }
  .mchip:hover { background: rgba(108,140,255,.3); }
  .mchip > img { width: 20px; height: 20px; border-radius: 50%; object-fit: cover; display: block; background: var(--thumbbg, #e2e5ee); }
  .mchip .mn { font-size: 12px; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mchip .peek { display: none; position: absolute; left: 0; top: calc(100% + 6px); z-index: 62; padding: 6px;
    border-radius: 6px; background: var(--panel); border: 1px solid var(--line);
    box-shadow: 0 10px 24px rgba(20,24,40,.18); text-align: center; }
  .mchip:hover .peek { display: block; }
  .mchip .peek img { width: 132px; height: 132px; object-fit: cover; border-radius: 4px; display: block; background: var(--thumbbg, #e2e5ee); }
  .mchip .peek b { display: block; margin-top: 5px; font-size: 12px; color: var(--txt); font-weight: 600; }
  .mchip .peek i { display: block; font-style: normal; font-size: 10.5px; color: var(--sub); }
  .polish { font-size: 12px; color: var(--acc); background: rgba(108,140,255,.08); border: 1px solid rgba(108,140,255,.3); border-radius: 4px; padding: 6px 12px; cursor: pointer; margin-bottom: 12px; }
  /* 提示词下方那行动作按钮用 ui.css 的 .btn-row / .tool（与三个工作台同一套），这里不再另立一套 */
  /* 素材槽位的样式（.assets-grid / .asset-slot / .rvthumb / 互斥禁用）已收进 ui.css，生成工作台同用 */
  .ed-footer { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--line); }
  .ed-footer .can { font-size: 12px; color: var(--ok); }
  .ed-footer .can.no { color: var(--warn); }
  .ed-footer .pri { padding: 10px 20px; font-size: 14px; }
  .ed-footer .est { font-size: 11.5px; color: var(--sub); margin-right: auto; }
  .hint { font-size: 11px; color: var(--sub); margin-top: 8px; }
  /* #lbCount / #lbBar 的样式统一在 ui.css 的灯箱那一段 */
  dialog.script { background: var(--panel); color: var(--txt); border: 1px solid var(--line); border-radius: 4px; padding: 20px; width: 520px; max-width: 92vw; margin: auto; }

<script>
'use strict';
/* ================================================================
   导演台 · vgenv API（minimax/h3）
   经本地代理 /vgenv/* 转发；密钥由代理注入，页面不接触明文。
================================================================ */
const $ = id => document.getElementById(id);

/* ---------- 常量 ---------- */
/* 档位 / 比例 / 格式的中文名表不在这里抄第二份：在 `assetlib.js` 的 `AdvParams`（工作台与导演台同一份）。 */
const ST_ZH = Wb.ST;   // 状态文案只有 workbench.js 那一份（含各家平台的同义词）
/* 这一页自己的候选状态词只有 draft / creating / queued / running / succeeded / failed / cancelled，
   而轮询拿回来的是平台原话（success / completed / done / processing…）。写回之前先归一化：
   否则「已完成」在这一页会被当成还在跑 —— shotReady、候选排序、缩略图、「用这条」按钮全按
   'succeeded' 比，表现就是任务明明做完了，界面还写着生成中（要刷新重拉才对上）。
   判据只有 Api.classifyStatus 一份（它认 registry 的 statusMap）。 */
const canStatus = s => {
  const c = (window.Api && Api.classifyStatus) ? Api.classifyStatus(null, s) : '';
  if (c === 'done') return 'succeeded';
  if (c === 'failed') return /cancel/i.test(String(s || '')) ? 'cancelled' : 'failed';
  if (c === 'queued') return 'queued';
  if (c === 'running') return 'running';
  return String(s || '');      // 判据不在（assetlib 没加载）时原样留着，别把状态改没
};

/* ---------- 工作区（多个短片）---------- */
let WS = { projects: [], curId: null };
let proj = null;        // 当前短片
let REG = null;         // /registry：API 注册路由（提供商/模型/能力）
let saveTimer = null;
const uid = () => crypto.randomUUID().slice(0, 8);

/* 「一条候选占位有哪些字段」全站只在这一个函数里点一次名。
   以前命名了三份：mkDraftCandidate 一份、addCandidateDraft 抄了一份逐字相同的十行、
   pushPlaceholders 又抄了第三份（只差 vid 前缀与状态）—— 给占位加一个字段就要三处同步，
   漏一处的表现是「从某个入口建出来的候选少带一个字段」（界面正常、提交时才取到 undefined）。
   provider 在这里只是「这一条将来要发给谁」的一个记号：draft 阶段既不会提交也不会被轮询
   （pollLive 按 tmp_ 号跳过）。以前这里写的是 `provOf(...).id` —— 页面刚打开、/registry 还没回来的
   那一瞬间 provOf 给的是 null，于是「建第一个镜头」当场抛 TypeError，
   干净 profile 一进去就是「未处理错误」横幅 + 右栏一直空着（加载期竞态，与 §7
   「能力声明回来之前不许说你没配 X 接口」是同一类）。
   现在直接取型号自己记着的那一家，认不出就留空 —— 真要点「生成这条」时那一路有 needProv，
   会给一句能照做的话，而不是在建立占位的时候崩掉整页。 */
function mkCandidateBase(sh, vid) {
  const rm = resolvedModel(sh) || {};
  return {
    vid, provider: rm.provider || '', status: 'draft', progress: 0,
    url: null, error: null, selected: false, locked: false, trimS: null, trimE: null,
    shotId: sh.id, created: Date.now(), prompt: (sh.prompt || '').trim(),
  };
}
/* 一个空的候选占位：新增镜头 / 点 ＋ 都先建它，描述在右栏写、写完点「生成这条」 */
function mkDraftCandidate(sh) { return mkCandidateBase(sh, 'tmp_draft_' + uid()); }
/* 「把一份外部视频塞进候选条」也是一份候选，只是它已经成了：状态/进度/裁剪/价格这几项
   三个导入入口（素材库批量投递、收藏转存、中栏单条导入）以前各写一遍同样的八个字段，
   加一项就得三处同步。现在页面只递「哪一条、从哪来、地址是什么」。 */
function mkImportedCandidate(o) {
  return {
    vid: o.vid, provider: o.provider, status: 'succeeded', progress: 100,
    url: o.url, local: !!o.local, locked: false, trimS: null, trimE: null,
    priceMicros: null, duration: o.duration || null, error: null,
    ...(o.fromAsset ? { fromAsset: true } : {}),
  };
}
function newShot(prompt = '') {
  const sh = {
    id: uid(), name: '新镜头', prompt,
    ar: '16:9', res: '768p', tier: 'fast', draw: 1,
    firstFrame: null, lastFrame: null,       // dataURL
    refImages: [],                            // dataURL[]
    refVideo: null, refAudio: null,           // { asset_id, name }
    keyframes: [],                            // { t, desc, status, assetId } 时间切片参考图
    candidates: [],                           // { vid, status, progress, url, priceMicros, error, selected, locked, trimS, trimE, duration }
    selId: null,                              // 选中的候选 vid
    /* 「输入模式」= 这一镜这一次请求的形状（`Capabilities.combos` 里选中的那一条 id）。
       平台不给形状声明时一直是空串，那一排芯片整块不画，行为与加它之前逐字相同。
       挂在镜头上而不是模块变量：导演台一次编辑的是镜头，切镜头要跟着换。 */
    combo: '',
  };
  sh.candidates.push(mkDraftCandidate(sh));   // 默认带一个候选占位（默认选中它）
  return sh;
}
/* 工作区/项目是异步加载的，轮询定时器可能在 proj 还是 null 时先跑起来 —— 这里统一兜住，
   否则抛 TypeError，页面顶部出现「脚本错误」横幅且右栏一直空着。 */
const allShots = () => (proj ? proj.scenes.flatMap(sc => sc.shots) : []);
const curScene = () => (proj ? proj.scenes[proj.curScene] || proj.scenes[0] : null);
const curShot = () => curScene()?.shots[proj.curShot];
const fmtDur = s => (Math.round(s * 10) / 10) + ' 秒';
const shotDur = sh => {
  const c = sh.candidates.find(c => c.vid === sh.selId) || sh.candidates.find(c => c.status === 'succeeded');
  if (!c) return 0;
  /* 多段：按段求和（切开之后这一镜在成片里就是这几段之和，不是「首段入点到末段出点」） */
  if (Array.isArray(c.segs)) return round1(segsLen(c, candDur(c, sh)));
  if (c.trimE != null) return Math.max(0, c.trimE - (c.trimS || 0));
  if (c.duration) return c.duration;
  if (c.url) return sh.duration || 5;
  return 0;   // 还没出画面：不显示假时长
};
/* 本镜时长文案：没生成就写「未生成」 */
const shotDurText = sh => { const d = shotDur(sh); return d ? fmtDur(d) : '未生成'; };
/* 裁剪落地之后那一句（两个入口共用）—— **必须说清这一条在不在成片里**（L57）。
   剪辑这段改的是「我现在正在看的那条候选」（curCand），
   而左栏镜头时长、工具条「全片 X 秒」算的是「已选用的那条」（selId）。
   两者不是同一条时，一句光秃秃的「✓ 已保留 3 秒」会让人以为成片短了 2 秒 ——
   去看成片却发现一点没变（还是第 1 条那 5 秒），于是以为这个功能坏了。 */
function trimStatus(sh, c, extra) {
  /* 秒数按「剪辑界面正指着的那一段」算，不按 trimS/trimE 的并集算：
     切开之后一镜可能有几段，说「已保留 8 秒」而格子里明明是两段各 3 秒，等于说一句对不上画面的话。 */
  const segN = curSegOf(sh, c);
  const sec = segN ? fmtDur(segLen(segN)) : '0 秒';
  const nSeg = (c && Array.isArray(c.segs)) ? c.segs.length : 1;
  const inFilm = !!(c && c.vid === sh.selId);
  const at = (sh.candidates || []).findIndex(x => x.vid === sh.selId);
  const tail = inFilm ? '（这一条正被选用，成片跟着变）'
    : '，但这一条还没被选用 —— 成片现在用的是' + (at >= 0 ? '第 ' + (at + 1) + ' 条' : '别的候选')
      + '，左栏时长与「全片」的秒数都按它算；要让这次裁剪进成片，先在这一条上点「用这条」';
  /* 「截断」是真出了事（我们改了你输了的值），照旧走横幅；其余走工具栏那行小字 ——
     这里**不能用 warn 类**：那会把顶部横幅点亮，而拖动裁剪是每拖一下都会发生的高频动作，
     一个常驻横幅会变成噪音（用户上次特意说过「除非出 bug 不要弹东西」）。 */
  const many = nSeg > 1 ? '（这一条现在有 ' + nSeg + ' 段）' : '';
  if (extra) return '<span class="err">' + extra + '；已保留 ' + sec + many + (inFilm ? tail : '') + '</span>';
  return inFilm ? '<span class="ok">✓ 已保留 ' + sec + many + tail + '</span>' : '已保留 ' + sec + many + tail;
}
const shotReady = sh => sh.selId && sh.candidates.some(c => c.vid === sh.selId && c.status === 'succeeded');
const totalDur = () => allShots().filter(shotReady).reduce((a, sh) => a + shotDur(sh), 0);

/* ---------- 持久化（IndexedDB）----------
   开库、缺仓库补建、连接复用全在 ui.js 的 Kv 里（本页以前自己写过一份最完整的，
   现在设置页 / 资产库页 / 保存落点用的是同一份）。库/表名也不在这里抄：
   Kv.at('ws') = 导演台工作区与本地视频。 */
const wsKv = Kv.at('ws');
/* ---------- 撤销 / 重做（快照式，Ctrl+Z / Ctrl+Y）---------- */
const undoStack = [], redoStack = [];
let lastSavedJson = '';
/* 快照是整份工作区 JSON（含内联图片），必须限总量：以前无上限保留 50 份，大工程会吃掉上百 MB 内存。
   **两档上限都不在界面上**（README 与项目介绍曾写「最多 50 步」，实际是 30 步 / 24 MB），
   所以按 Ctrl+Z 突然「没有可撤销的操作」时用户不会知道是触了步数还是触了内存 ——
   那一瞬看起来就像坏了。工具条上常驻一句「撤销 N/30」，耗尽时说清是哪一档顶到了。 */
const UNDO_MAX_BYTES = 24 * 1024 * 1024, UNDO_MAX_COUNT = 30;
let undoBytes = 0;
/* 「为什么存不下」—— pushUndo 的两处早退各有一个原因，耗尽时照实报出去。
   判据与 pushUndo 同一处，不在这里重算。 */
let undoSkipWhy = '';
function pushUndo(json) {
  if (!json) return;
  if (json.length > UNDO_MAX_BYTES / 2) {
    /* 单份就超预算一半：不存（避免一份快照把预算吃光） */
    undoSkipWhy = '这一份工作区太大（' + (json.length / 1048576).toFixed(1) + ' MB，超过单份上限 '
      + (UNDO_MAX_BYTES / 2 / 1048576).toFixed(0) + ' MB）';
    return;
  }
  undoStack.push(json);
  undoBytes += json.length;
  const was = undoStack.length;
  while (undoStack.length > UNDO_MAX_COUNT || undoBytes > UNDO_MAX_BYTES) undoBytes -= undoStack.shift().length;
  if (was <= UNDO_MAX_COUNT && undoStack.length < was) undoSkipWhy = '撤销已用满上限（' + UNDO_MAX_COUNT + ' 步）';
}
/* 工具条上那一句（判据只有这两处：栈长与字节数）。 */
function undoMeterText() {
  return '撤销 ' + undoStack.length + '/' + UNDO_MAX_COUNT
    + (undoBytes > UNDO_MAX_BYTES * 0.6 ? '（内存 ' + (undoBytes / 1048576).toFixed(1) + '/' + (UNDO_MAX_BYTES / 1048576).toFixed(0) + ' MB）' : '');
}
function pushRedo(json) {
  if (!json || json.length > UNDO_MAX_BYTES / 2) return;
  redoStack.push(json);
  if (redoStack.length > UNDO_MAX_COUNT) redoStack.shift();
}
// 快照剔除轮询的瞬态字段（进度/排队位置），避免自动轮询污染撤销栈
function snapOf() {
  /* 游标不进快照。`curScene` / `curShot` / `curCand` 是「我现在在看哪一个」，
     不是「作品是什么」—— 以前它们被一起序列化，于是点6 次候选缩略图比较效果，
     再按 Ctrl+Z，第一下退回去的是「我刚才在看第 2 条候选」，真正的编辑还排在后面。
     而撤销上限只有 30 步（L10），翻看几次就能把真正的改动挤出栈。
     剔掉它们之后，「翻看」不再消耗撤销次数，而撤销回去时视口停在当前这一镜
     （restoreSnap 之后 renderAll 会照 proj.curCand 重画，指向的那一条仍然是它，
     因为那一镜的候选列表没变）。 */
  return JSON.stringify({ projects: WS.projects, curId: WS.curId },
    (k, v) => (k === 'progress' || k === 'queue_position'
      || k === 'curScene' || k === 'curShot' || k === 'curCand') ? undefined : v);
}
function restoreSnap(json) {
  try {
    const ws = JSON.parse(json);
    WS.projects = ws.projects; WS.curId = ws.curId;
    proj = WS.projects.find(p => p.id === WS.curId) || WS.projects[0];
    sanitize(); renderAll();
    wsKv.put('workspace', { projects: WS.projects, curId: WS.curId });
    lastSavedJson = json;
  } catch {}
}
function undo() {
  if (!undoStack.length) {
    setStatus('<span class="err">可撤销的已经用完了'
      + (undoSkipWhy ? '（' + undoSkipWhy + '）' : '') + ' —— 不是「没有可撤销的操作」</span>');
    return;
  }
  undoSkipWhy = '';
  pushRedo(snapOf());
  restoreSnap(undoStack.pop());
  setStatus('<span class="ok">✓ 已撤销（Ctrl+Y 重做）</span>');
}
function redo() {
  if (!redoStack.length) { setStatus('没有可重做的操作'); return; }
  pushUndo(snapOf());
  restoreSnap(redoStack.pop());
  setStatus('<span class="ok">✓ 已重做</span>');
}
document.addEventListener('keydown', e => {
  if (!(e.ctrlKey || e.metaKey)) return;
  const t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) return;   // 输入框内保留浏览器原生撤销
  const k = e.key.toLowerCase();
  if (k === 'z' && !e.shiftKey) { e.preventDefault(); undo(); }
  else if (k === 'y' || (k === 'z' && e.shiftKey)) { e.preventDefault(); redo(); }
});

/* ============================================================================
   成片时间线（timeline）—— LLM 剪辑与 ffmpeg 离线导出的数据基础
   clip = { id, kind:'shot'|'asset'|'black', shotId?, candId?, assetId?, src?, name, in, out, speed, volume }
     · kind 'shot'  引用某个镜头的候选（可重排、可重复使用、可单独裁剪）
     · kind 'asset' 直接引用资产库素材（按 src 或资产号取用）
     · kind 'black' 黑场（片头/间隔）
   ========================================================================== */
function tlEnsure() {
  if (!proj.timeline || !Array.isArray(proj.timeline.clips)) proj.timeline = { clips: [] };
  return proj.timeline;
}
const round1 = v => Math.round((Number(v) || 0) * 10) / 10;
const tlClipDur = c => Math.max(0.1, ((Number(c.out) || 0) - (Number(c.in) || 0)) / (Number(c.speed) || 1));
const tlDuration = () => tlEnsure().clips.reduce((a, c) => a + tlClipDur(c), 0);
const tlCandidateOf = (sh, candId) =>
  (sh.candidates || []).find(c => c.vid === candId) || (sh.candidates || []).find(c => c.vid === sh.selId) || null;

/* ============================================================================
   多段剪辑（切开 / 向左切 / 向右切 / 删掉这一段）—— 段存在**候选自己身上**
   ----------------------------------------------------------------------------
   `c.segs = [{ in, out }, …]`：源视频里的秒，按播放顺序。
   为什么不存时间线的 clip 上：clip 是每次 `tlFromShots()` 现派出来的（换候选、拖顺序都会重建），
   段存在 clip 上就等于「本镜」与「全片」各存一份 —— 用户点名的正是这件事：在一处剪完，另一处照旧。
   存在候选上，两处都只是它的读数：本镜切一刀，全片的段数、秒数、切片图和配音位置一起跟着变。
   老数据只有 `trimS/trimE`（单段）：`segsOf` 认它；每次落地又把 `trimS/trimE` 回写成
   「首段入点 / 末段出点」—— 候选卡与归档摘要还在读那两个字段，不能各说各话。 */
const candDur = (c, sh) => Math.max(0.1, Number(c && c.duration) || Number(sh && sh.duration) || 5);
const SEG_MIN = 0.2;          // 一刀下去两头至少各留这么多，否则下一次「再切」会切出零长段
const segLen = s => Math.max(0.1, round1((Number(s && s.out) || 0) - (Number(s && s.in) || 0)));
function segsOf(c, total) {
  const T = Math.max(0.1, Number(total) || 0);
  const raw = (c && Array.isArray(c.segs)) ? c.segs : null;
  const src = raw || [{ in: (c && c.trimS) || 0, out: (c && c.trimE != null ? c.trimE : T) }];
  const out = [];
  src.forEach(s => {
    let i = Math.max(0, Math.min(Number(s && s.in) || 0, T));
    let o = Math.max(0, Math.min(s && s.out != null && isFinite(Number(s.out)) ? Number(s.out) : T, T));
    if (o - i < SEG_MIN) { o = Math.min(T, i + SEG_MIN); if (o - i < SEG_MIN) i = Math.max(0, o - SEG_MIN); }
    if (o > i) out.push({ in: round1(i), out: round1(o) });
  });
  return out;                        // 空数组是**有效状态**：这一条候选一段画面都不留
}
const segsLen = (c, total) => segsOf(c, total).reduce((a, s) => a + segLen(s), 0);
function segsWrite(c, total, segs) {
  const list = segsOf({ segs }, total);
  c.segs = list;
  c.trimS = list.length ? list[0].in : 0;
  c.trimE = list.length ? list[list.length - 1].out : 0;
  return list;
}
/* 剪辑界面正指着哪一段（切完之后指针要留在看得见的地方；老工程没这个字段 = 第 0 段） */
const cutSegIdx = () => Math.max(0, Number(proj && proj.cutSeg) || 0);
const curSegOf = (sh, c) => { const ss = segsOf(c, candDur(c, sh)); return ss.length ? ss[Math.min(ss.length - 1, cutSegIdx())] : null; };
const candSelected = (sh, c) => !!(c && sh && sh.selId === c.vid);

/* ---------------- 声音轨（剪辑模式新增）----------------
   `proj.voices = [{ id, shotId, candId, seg, at, dur, vol, src, name, text, provider, model, voice }]`。
   `at` 相对**这一段自己**的起点（不是整条候选，也不是整片）：段会被切开、会被裁短，
   锚在段上才能在剪完之后仍然落在原来那句话的位置 —— 这是「本镜剪了、全片跟着变」在声音上的落点。
   交给 `/render` 时按 `clips[].voices = [{ src, start, dur, vol }]`（start 相对该段起点，
   代理那侧同一套约定：绝对偏移由那一段的 span 决定，客户端自己加会漂）。 */
function voicesEnsure() { if (!Array.isArray(proj.voices)) proj.voices = []; return proj.voices; }
const shotVoices = (shotId, candId) => voicesEnsure().filter(v => v.shotId === shotId && (!candId || v.candId === candId));
const clipVoiceKey = (shotId, candId, seg) => [shotId, candId, seg == null ? 0 : seg].join('|');
/* 这一段该带上哪几句配音，以及有几句被这一剪挤到了段外面（**不静默丢**：计数交给状态行说） */
function clipVoices(c, durClip) {
  const list = []; let skip = 0;
  const seg = c.seg == null ? 0 : c.seg;
  voicesEnsure().forEach(v => {
    if (v.shotId !== c.shotId || v.candId !== c.candId || (v.seg == null ? 0 : v.seg) !== seg) return;
    const start = Math.max(0, Number(v.at) || 0);
    if (!v.src || start >= durClip) { skip++; return; }
    list.push({ src: v.src, start, dur: Math.max(0.1, Number(v.dur) || 0), vol: v.vol == null ? 1 : Number(v.vol) });
  });
  return { list, skip };
}
let voiceSkip = 0;      // 最近一次组装成片时「没进画面」的配音句数（合并 / 导出那句状态读它）
const voiceFp = c => clipVoices(c, tlClipDur(c)).list.map(v => Math.round(v.start * 10) / 10 + '~' + v.dur).join(',');

/* 一次段编辑之后把配音重新落到段上：先把旧的相对秒还原成**源视频里的绝对秒**，
   再看这个绝对时刻新落在哪一段。正好被切掉那一句不删 —— 挪到紧随其后的那段开头，
   并把「挪了几句」照实说（这与「选了却没发」是同一类偏差）。 */
function reanchorVoices(sh, c, oldSegs, newSegs) {
  let moved = 0;
  shotVoices(sh.id, c.vid).forEach(v => {
    const os = oldSegs[Math.min(oldSegs.length - 1, Math.max(0, Number(v.seg) || 0))];
    if (!os) return;
    const abs = os.in + Math.max(0, Number(v.at) || 0);
    if (!newSegs.length) { v.seg = 0; v.at = 0; moved++; return; }
    let ni = newSegs.findIndex(s => abs >= s.in && abs < s.out);
    if (ni < 0) {
      ni = newSegs.findIndex(s => s.in > abs);
      if (ni < 0) ni = newSegs.length - 1;
      v.at = 0; moved++;
    } else v.at = round1(Math.max(0, abs - newSegs[ni].in));
    v.seg = ni;
  });
  return moved;
}
/* 四把剪子都只改「这一条候选的段列表」，不碰别的东西 —— 本镜与全片读的是同一份。
   返回 `{ segs, at }`（at = 剪完之后指针该落在第几段）或 `{ err }`（当场把原因说清，不剪）。 */
function cutSegs(c, total, at, way) {
  const segs = segsOf(c, total);
  if (!segs.length) return { err: '这一条候选现在一段画面都没有：先在「全片」里换一条候选，或点「不剪了」恢复整条' };
  let i = segs.findIndex(s => at >= s.in && at < s.out);
  if (i < 0) i = segs.reduce((b, s, k) => (Math.abs(s.in - at) < Math.abs(segs[b].in - at) ? k : b), 0);
  const s = segs[i];
  if (way === 'split') {
    if (at - s.in < SEG_MIN || s.out - at < SEG_MIN) return { err: '插针离这一段的边界不到 0.2 秒，切不开（往中间挪一点再切）' };
    segs.splice(i, 1, { in: s.in, out: at }, { in: at, out: s.out });
    return { segs, at: Math.min(segs.length - 1, i + 1) };
  }
  if (way === 'left') {
    if (s.out - at < SEG_MIN) return { err: '插针后面剩不到 0.2 秒 —— 整段不要就点「删掉这一段」' };
    segs[i] = { in: at, out: s.out };
    return { segs, at: i };
  }
  if (way === 'right') {
    if (at - s.in < SEG_MIN) return { err: '插针前面不到 0.2 秒 —— 整段不要就点「删掉这一段」' };
    segs[i] = { in: s.in, out: at };
    return { segs, at: i };
  }
  if (way === 'drop') {
    if (segs.length === 1) return { err: '只剩一段了，再删这一条候选就没有画面（整条不要请换候选或换一镜）' };
    segs.splice(i, 1);
    return { segs, at: Math.min(segs.length - 1, i) };
  }
  if (way === 'reset') return { segs: [{ in: 0, out: round1(total) }], at: 0 };
  return { err: '不认识这种剪法' };
}
/* 插针在哪个秒：播放器一直在放**焦点那条候选**，所以本镜与全片两个页签指的是同一个位置
   （不存在「全片里另有一根针」这第二份口径）。重画之后播放器还没就位时读上次记下的那一个。 */
function cutPin(c, total) {
  const pl = document.getElementById('player');
  const t = (pl && isFinite(Number(pl.currentTime))) ? Number(pl.currentTime) : (Number(proj.cutAt) || 0);
  return round1(Math.max(0, Math.min(total, t)));
}
/* 一次剪切的唯一出口：算新段 → 写候选 → 配音重新锚定 → 重画 → 一句话说清进不进成片。
   两颗入口（本镜页签、全片页签）都调它，所以「在 A 处剪了 B 处也要变」不是同步逻辑，是根本没有第二份数据。 */
function applyCut(way) {
  const sh = curShot();
  if (!sh) { setStatus('<span class="err">先挑一个镜头</span>'); return; }
  const cands = sh.candidates || [];
  const c = cands[proj.curCand] || cands.find(x => x.vid === sh.selId);
  if (!c) { setStatus('<span class="err">这一镜还没有候选，先生成或导入一条视频再剪</span>'); return; }
  const total = candDur(c, sh);
  const oldSegs = segsOf(c, total);
  const at = cutPin(c, total);
  const r = cutSegs(c, total, at, way);
  if (r.err) { setStatus('<span class="err">' + r.err + '</span>'); return; }
  const newSegs = segsWrite(c, total, r.segs);
  proj.cutSeg = Math.max(0, Math.min(newSegs.length - 1, Number(r.at) || 0));
  proj.cutAt = at;
  const moved = reanchorVoices(sh, c, oldSegs, newSegs);
  const left = round1(segsLen(c, total));
  const what = way === 'split' ? '已在 ' + fmtDur(at) + ' 处切开'
    : way === 'left' ? '已把插针左边切掉'
    : way === 'right' ? '已把插针右边切掉'
    : way === 'drop' ? '已删掉插针那一段' : '已取消裁剪';
  const inFilm = candSelected(sh, c);
  setStatus((inFilm ? '<span class="ok">✓ ' : '')
    + what + '：这一条现在 ' + newSegs.length + ' 段、共 ' + fmtDur(left)
    + (inFilm ? '，左栏时长与全片跟着变' : '，但这一条还没被选用，成片仍按选用的那条算')
    + (inFilm ? '' : '')
    + (moved ? '；有 ' + moved + ' 句配音正好被切掉，已挪到紧随其后的那段开头' : '')
    + (inFilm ? '</span>' : ''));
  renderAll(); scheduleSave();
}

/* ---------------- 轨道上的切片图 ----------------
   一段里按秒铺几帧（每帧取这一段的等分中点），用的还是公共层 `Wb.vframe` 的 meta/seek 原语；
   只有「取多帧」改成**同一个 <video> 顺序 seek** —— 每帧新建一个 video 会把中栏卡成幻灯片。
   采到的帧按「素材地址 → {时刻: 图片}」缓存在这一页的内存里：剪辑每拖一下都重画整条轨道，
   命中就不再解码。取不到帧不算错（格子里留占位，画面照样能剪）。 */
const frameCache = new Map();
async function grabFrames(src, times) {
  if (!frameCache.has(src)) {
    if (frameCache.size > 24) frameCache.clear();      // 一个 dataURL 约几十 KB，别让长片把内存吃掉
    frameCache.set(src, new Map());
  }
  const hit = frameCache.get(src);
  const need = times.filter(t => !hit.has(t));
  if (need.length) {
    const v = document.createElement('video');
    v.muted = true; v.playsInline = true; v.preload = 'auto';
    v.setAttribute('playsinline', '');
    v.src = Wb.vframe._same(src);
    try {
      await Wb.vframe.meta(v);
      const c = document.createElement('canvas');
      for (const t of need) {
        try { await Wb.vframe.seek(v, t); } catch (e) { break; }
        const w = v.videoWidth || 160, h = v.videoHeight || 90;
        if (c.width !== w || c.height !== h) { c.width = w; c.height = h; }
        c.getContext('2d').drawImage(v, 0, 0, w, h);
        hit.set(t, c.toDataURL('image/jpeg', 0.55));
      }
    } catch (e) { /* 元数据都拿不到（外链过期 / 格式不支持）：这一排留占位 */ }
    try { v.removeAttribute('src'); v.load(); } catch (e) {}
  }
  return hit;
}
/* 铺好格子 → 后台把帧填进去（重画时先画占位，绝不为了缩略图把整栏卡住） */
async function fillSlices(root) {
  const tiles = Array.prototype.slice.call(root.querySelectorAll('[data-frs]'));
  const bySrc = new Map();
  tiles.forEach(t => {
    const src = t.getAttribute('data-frs') || '';
    if (!src) { t.innerHTML = '<i class="fr none"></i>'; return; }
    if (!bySrc.has(src)) bySrc.set(src, []);
    bySrc.get(src).push(t);
  });
  for (const [src, list] of bySrc) {
    const marks = new Set();
    const plans = list.map(t => {
      const a = Number(t.getAttribute('data-in')) || 0;
      const b = Number(t.getAttribute('data-out')) || Math.max(a + 0.5, a);
      const n = Math.max(1, Math.min(8, Number(t.getAttribute('data-n')) || 3));
      const ts = [];
      for (let k = 0; k < n; k++) ts.push(round1(Math.max(0, Math.min(b - 0.05, a + (b - a) * (k + 0.5) / n))));
      ts.forEach(x => marks.add(x));
      return { t, ts };
    });
    const got = await grabFrames(src, Array.from(marks).sort((x, y) => x - y));
    plans.forEach(({ t, ts }) => {
      if (!t.isConnected) return;                      // 期间又重画过一次：别把帧填进孤立的格子
      t.innerHTML = ts.map(x => {
        const u = got.get(x);
        return u ? '<i class="fr" style="background-image:url(' + u + ')"></i>' : '<i class="fr gap"></i>';
      }).join('');
    });
  }
}

/* 从已选用镜头派生时间线（会覆盖现有 clips）：
   **一条候选出 N 段**（N = 这一条剪出来的段数），段存 `seg` 下标给配音当锚点。 */
function tlFromShots() {
  const clips = [];
  allShots().filter(shotReady).forEach(sh => {
    const c = tlCandidateOf(sh, sh.selId);
    if (!c) return;
    const total = candDur(c, sh);
    segsOf(c, total).forEach((s, i) => {
      clips.push({ id: uid(), kind: 'shot', shotId: sh.id, candId: c.vid, seg: i,
        name: sh.name || '镜头', in: s.in, out: s.out, speed: 1, volume: 1 });
    });
  });
  return { clips };
}

/* 片段 → ffmpeg 可用的素材地址（本地导入 / 链接已过期的候选会先转存成一条长期有效的资产） */
async function tlClipSrc(c) {
  if (c.kind === 'asset') return c.src || (c.assetId ? '/asset/' + c.assetId + '?v=2' : null);
  if (c.kind === 'black') return 'black';
  const sh = allShots().find(s => s.id === c.shotId);
  const cand = sh && tlCandidateOf(sh, c.candId);
  if (!cand) return null;
  const isRemote = cand.url && /^https?:\/\//.test(cand.url);
  if (isRemote) return cand.url;                       // vgenv 等外部链接：/render 直接下载
  if (cand.url && cand.url.startsWith('/asset/')) return cand.url;
  // 没带地址、但任务号本身就是本家资产：直接引用（不区分图/视频台，按 relay 判同一套资产库）
  if (!cand.url && cand.vid && sameAssetSpace(cand.provider, ASSET_STORE)) return '/asset/' + cand.vid + '?v=2';
  // 本地导入 / 过期链接：转存成资产（走通用跨平台转存通道；/asset/ 只认这一家的资产号，见 ASSET_STORE 注释）
  if (c.assetId) return '/asset/' + c.assetId + '?v=2';
  /* 原来这里还先取`cand.blobKey` 指向的 IndexedDB 字节 —— 而 blobKey 从没有一处赋值，
     那一支恒为null，等于多一次查库却从不生效（IndexedDB 里没有 blobKey 的索引）。删掉。
     真正在用的是下面这条：本地导入/ 过期链接当场转存成 `.assets` 资产（toAsset）。 */
  const fresh = await freshUrl(cand).catch(() => null);
  const source = fresh;
  if (!source) return null;
  const aid = await AssetTransfer.toAsset(ASSET_STORE, source, { reg: REG, name: (cand.name || 'clip') + '.mp4', contentType: 'video/mp4' });
  c.assetId = aid; scheduleSave();
  return '/asset/' + aid + '?v=2';
}

/* 时间线 → 送给 /render 的 clips。导出与「合并全片」以前各抄了一份逐字相同的循环
   （连「第 N 段没有可用素材」那句一起），收成这一份。
   `tl` 由调用方递进来（就是它刚 `tlSyncFromShots()` 出来的那一份），
   因为这一页没有一个全局的「当前时间线」可变对象 —— 每次都是现同步。
   循环前先把过期外链**一次批量**换新一轮（healStaleUrls → Api.healMedia 按平台分组，
   声明了 pollVia:'list' 的那一族一次列表请求解出整批）：
   逐段 tlClipSrc → freshUrl 各问一次的话，三十段就是三十次「100 条的列表」，
   而它们问的是同一家平台的同一份数据。 */
async function buildRenderClips(tl) {
  await healStaleUrls().catch(() => 0);      // 换不到新地址不是错：下面照旧拿旧地址试一次
  const clips = [];
  voiceSkip = 0;
  for (let i = 0; i < tl.clips.length; i++) {
    const c = tl.clips[i];
    const src = await tlClipSrc(c);
    if (!src) throw new Error(`第 ${i + 1} 段「${c.name || ''}」没有可用素材（本地文件可能已被清理）`);
    /* 这一段带上它的配音（`at` 相对本段起点，代理那侧按 start 延迟后与原声 amix）。
       放不进来的那些（这一剪把画面切短了、或整段被删）只计数不静默吞 —— 见 voiceSkip 的两句状态。 */
    const dur = tlClipDur(c);
    const vv = clipVoices(c, dur);
    voiceSkip += vv.skip;
    const one = { src, in: c.in, out: c.out, speed: c.speed || 1, volume: c.volume == null ? 1 : c.volume };
    if (vv.list.length) one.voices = vv.list;
    clips.push(one);
  }
  const anchored = voicesEnsure().length;
  const placed = clips.reduce((a, x) => a + ((x.voices || []).length), 0);
  voiceSkip += Math.max(0, anchored - placed - voiceSkip);   // 锚在已不存在的段上的那些也算没进画面
  return clips;
}

/* 按当前镜头顺序（拖动后的顺序）同步成片时间线：
   段落顺序 = 场景/镜头顺序；入点/出点一律现算（跟着候选的 trimS/trimE），
   倍速/音量沿用时间线里已有的值；黑场按原先与其相邻的镜头锚定回来 */
function tlSyncFromShots() {
  const old = tlEnsure().clips;
  const fresh = tlFromShots().clips;
  /* 键里必须带**段下标**：一条候选现在出好几段，只按「镜头|候选」归并会让第 2、3 段
     都去认领第 1 段的旧值（倍速/音量倒无所谓，黑场锚点会认错位）。 */
  const clipKey = c => [c.shotId, c.candId, c.seg == null ? 0 : c.seg].join('|');
  const oldByKey = new Map();
  old.filter(c => c.kind === 'shot').forEach(c => oldByKey.set(clipKey(c), c));
  const synced = fresh.map(c => {
    const o = oldByKey.get(clipKey(c));
    if (!o) return c;
    /* 入点/出点**不再沿用旧的**：它们是候选 trimS/trimE 派生的（tlFromShots:737-738），
       而裁剪那一步写的正是候选上的 trimS/trimE —— 把旧值按回来等于「刚裁的又白裁了」，
       filmFingerprint 也不变，于是播放/导出的还是改之前那一份，界面却写「已经接成一个完整视频」。
       倍速与音量反过来：全项目没有任何一处写它们（tlFromShots 恒给 1/1），
       这里留着只是为了不丢老工程里已经存下来的值。 */
    return { ...c, speed: o.speed == null ? c.speed : o.speed, volume: o.volume == null ? c.volume : o.volume };
  });
  // 黑场：锚在「它前面最近的那个镜头」之后
  const blacks = old.map((c, i) => ({ c, i })).filter(x => x.c.kind === 'black');
  blacks.forEach(({ c, i }) => {
    let anchorShot = null;
    for (let k = i - 1; k >= 0; k--) { if (old[k].kind !== 'black') { anchorShot = old[k]; break; } }
    let at = 0;
    if (anchorShot) {
      const j = synced.findIndex(x => clipKey(x) === clipKey(anchorShot));
      at = j >= 0 ? j + 1 : Math.min(synced.length, i);
    } else at = Math.min(synced.length, i);
    synced.splice(at, 0, { ...c, id: uid() });
  });
  proj.timeline = { clips: synced };
  return proj.timeline;
}

/* ---------------- ffmpeg 离线导出 ---------------- */
let rendering = false;
/* 读 JSON：接口不存在（如服务未重启）时给出可操作提示，而不是 “not valid JSON” */
async function readJsonSafe(r, what) {
  const txt = await r.text();
  let d = null;
  try { d = JSON.parse(txt); } catch {}
  if (d == null) {
    const plain = (txt || '').trim();
    if (r.status === 404 || /not found/i.test(plain)) {
      throw new Error(`${what}：本地服务没有这个接口，请重启一次服务（启动.bat → [3] 重启项目）后再试`);
    }
    throw new Error(`${what}：返回了非 JSON 内容（HTTP ${r.status}）${plain ? '：' + plain.slice(0, 80) : ''}`);
  }
  if (!r.ok) throw new Error(`${what}：${d.error || d.err || ('HTTP ' + r.status)}`);
  return d;
}
/* 渲染是本地长任务：走统一网络层但关掉超时（timeout:0），POST 不自动重试 */
const renderPost = body => Net.fetch('/render', {
  method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), timeout: 0, retry: 0,
}).then(r => readJsonSafe(r, '提交渲染任务'));
const renderStatus = id => Net.fetch('/render/status?id=' + encodeURIComponent(id), { timeout: 15000 }).then(r => readJsonSafe(r, '查询渲染进度'));
/* 等一轮渲染跑完：一次「查进度」失败不该把整次导出判成失败。
   代理那边的 ffmpeg 仍在跑，网络抖动 / 15 秒超时只会让界面报「导出失败」，
   用户重头再来又要多等几分钟。连续失败到上限（默认 10 次 ≈ 10 秒）才认输。
   stopped() 由调用方给（导出与合并各有自己的取消标志），取消检查每轮都做。 */
async function pollRenderJob(id, stopped, onTick, maxTicks = 900, maxFails = 10) {
  let job = null, fails = 0;
  for (let i = 0; i < maxTicks; i++) {
    if (stopped()) throw new Error('已取消');
    await new Promise(res => setTimeout(res, 1000));
    try { job = await renderStatus(id); fails = 0; }
    catch (e) {
      if (++fails >= maxFails) {
        throw new Error('查不到渲染进度（连续失败 ' + maxFails + ' 次）：' + ((e && e.message) || e));
      }
      continue;
    }
    if (job.state === 'done' || job.state === 'failed' || job.error) return job;
    if (onTick) onTick(job);
  }
  return job;
}
/* 取消要真的取消：以前只把本地标志位翻一下，页面的轮询停了、代理里的 ffmpeg 却照样跑完（白占 CPU、
   还在 .renders 里留下一条没人要的成片）。代理本来就有 /render/cancel（杀子进程 + 摘队列），接上它。 */
const renderCancel = id => id ? Net.fetch('/render/cancel?id=' + encodeURIComponent(id),
  { method: 'POST', timeout: 8000, retry: 0 }).catch(() => {}) : Promise.resolve();

}

/* ============================================================================
   LLM 辅助：「一键分镜」那一路要的两个助手（宽松 JSON 解析 + 共用约束）。
   约定不变：LLM 只输出 JSON → 本地校验夹取 → 人确认（PromptReview）→ 应用。

/* 宽松 JSON 解析：兼容 ```json 围栏、前后废话、单引号 */
function parseJsonLoose(txt) {
  if (!txt) return null;
  let raw = String(txt).trim();
  const fence = /```(?:json)?\s*([\s\S]*?)```/i.exec(raw);
  if (fence) raw = fence[1].trim();
  const tryParse = s => { try { return JSON.parse(s); } catch { return null; } };
  let v = tryParse(raw);
  if (v) return v;
  // 夹杂说明文字时：取「跨度最长」的候选（对象里的空数组不能当结果）
  const cands = [];
  for (const re of [/\[[\s\S]*\]/, /\{[\s\S]*\}/]) {
    const m = re.exec(raw);
    if (m) cands.push(m[0]);
  }
  cands.sort((a, b) => b.length - a.length);
  for (const c of cands) { v = tryParse(c); if (v) return v; }
  return null;
}

/* 镜头时长的口径只有这两个数：给 AI 的那句约束、它回来的那个数的 clamp、

/* 这一份成片对应的是**哪一串内容**：每段的 [镜头 id, 选用的候选, 第几段, 入点, 出点, 速度, 音量,
   这一段带哪几句配音]，按顺序。
   取址与合成一致（顺序取 tlSyncFromShots 的结果 —— 拖动顺序就体现在这里），
   所以「换候选 / 改入出点 / 切开或删段 / 拖顺序 / 加删配音」任何一件都会让指纹变。
   切口必须是「逐段一项」，不能塌成「候选的首末入出点」：切开**不改**首段的入点、
   也不改末段的出点（只是中间多了一个接缝），塌成那一对数的话「切成两段」会被读成没变，
   于是播的/导出还是上一版画面（旧模型只有 trimS/trimE，那一版就是用这两个数当指纹的）。 */

  if (m.fp == null) return m.clips === tl.clips.length;      // 老成片：退回段数（与从前一致）
  return m.fp === filmFingerprint(tl.clips);

    setStatus('<span class="ok">✓ 已经接成一个完整视频，共 ' + fmtDur(tlDuration()) + '，可以直接下载</span>');
  } catch (e) {
    setStatus(e.message === '已取消' ? '已取消合并（这一轮合成也已通知代理中止）' : '<span class="err">合并失败：' + e.message + '</span>');
  } finally {
    merging = false; mergeCancelled = false; mergeJobId = null;
    mergeProgress = null;
    const b2 = $('mfMerge');
    if (b2) { b2.disabled = false; b2.innerHTML = icon('refresh', 13) + ' 重新合并'; }
    if (proj.tlTab === 'film') renderMid();
  }
}
/* 播放成片：播放「合并后的完整视频」；没有或已过期则先自动合并再播 */
async function playOrMergeFilm() {
  const ready = allShots().filter(shotReady).length;
  if (!ready) { setStatus('<span class="err">还没有已选用的镜头</span>'); return; }
  const m = proj.merged;
  /* 判据是**内容指纹**，不是段数：换候选 / 改入出点 / 拖顺序之后段数不变，
     只比段数等于「陈旧这件事恒为假」，播出来的是上一轮的旧画面。 */
  if (m && filmIsCurrent(m) && !merging) { playMergedFilm(); return; }
  setStatus(m ? '镜头有变动，正在重新合并…' : '还没有合并过的成片，正在合并…');
  await mergeWholeFilm();
  if (proj.merged && filmIsCurrent(proj.merged)) playMergedFilm();
}

  if (merging) return;                                   // 已经在合成中
  if (proj.merged && filmIsCurrent(proj.merged)) return; // 已有最新成片，直接用

function playMergedFilm() {

async function downloadMergedFilm() {
  const m = proj.merged;
  if (!m) { setStatus('<span class="err">还没有合并好的成片，先点「重新合并」</span>'); return; }
  try {
    const blob = await renderBlob(m.name, '下载成片');
    if (!blob.size) throw new Error('成片文件为空，请重新合并');
    const saved = await saveBlob(m.name, blob);
    setStatus('<span class="ok">' + saved.msg + '（' + (blob.size / 1048576).toFixed(1) + ' MB）</span>');
  } catch (e) { setStatus('<span class="err">下载失败：' + e.message + '</span>'); }

function renderMergeBox(col) {
  const box = col.querySelector('#mergeBox');

  const ready = allShots().filter(shotReady);

  box.querySelector('#mfCount').innerHTML = `全部 <b>${ready.length}</b> 个镜头，共 <b>${round1(dur)}</b> 秒`;
  const m = proj.merged;
  /* 陈旧判据与播放 / 自动合并**同一句**（filmIsCurrent）。
     以前这里只比段数，于是换一条候选、改入出点、拖顺序之后这一格照样写
     「已经接成一个完整视频，可以直接下载」—— 而播出来的是上一轮那一份。 */
  const stale = m ? !filmIsCurrent(m) : false;

    ? (stale
      ? `<span style="color:var(--sub)">内容已变动（合并时是${m.fp == null ? m.clips + ' 个镜头' : '另一版选法'}），建议点「重新合并」</span>`
      : `已经接成一个完整视频，共 ${fmtDur(m.duration)}，可以直接下载。`)
    : '尚未合并过：点「重新合并」把全部已选用镜头接成一个完整视频';
  if (!merging) box.querySelector('#mfMerge').onclick = mergeFilmClick;
  box.querySelector('#mfPlay').onclick = playMergedFilm;

function scheduleSave() {
  $('saveState').textContent = '保存中…';
  clearTimeout(saveTimer);
  saveTimer = setTimeout
  (async () => {
    const snap = snapOf();
    if (lastSavedJson && snap !== lastSavedJson) {
      pushUndo(lastSavedJson);          // 限总量，避免大工程把内存吃满
      redoStack.length = 0;
    }
    try {
      const wsRec = { projects: WS.projects, curId: WS.curId, roles: WS.roles, ts: Date.now() };
      await wsKv.put('workspace', wsRec);
      lastSavedJson = snap;
      $('saveState').textContent = '已保存到本地';
      /* 同时写一份到代理的数据目录（.data/workspace.json）：浏览器存储被清掉时还能从磁盘恢复。
         这里只有**引用**（每条素材指向 `.assets` 里的一个资产号），视频字节不在 JSON 里 ——
         那份镜像之所以还能当备份用，是因为 `.assets` 与它一起在项目目录下。
         （原来这句写的是「Blob 在 IndexedDB 里按 blobKey 存」—— 那个键全项目没有一处赋值，
          见下面 exportProject 那一段的注释。） */
      if (window.DataSync) {
        try { window.DataSync.mirrorWs(JSON.stringify({ v: 1, data: wsRec, ts: wsRec.ts })); } catch {}
      }
    } catch (e) {
      // 配额不足 / 事务失败：明确报错，别一直停在「保存中…」
      $('saveState').textContent = '保存失败';
      setStatus('<span class="err">本地保存失败：' + (e && e.message ? e.message : e) + '（工作区可能过大，可先导出项目备份）</span>');
    }
  }, 500);
}

/* ---------- API ---------- */
/* 上传图片前压缩：最长边 1600、JPEG 0.88，显著降低 IndexedDB 体积 */
function compressImg(file) {
  return new Promise(res => {
    if (file.size < 600 * 1024) return res(file);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(img.src);
      const scale = Math.min(1, 1600 / Math.max(img.width, img.height));
      if (scale >= 1) return res(file);
      const cv = document.createElement('canvas');
      cv.width = Math.max(1, Math.round(img.width * scale));
      cv.height = Math.max(1, Math.round(img.height * scale));
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      cv.toBlob(b => res(b && b.size < file.size ? new File([b], file.name.replace(/\.\w+$/, '') + '.jpg', { type: 'image/jpeg' }) : file), 'image/jpeg', 0.88);
    };
    img.onerror = () => res(file);
    img.src = URL.createObjectURL(file);
  });
}
/* 上传阶段文案（ui.js 的 uploadStageText，导演台没加载 workbench.js 也能用）：

/* 素材转存有**两个不同落点**，不要混成一个：
   · ASSET_STORE：给「时间线 / 预览 / 长期可取回地址」用。代理的 /asset/<id> 只会按 SparkCine 的资产接口
     解析签名地址（proxy.js 的 assetInfoOf），所以这一类素材只能传它。
   · assetProvFor(sh)：这一镜的**参考素材**要传到它真正所属的平台 —— VGENV 只认自家 asset_id
     （registry 里 needsUpload 的 role），以前这里一律传 SparkCine，VGENV 镜头挂参考视频/音频必被上游拒。 */
const ASSET_STORE = 'sparkcine';
/* 两个平台的资产是否互通：同一 relay = 同一套账号下的资产库（SparkCine 的图/视频台共用） */
function sameAssetSpace(provIdA, provIdB) {
  const list = (REG && REG.providers) || [];
  const hit = id => list.find(p => p.id === id || (p.keyId || p.id) === id);
  const a = hit(provIdA), b = hit(provIdB);
  if (!a || !b) return false;
  return (a.relay || a.id) === (b.relay || b.id);
}

/* 本地导入的候选（以及重启后按 blobKey 重建的 blob: 地址）每次地址都不一样 —— 拿它当缩略图缓存键
   等于「首帧白抽一次，下次又重新加载」。这类素材改用**候选号**当稳定键，地址只用于取字节。 */
function thumbKey(c) {

  if (/^blob:/i.test(s)) return c.vid ? 'local:' + c.vid : s;

/* ---------- 候选卡片（媒体标记与首帧缓存全部走 Wb.thumbs.mediaHTML，页面不再自己拼） ---------- */
/* 没有画面时那一格写什么：整块重画与轮询增量补丁共用这一份措辞
   （两处各写一份时，增量那份漏了 draft 分支，待写描述的候选会被改成「生成中」）。 */
function candStatusText(c) {
  return c.status === 'draft' ? '待写描述'
    : c.status === 'failed' ? '生成失败' : c.status === 'cancelled' ? '已取消'
    : c.status === 'queued' ? '排队中' : (c.status === 'creating' ? '创建中' : '生成中');
}
/* 这一镜「还没结束的那一条」（排队 / 创建中 / 正在跑都算）—— 进度条按它的 progress 走。 */
const shotRunCand = sh => (sh.candidates || []).find(c => c.status === 'running' || c.status === 'queued' || c.status === 'creating') || null;
/* 镜头状态只有一份措辞（右栏镜头清单与中栏「顺序」那条缩略图带共用）：
   「生成中」只给**真在跑的那一条**（`candStatusText` 那一份），排队中就写排队中、创建中就写创建中；
   而「有候选但没有任何在跑的」不再是生成中 —— 全部失败、全部取消、出片了却还没被选用，
   这三种都是「停下来等人处理」，挂着生成中会让人一直等一个不会再动的任务。
   （「顺序」带以前只按 `candidates.length` 判，于是全失败的那一镜永远显示生成中。） */
function shotStatusOf(sh) {
  const runC = shotRunCand(sh);
  const cands = sh.candidates || [];
  const allBad = cands.length > 0 && cands.every(c => c.status === 'failed' || c.status === 'cancelled');
  const text = shotReady(sh) ? '已选用'
    : runC ? candStatusText(runC)
    : allBad ? '生成失败'
    : cands.length ? '待选用'
    : (String(sh.prompt || '').trim() ? '未生成' : '待写描述');
  const cls = shotReady(sh) ? 'okc' : runC ? 'runc' : allBad ? 'errc' : '';
  return { runC, text, html: cls ? '<span class="' + cls + '">● ' + text + '</span>' : text };
}
function candMediaHTML(c) {
  if (c.url) return Wb.thumbs.mediaHTML(c.url, { key: thumbKey(c) });
  const cls = (c.status === 'draft' ? ' draft' : '') + (c.status === 'failed' || c.status === 'cancelled' ? ' fail' : '');
  return `<div class="pending${cls}">${candStatusText(c)}</div>`;
}
function candTitle(c) {
  const bits = [c.status === 'draft' ? '待写描述' : (ST_ZH[c.status] || c.status)];
  if (c.prompt) bits.push('描述：' + String(c.prompt).slice(0, 60));
  if (c.status === 'running' && c.progress) bits.push(c.progress + '%');
  if (c.queue_position) bits.push('队列#' + c.queue_position);
  if (c.created) bits.push('提交 ' + new Date(c.created).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }));
  if (c.priceText) bits.push(c.priceText);
  if (c.error) bits.push(c.error);

}
