<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>语音工作台 · 拾帧</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem('dir_theme')||'light'}catch(e){}</script>
<link rel="stylesheet" href="ui.css">
<style>
  :root {
    --bg:#f2f3f9; --panel:#ffffff; --panel2:#f3f4f9; --line:#e4e6f0;
    --txt:#23262f; --sub:#8a8fa3; --acc:#6957e8; --acc2:#8b5cf6; --ok:#16a34a; --err:#dc2626; --pri:#7c5cff; --input:#f6f7fb;
  }
  html[data-theme="dark"] {
    --bg:#0b0d13; --panel:#141722; --panel2:#191d2b; --line:#262b3d;
    --txt:#eef0f6; --sub:#8f97ab; --acc:#6c8cff; --acc2:#a06cff; --ok:#4ade80; --err:#ff7a7a; --input:#0f1219;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(900px 500px at 85% -5%, rgba(108,140,255,.14), transparent 60%),
      radial-gradient(700px 500px at -10% 100%, rgba(160,108,255,.10), transparent 60%),
      var(--bg);
    color: var(--txt); min-height: 100vh;
  }
  header {
    position: sticky; top: 0; z-index: 5; backdrop-filter: blur(12px);
    background: var(--panel); border-bottom: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between;
    padding: 13px 28px;
  }
  .logo { font-size: 17px; font-weight: 700; letter-spacing: .4px; }
  .logo em { font-style: normal; background: linear-gradient(90deg, var(--acc), var(--acc2));
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  .refresh { width: 22px; height: 22px; padding: 0; border: 0; border-radius: 50%;
    background: transparent; color: var(--sub); font-size: 13px; cursor: pointer;
    transition: transform .5s, color .15s; line-height: 22px; }
  .refresh:hover { color: var(--acc); }
  /* 两栏布局（.layout / .col-left / .col-right #result / 滚动条）在 ui.css 的
     「工作台共用布局」里统一定义：三页必须同宽，不要在这里再抄一份。 */
  /* 更窄的窗口：收紧留白、缩小磁贴与缩略图，卡片动作换行更好点
     （.btn-row / .tool 的窄屏收敛在 ui.css 里，三台一起） */
  @media (max-width: 720px) {
    textarea { min-height: 118px; font-size: 13.5px; }
    .mat { width: 54px; height: 54px; }
    .thumb { width: 56px; height: 56px; }
    .pinl { padding: 8px; }
    .pinl-ft { gap: 6px; }
    .task .acts { gap: 6px; }
    .task .acts .ghost { padding: 5px 9px; font-size: 11.5px; }
  }

  /* ---- 左栏 ---- */
  .prompt-box { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 6px 0; transition: border-color .15s; }
  textarea { width: 100%; min-height: 170px; padding: 12px; background: transparent; color: var(--txt);
    border: 0; border-radius: 8px; font-size: 14px; font-family: inherit; outline: none; resize: vertical; line-height: 1.7; }
  /* .btn-row / .tool 动作磁贴行统一在 ui.css（三台同款同尺寸） */
  .hint { font-size: 11px; color: var(--sub); margin-top: 6px; line-height: 1.6; }
  .ref-chip { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--txt);
    background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px; }
  .ref-chip button { border: 0; background: none; color: var(--sub); cursor: pointer; font-size: 12px; padding: 0 2px; }
  .ref-chip button:hover { color: var(--err); }

  .adv { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; margin-top: 16px; }
  .adv-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; cursor: pointer; user-select: none; }
  .adv-head h2 { font-size: 13.5px; font-weight: 600; }
  .adv-head .sum { font-size: 12px; color: var(--sub); display: flex; align-items: center; gap: 6px; }
  .adv-head .chev { transition: transform .2s; color: var(--sub); font-size: 11px; }
  .adv.closed .chev { transform: rotate(-90deg); }
  .adv.closed .adv-body { display: none; }
  .adv-body { padding: 4px 16px 16px; border-top: 1px solid var(--line); }
  label { display: block; font-size: 12px; color: var(--sub); margin: 12px 0 5px; }
  select, input { width: 100%; padding: 9px 11px; background: var(--input); color: var(--txt);
    border: 1px solid var(--line); border-radius: 6px; font-size: 13.5px; font-family: inherit; outline: none;
    transition: border-color .15s; }
  select:focus, input:focus { border-color: var(--acc); }
  select option { background: var(--panel2); color: var(--txt); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .costbar { display: flex; justify-content: space-between; align-items: center; margin-top: 16px;
    padding: 10px 13px; background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; font-size: 12.5px; }
  .costbar b { color: var(--acc); font-size: 14px; }
  .costbar .note { color: var(--sub); font-size: 11.5px; }
  /* 生成按钮、#status、#goWhy 的样式在 ui.css 的「工作台共用布局」里（三页一份），这里不再抄 */
  .err { color: var(--err); } .ok { color: var(--ok); }

  /* ---- 右栏：任务列表 ----
     .tasks-head / .tab / .sp / .pginfo / .pgroup 用 ui.css 那一份（三台共用，数值一致） */
  .task { display: flex; gap: 13px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; padding: 12px; margin-bottom: 12px;
    transition: border-color .15s, box-shadow .15s, transform .12s; }
  .task:hover { border-color: var(--acc); box-shadow: 0 4px 16px rgba(0,0,0,.07); transform: translateY(-1px); }
  /* 音频缩略位：一个音符方块，点一下在灯箱里播放 */
  .task .timg { width: 132px; height: 96px; border-radius: 6px; overflow: hidden; flex: 0 0 auto;
    background: linear-gradient(135deg, rgba(108,140,255,.16), rgba(160,108,255,.16));
    cursor: zoom-in; display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: var(--acc); font-size: 26px; align-self: flex-start; border: 1px solid var(--line); }
  .task .timg .dur { font-size: 10.5px; color: var(--sub); margin-top: 2px; }
  .task .tmain { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .task .meta1 { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--sub); }
  .task .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); display: inline-block; }
  .task .dot.run { background: #fbbf24; animation: blink 1.2s infinite; }
  .task .dot.fail { background: var(--err); }
  @keyframes blink { 50% { opacity: .3; } }
  .spin-dot { width: 18px; height: 18px; border: 2px solid #c4c9dc; border-top-color: var(--acc);
    border-radius: 50%; animation: rot .8s linear infinite; display: inline-block; margin-bottom: 4px; }
  @keyframes rot { to { transform: rotate(360deg); } }
  .task .date { margin-left: auto; }
  .task .tprompt { font-size: 13px; line-height: 1.5; margin: 5px 0; color: var(--txt); cursor: pointer;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .task .tprompt:hover { color: var(--acc); }
  .task .meta2 { font-size: 12px; color: var(--sub); }
  .task .acts { margin-top: auto; display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
  .task .acts .ghost { padding: 5px 13px; border-radius: 6px; }
  .empty { color: var(--sub); font-size: 13px; text-align: center; padding: 70px 0; }
  .lib-tip { font-size: 12px; color: var(--sub); }

        #lightbox audio { width: 520px; max-width: 80vw; }
  .ver { font-size: 10.5px; color: var(--sub); opacity: .5; text-align: center; padding: 6px 0 18px; }
</style>
<script src="ui.js"></script>
<script src="workbench.js"></script>
<script src="assetlib.js"></script>
<script src="sidebar.js"></script>

<body class="wb2">
<div class="page-main">
<div class="layout">
  <!-- 左栏 -->
  <div class="col-left">
    <div class="prompt-box" id="promptBox">
      <textarea id="text" placeholder="要合成的文本"></textarea>
      <div class="btn-row">
        <!-- 动作磁贴：与图片台 / 视频台同一套（AI 润色在最左，素材入口居中，清空在右）；润色结果就地展开在这行下面 -->
        <button class="tool acc" id="polishBtn" title="调用文字AI把文本改写成更适合朗读的稿子（密钥在「设置」配置）"><span class="ic" data-icon="sparkles" data-size="14"></span>AI 润色</button>
        <button class="tool" id="refAudioBtn" hidden title="音色复刻：从资产库 / 收藏 / 本地文件选一段参考音频"><span class="ic" data-icon="mic" data-size="14"></span>参考音频</button>
        <span id="refAudioChip"></span>
        <span class="sp"></span>
        <button class="tool danger" id="clearAll" title="清空文本、风格描述与参考音频"><span class="ic" data-icon="trash" data-size="14"></span>一键清空</button>
      </div>
      <div id="polishInline" hidden></div>
    </div>

    <div class="adv" id="adv">
      <div class="adv-head" id="advHead">
        <h2><span data-icon="gear" data-size="14"></span> 合成设置</h2>
        <span class="sum"><span id="advSum"></span><span class="chev">▼</span></span>
      </div>
      <div class="adv-body">
        <div class="row">
          <div><label>模型</label><select id="model"></select></div>
          <div id="voiceCol"><label>音色</label><select id="voice"></select></div>
        </div>
        <div id="styleRow" style="display:none">
          <label>风格 / 音色描述 <span style="color:var(--err)">*</span>（音色设计模型必填）</label>
          <input id="style" placeholder="例：一位温柔的年轻女声，语速偏慢，适合睡前故事">
        </div>
        <div class="row">
          <div><label>输出格式</label><select id="format"></select></div>
          <div><label>文本润色（服务端）</label><select id="optimize">
            <option value="0">关闭</option>
            <option value="1">开启（服务端智能润色播报文本）</option>
          </select></div>
        </div>
        <div id="capHint" class="hint"></div>
      </div>
    </div>

    <div class="costbar"><span id="costTxt">费用：读取中…</span><span class="note" id="mode">文生语音</span></div>
    <button class="go" id="go">生成语音</button>
    <div class="hint" id="goWhy"></div>
    <div id="status"></div>
  </div>

  <!-- 右栏 -->
  <div class="col-right">
    <div class="tasks-head">
      <span class="tab">我的语音</span>
      <span class="sp"></span>
      <span class="pgroup">
        <input id="searchBox" placeholder="搜索文本 / ID" autocomplete="off" spellcheck="false">
        <button class="ghost" id="searchBtn">搜索</button>
        <span class="pgsep"></span>
        <button class="ghost" id="pgPrev" style="display:none">‹ 上一页</button>
        <span class="pginfo" id="pgInfo">第 1 页</span>
        <button class="ghost" id="pgNext" style="display:none">下一页 ›</button>
        <input type="number" id="gotoPage" min="1" placeholder="跳页">
        <button class="ghost" id="gotoBtn">跳转</button>
        <!-- 刷新和翻页是一组动作（都只影响这一屏列表），放同一个组里才不会因为换行被拆成两行 -->
        <button class="ghost" id="sync" title="重新取回这一屏列表"><span data-icon="refresh" data-size="13"></span> 刷新</button>
      </span>
    </div>
    <div id="result"></div>
  </div>
</div>

<!-- 灯箱 DOM 由 workbench.js 的 Wb.lightbox 创建（结构全站一份）-->
<div class="ver">语音工作台 · 接口与音色全部来自注册路由（添加新语音平台只需在 proxy.js 的 REGISTRY 里加一条）</div>

<script>
'use strict';
const $ = id => document.getElementById(id);
const fmtMicros = m => '¥' + (Number(m || 0) / 1e6).toFixed(2);
const ST_ZH = Wb.ST;   // 状态文案统一由 workbench.js 提供（三台一致）
let REG = null;

/* ============ 任务数据 ============ */
const PAGE_MODE = localStorage.getItem('page_mode_audio') || 'more';   // page | more（设置页可改）
const PAGE_SIZE = Math.max(1, Number(localStorage.getItem('page_size_audio') || 12));
const V_CACHE = 'audio_tasks_cache_v1';
let tasks = [];            // 本机创建的任务（localStorage 持久化）
let serverItems = [];      // 服务端（本地资产库）里的语音资产
let serverEntries = [], serverCursors = {}, serverHasMore = true, serverGen = 0, serverChain = Promise.resolve(), serverLoading = 0;
let searchQ = '';   // 分页状态在 Wb.pager 里，灯箱翻页在 Wb.lightbox 里

/* 历史统一走 Wb.History：上限 200、写不进去会明确提示。
   参考音频（音色复刻用的 base64，可达十几 MB）**不再跟着任务进 localStorage** ——
   以前它会把整批历史写爆（QuotaExceeded 被 catch 吞掉，用户零感知）。现在只存一个
   IndexedDB blob 键（voiceRefKey），重试时从本地库取回来。 */
function saveTasks() { return Wb.History.write('audio', tasks); }
function loadTasks() {
  tasks = Wb.History.read('audio');
  tasks.forEach(t => { if (t.status === 'creating' || t.status === 'running') { t.status = 'failed'; t.error = '页面刷新导致中断，可重试'; } });
}
function readVCache() {
  try {
    const c = JSON.parse(localStorage.getItem(V_CACHE) || sessionStorage.getItem(V_CACHE) || 'null');
    return (c && Array.isArray(c.entries)) ? c.entries : [];
  } catch { return []; }
}
function writeVCache(list) {
  const payload = JSON.stringify({ ts: Date.now(), entries: list.slice(0, 200) });
  try { localStorage.setItem(V_CACHE, payload); } catch { try { sessionStorage.setItem(V_CACHE, payload); } catch {} }
}
const vKey = e => [e.kind || '', e.id || e.assetId || e.genId || ''].join('|');
function mergeServer(base, add) { const m = new Map(); base.forEach(e => m.set(vKey(e), e)); add.forEach(e => m.set(vKey(e), e)); return [...m.values()]; }
const audioKey = e => String(e.assetId || e.id || e.genId || e.ts || '');
function toServerItems(entries) {
  serverItems = entries.filter(e => e.kind === 'asset' && (e.type === '音乐' || e.type === '音频')).map(e => {
    const aid = e.assetId || e.id;
    // 本地任务里有、服务端列表里没有的信息（接口用量 / 费用 / 文本转写）按资产 id 继承过来
    const mine = tasks.find(t => t.assetId === aid) || {};
    return {
      id: 'srv_' + aid, assetId: aid, provider: e.provider, providerName: e.providerName,
      model: e.model || '', voice: e.voice || '', format: e.format || 'wav', status: 'done',
      text: e.prompt || '', prompt: e.prompt || '', duration: e.duration || null, url: e.src, dl: e.dl,
      ts: e.ts ? new Date(e.ts).getTime() : 0, error: null, local: false,
      localAsset: !!e.localAsset,             // 本地落盘的产物才能删（上游没有资产存储）
      usageText: mine.usageText || '', priceText: mine.priceText || '', transcript: mine.transcript || '',
      voiceMode: mine.voiceMode || '',
      // 体积：本地落盘的产物在索引里带 byte_length（列表声明里映射成 byteLength）
      bytes: mine.bytes || e.byteLength || 0,
    };
  });
}
/* 服务端列表（注册路由驱动：mimo 的 list 指向本地资产库） */
function loadServer(morePages) {
  const gen = serverGen;
  const run = async () => {
    /* 排在链上的过期批次直接跳过，不再发请求：点「刷新」会 serverGen++，
       旧批次要是照跑，就挡在新一趟前面各耗几秒，界面迟迟不更新。 */
    if (gen !== serverGen) return;
    serverLoading++;
    try {
      const res = await AssetLib.load({
        pages: morePages || 1, reg: REG, cursors: serverCursors,
        kinds: ['audio'],                       // 只读语音类来源（本地资产库），不去等图片/视频平台

        seen: new Set(), out: serverEntries,
        onBatch: list => { if (gen !== serverGen) return; serverEntries = mergeServer(serverEntries, list); toServerItems(serverEntries); renderAll(); },
      });
      if (gen !== serverGen) return;
      serverEntries = mergeServer(serverEntries, res.entries);
      serverCursors = res.cursors; serverHasMore = res.hasMore;
      // 「条目即资产」的本地来源（如一页即全量的本地资产库）：以服务端为准，
      // 把缓存里已经被删掉的旧条目清掉（在别的标签页删过文件时也能自愈）
      for (const src of Api.listSources({ kinds: ['audio'] })) {
        if (!src.spec || !src.spec.selfAsset) continue;
        try {
          const keys = await AssetLib.liveKeys(src.prov);
          if (keys) serverEntries = serverEntries.filter(e => e.provider !== src.key || keys.has(String(e.assetId || e.id)));
        } catch (e2) { /* 上游这次读不到就不清，保留原样 */ }
      }
      // 服务端列表读到了：把「资产已不存在」的本地记录清掉（比如在资产库删过文件）
      const alive = new Set(serverEntries.map(e => e.assetId || e.id));
      const before = tasks.length;
      tasks = tasks.filter(t => !t.assetId || alive.has(t.assetId));
      if (tasks.length !== before) saveTasks();
      toServerItems(serverEntries);
      writeVCache(serverEntries);
    } catch (e) {
      console.warn('[voice] 任务列表加载失败：', e);
      /* 只写控制台的话界面就是「安静地不动」，用户会以为新合成的语音没存上 */
      if (gen === serverGen) setStatus('<span class="warn">任务列表这次没取回来（'
        + Wb.esc(String((e && e.message) || e || '未知错误')) + '）—— 点右上角「刷新」重试</span>');
    }
    finally { serverLoading = Math.max(0, serverLoading - 1); if (gen === serverGen) renderAll(); }
  };
  serverChain = serverChain.then(run, run);
  return serverChain;
}
function mergedAll() {
  const seen = new Set();
  const out = [];
  const srvAssets = new Set(serverItems.map(s => s.assetId));
  for (const t of tasks) { if (t.assetId && srvAssets.has(t.assetId)) continue; seen.add(audioKey(t)); out.push(t); }
  for (const s of serverItems) { if (!seen.has(audioKey(s))) out.push(s); }
  return out
    .filter(t => !searchQ || (t.text || t.prompt || '').toLowerCase().includes(searchQ) || String(t.assetId || '').toLowerCase().includes(searchQ))
    .sort((a, b) => (b.ts || 0) - (a.ts || 0));
}
/* 分页 / 动态加载 / 搜索说明：与视频台共用 workbench.js 的 Wb.pager（口径完全一致） */
/* 后台把总数数准：语音台的右栏 = 本地资产库（注册路由驱动，走 AssetLib）+ 本地任务记录里
   还没落成资产的那几条（合成中 / 失败），所以两边都要算进总数，口径才和卡片一致。
   数完之前是「共 M+ 页」，数完变成精确的「共 N 页」（本地资产库一般一页就到底，通常当场就准）。 */
const tally = Wb.tally(async () => {
  const r = await AssetLib.countAll({ reg: REG, kinds: ['audio'] });
  const localOnly = tasks.filter(t => !t.assetId || !r.assetIds.has(String(t.assetId))).length;
  return { total: r.total + localOnly, exact: r.exact };
});
tally.onDone.push(() => { try { renderAll(); } catch (e) { console.warn('[voice] 数完总数后重画失败：', e); } });
const pager = Wb.pager.create({
  mode: PAGE_MODE,
  pageSize: PAGE_SIZE,
  items: () => mergedAll(),
  hasMore: () => serverHasMore,
  total: () => tally.value(),
  searchQ: () => searchQ,
  render: () => renderAll(),
  fill: async need => {          // 补齐到第 need 页所需的条目（服务端分页拉）
    let guard = 0;
    while (serverHasMore && guard++ < 20 && mergedAll().length < (need || 1) * PAGE_SIZE) await loadServer(2);
  },
});

/* ============ 注册路由 ============ */
const audioProv = () => (window.Api ? Api.prov('audio') : null) || ((REG && REG.providers || []).find(p => p.kind === 'audio') || null);
const ttsSpec = () => (audioProv() && audioProv().tts) || {};
let liveModels = null;      // 从平台 /v1/models 动态取到的模型（失败时回落注册声明）
/* 把注册声明（以及能力接口合并进来的能力）按 id 对齐到动态模型列表上：
   动态列表里的模型对象是新建的，声明里后来合并进去的能力要再对一次，否则界面拿到的是旧的。 */
function mergeDeclared(list) {
  const declared = new Map((((audioProv() || {}).models) || []).map(m => [m.id, m]));
  return (list || []).map(m => Object.assign({}, m, declared.get(m.id) || {}));
}
/* 模型列表：优先读平台的模型接口（新模型自动出现）；声明的能力（ttsMode 等）按 id 合并上去 */
async function loadLiveModels() {
  const prov = audioProv();
  const base = (prov && prov.models) || [];
  const ep = prov && prov.endpoints && prov.endpoints.models;
  if (!ep) return base;
  try {
    const d = await Api.request(prov, 'models');

/* 取回某条任务的参考音频：先内存 → 再本地库 */
async function resolveVoiceRef(t) {

/* PCM16 裸流封装成 WAV 的实现只有 assetlib.js 的 AiGen 那一份（选择器里的语音合成也用它） */
const pcm16ToWav = (b64, sampleRate) => AiGen.pcm16ToWav(b64, sampleRate);
const b64FromBuf = buf => AiGen.b64FromBuf(buf);

async function synth(t) {
  const prov = audioProv();
  if (!prov) throw new Error('注册路由里没有语音平台（kind:"audio"）');
  const tts = prov.tts || {};
  // 音色复刻的参考音频按「先内存 → 再 IndexedDB」取回（任务里只存键，不存十几 MB 的 base64）
  const ref = t.voiceMode === 'clone' ? await resolveVoiceRef(t) : null;
  const useRef = !!ref;
  const voiceValue = useRef ? ('data:' + (ref.mime || 'audio/mpeg') + ';base64,' + ref.base64)
    : (t.voiceMode === 'preset' ? t.voice : '');
  if (t.voiceMode === 'clone' && !useRef) throw new Error('找不到这条任务的参考音频（可能已被清理）：请重新选择参考音频再试');
  const body = {
    model: t.model, text: t.text, style: t.style || '',
    voice: voiceValue, format: t.format,
    textRole: tts.textRole || 'assistant', styleRole: tts.styleRole || 'user',
    optimize_text_preview: !!t.optimize,
    // 语音是同步合成、没有平台任务号：归档在页面提交时按本地任务号做（见下面 go 的 onclick），
    // 这里关掉 create 的自动归档，免得同一个提示词存两份
    log: false,
  };
  // 请求体由 registry 的 create.template 决定（{{字段}} 由这里填，空值自动省略）
  const res = await Api.create(prov, body);
  const b64 = Api.pickPath(res, tts.responsePath || 'choices.0.message.audio.data');
  if (!b64) throw new Error('接口没有返回音频数据（检查 registry 里 tts.responsePath 声明）');
  // pcm16 裸流封成 wav，便于播放与保存
  let outB64 = b64, fmt = t.format;
  if (t.format === 'pcm16') { outB64 = b64FromBuf(pcm16ToWav(b64, tts.pcmSampleRate || 24000)); fmt = 'wav'; }
  const mime = (tts.mime || {})[fmt] || 'audio/wav';
  const name = '语音-' + (t.text || '').replace(/\s+/g, ' ').trim().slice(0, 18) + '.' + fmt;
  const saved = await Api.saveLocalAsset({
    name, mime, format: fmt, data: outB64,
    meta: { prompt: t.text, model: t.model, voice: useRef ? '参考音频复刻' : t.voice, provider: prov.id,
      chars: (t.text || '').length, usage: (res && res.usage) || null },
  });
  // 真实用量来自接口响应（动态），费用按声明单价换算（没声明就不显示价格）
  const u = (res && res.usage) || null;
  const pr = prov.pricing || {};
  const m = curModel();
  let priceText = '';
  if (u && pr.type === 'per_1k_chars' && m.price && m.price.per1kChars != null) {
    const chars = (t.text || '').length;
    priceText = (pr.currency || '¥') + (chars / 1000 * Number(m.price.per1kChars)).toFixed(4);
  }
  const usageText = u ? [u.total_tokens ? u.total_tokens + ' tokens' : '', u.prompt_tokens ? '输入 ' + u.prompt_tokens : '', u.completion_tokens ? '输出 ' + u.completion_tokens : ''].filter(Boolean).join(' · ') : '';
  return { assetId: saved.id, url: saved.url, format: fmt, bytes: saved.byte_length || 0, usageText, priceText, transcript: (res && res.choices && res.choices[0] && res.choices[0].message && res.choices[0].message.audio && res.choices[0].message.audio.transcript) || '' };
}

      setStatus('<span class="ok">✓ 合成完成，已存入资产库（大类型：音乐）</span>');

  const ta = $('text');
  const original = ta.value.trim();
  if (original.length < 2) { setStatus('<span class="err">先写点内容再润色</span>'); return; }
  if (!(await TextAI.canRun(REG))) { setStatus('<span class="err">请先到「设置」填写文字 AI 密钥</span>'); return; }
  const sys = localStorage.getItem('sk_polish_audio') || '你是配音稿编辑。把用户给的文本改写成适合语音合成的口播稿：口语化、句子短、标点清晰，数字与英文缩写写成中文读法，不加解释、不加标题，直接返回改写后的文本。';
  const run = async () => ({ after: await TextAI.chat(REG, sys, '请改写下面这段文字，直接返回结果：\n' + original) });
  const btn = $('polishBtn');
  const host = $('polishInline');
  btn.disabled = true; btn.innerHTML = '<span class="ic">' + icon('sparkles', 17) + '</span>润色中…';
  InlinePolish.loading(host, '正在改写这段稿子…');
  try {
    const first = await run();
    InlinePolish.show(host, {
      after: first.after, before: original, applyLabel: '替换原文本',
      onApply: v => { ta.value = v; setStatus('<span class="ok">✓ 已替换为润色后的稿子</span>'); },
      onRetry: () => run(),
    });
  } catch (e) {
    InlinePolish.clear(host);
    setStatus('<span class="err">润色失败：' + e.message + '</span>');
  } finally { btn.disabled = false; btn.innerHTML = '<span class="ic">' + icon('sparkles', 17) + '</span>AI 润色'; }
};

/* ============ 本地文件删除：防连锁保护 ============
   1) 同一资产同时只允许一个删除请求在飞（重复触发直接忽略）
   2) 两次点击确认（不用原生 confirm，避免被脚本改写后一连串误删）
   3) 删完立刻从列表移除，残留点击落在已脱离文档的节点上也不会命中服务端 */
const deletingIds = new Set();
function armDelete(btn, onConfirm) {
  if (!btn) return;
  if (btn.dataset.armed) { btn.dataset.armed = ''; btn.textContent = btn.dataset.old || '删除'; onConfirm(); return; }
  btn.dataset.armed = '1';
  btn.dataset.old = btn.textContent;
  btn.textContent = '确认删除？';
  setTimeout(() => { if (btn.isConnected && btn.dataset.armed) { btn.dataset.armed = ''; btn.textContent = btn.dataset.old; } }, 2500);
}
async function deleteLocalAsset(t, btn, label) {
  const aid = t.assetId || t.id;
  if (!aid || deletingIds.has(aid)) return;
  if (!tasks.includes(t) && !serverEntries.some(x => (x.assetId || x.id) === aid)) return;   // 已经删过了
  deletingIds.add(aid);
  if (btn) { btn.disabled = true; btn.textContent = '删除中…'; }
  try {
    const res = await AssetLib.remove(t);
    tasks = tasks.filter(x => x !== t && x.assetId !== aid);
    serverEntries = serverEntries.filter(x => (x.assetId || x.id) !== aid);
    saveTasks(); toServerItems(serverEntries); writeVCache(serverEntries); renderAll();
    tally.run(true);        // 少了一条：总数重数一趟（不猜 -1，本地记录与资产库的对应关系本来就绕）
    Toast.ok(res && res.alreadyGone ? '已清理本机记录（服务端已无这条素材）' : '已删除这条语音文件');
  } catch (e2) {
    if (btn) { btn.disabled = false; btn.textContent = label; }
    Toast.err('删除失败：' + e2.message);
  } finally { deletingIds.delete(aid); }
}

/* ============ 卡片渲染（按 key 复用，刷新不闪） ============ */
const cardSig = t => [t.status, t.url, t.text, t.voice, t.model, t.format, t.duration, t.error, t.ts, t.usageText, t.priceText].join('|');
const escHTML = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
function durText(t) { return t.duration ? Number(t.duration).toFixed(1) + 's' : ''; }
function cardInnerHTML(t) {
  const run = t.status === 'creating' || t.status === 'running';
  const failed = t.status === 'failed' || t.status === 'cancelled';
  const date = t.ts ? new Date(t.ts).toLocaleDateString() + ' ' + new Date(t.ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
  const media = run
    ? `<div class="timg"><span class="spin-dot"></span>合成中…</div>`
    : failed ? `<div class="timg" style="color:var(--err);font-size:12px">合成失败</div>`
    : `<div class="timg">${icon('mic', 24)}<span class="dur">${durText(t) || ((t.format || '').toUpperCase() || '音频')}</span></div>`;
  return media + `
    <div class="tmain">
      <div class="meta1"><span class="dot${run ? ' run' : failed ? ' fail' : ''}"></span><span>${ST_ZH[t.status] || t.status}</span><span class="date">${date}</span></div>
      <div class="tprompt" title="${escHTML(t.text || '')}">${escHTML((t.text || '(无文本)').slice(0, 200))}</div>
      <div class="meta2">${[t.providerName || 'MiMo', t.model, t.voice ? '音色 ' + t.voice : '', t.format ? t.format.toUpperCase() : '', durText(t), t.priceText ? '费用 ' + t.priceText : '', t.usageText || ''].filter(Boolean).join(' · ')}</div>
      <div class="acts">${Wb.actsHTML(t, {
        preview: !!t.url && !failed, previewLabel: '试听',
        retry: failed && !!t.text,
        remove: !(t.localAsset && t.assetId) && !!t.local,
        removeFile: !!(t.localAsset && t.assetId),
      })}</div>
      <div class="tdetail" hidden></div>
    </div>`;
}
function bindCard(d, t) {
  const det = d.querySelector('.tdetail');
  const key = audioKey(t);
  const dtBtn = d.querySelector('.dt');
  const setOpen = now => {
    det.hidden = !now;
    d.classList.toggle('open', now);
    dtBtn.textContent = now ? '▾ 收起' : '▾ 详情';
    if (now) Wb.detail.render(t, det);
  };
  d.dataset.tkey = key;
  d._setOpen = setOpen; d._det = det;
  dtBtn.onclick = e => { e.stopPropagation(); setOpen(det.hidden); };
  const tp = d.querySelector('.tprompt');
  if (tp) tp.onclick = e => { e.stopPropagation(); setOpen(det.hidden); };
  const pv = d.querySelector('.pv');
  if (pv) pv.onclick = () => Wb.lightbox.open(t);
  d.querySelector('.timg').onclick = () => { if (t.url) Wb.lightbox.open(t); };
  /* 动作按钮统一由 Wb.bindActs 接线（确认弹窗 / 忙碌态 / 失败提示与图片、视频台一致） */
  Wb.bindActs(d, t, {
    fileName: fileNameOf(t),
    onDetail: () => setOpen(det.hidden),
    onPreview: () => Wb.lightbox.open(t),
    onRetry: async () => {
      const r = await synth(t);
      Object.assign(t, { status: 'done', assetId: r.assetId, url: r.url, dl: r.url + '?dl=1', format: r.format, error: null, ts: Date.now() });
      saveTasks(); renderAll(); loadServer(1); tally.run(true);
      Toast.ok('已重新合成');
    },
    onRemove: () => { tasks = tasks.filter(x => x !== t); saveTasks(); renderAll(); tally.run(true); },
    onRemoveFile: async () => { await deleteLocalAsset(t, null, '删除文件'); },
  });
  return d;
}
function paintCard(d, t) { d.innerHTML = cardInnerHTML(t); return bindCard(d, t); }
/* 卡片列表：复用/重绘/空态都由 workbench.js 的 Wb.cards 管（与图片台、视频台同一份实现） */
const list = Wb.cards.create({
  box: 'result',
  keyOf: t => audioKey(t),
  sigOf: t => cardSig(t),
  paint: (d, t) => paintCard(d, t),
  emptyHTML: () => '<div class="empty">还没有语音，写好文本点「生成语音」</div>',
});
function renderAll() {
  const items = pager.slice();
  pager.update();
  list.paint(items);
}
/* 详情：中性描边 + 完整文本 + 复制（与图片/视频工作台一致） */
/* ============ 任务详情：与资产库共用 Wb.detail（workbench.js）============
   语音是本地同步产物（上游没有任务号），所以适配器里没有 provider/taskId ——
   面板只展示本地记录，另加一个「删除这条语音文件」的动作。 */
Wb.detail.init({
  prompt: t => t.text,
  status: t => t.status,
  rows: t => [
    ['音色', t.voice || (t.voiceRef ? '参考音频复刻' : '')],
    ['字数', (t.text || '').length ? (t.text || '').length + ' 字' : ''],
    ['服务端润色', t.optimize ? '开启' : ''],
    ['接口用量', t.usageText || ''],
    ['转写', t.transcript || ''],
  ],
  actions: t => (t.localAsset && t.assetId)
    ? '<button class="ghost danger" data-delasset>' + icon('trash', 12) + ' 删除这条语音文件</button>'
      + '<span class="det-note">文件只存在本机（上游没有资产存储），删除后无法恢复</span>'
    : '',
  bindActions: (host, t) => {
    const b = host.querySelector('[data-delasset]');
    if (b) b.onclick = e => { e.stopPropagation(); armDelete(b, () => deleteLocalAsset(t, b, '删除这条语音文件')); };
  },
});

/* ============ 灯箱：与资产库/收藏/图片/视频共用 Wb.lightbox（workbench.js）============
   备注：这一页原来只有 #lbAudio 的标记与几个处理器，openLb / showLb 从未定义 ——
   「试听」点了会抛 ReferenceError，等于语音台一直没有预览。改用公共灯箱后恢复正常。 */
Wb.lightbox.init({
  list: () => mergedAll().filter(x => x.url),     // 翻页范围 = 当前列表里能播的条目
  keyOf: t => audioKey(t),
  srcOf: t => t.url || '',
  nameOf: t => fileNameOf(t),
  kindOf: t => 'audio',
  info: (t, el) => [
    t.providerName || 'MiMo',
    t.model,
    t.voice ? '音色 ' + t.voice : '',
    (t.format || '').toUpperCase(),
    t.duration ? Number(t.duration).toFixed(1) + 's' : '',
    t.priceText ? '费用 ' + t.priceText : '',
  ],
});
/* ============ 保存落点：与图片台/视频台/收藏共用 Wb.saver（workbench.js）============ */
Wb.saver.init({ dirKey: 'dir_audio', pickerId: 'skLib_dir_audio', label: '音频', status: setStatus });
function fileNameOf(t) {
  const p = (t.text || 'voice').replace(/\s+/g, ' ').trim().slice(0, 20);
  const d = new Date(t.ts || Date.now()), pad = n => String(n).padStart(2, '0');
  const raw = `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())} ${p || 'voice'}.${t.format || 'wav'}`;
  return raw.replace(/[\\/:*?"<>|\x00-\x1f]/g, '-');
}

/* ============ 交互 ============ */
function setStatus(html) { $('status').innerHTML = html; }
$('searchBtn').onclick = () => { searchQ = $('searchBox').value.trim().toLowerCase(); renderAll(); };
$('searchBox').addEventListener('keydown', e => { if (e.key === 'Enter') { searchQ = $('searchBox').value.trim().toLowerCase(); renderAll(); } });
/* 滚动续拉 / 分页按钮 / 跳页：都由 Wb.pager 驱动（与视频台一致） */
const autoLoadMore = () => pager.ensureFilled(pager.page + 1);
pager.bindButtons();
pager.bindScroll('result');
$('gotoBtn').onclick = () => pager.gotoInput('gotoPage');
$('gotoPage').addEventListener('keydown', e => { if (e.key === 'Enter') pager.gotoInput('gotoPage'); });
$('sync').onclick = async () => {
  const b = $('sync'); b.disabled = true; b.textContent = '刷新中…';
  serverGen++; serverEntries = []; serverItems = []; serverCursors = {}; serverHasMore = true; pager.setPage(0);
  try { await loadServer(1); } catch {}
  tally.run(true);
  renderAll();
  b.disabled = false; b.innerHTML = icon('refresh', 13) + ' 刷新';
};

/* ============ 启动 ============ */
(async () => {
  try { REG = await Api.registry(); } catch { REG = { providers: [] }; }
  if (window.Api) Api.setRegistry(REG);
  syncDropdowns();                       // 先把静态下拉换成公共组件外观
  renderOptions();                       // 再用注册声明画出选项
  loadLiveModels().then(list => { liveModels = list; renderOptions(); updateGoState(); }).catch(() => {});
  try { await Capabilities.load(REG); renderOptions(); } catch {}   // 启动就取一次能力（来源提示 + 模型级参数）
  loadTasks();
  if (!serverEntries.length) { const cached = readVCache(); if (cached.length) { serverEntries = cached; toServerItems(cached); } }
  renderAll();
  loadServer(1).then(() => loadServer(1)).catch(() => {});
  tally.run();                           // 后台数总数（数完 pager 文案才去掉加号）
  refreshCost();
})();
</script>
