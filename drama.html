<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>拍短剧</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236d5cf5'/%3E%3Ctext x='16' y='22' font-family='system-ui,-apple-system,Segoe UI,sans-serif' font-size='15' font-weight='700' fill='%23fff' text-anchor='middle'%3EAI%3C/text%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('dir_theme')||'light'}catch(e){}</script>
<link rel="stylesheet" href="ui.css">
<style>
/* ============================================================================
   拍短剧 · 页面样式
   （三栏布局与滚动条那一份公共定义在 ui.css 的「工作台共用布局」里，这里只写本页专属）
   ========================================================================== */
/* 主题变量：每个页面在自己的 <style> 里写这一份（变量名与 ui.css / 其它页面保持一致）。
   以前这里只声明了 --pri/--pri2，结果 var(--panel2) / var(--txt) / var(--line) 全部取到空值 ——
   「变量存在但值为空」不会走 var() 的回退值，整条声明直接失效（背景变透明）。 */
:root {
  --bg:#f2f3f9; --panel:#ffffff; --panel2:#f3f4f9; --line:#e4e6f0;
  --txt:#23262f; --sub:#8a8fa3; --acc:#6957e8; --acc2:#8b5cf6; --ok:#16a34a; --warn:#d97706; --err:#dc2626; --pri:#7c5cff; --input:#f6f7fb;
}
html[data-theme="dark"] {
  --bg:#0b0d13; --panel:#141722; --panel2:#191d2b; --line:#262b3d;
  --txt:#eef0f6; --sub:#8f97ab; --acc:#6c8cff; --acc2:#a06cff; --ok:#4ade80; --warn:#fbbf24; --err:#ff7a7a; --pri:#7c5cff; --input:#0f1219;
}
/* 与其它九页同一份盒模型（chars.html 等页都有这条，本页以前漏了）：
   少了它，`width:100%` 的 textarea 会再加一遍自己的 padding + border，
   于是「外貌 / 场景描述 / 台词」那几个框永远比卡片宽 22px，右边戳出组件。 */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:14px/1.6 system-ui,"Segoe UI","Microsoft YaHei",sans-serif}
body{display:flex;flex-direction:column;overflow:hidden}

/* ---------- 文字 AI 熔断提示条（样式复用公共的 .ui-note，只补排布与 [hidden] 兜底） ---------- */
.dr-aibar{align-items:center;gap:8px;margin:0}
.dr-aibar>span{flex:1 1 auto}
.dr-aibar[hidden]{display:none}

/* ---------- 顶栏 ---------- */
.dr-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);flex:0 0 auto}
.dr-top h1{font-size:17px;margin:0;font-weight:700;display:flex;align-items:center;gap:8px}
.dr-top .pen{color:var(--sub);cursor:pointer;background:none;border:0;padding:0 2px;font:inherit;line-height:1}
.dr-top .pen:hover{color:var(--pri)}
/* 回列表只留一个箭头：这页从侧栏进来就停在当前这一集，得留着回去的路，但「我的短剧」那串字没用 */
.dr-back{background:none;border:0;color:var(--sub);font-size:22px;line-height:1;padding:0 2px;cursor:pointer}
.dr-back:hover{color:var(--pri)}
.dr-steps{display:flex;align-items:center;gap:6px;margin:0 auto;font-size:13px}
.dr-steps i{font-style:normal;color:var(--sub);cursor:pointer;display:flex;align-items:center;gap:5px;padding:3px 8px;border-radius:20px}
.dr-steps i:hover{background:var(--panel2)}
.dr-steps i.on{background:rgba(124,92,255,.14);color:var(--pri);font-weight:600}
.dr-steps i.done{color:var(--ok)}
.dr-steps i em{font-style:normal;width:17px;height:17px;border-radius:50%;background:var(--panel2);display:inline-flex;align-items:center;justify-content:center;font-size:11px}
.dr-steps i.on em{background:var(--pri);color:#fff}
.dr-steps i.done em{background:var(--ok);color:#fff}
.dr-steps span{color:var(--line)}

/* ---------- 主体 ---------- */
/* 右栏宽度**只有这一个出处**（`--dr-sidew`）：`.dr-side` 与那个右侧抽屉都用它。
   以前抽屉自己写死 `min(420px,88%)`，而右栏是 400px（窄屏 340px）——
   两处各写一个宽度，抽屉就会比右栏宽 20px，右边压出去一截、盖住页面边缘；
   窄屏那一档更是差 80px。 */
.dr-body{--dr-sidew:400px;position:relative;flex:1 1 auto;min-height:0;display:flex}
.dr-col{display:flex;flex-direction:column;min-height:0}
.dr-rail{width:232px;flex:0 0 232px;border-right:1px solid var(--line);background:var(--panel);overflow-y:auto;padding:12px}
/* 收起态的窄条：整条只有 34px，「»」留在原位，随时能展开 */
.dr-rail.min{width:34px;flex-basis:34px;padding:8px 3px}
.dr-main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.dr-side{width:var(--dr-sidew);flex:0 0 var(--dr-sidew);border-left:1px solid var(--line);background:var(--panel);overflow-y:auto;padding:14px}
@media (max-width:1280px){ .dr-body{--dr-sidew:340px} .dr-rail{width:190px;flex-basis:190px} }

.dr-h{font-size:12px;color:var(--sub);margin:4px 0 8px;display:flex;align-items:center;justify-content:space-between}
.dr-item{display:flex;gap:9px;align-items:center;padding:7px;border-radius:8px;cursor:pointer}
.dr-item:hover{background:var(--panel2)}
.dr-item .av{width:38px;height:38px;border-radius:8px;background:var(--panel2);object-fit:cover;flex:0 0 38px;
  display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--sub);overflow:hidden}
.dr-item .av img{width:100%;height:100%;object-fit:cover}
/* 角色头像用**圆形**框（用户要求）。`.av` 这一格被角色和场景共用，而场景图是竖幅的
   （.narrow / .tall 变体），圆角一刀切会把场景缩略图也变圆 —— 所以只给角色那个加 .cast。
   38×38 是正方形，50% 圆角就是正圆，不存在被裁切的问题。 */
.dr-item .av.cast{border-radius:50%}
/* 旁白：没有脸，用**话筒图标**表示（用户要求），不再是一行 12px 灰字「只出声」塞在方框里 */
.dr-item .av .dr-mic{color:var(--sub);opacity:.9;display:flex;align-items:center;justify-content:center}
.dr-item .nm{font-size:13px;font-weight:600}
.dr-item .sub{font-size:11.5px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- 舞台 / 播放器 ---------- */
.dr-stagewrap{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;padding:14px;background:#0b0d13}
.dr-stage{position:relative;background:#000;border-radius:12px;overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,.45);
  height:100%;max-height:100%;aspect-ratio:var(--ar,9/16);max-width:100%}
.dr-stage video,.dr-stage img{width:100%;height:100%;object-fit:contain;display:block}
/* 媒体容器要自己铺满舞台，否则里面的 height:100% 全部按 auto 解析（等于塌成一条） */
.dr-stage > #stageMedia{position:absolute;inset:0}
/* 还没有开头画面时的占位（舞台是深底，所以这两条颜色不跟主题走） */
.dr-noimg{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#666;background:#161a24;font-size:13px}
.dr-subs{position:absolute;left:0;right:0;bottom:6%;text-align:center;padding:0 8%;
  font-size:calc(var(--fs,20)*1px);font-weight:700;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.9),0 0 2px rgba(0,0,0,1);line-height:1.4;pointer-events:none}
.dr-subs .who{color:#e8a0c8}
.dr-badge{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.95);color:#111;
  padding:5px 12px;border-radius:8px;font-size:12.5px;font-weight:600;max-width:88%;text-align:center}
.dr-play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.18)}
.dr-play button{width:62px;height:62px;border-radius:50%;border:0;background:rgba(255,255,255,.94);cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:24px;color:#111;box-shadow:0 4px 20px rgba(0,0,0,.4)}
.dr-ctl{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--panel);border-top:1px solid var(--line);flex:0 0 auto}
.dr-ctl button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--panel);cursor:pointer;color:var(--txt);font-size:13px;
  display:inline-flex;align-items:center;justify-content:center;padding:0}
.dr-ctl button.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
.dr-ctl .nm{flex:1 1 auto;font-weight:600;font-size:13.5px}
.dr-ctl .tm{color:var(--sub);font-variant-numeric:tabular-nums;font-size:12.5px}

/* ---------- 段落条 ---------- */
.dr-segs{padding:10px 14px;background:var(--panel);border-top:1px solid var(--line);display:flex;gap:10px;overflow-x:auto;flex:0 0 auto}
.dr-seg{width:88px;flex:0 0 88px;border:1px solid var(--line);border-radius:8px;overflow:hidden;cursor:pointer;background:var(--panel2)}
.dr-seg.on{border-color:var(--pri);box-shadow:0 0 0 2px rgba(124,92,255,.18)}
.dr-seg .th{position:relative;aspect-ratio:9/16;background:#1a1d28}
.dr-seg .th img{width:100%;height:100%;object-fit:cover;display:block}
.dr-seg .n{position:absolute;top:3px;left:3px;background:rgba(0,0,0,.6);color:#fff;border-radius:4px;padding:0 5px;font-size:11px}
.dr-seg .st{position:absolute;top:3px;right:3px;font-size:12px}
.dr-seg .cap{font-size:11.5px;text-align:center;padding:3px 2px;color:var(--txt)}
.dr-seg .cap.warn{color:var(--warn)} .dr-seg .cap.ok{color:var(--ok)} .dr-seg .cap.run{color:var(--pri)}
/* 「加一段」那一格：不是一个段，是一条动作，所以虚线、不跟别的格子抢高亮 */
.dr-seg.add{border-style:dashed;cursor:pointer}
.dr-seg.add .th{display:flex;align-items:center;justify-content:center}
.dr-seg.add .plus{font-size:22px;color:var(--sub);line-height:0;display:inline-flex}
.dr-seg.add:hover{border-color:var(--pri)} .dr-seg.add:hover .plus{color:var(--pri)}

/* ---------- 右栏 ---------- */
.dr-side h2{font-size:18px;margin:0 0 2px;display:flex;align-items:baseline;gap:8px}
.dr-side h2 small{font-size:13px;color:var(--sub);font-weight:400}
.dr-sect{margin:16px 0 6px;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:space-between}
.dr-slot{display:flex;gap:10px;align-items:flex-start}
.dr-pick{width:64px;height:88px;border-radius:8px;border:1px dashed var(--line);background:var(--panel2);cursor:pointer;
  display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:20px;overflow:hidden;position:relative;flex:0 0 64px}
.dr-pick img{width:100%;height:100%;object-fit:cover;border-radius:inherit}
.dr-pick small{position:absolute;bottom:0;left:0;right:0;text-align:center;font-size:10.5px;background:rgba(0,0,0,.5);color:#fff;padding:1px 0}
.dr-pick small svg{display:block;margin:0 auto}
.dr-pick.has{border-style:solid}
/* 上一次没画成的那一格：边框与那个「!」都标红，原因在 title 里（不靠一句五秒就消失的 toast） */
.dr-pick.err{border-color:#c7506f;color:#e07a95;font-weight:700}
.dr-mini{display:flex;gap:8px;flex-wrap:wrap}
/* 右栏那两行：状态芯片 + 一句说明（第一行）／场景 + 接上一段末帧（第二行） */
.dr-strow{display:flex;gap:8px;align-items:center;margin:8px 0 4px;flex-wrap:wrap}
.dr-strow > .ui-hint{flex:0 1 auto}
/* 顶到行尾的撑开位（.sp 的 flex:1 只在 .btn-row 里有，这里自己点一次名） */
.dr-strow > .sp{flex:1 1 auto}
/* 场景 / 接帧那两个下拉的外壳宽度（公共 .dd 自己不带宽度） */
.dr-sel{display:inline-block;width:136px;flex:0 0 136px}
.dr-sel.sm{width:92px;flex:0 0 92px}
/* 参考图那一格（一列小缩略图，比首尾帧矮一档） */
.dr-refs{flex:1 1 auto;min-width:0}
.dr-refs .cap{font-size:12.5px;color:var(--sub)}
.dr-refs .dr-mini{margin-top:4px}
/* 自动带上的素材（角色三视图进参考图 / 参考音频发给视频 AI）——芯片与下面的说明 */
.dr-auto{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.dr-refs .ui-hint{margin-top:4px;line-height:1.5}
.dr-pick.sm{width:44px;height:52px;flex:0 0 44px}
/* 出场角色那一排也走圆形（用户要求）。原来 44×52 是竖长方形，圆角 8px ——
   同一个「角色头像」在这一屏里有方形和长方形两种画法。改成正方形 44×44 再切 50% 才是正圆。
   `.dr-pick` 还被参考图/道具格共用（那些是竖幅素材，不该圆），所以只给 .cast 这一档切。 */
.dr-pick.sm.cast{height:44px;border-radius:50%;border-style:solid;background:var(--panel2)}
/* 武装态（Confirm.arm 的 badge 模式）：「移出」那枚角标挂在圆下面，
   而 .dr-pick 有 overflow:hidden（那是把图裁成圆角用的）—— 不放开的话角标被切掉半截，
   一个字都读不全，比不画还坏。放开的前提是图自己带圆角（上面那条 border-radius:inherit），
   否则溢出的一瞬间那张脸就变成方的了。 */
.dr-pick.armed-badge{overflow:visible}
.dr-pick.sm.cast .dr-mic{color:var(--sub);opacity:.9;display:flex;align-items:center;justify-content:center}
/* 圆形格里那个「×」：贴底的一小条会压到脸的下巴，改成右上角一个小圆点 */
.dr-pick.sm.cast small{position:absolute;top:1px;right:1px;left:auto;bottom:auto;width:15px;height:15px;
  border-radius:50%;background:rgba(0,0,0,.62);padding:0;display:flex;align-items:center;justify-content:center}
/* 开头画面描述：可改的正文框（原来只是一行只读文本，AI 写错了只能让它再猜一次） */
.dr-opendesc{font-size:13px;color:var(--txt)}
.dr-opendesc textarea{width:100%;min-height:62px;padding:8px 10px;border:1px solid var(--line);
  border-radius:8px;background:var(--input);color:var(--txt);font:inherit;font-size:13px;line-height:1.5;resize:vertical}
.dr-opendesc textarea:focus{outline:0;border-color:var(--pri)}
/* 「台词含收尾约几秒 · 这一段拍几秒」那一条，以及装不下/多留空镜时的两种说法 */
.dr-tight{margin:6px 0}
/* 右栏顶部这一段自己的动作行（上移/下移/复制/删除）：复用公共 .btn-row + .tool，只收一下上下的留白 */
.dr-shotops{padding:4px 2px 6px}
/* 「每一条拍片」展开块里的小排版 */
.dr-mt8{margin-top:8px}
.dr-row6{margin:6px 0}
/* 「再来 N 次」那个下拉换成公共组件后，外壳要给宽度（.dd 自己是 position:relative，不带宽度） */
.dr-more{display:inline-block;width:112px;flex:0 0 112px}
.dr-fixrow{margin-top:10px}
.dr-why{color:var(--err);font-size:12.5px;margin:4px 0 8px}
.dr-box{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--panel2)}
.dr-box.warn{border-color:rgba(217,119,6,.5);background:rgba(217,119,6,.06)}
/* 「一句话让 AI 改这一段」那一行的输入框：页面里不再写一长串行内样式 */
.dr-input{flex:1 1 220px;min-width:0;padding:6px 10px;border:1px solid var(--line);border-radius:8px;
  background:var(--input);color:var(--txt);font:inherit;font-size:12.5px}
.dr-input:focus{outline:0;border-color:var(--pri)}
.dr-inline-err{color:var(--err);font-size:12px;margin-left:6px}
/* 镜头行：一条镜头描述 + 景别 + 秒数 */
.dr-shotrow{border-top:1px solid var(--line);padding:8px 0}
/* ---------- 右侧抽屉（第 3/4 步就地看角色 / 场景 / 道具详情） ----------
   盖在**右栏那一列**上面，宽度就是右栏的宽度（`--dr-sidew`，窄屏一起变）——
   以前这里自己写 `min(420px,88%)`，比右栏宽 20px，右边压出页面一截，看着就像「框飘出去了」。
   `position:relative` 的祖先是 `.dr-body`（上面刚加的）：`top:0/bottom:0` 按**主体**算，
   不是按整个视口 —— 否则抽屉会盖到上面的步骤栏上、底下也超出主体一条。
   遮罩只挡住这一列的宽度：左边的段条还看得见、点别的段就切过去了。 */
.dr-drawer{position:absolute;top:0;right:0;bottom:0;width:var(--dr-sidew,400px);max-width:92%;z-index:6;pointer-events:none}
.dr-drawer-mask{position:absolute;inset:0;background:rgba(0,0,0,.18);pointer-events:auto;cursor:pointer}
.dr-drawer-bd{position:absolute;inset:0;right:0;background:var(--panel);
  border-left:1px solid var(--line);box-shadow:-8px 0 24px rgba(0,0,0,.14);
  display:flex;flex-direction:column;pointer-events:auto}
.dr-drawer-hd{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);flex:0 0 auto}
.dr-drawer-hd b{font-size:13.5px}
.dr-drawer-hd .ui-hint{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dr-drawer-ct{flex:1;min-height:0;overflow:auto;padding:10px 12px 20px}
/* 抽屉里那张卡：两栏挤在窄列里会很难看，改成上下堆叠（左边是脸，右边是信息） */
.dr-drawer-ct .dr-card2{display:block}
.dr-drawer-ct .dr-card2 .face{width:100%}
.dr-drawer-ct .dr-card2 .info{margin-top:10px}
/* ---------- 细分镜头详情（第 3/4 步右栏共用） ----------
   收起时每镜只占一行（镜N + 景别·机位·秒 + 描述），点开才出编辑器 —— 一段最多五镜，
   全展开会把右栏撑成一篇长文。 */
.dr-sublist{display:flex;flex-direction:column;gap:6px;margin-bottom:6px}
.dr-sub{border:1px solid var(--line);border-radius:9px;background:var(--panel2);overflow:hidden}
.dr-sub.open{border-color:var(--pri)}
.dr-sub-hd{display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;background:none;border:0;
  color:var(--txt);font:inherit;font-size:13px;cursor:pointer;text-align:left}
.dr-sub-hd:hover{background:var(--panel)}
.dr-sub-hd .n{flex:0 0 auto;font-weight:600;color:var(--pri);min-width:30px}
.dr-sub-hd .m{flex:1;min-width:0;color:var(--sub);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dr-sub-hd .cv{flex:0 0 auto;display:inline-flex;color:var(--sub);transition:transform .15s}
.dr-sub:not(.open) .dr-sub-hd .cv{transform:rotate(-90deg)}
.dr-sub-bd{padding:0 10px 10px;border-top:1px solid var(--line)}
.dr-sub-ctl{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 0 2px}
.dr-sub-ctl label{font-size:12px;color:var(--sub);margin-left:2px}
.dr-sub-ctl select{max-width:150px}
.dr-sub-why{font-size:11.5px;color:var(--sub);line-height:1.5;margin:2px 0 4px}
.dr-sub-desc{width:100%;min-height:74px;resize:vertical;font:inherit;font-size:13px;line-height:1.6;
  padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--input);color:var(--txt);outline:none}
.dr-sub-desc:focus{border-color:var(--pri)}
/* 「进不了成片的段」清单：段号 + 原因，一行一段，别挤成一坨 */
.dr-miss{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-top:1px solid var(--line);font-size:13px}
.dr-miss:first-child{border-top:0}
.dr-miss b{flex:0 0 auto;color:var(--txt);font-weight:600}
.dr-miss span{flex:1 1 auto;color:var(--sub);overflow-wrap:anywhere}
.dr-box h4{margin:0 0 6px;font-size:13.5px;display:flex;align-items:center;gap:6px}
.dr-box p{margin:6px 0;font-size:12.5px;color:var(--sub)}
.dr-take{display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid var(--line);cursor:pointer}
.dr-take:hover{background:var(--panel2)}
.dr-take.on{background:rgba(124,92,255,.1)}
.dr-take .no{font-weight:700;width:44px}
.dr-take .st{font-size:12px;color:var(--sub);flex:1 1 auto}
/* 拍片记录那一行右端的垃圾桶：删掉**这一次**（点行本身是切换到这一条，两件事别混在一起）。
   外观走公共件 .iconbtn，这里只留它自己额外的尺寸 —— 那一列很窄，压到 22px。 */
.dr-takedel{width:22px;height:22px;border-radius:6px}
/* 正在跑的那一次：不删（删了就丢任务号），给一条「不等了」—— 它去平台撤单，撤不掉也先松手 */
.dr-takex{flex:0 0 auto;padding:2px 8px;border:1px solid var(--line);border-radius:8px;
  background:transparent;color:var(--sub);cursor:pointer;font-size:11.5px;white-space:nowrap}
.dr-takex:hover{border-color:var(--err);color:var(--err)}
/* 同一行里那颗只有图标的下载钮：必须和右端那颗删除钮一样是 24×24 的方块，
   否则一个方块旁边跟着一条 29×21 的宽条，看着像两个不同控件。 */
.dr-takex.sq{width:24px;height:24px;padding:0;display:inline-flex;align-items:center;justify-content:center}
/* 这一条开头画面的来源：取不到上一段末帧时会悄悄改用本段开头画面，画面上得看得见 */
.dr-take .ch{flex:0 0 auto;font-size:11px;color:var(--sub);opacity:.85}
/* 角色卡 / 场景卡上的「从这一集删掉」：同页段、拍片、台词都能删，这两个以前只增不减 */
.dr-del{color:var(--err)}
.dr-del:hover:not(:disabled){background:rgba(220,38,38,.08)}
/* 成片清单：一行一段，点了跳过去 */
.dr-edlrow{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:8px;cursor:pointer;font-size:13px}
.dr-edlrow:hover{background:var(--panel2)}
.dr-edlrow .e1{flex:0 0 68px;color:var(--sub);font-size:12px}
.dr-edlrow .e2{flex:0 0 56px;color:var(--sub);font-size:12px}
.dr-edlrow .e3{flex:1 1 auto;color:var(--err);font-size:12px}
.dr-edlrow.warn{background:rgba(220,38,38,.07)}

/* ---------- 底部条 ---------- */
.dr-bottom{flex:0 0 auto;background:var(--panel);border-top:1px solid var(--line);padding:10px 16px}
.dr-bottom .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dr-bottom .status{color:var(--sub);font-size:13px;flex:1 1 240px;display:flex;align-items:center;gap:8px;min-width:0}
.dr-bottom .status .spin{width:13px;height:13px;border:2px solid var(--line);border-top-color:var(--pri);border-radius:50%;
  animation:drspin .8s linear infinite;flex:0 0 13px}
@keyframes drspin{to{transform:rotate(360deg)}}
/* 「把人送到出问题的那一张卡」：滚动过去并闪两下边框。
   没有这一下时按钮只是把人丢进第 2 步，右栏十几张角色卡里还得自己找是哪一位缺脸。 */
@keyframes drHit{0%{box-shadow:0 0 0 0 rgba(220,38,38,.55)}70%{box-shadow:0 0 0 7px rgba(220,38,38,0)}100%{box-shadow:0 0 0 0 rgba(220,38,38,0)}}
.dr-hit{animation:drHit 1.2s ease-out 2;border-radius:12px}

/* ---------- 入口页的「高级设置」：只压**标题那一条**，展开后的控件一律不动 ----------
   真正的原因是 `.dr-entry h2{font-size:26px;margin:0 0 22px}`（下面 236 行那条）本意是给
   页面大标题「这一集想拍什么？」写的，可它是**后代选择器**，把面板里的 `<h2>高级设置</h2>`
   一起命中了；而 ui.css 的 `.adv-head h2{font-size:13.5px}` 与它**特异性相同**、又写在更早的
   样式表里，于是 26px + 22px 下边距赢了 —— 标题条从本该的 ~46px 撑到 ~115px。
   修法在上面那条规则（限定成 `.dr-entry > .wrap > h2.dr-pageh`），这里只把头本身再收一点。 */
#advSet .adv-head{padding:9px 16px}
/* 按钮/磁贴/提示条/分段开关/胶囊/状态芯片全部走 ui.css 的公共件，这里不再另写一份 */

/* ---------- 入口页 ---------- */
.dr-entry{flex:1 1 auto;overflow-y:auto;padding:40px 20px 60px}
.dr-entry .wrap{max-width:820px;margin:0 auto}
/* 只给页面大标题「这一集想拍什么？」。原来是 `.dr-entry h2` —— **后代选择器**，
   把「高级设置」折叠条里那个 `<h2>` 一起命中了：26px + 22px 下边距 vs 公共件的
   `.adv-head h2{font-size:13.5px}`，两者特异性相同，页面样式写在后面，于是标题条
   从 ~46px 被撑到 ~115px（就是「高级设置太高」的真因，与展开后的控件无关）。 */
.dr-entry h2.dr-pageh{font-size:26px;text-align:center;margin:0 0 22px}
.dr-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 4px 24px rgba(0,0,0,.05)}
.dr-card textarea{width:100%;min-height:110px;border:1px solid var(--line);border-radius:10px;padding:12px;
  background:var(--input);color:var(--txt);font:inherit;resize:vertical}
.dr-opts{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 6px;align-items:center}
.dr-cta{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
/* 开始按钮旁边那一行：只写本机当场算得出的时长事实 */
.dr-cta .secs{color:var(--sub);font-size:12.5px;flex:1 1 auto}
/* 入口页那一行「基本选项」：一个 label 摞一个控件，横向排开 */
.dr-opt{display:flex;flex-direction:column;gap:4px}
.dr-opt label{font-size:12px;color:var(--sub)}
/* 整集时长：档位下拉 + 选「自定义…」才露出的分钟框。
   下拉面板的宽度由 ui.css 按选项自然宽度来（以前跟着 80px 的按钮一起窄，选项被折行）。
   数字框与下拉同高同圆角，挨在一起才不像两个控件凑巧放一块。 */
.dr-dur{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.dr-dur .dd{min-width:104px}
.dr-durin-w{display:flex;align-items:center;gap:5px}
.dr-durin-w[hidden]{display:none}
.dr-durin{width:66px;height:38px;flex:0 0 auto;border:1px solid var(--line);border-radius:6px;padding:0 9px;
  background:var(--input);color:var(--txt);font:inherit;font-size:13.5px}
.dr-durin:focus{outline:none;border-color:var(--pri)}
.dr-durin-w>span{font-size:12.5px;color:var(--sub)}
.dr-chk{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--txt);cursor:pointer}
.dr-list{margin-top:34px}
.dr-mine{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-top:12px}
.dr-mine .it{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;gap:12px;cursor:pointer;position:relative}
.dr-mine .it:hover{border-color:var(--pri)}
.dr-mine .cv{width:56px;height:76px;border-radius:8px;background:var(--panel2);object-fit:cover;flex:0 0 56px;
  display:flex;align-items:center;justify-content:center;color:var(--sub);overflow:hidden}
.dr-mine .cv img{width:100%;height:100%;object-fit:cover}
.dr-mine .tt{font-weight:700;margin-bottom:2px}
.dr-mine .st{font-size:12.5px;color:var(--sub)}
.dr-mine .del{position:absolute;top:6px;right:8px}

/* ---------- 步骤 2：认角色 ---------- */
.dr-cast{max-width:1120px;margin:0 auto;padding:22px 18px;flex:1 1 auto;overflow-y:auto;width:100%}
.dr-cast h2{font-size:20px;margin:0 0 4px}
.dr-cast .tip{color:var(--sub);font-size:13px;margin-bottom:18px}
.dr-card2{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:18px;display:flex;gap:20px}
.dr-card2 .face{width:220px;flex:0 0 220px}
/* 场景卡：图窄一些，而且按竖幅（场景图跟着成片的画幅走） */
.dr-card2 .face.narrow{width:120px;flex:0 0 120px}
.dr-card2 .face .big.tall{aspect-ratio:9/16}
.dr-card2 .face .big{width:100%;aspect-ratio:1/1;border-radius:10px;background:var(--panel2);object-fit:cover;overflow:hidden;
  display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:13px;text-align:center;padding:8px}
.dr-card2 .face .big img{width:100%;height:100%;object-fit:cover}
/* 候选那一排的标记来自 Drama.Cast.picCandsHTML（素材库页同一份），排版只跟着这一列的宽度换行 */
.dr-card2 .ui-cands{margin-top:8px}
.dr-card2 .info{flex:1 1 auto;min-width:0}
.dr-card2 .nm{font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px}
.dr-card2 .nm .tag{font-size:11px;background:var(--panel2);color:var(--sub);border-radius:4px;padding:1px 6px;font-weight:400}
.dr-card2 .bio{color:var(--sub);font-size:13px;margin:6px 0}
.dr-card2 label{display:block;font-size:12.5px;color:var(--sub);margin:12px 0 4px}
.dr-card2 textarea{width:100%;min-height:56px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;
  background:var(--input);color:var(--txt);font:inherit;resize:vertical;font-size:13px}
/* 台词编辑（这一行的文本框/删除键是本页特有的，公共层没有）。
   说话人那一列是原生 <select>，由 ui.js 的 Dropdowns 换成 .dd 组件 ——
   所以宽度写在外壳 .dd 上（原生 select 被 Dropdowns 藏起来，只当数据源）。 */
.dr-lines{margin-top:6px}
.dr-line{display:flex;gap:6px;align-items:flex-start;margin-bottom:6px}
.dr-line .dd{width:96px;flex:0 0 96px}
.dr-line textarea{flex:1 1 auto;min-height:38px;max-height:120px;padding:6px 8px;border:1px solid var(--line);border-radius:7px;background:var(--input);color:var(--txt);font:inherit;font-size:13px;resize:vertical}
.dr-line .del{width:26px;height:28px;flex:0 0 26px}
/* 「听这一句」圆钮：与角色卡上那个试听钮（.ui-vrow .play）同一副长相，
   免得同一种「放一段声音」在页面上长成两个样子。没配音的那一句留一颗灰字占位，
   宽度固定住 —— 播与不播时整行不该横向跳。 */
.dr-line .play{width:26px;height:28px;flex:0 0 26px;display:inline-flex;align-items:center;justify-content:center;
  border:1px solid var(--line);border-radius:7px;background:var(--input);color:var(--txt);cursor:pointer;padding:0}
.dr-line .play:hover{border-color:var(--acc)}
.dr-line .lineno{width:26px;flex:0 0 26px;text-align:center;font-size:11px;color:var(--sub);line-height:28px}
/* 机位候选：标记与样式都是公共层 `.ui-cands` / `.ui-cand` 那一份（drama.js 的 picCandsHTML），
   这里只让它在自己的格子里换行 —— 那一排在小图尺寸下挤成一行时挤得看不清是哪一张。 */
.dr-cams{margin-top:8px}
.dr-cams .ui-cands{gap:8px}
.dr-cams .ui-cand{flex-direction:column;align-items:stretch;padding:4px;width:108px}
.dr-cams .ui-cand img{width:100%;height:80px;cursor:zoom-in}
.dr-cams .ui-cand .t{max-width:100%;text-align:center;white-space:normal;line-height:1.3}
.dr-cams .ui-cand .ui-linkbtn{align-self:center}
.dr-card2 .acts{display:flex;gap:8px;align-items:center;margin-top:14px;flex-wrap:wrap}
.dr-assets{margin-top:10px;border:1px dashed var(--line);border-radius:10px;padding:12px}
.dr-assets .txt{color:var(--sub);font-size:12.5px;margin-bottom:8px}
.dr-assets .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dr-assets .th{width:58px;height:40px;border-radius:6px;background:var(--panel2);overflow:hidden;flex:0 0 58px;cursor:zoom-in;position:relative}
.dr-assets .th img{width:100%;height:100%;object-fit:cover}
/* 资产是**列表**了：一张一个缩略图，底下压类型标签、右上角一个「×」去掉这一张。
   原来只有「三视图」一格，`.th` 里既没有标签也没有删除 —— 现在三类并排，
   没有标签就分不清哪张是哪张，没有 × 就只能把整类清空重来（钱白花）。 */
.dr-assets .th i{position:absolute;left:0;right:0;bottom:0;font-style:normal;font-size:9.5px;line-height:1.3;
  text-align:center;color:#fff;background:rgba(0,0,0,.62)}
.dr-assets .th .th-x{position:absolute;top:1px;right:1px;width:15px;height:15px;padding:0;line-height:1;
  border:0;border-radius:50%;background:rgba(0,0,0,.62);color:#fff;font-size:11px;cursor:pointer}
.dr-assets .th .th-x:hover{background:var(--err)}
.dr-assets .ui-cands{width:100%}
.dr-assets .ui-props{margin-top:6px;padding-top:6px;border-top:1px solid var(--line)}
.dr-assets .ui-proprow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:11.5px}
.dr-assets .ui-proprow>b{color:var(--sub);font-weight:600;min-width:52px}
/* 角色资产：**一个扁平列表**，每一行 = 缩略图 + 名字输入框 + 重出 + 去掉 + 关联道具多选。
   名字是输入框而不是文字 —— 用户要能自己起名，这是「角色资产」与「三视图」最大的差别。 */
.dr-assets .ui-assets{display:flex;flex-direction:column;width:100%;gap:0}
.dr-assets .ui-asset{display:flex;flex-wrap:wrap;align-items:center;gap:7px;width:100%;
  padding:6px 0;border-top:1px solid var(--line)}
.dr-assets .ui-asset:first-child{border-top:0}
.dr-assets .ui-inp:disabled{opacity:.5;cursor:default}
.dr-assets .ui-inp[data-act="assetname"]{flex:0 1 168px}
.dr-assets .ui-inp[data-act="assetrename"]{flex:0 1 168px}
.dr-assets .ui-inp[data-act="assetwhat"]{flex:1 1 200px}

/* ---------- 公共件之外、本页专用的那几块 ----------
   （行内样式一律收到这里：每一条拍片的详情、弹窗里的图与输入框） */
.dr-min0{min-width:0}
/* 列表行（左轨的角色/场景、素材库弹窗）里那块会换行的正文 */
.dr-item .mid{flex:1 1 auto;min-width:0}
/* 素材库挑选弹窗：卡片就是统一选择器那套（ui.css 的 .ap-grid / .ap-item），
   只是给个更宽的对话框 —— 560px 里一格 132px 只排得下三张，四张看着才不像挤在角落里。 */
dialog#drLibDlg{max-width:min(700px,94vw)}
.dr-libno{display:flex;align-items:center;justify-content:center;height:84px;
  background:var(--panel2);color:var(--sub);font-size:11px}
/* 左轨「场景」这个小标题与上面的角色列表隔开一点 */
.dr-h2{margin-top:14px}
/* 头像/封面格里的占位文字（「没脸」「只出声」「没图」「短剧」） */
.dr-ph{font-size:12px;color:var(--sub)}
/* 「正在生成」的占位格由 Drama.Cast.waitHTML(t,'fill') 生成（公共标记在 ui.css 的 .ui-wait）。
   这里只覆盖**这一页深色缩略槽**上的颜色与定位：底是 #1b2030 那一档，浅灰字与浅圈都看不见。 */
.dr-stage .ui-wait,.dr-seg .ui-wait,.dr-pick .ui-wait{color:#9aa2b6;font-size:11px}
.dr-stage .ui-wait i,.dr-seg .ui-wait i,.dr-pick .ui-wait i{border-color:#2a2f40}
/* 段条那颗格子里的图靠绝对定位铺满，占位也要照做（.th 只有 aspect-ratio、不是 flex） */
.dr-seg .th .ui-wait.fill{position:absolute;inset:0}
/* 「每一条拍片」展开的那块详情 */
.dr-takedet{padding:8px 10px;border-bottom:1px solid var(--line)}
/* 弹窗里的图 / 一句话改这一段的输入框（#prDlg textarea 默认 40vh，那个高度是给长文本用的） */
.dr-sheetimg{border-radius:8px;width:100%;display:block}
.dr-sheetimg.face{width:130px}
.dr-sheetgap{margin:10px 0}
.dr-sheetln{font-size:12.5px}
.dr-bgmcur{font-size:13px;margin-bottom:10px}
.dr-bgmaudio{width:100%;display:block;margin-bottom:10px}
/* 底栏就地展开的那一块（配乐 / 前置条件 / 成片清单 / 旧末帧）：单独占一行，
   底栏本身是一条 flex 的按钮行，塞进去会被挤成一条。 */
.dr-panel{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:0 0 8px;background:var(--panel2);max-height:46vh;overflow:auto}
.dr-panel-hd{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.dr-panel-hd b{flex:1 1 auto;font-size:13px}
.dr-panel .row{gap:8px;margin-top:4px;flex-wrap:wrap}
/* 底栏那条提示：贴着按钮行，别再各写一次行内 margin */
.dr-bottom .ui-note,.dr-bottom .ui-hint{margin:0 0 6px}
/* 「认角色」这一步的块间距（以前是每块挂一次行内 margin） */
.dr-cast h2 .sw{float:right;display:flex;align-items:center;gap:6px}
.dr-cast .ui-note.info{margin-bottom:14px}
.dr-cast .dr-h{margin-top:22px}
.dr-cast .btn-row{margin-top:20px}
.dr-card2 .nm .sp{flex:1 1 auto}
.dr-card2 .ui-hint,.dr-card2 .ui-note.err{margin-top:6px}
/* 底栏按钮行里的排布（以前是逐个按钮挂行内 flex）。
   `.sp` 这个占位弹簧在 ui.css 里只对 .btn-row / 弹窗底栏生效，本页的 .row 要自己给一条，
   否则它是个宽度为 0 的空 span（写着「顶到行尾」其实什么都没顶）。 */
.dr-bottom .row > button{flex:0 0 auto}
.dr-bottom .row > .ui-hint{flex:1 1 100%;margin:0}
.dr-bottom .row > .sp{flex:1}
/* 「按得下去、但只会弹前置条件清单」的按钮：看着就要弱一档 */
.dr-dim{opacity:.55}

/* ---------- 忙碌中 ---------- */
.dr-busy{flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:40px}
.dr-busy .big{font-size:19px;font-weight:600}
.dr-busy .mid{color:var(--txt);font-size:14px}
.dr-busy .sm{color:var(--sub);font-size:12.5px;text-align:center;max-width:520px}
/* 忙碌页里的两块（流式面板 / 「你写的故事」折叠件）要占满可用宽度并左对齐：
   .pinl 默认随内容收缩、.adv 自带 margin auto，直接摆进居中的 flex 列里会很窄。 */
.dr-busy .pinl,.dr-busy .adv{width:min(680px,100%);margin:6px 0 0}
/* 「你写的故事」那一块要保留换行，而且别跟着折叠头居中 */
.dr-plain{white-space:pre-wrap;text-align:left;color:var(--sub);font-size:12.5px;max-height:34vh;overflow:auto}
.dr-spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--pri);border-radius:50%;animation:drspin .8s linear infinite}
</style>
</head>
<body>

<div class="dr-top" id="top" hidden>
  <button class="dr-back" id="btnBack" title="回到短剧列表" aria-label="回到短剧列表"><span class="ic" data-icon="arrowLeft" data-size="19"></span></button>
  <h1><span id="dTitle">未命名短剧</span><button class="pen" id="btnRename" title="改名" aria-label="改名"><span class="ic" data-icon="pencil" data-size="14"></span></button></h1>
  <div class="dr-steps" id="steps"></div>
</div>

<!-- 文字 AI 熔断时的照实播报（判据在 drama.js 的 aiOk()，这里只渲染） -->
<div class="ui-note dr-aibar" id="aiBar" hidden></div>

<!-- 本地代理没连上时的照实播报。与上面那条同一形状（.ui-note + hidden），
     但**不能只靠 Toast**：这一页「配没配密钥 / 能出几张 / 支不支持某参数」全都由注册表算，
     代理没起来时它们会一直错着，而 Toast 会消失。判据是 Api.regFailed()。 -->
<div class="ui-note err dr-aibar" id="proxyBar" hidden>
  <span id="proxyBarMsg"></span>
  <button class="ui-linkbtn" id="btnRetryProxy">重新连接</button>
</div>

<div class="dr-body" id="body"></div>

<div class="dr-bottom" id="bottom" hidden></div>

<script src="ui.js"></script>
<script src="ident.js"></script>
<script src="assetlib.js"></script>
<script src="workbench.js"></script>
<script src="drama.js"></script>
<script src="ai-chat.js"></script>
<script>
/* ============================================================================
   拍短剧 · 页面逻辑
   业务逻辑全在 drama.js（Drama.*），这里只做「画界面 + 接事件」。
   ========================================================================== */
(function () {
  'use strict';
  const $ = id => document.getElementById(id);
  const top = $('top'), body = $('body'), bottom = $('bottom'), stepsEl = $('steps');
  const D = window.Drama;
  /* 图标：几何只有 ui.js 的 ICONS 一份，本页不手写任何 path。
     静态标记走 data-icon（fillIcons() 在 DOMContentLoaded 一次性填），模板字符串里走这里。
     默认就带上 `<span class="ic">` 外壳 —— ui.css 那条 `:where(button,…) .ic` 靠它把
     SVG 的 baseline 缝隙消掉（不包的话按钮会高出 1~2px，同一排磁贴就高低不齐）。
     只有**已经有外壳**的地方才传第三个参数 1（.dr-pick small 那个小徽标、.dr-seg 的 + 号）。 */
  const ic = (name, size, bare) => {
    const s = window.icon(name, size);
    return bare ? s : '<span class="ic">' + s + '</span>';
  };
  /* 自由文本框的提交：`input`（用户每敲一下就落盘）+`change`（失焦/程序化赋值时补一次）。
     以前这几处只绑 `input`，于是两件事不成立：
       ① 任何程序化写入（测试、批量导入、外部工具）都改不动它 —— 值留在 DOM 上，
          下一次重画就没了，表现为「我明明填了台词，一刷新就没」；
       ② 只认 `input` 意味着「内容到底有没有进数据层」没法验 —— 自动化的 fill/type
          都不派发 `input`，于是「写没写进去」这件事在本页上不可测。
     `change` 那一次不是重复提交：值没变就直接返回，两路都指向同一个落点，不会有第二份判据。 */
  function bindText(el, apply) {
    if (!el) return;
    let last = null;
    const run = () => {
      if (el.value === last) return;      /* 同一份内容不重复落盘，也不重画 */
      last = el.value;
      apply(el.value);
    };
    el.oninput = run;
    el.onchange = run;
  }

  let REG = { providers: [] };
  let capsReady = false;       // 能力声明取回来了没有（取回来之前入口页的下拉显示「正在读」而不是「没配接口」）
  let curOpts = null;          // 入口页那排下拉的当前值（提到这一层，能力回来后重画不会把用户刚选弄丢）
  /* 入口页「从素材库选」挑中的那批素材 id（角色 + 场景都有）。
     以前这个下拉只是把 roleSource 翻成 'lib'，然后把**整个库**都喂给 AI 让它自己认名字 ——
     库里攒到几十条以后，AI 拿到的候选是一大锅，它挑谁全凭剧情；而用户在入口页明明知道自己要用哪几个，
     界面上却没有任何一个地方能让他说这件事。挑中之后只有这几条进 `castNote`（drama.js 读它）。 */
  let curLibPick = [];
  let cur = null;              // 当前短剧（Drama 对象）
  /* 存这一集 —— 全页 89 处 `save()` 都走它。
     **存不进去必须看得见**：dramas 与全部设置、密钥共用同一份 localStorage 配额，
     撞满时 Store.write 直接失败，而页面以前是裸调 D.put：界面照旧显示「已保存」，
     用户改完一刷新，全部丢失，而且没有任何一处红字。
     数据层读不出旧值时（listBroken）也会在这里被挡住 —— 那不是「存不下」，
     是「磁盘上那份读不出来，再写一次就把它整批覆盖掉」，两句话必须分开说。 */
  let saveWarnedAt = 0;
  function save() { return saveOf(cur); }
  /* 存**指定**那一集：续等有可能在用户已经切去别的集之后才结束 —— 它现在不再锁死全页
     （见 genWhy 的两档），这个窗口比从前长得多。那时 `save()` 存的是**新打开的那一集**，
     续等接回来的画面与配音结果就整批留在内存里，一个字没落盘，刷新即没。 */
  function saveOf(d) {
    if (!d) return { ok: true };
    const r = D.put(d);
    if (r && r.ok === false) {
      const now = Date.now();
      if (now - saveWarnedAt > 8000) {
        saveWarnedAt = now;
        toast(String(r.error || '本机存储写不进去')
          + ' —— 这一集现在「没有存下来」，刷新之后刚才的改动会没有。查一下浏览器的存储空间，或到「设置 → 清理缓存」把不用的东西清一清。',
          'err', 9000);
      }
    }
    return r;
  }
  /* 逐字输入的落盘节流（D1）。以前 `bindText` 的 apply 里直接 `save()`：敲一个字就把
     **整份短剧库**读两次（listBroken + list）、对全部短剧跑一遍 fixTakes、再序列化写回一次 ——
     改一集的台词，所有其它短剧陪着解析两遍、写回一遍。实测 32 部时 0.91 ms/次、接近上限时
     5.23 ms/次、40 部×4 倍段数时 15.85 ms/次，按 8 键/秒就是最高 127 ms/秒的主线程占用。
     这里只把**逐字输入**这条链改成 trailing debounce（400 ms）：内存里立刻改（apply 先写对象），
     落盘合并成一次。其余 100+ 处 `save()` 全是离散事件（点按钮、切步骤、任务回调），
     它们要的是「当场落盘」，所以保持同步 —— 只动输入这条热路径。
     窗口内用户切走这一集也安全：saveSoon 记的是调用那一刻的 `d`（默认 `cur`），
     不会等到 flush 时才去认「现在打开的是哪一集」。 */
  let saveSoonTimer = 0;
  const saveSoonSet = new Set();
  function saveSoon(d) {
    saveSoonSet.add(d || cur);
    if (saveSoonTimer) clearTimeout(saveSoonTimer);
    saveSoonTimer = setTimeout(flushSaveSoon, 400);
  }
  function flushSaveSoon() {
    if (saveSoonTimer) { clearTimeout(saveSoonTimer); saveSoonTimer = 0; }
    if (!saveSoonSet.size) return;
    const ds = [...saveSoonSet];
    saveSoonSet.clear();
    for (const d of ds) saveOf(d);
  }
  /* 刚敲完立刻刷新/切标签页时，把还没落盘的那一次补上（debounce 的唯一代价就是这个窗口）。 */
  window.addEventListener('pagehide', flushSaveSoon);
  window.addEventListener('beforeunload', flushSaveSoon);
  document.addEventListener('visibilitychange', () => { if (document.hidden) flushSaveSoon(); });
  /* 写素材库那一条的唯一出口。`Lib.save` 在「素材库里那份读不出来」时**一个字都不写**、
     返回值照旧是一个对象，页面紧接着一句「素材库里那一份也一起改了」就成了假话；
     配额撞满时同样是「写了、其实没写」。这里把数据层留下的原因取走（取完即清），
     照实弹出来并返回 null，调用方据此别提那句「也改了」。 */
  function libWrite(item) {
    const saved = D.Lib.save(item);
    const e = D.Lib.writeError();
    if (e) { toast(e, 'err', 9000); return null; }
    return saved;
  }
  /* 删素材库的条目：`Lib.remove` 返回 false = 一条都没删（读坏了它会整个停手）。
     返回**真删掉的那些 id** —— 调用方只该把这些从本集的 libId 里摘掉，
     没删成的还挂着引用，下一次存盘又把「已在素材库」写回去，卡片与库里对不上。 */
  function libRemove(ids) {
    const gone = [];
    let why = '';
    for (const i of ids) {
      if (D.Lib.remove(i)) gone.push(i);
      const e = D.Lib.writeError();
      if (e && !why) why = e;
    }
    if (why) toast(why, 'err', 9000);
    return gone;
  }
  /* 「做下一集」建好、还在等故事的那一集在数据上长这样：opts.nextOf 有值、故事与分段都是空的。
     靠数据认它（不是只靠一个会话内的变量）—— 刷新之后点「开始」同样落回它上面，
     带过来的角色与场景才不会因为又新建了一部空集而被丢在原处。 */
  const nextDraftOf = d => (d && d.opts && d.opts.nextOf && !d.story && !(d.shots || []).length) ? d.id : '';
  const pendingDraft = () => (D.list().find(nextDraftOf) || {}).id || '';
  let nextDraft = '';          // 入口页点「开始」时要用上的那一集（由 pendingDraft 现算）
  let shotIdx = 0;             // 当前段
  let takeIdx = 0;             // 当前看的是哪一次拍摄
  let railMin = false;         // 左轨是否收起
  let autoplay = false;
  let playerT = 0, playerTimer = null, playerClock = 0, previewAudios = [], previewTimers = [];

  /* ---------- 流水线记账：谁在生成、生成到哪、现在能不能再开工 ----------
     只有一张表，两种条目：
       · `flow:<名字>`  —— 整轮在跑（拆剧本 / 出预演 / 批量拍 / 单段拍 / 出成片 / 续等）。
         这期间任何「再开一次生成」的动作都会重复花钱或和正在写的档案抢，一律拦住。
       · `unit:<种>#<id>` —— 某**一份**素材正在生成（这位的脸、这一段开头画面、这一段配音…）。
         只拦同一份（同一份画两次才是白花一次钱），不同素材并发放行 —— 它们本来就互不相干。
     以前整条流水线只有一句字符串 `busy`：并发时后写的把先写的盖掉（看到的永远是最后那一句），
     格子里没有「这一项正在生成」的凭据，按钮也答不出「现在点会不会又花一次钱」。 */
  const GEN = new Map();
  const gKey = (kind, id) => (id == null ? 'flow:' : 'unit:' + kind + '#') + (id == null ? kind : id);
  function genSet(kind, id, msg) { GEN.set(gKey(kind, id), msg); paintStatus(); }
  function genClear(kind, id) { GEN.delete(gKey(kind, id)); paintStatus(); }
  function genHas(kind, id) { return GEN.has(gKey(kind, id)); }
  /* 这一份素材这一轮正在出的那句话 —— 候选格子的占位文案要读它，别在页面里再编一句
     （两处措辞不一样，底栏和格子里看着就像两件事）。 */
  function genMsg(kind, id) { return GEN.get(gKey(kind, id)) || ''; }
  function genFlowKeys() { const out = []; for (const k of GEN.keys()) if (k.indexOf('flow:') === 0) out.push(k.slice(5)); return out; }
  /* 底栏 / 等待屏那一行：各条自己在干什么拼成一句（一份在跑时读起来和原来那句一样） */
  function genLine() { return Array.from(GEN.values()).filter(Boolean).join('　｜　'); }
  /* 「有一轮在跑」不等于「什么都干不了」，整轮分两档 —— 这一张表就是那把尺子：
       · **独占轮**：它正在改的就是这一集的分段、配音或成片，期间任何会重新生成的动作
         都可能和它抢同一份数据、或让同一段被拍两次（= 重复扣费），一律先拦。
       · **旁听轮**（只有 resume）：它拿着**上次就已经提交出去**的任务号去问平台结果，
         一个字都不新提交、也不花钱。真正会撞的只有「再拍一次那几段」，
         别的（画脸、补角色资产、试听音色、出声音候选）与它互不相干。
     以前不 分档：续等一开始，画脸 / 试听 / 角色资产 / 声音候选全被同一句「先等一下」按哑，
     而续等恰恰是全页最长的一段等待（每条都有一轮超时上限），用户只能干看着页面不能动。
     「停下」能中止还没派出去的活，但续等派出去的活是**上一次**的，中止它等于白等。 */
  /* 补画（fill）也进独占轮：这一轮正在改的就是这一集的脸、三视图与场景图，
     期间去拍视频等于拿半张脸去生成。fillRest 内部因此一律用 genUnit（见那段注释）。 */
  const FLOW_EXCL = { split: 1, preview: 1, batch: 1, render: 1, aivoice: 1, fill: 1 };
  /* 只跟「拍摄这一路」相撞的动作：重拍、配音、出预演（它里面也配音） */
  const SHOOT_KINDS = { batch: 1, shoot: 1, dub: 1, preview: 1 };
  /* 会「再开一次生成」的动作开工前先问这一句；只读的（看卡、改文字、挑本机已有的图、存进素材库）
     一律放行 —— 拦那些只会让人以为页面坏了。返回空串 = 可以开工。 */
  function genWhy(kind, id) {
    const flows = genFlowKeys();
    const hard = flows.filter(f => FLOW_EXCL[f]);
    if (hard.length) return '先等一下：' + (GEN.get('flow:' + hard[0]) || '') + '。这一轮跑完再点（底栏「停下」能中止还没派出去的活）';
    const soft = flows.filter(f => !FLOW_EXCL[f]);
    if (soft.length && SHOOT_KINDS[kind]) {
      return '先等一下：' + (GEN.get('flow:' + soft[0]) || '')
        + ' —— 上一轮提交出去的拍摄还在等平台回话，现在再拍同一段等于拍两次。等它问完；'
        + '不想等了就在拍片记录里按「不等了」。';
    }
    if (genHas(kind, id)) return '这一项正在生成中，好了会自动出现，不用再点一次';
    return '';
  }
  /* 占位：标记与转义在 Drama.Cast.waitHTML（素材库页同一份），这里只选「铺满格子」那一档外形。 */
  const waitHTML = t => D.Cast.waitHTML(t, 'fill');
  /* 记账一变，底栏那一行与第 1 步的大字就跟着变 —— 定点改文字，不整页重绘
     （整页 render 会重建 <video>，正在播的那条会从头来）。 */
  /* 「□ 停下」**有没有**：第 4 步（导出/出成片随时可能按下去）常驻，第 2、3 步只在路上有活的时候出现
     （画脸、出预演、补素材都是后台一段一段派的活，没有中止入口就只能干等整轮跑完）。
     判据只在这里算一处 —— 以前 paintStatus 与 renderBottom 各写一遍，两条规则还不一样
     （paintStatus 额外要求 step >= 2，renderBottom 靠「底栏本身在 step < 2 时是 hidden」绕过去）。 */
  const stopWant = () => !!(cur && cur.step >= 2 && (cur.step === 4 || GEN.size));
  let stopShown = false;
  function paintStatus() {
    const t = genLine();
    const el = $('stxt'); if (el) el.textContent = t || statusOf(cur);
    const sp = $('stSpin'); if (sp) sp.hidden = !GEN.size;
    const big = $('busyBig'); if (big) big.textContent = t || 'AI 导演正在读故事、拆分镜';
    /* 只在真假翻转时才重画底栏：每一条进度都重画一次，那条提示文案会跟着闪。 */
    const want = stopWant();
    if (want !== stopShown) { stopShown = want; renderBottom(); }
  }

  /* ---------- 启动 ---------- */
  async function boot() {
    /* 看大图一律走公共灯箱（workbench.js 的 Wb.lightbox：DOM、翻页、下载、详情都在那儿），
       本页不再自己写一层放大弹层。翻页范围 = 这一部里已画好的角色资产。 */
    Wb.lightbox.init({
      list: assetItems,
      keyOf: it => it.src,
      srcOf: it => Api.mediaSrc(it.src),
      nameOf: it => it.name || '',
      /* kind 由条目自己带：成片预览要按 <video> 渲染，其余是图片。
         写死成 'image' 的话，成片会被塞进 <img> —— 出来一个永远转圈的破图。 */
      kindOf: it => (it && it.kind) || 'image',
      detail(it, host) { host.innerHTML = '<div class="dr-takedet"><div class="ui-hint">' + D.esc(it.name || '') + '</div></div>'; },
    });
    body.addEventListener('click', e => {
      /* 两个属性都认：角色 / 场景 / 道具卡与素材库那边派发 `data-act`，右栏派发 `data-a`
         —— 机位候选那一排摆**在右栏里**，所以它的缩略图是 `data-a="zoom"`（见 picCandsHTML
         的 `attr`）。只认一个就是「那一排的图点不开灯箱」。 */
      const t = e.target.closest('[data-act="zoom"], [data-a="zoom"]');
      if (!t || !t.dataset.src) return;
      Wb.lightbox.open({ src: t.dataset.src, name: t.dataset.name || '' });
    });
    /* 别的标签页 / 另一台机器改了这一部时要说一声。
       本页以前是 `dramas` 的写者里**唯一**不订阅 storage 的（chars.html / favorites.html 都有）：
       A 页删掉一集，B 页内存里那份还是旧的，B 页随手一个会存盘的动作就 `xs[i] = d`
       把 A 的删除整份撤销；两页同时拍同一集，后写的会把先写的那几条 take 顶掉 ——
       表现是「刚才拍好的那几条不见了」，而且没有任何提示。
       storage 事件只在**别的**标签页触发，本页自己的存盘不会进来。 */
    let staleAt = 0;
    window.addEventListener('storage', e => {
      if (e.key !== 'dramas' && e.key !== 'drama_chars') return;
      if (!cur) return;
      if (!D.get(cur.id)) {
        /* `get` 就是 `list().find()`，所以「列表里有、偏偏这一条读不到」不可能发生 ——
           真正要分的是**整份列表读不读得出来**。`Store.read` 为了别让一条脏数据卡死整页，
           解析失败与「不是信封」都返回默认值 []，于是那一刻 `get` 对**每一部**都返回 null。
           照旧说「在别处被删掉了」是假话，还会顺手把用户踢回入口页：正在做哪一部的上下文一起没了。
           判据问数据层那一份 `listBroken`（`put` 也问它，同一件事只有一份判据）：
             ① 它非空 = 整份读不出来 → 保存本来就被挡住了（磁盘上一个字没动），**不动 cur**；
             ② 它为空 = 列表读得出来、只是没有这一部 → 那才是真被删（或被丢更新挤掉），照实说。 */
        const broken = D.listBroken ? D.listBroken() : '';
        if (broken) {
          toast(broken + '：所以是「读不出来」，不是「被删掉了」。保存已经被数据层挡住，'
            + '磁盘上原来的数据一个字没动 —— 别在这个页面上继续改，先到「设置」导出一次整包备份。', 'err', 12000);
          return;
        }
        toast('这一部在别处被删掉了 —— 回到列表看看', 'err', 9000);
        cur = null; shotIdx = 0; takeIdx = 0; render();
        return;
      }
      if (Date.now() - staleAt < 15000) return;   // 一次同步/一轮拍摄能触发十几次，别把对话淹了
      staleAt = Date.now();
      toast('别处（另一个标签页或另一台机器）也动这一部了 —— 现在接着操作会把那边的改动覆盖掉。'
        + '先把要改的复制出来，再刷新这一页。', 'err', 8000);
    });

    const id = D.activeId();

    D.settleStuckDubbing();

    if (cur) setTimeout(() => { healTakeUrls().catch(() => {}); }, 1200);

    if (cur && cur.step === 2) setTimeout(() => askFill('这一集还有图没画', '每张单独出一次 · 画完停在「认角色」这一步'), 400);
  }
  /* 补画前的确认闸，**两个入口共用**（打开页面接着画 / 拆完剧本接着画）：

     「拆剧本」点下去之后紧接着画 N 张，用户也没机会决定画不画（那一步要等十几秒）。
     问句里的张数与 `fillBits` 同一份判据（也就是 `fillRest` 真正会发的那几张），
     不另数一遍 —— 确认框写 3 张、实际发 5 张，比不确认更糟。
     三个开关都关、或一张都不欠、或已经在补画 → 直接返回（那不是花钱动作）。 */
  async function askFill(title, sub) {
    if (!cur || cur.step !== 2 || genHas('fill', null)) return;
    const bits = fillBits();
    if (!bits.length) return;
    const ok = await Confirm.ask({
      title, sub,
      body: '接着画完还欠的：' + bits.join('、') + '。',
      okLabel: '现在画',
      cancelLabel: '先不画',
      danger: true,
    });
    if (ok) { fillRest(); return; }

       底栏「把还没画的都画上」与每张卡上的单张按钮是同一条路。
       刚拆完剧本时更要说清「剧本已经拆好了」—— 不然会以为整步失败、要再拆一次。 */
    toast(cur.step === 2
      ? '没画。底栏「把还没画的都画上」随时能点，每张卡上也能自己挑一张或上传'

     某一集里重画整屏（右栏的画幅/时长那一列也是现算的）。 */
  async function loadCaps() {
    try { REG = await Api.registry(); } catch (e) { REG = { providers: [] }; }

       十几家平台挨个问一遍（串行，每家最多 25 秒超时，慢的那一家就能把整页按在「注册表还是空」

       候选按钮写「再画一张」（型号明明一次能出 4 张）、型号下拉全空，
       而界面上**没有任何一处**说明这只是在等 —— 用户只会跑去设置页重填密钥。

    capsReady = false;

  }

     判据只有 Api.regFailed() 一处（assetlib.js 取注册表失败时留住原因的地方）。 */
  function paintProxyBar() {
    const bar = $('proxyBar'); if (!bar) return;
    const bad = !!(Api.regFailed && Api.regFailed());
    bar.hidden = !bad;
    if (!bad) return;
    const why = (Api.regError && Api.regError()) || '注册表是空的';
    $('proxyBarMsg').textContent = '本地代理没连上（' + why + '）：这一页的型号下拉、'
      + '「这一家配没配密钥」、能出几张、有没有某项参数，全都读不到 —— '
      + '所以上面那句「还没配语音接口」之类的**不作数**。把代理启动起来（启动.bat → 1）再点右边这个。';
  }

    const b = $('btnRetryProxy');
    if (b) b.onclick = async () => {
      b.disabled = true; b.textContent = '正在连…';
      /* 重连要走 Api.clearCaches：注册表缓存 60 秒，不清的话点这一下什么都不会变，
         而「点了没反应」正是这一条最不能有的表现。 */
      try { if (Api.clearCaches) Api.clearCaches(); } catch (e) {}

      if (b2) { b2.disabled = false; b2.textContent = '重新连接'; }

    };
  }

    const o = D.list()[0] ? Object.assign({}, D.newDrama().opts, D.list()[0].opts)

        '<span class="dr-opt"><label>角色从哪来</label>' + sel('oRole', D.ROLE_SOURCES, curOpts.roleSource) + '</span>',
        libRoleHint(),
        libPickRow(),
      ].join('');
      /* 高级设置：这次启用哪三个 AI（生图 / 语音 / 视频）+ 画幅 / 画质 + 「我自己排」。

      $('advBody').innerHTML = '<div class="adv-grid">'

        + '</div>'
        + (ch.ok ? '<div class="adv-grid" style="margin-top:10px">'
            + '<div><label>画幅</label>' + sel('oRatio', ch.ars, curOpts.ratio, '这一家没声明，拍的时候自动对齐') + '</div>'
            + (ch.ress.length ? '<div><label>画质</label>' + sel('oRes', ch.ress.map(r => ({ id: r, label: r })), curOpts.res, '这一家没声明，拍的时候自动对齐') + '</div>' : '')

        + '<div class="adv-grid" style="margin-top:10px"><div><label class="dr-chk">'
        + '<input type="checkbox" id="oManual"' + (curOpts.manual ? ' checked' : '') + '> 我自己排（不让 AI 拆剧本，角色场景分段都手动加）</label></div></div>'

        + '<div class="sel-hint">画风、每段时长与镜头切换由文字 AI 按剧情自己定；每段最长 '

      const sum = [];
      if (ch.ok) { sum.push(curOpts.ratio || '9:16'); if (curOpts.res) sum.push(curOpts.res); }
      sum.push('整集 ' + durText(curOpts.duration));
      $('advSum').textContent = sum.join(' · ');
      /* 下拉一律走公共组件（ui.js 的 Dropdowns）：原生 <select> 留在 DOM 里当数据源，
         页面照样用 $(id).value 读、onchange 收事件 —— 以前这里是裸 select，全站只有它没换皮。 */
      Dropdowns.build($('opts')); Dropdowns.build($('advBody'));
