    };
    const bindOpts = () => {
      ['oModel', 'oRatio', 'oRes', 'oRole', 'oImgModel', 'oTtsModel'].forEach(id => {
        const el = $(id); if (!el) return;
        if (id === 'oRole' || id === 'oImgModel' || id === 'oTtsModel' || id === 'oModel') el.onchange = () => { curOpts = readOpts(); paintOpts(); };
        else el.onchange = () => { curOpts = readOpts(); paintSecs(); };
      });
      /* 「挑角色 / 挑角色组」只在选了「从素材库选」时才有（那一行是 libPickRow 现算的），
         所以每次重画都要重新接线 —— 上面那些下拉同理，onchange 挂在刚画出来的节点上。 */
      const pickBtn = $('btnLibPick');
      if (pickBtn) pickBtn.onclick = () => openLibPicker({
        pick: true,
        preselect: curLibPick,
        onPick: ids => { curLibPick = (ids || []).slice(); paintOpts(); },
        /* 在弹窗里新建了素材，那一行「素材库有 N 条」的数就旧了 —— 只重画选项那一块，
           不动用户正在写的那段故事。 */
        onChanged: () => paintOpts(),
      });
      /* 整集时长：档位在**下拉**里，选到「自定义…」才露出分钟数字框。
         数字框打字时只刷那一行提示（重画整块会把输入框连光标一起重建，边打字边丢焦点），
         离开输入框（或点上下箭头）才把超界的值吸回来并如实说一句 —— 存进数据的一直是夹好后的秒数。 */
      const durSel = $('oDur'), durC = $('oDurC'), durW = $('oDurW');
      const durShown = () => !durW || !durW.hidden;
      if (durSel) durSel.onchange = () => {
        if (durSel.value === 'custom') {
          /* 不重画整块：重画会把焦点丢掉，而且露出输入框之后紧接着就改自己的档位等于把自己藏回去 */
          if (durC) { if (durW) durW.hidden = false; curOpts = readOpts(); paintSecs(); durC.focus(); }
          return;
        }
        curOpts = readOpts(); paintOpts(); paintSecs();
      };
      if (durC) {
        durC.oninput = () => { if (durShown()) { curOpts = readOpts(); paintSecs(); } };
        durC.onchange = () => {
          if (!durShown()) return;
          const asked = Number(durC.value) * 60;
          curOpts = readOpts();
          if (Number.isFinite(asked) && asked > 0 && Math.round(asked) !== curOpts.duration) {
            toast('这一集的长度取不了 ' + durC.value + ' 分钟：按能拍的范围算作 ' + durText(curOpts.duration), 'err');
          }
          paintOpts();
        };
      }
      /* 「我自己排」只改 opts（步骤闸门 stepGate 认它），不重画整块高级设置。
         绑定写在 bindOpts 里 —— 这一格是 paintOpts 刚画出来的，写在外面时它还不存在。 */
      const manualBox = $('oManual'); if (manualBox) manualBox.onchange = () => { curOpts = readOpts(); paintSecs(); };
    };
    if (!curOpts) {
      curOpts = { videoModel: o.videoModel, imgModel: o.imgModel, ttsModel: o.ttsModel,
        ratio: o.ratio, res: o.res, duration: o.duration, roleSource: o.roleSource, manual: !!o.manual };
      /* 上次挑的那批只在上次**确实是走素材库**时才接回来：上一次选了「全新角色」就当没挑过，
         别让一份看不见的旧选择决定这一集喂给 AI 的是谁。 */
      curLibPick = o.roleSource === 'lib' && Array.isArray(o.libPick) ? o.libPick.slice() : [];
    }
    paintOpts();
    paintSecs();
    /* 展开/收起用公共件的 .adv + .closed（和三个工作台一致），状态存本机 */
    $('advHead').onclick = () => {
      const adv = $('advSet'); if (!adv) return;
      adv.classList.toggle('closed');
      try { localStorage.setItem('dr_adv_open', JSON.stringify(!adv.classList.contains('closed'))); } catch {}
    };
    try { $('advSet').classList.toggle('closed', !JSON.parse(localStorage.getItem('dr_adv_open') || 'false')); } catch {}

    /* 开始按钮旁边那一行只写**本机当场算得出的事实**：整集目标多长、每段的上限是哪一档。
       原来这里是一列估价 —— 报价接口要么没有要么动辄十几秒，猜一个数摆在开拍前只会误导。
       「每段几秒」也不再断言：每段多长是文字 AI 按台词与剧情自己定的。 */
    function paintSecs() {
      const el = $('secs'); if (!el) return;
      /* 能力声明还没回来时**一个字都别写**：这一行的数是 readOpts() 现读下拉得来的，
         而下拉（连同视频模型那个）此刻还没画 —— readOpts() 全部落到兜底值，
         duration 取到 bounds.min（视频平台最短的一档，本机是 4 秒），
         于是这一行先摆出「整集目标 4 秒」：一个用户从没选过的数，还比真值小十几倍。
         （旁边 `#opts` 那栏已经在说「正在读平台能力声明…」，这里再编一个数就是两处各说各话。）
         caps 回来后 renderEntry() 会自己重跑这里。 */
      if (!capsReady) { el.textContent = ''; return; }
      const d = D.newDrama({ opts: readOpts() });
      const want = d.opts.duration || 60;
      const ch = D.Pipe.videoChoices(REG, { videoModel: d.opts.videoModel });
      el.textContent = '整集目标 ' + durText(want)
        + (ch.ok ? '，AI 拆成若干段（每段最长 ' + D.Pipe.maxShotSec(REG, d.opts) + ' 秒，视频平台声明的档位）' : '')
        + (D.aiDurOn() ? '；它觉得这个长度撑不起/装不下会自己改一个数，改完在预演那一步写明' : '');
    }

    $('btnStart').onclick = () => startStory();
    bindDraftNote();
    paintImproveBtn();
    $('btnImport').onclick = () => importScript();

    $('mine').innerHTML = mine.length ? mine.map(m => {
      const n = (m.shots || []).length, done = (m.shots || []).filter(s => s.chosen).length;
      /* 「拍过但一条都没成」不能并进「还没开拍」：这一档里用户已经花过钱了，
         说成没拍过等于把「拍砸了」讲成「没试过」—— 重试时不去查为什么、也不去清掉拍坏的那几条。
         数字取**所有 take 的条数**（含失败与已弃的），与段列表里那份口径一致。 */
      const tries = (m.shots || []).reduce((a, s) => a + ((s && s.takes) || []).length, 0);
      return `<div class="it" data-id="${D.esc(m.id)}">
        <div class="cv">${m.cover ? `<img src="${D.esc(Api.mediaSrc(m.cover))}">` : '<span class="dr-ph">短剧</span>'}</div>
        <div class="dr-min0"><div class="tt">${D.esc(m.title)}</div>
          <div class="st">${done ? '拍到 ' + done + '/' + n + ' 段' : (tries ? '拍过 ' + tries + ' 次·没拍成' : '还没开拍')}</div>
          <div class="st">${new Date(m.updatedAt).toLocaleString('zh-CN', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' })}</div></div>
        <button class="del iconbtn" data-del="${D.esc(m.id)}" title="删除这一部">${ic('trash', 14)}</button></div>`;
    }).join('') : '<div class="ui-hint">还没有短剧。写一段故事就能开拍。</div>';
    $('mine').querySelectorAll('.it').forEach(el => el.onclick = async e => {
      /* 按钮里装的是一颗 SVG，点在图标上时 e.target 是 <svg> / <span class="ic"> 而不是按钮本身。
         直接读 e.target.dataset 读不到 data-del，于是这一下会掉进下面「打开这一集」那条路 ——
         看着就是「点了删除，结果短剧打开了」。所以先 closest 到按钮，再从**它**身上读。 */
      const btn = e.target.closest('[data-del]');
      if (btn) {
        /* 删一部短剧是不可逆的：**就地二次确认**（那个垃圾桶原地变成「确认删掉」，再点一下才真删），
           不用模态框 —— 入口页常常连着删好几部，每删一部弹一次窗，页面节奏全被打断。
           后果写在 `note` 里：弹窗没了，那几句话必须留在眼前。
           真正拦得住的是 D.remove 自己（有拍摄在跑时它会拒并说清），所以即使没看见提示也删不掉。 */
        const id = btn.dataset.del;
        const got = D.get(id);
        if (!got) return toast('这一部已经不在了（可能在别处删掉了），列表已刷新', 'err');
        const busy = D.runningTakes(got);
        const shots = (got.shots || []).length;
        const note = (busy.length
          ? '⚠ 它还有 ' + busy.length + ' 次拍摄正在平台上跑着 —— 删掉之后那些任务在平台那边照样会跑完，而这一边再也接不回它们。'
          : '')
          + (shots ? '这一集的剧本、' + shots + ' 段拍片都会没掉。' : '');
        if (Confirm.arm(btn, '确认删掉', { note: note })) return;
        const r = D.remove(id);
        if (r && r.ok === false) return toast(r.why || r.error || '删不掉', 'err', 8000);
        if (D.activeId() === id) D.setActive('');
        render(); return;
      }
      /* 列表画出来之后它可能已经在别处（另一台机器同步 / 另一个标签页）被删掉了 ——
         D.get 会返回 null，直接 cur.id 就是一条 TypeError，点卡片看着像没反应。 */
      const got = D.get(el.dataset.id);
      if (!got) { toast('这一部已经不在了（可能在别处删掉了），列表已刷新', 'err'); render(); return; }
      cur = got; D.setActive(cur.id); shotIdx = 0; takeIdx = 0; render();
    });
  }
  /* 入口页那排下拉的当前值（**只此一份**：以前 renderEntry 内外各有一个，
     外层那个漏了 videoModel，startStory 存下来的短剧就丢了「选的是哪个视频模型」）。
     这里**不再读画风**（`style` 恒为空，画风由文字 AI 按剧情逐段写进 `shot.style`），
     也补上了「我自己排」（opts.manual，步骤闸门靠它放行）。 */
  /* 秒说成人话：界面上输入框按分钟走（用户说的是「这一集几分钟」），但下限是视频平台声明的
     **单段**档位（常常不到一分钟），不足一分钟时照实说秒。整页只有这一份换算。 */
  const durText = sec => { const n = Number(sec) || 0; return n >= 60 ? D.durationMinutes(n) + ' 分钟' : Math.round(n) + ' 秒'; };
  /* 「这一集多长」这个数是谁定的：AI 按剧情改过就必须说是它改的、原来多少 ——
     预演页摆一个陌生的总时长，人只能猜它从哪来。 */
  function durTarget(drama) {
    const o = (drama && drama.opts) || {};
    const now = Number(o.duration) || 0;
    const asked = Number(o.durationAsked) || 0;
    return o.durationBy === 'ai' && asked && asked !== now
      ? 'AI 定的 ' + durText(now) + '（你写的是 ' + durText(asked) + '）'
      : '你要的 ' + durText(now);
  }
  const readOpts = () => {
    const v = id => { const e = $(id); return e ? e.value : ''; };
    const box = $('oManual');
    /* 界面上是分钟、数据里存秒（下游的 wantSec、估算、平台参数全按秒），
       换算与夹取只有一份：D.durationFromMinutes —— 页面不再自己乘 60。
       下拉给的就是秒；只有选到「自定义…」才按分钟框换算一次。 */
    const picked = v('oDur');
    const bounds = D.durationBounds(REG, { videoModel: v('oModel') });
    const duration = picked === 'custom'
      ? D.durationFromMinutes(v('oDurC'), bounds)
      : (Number(picked) || bounds.min);
    return { videoModel: v('oModel'), imgModel: v('oImgModel'), ttsModel: v('oTtsModel'),
      ratio: v('oRatio') || '9:16', res: v('oRes') || '',
      duration: duration,
      roleSource: v('oRole') || 'new',
      /* 只有真选了「从素材库选」才带这份名单：选「全新角色」时把上一次的挑选清掉，
         否则库里的老选择会跟着新剧一起走 —— 界面上写着「全新角色」，AI 拿到的却是那几个人。 */
      libPick: (v('oRole') === 'lib') ? curLibPick.slice() : [],
      manual: !!(box && box.checked) };
  };
  /* 提示条走 ui.js 的全局 window.toast(文本, 类型) —— 本页不再包一层自己的 toast(t, err) */

  async function startStory() {
    const opts = readOpts();
    const story = ($('story') || { value: '' }).value.trim();
    /* 两条合法的路（用户要的「先做前面才能进下一步，但我也想自己排」）：
       · AI 路：写故事 → 文字 AI 拆成角色 / 场景 / 分段
       · 自己排：勾了「我自己排」就不叫 AI 拆，直接进第 2 步，角色 / 场景 / 段落在界面上加
       第 2 步往后照样要过同一道闸门（前置条件：脸 / 声音 / 台词），路不同、要求一样。 */
    if (!story && !opts.manual) {
      return toast('先写几句故事，或点「AI 帮我完善」；想自己排就到「高级设置」勾上「我自己排」', 'err');
    }
    /* 「做下一集」当场建好的那一集还在等故事：落在它上面，别再新建一部 ——
       新建会把带过来的角色与场景丢在原处，界面说的「接着用」就成了空话。 */
    const draft = nextDraft ? D.get(nextDraft) : null;
    nextDraft = '';
    cur = draft || D.newDrama({ opts: opts });
    cur.story = story; cur.opts = Object.assign({}, cur.opts, opts); cur.step = 1;
    save(); D.setActive(cur.id);
    if (opts.manual) {
      cur.step = 2; save(); render();
      toast('手动模式：在第 2 步自己加角色、场景和段落', 'ok');
      return;
    }
    render();
    await runSplit(story);
  }
  /* ═══════════════════════════════════════════════════════════════════
     ✦ AI 帮我完善：与三个工作台的「AI 润色」同位、同一套实现（ui.js 的 InlinePolish.interactive）
     · 结果就地展开在按钮下面那一块 #polishInline，不开新弹窗、不换界面
     · 两段式：先让文字 AI 自己判断该不该反问（不是字数阈值）→ 按回答再写
     · 指令默认文本只有一份（assetlib.js 的 TextAI.DEF.drama_story），设置页⑥能改
     以前这里把 textarea 自己当面板宿主（`$('story')` 的父节点里再找一次 `#story`），
     结果面板画进了输入框里；指令又在页面里抄了一份，设置页改了这边不动。
     ═══════════════════════════════════════════════════════════════════ */
  function paintImproveBtn() {
    const btn = $('btnImprove'); if (!btn) return;
    btn.onclick = async () => {
      const ta = $('story'); if (!ta) return;
      const original = ta.value.trim();
      if (original.length < 2) return toast('先写几个字，再让 AI 帮你完善', 'err');
      if (!TextAI.prov(REG)) return toast('注册路由里没有文字AI提供商', 'err');
      if (!(await TextAI.canRun(REG))) return toast('请先到「设置」填写文字 AI 密钥（或在 .env / 系统环境变量里配置）', 'err');
      const sys = TextAI.prompt('drama_story');
      const host = $('polishInline');
      const run = async (answers, ctl) => ({ after: await TextAI.chatStream(REG,
        sys + (answers ? ' 用户已经回答了你先前的追问，请严格按这些回答来写（人物、冲突、走向都以它为准）：\n' + answers : ''),
        '请把这个故事点子写成能直接拆分镜的短剧梗概：\n' + original,
        /* 完善故事同样是长文本：流式接到 InlinePolish 的流式面板上，边写边显示，
           「停止」也真能把这次请求掐断（signal 一路传到 Net.fetch）。 */
        { signal: ctl && ctl.signal }, ctl && ctl.push) });
      const ask = () => TextAI.askPolish(REG, sys,
        '这是用户写的短剧故事点子：\n' + original
        + '\n\n请针对它提出 2–4 个最影响成片的追问（主角是谁、他/她想要什么、什么拦着、怎么收）。', {});
      btn.disabled = true; btnText(btn, '正在完善…');
      try {
        await InlinePolish.interactive(host, {
          ask: TextAI.shouldAsk() ? ask : null, run, before: original, applyLabel: '用这个版本',
          askTitle: 'AI 想先问几个问题', askIntro: '点一个候选；都不合适就点最后一个「其他」自己写（会原样发给 AI）；没答的按默认理解走',
          onApply: v => { ta.value = v; toast('已换成完善后的故事', 'ok'); },
          onStatus: (text, isErr) => { if (text) toast(text, isErr ? 'err' : 'ok'); },
        });
      } catch (e) {
        InlinePolish.clear(host);
        toast('完善失败：' + (e.message || e), 'err');
      } finally { btn.disabled = false; btnText(btn, 'AI 帮我完善'); }
    };
  }
  function importScript() {
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = '.txt,.md,text/plain';
    inp.onchange = async () => {
      const f = inp.files && inp.files[0]; if (!f) return;
      try {
        const txt = await f.text();
        const el = $('story');
        if (!el) return toast('页面已经切走了，没能把文件放进来', 'err');
        el.value = txt; toast('读进来了：' + f.name);
      } catch (e) { toast('读这个文件失败：' + (e.message || e), 'err'); }
    };
    inp.click();
  }

  async function runSplit(story) {
    cur.step = 1; genSet('split', null, 'AI 导演正在读故事、拆分镜'); render();
    const say = t => genSet('split', null, t);
    /* 流式：文字 AI 一边写分场剧本，画面一边长出来。以前这里只有一句「正在拆分镜」干等十几秒 ——
       看不出它写到第几场、方向对不对，也没法中途停（AbortController 一路传到 Net.fetch）。
       增量**不经过 render()**：整页重绘会把刚收到的字连同面板一起抹掉，逐帧重画也白白卡界面。 */
    const host = $('busyLive');
    const ac = new AbortController();
    const lv = host ? InlinePolish.live(host, { title: 'AI 导演正在写这一集', onStop: () => ac.abort() }) : null;
    try {
      say('拆成分场剧本：谁、在哪、说什么');
      const d = await D.Pipe.splitScript(cur, story, lv && ((p, k) => lv.push(p, k)),
        { signal: ac.signal }, { aiDur: D.aiDurOn() });
      cur = d; save();
      /* 分场剧本已经落成这一集的角色与分段（下一步就能看到），原始文本不再需要占着画面 */
      if (lv) InlinePolish.clear(host);
      /* **文字一落地就进「认角色」**，画脸挪到后台跑：
         以前这里是 `await fillFaces()` 到底 —— 十几秒里用户对着一个转圈的整屏，
         既看不到剧本被拆成了哪几段、也不能先挑已有的脸 / 改外貌，只能干等。
         现在每位角色的脸画完只重画那一张卡，格子里在画的时候是「正在画」的占位。 */
      genClear('split', null);
      cur.step = 2; save(); render();
      /* 拆完先说清「哪几段的台词装不进最短那一档」：平台只声明 4 / 15 秒，
         台词念不完 4 秒的那几段只能拍 15 秒 —— 也就是说后面会拖一整段空镜。
         指令里已经把每档的字数容量告诉 AI 了（`durCharCaps`），但模型不一定照办；
         这一句是留给用户的**选择权**：不去拆也能拍，只是多空几秒。
         判据只有 `D.Pipe.overlongShots` 一份，与真正选档位是同一套算法。 */
      (() => {
        const over = D.Pipe.overlongShots(cur, REG);
        if (!over.length) return;
        const min = over[0].min;
        toast('第 ' + over.map(x => x.no).join('、') + ' 段的台词念不完最短的 ' + min + ' 秒一档，'
          + '只能拍长档（后面会多留空镜）。要更紧凑就把那几段拆开 —— 在第 3 步里改台词或「加一段」。',
          'ok', 9000);
      })();
      /* 脸 → 角色资产 → 场景图一次补齐（都在 fillRest 这一轮里，各画各的那一张卡），
         但**先问一句**：拆剧本只该花文字 AI 那一次钱，紧跟着画 N 张图是另一笔。 */
      askFill('剧本拆好了，接着画图？', '每张单独出一次 · 画完停在「认角色」这一步');
    } catch (e) {
      /* 拆失败就**别往前走**：以前这里无条件 cur.step = 2，用户被扔到一个
         零角色零分段的「认角色」页，而库里留下一部坏档（画脸/配音/拍摄全都无从下手）。
         普通的一集（刚才还是空的）删掉最干净；但「做下一集」那一集身上带着上一集的角色与场景，
         删了就等于把承诺的沿用一起删掉 —— 留着它、清掉半截的分段与故事，
         故事原文还回文本框，改一句再点「开始」仍然落在这一集上。 */
      const bad = cur;
      if (bad.opts && bad.opts.nextOf) { bad.shots = []; bad.story = ''; D.put(bad); nextDraft = bad.id; }
      else { D.remove(bad.id); D.setActive(''); }
      cur = null; genClear('split', null); render();
      const el = $('story'); if (el) el.value = story;
      toast(ac.signal.aborted ? '已经停下（这一集没拆完，故事原文还给你，改一句就能重试）'
        : '拆剧本没成功：' + (e.message || e), ac.signal.aborted ? 'ok' : 'err');
      return;
    }
  }
  /* 「自动补画」分**三路**，各自一个开关（cur.opts.autoFace / autoScene / autoProp，缺省都是自动）：
     · 角色图 = 脸 → 三视图。顺序有讲究：drawCharAsset 必须拿预览图当参考图
       （drama.js 里「先出预览图，再出…」那一抛），所以三视图只能排在脸的后面。
     · 场景图 = 空场景图（无人物，构图留出人物站位）。
     · 道具图 = 物品陈列图（2026-10 从场景那一路里拆出来，给它自己一格）。
     开关的标签写的是它**真画哪几张**（「脸 + 三视图」而不是「画脸」）：
     界面写着 A、后台画 A 和 B，正是这一页一直在修的那种骗人开关。 */
  const AUTO_KEYS = { face: 'autoFace', scene: 'autoScene', prop: 'autoProp' };
  const autoOn = k => cur.opts[AUTO_KEYS[k]] !== false;
  /* 一组「自动 / 手动」开关：label 说清它管哪几张图，title 说切了之后会怎样。 */
  function modeSegHTML(what, label, tip) {
    const on = autoOn(what);
    return `<span class="sw"><span class="ui-hint">${D.esc(label)}</span><span class="ui-seg" title="${D.esc(tip)}">`
      + `<button class="${on ? 'on' : ''}" data-mode="${what}" data-want="auto">自动</button>`
      + `<button class="${on ? '' : 'on'}" data-mode="${what}" data-want="manual">手动</button></span></span>`;
  }
  /* 一件道具**能不能花钱去画**：得先有描述。
     场景名（"便利店卖场"）本身就能画出一张能用的空场景图，道具不行 ——
     默认名是「新道具」，拿它去出图就是花钱买一张跟剧情无关的东西，
     而道具图是**整集每一段都要发**的参考图，画错一件东西等于每一段都错。
     判据只有这一处：fillPlan 数张数、fillProps 决定画不画，都读它。 */
  const propDrawable = p => !!p && String(p.look || '').trim() !== '';
  /* 还缺几张（**只数，不动手**）：底栏那句「要画几张」与补画按钮上的数字都读它，
     两处各数一遍就会出现「写着 5 张、实际画了 6 张」。开关在「手动」的那一类照数不误 ——
     按钮据此不出现，免得点一下什么都不发生。 */
  function fillPlan() {
    const cs = (cur.characters || []).filter(c => c && c.kind !== 'narrator');
    const p = {
      face: cs.filter(c => !c.face).length,
      three: cs.filter(c => c.face && !D.Cast.assetsOfTpl(c, 'three').length).length,
      scene: (cur.scenes || []).filter(x => x && !x.img).length,
      /* 道具（2026-10）有自己一格开关，所以它的缺口是**独立**的一项，不并进 scene。
         数字还要跟 fillProps 的花钱闸一致：**没写描述的不算**（那里不会去画），
         两处口径不一样就是「按钮写着 2 张、实际只画 1 张」。判据是 `propDrawable` 那一处。 */
      prop: (cur.props || []).filter(x => x && !x.face && propDrawable(x)).length,
    };
    p.total = p.face + p.three + p.scene + p.prop;
    return p;
  }
  /* 「这一轮要画几张」**只有这一份判据**（按钮上的数字、fillRest 开工前的「有得画吗」、
     收尾时那句「还有 N 张没画出来」全都读它）。
     what 收窄成只那一路；开关在「手动」的那一路照数不误 —— 所以切到手动时这个数会变 0，
     按钮据此不出现，免得点一下什么都不发生。 */
  function fillScope(what) {
    const q = fillPlan();
    /* 角色那一路的缺口是**两张**：没脸的是脸，已有脸但没三视图的也是它要画的。
       漏掉三视图就是按钮写 3 张、实际发 5 张。 */
    const one = k => (k === 'face' ? q.face + q.three : (q[k] || 0));
    if (AUTO_KEYS[what]) return autoOn(what) ? one(what) : 0;
    return ['face', 'scene', 'prop'].reduce((a, k) => a + (autoOn(k) ? one(k) : 0), 0);
  }
  /* 这一轮**真的会画哪几张**（人话版）—— 「打开页面要不要接着画」那个确认框、
     拆完剧本后那句提示、`fillRest` 里 `genSet` 的底栏文案，全都读这一份。
     三处各数一遍就会出现「确认框写着 3 张、实际发了 5 张」，而用户是在**确认之后**被扣的钱。
     what 的语义与 `fillRest` 一致：undefined/'all' = 所有开着的路。 */
  function fillBits(what) {
    const q = fillPlan();
    const on = k => autoOn(k);
    const pick = k => !what || what === 'all' || what === k;
    const bits = [];
    if (pick('face') && on('face')) {
      if (q.face) bits.push(q.face + ' 张脸');
      if (q.three) bits.push(q.three + ' 张角色资产图');
    }
    if (pick('scene') && on('scene') && q.scene) bits.push(q.scene + ' 张场景图');
    if (pick('prop') && on('prop') && q.prop) bits.push(q.prop + ' 张道具图');
    return bits;
  }
  /* 补画的总入口，**只有一个 flow 记录**（'fill'）：拆完剧本、切开关、
     「把还没画的都画上」、重新打开页面全走它 —— 谁也不许自己再开一轮并发生成。
     what：undefined/'all' / 'face' / 'scene' / 'prop' —— 切某一档开关时只补那一类，
     免得动「画脸」开关就顺手把场景也画一批（那是用户没点的花销）。 */
  async function fillRest(what) {
    if (!cur || genHas('fill', null)) return;   // 已经在补了：不等、不叠
    const wantIt = (k) => (!what || what === 'all' || what === k) && autoOn(k);
    if (!fillScope(what)) {
      /* 一张都不欠：切到「手动」时最常走到这里。要说清是「本来就没有要画的」，
         而不是「刚画过所以不再画」—— 后者会把「开关没生效」的怀疑引到别处。 */
      if (what) toast(autoOn(what) ? '都画好了，没有要补的' : '「手动」：不替你画');
      return;
    }
    const bits = fillBits(what);
    stopFlag = false;
    genSet('fill', null, '要画 ' + bits.join('、') + '（每张单独出一次）');
    try {
      /* 三路**并发跑**（以前是 await fillChars() → await fillScenes()，两张池子中一张
         在等位、另一张才能开工，白白串行一倍）。三条各自走自己的 runPool，三条之间不共享队列，
         角色那张脸画完才接三视图的依赖仍在 `fillChars` 里那份 worker 里保着。 */
      const jobs = [];
      if (wantIt('face')) jobs.push(fillChars());
      if (wantIt('scene')) jobs.push(fillScenes());
      if (wantIt('prop')) jobs.push(fillProps());
      await Promise.all(jobs);
    } finally { genClear('fill', null); }
    if (stopFlag) toast('收到，剩下的没再自动画 —— 每张卡上点一下就能自己挑一张，或切「手动」');
    else {
      const left = fillScope(what);
      if (left) toast('还有 ' + left + ' 张没画出来，每张卡上都写了原因', 'err');
    }
  }
  async function fillChars() {
    /* 「手动」= 不替他画：等用户自己挑一张或上传（以前这个开关只写不读，
       页面上一格「自动/手动」摆在那儿，切了没有任何区别 —— 一个骗人的开关）。
       切到手动时把已经自动画好的留着（不是要撤销，只是别再自动动手）。 */
    if (!autoOn('face')) {
      const w = (cur.characters || []).filter(c => c && c.kind !== 'narrator' && (!c.face || !D.Cast.assetsOfTpl(c, 'three').length))
        .map(c => c.name + (c.face ? ' 的三视图' : ' 的脸'));
      if (w.length) toast('手动模式：' + w.join('、') + '等你挑或上传');
      return;
    }
    /* **一次把这一集缺的脸全部并发提交**（以前是一张一张串行：一张脸 15 秒，5 位角色 75 秒，
       用户看着像「只画了一个就没了」）。三视图只能等自己那位的脸出来才画（`drawCharAsset`
       必须拿预览图当参考图），所以脸与三视图之间保留一条串行依赖，但**角色与角色之间并发**。
       上限 `FILL_CONC` 是按生图平台的常见限流拍的（一次并发太多上游会回 429），
       而不是「一次只发一张」那种看着像卡死的下限。 */
    const todo = (cur.characters || []).filter(c => c && c.kind !== 'narrator');
    await D.Pipe.runPool(todo, FILL_CONC, async (c) => {
      if (stopFlag) return;
      if (!c.face) {
        await genUnit('face', c.id, '正在给「' + c.name + '」画脸…',
          /* 候选有没出全要看 drawPreview 回来的 notes —— 以前这条路径直接把返回值扔了，
             于是「3 张里第 2 张没出成」这种事界面上一个字都没有，用户只会以为
             「它就出了 2 张」或者自己手滑点掉了一张。照实说。 */
          async () => {
            const r = await D.Pipe.drawFace(REG, cur, c);
            c.faceErr = ''; c.candNote = ((r && r.notes) || []).join('；'); save(); paintCastCard(c);
          },
          (e) => { c.faceErr = e || ''; save(); paintCastCard(c); });
      }
      if (stopFlag) return;
      /* 脸出来了**接着画一张「三视图」角色资产**（角色资产是扁平的、名字自己起，
         这里只是默认给新角色备一张最有用的那张）：它是脸之外的正面／侧面／背面全身，
         拍这一段时随脸一起自动进参考图（drama.js 的 planMaterials）——
         只画脸不画它，拍出来的人与脸对不上，那一格的钱就白花了。
         用户自己加的别的资产（表情表 / 服装 / 雨天造型…）不会被这一轮碰到。 */
      if (c.face && !D.Cast.assetsOfTpl(c, 'three').length) {
        await genUnit('asset#three', c.id, '正在画「' + c.name + '」的三视图…',
          /* notes 要落盘：drawCharAsset 会带回「预览图没能发给生图 AI」「这个型号没有参考图槽位」
             这类**警告**（图画出来了、只是可能对不上预览图），界面上按黄条显示（threeMsgHTML）。 */
          async () => {
            const r = await D.Pipe.drawCharAsset(REG, cur, c, 'three');
            c.threeNote = ((r && r.notes) || []).join('；');
          },
          (e) => { c.threeErr = e || ''; save(); paintCastCard(c); });
      }
    });
    await fillVoices();
  }
  /* 画完脸**接着按人设定声音，并当场合成 N 条试听**（2026-10 用户要求）。
     以前定音色是「认角色」之外单独一颗按钮，于是「认完角色、配音还是空的」是常态 ——
     用户走到第 4 步才发现每一位都没声音，而那一步已经在花视频的钱了。
     判据全在 drama.js 的 `Pipe.autoVoice`（`voiceReady` 判「已经配好了就别动」、
     降级原因、`cands: true` 才合成试听），页面只负责报进度与把原因留在这一位身上。
     **旁白也算角色**（`kind === 'narrator'`）：只出声的人反而最需要声音。
     开关是设置里的「让 AI 给角色定音色」（`Drama.SET.aiVoice`，关掉就只画图、声音自己配）。 */
  async function fillVoices() {
    /* `aiVoiceOn` 在 **Drama 顶层**（与 setting / maxTakes / candN 同一组），不是 Pipe ——
       写成 `D.Pipe.aiVoiceOn` 的话这一行直接抛 TypeError，整轮自动定音色连同后面的
       场景补画一起断掉，而报错点在异步回调里，界面上只表现为「声音一直没定上」。 */
    if (!D.aiVoiceOn()) {
      const w = (cur.characters || []).filter(c => c && !D.Cast.voiceReady(REG, cur.opts, c).ok).map(c => c.name);
      if (w.length) toast('「让 AI 给角色定音色」是关的：' + w.join('、') + ' 还没声音，要自己在那张卡上定', 'ok', 5200);
      return;
    }
    /* 缺声音的才走这一轮；角色之间互不依赖（每位的定音色与试听都是独立请求），
       并发上限与生图那边同一份 `FILL_CONC`。 */
    const todo = (cur.characters || []).filter(c => c && c.name && !D.Cast.voiceReady(REG, cur.opts, c).ok);
    if (!todo.length) return;
    await D.Pipe.runPool(todo, FILL_CONC, async (c) => {
      if (stopFlag) return;
      await genUnit('voicecands', c.id, '正在按人设定「' + c.name + '」的声音…',
        async () => {
          const r = await D.Pipe.autoVoice(REG, cur, c, {
            cands: true,
            onStage: m => genSet('voicecands', c.id, m),
            onCands: (i, tot) => genSet('voicecands', c.id, '正在给「' + c.name + '」合成第 ' + i + ' / ' + tot + ' 条试听…'),
          });
          /* 没定成不是错误：这位没定到声音，原因写在他自己那张卡上（voiceErr），
             其余角色照常往下走 —— 一位失败把整轮认角色判死是更糟的表现。 */
          c.voiceErr = r.ok ? '' : (r.why || '');
          c.voiceAuto = r.ok ? (r.label || '') : '';
        },
        () => { save(); paintVoiceRow(c); });
    });
  }
  async function fillScenes() {
    if (!autoOn('scene')) {
      const w = (cur.scenes || []).filter(s => s && !s.img).map(s => s.name);
      if (w.length) toast('手动模式：' + w.join('、') + ' 的场景图等你挑或上传');
      return;
    }
    /* 场景之间互不依赖（每张都是独立的空场景图），一次全并发提交；
       `FILL_CONC` 与角色那边同一份上限，别两边各数一套。 */
    await D.Pipe.runPool((cur.scenes || []).filter(s => s && !s.img), FILL_CONC, async (s) => {
      if (stopFlag) return;
      await genUnit('scene', s.id, '正在画「' + s.name + '」的场景图…',
        async () => { await D.Pipe.drawScene(REG, cur, s); s.imgErr = ''; save(); paintSceneCard(s); },
        (e) => { s.imgErr = e || ''; save(); paintSceneCard(s); });
    });
  }
  /* 道具（2026-10）：**自己一格**开关（`opts.autoProp`）。
     以前跟场景共用那一个，等于「界面上写着『场景图 · 自动』、实际连道具一起画」——
     三件事挤一个开关的结果是想「场景自动、道具自己挑」根本做不到。 */
  async function fillProps() {
    if (!autoOn('prop')) {
      const w = (cur.props || []).filter(p => p && !p.face).map(p => p.name);
      if (w.length) toast('手动模式：' + w.join('、') + ' 的道具图等你挑或上传');
      return;
    }
    /* **没有描述的不画**（花钱闸）。场景名（"便利店卖场"）本身就能画出一张能用的空场景图，
       道具不行：默认名是「新道具」，拿它去出图就是花钱买一张跟剧情无关的图 ——
       而且道具图是**整集每一段都要发**的参考图，画错一件东西等于每一段都错。
       所以这里跳过并把原因写在这一件上（界面上看得见），不静默吞掉。 */
    const todo = (cur.props || []).filter(p => p && !p.face);
    const blank = [];
    todo.forEach(p => {
      if (propDrawable(p)) return;
      blank.push(p.name);
      p.faceErr = '还没写这件是什么样 —— 写一句（或点「✧ AI 优化」替你补），再点「AI 出道具图」';
    });
    if (blank.length) {
      toast(blank.length + ' 件道具没写描述，没去画：' + blank.join('、') + '（写一句就能出图）', 'err');
      todo.forEach(p => paintPropCard(p));
    }
    const real = todo.filter(propDrawable);
    if (!real.length) return;
    await D.Pipe.runPool(real, FILL_CONC, async (p) => {
      if (stopFlag) return;
      await genUnit('prop', p.id, '正在画「' + p.name + '」的道具图…',
        async () => { await D.Pipe.drawPreview(REG, cur, p, { count: 1 }); p.faceErr = ''; save(); paintPropCard(p); },
        (e) => { p.faceErr = e || ''; save(); paintPropCard(p); });
    });
  }
  /* 并发上限：一次同时向生图平台发几张。
     6 是按上游常见的速率限制取的（SparkCine/VGENV 的免费额度都在个位数并发上会被限速），
     再高就会「有 8 张排队、界面上转 8 个圈、其实前 6 张还没画完」那种假繁忙。
     池子本身在数据层（`D.Pipe.runPool`）—— 素材库页「一次出齐这一档」要的是同一件事。 */
  const FILL_CONC = 6;
  /* 配音的并发上限：出预演时「一次把全片配音都提交」（2026-10 用户要求）。
     语音平台的限流一般比生图宽（每段就几句），但也不能一次开满：8 段各 3 句 = 24 个请求同时打过去，
     被打回 429 时**整段配音都失败**，用户看到的是「全片都没声音」而不是「重试一次」。
     4 是两头兼顾的取法；真的被限了，段落条上那一段写着自己的原因。 */
  const DUB_CONC = 4;

  /* ---------- 顶栏 / 底栏 ---------- */
  function renderTop() {
    if (!cur) return;
    top.hidden = false;
    $('dTitle').textContent = cur.title;
    const names = ['讲故事', '认角色', '看预演', '拍成片'];
    /* 能不能进那一步由 Drama.Pipe.stepGate 现算（**只有一份判定**）：
       前面没做完不给跳，但「我自己排」是另一条合法的路。以前这里只写「比当前步数大 2 就灰」，
       跳过去的理由与拦下来的说法都在页面里各写一遍，还漏了前置条件那关。 */
    const gate = no => D.Pipe.stepGate(cur, no, REG);
    stepsEl.innerHTML = names.map((n, i) => {
      const no = i + 1;
      const cls = no === cur.step ? 'on' : (no < cur.step ? 'done' : '');
      const g = gate(no);
      return `<i class="${cls}" data-go="${no}"${g.ok ? '' : ' style="opacity:.4;cursor:not-allowed"'} `
        + `title="${D.esc(g.ok ? n : (g.why || '现在还去不了'))}"><em>${no < cur.step ? '✓' : no}</em>${n}</i>`
        + (i < 3 ? '<span>—</span>' : '');
    }).join('');
    stepsEl.querySelectorAll('i').forEach(el => el.onclick = () => {
      const no = Number(el.dataset.go);
      if (no === cur.step) return;
      const g = gate(no);
      if (!g.ok) {
        /* 拦下来要给出**一条能走的路**：缺脸 / 缺声音直接开前置条件清单（里面就有「去认角色」），
           没有剧本就直接送回第 1 步。只 toast 一句「先完成前面的步骤」人只能干瞪眼。
           2026-10 依用户要求去弹窗：这里不再开模态，改成 toast 说明 + 一键直达那一步；
           顶栏那颗步骤芯片还在原地，按第二次还是同样这条路。 */
        if (g.fix === 2) return showPrereq(g.pre || D.Pipe.prereqs(cur, null, REG));
        toast('现在还去不了「' + names[no - 1] + '」：' + (g.why || '前面的步骤还没做完')
          + ' —— 已经带你去第 ' + (g.fix || 1) + ' 步', 'err');
        cur.step = (g.fix || 1); save(); enterStep(cur.step);
        return;
      }
      /* 回退到第 1 步：那一屏在没有拆分在跑时是 `renderRewound`（只读展示 + 「回到第 N 步」按钮），
         不会重拆、也不会真的开始什么。以前弹一层模态说「不会被重新拆一遍」是多此一举 ——
         现在直接过去，进那一屏再补一句说明（renderRewound 顶部自己会写）。 */
      if (no === 1 && cur.step > 1) {
        const nc = (cur.characters || []).filter(c => c && c.name).length;
        const ns = (cur.scenes || []).filter(s => s && s.name).length;
        const nh = (cur.shots || []).length;
        if (nc || ns || nh) toast('只是回去看故事原文 —— 这一集已经拆过（' + nc + ' 位 / ' + ns + ' 景 / ' + nh + ' 段都在下面），不会重拆');
      }
      cur.step = no; save(); enterStep(no);
    });
  }
  /* 底栏「就地展开的那一块」只有一套机制：前置条件清单 / 成片清单 / 配乐试听 / 旧末帧提醒。
     2026-10 依用户要求去掉弹窗 —— 这四块都是「看一眼、顺手点一下」的东西，弹窗一关，
     人刚才读到的那几行就跟着没了，还得重新点开再找一遍。
     记的是「哪一集的哪一块」：切到别集自动作废（B 集底下挂着 A 集的清单是一句指错地方的假话）。 */
  let panelKind = '', panelFor = '', panelData = null;
  const panelOpen = k => panelKind === k && !!cur && panelFor === cur.id;
  function panelShow(k, data) { panelKind = k; panelFor = cur ? cur.id : ''; panelData = data || null; renderBottom(); }
  function panelToggle(k, data) { if (panelOpen(k)) panelHide(); else panelShow(k, data); }
  function panelHide() { panelKind = ''; panelFor = ''; panelData = null; renderBottom(); }
  /* 每一块自己那一小段 HTML；面板右上角统一给一颗「收起」。 */
  function panelShell(title, inner) {
    return '<div class="dr-panel"><div class="dr-panel-hd"><b>' + title
      + '</b><button class="ghost" id="btnPanelClose" title="收起这一块">'
      + ic('close', 12) + '</button></div>' + inner + '</div>';
  }
  function panelHTML() {
    if (!cur) return '';
    if (panelOpen('bgm')) return panelShell('配乐', bgmPanelHTML(cur));
    if (panelOpen('prereq')) return panelShell('先补 ' + ((panelData.list || []).length) + ' 样东西再开拍', prereqPanelHTML(panelData.list, panelData.acts));
    if (panelOpen('edl')) return panelShell('成片清单', edlPanelHTML());
    if (panelOpen('stale')) return panelShell('这几段接的还是旧末帧', stalePanelHTML(panelData.nos));
    return '';
  }
  const bind$ = (id, fn) => { const el = $(id); if (el) el.onclick = fn; };
  function bindPanel() {
    bind$('btnPanelClose', panelHide);
    if (panelOpen('bgm')) {
      bind$('btnBgmOff', () => { cur.opts.bgm = ''; cur.opts.bgmName = ''; panelHide(); save(); render(); toast('这一集不用配乐（成片里保留视频平台自带的人声）'); });
      bind$('btnBgmChange', () => chooseBgm());
    }
    /* 「去补」那几颗按钮的动作是**调用那一刻**算好的闭包（跳到哪一位角色、哪一段），
       所以随 panelData 一起存着，这里只按序号接线。 */
    if (panelOpen('prereq')) (panelData.acts || []).forEach((a, i) => {
      const el = body.querySelector('[data-pact="' + i + '"]');
      if (el) el.onclick = () => a.go();
    });
    if (panelOpen('edl')) body.querySelectorAll('.dr-edlrow').forEach(row => {
      row.onclick = () => {
        const no = Number(row.dataset.edl);
        const i = (cur.shots || []).findIndex(s => s && s.no === no);
        if (i < 0) return;
        shotIdx = i; takeIdx = 0; render();
        toast('跳到第 ' + no + ' 段');
      };
    });
    /* 两颗动作按钮都**现算**该点哪几段（判据只有 staleChains / edlCheck 那两份），
       不读面板画出来那一刻的快照 —— 面板挂着的时候用户改了选用那条，
       照旧名单去重拍就是替他做了一个他已经不做了的决定。 */
    bind$('btnPanelReshoot', () => {
      const nos = D.Pipe.staleChains(cur).map(s => s.no);
      panelHide();
      if (nos.length) reshootShots(nos, STALE_WHAT);
      else toast('现在没有接旧末帧的段了');
    });
    bind$('btnPanelMissing', () => {
      const missing = (D.Pipe.edlCheck(cur) || {}).missing || [];
      panelHide();
      if (missing.length) showMissing(missing);
      else toast('现在每段都有能进成片的画面了');
    });
  }
  /* 前置条件：每一条自带 `why`（去哪补）与 `fix`（哪一类路），按钮按类别各给一颗 ——
     混在一起时（一位没画脸 + 某段台词空着）只丢一个「去认角色」就永远指不到台词那一条。 */
  function prereqPanelHTML(list, acts) {
    const rows = (list || []).map(x => '<div class="dr-why"><b>' + D.esc(x.who) + ' ' + D.esc(x.label)
      + '</b><br>' + D.esc(x.why) + '</div>').join('');
    const btns = (acts || []).map((a, i) => '<button class="' + (i ? 'ghost' : 'tool') + '" data-pact="' + i + '">'
      + D.esc(a.label) + '</button>').join('');
    return rows + (btns ? '<div class="row">' + btns + '</div>' : '');
  }
  /* 成片清单：渲之前先看「每一段会用上哪一次」，行点一下跳到那一段。
     同一段可能**同时**中两条告诫（选了没拍成的那条、而它又是在改台词之前拍的）——
     按段号覆盖只留后一条，另一种问题就凭空消失了，所以这里按段号累加。 */
  function edlPanelHTML() {
    const edl = D.Pipe.edlCheck(cur);
    const byNo = {};
    for (const w of (edl.warns || [])) byNo[w.no] = byNo[w.no] ? byNo[w.no] + '；' + w.why : w.why;
    /* 「接的还是上一段旧末帧」也摆在同一张表里 —— 它和「选了一条没过的」是同一类问题：
       渲完才发现的话，看到的只是一条有接缝的成片，而那时已经晚了。 */
    const stale = D.Pipe.staleChains(cur);
    const staleByNo = {};
    for (const s of stale) staleByNo[s.no] = '接的还是第 ' + s.prevNo + ' 段'
      + (s.fromNo ? '第 ' + s.fromNo + ' 次' : '') + '的末帧，而它现在用的是第 ' + s.toNo + ' 次';
    const rows = (cur.shots || []).map(sh => {
      const t = curTake(sh);
      const has = !!(t && t.state === 'done');
      const w = [byNo[sh.no], staleByNo[sh.no]].filter(Boolean).join('；');
      return '<div class="dr-edlrow' + (w ? ' warn' : '') + '" data-edl="' + D.esc(sh.no) + '"'
        + ' title="点一下跳到这一段">' + D.esc(sh.title || ('第 ' + sh.no + ' 段'))
        + '<span class="e1">' + (has ? '第 ' + (t.no || '?') + ' 次' : (t ? stateCn(t) : '没拍')) + '</span>'
        + '<span class="e2">' + (has ? Math.round(Number(t.sec) || 0) + ' 秒' : '—') + '</span>'
        + (w ? '<span class="e3">⚠ ' + D.esc(w) + '</span>' : '') + '</div>';
    }).join('');
    const nv = (edl.clips || []).reduce((n, c) => n + ((c.voices || []).length), 0);
    const total = (edl.clips || []).reduce((n, c) => n + (Number(c.out) || 0), 0);
    const head = '<div class="ui-hint">'
      + (edl.missing.length ? '还有 ' + edl.missing.length + ' 段进不了成片（先补齐再导）　·　' : '')
      + (stale.length ? '⚠ ' + stale.length + ' 段接的是上一段旧末帧　·　' : '')
      + ((edl.warns || []).length ? '⚠ ' + edl.warns.length + ' 段有告诫（逐条写在下面每一行）　·　' : '')
      + '共 ' + edl.clips.length + ' 段 · 约 ' + Math.round(total) + ' 秒 · ' + D.esc(edlWhat(cur, nv)) + '</div>';
    const foot = [];
    if (edl.missing.length) foot.push('<button class="ghost" id="btnPanelMissing">看缺哪 ' + edl.missing.length + ' 段</button>');
    if (stale.length) foot.push('<button class="tool" id="btnPanelReshoot">重拍这 ' + stale.length + ' 段</button>');
    return head + (rows || '<div class="ui-hint">还没有分段</div>') + (foot.length ? '<div class="row">' + foot.join('') + '</div>' : '');
  }
  /* 旧末帧：只报不拦（接不接得上由用户定），但得给一条能直接重拍的路。 */
  function stalePanelHTML(nos) {
    const stale = D.Pipe.staleChains(cur);
    return '<div class="dr-why">第 ' + D.esc((nos || []).join('、')) + ' 段现在选用的那一条，接着的是'
      + D.esc(stale[0] && stale[0].prevNo ? '第 ' + stale[0].prevNo + ' 段' : '上一段')
      + '重拍之前的那一版。成片里人物的姿态会在这些地方对不上。'
      + '<br>重拍它们就会重新接上现在这一版（每一段各拍一条，会留在拍片记录里）。</div>'
      + '<div class="row"><button class="tool" id="btnPanelReshoot">重拍这 ' + ((nos || []).length) + ' 段</button></div>';
  }
  function renderBottom() {
    if (!cur || cur.step < 2) { bottom.hidden = true; return; }
    bottom.hidden = false;
    const spoken = Math.round(D.Pipe.spokenSec(cur));
    const want = cur.opts.duration || 60;
    const diff = want - spoken;
    const tgt = durTarget(cur);
    /* 分辨率 / 单段时长**按视频平台自己的声明**显示：两家视频平台声明的是
       480p/768p/960p/1080p 与 4/15 秒，页面写「720p · 每段 8 秒」是骗人 —— 拍出来是别的东西。
       要带上 videoModel：不传就默认取第一个视频模型，用户选了第二个时这一行报的是别家的档位。 */
    const caps = D.Pipe.videoCaps(REG, { videoModel: cur.opts.videoModel, ratio: cur.opts.ratio, res: cur.opts.res, wantSec: (cur.shots || [])[0] ? cur.shots[0].wantSec : 8 });
    /* 「开始拍」是**整集连拍**，它那道闸门按整集算 —— 这一处对。
       但底栏提示原来也只用整集粒度，而用户在这一屏的工作单元是**当前这一段**（右栏就是它的详情）：
       盯着第 1 段时却报「巴塔、哈鲁 还没画脸」，而那两位在这一段根本不出场；
       点「拍这一段」走的是**段粒度**（下面 shootOne 那道闸门），其实一点没被拦。
       提示与按钮说的不是一回事 = 用户被引着去做不需要做的事。
       所以分两份算：**这一段**缺的摆红条（那才是他现在要补的），
       整集里另外缺的另摆一条次要的（只影响「开始拍」），两者都没有才轮到时长那一行。 */
    const preAll0 = (cur.step >= 3) ? D.Pipe.prereqs(cur, null, REG) : [];
    const shNow = (cur.shots || [])[shotIdx] || null;
    const preNow0 = (cur.step >= 3 && shNow) ? D.Pipe.prereqs(cur, shNow, REG) : [];
    /* 「还没配语音接口」这句话**只有能力声明回来之后才能说**：在那之前 `ttsWays` 会落到
       `mode:'none'` 那个兜底分支，于是加载期页面报的是「你没配语音平台」——
       而你其实配了，用户什么都没做错（实测过：能力一回来，同一条就从「还没配语音接口」
       变成「还没定音色」了，中间那一瞬是句假话）。`paintOpts` / `paintSecs` 早就各为这件事
       留过一道闸（一个不画下拉、一个不写数），底栏这条当时漏了，现在补上 ——
       **只有依赖能力的那一条**（key:'voice'）要压住，缺脸 / 台词空不依赖，照常显示。
       这是显示层的闸，不是另立一套判据：真正的判据仍然只有 `D.Pipe.prereqs` 那一份。 */
    const capPending = !capsReady;
    const hideVoice = xs => (capPending ? xs.filter(x => x.key !== 'voice') : xs);
    const preAll = hideVoice(preAll0);
    const preNow = hideVoice(preNow0);
    const voicePending = capPending && (preAll0.length > preAll.length || preNow0.length > preNow.length);
    const pre = preAll;                       // 按钮那一处仍按整集（它确实是整集连拍）
    const btns = [];
    /* 「停下」不再只在第 4 步出现：现在画脸 / 出预演也是后台一段一段派的活，
       正在跑的时候没有中止入口，人只能干等它整轮跑完。摆不摆见下面 stopWant()。 */
    const stopBtn = () => '<button class="ghost" id="btnStop">' + ic('stop', 13) + ' 停下</button>';
    if (cur.step === 2) btns.push('<button class="tool acc" id="btnToPreview">下一步：看预演 →</button>');
    if (cur.step === 3) {
      btns.push('<button class="tool acc' + (pre.length ? ' dr-dim' : '') + '" id="btnShoot"'
        /* 变暗不等于点不动：点一下照样进，先把还缺什么列出来并给出路（showPrereq）。
           title 只写「前置条件还没齐」的话，人只会以为按钮坏了。 */
        + (pre.length ? ' title="还缺东西 —— 点一下会逐条列出来，并直接给出去补的路"' : '') + '>开始拍</button>');
      /* 「重拍没成的」只在真有那种段的时候才摆：一排常驻按钮里放一个多数时候没用的入口，
         等于每次都让人先判断它现在能不能点。「开始拍」只管**还没拍过**的段，
         拍过但没拍成的（平台报错、素材没送上去）那几段以前只能一段段点「再重拍」，一段一次确认。 */
      const bad = failedShots();
      if (bad.length) {
        btns.push('<button class="ghost" id="btnReshootBad" title="把拍过但没拍成的那几段各重拍一次">'
          + ic('refresh', 13) + ' 重拍没成的 ' + bad.length + ' 段</button>');
      }
    }
    if (cur.step === 4) {
      btns.push(bgmBtn(cur));
      btns.push(exportToggles(cur));
      if (cur.finalVideo) {
        /* 成片是不是「按现在这份数据渲出来的」：对不上就明说它是旧的并给一条重新导出。
           以前只要 finalVideo 非空，这个位置就永远是下载按钮 —— 重拍过、改过台词、
           动过配音/字幕开关，界面照样递给你一份旧成片，一个字都不提示。 */
        const fresh = D.Pipe.renderSpec(cur, REG).stamp === cur.finalStamp;
        btns.push('<button class="tool acc" id="btnDlVideo"'
          + (fresh ? '' : ' title="这一份是上次导出的，已经和你现在的段落对不上了 —— 重新导出一次"') + '>'
          + ic('download', 14) + '<span class="tx">下载成片</span></button>'
          + '<button class="ghost" id="btnPlayFinal"' + (fresh ? '' : ' disabled title="这是旧的一份成片，先重新导出"') + '>'
          + ic('play', 12) + ' 预览成片</button>'
          + '<button class="ghost" id="btnDlSrt">下载字幕</button>'
          + '<button class="ghost" id="btnNext">' + ic('plus', 13) + ' 做下一集</button>');
        if (!fresh) {
          btns.push('<button class="tool" id="btnReExport" title="按现在的段落重新渲一版（会占用本机 ffmpeg）">'
            + ic('refresh', 14) + ' 重新导出</button>');
          btns.push('<span class="ui-note err">这一份成片是旧的 —— 拍过或改过之后没重导</span>');
        }
        /* 角色与场景还在这一集里：下一集要重新画图、定音色，存进素材库才能「下一集直接选」。
           存的动作只有一个入口 —— 第 2 步那一句「把本集角色与场景存进素材库」（用户刚认完角色、紧接着就要存）。
           这里原来还挂了一个一模一样的「都存进素材库」，而它只在**成片已经出来之后**才出现：
           那时候人都不知道自己在第 4 步了，一个入口藏得比没有还难用。 */
        const miss = (cur.characters || []).filter(c => c && !c.inLib);
        const missS = (cur.scenes || []).filter(s => s && !s.inLib);
        const missP = (cur.props || []).filter(p => p && !p.inLib);
        if (miss.length || missS.length || missP.length) {
          const names = miss.map(c => c.name).concat(missS.map(s => s.name)).concat(missP.map(p => p.name));
          btns.push('<span class="ui-hint">' + D.esc(names.join('、')) + '（共 ' + names.length + ' 条）还没存进素材库</span>');
        }
      } else {
        /* 导出前先把「进不了成片的段」摆出来 —— 静默跳过的后果是成片少了那几段、
           而下载的字幕里还有它们的台词，字幕和画面对不上比直接报错更难查。 */
        const edl = D.Pipe.edlCheck(cur);
        const miss = edl.missing;
        const nv = (edl.clips || []).reduce((n, c) => n + ((c.voices || []).length), 0);
        btns.push('<button class="tool acc' + (miss.length ? ' dr-dim' : '') + '" id="btnExport"'
          + ' title="' + D.esc(miss.length ? '有 ' + miss.length + ' 段还进不了成片' : edlWhat(cur, nv)) + '">'
          + ic('download', 14) + '<span class="tx">导出整集</span></button>');
      }
      /* 成片清单：**每段用哪一次**这件事在别处根本看不见（段条只写「已选用」，
         右栏芯片也不写次数），用户只能在拍片记录里一段段点过去对。
         渲一次要几十秒，渲完才发现「第 5 段用的是那次没拍成的」就晚了。
         这一张表就是给渲之前核对的：段号 / 标题 / 用第几次 / 时长 / 该段的告诫。 */
      btns.push('<button class="ghost" id="btnEdl" title="渲之前先看一遍：每一段会用上哪一次拍摄">清单</button>');
      const wLines = (D.Pipe.edlCheck(cur).warns || []).filter(w => w.kind === 'lines');
      if (wLines.length) {
        btns.push('<span class="ui-note">⚠ 第 ' + D.esc(wLines.map(w => w.no).join('、'))
          + ' 段拍完之后改过台词，成片里说、烧的仍是原来那几句（点「清单」看是哪几段）</span>');
      }
      /* 「接的还是上一段旧末帧」同理常驻一条：它不会自己变好（只有重拍才修得了），
         而渲完才看出来的话，看到的只是一条有接缝的成片。 */
      const staleNow = D.Pipe.staleChains(cur);
      if (staleNow.length) {
        btns.push('<span class="ui-note">⚠ 第 ' + D.esc(staleNow.map(s => s.no).join('、'))
          + ' 段接的是上一段旧末帧（点「清单」里那条可以直接重拍）</span>');
      }
    }
    /* 剧本（.txt）：**第 3、4 步都给**，因为最想拿它的时候正是「还没开拍、想先改一改台词」那会儿 ——
       等到第 4 步才想起来，成片已经渲完了。纯读，不提交任务、不碰平台，所以不走 genWhy。
       摆放与「清单」同一排（两个都是「动手之前先看清楚」的动作），不另开一行。 */
    if (cur.step === 3 || cur.step === 4) {
      btns.push('<button class="ghost" id="btnScript" title="把角色表、场景表和每段的画面/台词/镜头导成一份纯文本（拿去改、拿去配音、存一份底）">'
        + ic('docTab', 13) + ' 剧本</button>');
    }
    /* 「停下」摆不摆，看 stopWant 一处算出来的判据（paintStatus 与这里共用同一个）：
       判据是「表里有东西」而不是「有整轮在跑」—— 画脸是逐角色的单份任务，正是要能中止的那种。 */
    if (stopWant()) btns.push(stopBtn());
    /* 顶上那条提示只说**这一集现在最该知道的一件事**，其余的去右栏看 ——
       以前这里同时挂着「台词比目标短 X 秒」「每段 1 条」「重拍最多 N 次」「自动/手动怎么工作」四句话，
       真正要动手的那条（前置条件不齐）反而不在。 */
    /* 「哪几段进不了成片」「上一次导出为什么没成」必须**留在底栏**，不能只靠一句四秒就消失的 toast：
       这两件事发生时用户看到的就是「点了导出，没反应」，而原因早就算出来了（`pendingMissing`
       与 `lastRenderErr`），以前只存不给看 —— 等于把答案写进了一个没人读的变量里。 */
    const whyBox = (cur.step === 4 && pendingMissing && pendingMissingFor === cur.id && pendingMissing.length)
      ? '<div class="ui-note err">有 ' + pendingMissing.length + ' 段还进不了成片，所以这一次没渲：'
      + pendingMissing.map(m => '<div class="dr-miss"><b>第 ' + (m.no || '?') + ' 段</b><span>' + D.esc(m.why || '没有可用的画面') + '</span></div>').join('')
      + '<button class="ghost" id="btnMissClear">知道了</button></div>'
      : '';
    const errBox = (cur.step === 4 && lastRenderErr && lastRenderErrFor === cur.id)
      ? '<div class="ui-note err">上一次导出没成功：' + D.esc(lastRenderErr)
      + '　按「导出整集」可以再试一次。<button class="ghost" id="btnErrClear">知道了</button></div>'
      : '';
    const txtOf = xs => xs.map(x => D.esc(x.who) + ' ' + D.esc(x.label)).join('；');
    /* 差集要按**角色名**逐个剔，不能按整行留/留：整集里 voice 那一行是「巴塔、哈鲁、旁白」，
       而这一段只缺旁白 —— 整行比会把它原样留在第二条里，同一件事在两条提示里各报一次。
       所以是**拆名字、剔掉这一段已经报过的、再拼回一行**（`who` 在 prereqs 里两处输出时都已 join 过）。 */
    const inNow = new Set(preNow.flatMap(x => String(x.who || '').split('、').map(s => s.trim()).filter(Boolean)));
    const restNow = [];
    for (const x of preAll) {
      const left = String(x.who || '').split('、').map(s => s.trim()).filter(n => n && !inNow.has(n));
      if (left.length) restNow.push(Object.assign({}, x, { who: left.join('、') }));
    }
    /* 这条提示原来只有一句「补好就能拍这一段」，没告诉人**到哪去补** ——
       而数据层每条 prereq 都带着可执行的那半句（`why`，例如「到设置页填一个语音平台的密钥」）
       与一个 `fix`（'settings' / 'cast' / 'shot'）。那些话在 `showPrereq` 里说全了，
       而那条路是**点「开始拍」**进去的（按钮只是加了 .dr-dim 变暗，并没有 disabled，点得动）。
       不指路的话，用户看到「变暗的开始拍」只会以为坏了。
       这里不复述 `why`（会变成同一件事说两遍、且两遍可能对不上），只说明路怎么走。 */
    const howToFix = preAll.some(x => x.fix)
      ? '　点下面「开始拍」会逐条列出来，并直接给出去补的路（缺什么去哪一步、缺语音接口去哪一页）。' : '';
    const note = (voicePending
        ? '<div class="ui-hint">正在读平台能力声明…「声音」那一项要等它回来才判得准，先不报缺。</div>'
        : '')
      + (preNow.length
        ? `<div class="ui-note err">⚠ 第 ${shNow.no} 段还缺：${txtOf(preNow)} —— 补好就能拍这一段。${D.esc(howToFix)}</div>`
        : '')
      + (restNow.length
        ? `<div class="ui-note">整集里另有 ${txtOf(restNow)} —— 底栏「开始拍」是整集连拍，会被这些挡住（单段拍不受影响）。</div>`
        : '')
      || (preAll.length ? '' : `<div class="ui-hint">${D.esc('台词排下来约 ' + spoken + ' 秒，' + (diff > 2
        ? '比' + tgt + '短 —— 拍多少秒就是多少秒，不拿空镜凑时长'
        : '接近' + tgt))}${(caps.ok && caps.line) ? '　·　' + D.esc(caps.line) : ''}</div>`);
    bottom.innerHTML = `${whyBox}${errBox}${note}${panelHTML()}<div class="row">
      <span class="status"><span class="spin" id="stSpin"${GEN.size ? '' : ' hidden'}></span><span id="stxt">${D.esc(genLine() || statusOf(cur))}</span></span>
      <span class="sp"></span>
      ${btns.join('')}</div>`;
    const bind = (id, fn) => { const el = $(id); if (el) el.onclick = fn; };
    bindPanel();
    bind('btnMissClear', () => { pendingMissing = null; renderBottom(); });
    bind('btnErrClear', () => { lastRenderErr = null; renderBottom(); });
    /* 底栏这几个都是「会再开一次生成」的入口：正在跑别的一轮时点它，等于同一批素材生成两次
       （= 花两次钱），所以先问流水线、把原因说出来，而不是照做。 */
    bind('btnToPreview', () => { const w = genWhy('preview', null); if (w) return toast(w, 'err'); toPreview(); });
    /* 开拍前的前置条件与流水线闸门**只在 shootAll 里判一次**：这里原来又判一遍，
       两份实现迟早会对不上（而且这一份里 showPrereq 的那弹窗点「去认角色」会先离开页面，
       回来时这一段已经白按了一次）。 */
    bind('btnShoot', () => { shootAll(); });
    bind('btnReshootBad', () => { reshootFailed(); });
    bind('btnStop', () => { stopFlag = true; toast('收到，不再派新活了（已经在跑的那一项会做完）'); });
    /* 拦「进不了成片的段」只在 exportFinal 里做一处 —— 以前这里自己弹一次、
       exportFinal 里又判一次，两份实现两套说法（这里还把「去拍」写成跳到第 4 步，其实该回第 3 步）。 */
    bind('btnExport', () => { exportFinal(); });
    bind('btnEdl', () => { showEdl(); });
    bind('btnScript', () => { exportScript(); });
    bind('btnReExport', () => { exportFinal(); });
    /* 成片下载走公共层：Wb.save 先判 HTTP 状态再存，代理把 .renders 里的旧文件清掉之后
       返回 404 —— 以前是 window.location.href 直跳，浏览器静默失败，界面一句提示都没有，
       用户只看到「点了没反应」。 */
    bind('btnDlVideo', async () => {
      const b = $('btnDlVideo'); if (b) { b.disabled = true; btnText(b, '下载中…'); }
      try {
        await Wb.save(D.Pipe.renderDl(cur.finalVideo), (cur.finalName || '成片') + '.mp4');
      } catch (err) {
        toast('成片没下下来：' + ((err && err.message) || err)
          + ' —— 代理只留最近 20 部成片，这一份可能已经被清掉了。按「重新导出」再渲一次。', 'err', 7000);
      } finally { if (b) { b.disabled = false; btnText(b, '下载成片'); } }
    });
    /* 预览成片：渲完几十秒却看不到自己那片子，非得先下到磁盘再打开 ——
       「字幕和画面对不对得上」根本没法当场验。走公共灯箱，地址用代理那条支持 Range 的 /render/play。 */
    bind('btnPlayFinal', () => {
      if (!cur.finalVideo) return toast('还没有成片', 'err');
      const name = (cur.finalName || '成片') + '.mp4';
      Wb.lightbox.open({ src: '/render/play?name=' + encodeURIComponent(cur.finalVideo), name: name, kind: 'video' },
        [{ src: '/render/play?name=' + encodeURIComponent(cur.finalVideo), name: name, kind: 'video' }]);
    });
    bind('btnDlSrt', () => downloadSrt());
    bind('btnBgm', () => {
      if (!cur.opts.bgm) { chooseBgm(); return; }
      panelToggle('bgm');
    });
    bind('btnDub', () => { cur.opts.dub = cur.opts.dub === false; save(); renderBottom(); });
    bind('btnSub', () => { cur.opts.sub = cur.opts.sub === false; save(); renderBottom(); });
    bind('btnNext', () => nextEpisode());
  }
  /* 导出成片时的两个开关。字幕与逐句配音**本来就都会烧进去**（不是新加的功能），
     这里给的是「这一次要不要」。它们只裁送给代理的 EDL：
     预演照旧是画面 + 配音 + 字幕，下载的 SRT 也照旧是完整台词。 */
  function exportToggles(c) {
    const dub = c.opts.dub !== false, sub = c.opts.sub !== false;
    return '<button class="tool' + (dub ? ' on' : '') + '" id="btnDub"'
      + ' title="' + (dub ? '成片里会混进这几句配音，同时压掉视频平台自带的人声（点一下关掉：改用平台原声）'
                          : '这次只用视频平台自带的人声，不混逐句配音（点一下改回）') + '">配音：' + (dub ? '开' : '关') + '</button>'
      + '<button class="tool' + (sub ? ' on' : '') + '" id="btnSub"'
      + ' title="' + (sub ? '台词会烧进画面（点一下只导出字幕文件，不烧进画面）'
                          : '这次不烧字幕，只出干净画面（台词随时能单独下载 SRT）') + '">字幕：' + (sub ? '开' : '关') + '</button>';
  }
  /* 导出按钮上那句实话：这次到底会带进去什么（以前写死「N 句配音」，关掉开关就成了假话） */
  function edlWhat(c, nv) {
    const parts = [];
    parts.push(c.opts.dub !== false ? nv + ' 句配音' : '用视频平台自带的人声');
    parts.push(c.opts.sub !== false ? '台词烧进画面' : '不烧字幕');
    if (c.opts.bgm) parts.push('混入配乐');
    return '这次会带上：' + parts.join(' · ');
  }
  /* 配乐：参考产品那条「拍完自动出成片（含配乐）」。
     混音在代理里做（`/render` 的 bgm：原声压到 0.35 与配乐 amix，配乐自动循环），
     页面只管选哪一段 —— 别自己合成，那是 ffmpeg 的活。
     「已经选了」之后那一小块（试听 + 换一段 + 不用它）走底栏的就地展开面板，不开弹窗：
     就三行东西，弹窗一关还得重新找位置；而试听本来就是「点一下听一下」，糊在模态里最碍事。 */
  function bgmBtn(c) {
    const b = c.opts.bgm, open = panelOpen('bgm');
    return '<button class="ghost' + (open ? ' on' : '') + '" id="btnBgm" title="'
      + (b ? (open ? '收起这一段' : '点开这一段：试听 / 换一段 / 不用它') : '选一段配乐，导出时混进去') + '">'
      + ic('music', 13) + ' 配乐' + (b ? '：' + D.esc((c.opts.bgmName || '已选').slice(0, 10)) : '：未设') + '</button>';
  }
  function bgmPanelHTML(c) {
    return '<div class="dr-bgmcur">已选：' + D.esc(c.opts.bgmName || '已选音频') + '</div>'
      + '<audio controls preload="none" src="' + D.esc(Api.mediaSrc(c.opts.bgm)) + '" class="dr-bgmaudio"></audio>'
      + '<div class="ui-hint">导出时会自动循环铺满整集，原声压低到 35% 与它混音。</div>'
      + '<div class="row"><button class="ghost" id="btnBgmOff">不用配乐</button>'
      + '<button class="tool" id="btnBgmChange">换一段</button></div>';
  }
  async function chooseBgm() {
    const got = await AssetPicker.open({ types: ['音频'], multiple: false, limit: 1, title: '选一段配乐',
      upload: { accept: 'audio/mpeg,audio/wav,audio/mp4,audio/aac' },
      note: '导出整集时自动循环铺满，原声压低到 35% 与它混音' });
    if (!got || !got.length) return;
    const it = got[0];
    /* 这一条要是没有可用的字节来源，就**照实说没选上** —— 原来照样存成空串并弹一句
       「配乐选好了」，用户以为铺了配乐，成片里却还是原声。 */
    const src = it.src || it.dl || '';
    if (!src) return toast('这一条没有可用的音频地址，没能选上 —— 换一条试试', 'err');
    cur.opts.bgm = src;
    cur.opts.bgmName = it.prompt || it.name || '配乐';
    save(); toast('配乐选好了：' + cur.opts.bgmName.slice(0, 16)); render();
  }
  /* `c` 真的会是 null：**拆剧本失败的收尾路径**就是 `cur = null; genClear('split', null)`，
     而 `paintStatus` 那行是 `el.textContent = t || statusOf(cur)` —— GEN 一清空 `t` 就是空串，
     于是正好落到 `statusOf(null)`。以前这里直接读 `c.shots`，抛 TypeError，
     而这个异常发生在那句「拆剧本没成功：…」的 toast **之前** ——
     失败现场被自己的收尾吃掉了：用户只看到一个永远转圈的「AI 导演正在写这一集」，
     等多久都不会有结果，也永远等不到那句原因。
     这一层是纯显示，读不到就返回空串、不抛 —— 抛异常轮不到它说话。 */
  function statusOf(c) {
    if (!c) return '';
    const n = (c.shots || []).length, done = (c.shots || []).filter(s => s.chosen).length;
    if (!n) return '还没有分镜';
    if (c.step <= 2) {
      /* 道具要在这里一起报数：用户认下了道具，状态栏却只说角色与场景，
         界面上说的与真正发生的对不上（「我加了道具，它怎么不知道」）。 */
      const p = (c.props || []).filter(x => x).length;
      return '分镜拆好了 · ' + (c.characters || []).length + ' 个角色 · ' + (c.scenes || []).length + ' 个场景'
        + (p ? ' · ' + p + ' 件道具' : '');
    }
    if (c.step === 3) return '预演在本机合成，按「开始拍」才会生成视频';
    return '共 ' + n + ' 段 · ' + done + ' 段已选用';
  }
  let stopFlag = false;

  /* ---------- 步骤 2：认角色 ---------- */
  function renderCast() {
    body.className = 'dr-body';
    body.innerHTML = `<div class="dr-cast">
      <h2>认角色 · 这一部的人
        ${modeSegHTML('face', '脸 + 三视图',
          '自动：拆完剧本立刻用生图平台给每个角色画脸，再拿这张脸当参考图接着画三视图'
          + '（两张都会随这一段自动进视频 AI 的参考图）／手动：两样都不自动画，等你自己挑一张或上传')}
      </h2>
      <div class="tip">每个角色挑一张预览图、一个声音；拍的时候自动用上。场景那一栏只要图。</div>
      ${cur.opts.roleSource === 'lib' ? (() => {
        const hit = (cur.characters || []).filter(c => c && c.inLib);
        const miss = (cur.characters || []).filter(c => c && !c.inLib);
        const hitS = (cur.scenes || []).filter(s => s && s.inLib);
        const hitP = (cur.props || []).filter(p => p && p.inLib);
        return `<div class="ui-note info">选了「从素材库选」：${
          hit.length ? '对上了 <b>' + hit.map(c => D.esc(c.name)).join('、') + '</b>（预览图与音色直接用库里的）' : '一个角色都没对上'
        }${hitS.length ? '；场景对上 <b>' + hitS.map(s => D.esc(s.name)).join('、') + '</b>' : ''
        }${hitP.length ? '；道具对上 <b>' + hitP.map(p => D.esc(p.name)).join('、') + '</b>' : ''
        }${miss.length ? '；库里没有 <b>' + miss.map(c => D.esc(c.name)).join('、') + '</b>，可以在下面的「素材库」里补' : ''}</div>`;
      })() : ''}
      <div class="dr-h">角色 ${(cur.characters || []).length} 个
        <button class="ui-linkbtn" id="btnAddChar">+ 手动加一个角色</button>
        <button class="ui-linkbtn" id="btnAiVoice"${(!D.aiVoiceOn() || genHas('aivoice', null)) ? ' disabled' : ''}
          title="${D.esc(D.aiVoiceOn()
            ? '按每个人的人设与外貌，分别决定这一位怎么出声：有本人参考音频的走复刻，其余写一段音色描述或从平台预设里挑一个'
            : '设置页里关掉了「让 AI 给角色定音色」，打开它才能用')}"
          >${ic('sparkles', 14)} 让 AI 给每位角色定声音</button></div>
      <div id="aiVoiceOut">${aiVoiceSumHTML()}</div>
      <div id="castList"></div>
      <div class="dr-h">场景 ${(cur.scenes || []).length} 个
        ${modeSegHTML('scene', '场景图', '自动：拆完剧本立刻给每个场景画一张空场景图（无人物，构图留出人物站位）／手动：不自动画，等你自己挑一张或上传')}
        <button class="ui-linkbtn" id="btnAddScene">+ 加一个场景</button></div>
      <div id="sceneList"></div>
      <div class="dr-h">道具 ${(cur.props || []).length} 件
        ${modeSegHTML('prop', '道具图', '自动：拆完剧本立刻按描述给每件道具画一张物品图（没有脸可照）／手动：不自动画，等你自己挑一张或上传')}
        <button class="ui-linkbtn" id="btnAddProp">+ 加一件道具</button></div>
      <div class="tip" style="margin-top:-10px">道具图<b>每一段拍摄都作为参考图发出去</b>，名字与描述也进每一段的提示词 —— 剧情里那件关键物品（信、手机、那把伞）认下来，后面每段才对得上。</div>
      <div id="propList"></div>
      ${(() => {

    body.querySelectorAll('[data-mode]').forEach(b => b.onclick = async () => {

    $('btnAddScene').onclick = () => {

    $('btnAddProp').onclick = () => {

    const bsa = $('btnSaveAllChars');

      const what = [...new Set(stale.flatMap(x => x.what))];

  /* 音色胶囊 / 声音那一块 / 资产键名表 / 声波条 / 「能不能试听」都在 drama.js 的 Drama.Cast

  const AK = D.Cast.ASSET_KINDS;
  /* 灯箱的翻页范围：这一部里所有已画好的图（点开一张能左右翻着看）。

     而这一份以前只遍历 `characters` —— 场景的图在灯箱里找不到自己，

  function assetItems() {
    const out = [];
    for (const c of (cur && cur.characters) || []) {
      if (!c) continue;

         多张时只能看到其中一张（`assetsOf` 是唯一读入口，老字典它会现算）。 */
      for (const a of D.Cast.assetsOf(c)) out.push({ src: a.src, name: c.name + ' · ' + D.Cast.assetName(a) });
    }
    for (const s of (cur && cur.scenes) || []) {
      if (!s) continue;
      if (s.img) out.push({ src: s.img, name: s.name + ' · 预览图' });
      for (const a of D.Cast.assetsOf(s)) out.push({ src: a.src, name: s.name + ' · ' + D.Cast.assetName(a) });
    }
    return out;
  }
  /* ---------- 认角色：脸那一列 / 资产那一行各自成函数 ----------
     画脸与画三视图都是**逐位**完成的后台活，每完成一位只重画这一块。

     `imgCandCap`（一次能出几张 = 生图型号声明的 max_outputs）2026-10 随候选排一起删掉了：

  /* 「再画 N 张」那颗按钮的张数：**判据在 drama.js 的 `Pipe.candCount`**（设置值与这个生图型号

     上游只让出一张」或者用户把设置调到 8、按钮还写着 3。 */
  const candCount = (id) => Math.max(1, Number(D.candCount(REG, cur && cur.opts, id)) || 1);
  /* 一次出 N 张的那颗按钮。`o.wait` 是在生成中（占位格已经画出来了，入口仍然留着但禁用：

  /* 「一次出 N 张」那颗按钮。`o.wait` 是在生成中（占位格已经画出来了，入口仍然留着但禁用：
     整排只剩一个转圈看着就像「这个功能没了」）。文案按真实张数现算。
     **第一个参数是「哪一类」（face / img / prop），它会原样写进 `data-kind`** ——

     2026-10 踩过：这一格原来叫 `(id, act, dis, extra)`，把**设置键**（`candN`，算张数用的）

  function moreCandsHTML(kind, act, dis, settingId) {
    const n = candCount(settingId || 'candN');
    return `<button class="ui-linkbtn" data-act="${D.esc(act)}" data-kind="${D.esc(kind || '')}"${dis ? ' disabled' : ''}>`

  /* 「出图」那颗按钮的文案：**只有这一份**（整页渲染与定点重画共用）。

     放在这里（三个 *HTML 模板之前）是因为它们都要读它，const 晚定义会踩 TDZ。 */
  const redrawLabel = { face: c => (c.face ? '按新外貌重画脸' : 'AI 画脸'),
    scene: s => (s.img ? '换图' : 'AI 出场景图'), prop: p => (p.face ? '换图' : 'AI 出道具图') };
  /* 脸那一列：大图是在用的那张，下面一排是候选。
     一次出 N 张（N = 设置里的「候选张数」，再夹生图型号声明的上限），
     出完挑一张「用这一张」，原来的还留在这一排里可以换回去。 */
  function faceColHTML(c) {
    if (c.kind === 'narrator') return '<div class="big">只出声<br>不出镜</div>';
    const waiting = genHas('face', c.id);
    const n = candCount();
    return `<div class="big" data-act="pickface">${c.face ? `<img src="${D.esc(Api.mediaSrc(c.face))}">`
        : (waiting ? waitHTML('脸正在画\n好了会自动出现') : '还没画脸<br>点一下挑一张')}</div>`
      + (waiting || !c.faceErr ? '' : `<div class="ui-note err">画脸失败：${D.esc(c.faceErr)}</div>
          <button class="ui-linkbtn" data-act="retryface">再试一次</button>`)
      /* 候选没出全的实话（2026-10 补）：以前一次出 N 张是一条提示词 + count:N，
         出来 N 张几乎一模一样；改成每张一条不同提示词之后，偶尔会有某一张没成。
         那种情况以前一个字都不说 —— 界面少一格，用户只当是自己点掉了。 */
      + (waiting || !c.candNote ? '' : `<div class="ui-note">${D.esc(c.candNote)}</div>`)

      + (waiting ? `<div class="ui-cands"><span class="lab">候选脸</span>${D.Cast.waitHTML('正在出 ' + n + ' 张')}${moreCandsHTML('face', 'candgen', true)}</div>`

  /* 角色资产：**一个扁平的列表**，任意种类、不限张数，每张自己一个名字 + 一组关联道具。

        + `<button class="th-x" data-act="assetdel" data-aid="${D.esc(a.id)}" data-label="${D.esc(lab)}" title="去掉这一张${D.esc(lab)}">${D.esc('×')}</button></div>`;

    /* 出图表单：**一次只填一遍**（名字 / 模板 / 自定义描述），点「AI 出这一张」发一次。
       模板默认第一个（三视图），选「自定义」时下面那行才有用 —— 两者的关系写在标签上，
       不是让用户去猜。 */
    const genRow = `<div class="ui-cands"><span class="lab">加一张角色资产</span>`

      + `<input class="ui-inp" data-act="assetwhat" data-cid="${D.esc(c.id)}" maxlength="60" placeholder="选「自定义」时写清楚要画什么，例：雨天造型、侧脸特写">`
      + `<button class="ghost mini" data-act="assetgen" data-cid="${D.esc(c.id)}">AI 出这一张</button>`
      + `<button class="ui-linkbtn" data-act="assetadd" data-cid="${D.esc(c.id)}">＋ 自己传一张</button>`
      + '</div>';
    /* 每一张一行：名字（可就地改）+ 关联道具 + 重出这一张 + 去掉。

    const rows = list.length ? '<div class="ui-assets">' + list.map(a => {
      const lab = D.Cast.assetName(a);
      const opts = libProps.map(p => `<label class="ck sm" title="这一张图上带着「${D.esc(p.name)}」"><input type="checkbox" data-act="assetprop" data-aid="${D.esc(a.id)}" data-pid="${D.esc(p.id)}"${(a.propIds || []).includes(p.id) ? ' checked' : ''}>${D.esc(p.name)}</label>`).join('');

        + `<span class="ui-cand"><img src="${D.esc(Api.mediaSrc(a.src))}" data-act="zoom" data-src="${D.esc(a.src)}" data-name="${D.esc(c.name + ' · ' + lab)}" alt=""></span>`
        + `<input class="ui-inp" data-act="assetrename" data-cid="${D.esc(c.id)}" data-aid="${D.esc(a.id)}" maxlength="24" value="${D.esc(lab)}" title="这一张叫什么（改了立刻存）">`
        + (busy ? `<span class="ui-hint sm">正在出…</span>`

        + `<button class="ui-linkbtn" data-act="assetdel" data-cid="${D.esc(c.id)}" data-aid="${D.esc(a.id)}" data-label="${D.esc(lab)}">去掉</button>`

  /* 资产那一格自己的说明。失败与警告分两种语气：前者压根没画出来（红），

    const parts = [];
    for (const a of D.Cast.assetsOf(c)) {
      if (genHas('asset#' + a.id, c.id)) continue;

    if (!genHas('asset#three', c.id) && c.threeErr) {

        <button class="ui-linkbtn" data-act="gencand" data-kind="three">再试一次</button></div>`);
    }

  function castHTML(c) {

      <div class="info">
        <div class="nm">${D.esc(c.name)}<span class="sp"></span>
          <button class="ghost mini" data-act="lib"${c.inLib ? ' disabled title="已经在素材库里了"' : ''}>${c.inLib ? '已在素材库' : '存进素材库'}</button>
          <button class="ui-linkbtn" data-act="rename">改名</button>
          <button class="ui-linkbtn dr-del" data-act="delchar">从这一集删掉</button></div>
        <div class="bio">${D.esc(c.bio || '')}</div>
        ${/* 旁白**不画外貌那一格**（用户要求）：旁白只出声、不出镜，
           外貌既不会发出去（拍片时不出现在这一段的参考图里），也不可能拿它去画脸 ——
           摆一个填了也没人用的输入框在那里，是最典型的「界面在骗人」。
           人设（上面那行 bio）要留着：它进文字 AI，是这一位念稿的底子。
           ⚠ 这段说明必须写在模板串**外面**：写在 ${} 之间的块注释不是注释，
             它会被原样渲染到 bio 那一格里（踩过一次，截图里整段斜体说明挂在旁白的简介位置上）。
           ⚠⚠ 注释里**一个字都不能有反引号**：它在模板串内部，反引号会当场把模板串闭合，
             后面全部变成代码 → 整页脚本语法崩 → 白屏 + 满屏源码当正文（那次白屏就是它）。 */
          isN ? '' : `<label>外貌</label>

        <div class="acts">
          <button class="ui-linkbtn" data-act="aiopt">${ic('sparkles', 12)} AI 优化</button>

  /* 场景图那一列：与脸同一套（候选排 + 「再画 N 张」）—— 场景与角色走同一个 drawPreview，

  function sceneFaceHTML(s) {

  function sceneHTML(s) {

       名字改过了也只是这一集里的显示 —— 库里那一份要一起改（见 bindSceneCard 的 rename）。 */
    return `<div class="dr-card2" data-sid="${s.id}">
      <div class="face narrow">${sceneFaceHTML(s)}</div>
      <div class="info">
        <div class="nm">${D.esc(s.name)} <span class="dr-sel sm"><select data-act="time" title="时段：进这一段的画面提示词，也决定氛围">${D.Cast.timeOptsHTML(s)}</select></span><span class="sp"></span>
          <button class="ghost mini" data-act="lib"${s.inLib ? ' disabled title="已经在素材库里了"' : ''}>${s.inLib ? '已在素材库' : '存进素材库'}</button>

  /* ---------- 道具（2026-10，与角色 / 场景平级的第三种类型） ----------
     一张卡只有四样东西：图（点一下自己挑 / AI 出）、描述、存进素材库、删掉。
     没有时段（时段说的是「这个空间的光线」，道具不占空间）、没有声音（东西不会说话）、

  function propFaceHTML(p) {
    const waiting = genHas('prop', p.id);
    const n = candCount();
    return `<div class="big" data-act="pickprop">${p.face ? `<img src="${D.esc(Api.mediaSrc(p.face))}">`
        : (waiting ? waitHTML('道具图\n正在画') : '还没画<br>道具图')}</div>`
      + (waiting || !p.faceErr ? '' : `<div class="ui-note err">道具图没画出来：${D.esc(p.faceErr)}
          <button class="ui-linkbtn" data-act="retryprop">再试一次</button></div>`)
      + (waiting || !p.candNote ? '' : `<div class="ui-note">${D.esc(p.candNote)}</div>`)
      + (waiting ? `<div class="ui-cands"><span class="lab">候选道具图</span>${D.Cast.waitHTML('正在出 ' + n + ' 张')}${moreCandsHTML('prop', 'candgen', true)}</div>`
        : D.Cast.picCandsHTML(p.faces, p.face, { act: 'usecand', label: '候选道具图', name: p.name,
            extra: ' data-kind="prop"', tail: moreCandsHTML('prop', 'candgen', false) }));

  function propHTML(p) {
    return `<div class="dr-card2" data-pid="${p.id}">
      <div class="face narrow">${propFaceHTML(p)}</div>
      <div class="info">
        <div class="nm">${D.esc(p.name)}<span class="sp"></span>
          <button class="ghost mini" data-act="lib"${p.inLib ? ' disabled title="已经在素材库里了"' : ''}>${p.inLib ? '已在素材库' : '存进素材库'}</button>
          <button class="ui-linkbtn" data-act="rename">改名</button>
          <button class="ghost" data-act="redraw">${redrawLabel.prop(p)}</button>
          <button class="ui-linkbtn dr-del" data-act="delprop">从这一集删掉</button></div>
        <textarea data-act="look" placeholder="这件东西是什么样、剧情里用来干什么（出图就靠这一句）">${D.esc(p.look || '')}</textarea>
        <div class="acts"><button class="ui-linkbtn" data-act="aiopt">${ic('sparkles', 12)} AI 优化</button></div>
        <div class="ui-hint">拍每一段时，这张图都会作为参考图发给视频 AI，名字与描述也进这一段的提示词。</div>
