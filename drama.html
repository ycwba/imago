  /* 定点重画一张卡：换掉「会随生成变化」的那几块，再把这一张卡重新接线。
     换的**只有**图、资产行与那颗按钮的文案（判据见上面的 redrawLabel）——
     外貌/描述文本框一个字都不动。
     找不到这张卡（已经切到别的步骤）就什么都不做 —— 数据在 cur 里，下一次整页重画自然带上。 */
  function paintCastCard(c) {
    const card = body.querySelector('.dr-card2[data-cid="' + c.id + '"]'); if (!card) return;
    const face = card.querySelector('.face'); if (face) face.innerHTML = faceColHTML(c);
    const row = card.querySelector('.dr-assets .row'); if (row) row.innerHTML = assetRowHTML(c);
    const rb = card.querySelector('[data-act="redraw"]'); if (rb) rb.textContent = redrawLabel.face(c);
    bindCastCard(card, c);
  }
  function paintSceneCard(s) {
    const card = body.querySelector('.dr-card2[data-sid="' + s.id + '"]'); if (!card) return;
    const face = card.querySelector('.face'); if (face) face.innerHTML = sceneFaceHTML(s);
    const rb = card.querySelector('[data-act="redraw"]'); if (rb) rb.textContent = redrawLabel.scene(s);
    bindSceneCard(card, s);
  }
  function paintPropCard(p) {
    const card = body.querySelector('.dr-card2[data-pid="' + p.id + '"]'); if (!card) return;
    const face = card.querySelector('.face'); if (face) face.innerHTML = propFaceHTML(p);
    const rb = card.querySelector('[data-act="redraw"]'); if (rb) rb.textContent = redrawLabel.prop(p);
    bindPropCard(card, p);
  }
  function bindCast() {
    body.querySelectorAll('[data-cid]').forEach(card => {
      const c = (cur.characters || []).find(x => x.id === card.dataset.cid); if (!c) return;
      bindCastCard(card, c);
    });
  }
  /* 跑一次「只作用在某一份素材上」的生成：记账并把占位画出来 → 跑 → 撤账并重画那一块。
     这四步以前在各处手写（paintBusy2 只做了前两步，重画仍然是整页 render），
     漏掉哪一步的表现都不一样：要么能连点两次白花一次钱，要么画好了界面不动。 */
  async function genUnit(kind, id, msg, fn, repaint) {
    genSet(kind, id, msg); if (repaint) repaint('');
    let err = '';
    try { await fn(); } catch (e) { err = (e && e.message) || String(e); }
    /* repaint 要拿到 err：以前它只管重画，而各处的回调顺手写 `c.faceErr = ''`
       （那是「开始新一轮」的清理动作），于是失败时错误刚写上就被自己清掉 ——
       finally 先重画、toast 后弹，中间没有留给界面把原因留住的地方，
       最后只剩一闪而过的一句，用户根本不知道哪一位、因为什么没画成。 */
    finally { genClear(kind, id); if (repaint) repaint(err); }
    if (err) toast(err, 'err');
    return !err;
  }
  /* genRun = 闸门 + genUnit。**已经过了闸门的那一轮**（出预演、批量拍）里再调 genRun
     会被自己那条整轮记录拦住（genWhy 见 flow 就返回原因），所以内层一律用 genUnit。 */
  async function genRun(kind, id, msg, fn, repaint) {
    const why = genWhy(kind, id); if (why) { toast(why, 'err'); return false; }
    return genUnit(kind, id, msg, fn, repaint);
  }
  /* ---------- 候选排的两件事：再画 N 张 / 换用某一张 ----------
     角色脸、场景图、道具图、三视图这四处结构完全一样（候选都攒在 `x.faces` / `x.assetCands.three`，
     都摆在一张卡上，选中的那张另外存一个字段），所以**一份实现 + 一张字段表**。
     四处各写一遍就一定有一处忘了把张数传出去，表现是「界面写着出 3 张、实际只出了 1 张」——
     而这个错自己不会暴露：数据层照样出了图，只是多出来的被扔掉了。 */
  const CANDK = {
    face: { bus: 'face', lab: '脸', err: 'faceErr', gen: (x) => D.Pipe.drawPreview(REG, cur, x, {}),
      got: x => x.face, set: (x, v) => { x.face = v; }, repaint: c => paintCastCard(c) },
    img: { bus: 'scene', lab: '场景图', err: 'imgErr', gen: (x) => D.Pipe.drawPreview(REG, cur, x, {}),
      got: x => x.img, set: (x, v) => { x.img = v; }, repaint: s => paintSceneCard(s) },
    prop: { bus: 'prop', lab: '道具图', err: 'faceErr', gen: (x) => D.Pipe.drawPreview(REG, cur, x, {}),
      got: x => x.face, set: (x, v) => { x.face = v; }, repaint: p => paintPropCard(p) },
  };
  /* 资产**不再进 CANDK**：那套「每一类一个候选排」是按类别分的界面，
     与「一张图一个名字」的扁平角色资产冲突（见 assetRowHTML）。
     现在出图走那一行自己的表单（`assetgen`），换一张走「重出这一张」（`assetregen`），
     记账键是 `asset#<资产 id>`。留着这三行的话就是第二份实现：
     界面上没有对应的东西，却仍能通过 genMoreCands 改数据。 */
  /* 「再画 N 张」：出一次新的候选，**不动已经选中的那张**（不传 replace）——
     挑还没挑就被人换掉，比「只能一次出一张」更糟。三视图返回的 notes 同样要落盘
     （「预览图没能发给生图 AI」是警告不是失败，红黄两条提示分别有各自的读处）。 */
  async function genMoreCands(x, kind) {
    const k = CANDK[kind];
    /* 认不出是哪一类就**说出来**，别静默 return。
       2026-10 这一行原来是 `if (!k) return;`：按钮把设置键 `candN` 当成 kind 发了过来，
       于是每一次点「再画 N 张候选」都在这里悄悄退出 —— 没请求、没提示、状态行不动，
       界面看上去像平台没回话，而真因是参数名挤在了一个属性上（见 moreCandsHTML）。 */
    if (!k) { toast('「再画候选」没接上：传过来的是「' + (kind || '空') + '」，不是脸 / 场景 / 道具', 'err'); return; }
    const n = candCount();
    await genRun(k.bus, x.id, '正在给「' + x.name + '」出 ' + n + ' 张' + k.lab + '候选…',
      async () => {
        const r = await k.gen(x);
        /* 候选出没出全要照实说。`kind === 'three'` 是角色资产那条路（三视图的 notes 落在
           threeNote 上，界面按黄条显示）；脸 / 场景 / 道具走的是 candNote —— 以前这里只处理
           three，于是「3 张里第 2 张没出成」在界面上一个字都没有。 */
        const notes = ((r && r.notes) || []).join('；');
        if (kind === 'three') x.threeNote = notes;
        else if (notes) { x.candNote = notes; toast('出了 ' + (r.n || 0) + ' / ' + (r.want || '?') + ' 张：' + notes, 'err', 6000); }
        else x.candNote = '';
      },
      (e) => { x[k.err] = e || ''; save(); k.repaint(x); });
  }
  /* 「用这一张」：只换在用的那个字段，候选本身留着（换回去不用再花钱）。
     换参考图**不会**回头改已经拍好的段 —— 每一段的参考图是提交那一刻发出去的，
     所以照实告诉用户「要生效得重拍」，不能让他以为整片都变了（也不能悄悄替他重拍，那是花钱动作）。 */
  function useCand(x, kind, src) {
    const k = CANDK[kind]; if (!k || !src) return;
    k.set(x, src);
    save(); k.repaint(x);
    toast('这一位现在用这张。已经拍过的段还是旧参考图，要生效得重拍那一段', 'ok', 4200);
  }
  const castCard = c => body.querySelector('.dr-card2[data-cid="' + c.id + '"]');
  const sceneCard = s => body.querySelector('.dr-card2[data-sid="' + s.id + '"]');
  const propCard = p => body.querySelector('.dr-card2[data-pid="' + p.id + '"]');
  /* 外貌 / 场景描述写完只把文本框的内容顶掉：整页 render 会连光标一起抹掉，
     而人多半正想在这条描述上接着改两个字。正在敲这一格时不动它（数据已存，下次整页重画自然带上）。 */
  function paintText(card, field, val) {
    const ta = card && card.querySelector('textarea[data-act="' + field + '"]');
    if (!ta || ta === document.activeElement) return;
    ta.value = val || '';
  }
  function bindCastCard(card, c) {
    const look = card.querySelector('textarea[data-act="look"]');
    if (look) bindText(look, v => { c.look = v; saveSoon(); });
    /* 音色描述（design 型号）是输入框：边写边存，不点别的地方也不丢。
       它带 data-act，但走的是 oninput，不参与下面那圈点击动作（否则点一下输入框等于触发一个空动作）。 */
    const vn = card.querySelector('[data-act="voicenote"]');
    if (vn) bindText(vn, v => { c.voiceNote = v; saveSoon(); });
    /* 角色资产那一行的三个输入：名字 / 模板 / 自定义描述。
       它们只是**填**的，按钮点下去时才读 —— 所以不进下面那圈点击动作
       （进去的话点一下输入框就等于触发一个空动作）。
       「改名」那格走 `onchange`（敲完离开输入框才存）：走 onclick 的话，
       用户改完名字直接点「去掉」，存的是还没改的那一份。 */
    const tplSel = card.querySelector('[data-act="assettpl"]');
    const whatIn = card.querySelector('[data-act="assetwhat"]');
    if (tplSel && whatIn) {
      const syncWhat = () => {
        const custom = tplSel.value === 'custom';
        whatIn.disabled = !custom;
        whatIn.placeholder = custom ? '写清楚要画什么，例：雨天造型、侧脸特写' : '（只有选「自定义」时才用这一格）';
      };
      tplSel.onchange = syncWhat; syncWhat();
    }
    card.querySelectorAll('[data-act="assetrename"]').forEach(inp => {
      inp.onchange = () => {
        const nm = String(inp.value || '').trim();
        const a = D.Cast.assetById(c, inp.dataset.aid);
        if (!a) return;
        if (!nm) { inp.value = D.Cast.assetName(a); toast('名字不能是空的：这是角色资产，没名字就分不清是哪一张', 'err'); return; }
        if (nm === D.Cast.assetName(a)) return;
        D.Cast.setAssetName(c, a.id, nm); save();
        toast('这一张改叫「' + nm + '」', 'ok');
        paintCastCard(c);
      };
    });
    card.querySelectorAll('[data-act]:not([data-act="zoom"]):not([data-act="voicenote"]):not([data-act="assetrename"]):not([data-act="assetname"]):not([data-act="assetwhat"]):not([data-act="assettpl"])').forEach(el => el.onclick = async () => {
      const act = el.dataset.act;
      try {
        if (act === 'pickface') {
          await genRun('face', c.id, '正在挑这一位的脸…', async () => {
            const got = await AssetPicker.open({ types: ['图片'], multiple: false, limit: 1, title: '选一张脸' });
            if (got && got[0]) { c.face = got[0].src; save(); }
          }, () => paintCastCard(c));
        } else if (act === 'retryface') {          await genRun('face', c.id, '正在重试画「' + c.name + '」的脸…', () => D.Pipe.drawFace(REG, cur, c, { count: 1, replace: true }),
            (e) => { c.faceErr = e || ''; save(); paintCastCard(c); });
        }
        /* 候选排那两个动作（脸 / 三视图）：字段表在上面的 CANDK，一份实现。 */
        else if (act === 'candgen') { await genMoreCands(c, el.dataset.kind || 'face'); }
        else if (act === 'usecand') { useCand(c, el.dataset.kind || 'face', el.dataset.src); }
        else if (act === 'redraw') {
          /* 已经有脸时**不必先清空**再去画：`drawPreview` 加了 `replace` 就是为了这个 ——
             以前靠 `c.face = ''` 让数据层认「还没有图」，于是这一格在画之前先闪成空白，
             画失败就只剩一张空卡（原来那张脸没了）。 */
          paintCastCard(c);
          await genRun('face', c.id, c.face ? '正在重画「' + c.name + '」的脸…' : '正在画「' + c.name + '」的脸…',
            () => D.Pipe.drawFace(REG, cur, c, { count: 1, replace: true }),
            (e) => { c.faceErr = e || ''; save(); paintCastCard(c); });
        }
        else if (act === 'aiopt') {
          await genRun('aiopt', c.id, 'AI 正在把外貌写细…', async () => {
            /* 指令在 assetlib.js 的 `TextAI.DEF.drama_look`（设置页「拍短剧 · 设定补写」那一类里能改）。
               以前这段提示词直接写死在这里：用户改不到、设置页列不出来、页面一改文案别处就不知道。
               占位符填充走 `D.Pipe.fillTpl`（drama.js 里那一份，不在页面里再写一个 replace）。 */
            c.look = await TextAI.chat(REG, D.Pipe.fillTpl(TextAI.prompt('drama_look'), {
              name: c.name, bio: c.bio || '', look: c.look || '',
            }), (c.look || c.bio || c.name) + '\n风格：' + (D.Pipe.episodeStyle(cur) || ''), {});
          }, () => { save(); paintText(castCard(c), 'look', c.look); });
        }
        else if (act === 'lib') {
          if (c.inLib) { if (libWrite(Object.assign({}, c, { id: c.libId || c.id }))) toast('已更新素材库里的这一条'); }
          else { D.Lib.adopt(cur, c.id); toast('存进素材库了'); }
          save();
          const b = card.querySelector('[data-act="lib"]');
          if (b) { b.textContent = '已在素材库'; b.disabled = true; b.title = '已经在素材库里了'; }
        }
        else if (act === 'rename') { await charInfo(c); }
        /* 传 el（就是那个「从这一集删掉」按钮）—— 会丢资产/音色时走 Confirm.choose，
           那个分支用不上 btn（它得给选择，按钮武装只能显示一行字）；不会丢时才原地武装。 */
        else if (act === 'delchar') { await delChar(c, el); }
        else if (act === 'play') await previewCharVoice(c);
        else if (act === 'voice') {
          c.voice = el.dataset.vid; c.voiceName = D.Cast.voiceName(REG, cur.opts, c.voice, c.voiceMode); save(); paintVoiceRow(c);
        }
        /* 这一位用哪种方式定声音：只有这一家真有对应型号时这一排才会出现（D.Cast.voiceWaySeg 现算） */
        else if (act === 'voiceway') {
          const w = D.Pipe.setVoiceWay(REG, cur.opts, c, el.dataset.way);
          c.voiceBy = '';
          /* 换方式时把**用不上的那套**清掉：以前只重算 voiceName，c.voice / c.voiceNote / c.refAudio
             全留着。于是「预设音色」切到「写声音描述」、描述又空着时，voiceReady 判据里那个
             `|| c.voice` 会拿上一个型号的音色 id 当成「已经配好了」→ 前置条件全绿、第 4 步放行，
             配音时把 style:'' 加旧 id 一起发给另一个型号，出来的人声完全不可控。
             清掉之后判据与真实链路就对上了：没描述就是没配好。 */
          if (w.mode !== 'preset') c.voice = ''; else { c.voiceNote = ''; }
          if (w.mode !== 'clone') { c.refAudio = ''; c.refAudioName = ''; }
          c.voiceName = D.Cast.voiceName(REG, cur.opts, c.voice, w.mode);
          save(); paintVoiceRow(c);
          if (w.fellback) toast('这个平台没有「' + D.Cast.wayLabel(el.dataset.way) + '」的型号，这位现在按「' + D.Cast.wayLabel(w.mode) + '」出声', 'err');
        }
        /* 音色复刻的参考音频：一个入口（资产库 / 收藏 / 本机上传都在统一选择器里）。
           能收哪些类型、单文件多大，现读这个语音型号的能力声明，不在页面里写死。 */
        else if (act === 'refaudio') {
          const rr = D.Cast.refAudioRule(REG, cur.opts);
          await genRun('refaudio', c.id, '正在读这段参考音频…', async () => {
            const got = await AssetPicker.open({ types: rr.types, multiple: false, limit: 1, title: '给「' + c.name + '」选一段参考音频',
              rule: rr.rule, upload: rr.upload });
            if (!got || !got.length) return;
            const it = got[0];
            const b = it.file || await Net.blob(it.dl || it.src, { timeout: 120000 });
            if (rr.rule.maxBytes && b.size > rr.rule.maxBytes) {
              throw new Error('参考音频太大：上限 ' + Math.round(rr.rule.maxBytes / 1048576) + ' MB');
            }
            await D.Pipe.saveRefAudio(c, b, (it.prompt || it.name || '参考音频').slice(0, 20));
            save(); toast('参考音频挂上了，可以试听', 'ok');
          }, () => paintVoiceRow(c));
        }
        else if (act === 'refclear') {
          await D.Pipe.clearRefAudio(c); save(); paintVoiceRow(c);
        }
        /* 声音候选：一次合成几条试听（预设那一位挑一条=真的换音色；
           描述 / 复刻那一位没有音色清单，那一排里压根不给「用这一条」—— 见 D.Cast.voiceCandsHTML）。 */
        else if (act === 'revoice') {
          /* 失败后重试：清掉上一轮的原因（否则界面继续挂着它，尽管 AI 可能已经定成了），
             判据与 fillVoices 同走 `Pipe.autoVoice`，不另写一份。 */
          await genUnit('voicecands', c.id, '正在按人设定「' + c.name + '」的声音…',
            async () => {
              const r = await D.Pipe.autoVoice(REG, cur, c, {
                cands: true,
                onStage: m => genSet('voicecands', c.id, m),
                onCands: (i, tot) => genSet('voicecands', c.id, '正在给「' + c.name + '」合成第 ' + i + ' / ' + tot + ' 条试听…'),
              });
              /* `voiceReady` 判「已经配好了就别动」：这一位刚试过一次可能是好的，
                 那时 autoVoice 会原样返回 —— 当成失败重试却什么都没变，就是「点了没反应」。 */
              if (!r.ok) { c.voiceErr = r.why || '没定成'; c.voiceAuto = ''; save(); }
            },
            () => { c.voiceErr = c.voiceErr || ''; save(); paintVoiceRow(c); });
        }
        else if (act === 'vgen') {
          const n = Math.max(1, Number(el.dataset.n) || 2);
          /* 要看返回值：voiceCands 逐条合成、哪几条挂了就记在哪一条上，返回 { made, failed, err }。
             以前这里 await 完就丢：出了 3 条挂 2 条时，界面只剩 1 条能播，
             用户以为「这个型号只出 1 条」，于是反复点这一下 —— 一次又一次地花钱。 */
          let made = 0, failed = 0, err = '';
          await genRun('voicecands', c.id, '正在给「' + c.name + '」出 ' + n + ' 条试听…',
            async () => {
              const r = await D.Pipe.voiceCands(REG, cur.opts, c, {
                onStep: (i, tot, nm) => genSet('voicecands', c.id,
                  '正在出「' + c.name + '」第 ' + i + ' / ' + tot + ' 条' + (nm ? '（' + nm + '）' : '') + '…')
              });
              made = r.made || 0; failed = r.failed || 0; err = r.err || '';
            },
            () => { save(); paintVoiceRow(c); });
          if (failed) toast('出了 ' + made + ' 条，' + failed + ' 条没出来：' + (err || '原因不明')
            + ' —— 换一家语音平台或改短一点再试', 'err', 7000);
        }
        else if (act === 'vplay') {
          /* 播本机已经存着的那一段：不再合成、不再花一次，所以不问那一句 */
          const r = await D.Cast.playAsset(el.dataset.src);
          if (r.why) toast(r.why, 'err');
        }
        else if (act === 'vclone') {
          /* 拿这一条**已经生成**的音频去做复刻（用户要求：同一个角色下次可以用之前生成的声音）。
             判据与改数据全在数据层 `Pipe.cloneFromCands` 一处 —— 页面上直接写
             `c.refAudio = …` 会漏掉「清掉预设音色 id」那一句，
             于是两份配置同时成立，配音取哪一份变成看运气。 */
          const r = D.Pipe.cloneFromCands(REG, cur.opts, c, el.dataset.src, el.dataset.name);
          if (!r.ok) { toast(r.why, 'err'); return; }
          save(); paintVoiceRow(c);
          toast('这一位以后按「' + r.name + '」这个声音念（复刻），下一集拉进去也是它', 'ok', 6000);
        }
        else if (act === 'vuse') {
          c.voice = el.dataset.vid; c.voiceName = el.dataset.vname || D.Cast.voiceName(REG, cur.opts, c.voice, c.voiceMode);
          save(); paintVoiceRow(c);
          toast('这一位以后按「' + (c.voiceName || c.voice) + '」念', 'ok');
        }
        /* 补画那一轮的「三视图」按钮（`gencand` 只剩这一处入口了 ——
           界面上不再有「三视图 / 表情表 / 服装」三颗分栏的按钮，见 assetRowHTML）。
           按能力声明兜一道：万一旧标记里还留着别的模板，点下去要有一句明确的话，
           而不是静悄悄出一张没人认领的图。 */
        else if (act === 'gencand') {
          const k = el.dataset.kind;
          if (!D.Cast.assetTplsOf(c).includes(k)) { toast('这一类已经不出图了：现在能选的是 ' + D.Cast.assetTplsOf(c).map(x => D.Cast.assetLabel(c, x)).join('、')); return; }
          const lab = D.Cast.assetLabel(c, k) || k;
          await genRun('asset#three', c.id, '正在给「' + c.name + '」出' + lab + '…',
            () => D.Pipe.drawCharAsset(REG, cur, c, k, { count: 1 }), () => { save(); paintCastCard(c); });
        }
        /* 「AI 出这一张」：名字 / 模板 / 自定义描述三样都从**那一行**里读（`data-cid` 指着角色），
           读的是表单上的值而不是按钮上的 —— 按钮只带一个角色 id。
           空名字留空即可，落库时用模板名（`drawCharAsset` 里兜底），不替用户编一个。 */
        else if (act === 'assetgen') {
          const box = el.closest('.ui-cands') || document;
          const nm = (box.querySelector('[data-act="assetname"]') || {}).value || '';
          const tpl = (box.querySelector('[data-act="assettpl"]') || {}).value || 'three';
          const what = (box.querySelector('[data-act="assetwhat"]') || {}).value || '';
          if (!what.trim() && tpl === 'custom') { toast('选「自定义」要写清楚要画什么，例：雨天造型、侧脸特写', 'err'); return; }
          const lab = nm.trim() || D.Cast.assetLabel(c, tpl) || '资产';
          await genRun('asset#new:' + tpl + ':' + (nm.trim() || what.trim()).slice(0, 20), c.id,
            '正在给「' + c.name + '」出' + lab + '…',
            () => D.Pipe.drawCharAsset(REG, cur, c, tpl, { count: 1, name: nm.trim(), what: what.trim() }),
            () => { save(); paintCastCard(c); });
        }
        /* 「重出这一张」：照着**同一张**的模板与名字再出一张，换掉它。
           用 `replaceId` 指着具体那一张 —— 不指的话就是新增一张，界面上看着像没反应。 */
        else if (act === 'assetregen') {
          const a = D.Cast.assetById(c, el.dataset.aid);
          if (!a) { toast('这一张已经不在了', 'err'); paintCastCard(c); return; }
          const lab = D.Cast.assetName(a);
          await genRun('asset#' + a.id, c.id, '正在给「' + c.name + '」重出' + lab + '…',
            () => D.Pipe.drawCharAsset(REG, cur, c, a.tpl, { count: 1, name: lab, replaceId: a.id }),
            () => { save(); paintCastCard(c); });
        }
        /* 「＋ 自己传一张」：落进**扁平的资产列表**，名字取表单上写的那个（没写就用模板名）。 */
        else if (act === 'assetadd') {
          const box = el.closest('.ui-cands') || document;
          const nm = (box.querySelector('[data-act="assetname"]') || {}).value || '';
          const tpl = (box.querySelector('[data-act="assettpl"]') || {}).value || 'custom';
          const got = await AssetPicker.open({ types: ['图片'], multiple: false, limit: 1, title: '给「' + c.name + '」加一张角色资产' });
          if (got && got[0]) { D.Cast.addAsset(c, { name: nm.trim(), tpl: tpl, src: got[0].src }); save(); paintCastCard(c); }
        }
        /* 去掉资产里的**这一张**（资产是列表，去掉的是某一张而不是整类） */
        else if (act === 'assetdel') {
          const aid = el.dataset.aid; if (!aid) return;
          const lab = el.dataset.label || D.Cast.assetName(D.Cast.assetById(c, aid)) || '这一张';
          if (Confirm.arm(el, '确认去掉' + lab, { note: '这一张会从「角色资产」里拿掉；已经拍好的段不受影响（每一段的参考图是提交那一刻发出去的）' })) return;
          D.Cast.removeAsset(c, aid);
          save(); paintCastCard(c);
        }
        /* 关联道具：这一张图上带着哪几件（多选：同一张图可能同时带风衣和围巾） */
        else if (act === 'assetprop') {
          const a = D.Cast.assetById(c, el.dataset.aid);
          if (!a) { toast('这一张已经不在了', 'err'); paintCastCard(c); return; }
          const pid = el.dataset.pid, now = (a.propIds || []).slice();
          const i = now.indexOf(pid);
          if (el.checked) { if (i < 0) now.push(pid); } else if (i >= 0) now.splice(i, 1);
          D.Cast.setAssetProps(c, a.id, now);
          save();
          /* 不重画整卡：勾一下就把正在画的那张脸闪掉了。只更新那一行说明。 */
          const box = el.closest('.ui-proprow');
          if (box) {
            const names = now.map(x => ((cur.props || []).find(p => p && p.id === x) || {}).name).filter(Boolean);
            const hint = box.parentElement && box.parentElement.querySelector('.ui-hint');
            if (hint) hint.textContent = names.length ? '勾了的会连带 ' + names.join('、') + ' 一起发给视频 AI' : '一个都不勾就只发这张图';
          }
        }
      } catch (e) { toast(e.message, 'err'); }
    });
  }
  /* 声音那一块（试听键 / 波形 / 音色芯片 / 方式那一排）单独重画：选完音色要立刻看到名字与高亮，
     但这一刻可能正在给别的角色画脸 —— 整页 render 会把那张卡的占位圈闪掉。
     换的是外层 .ui-vrow 整块：只换里面的 .ui-voice 会把「哪一种方式」那一排留在旧选中态。 */
  function paintVoiceRow(c) {
    const card = castCard(c); if (!card) return;
    const old = card.querySelector('.ui-vrow'); if (!old) return;
    /* 只在**正在写描述的那个输入框**上有焦点时才不动它。
       判据原来写成 `old.contains(document.activeElement)` —— 点一下「去掉参考音频」「用这一条」，
       activeElement 就是那个按钮，于是整块被跳过：数据已经存了、界面却还挂着旧的芯片与旧的高亮，
       要等下一次整页重画才对（点「用这一条」之后 toast 说换了嗓子、界面一点没变）。 */
    const typing = old.querySelector('[data-act="voicenote"]');
    if (typing && typing === document.activeElement) return;
    old.outerHTML = D.Cast.voiceRowHTML(REG, cur.opts, c, { waiting: genMsg('voicecands', c.id) });
    bindCastCard(card, c);
  }
  /* 试听：判条件、先问一句、合成、放音 —— 整段在 D.Cast.preview（与素材库页同一份）。
     一次点击就是真合成一小段，所以记在 `voice#角色` 那一格账上：正在合成时再点第二次 = 合成两遍。 */
  async function previewCharVoice(c) {
    await genRun('voice', c.id, '正在合成「' + c.name + '」的试听…', async () => {
      const r = await D.Cast.preview(REG, cur.opts, c, { onStage: m => genSet('voice', c.id, m) });
      if (r.why) toast(r.why, 'err');
      else if (r.label) toast('试听：' + r.label);
    });
  }
  /* ---------- 让 AI 给这一集的每位角色定声音 ----------
     结果只摆在按钮下面那一格（不开弹窗、不跳页）：每一位定了什么方式、为什么退到另一种、
     哪几位没定下来，都要和上面那些角色卡同屏看得见 —— 卡上的声音那一块会跟着一起重画。
     这份小结是这一次调用的说明，不进角色数据（数据已经写进 char.voiceMode / voice / voiceNote）。 */
  let aiVoiceRes = null;
  function aiVoiceSumHTML() {
    if (genHas('aivoice', null)) return waitHTML('文字 AI 正在按每个人的人设与外貌定声音…');
    const r = aiVoiceRes; if (!r) return '';
    const close = '<button class="ui-linkbtn" id="btnAiVoiceClose" title="收起这一条小结">关掉</button>';
    if (r.err) return '<div class="ui-note err">AI 定声音没成：' + D.esc(r.err) + '　' + close + '</div>';
    const ch = r.changed || [], sk = r.skipped || [];
    if (!ch.length && !sk.length) {
      return '<div class="ui-note err">' + D.esc(r.why || '一位都没定下来') + '　' + close + '</div>';
    }
    const list = ch.map(x => {
      const tip = x.fellback ? (x.why || '这个平台没有对应的型号') : D.Cast.wayLabel(x.mode);
      const warn = x.fellback ? '（退档：' + D.esc(tip) + '）' : '';
      return '<div>' + D.esc(x.name) + '｜' + D.esc(D.Cast.wayLabel(x.mode)) + ' ' + D.esc(x.label || '') + warn + '</div>';
    }).join('');
    return `<div class="ui-note info">AI 按人设定了 ${ch.length} 位${r.model ? '（型号：' + D.esc(r.model) + '）' : ''}：`
      + (list || '<span class="ui-hint">没有一位定成</span>')
      + (sk.length ? '<div>没定的：' + sk.map(x => D.esc(x.name + '（' + x.why + '）')).join('、') + '</div>' : '')
      + '　' + close + '</div>';
  }
  /* AI 定音色只有这一份实现：角色卡上那颗按钮与底栏前置条件面板里那颗「定声音」走同一个函数。
     写成两份就会出现「一处按了有反应、另一处按了没接上 aiVoiceRes」——小结那一段是渲染出来的，
     两边的 repaint 回调不是同一个对象就只有一边能画出结果。 */
  async function runAiVoice() {
    const why = genWhy('aivoice', null); if (why) return toast(why, 'err');
    aiVoiceRes = null;
    const ok = await genUnit('aivoice', null, '文字 AI 正在按每个人的人设定声音…', async () => {
      try { aiVoiceRes = await D.Pipe.assignVoices(REG, cur, {}); }
      catch (e) { aiVoiceRes = { err: (e && e.message) || String(e) }; }
    }, () => renderCast());
    if (ok && aiVoiceRes && aiVoiceRes.changed && aiVoiceRes.changed.length) {
      toast('声音定好了 ' + aiVoiceRes.changed.length + ' 位，卡片上可以直接改', 'ok');
    }
    /* 从前置条件面板点过来的话，整页重画一次：那一块清单按的是**补之前**的数据，
       声音补齐了还挂着「还没定音色」就是一句过期的话。 */
    if (panelOpen('prereq')) { panelHide(); render(); }
  }
  function bindAiVoice() {
    const b = $('btnAiVoice');
    if (b) b.onclick = () => runAiVoice();
    const x = $('btnAiVoiceClose');
    if (x) x.onclick = () => { aiVoiceRes = null; renderCast(); };
  }
  function bindScenes() {
    body.querySelectorAll('[data-sid]').forEach(card => {
      const s = (cur.scenes || []).find(x => x.id === card.dataset.sid); if (!s) return;
      bindSceneCard(card, s);
    });
  }
  function bindProps() {
    body.querySelectorAll('[data-pid]').forEach(card => {
      const p = (cur.props || []).find(x => x.id === card.dataset.pid); if (!p) return;
      bindPropCard(card, p);
    });
  }
  /* 道具卡的接线。与 `bindSceneCard` 同一套（`data-act` 派发 + zoom 委托排除），
     但**没有时段、没有声音、没有资产那一块** —— 动作名是道具自己的那几个，
     不复用角色的：'pickprop' / 'redraw' / 'retryprop' / 'lib' / 'rename' / 'delprop' / 'aiopt'。 */
  function bindPropCard(card, p) {
    const look = card.querySelector('textarea[data-act="look"]');
    if (look) bindText(look, v => { p.look = v; saveSoon(); });
    Dropdowns.build(card);
    card.querySelectorAll('[data-act]:not([data-act="zoom"])').forEach(el => el.onclick = async () => {
      const act = el.dataset.act;
      try {
        if (act === 'pickprop') {
          await genRun('prop', p.id, '正在挑这件道具的图…', async () => {
            const got = await AssetPicker.open({ types: ['图片'], multiple: false, limit: 1,
              title: '选「' + p.name + '」的道具图', note: '这张图每一段拍摄都会作为参考图发出去' });
            if (got && got[0]) { p.face = got[0].src; save(); }
          }, () => paintPropCard(p));
        }
        else if (act === 'redraw' || act === 'retryprop') {
          await genRun('prop', p.id, p.face ? '正在重画「' + p.name + '」的道具图…' : '正在画「' + p.name + '」的道具图…',
            () => D.Pipe.drawPreview(REG, cur, p, { count: 1, replace: true }),
            (e) => { p.faceErr = e || ''; save(); paintPropCard(p); });
        }
        /* 候选排那两个动作（与角色卡同一份 CANDK） */
        else if (act === 'candgen') { await genMoreCands(p, 'prop'); }
        else if (act === 'usecand') { useCand(p, 'prop', el.dataset.src); }
        else if (act === 'aiopt') {
          await genRun('aiopt', p.id, 'AI 正在把道具描述写细…', async () => {
            /* 同上：指令在 `TextAI.DEF.drama_propdesc`。这一条里「不要人物/手/环境」是铁律
               —— 道具图要整集每段当参考图发出去，描述里混进一个人，出来的道具就带着一个人。 */
            p.look = await TextAI.chat(REG, D.Pipe.fillTpl(TextAI.prompt('drama_propdesc'), {
              name: p.name, bio: p.bio || '', look: p.look || '',
            }), (p.look || p.bio || p.name) + '\n风格：' + (D.Pipe.episodeStyle(cur) || ''), {});
          }, () => { save(); paintText(propCard(p), 'look', p.look); });
        }
        else if (act === 'lib') {
          if (p.inLib) { if (libWrite(Object.assign({}, p, { id: p.libId || p.id }))) toast('已更新素材库里的这一条'); }
          else { D.Lib.adopt(cur, p.id); toast('存进素材库了'); }
          save();
          const b = card.querySelector('[data-act="lib"]');
          if (b) { b.textContent = '已在素材库'; b.disabled = true; b.title = '已经在素材库里了'; }
        }
        else if (act === 'rename') { await propInfo(p); }
        /* 传 el（就是那颗「从这一集删掉」按钮）—— 就地二次确认要把它原地变成「确认删掉」 */
        else if (act === 'delprop') { delProp(p, el); }

    });

  function bindSceneCard(card, s) {
    const ta = card.querySelector('textarea[data-act="desc"]');
    if (ta) bindText(ta, v => { s.desc = v; saveSoon(); });
    /* 时段：下拉换成公共组件后，选项点一下会派发 change（ui.js 的 Dropdowns），所以绑 onchange */
    const tm = card.querySelector('select[data-act="time"]');
    if (tm) tm.onchange = () => { s.time = tm.value; save(); toast('时段改成「' + tm.value + '」'); };
    Dropdowns.build(card);
    /* zoom 要排除掉：场景候选图与设定图也带 data-act="zoom"（点开看大图由 boot 里
       body 上的委托负责，drama.html:445 那一段），而这里若无其事地给它挂一个空 onclick，
       委托照样冒泡，功能没坏 —— 但「这一格绑了个什么都不做的处理器」本身就是一处会误导后来人的东西，
       角色卡那边早就用 :not([data-act="zoom"]) 排掉了（见 bindCastCard），这里补齐。 */
    card.querySelectorAll('[data-act]:not([data-act="zoom"])').forEach(el => el.onclick = async () => {
      const act = el.dataset.act;
      try {
        /* 场景入库与角色同一套：已入库的那种是「更新库里这一条」，不是又加一条同名的 */
        if (act === 'lib') {
          if (s.inLib) { if (libWrite(Object.assign({}, s, { id: s.libId || s.id }))) toast('已更新素材库里的这一处场景'); }
          else { D.Lib.adopt(cur, s.id); toast('场景存进素材库了'); }
          save();
          const b = card.querySelector('[data-act="lib"]');
          if (b) { b.textContent = '已在素材库'; b.disabled = true; b.title = '已经在素材库里了'; }
          return;
        }
        if (act === 'pickimg') {
          await genRun('scene', s.id, '正在挑这一处的场景图…', async () => {
            const got = await AssetPicker.open({ types: ['图片'], multiple: false, limit: 1, title: '选场景图' });
            if (got && got[0]) { s.img = got[0].src; save(); }
          }, () => paintSceneCard(s));
        } else if (act === 'redraw' || act === 'retryscene') {

             只剩一句「还没画场景图」—— 用户不知道是没配生图接口还是提示词被拒。
             `replace: true` 让「换图」不必先把 s.img 清空（清空了画失败就只剩一张空卡）。 */
          await genRun('scene', s.id, s.img ? '正在重画「' + s.name + '」的场景图…' : '正在画场景图…',
            () => D.Pipe.drawScene(REG, cur, s, { count: 1, replace: true }),
            (e) => { s.imgErr = e || ''; save(); paintSceneCard(s); });
        }
        /* 候选排那两个动作（与角色卡同一份 CANDK） */
        else if (act === 'candgen') { await genMoreCands(s, 'img'); }
        else if (act === 'usecand') { useCand(s, 'img', el.dataset.src); }
        else if (act === 'rename') {
          await sceneInfo(s);
        }
        /* 同上：传 el，就地二次确认 */
        else if (act === 'delscene') { delScene(s, el); }
        else if (act === 'aiopt') {
          await genRun('aiopt', s.id, 'AI 正在把场景写细…', async () => {
            /* 指令在 `TextAI.DEF.drama_scenedesc`；占位符的 {time} 沿用原来那句默认「深夜」。 */
            s.desc = await TextAI.chat(REG, D.Pipe.fillTpl(TextAI.prompt('drama_scenedesc'), {
              name: s.name, time: s.time || '深夜', look: s.desc || '',
            }), (s.desc || s.name) + '　时间：' + (s.time || '深夜') + '\n风格：' + (D.Pipe.episodeStyle(cur) || ''), {});
          }, () => { save(); paintText(sceneCard(s), 'desc', s.desc); });
        }
      } catch (e) { toast(e.message, 'err'); }
    });
  }
  /* 素材库挑选：一次挑**多位**角色 / 场景（点一下选、再点取消，Shift 连选一段），
     或者按分组一次「整组加入」。卡片与点选语义都跟统一选择器同一套（ui.css 的 .ap-grid / .ap-item

     「这位能不能直接接上一集用」要在挑之前看出来，而不是拉进来说。

     两种模式，同一个框（拆成两份就等于这个框有了两副面孔，两边迟早对不上）：
       · 默认（第 2 步）：「加入这一集」= 把选中的**拉进当前这一集**并合并同名的；
       · `pick: true`（入口页「角色从哪来」= 从素材库选）：此刻还没有「这一集」可加，
         主按钮变成「用这些」，把选中的 lib id 交回给 `onPick`，由入口页存进草稿 opts。 */
  function openLibPicker(mode) {
    const M = mode || {};
    const picking = !!M.pick;               // true = 只交回选择，不往这一集里拉
    let pickGroup = '';                       // '' = 全部组
    let changed = false;                      // 素材库或这一集动过（关掉后要重画：页面 hints 读的就是这两个数）
    let pendingPre = null;                    // 预选名单，等 body() 里 grid 建好之后再灌进 PickSel
    let grpRow, grid, empty, cnt, useBtn, delBtn;
    let dlgClose = null;             // UiDialog 把 close 作为 body 的第二个参数传进来（见下面 body(el, close)）
    /* 素材库整份列表在一次绘制里只读一次（D5）：`all()` = `D.Lib.list()` 的**整份读**，
       而它在这个弹窗里被调得很密 —— paint() 一次要调 5 处，syncSel() 里 kindOf 还对
       每个已选 id 各调两次（是乘法）。这里在 paint()/syncSel() 入口取一次、出口还原，
       纯局部变量提升，判据一个字不改（`shown` / `kindOf` 只是改吃这一份）。 */
    let libCache = null;
    const all = () => (libCache || (libCache = D.Lib.list()));
    const withLib = fn => { const prev = libCache; libCache = D.Lib.list(); try { return fn(); } finally { libCache = prev; } };
    const inGroup = c => !pickGroup || String(c.group || '').trim() === pickGroup;
    /* 顺序数组只算一次：PickSel 的 Shift 连选按「当前可见顺序」取那一段 */
    let order = [];
    const shown = () => all().filter(c => c && inGroup(c));
    /* 「这一条是不是已经在本集里」的判据必须和 `Lib.pullInto` 认人的判据**一模一样**（先按 libId，再按同名）：
       以前只看 libId，于是库里那位「小雅」在卡片上写着本集没有，点「加入这一集」却只是把字段并过去、
       并不多出一个人 —— 卡片说的话与真正会发生的事不一致，而这条正是「要不要再挑一次」的判断依据。
       角色与场景也各查各的名单（libId 不会跨类型撞，但名字会：角色「天台」与场景「天台」是两条）。
       `pick` 模式（入口页）还没有「这一集」，一律不标这个角标。 */
    /* 「这一条是不是已经在本集里」——判据就是数据层那一份 `Lib.inEpisode`，与 `pullInto`
       合并时找的是同一个函数（以前这里自己重写一遍 `libId || 同名`，今天恰好一致，
       但一边改了另一边就会开始说谎，而这个角标正是「要不要再挑一次」的依据）。
       `pick` 模式（入口页）还没有「这一集」，一律不标这个角标。 */
    const inEp = c => !picking && !!D.Lib.inEpisode(cur, c);
    /* 三种类型各算各的份数（2026-10 有了道具）。写成 `scene ? … : …` 那种二元判断时，
       道具会悄悄被算进「角色」里 —— 界面上写着「已选 3 条（角色 3）」，
       点下去道具却进了道具那一栏，说的与做的不是一件事。 */
    const kindOf = id => { const c = all().find(x => x && x.id === id); return c ? D.libKindOf(c) : 'actor'; };
    /* 键就是素材 id（order 里存的也是它）：不传 keyOf 的话 reflow 拿数组下标当签名，
       换到一个条数相同的分组时签名没变、锚点留着，Shift 会连选到上一个组里那张卡 */
    const pick = window.PickSel({ keyOf: x => x, onSync: () => syncSel(), onNote: t => toast(t, 'err') });
    /* 「拉进这一集」的话术只有一份。`Lib.pullInto` 是**同名合并**（库里那位对上本集同名的
       就并过去，不会多出第二个「小雅」），而它返回的清单把两种都算进去了 ——
       直接拿长度说「加进来 N 条」就是骗人，所以新增了几条要按两个名单的前后差现算。 */
    const pullNote = (got, freshC, freshS, freshP) => {
      const fresh = freshC + freshS + freshP;
      if (!fresh) return '这几条本来就在这一集里：库里的预览图 / 三视图 / 声音已经并过去了';
      return '加进来 ' + fresh + ' 条（角色 ' + freshC + '、场景 ' + freshS + '、道具 ' + freshP + '）'
        + (fresh < got.length ? '，另有 ' + (got.length - fresh) + ' 条同名的把库里那份并了过去' : '')
        + '：预览图 / 三视图 / 声音都跟着走';
    };
    const pullNow = fn => {
      const c0 = (cur.characters || []).length, s0 = (cur.scenes || []).length, p0 = (cur.props || []).length;
      const got = fn() || [];
      save();
      toast(pullNote(got, (cur.characters || []).length - c0, (cur.scenes || []).length - s0, (cur.props || []).length - p0));
      changed = true; pick.clear(); paint();
    };
    const card = c => {
      const kd = D.libKindOf(c);
      const isSc = kd === 'scene', isPr = kd === 'prop';
      const pic = D.picOf(c), three = (D.Cast.firstAssetOf(c, 'three') || {}).src || '';
      return `<div class="ap-item" data-lib="${D.esc(c.id)}">
        ${pic ? `<img src="${D.esc(Api.mediaSrc(pic))}" alt="" loading="lazy">`
          : `<span class="dr-libno">${isSc || isPr ? (isPr ? '没道具图' : '没预览图') : (D.voiceOnlyOf(c) ? '只出声' : '没预览图')}</span>`}
        <span class="chk">✓</span>
        <div class="m"><div class="t" title="${D.esc(String(D.descOf(c) || c.bio || '').slice(0, 60))}">${D.esc(c.name)}${
          inEp(c) ? '<span class="ui-tag">已在本集</span>' : ''}</div>
          <div>${D.LIB_KINDS[kd]}${c.group ? ' · ' + D.esc(c.group) : ''}${
          /* 三视图只有角色有；场景与道具那一行改成说它自己那张图，别摆一句「三视图 无」——
             对着一件根本没有三视图的道具说「无」，用户会以为缺了什么。 */
          isPr ? (pic ? ' · 道具图 有' : ' · 还没道具图') : isSc ? (pic ? ' · 场景图 有' : ' · 还没场景图')
            : ' · 三视图 ' + (three ? '有' : '无')}</div>
          ${D.Cast.voiceTag(c)}        </div></div>`;
    };
    const syncSel = () => withLib(() => {
      const ids = pick.list();
      grid.querySelectorAll('.ap-item').forEach(el => el.classList.toggle('sel', pick.has(el.dataset.lib)));
      const sc = ids.filter(id => kindOf(id) === 'scene').length;
      const pr = ids.filter(id => kindOf(id) === 'prop').length;
      cnt.textContent = ids.length
        ? '已选 ' + ids.length + ' 条（角色 ' + (ids.length - sc - pr) + '、场景 ' + sc + '、道具 ' + pr + '）'
        : (picking ? '还没点名：点卡片选一条、再点取消；按分组整组勾也行'
                   : '还没挑人：点一下选一条、再点一下取消，Shift 连选一段');
      /* 入口页模式下一条都没勾时按钮**仍然可点** —— 它那一按是「清空点名、回去用整个库」。
         点名本来就是个能反悔的决定：能钉住名单、却没法退回「整个库列给 AI」，这个框就成了
         单向门（切到「全新角色」再切回来也带不走 curLibPick，只在 readOpts 里把草稿那份清空）。
         第 2 步不一样：没挑人时「加入这一集」毫无意义，照旧置灰。 */
      useBtn.disabled = picking ? false : !ids.length;
      useBtn.textContent = picking
        ? (ids.length ? '用这些（' + ids.length + '）' : '清空点名 · 用整个素材库')
        : (ids.length ? '加入这一集（' + ids.length + '）' : '加入这一集');
      delBtn.disabled = !ids.length;
    });
    const paint = () => withLib(() => {
      const xs = shown();
      order = xs.map(c => c.id);
      const gs = D.Lib.groups().filter(g => all().some(x => x && String(x.group || '').trim() === g.name));
      if (pickGroup && !gs.some(g => g.name === pickGroup)) pickGroup = '';
      grpRow.innerHTML = `<button class="ap-chip${pickGroup ? '' : ' on'}" data-g="">全部 ${all().length}</button>`
        + gs.map(g => `<button class="ap-chip${pickGroup === g.name ? ' on' : ''}" data-g="${D.esc(g.name)}">${
          D.esc(g.name)} ${g.n}</button>`).join('');
      grpRow.querySelectorAll('[data-g]').forEach(b => b.onclick = () => { pickGroup = b.dataset.g; paint(); });
      /* 分组行末尾那颗按钮，两种模式各做各的事：
         · 拉进这一集：整组「加入这一集」—— 这一组里的角色进「角色」、场景进「场景」，
           拆分镜与拍的时候都按这份名单交给 AI；
         · 入口页点名：勾上 / 取消这一组。「选角色或角色组」就得能整组地选，
           而分组芯片原来只切筛选、没有任何一处能把一整组收进选择里。 */
      if (pickGroup) {
        const gids = all().filter(c => c && String(c.group || '').trim() === pickGroup).map(c => c.id);
        const inSet = gids.filter(id => pick.has(id)).length;
        const gu = document.createElement('button');
        gu.className = 'ap-chip' + (picking && inSet ? ' on' : '');
        gu.innerHTML = picking
          ? (inSet ? ic('close', 12) + ' 取消这一组（' + inSet + '/' + gids.length + '）'
                   : ic('check', 12) + ' 勾上这一组（' + gids.length + '）')
          : ic('importInto', 13) + ' 整组「' + D.esc(pickGroup) + '」加入这一集';
        gu.title = picking ? '不必一张张点：这一组一次全勾上或全取消'
          : '不必一张张挑：这一组一次全带进来（同名的合并，不会多出第二个）';
        gu.onclick = () => {
          if (!picking) { pullNow(() => D.Lib.pullGroup(cur, pickGroup)); return; }
          /* 少了一半（用户自己取消过其中几个）就补齐，全勾上了就整组取消 ——
             让那颗按钮是「这一组整体到不到位」的开关，而不是一个只会加不会减的动作。 */
          if (inSet === gids.length) gids.forEach(id => pick.click(order, id, false));
          else pick.addMany(gids);

        };

      }
      grid.innerHTML = xs.map(card).join('');
      grid.querySelectorAll('.ap-item').forEach(el => {
        el.onclick = ev => pick.click(order, el.dataset.lib, ev.shiftKey);
      });
      empty.hidden = !!xs.length;
      empty.textContent = all().length ? '这个组里还没有素材，点「全部」看别的组。'
        : (picking
          ? '素材库还是空的：先拍一集并把角色与场景「存进素材库」，或点下面「＋ 新建素材」手动建一条。'
          : '素材库还是空的：在下面「把本集角色与场景存进素材库」存一批，或「＋ 新建素材」直接手动建一条。');

    });

      const ids = pick.list();
      if (picking) {
        /* 交回选择，不动任何一部剧。ids 可以是空 —— 那正是「清空点名、回去用整个库」。
           入口页这一按是**提交**，不是第 2 步那种「再拉一组」：交回名单就该把框收掉，
           让入口页那行摘要直接露出来 —— 模态开着时它被 top layer 的 backdrop 挡着，
           toast 也一样看不见（`.toast-box` 在 body 上，压不过 top layer），
           于是「点了没反应」正是这么来的。第 2 步那边要连着拉好几组，所以那边**不关**，
           两种模式的收尾本来就该不同：一个是「再来一组」，一个是「就这么定」。 */
        if (M.onPick) M.onPick(ids);
        const nm = all().filter(c => ids.indexOf(String(c.id)) >= 0).map(c => c.name);
        toast(ids.length
          ? '点名 ' + ids.length + ' 条：' + nm.slice(0, 6).join('、') + (ids.length > 6 ? ' 等' : '')
          : '不点名了：整个素材库都列给 AI 自己挑');
        if (dlgClose) dlgClose('ok');
        return;
      }
      if (ids.length) pullNow(() => D.Lib.pullInto(cur, ids));
    };
    /* 「＋ 新建素材」直接往库里建一条（不必先进某一集）；用 onClick 返回 false 让弹窗别关，
       建完就地刷新列表。 */
    /* 预选：入口页把上一次点的名单带进来，用户是**改**这一次的选择，不是从头再点一遍。
       两处都对成**字符串**：卡片选中存的是 `el.dataset.lib`（DOM 属性，一律是字符串），
       而库里那条的 id 是数字；用数字集合去 `has()` 字符串 id 会一个都命不中，预选看着写了、
       一次都不生效。数据层 `drama.js` 的 `libPickOf` 也是 `.map(String)` 后再比，
       这里跟它同一套口径，不另立一种比较方式。
       只留库里还在的那些：库条目被删过之后旧 id 再塞进来，选中数会报一个比实际大的数。
       ⚠ 这一段必须留在 `UiDialog.open` **之前**：`open()` 会同步调 body()，body() 里灌预选的那
       一句先跑，pendingPre 那时还不存在。 */
    if (picking && Array.isArray(M.preselect) && M.preselect.length) {
      const live = new Set(all().map(c => String(c.id)));
      pendingPre = M.preselect.map(String).filter(id => live.has(id));
    }
    const dlg = UiDialog.open({
      id: 'drLibDlg',
      title: picking ? '素材库：点名要哪几个角色 / 场景 / 道具' : '素材库：挑人要加进这一集',
      sub: picking
        ? '跨剧复用 · 点卡片多选，或按分组整组勾上；点「用这些」之后只把这批列给 AI'
        : '跨剧复用 · 点卡片多选，或按分组整组加入（角色进角色栏、场景进场景栏、道具进道具栏）',
      body(el, close) {
        dlgClose = close;
        el.innerHTML = '<div class="ap-chips" id="libGrp"></div>'
          + '<div class="ap-grid" id="libGrid" style="margin-top:10px"></div>'
          + '<div class="ap-empty" id="libEmpty" hidden></div>'
          + '<div class="btn-row" style="margin-top:12px"><button class="tool acc" id="libUse" disabled>加入这一集</button>'
          + '<span class="ui-hint" id="libCnt"></span>'
          + '<span class="sp"></span>'
          + '<button class="tool danger" id="libDel" disabled>删掉选中的</button></div>';
        grpRow = el.querySelector('#libGrp'); grid = el.querySelector('#libGrid');
        empty = el.querySelector('#libEmpty'); cnt = el.querySelector('#libCnt');
        useBtn = el.querySelector('#libUse'); delBtn = el.querySelector('#libDel');
        useBtn.onclick = useSel;
        delBtn.onclick = async () => {
          const ids = pick.list();
          if (!ids.length) return;
          /* 弹窗关掉以后用户多半要去改选中，所以就地二次确认而不是弹窗：
             按钮原地变成「确认删掉 N 条」，再点一下才真删。 */
          if (Confirm.arm(delBtn, '确认删掉 ' + ids.length + ' 条', {
            note: '已经拉进某一集的那几条不受影响；本机存的参考音频会一起删掉',
          })) return;
          /* 只把**真删掉的**那些从本集摘掉引用（库里那份读不出来时 `libRemove` 整批停手并弹出原因），
             全批没删成还照旧摘引用 = 下一次 save() 把「库里已经没有的 id」写回去，
             卡片显示「已在素材库」、库里却根本没有那一条（「存进素材库」按钮从此永久 disabled）。
             `Lib.remove` 清的是**存储里**各集的 libId，而这一集是页面手上这份对象 —— 三种类型都要同步：
             原来只同步角色与场景，道具删完仍挂着旧 libId，与数据层对不上。 */
          const gone = new Set(libRemove(ids));
          let unlinked = 0;
          for (const arr of [cur.characters || [], cur.scenes || [], cur.props || []])
            for (const c of arr) if (c && gone.has(c.libId)) { c.inLib = false; c.libId = ''; unlinked++; }
          if (unlinked) save();
          changed = true; pick.clear(); paint();
          if (gone.size) toast('从素材库删掉 ' + gone.size + ' 条');
        };
        /* 预选要在 grid / cnt / useBtn 都建好之后才灌（addMany 会回调 syncSel），
           而且只灌一次 —— 后面每次 paint() 都会重画卡片，灌第二次就把用户刚点的选择冲掉了。 */
        if (pendingPre && pendingPre.length) { pick.addMany(pendingPre); pendingPre = null; }
        paint();
      },
      actions: [
        { label: '＋ 新建素材', onClick: async () => {
            /* 那张表单只有 `Drama.Lib.newForm` 一份（素材库页的「新建一条素材」走的就是它）。
               这里原来是**第二份**，而且已经漂了：栏名与例子是旧措辞、场景少了「时段」那一行
               （建出来的场景只能事后回编辑区补），道具还拿 `newChar` 建（该走 `newProp`，
               于是带上一堆没人读的声音字段）。
               建完不关弹窗：用户多半还要接着挑或再建一条，`onClick` 返回 false 就是「留着」。 */
            const r = await D.Lib.newForm();
            if (!r) return false;
            if (r.error) { toast(r.error, 'err'); return false; }
            const saved = r.item;
            toast('建好了：' + saved.name + (picking ? '。已经勾上了' : '。要用的时候点「加入这一集」'));
            changed = true;
            /* 建完顺手勾上：用户是在「点名」这件事的过程中发现少一个的，
               建完还得自己再点一下那张新卡才选得上，多余。 */
            if (picking && saved) pick.addMany([saved.id]);
            paint();
            return false;
          } },
        /* 「把本集存进素材库」在入口页没有意义 —— 这一刻还不存在「这一集」，
           摆一颗点下去必然报错的按钮在那里是最坏的一种摆设，直接不摆。 */
        picking ? null : { label: '把本集存进素材库', onClick: async () => {
            const n = ((cur.characters || []).length + (cur.scenes || []).length);
            if (!n) { toast('这一集还没有角色与场景', 'err'); return false; }
            const v = await PromptForm.open({
              title: '把这一集的角色与场景存进素材库', okLabel: '存进库',
              fields: [{ key: 'group', label: '分组（可留空；下一集在素材库里点这个组整组加入）', type: 'text',
                value: cur.title || '', placeholder: '例：' + (cur.title || '这部短剧') + '主要角色' }],
            });
            if (!v) return false;
            const g = String(v.group || '').trim().slice(0, 20);
            const done = D.Lib.adoptAll(cur, g); save(); changed = true; paint();
            toast('存进素材库 ' + done + ' 条' + (g ? '（分组：' + g + '）' : '') + '，下一集按名字直接对上预览图与音色');
            return false;
          } },
        { label: '在素材库页管理', onClick: () => { location.href = 'chars.html'; return false; } },
        { label: '完成', value: 'ok', primary: true },
      ].filter(Boolean),
    });
    dlg.then(() => {
      /* `changed` 只在**动了素材库**时为真（新建 / 删掉）。入口页此刻没有「这一集」，
         调 render() 会把整页重画、丢掉用户刚写的那段故事 —— 那一格自己怎么重画由调用方给。 */
      if (!changed) return;
      if (picking) { if (M.onChanged) M.onChanged(); }
      else render();
    });
  }

  /* ---------- 步骤 3/4：预演与拍摄（左轨 + 舞台 + 段落条 + 右栏） ---------- */
  function isPreview() { return cur.step === 3; }
  function renderStage() {
    body.className = 'dr-body';
    const sh = (cur.shots || [])[shotIdx];
    const take = sh ? takeAt(sh) : null;
    const ar = (cur.opts.ratio || '9:16').replace(':', '/');
    body.innerHTML = `
      <div class="dr-col dr-rail" id="rail"></div>
      <div class="dr-col dr-main">
        <div class="dr-stagewrap">
          <div class="dr-stage" id="stage" style="--ar:${ar}">
            <div id="stageMedia"></div>
            <div class="dr-badge" id="stageBadge" hidden></div>
            <div class="dr-subs" id="subs" hidden></div>
            <div class="dr-play" id="playBtn"><button title="播放这一段">${ic('play', 26)}</button></div>
          </div>
        </div>
        <div class="dr-ctl">
          <button id="cPrev" title="上一段（←）">${ic('stepBack', 15)}</button>
          <button class="pri" id="cPlay" title="播放 / 暂停（空格）">${ic('play', 15)}</button>
          <button id="cNext" title="下一段（→）">${ic('stepNext', 15)}</button>
          <button id="cAll" title="把已经拍出来的段按段号连着放一遍（只放平台出的原片；导出成片仍是另一个动作）">${ic('play', 13)} 整集连放</button>
          <span class="nm">${sh ? ('第 ' + sh.no + ' 段 · ' + D.esc(sh.title)) : '还没有段'}</span>
          <span class="tm" id="tm">00:00 / 00:00</span>
        </div>
        <div class="dr-segs" id="segs"></div>
      </div>
      <div class="dr-col dr-side" id="side"></div>`;
    renderRail(); renderSegs(); renderSide();
    bindStage();
  }
  function renderRail() {
    const rail = $('rail'); if (!rail) return;
    /* 「收起」不能把开关本身也收掉：以前 display:none 一整条，收起之后再没有展开入口。
       现在收成一个窄条，留一个「»」按钮原位展开。状态存页面变量里 —— renderStage 每次
       都重建这条 DOM，写在 dataset 上会在下一次 render 时被重置成展开。 */
    if (railMin) {
      rail.classList.add('min');
      rail.innerHTML = '<button class="ghost mini" id="railToggle" title="展开角色与场景">»</button>';
      rail.querySelector('#railToggle').onclick = () => { railMin = false; renderRail(); };
      return;
    }
    rail.classList.remove('min');
    rail.innerHTML = `<div class="dr-h">角色 <span><button class="ghost mini" id="railToggle">收起</button></span></div>`
      + (cur.characters || []).map(c => `<div class="dr-item" data-cid="${D.esc(c.id)}">
          <div class="av cast">${c.kind === 'narrator' ? `<span class="dr-mic" title="旁白：只出声不出镜">${ic('mic', 17)}</span>` : (c.face ? `<img src="${D.esc(Api.mediaSrc(c.face))}" alt="">` : '<span class="dr-ph">没脸</span>')}</div>
          <div class="mid"><div class="nm">${D.esc(c.name)}</div><div class="sub">${c.kind === 'narrator' ? '只出声' : (() => { const n = D.Cast.assetsOf(c).length; return '脸 · 声音' + (n ? ' · ' + n + ' 张资产' : ''); })()}</div></div>
          <span class="ui-hint">详情</span></div>`).join('')
      + `<div class="dr-h dr-h2">场景</div>`
      + (cur.scenes || []).map(s => `<div class="dr-item" data-sid="${D.esc(s.id)}">
          <div class="av">${s.img ? `<img src="${D.esc(Api.mediaSrc(s.img))}">` : '<span class="dr-ph">没图</span>'}</div>
          <div class="mid"><div class="nm">${D.esc(s.name)}</div><div class="sub">${D.esc((s.desc || '').slice(0, 18))}</div></div></div>`).join('');
    rail.querySelectorAll('[data-cid]').forEach(el => el.onclick = () => {
      const c = (cur.characters || []).find(x => x.id === el.dataset.cid); if (!c) return;
      openCharSheet(c);
    });
    rail.querySelectorAll('[data-sid]').forEach(el => el.onclick = () => {
      const s = (cur.scenes || []).find(x => x.id === el.dataset.sid); if (!s) return;
      openSceneSheet(s);
    });
    const tg = rail.querySelector('#railToggle');
    if (tg) tg.onclick = () => { railMin = true; renderRail(); };
  }
  /* 角色改名：走公共表单弹窗（页面里不再出现浏览器自带的 prompt 框） */
  /* 手动建角色 / 改角色信息共用这一份表单（以前只有「改名」，手建的角色没法填人设，
     类型也不能在界面上改 —— 旁白只能靠 AI 拆剧本时判定）。 */
  /* 角色改名 / 手建：2026-10 依用户要求去弹窗，不再用 PromptForm。
     · 编辑已有角色：就地在那张卡的 `.nm` 里画一行内联控件（名字输入 + 类型下拉 + 一句话人设 +
       确定/取消），提交走 `applyCharInfo`；取消就重画回只读态。
     · 新增角色：走第 2 步顶部的「新角色那一行」（`pendingNewChar`），也是同一份内联控件 ——
       以前那个「手动加角色」的模态表单其实只是 3 个字段，就地填比另开一层快得多。 */
  let pendingNewChar = false;
  async function charInfo(c) {
    if (c) {
      const card = body.querySelector('.dr-card2[data-cid="' + c.id + '"]');
      const nm = card && card.querySelector('.nm'); if (!nm) return false;
      return applyCharInline(nm, c, null);
    }
    pendingNewChar = true; render();
    const row = body.querySelector('.dr-newchar-row'); if (!row) return false;
    const nameEl = row.querySelector('input[data-f=name]'); if (nameEl) nameEl.focus();
    // 新增走 row 里的「加进这一集」按钮，Promise 由那里 resolve
    return new Promise(res => { pendingNewCharResolve = res; });
  }
  let pendingNewCharResolve = null;
  function applyCharInline(host, c, isNew) {
    return new Promise(res => {
      const dup = n => (cur.characters || []).some(x => x && x !== c && x.name === n);
      const old = host.innerHTML;
      /* 新增时 `c` 是 **null**（`applyCharInline(row, null, true)`）。
         原来这里写的是 `(!isNew || (c.kind || 'actor') === 'actor')`：
         `isNew` 为真 → `!isNew` 为假 → **恰好落到 `c.kind` 上**，当场
         `TypeError: Cannot read properties of null`。
         表现是「＋ 手动加一个角色」一点就炸、角色永远加不进去，而控制台只在
         渲染栈里留一行红字 —— 而手动模式正是文字 AI 挂掉时用户唯一的出路。
         所以新增一律按「角色（出镜）」预选，根本不去碰 `c`。 */
      const curKind = isNew ? 'actor' : (c.kind || 'actor');
      host.innerHTML = `<input class="dr-input" data-f="name" value="${D.esc(isNew ? '' : (c.name || ''))}" placeholder="这一位在剧里的名字" maxlength="20" style="max-width:120px">
        <select class="dr-input" data-f="kind" style="max-width:130px">
          <option value="actor"${curKind === 'actor' ? ' selected' : ''}>角色（出镜）</option>
          <option value="narrator"${curKind === 'narrator' ? ' selected' : ''}>旁白（只出声）</option>
        </select>
        <input class="dr-input" data-f="bio" value="${D.esc(isNew ? '' : (c.bio || ''))}" placeholder="一句话人设（可空）" style="flex:1 1 200px">
        <button class="tool acc" data-do="ok">${isNew ? '加进这一集' : '改好'}</button>
        <button class="ghost" data-do="cancel">取消</button>
        <span class="dr-inline-err"></span>`;
      host.querySelectorAll('button').forEach(b => b.onclick = () => {
        if (b.dataset.do === 'cancel') { host.innerHTML = old; return res(false); }
        const name = (host.querySelector('[data-f=name]').value || '').trim().slice(0, 20);
        const kind = host.querySelector('[data-f=kind]').value;
        const bio = (host.querySelector('[data-f=bio]').value || '').trim();
        const errEl = host.querySelector('.dr-inline-err');
        if (!name) { errEl.textContent = '名字不能空着'; return; }
        if (dup(name)) { errEl.textContent = '这一集里已经有同名角色，改一个吧'; return; }
        applyCharInfo(c, isNew, name, kind, bio);
        res(true);
      });
      const enter = e => { if (e.key === 'Enter') { e.preventDefault(); host.querySelector('[data-do=ok]').click(); }
        else if (e.key === 'Escape') { e.preventDefault(); host.querySelector('[data-do=cancel]').click(); } };
      host.querySelectorAll('input,select').forEach(el => el.addEventListener('keydown', enter));
    });
  }
  function applyCharInfo(c, isNew, name, kind, bio) {
    let synced = false;
    if (isNew) {
      cur.characters = cur.characters || [];
      cur.characters.push(D.newChar({ name, kind, bio }));
    } else {
      const oldKind = c.kind;
      c.name = name; c.kind = kind; c.bio = bio;
      if (oldKind !== kind && kind === 'narrator') { c.face = ''; c.faces = []; }
      if (c.inLib && c.libId) synced = !!libWrite(Object.assign({}, c, { id: c.libId }));
    }
    save(); render();
    /* 那句「素材库里那一份也一起改了」只有在真写进去时才说 —— 名字是「同名 = 同一个人」的判据，
       库里没跟着改，下次「加入这一集」并到的还是原来那位。 */
    toast(isNew ? '加好了，把外貌补一句就能画脸'
      : '角色信息改好了' + (synced ? '（素材库里那一份也一起改了）' : ''));
  }
  /* 从这一集删掉一个角色。素材库里那一条**留着**（那是跨剧复用的，与删段同一约定）；
     这一集里引用他/她的地方要一起清干净：出场名单、台词的说话人。
     台词**不删**（那句可能还想要），只是不再指定说话人 —— 配音时会按名字落到旁白上。

     但删的不只是一个名字：这一位身上**已经花钱做出来的东西**（画好的脸、N 张角色资产、
     配好的音色 / 参考音频、写好的声音描述）会跟着一起消失。以前的确认只说台词和
     「素材库里存过的那条也还在」—— 没存进库的那些，确认框一个字都不提，
     点两下就丢了，重拆一次要重画 8 张脸、重配一遍音色。
     现在按「到底会丢什么」分两条路：
       · 会丢东西 → Confirm.choose（**给得出选择**：存进素材库再删 / 直接删 / 取消）
       · 不会丢   → 原地按钮武装（它只能显示一行字，这里也没有要选的，用不着打断）
     判据在同一个地方算，`inLib` 一变（刚存进库）两条路的归属立刻跟着换。 */
  async function delChar(c, btn) {
    if (!c) return;
    const used = (cur.shots || []).filter(sh => (sh.lines || []).some(l => l && l.whoId === c.id)).length;
    /* 只有「没存进素材库」的才算真会没 —— 库里有副本的，删完还能找回来 */
    const lost = c.inLib ? [] : [
      D.Cast.assetsOf(c).length ? D.Cast.assetsOf(c).length + ' 张角色资产' : '',
      (c.voice || c.voiceName) ? '配好的音色' : '',
      c.refAudio ? '挂着的参考音频' : '',
      c.face ? '画好的脸' : '',
      String(c.voiceNote || '').trim() ? '写好的声音描述' : '',
    ].filter(Boolean);
    const lineNote = used ? '有 ' + used + ' 段台词由这一位念 —— 台词留着，说话人会变成旁白。' : '';

    if (lost.length) {
      const pick = await Confirm.choose({
        title: '「' + (c.name || '这一位') + '」还没存进素材库',
        body: '从这一集删掉之后，' + lost.join('、') + '会跟着一起没了，救不回来。'
          + (lineNote ? '\n' + lineNote : ''),
        options: [
          { label: '先存进素材库再删', hint: '存完立刻删，资产和音色都留得住', value: 'lib' },
          { label: '直接删掉', hint: lost.join('、') + ' 一起没了', value: 'del' },
        ],
      });
      if (pick === 'lib') { D.Lib.adopt(cur, c.id); toast('存进素材库了，正在从这一集删掉'); }
      else if (pick !== 'del') return;                       // 取消
    } else {
      const note = lineNote + (c.inLib ? '素材库里存过的那条也还在。' : '');
      if (Confirm.arm(btn, '确认删掉', { note: note })) return;
    }
    const r = D.dropChar(cur, c.id);
    if (!r.ok) return toast(r.why, 'err');
    save(); render();
    toast('删掉了「' + r.removed + '」' + (r.lines ? '，' + r.lines + ' 句台词改由旁白念' : '')
      + (r.shots ? '，' + r.shots + ' 段的出场名单去掉了这一位' : ''));
  }
  function delScene(s, btn) {
    if (!s) return;
    const n = (cur.shots || []).filter(sh => sh && sh.sceneId === s.id).length;
    const note = (n ? '有 ' + n + ' 段写的是这个场景 —— 删掉之后那几段按「不指定场景」拍。' : '')
      + (s.inLib ? '素材库里存过的那条也还在。' : '');
    if (Confirm.arm(btn, '确认删掉', { note: note })) return;
    const r = D.dropScene(cur, s.id);
    if (!r.ok) return toast(r.why, 'err');
    save(); render();
    toast('删掉了场景「' + r.removed + '」' + (r.shots ? '，' + r.shots + ' 段改成不指定场景' : ''));
  }
  /* 场景改名：以前场景没有改名入口（角色有），只能删了重建。同样走公共表单。
     已经存进素材库的场景要**连库里那一份一起改** —— 两边名字一旦对不上，
     素材库那边「加入这一集」是按名字认人的（pullInto），会多出第二个同名的。 */
  async function sceneInfo(s) {
    const card = body.querySelector('.dr-card2[data-sid="' + s.id + '"]');
    const nm = card && card.querySelector('.nm'); if (!nm) return false;
    const dup = n => (cur.scenes || []).some(x => x && x !== s && x.name === n);
    return new Promise(res => {
      const old = nm.innerHTML;
      nm.innerHTML = `<input class="dr-input" data-f="name" value="${D.esc(s.name || '')}" placeholder="例：天台" maxlength="20" style="max-width:160px">
        <button class="tool acc" data-do="ok">改好</button>
        <button class="ghost" data-do="cancel">取消</button>
        <span class="dr-inline-err"></span>`;
      nm.querySelectorAll('button').forEach(b => b.onclick = () => {
        if (b.dataset.do === 'cancel') { nm.innerHTML = old; return res(false); }
        const name = (nm.querySelector('[data-f=name]').value || '').trim().slice(0, 20);
        const errEl = nm.querySelector('.dr-inline-err');
        if (!name) { errEl.textContent = '名字不能空着'; return; }
        if (dup(name)) { errEl.textContent = '这一集里已经有同名场景了，改一个吧'; return; }
        s.name = name;
        const synced = !!(s.inLib && s.libId) && !!libWrite(Object.assign({}, s, { id: s.libId }));
        save(); render();
        toast('场景改名为「' + name + '」' + (synced ? '（素材库里那一份也一起改了）' : ''));
        res(true);
      });
      const enter = e => { if (e.key === 'Enter') { e.preventDefault(); nm.querySelector('[data-do=ok]').click(); }
        else if (e.key === 'Escape') { e.preventDefault(); nm.querySelector('[data-do=cancel]').click(); } };
      nm.querySelectorAll('input').forEach(el => el.addEventListener('keydown', enter));
      const inp = nm.querySelector('input'); if (inp) inp.focus();
    });
  }
  /* 道具改名与删除。与场景同一套就地编辑 / 就地二次确认，但**没有「有几段在用」那句提醒** ——
     道具不挂在段上（整集一份，每段都带），说「有 N 段写的是这个道具」是在报一件不存在的事。 */
  function delProp(p, btn) {
    if (!p) return;
    const note = p.inLib ? '素材库里存过的那条也还在。' : '';
    if (Confirm.arm(btn, '确认删掉', { note: note })) return;
    const r = D.dropProp(cur, p.id);
    if (!r.ok) return toast(r.why, 'err');
    save(); render();
    toast('删掉了道具「' + r.removed + '」');
  }
  async function propInfo(p) {
    const card = body.querySelector('.dr-card2[data-pid="' + p.id + '"]');
    const nm = card && card.querySelector('.nm'); if (!nm) return false;
    const dup = n => (cur.props || []).some(x => x && x !== p && x.name === n);
    return new Promise(res => {
      const old = nm.innerHTML;
      nm.innerHTML = `<input class="dr-input" data-f="name" value="${D.esc(p.name || '')}" placeholder="例：旧信封" maxlength="20" style="max-width:160px">
        <button class="tool acc" data-do="ok">改好</button>
        <button class="ghost" data-do="cancel">取消</button>
        <span class="dr-inline-err"></span>`;
      nm.querySelectorAll('button').forEach(b => b.onclick = () => {
        if (b.dataset.do === 'cancel') { nm.innerHTML = old; return res(false); }
        const name = (nm.querySelector('[data-f=name]').value || '').trim().slice(0, 20);
        const errEl = nm.querySelector('.dr-inline-err');
        if (!name) { errEl.textContent = '名字不能空着'; return; }
        if (dup(name)) { errEl.textContent = '这一集里已经有同名道具了，改一个吧'; return; }
        p.name = name;
        /* 改名要连库里那一份一起改：道具的图与名字是一对（拍摄时按名字进提示词），
           两边对不上，下一次「从素材库选」会多出第二个同名道具。 */
        const synced = !!(p.inLib && p.libId) && !!libWrite(Object.assign({}, p, { id: p.libId }));
        save(); render();
        toast('道具改名为「' + name + '」' + (synced ? '（素材库里那一份也一起改了）' : ''));
        res(true);
      });
      const enter = e => { if (e.key === 'Enter') { e.preventDefault(); nm.querySelector('[data-do=ok]').click(); }
        else if (e.key === 'Escape') { e.preventDefault(); nm.querySelector('[data-do=cancel]').click(); } };
      nm.querySelectorAll('input').forEach(el => el.addEventListener('keydown', enter));
      const inp = nm.querySelector('input'); if (inp) inp.focus();
    });
  }
  /* 第 2 步之内点侧栏那一条 = 跳到第 2 步、把对应那张卡滚过去闪两下
     （走的是 showPrereq 已有的 `.dr-hit` 闪烁机制，CSS 在本页的 <style> 里，不是 ui.css）。
     **第 3/4 步不在这一条路上** —— 那两步要看人（镜头里这个人对不对得上、声音配没配），
     硬跳过去会把当前这一段、正在看的 take、正在播的预演全换掉，看完还得点回来。
     所以 2026-10 去掉的「详情抽屉」在第 2 步之外又回来了：`openCastSheet` 走右侧抽屉，
     第 2 步之内仍然用跳转（同页滚动比盖一层抽屉顺手）。 */
  function jumpToCastCard(id, kind) {
    if (cur.step !== 2) { cur.step = 2; save(); enterStep(2); }
    const sel = kind === 'scene'
      ? '.dr-card2[data-sid="' + id + '"]'
      : '.dr-card2[data-cid="' + id + '"]';
    const card = body.querySelector(sel);
    if (!card) return;
    card.scrollIntoView({ behavior: 'smooth', block: 'center' });
    card.classList.add('dr-hit');
    setTimeout(() => card.classList.remove('dr-hit'), 1200);
  }
  function openCharSheet(c) { openCastSheet(c.id, 'char'); }
  function openSceneSheet(s) { openCastSheet(s.id, 'scene'); }

  /* ---------- 右侧抽屉：第 2 步之外就地看角色 / 场景 / 道具详情 ----------
     以前这里是 `cur.step = 2` 硬跳到「认角色」再滚过去闪两下（`jumpToCastCard`）。
     那在第 2 步之内是对的（人已经在那一页了），在**第 3、4 步**就是添乱：
     拍成片时想看一眼这个人的脸 / 声音 / 外貌，被扔回上一步，而当前选中的那一段、
     正在看的 take、正在播的预演全被换掉 —— 看完还得再点回来。
     而且第 3、4 步恰恰是「看人」的地方：镜头里这个人对不对得上，回到认角色那步才看得到。
     所以第 2 步之外就地开抽屉：**不换步、不丢当前这一段**。
     抽屉里放的就是 `castHTML` / `sceneHTML` / `propHTML` 那三张卡（**同一份实现**，
     改一边另一边跟着改），并挂在 `body` 里 —— `paintCastCard` / `paintSceneCard` 查的正是
     `body` 里的 `.dr-card2`，所以画脸画完的定点重画照样能换掉抽屉里的图。 */
  function openCastSheet(id, kind) {
    if (cur.step === 2) return jumpToCastCard(id, kind);       // 已经在那一页：老路更好用
    const list = kind === 'scene' ? (cur.scenes || []) : kind === 'prop' ? (cur.props || []) : (cur.characters || []);
    const item = list.find(x => x && x.id === id); if (!item) return;
    const kindZh = kind === 'scene' ? '场景' : kind === 'prop' ? '道具' : '角色';
    const card = kind === 'scene' ? sceneHTML(item) : kind === 'prop' ? propHTML(item) : castHTML(item);
    closeCastSheet();
    const el = document.createElement('div');
    el.id = 'castDrawer'; el.className = 'dr-drawer';
    el.innerHTML = '<div class="dr-drawer-mask"></div>'
      + '<div class="dr-drawer-bd" role="dialog" aria-label="' + kindZh + '详情">'
      + '<div class="dr-drawer-hd"><b>' + kindZh + '详情</b>'
      + '<span class="ui-hint">改完直接生效　·　拍下一段就会用上</span>'
      + '<button class="ghost mini" data-drw="x">' + ic('close', 14) + ' 收起</button></div>'
      + '<div class="dr-drawer-ct">' + card + '</div></div>';
    body.appendChild(el);
    el.querySelector('[data-drw="x"]').onclick = closeCastSheet;
    el.querySelector('.dr-drawer-mask').onclick = closeCastSheet;
    /* Esc 收起：抽屉是「看一眼」的东西，改到一半不想收手不用滚回去找那颗按钮。
       监听挂在抽屉自己身上（不是 document）—— 换步时 `body.innerHTML` 一换它就没了，
       挂在 document 上的监听会一直留着，每次按键都去查一个已经不存在的节点。 */
    el.onkeydown = (e) => { if (e.key === 'Escape') { e.preventDefault(); closeCastSheet(); } };
    el.tabIndex = -1; el.focus();
    const cd = el.querySelector('.dr-card2');
    if (cd) {
      if (kind === 'scene') bindSceneCard(cd, item);
      else if (kind === 'prop') bindPropCard(cd, item);
      else bindCastCard(cd, item);
    }
  }
  function closeCastSheet() {
    const el = $('castDrawer'); if (el) el.remove();
  }

  /* 「这一段**选用**的是哪一次」—— 段条状态、右栏芯片、成片拼哪几条、**下一段接谁的末帧**都读它。
     **直接调数据层那一份**（`Drama.Pipe.chosenTake`），不在这儿再抄一遍：以前这里自己写了个
     `|| takes[0]` 当兜底，而那份的兜底是「最后一条 done」—— 于是「拍过两次、第一次没拍成第二次拍成了」
     这种最常见的段同时出两个错：
     ① 段条与右栏写着「没拍成」，导出的成片里用的却是拍成了的那条 —— 界面与成片说的不是一件事；
     ② **链式拍摄取不到上一段的末帧**（`shootAll` / `shootLoop` 都写 `pt.state !== 'done'` 就静默不接），
        「重拍第 3 段」拍出来接不上第 2 段，成片里留下接缝，而没人会自己看出来。 */
  const curTake = sh => D.Pipe.chosenTake(cur, sh);
  /* 「这一段拍过没有、结果如何」：一条都没拍成时 chosenTake 是空的，但段条与右栏要照实说
     「没拍成」而不是「没拍」—— 把拍砸过的段说成没拍过，用户会以为白花了那几次钱。
     取**最后**一条（刚拍的那次才是当前局面）。成片与接帧都不读它。
     刻意与 curTake 分开：这两个问题在「拍过但没拍成」时答案不同，合成一个就会出现
     「为了让状态显示对，顺手把接帧那一条也改错」。 */
  const lastTake = sh => { const ts = (sh && sh.takes) || []; return ts.length ? ts[ts.length - 1] : null; };
  /* 「现在正在看的是哪一次」—— 舞台、字幕、预演声音读它。
     这两个以前是一个 `curTake`：点拍片记录里的「第 2 次」只改了 takeIdx（详情块换了），
     舞台却还按 chosen 播 —— 于是展开的是这一条、播的还是那一条，字幕也跟着错。
     段条状态与成片拼段仍然读 curTake：**看**哪一条不该改变**用**哪一条。 */
  const takeAt = sh => ((sh && sh.takes) || [])[takeIdx] || curTake(sh);
  const curShot = () => (cur.shots || [])[shotIdx] || null;
  /* 进到某一步时的善后 = 重画一次。前置条件是**现算**的（`prereqs` 在 renderBottom 里当场所取），
     所以用户回第 2 步补了音色再回来，「开始拍」上那句压暗的「前置条件还没齐」会自己散掉，
     不需要谁去重新判定一遍。 */
  function enterStep() { render(); }

  /* take 的状态码 → 界面说法（只有一份）。`stage` 是流水线写的中文进度（配音 / 提交…），
     有就用它；没有再按状态码兜底 —— 别把 'pending' 这种内部字段直接摆到界面上
     （段条、右栏芯片、拍片记录三处都读这一份）。 */
  const STATE_CN = { pending: '排队中', dubbing: '配音中', shooting: '拍摄中',
    dubbed: '配音好了', done: '完成', failed: '没拍成', abandoned: '不等了' };
  const stateCn = t => (t && (t.stage || STATE_CN[t.state])) || '处理中';
  /* 「这一条还在跑吗」只有一份判据：pending / dubbing / shooting 才是真在跑，
     dubbed（只配了音、还没画面）是**静止状态** —— 把它当在跑，段条上就永远挂着一颗转圈，
     而那条配音其实早就完了。 */
  const takeRunning = t => !!t && (t.state === 'pending' || t.state === 'dubbing' || t.state === 'shooting');

  /* 段条那一颗：外壳（选中态 + data-i + 接线）归 renderSegs，**内容单独一份** ——
     某一段的开头画面或配音跑完了，只换这一颗的内容，不重画整条（滚动位置与接线都不动）。 */
  function segInner(sh) {
    const t = curTake(sh) || lastTake(sh);   // 与 shotState 同一个口径：没选用就报最后一次的结果
    const st = !t ? '' : t.state === 'done' ? 'ok' : t.state === 'failed' ? 'warn' : takeRunning(t) ? 'run' : '';
    const label = !t ? (genHas('open', sh.id) ? '画面生成中' : genHas('dub', sh.id) ? '配音中' : '没拍')
      : t.state === 'done' ? '✓'
      : t.state === 'failed' ? '没拍成'
      : stateCn(t);
    return `<div class="th">${genHas('open', sh.id) && !sh.startImg ? waitHTML('画面')
        : (sh.startImg ? `<img src="${D.esc(Api.mediaSrc(sh.startImg))}">` : '')}
      <span class="n">${sh.no}</span><span class="st">${!t ? '·' : t.state === 'done' ? '✓' : t.state === 'failed' ? '!' : takeRunning(t) ? '…' : '·'}</span></div>
      <div class="cap ${st}">${D.esc(label)}${t && t.sec ? ' · ' + Math.round(t.sec) + ' 秒' : ''}</div>`;
  }
  function segHTML(sh, i) {
    return `<div class="dr-seg${i === shotIdx ? ' on' : ''}" data-i="${i}">${segInner(sh)}</div>`;
  }
  function paintSeg(sh) {
    const i = (cur.shots || []).indexOf(sh); if (i < 0) return;
    const box = $('segs'); if (!box) return;
    const el = box.querySelector('.dr-seg[data-i="' + i + '"]'); if (el) el.innerHTML = segInner(sh);
  }

  function renderSegs() {
    const box = $('segs'); if (!box) return;
    box.innerHTML = (cur.shots || []).map((sh, i) => segHTML(sh, i)).join('')
      /* 「加一段」：自己排段落的那条路（AI 拆完想补一段也用它）。
         以前手动模式只有角色和场景能手动加，段没有入口 —— 勾了「我自己排」还是只能等 AI 拆。 */
      + `<div class="dr-seg add" id="segAdd" title="自己加一段（不想全靠 AI 拆的时候）"><div class="th"><span class="plus">${ic('plus', 20, 1)}</span></div><div class="cap">加一段</div></div>`;
    /* 点段条也是「我自己要看这一段」：连放要让位，否则在 `onended` 里又被拽回队列。 */
    box.querySelectorAll('.dr-seg[data-i]').forEach(el => el.onclick = () => { stopAll(); stopPlayer(); shotIdx = Number(el.dataset.i); takeIdx = 0; render(); });
    const sa = $('segAdd');
    if (sa) sa.onclick = () => {
      cur.shots = cur.shots || [];
      const no = cur.shots.length + 1;
      /* link 的默认值只在 D.newShot 里定一次（第 1 段一律 off），页面不再自己写一遍 */
      cur.shots.push(D.newShot({ no: no, title: '第 ' + no + ' 段',
        sceneId: ((cur.scenes || [])[0] || {}).id || '', chars: [] }));
      shotIdx = cur.shots.length - 1; takeIdx = 0;
      save(); render();
      toast('加好了，在右边写这一段的画面和台词', 'ok');
    };
  }

  /* 这一段的状态怎么标：先说**正在生成的那件事**，再说这条 take 的结果。
     右栏那颗芯片与整页重画共用这一份，别两处各写一套说法。 */
  function shotState(sh) {
    /* 选用的那一条没有，就退到**最后**那一条：拍过但一条都没成的段要显示
       「没拍成」，写成「没拍」等于把已经花掉的钱的那几次说成没发生过。 */
    const t = curTake(sh) || lastTake(sh);
    if (t) {
      if (t.state === 'done') return ['已选用', 'ok'];
      if (t.state === 'failed') return ['没拍成', 'err'];
      /* 只配过音、还没画面的那一条是**静止的**：写成 run 就等于界面一直说「这一段在跑」，
         而什么都没有在跑（配音早就合成完了）。 */
      return [stateCn(t), takeRunning(t) ? 'run' : ''];
    }
    if (genHas('shoot', sh.id)) return ['拍摄中', 'run'];
    if (genHas('dub', sh.id)) return ['配音中', 'run'];
    if (genHas('open', sh.id)) return ['开头画面生成中', 'run'];
    return ['没拍', ''];
  }
  /* 开头 / 结尾那一格：没图又正在画时，格子里是「转圈 + 正在画」而不是一个孤零零的「+」 */
  function pickHTML(sh, which) {
    const src = which === 'startimg' ? sh.startImg : sh.endImg;
    const waiting = which === 'startimg' && genHas('open', sh.id);
    const lab = which === 'startimg' ? '开头' : '结尾';
    /* 「结尾」这一格照实说清它现在的用处：**存下来了，但没发给视频平台**。
       `buildEntries` 只 push `first_frame`（drama.js），`planMaterials` 也只认 `startImg` ——
       `endImg` 全项目只被写入、复制、以及拿来重画它自己。视频平台有没有「末帧」这种输入 role
       要看它自己的 `/models` 声明，没声明就不能硬塞一个字段进去（平台会拒）。
       所以这里不假装它是生效的：写明它只是存着，以及真要控制结尾得靠台词/画面描述。 */
    const title = which === 'startimg'
      ? '开头画面：这一段的第一帧，拍的时候会发给视频平台'
      : '结尾画面：目前只存在本机，还没有发给视频平台（平台声明了「末帧」输入才用得上）'
        + ' —— 想控制这一段怎么收，靠下面的「开头画面描述」与台词更直接';
    /* 上一次没画成的原因要留在这格上：以前只有生成那一刻的一句 toast（五秒就没了），
       于是「为什么这一段没有开头画面」在界面上永远查不到，重进页面只看得到一个空白的「+」。 */
    const err = which === 'startimg' && !src && !waiting ? String(sh.openErr || '') : '';
    /* 画出来了、但**没拿场景图与角色脸当参考**（型号没有这一槽 / 上传失败）——
       与 `err` 分开：这是黄条不是红格。图在那儿，只是可能与原场景对不上。 */
    const note = which === 'startimg' && src ? String(sh.openNote || '') : '';
    return `<div class="dr-pick${src ? ' has' : ''}${err ? ' err' : ''}${note && !err ? ' warn' : ''}" data-a="${which}" title="${D.esc(err
      ? '开头画面：上一次没画成 —— ' + err + '（再按一次「出预演」会重画这一段，点这一格也可以自己选一张）'
      : (note ? '开头画面：' + note + '（点这一格可以自己选一张，或重画）' : title))}">${
      src ? `<img src="${D.esc(Api.mediaSrc(src))}">` : waiting ? waitHTML('正在画') : err ? '!' : '+'}<small>${lab}</small></div>`
      + (note && !err ? `<div class="ui-hint">开头画面：${D.esc(note)}</div>` : '');
  }
  /* 「这一段在哪个场景」的选项：这一集的场景清单（AI 拆出来的那些，界面上读得出、改得了）。
     原来 sceneId 只由文字 AI 写，AI 认错了就只能重拆整集 —— 它直接决定提示词里的环境。 */
  function sceneOptsHTML(sh) {
    const xs = (cur.scenes || []).filter(s => s && s.id);
    if (!xs.length) return '<option value="" selected>（这一集还没有场景）</option>';
    /* 「不指定场景」是一项**真实选项**，不是占位。dropScene 会把用到那个场景的段改成
       「不指定」（`setScene` 也认空串），而以前列表里根本没这一项 ——
       `sh.sceneId === ''` 时整个 select 一项 `selected` 都没有，浏览器于是**默认显示第一个场景**：
       右栏下拉写着「场景一」，数据与提示词里却是「不指定」，同一栏顶上的标题又不写场景名，
       三处对不上，而用户改任何别的字段都不会发现（要等拍出来才发现根本不在那个场景里）。
       判据是「在不在清单里」而不是「是不是空串」：场景被删掉 / 拉库换了一份之后，
       原来那个 id 也可能对不上任何一项，同样该落到这一项。 */
    const sid = xs.some(x => x.id === sh.sceneId) ? sh.sceneId : '';
    return `<option value=""${sid ? '' : ' selected'}>不指定场景</option>`
      + xs.map(s => `<option value="${D.esc(s.id)}"${s.id === sid ? ' selected' : ''}>${D.esc(s.name || '未命名')}</option>`).join('');
  }
  /* 右栏 */
  function renderSide() {
    const side = $('side'); if (!side) return;
    const sh = curShot();
    if (!sh) { side.innerHTML = '<div class="ui-hint">还没有分段</div>'; return; }
    const sc = (cur.scenes || []).find(s => s && s.id === sh.sceneId);
    const status = shotState(sh);
    /* 一次拍摄参数只算一次（这一段有三处要读它：时长、参考图上限、模型名）。
       算三遍不只是慢 —— 中间任何一处改了 opts，三处就会显示成三个不同档位。 */
    const f = D.Pipe.shootFields(REG, cur, sh);
    const take = takeAt(sh);
    const playSec = (take && take.sec) || f.dur || sh.wantSec;
    /* ---------- 出场角色：自己占满一整行 ----------
       「出场角色」以前只是**画在参考图那一行里的静态小图**，全页 15 个动作里没有一个能改它
       —— `sh.chars` 只有 AI 拆剧本（normalizeScript）、复制段、删角色三处会写。
       于是手动加的段永远没有人：拍出来是空镜，视频 AI 也拿不到这位的脸，而界面上看不出异常。
       现在它自己一行、能加能删，选项只列**这一集**的角色，不跨剧借人。

    const castIds = new Set((sh.chars || []).filter(Boolean));

          ? '<span class="ui-hint">接上一段末帧：第 1 段没有上一段可接，按自己的开头画面拍</span>'

          const rl = D.Pipe.refRule(REG, cur) || { max: 0 };
          const refs = sh.refImgs || [];
          /* 「选了角色 → 他的三视图自动进参考图、参考音频自动发给视频 AI」这件事必须看得见。
             清单来自 D.Pipe.planMaterials —— 和拍摄时真正发出去的那一份是同一个函数；
             两边各算各的就会出现「界面说会带、拍摄时被上限挤掉」。 */
          const p = D.Pipe.planMaterials(cur, sh, f.model);
          /* 计数器与芯片都读 **p.refs**（真正会发出去的那一份），不是 `sh.refImgs`。
             以前只数手挑的，于是「一位有脸的角色 + 0 张手挑参考图」会写成「参考图 0 / 9」——
             而拍摄时那张脸**真的发出去了**。写着 0 却发着 1，比不写更坏：用户以为不用管，
             直到成片里换了张脸才发现。三视图也一样：它自动进袋，却只有「有脸」时才出现在芯片里。 */
          const auto = p.refs.filter(r => r.what !== '手挑的参考图');
          const chips = auto.map(r => '✓ ' + r.what + '自动进参考图')
            .concat(p.audios.map(a => '✓ ' + a.what + '发给视频 AI'));
          /* 出场角色与参考图这两块都**各占一整行**，不跟「开头/结尾」磁贴并排：
             并排时右栏只剩 ~150px，计数、芯片与说明全被挤成两三行竖条（截图实测）。
             出场角色那一块的来由见上面 renderSide 的注释；cast / rest / offstage 由上面
             算一次传下来，两块不许各自再数一遍。 */
          return `<div class="dr-refs">
          <div class="cap">参考图${rl.max
            ? ' ' + p.refs.length + ' / ' + rl.max + (auto.length ? '（自动 ' + auto.length + '）' : '')
            : '（当前模型不收）'}</div>
          <div class="dr-mini">
            ${refs.map((s, i) => `<div class="dr-pick has sm" data-a="delref" data-ri="${i}" title="第 ${i + 1} 张参考图 · 点一下移除"><img src="${D.esc(Api.mediaSrc(s))}"><small>${ic('close', 10, 1)}</small></div>`).join('')}
            <div class="dr-pick sm" data-a="addref" title="加一张参考图">${ic('plus', 18)}</div>
          </div>
          ${chips.length ? `<div class="dr-auto">${chips.map(x => `<span class="ai-chip">${D.esc(x)}</span>`).join('')}</div>` : ''}
          ${p.notes.map(x => `<div class="ui-hint">${D.esc(x)}</div>`).join('')}</div>`;
      })()}
      <div class="dr-sect">开头画面描述 <span><button class="ui-linkbtn" data-a="aiopt2">${ic('sparkles', 12)} AI 优化</button></span></div>
      <div class="dr-opendesc"><textarea data-act="openDesc" placeholder="这一段开头那一眼是什么样：人物在哪、在做什么、光线什么感觉、镜头多近。画首帧与视频提示词都用它">${D.esc(sh.openDesc || '')}</textarea></div>
      <div class="dr-sect">台词 <span><button class="ui-linkbtn" data-a="addline">${ic('plus', 12)} 加一句</button></span></div>
      ${(() => { const c = f.caps;
        const longest = Math.max.apply(null, (c.durs || [0]).map(Number));
        /* 「台词要念多久」和「这一段拍几秒」常开并列摆出来。以前只在装不下（tight）
           或多留了空镜（padded）时才说话，正常态右栏只有标题那一个「约 X 秒」——
           用户看不出这一段的台词到底紧不紧，只能等拍完发现话被砍了。
           这一条已经配好音就用**真实时长**（take.lines[].dur 是合成回来的），
           没配过才按字数估，并且写明是哪一种；数字含末尾收尾，和选档位用的是同一份。 */
        const ls = D.Pipe.lineSec(sh, take);
        const line = '台词含收尾约 ' + Math.round(ls.sec) + ' 秒（'
          + (ls.from === 'dub' ? '按真实配音' : '按字数估') + '）· 这一段拍 ' + f.dur + ' 秒';
        if (c.tight) return `<div class="ui-note dr-tight err">ⓘ ${D.esc(line)} —— 比平台最长的 ${longest} 秒还长，拍出来话会被截。拆成两段，或者改短。</div>`;
        if (c.padded) return `<div class="ui-hint dr-tight">${D.esc(line)}；平台只有 ${(c.durs || []).join(' / ')} 秒可选，为装下台词多留了一段空镜。</div>`;
        return `<div class="ui-hint dr-tight">${D.esc(line)}</div>`; })()}
      <div class="dr-lines" id="lineBox">${linesHTML(sh)}</div>
      <div class="btn-row dr-fixrow">
        <input id="fixHint" class="dr-input" placeholder="一句话让 AI 改这一段，比如「这一位更慌张一点」">
        <button class="ghost mini" data-a="aifix">${ic('sparkles', 12)} 改</button>
      </div>
      ${subShotsHTML(sh, f)}
      ${isPreview()
        /* 看预演那一步还没拍过任何一条 —— 摆一个「重拍这段」在那儿既是顺序错乱，

        ? ''
        : `<div class="dr-sect">每一条拍片 <span><button class="ghost mini" data-a="reshoot" data-n="${takesLeft(sh)}"${takesLeft(sh) ? '' : ' disabled title="已经拍到重拍上限了 —— 先在下面删掉拍坏的那次才能再拍"'}>重拍这段</button></span></div>
           <div id="takeBox"></div>
           <div class="btn-row"><button class="tool acc" data-a="shoot1"${takesLeft(sh) ? '' : ' disabled title="已经拍到重拍上限了 —— 先在下面删掉拍坏的那次才能再拍"'}>拍这一段</button></div>`}`;
    if (!isPreview()) renderTakes(sh);
    bindLines(sh);
    bindSideCtl(side, sh);
  }
  /* ---------- 细分镜头详情（这一段拆出来的每一镜） ----------
     以前这里只有一行只读摘要（`镜1 特写 · 3 秒 · 描述`）：拍成片那一步选中某一段之后，
     右栏看不到这一段到底由哪几个镜头构成、每一镜多长时间 —— 而分镜恰恰是**拍之前**唯一
     能改的东西（改完点「重拍这段」，不用等拍完才发现镜头不对）。
     现在每一镜可展开、可改：景别 / 机位 / 秒 / 画面里发生什么（可 AI 优化）。
     三处必须同源，别各写一份：
       · 景别与机位的候选取 `SHOT_SIZES` / `CAMERAS`（和「机位」按钮那份是同一份）
       · 秒的候选取**当前视频模型声明的档位**（`f.caps.durs`），不是写死的数字
       · 改完的 desc 会被 `D.Pipe` 拼进视频提示词（drama.js 的 videoPrompt），所以这里改完即生效 */
  const SIZES = ['远景', '全景', '中景', '中近景', '近景', '特写'];
  /* 展开的是哪一镜：`'<段id>:<镜序号>'`，只记一个 —— 一次只展开一镜，
     免得右栏被十几行编辑器撑爆（这一段的镜头数由拆剧本决定，最多五个）。 */
  let openShotKey = '';
  const subShotsHTML = (sh, f) => {
    const list = sh.shots || [];
    const durs = (f && f.caps && f.caps.durs) || [];
    const head = '<div class="dr-sect">细分镜头 <span class="ui-hint">'
      + (list.length ? '共 ' + list.length + ' 镜 · 展开一镜可以改景别 / 机位 / 秒 / 画面'
        + (f && f.caps && f.caps.tight ? '　·　这一段台词比平台最长的档还长，拆镜救不了，得拆段' : '')
        : '这一段没有分镜') + '</span></div>';
    if (!list.length) return head + '<div class="ui-hint">这一段没有分镜头（拆剧本时 AI 没拆开，它就按整段一拍）。</div>';
    return head + '<div class="dr-sublist">' + list.map((k, i) => {
      const key = sh.id + ':' + i;
      const open = openShotKey === key;
      const bits = [k.size, k.camera].filter(Boolean).join(' · ')
        || (k.desc ? '' : '（没写画面）');
      const secTxt = k.sec ? Math.round(k.sec * 10) / 10 + ' 秒'
        : (f && f.caps ? '按整段 ' + f.dur + ' 秒' : '未定');
      return '<div class="dr-sub' + (open ? ' open' : '') + '" data-subkey="' + key + '">'
        + '<button class="dr-sub-hd" data-a="subtoggle" data-k="' + i + '"'
        + (open ? ' aria-expanded="true"' : ' aria-expanded="false"') + '>'
        + '<span class="n">镜' + (i + 1) + '</span>'
        + '<span class="m">' + D.esc(bits) + ' · ' + D.esc(secTxt) + '</span>'
        + '<span class="cv">' + ic('chevronDown', 14) + '</span></button>'
        + (open ? subShotBody(sh, k, i, durs, f) : '')
        + '</div>';
    }).join('') + '</div>';
  };
  const subShotBody = (sh, k, i, durs, f) =>
    '<div class="dr-sub-bd">'
    + '<div class="dr-sub-ctl">'
    + '<label>景别</label><select data-k="' + i + '" data-kf="size">'
    + optHTML(SIZES.map(s => ({ v: s, t: s })), k.size, '没定') + '</select>'
    + '<label>机位</label><select data-k="' + i + '" data-kf="camera">'
    + optHTML(CAMERAS.map(c => ({ v: c.id, t: c.id })), k.camera, '没定') + '</select>'
    + '<label>秒</label><select data-k="' + i + '" data-kf="sec">'
    + optHTML(durs.map(d => ({ v: d, t: d + ' 秒' })), k.sec ? String(Math.round(k.sec)) : '',
      durs.length ? '平台排（约 ' + ((f && f.dur) || '') + '）' : '平台排')
    + '</select></div>'
    + '<div class="dr-sub-why">机位与景别会写进这一段的视频提示词；'
    + (durs.length ? '「秒」只能从平台声明的 ' + durs.join(' / ') + ' 秒里挑'
        + (durs.length > 1 ? '，挑中间的值没有意义（平台会把它吸到某一档）' : '') : '')
    + '</div>'
    + '<div class="dr-sect">画面里发生什么 <span><button class="ui-linkbtn" data-a="subai" data-k="' + i + '">'
    + ic('sparkles', 12) + ' AI 优化</button></span></div>'
    + '<textarea class="dr-sub-desc" data-k="' + i + '" data-kf="desc"'
    + ' placeholder="这一镜里发生什么：谁在做什么、在画面哪个位置、光线什么感觉">' + D.esc(k.desc || '') + '</textarea>'
    + '</div>';
  const optHTML = (items, cur, blank) =>
    (blank ? '<option value="">' + D.esc(blank) + '</option>' : '')
    + items.map(o => '<option value="' + D.esc(String(o.v)) + '"'
      + (String(o.v) === String(cur) ? ' selected' : '') + '>' + D.esc(o.t) + '</option>').join('');

  /* 右栏那些控件的接线（换步 / 动作）。定点重画某个格子后要再调一次：
     onclick 是挂在格子自己身上的，outerHTML 换掉新节点就没有监听了。 */
  function bindSideCtl(side, sh) {
    /* 开头画面描述：边写边存（照台词那一列的写法）。AI 优化完只顶内容、不重画整栏
       —— 整页重画会把光标一起抹掉（paintText：正在敲这一格时连内容都不动）。 */
    const od = side.querySelector('textarea[data-act="openDesc"]');
    if (od) bindText(od, v => { sh.openDesc = v; saveSoon(); });
    /* 场景 / 接上一段末帧：这两个字段原来只由文字 AI 写，AI 判错了界面上没有自救路径。
       下拉换成公共组件后，选项点一下会派发 change 事件（ui.js 的 Dropdowns），所以绑 onchange。 */
    side.querySelectorAll('[data-sel]').forEach(el => el.onchange = () => {
      const r = el.dataset.sel === 'scene' ? D.Shots.setScene(cur, sh.id, el.value) : D.Shots.setLink(cur, sh.id, el.value);
      if (!r.ok) return toast(r.why, 'err');
      save(); renderSide();
      toast(el.dataset.sel === 'scene' ? '这一段改到「' + (((cur.scenes || []).find(x => x && x.id === sh.sceneId) || {}).name || '') + '」了'
        : (sh.link === 'off' ? '这一段不接上一段末帧了：各拍各的，可以并发' : '这一段会接上一段的最后一帧'));
    });
    /* 出场角色：下拉点一下就把那位加进这一段。绑 onchange —— 下拉换成了公共组件
       （ui.js 的 Dropdowns 把原生 select 包起来当数据源，元素本身没换，所以这里引用照样有效），
       点一下派发的是 change 而不是 input。 */
    const ca = side.querySelector('[data-castadd]');
    if (ca) ca.onchange = () => {
      const id = ca.value;
      if (!id) return;
      const c = (cur.characters || []).find(x => x && x.id === id);
      if (!c) return toast('这一集里已经找不到这位角色了', 'err');
      if ((sh.chars || []).indexOf(id) >= 0) return;
      sh.chars = (sh.chars || []).concat([id]);
      save(); renderSide();
      toast('「' + (c.name || '') + '」进这一段了' + (c.face ? '，这一位的脸会作为参考图发给视频 AI' : '（还没画脸 —— 拍出来认不出这一位，先回上一步出预览图）'));
    };
    /* 细分镜头那几格：下拉（景别 / 机位 / 秒）改的是**这一镜**（`sh.shots[i]`），
       文本框边写边存。改完只重画这一块（`paintSubShots`），不整栏重画 ——
       整栏会把正在敲的别的框连光标一起重建。 */
    side.querySelectorAll('select[data-kf]').forEach(el => el.onchange = () => {
      const k = (sh.shots || [])[Number(el.dataset.k)];
      if (!k) return;
      const fld = el.dataset.kf;
      if (fld === 'sec') k.sec = el.value ? Number(el.value) : 0;
      else k[fld] = el.value;
      save(); paintSubShots(sh);
    });
    side.querySelectorAll('textarea[data-kf="desc"]').forEach(el =>
      bindText(el, v => { const k = (sh.shots || [])[Number(el.dataset.k)]; if (k) { k.desc = v; saveSoon(); } }));
    /* 这两个下拉也要套公共下拉外壳（渲染时就地换掉原生 select，所以每次重画都要再 build 一次） */
    Dropdowns.build(side);
    /* `zoom` 要排除掉：机位候选的缩略图是 `data-a="zoom"`（右栏派发 `data-a`，
       见 `picCandsHTML` 的 `attr`），点开看大图由 boot 里 body 上的委托负责。
       这里若无其事地给它挂一个空 onclick，委托照样冒泡、功能没坏 ——
       但「这一格绑了个什么都不做的处理器」本身就是一处会误导后来人的东西，
       角色卡 / 场景卡那边早就用 :not([…="zoom"]) 排掉了（见 bindCastCard / bindSceneCard），这里补齐。 */
    side.querySelectorAll('[data-a]:not([data-a="zoom"])').forEach(b => b.onclick = (e) => sideAct(sh, b.dataset.a, b, e));
  }
  /* 细分镜头那块的定点重画（改完一镜只换这一块，别整栏重画） */
  function paintSubShots(sh) {
    const side = $('side'); if (!side) return;
    const f = D.Pipe.shootFields(REG, cur, sh);
    const box = side.querySelector('.dr-sublist');
    if (!box) return renderSide();
    const tmp = document.createElement('div');
    tmp.innerHTML = subShotsHTML(sh, f);
    const fresh = tmp.querySelector('.dr-sublist');
    if (fresh) box.outerHTML = fresh.outerHTML;
    /* 上面那行汇总（镜数 / tight 提示）也可能变了（秒一改，平台排的秒数就变） */
    const sect = side.querySelector('.dr-sect .ui-hint');
