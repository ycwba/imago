    if (sect) { const s2 = tmp.querySelector('.dr-sect .ui-hint'); if (s2) sect.outerHTML = s2.outerHTML; }
    Dropdowns.build(side);
    side.querySelectorAll('[data-a]:not([data-a="zoom"])').forEach(b => b.onclick = (e) => sideAct(sh, b.dataset.a, b, e));
  }
  /* 某一段的素材好了（开头画面画完 / 状态变了）就重画这几处，不整页 render：
     重建三栏的代价很具体 —— 正在播的片子从头开始、正在敲的台词丢光标。 */
  function paintSlots(sh) {
    const side = $('side'); if (!side) return;
    ['startimg', 'endimg'].forEach(k => {
      const cell = side.querySelector('.dr-slot [data-a="' + k + '"]'); if (!cell) return;
      cell.outerHTML = pickHTML(sh, k);
    });
    /* 画完之后「重画开头画面」那一颗要跟着没 —— 这一格只换两个磁贴，
       不动它的话画好了按钮还挂着，点一下又白花一次生成。 */
    const rb = side.querySelector('[data-a="redoopen"]');
    if (rb && sh.startImg) rb.remove();
    paintStateTag(sh);
    bindSideCtl(side, sh);
  }
  /* 右栏那一行（状态芯片 + 「还没拍 / 拍过 N 次」那句话）单独一份：进度回调只改这一小块，
     不换整个右栏 —— 换整栏会把正在敲的台词框连光标一起重建。
     **两样都要改**：只换芯片的话，拍完之后芯片写着「已选用」、
     紧挨着的那句却还写着「还没拍 · 每点一次「拍这一段」只发一条任务」——
     同一格里两句话互相打脸，用户以为自己点的「拍这一段」没生效。 */
  function paintStateTag(sh) {
    const side = $('side'); if (!side) return;
    const row = side.querySelector('.dr-strow'); if (!row) return;
    const tag = row.querySelector('.ui-tag');
    if (tag) { const st = shotState(sh); tag.className = 'ui-tag ' + st[1]; tag.textContent = st[0]; }
    const hint = row.querySelector('.ui-hint');
    if (hint) hint.textContent = takesHint(sh);
  }
  /* 「还没拍 / 拍过 N 次」那句话：**判据只有这一份**（整栏渲染与定点刷新共用），
     别在模板里再写一遍 —— 两处各写一遍就会出现拍完还写着「还没拍」。 */
  const takesHint = sh => (sh.takes || []).length
    ? '这一段拍过 ' + sh.takes.length + ' 次，最多能拍 ' + D.maxTakes() + ' 次（次数在设置页改）'
    : '还没拍 · 每点一次「拍这一段」只发一条任务，不自动重试';
  /* 一段的「状态」变了就重画这三处：段条那颗、右栏芯片、拍片记录那一列。
     刻意不碰舞台 —— 进度回调每次都走这里，重建 <img>/<video> 会让画面闪一下、
     正在播的那条从头开始。素材真的换了（画完开头画面、拍完一条）才走 refreshShot。 */
  function paintShotState(sh) {
    paintSeg(sh);
    if ((cur.shots || []).indexOf(sh) !== shotIdx) return;
    paintStateTag(sh);
    renderTakes(sh);
  }
  function refreshShot(sh) {
    if (!cur || cur.step < 3) return;
    paintSeg(sh);
    /* 台词漂移那条也在这儿收一次：重新配音/重拍完，`curTake` 换了一条、漂移可能刚好解掉 ——
       而这一格是「素材真的换了」才重画的地方，不跟着走的话提示条会一直挂着已经不存在的问题。 */
    if ((cur.shots || []).indexOf(sh) === shotIdx) { paintSlots(sh); paintStage(); renderTakes(sh); paintDrift(sh); }
  }
  /* 台词逐句可改：说话人从这一集的角色里选（旁白也在里面），文本随便改。
     改完立刻存 —— 字幕轨、镜头描述、后面的配音与拍摄都按这份来。 */
  /* 「这一段的台词在拍完之后被改过」提示条。摆在这一格**最上面**，而不是只报在成片清单里 ——
     改台词的人站在这儿，不站在清单前；等到点导出才发现的时候，成片里说的一直是旧那几句。
     判据是 D.Pipe.lineDrift（配音与字幕一律按**拍摄那一刻**的快照，drama.js 里那一份），
     页面不另编一套；「用哪一条」也与段条/右栏芯片同口径：curTake 选不中就看最后一次。
     槽位固定画在 DOM 里、由 paintDrift 填内容：跟着输入重画整格会把正在敲的 textarea 换掉、光标跳走。 */
  const DRIFT_WHAT = '已经拍好的那一条说的、烧的仍是拍的时候那几句 —— 配音的时间轴只对旧台词成立，'
    + '套不上新的。要换成新台词只能重拍这一段（重拍会重新配音）。';
  function driftHTML() { return '<div class="ui-note dr-tight" data-drift hidden></div>'; }
  function paintDrift(sh) {
    const box = $('lineBox'); if (!box || !sh) return;
    const el = box.querySelector('[data-drift]'); if (!el) return;
    const d = D.Pipe.lineDrift(sh, curTake(sh) || lastTake(sh));
    el.hidden = !d;
    el.textContent = d ? ('拍的时候 ' + d.shot + ' 句，现在 ' + d.now + ' 句。' + DRIFT_WHAT) : '';
  }
  function linesHTML(sh) {
    const kids = (cur.characters || []).filter(c => c && c.id);
    if (!kids.length) return driftHTML() + '<div class="ui-hint">这一集还没有角色，先回上一步认角色。</div>';
    /* 配好音的那一条：跟 `driftHTML` / `paintDrift` 同一份口径（curTake 选不中就看最后一次），
       「听这一句」放不放得出来读的是 `D.Pipe.lineAudio`（它自己判 lineDrift，
       台词改过就取不到 —— 不放旧台词的音）。 */
    const take = curTake(sh) || lastTake(sh);
    return driftHTML() + ((sh.lines || []).map((l, i) => {
      /* 说话人由 D.Pipe.lineSpeaker 判（先 whoId、再按名字兜一层），认不出来就摆一项
         「未指定」并选中它。**不能让它落到列表第一项**：`<select>` 一项 selected 都没有时
         浏览器默认显示第一项，右栏就写着第一位角色念这句，而 dubShot 只认 whoId
         （已经空了）→ 落到旁白上。界面与真正发出去的声音对不上。
         最常见的触发就是那位角色被从这一集里删掉了（台词留着、说话人被清空）。 */
      const sp = D.Pipe.lineSpeaker(cur, l);
      const au = D.Pipe.lineAudio(sh, take, i);
      return `<div class="dr-line">
        <select data-li="${i}">${sp ? '' : '<option value="" selected>未指定（按旁白念）</option>'}${kids.map(c => `<option value="${D.esc(c.id)}"${sp && c.id === sp.id ? ' selected' : ''}>${D.esc(c.name || '未命名')}</option>`).join('')}</select>
        <textarea data-lt="${i}" placeholder="这一句说什么">${D.esc(l.text || '')}</textarea>
        ${au.src
          ? `<button class="play iconbtn" data-lp="${i}" data-src="${D.esc(au.src)}" title="听这一句（${au.dur ? au.dur + ' 秒' : '已配好'}${au.who ? ' · ' + D.esc(au.who) : ''}）">${ic('play', 12)}</button>`
          : `<span class="lineno" title="${D.esc(au.why || '这一句还没配音')}">${au.why ? '待配' : ''}</span>`}
        <button class="del iconbtn" data-ld="${i}" title="删掉这一句">${ic('close', 12)}</button></div>`;
    }).join('')
      || '<div class="ui-hint">这一段没有台词（纯空镜也行）</div>');
  }
  function bindLines(sh) {
    const box = $('lineBox'); if (!box) return;
    /* 说话人那一列也换成公共下拉组件（全站只有台词这里还在用裸 select） */
    Dropdowns.build(box);
    paintDrift(sh);
    box.querySelectorAll('[data-lt]').forEach(el => {
      const i = Number(el.dataset.lt);
      bindText(el, v => { if (sh.lines[i]) { sh.lines[i].text = v; saveSoon(); paintDrift(sh); } });
    });
    box.querySelectorAll('[data-li]').forEach(el => el.onchange = () => {
      const i = Number(el.dataset.li);
      const c = (cur.characters || []).find(x => x && x.id === el.value);
      /* who 是给字幕和提示词看的名字，whoId 才是配音找音色的凭据 —— 只写一个的话
         台词看着换了人、念出来还是原来那个角色的嗓子（dubShot 按 whoId 找人）。 */
      if (sh.lines[i]) { sh.lines[i].who = c ? (c.name || '') : el.value; sh.lines[i].whoId = c ? c.id : ''; save(); paintDrift(sh); }
    });
    box.querySelectorAll('[data-ld]').forEach(el => el.onclick = () => {
      sh.lines.splice(Number(el.dataset.ld), 1); save(); renderSide();
    });
    /* 「听这一句」：播本机**已经存着**的那一段（`lineAudio` 挑出来的那条），
       不重新合成、不花钱 —— 所以不问「要再合成一次吗」那一层。
       播之前先停掉正在放的那一句，免得两句叠在一起。 */
    box.querySelectorAll('[data-lp]').forEach(el => el.onclick = async () => {
      if (lineAud) { try { lineAud.pause(); } catch (e) {} }
      lineAud = new Audio(el.dataset.src);
      const a = lineAud;
      a.onended = () => { if (lineAud === a) lineAud = null; };
      try { await a.play(); }
      catch (e) { toast('浏览器没让自动播放：点一下再放', 'err'); }
    });
  }
  /* 正在放的那一句台词。与 `D.Cast.preview` 里那个试听播放器**分开**：
     试听是给角色挑音色用的，这里是核对某一段的配音，两件事撞在一起就是两个声音同时响。 */
  let lineAud = null;
  /* 这一段还剩几次能重拍：上限读设置项（dr_maxtakes，Drama.SET 里声明），页面上所有
     「最多 N 次」的说法与拍片循环的判据都读它，别再各自拿 drama.opts 里那个数。 */
  function takesLeft(sh) {
    return Math.max(0, D.maxTakes() - ((sh && sh.takes) || []).length);
  }
  /* 上一次 `renderTakes` 画出来的**结构签名**（条数 / 状态 / 选中 / 有无画面 / 有无错误）。
     只变 `t.stage`（进度文案）时走定点 patch，不重建整列 —— 见 renderTakes 开头那段。 */
  let takesSig = '';
  function takesStructSig(takes) {
    return takeIdx + '|' + takes.length + '|' + takes.map(t => {
      const running = !!(t.taskId && !t.abandoned && t.state !== 'done' && t.state !== 'failed');
      return [t.no, t.state, running ? 1 : 0, (t.videoUrl || t.video) ? 1 : 0,
        t.error ? 1 : 0, (t.notes || []).length].join(':');
    }).join(',');
  }
  function renderTakes(sh) {
    const box = $('takeBox'); if (!box) return;
    const takes = sh.takes || [];
    /* 这一格只出现在第 4 步（`renderTakes` 由 `renderSide` 在 !isPreview() 时调），而底栏
       「开始拍」只在第 3 步画 —— 原来这句话让人去按一个**这一屏根本没有**的按钮。
       这一屏真正能开拍的是右栏的「拍这一段」。预演怎么合成也说清（在本机，不调视频平台）。 */
    if (!takes.length) { takesSig = ''; box.innerHTML = '<div class="ui-hint">这一段还没拍。预演是在本机把开头画面、配音与字幕实时合成的（不调视频平台、不占一次生成），'
      + '按「开始拍」才会真的生成视频 —— 上面那格里的「拍这一段」也可以。</div>'; return; }
    /* 定点刷新（D3）：每条进度文案变化都会走 sayShot → paintShotState → renderTakes，
       而进度只改 `t.stage` 一个字。以前这一格**每次都整列重建**：innerHTML 全换、
       全部 [data-ti] 重绑、Dropdowns.build(box)，最后还 `bindSideCtl($('side'), sh)`
       —— 那一下要扫整个右栏（262 行 / 约 103 个标签）并重挂每个 [data-a] 的 onclick。
       每 4 秒把整个右栏扫一遍重接一遍，而实际只有一行状态字变了。
       签名没变（条数/状态/选中/有无画面/有无错误都一样）且 DOM 行数对得上 → 只改 .st 文本；
       只要有任何结构变化，照样走下面的完整重建（那条路把 bindSideCtl 补上，见末尾那段注释）。 */
    const sig = takesStructSig(takes);
    const rows = box.querySelectorAll('[data-ti]');
    if (sig === takesSig && rows.length === takes.length) {
      rows.forEach(el => {
        const t = takes[Number(el.dataset.ti)];
        const st = el.querySelector('.st');
        if (t && st) st.textContent = t.state === 'done' ? '已出画面' : stateCn(t);
      });
      return;
    }
    takesSig = sig;
    box.innerHTML = takes.map((t, i) => {
      /* 没选中的那几条也把**失败原因**露出来。以前只有当前那条展开详情，
         列表里清一色一句「没拍成」—— 到底是平台报错、素材没送上去、还是报了别的什么，
         要一条条点过去才知道，而「第 2 次为什么失败」恰恰是决定要不要改台词的依据。 */
      /* 正在跑的那一次给一条「不等了」：原来只能等满 15 分钟或关掉网页，
         而关掉网页回来 resumePending 又要接着等 —— 用户没有任何出路。 */
      const running = !!(t.taskId && !t.abandoned && t.state !== 'done' && t.state !== 'failed');
      /* 「接的是上一段末帧还是本段开头画面」以前只记在数据里、界面上一个字都没有：
         取不到上一段末帧时会悄悄改用本段开头画面拍，成片衔接断掉了人却查不到。 */
      const chain = t.applied && t.applied.chained
        ? `<span class="ch" title="这一条开头画面的来源">接：${D.esc(t.applied.chained)}</span>` : '';
      /* 这一次真的发给视频 AI 的素材（用途名）。右栏那排芯片说的是**现在**这份数据，
         「上一次拍的时候三视图带上了没有」问的是那一次 —— 数据层拍的时候记，这里照实摆。 */
      const mats = t.applied && t.applied.mats && t.applied.mats.length
        ? `<span class="ch" title="这一次发出去的素材：${D.esc(t.applied.mats.join('、'))}">素材 ${t.applied.mats.length} 项</span>` : '';
      /* 出了画面就摆一条「⬇」：以前要把某一段单独拿去用，只能导出整集（几十秒的渲染）再从成片里裁，
         而这一条本来就是一段成片。名字由 D.Pipe.takeName 统一拼（哪一集·哪一段·第几次）。 */
      const dl = (t.state === 'done' && (t.videoUrl || t.video))
        ? `<button class="dr-takex sq" data-a="dltake" data-tid="${D.esc(t.id || '')}" title="把这一条单独下载成一个 mp4">${ic('download', 13)}</button>` : '';
      return `<div class="dr-take${i === takeIdx ? ' on' : ''}" data-ti="${i}">
        <span class="no">第 ${t.no} 次</span>
        <span class="st">${D.esc(t.state === 'done' ? '已出画面' : stateCn(t))}</span>
        ${chain}${mats}
        ${dl}
        ${running ? `<button class="dr-takex" data-a="abandon" data-tid="${D.esc(t.id || '')}" title="不等这一条了：去平台撤单，撤不掉也先把手松开">不等了</button>` : ''}
        <button class="dr-takedel iconbtn" data-a="deltake" data-tid="${D.esc(t.id || '')}" title="删掉第 ${t.no} 次拍摄">${ic('trash', 12)}</button>
      </div>` + (i === takeIdx ? takeDetail(t)
        : (t.error ? `<div class="dr-why">${D.esc(String(t.error).slice(0, 120))}</div>` : ''));
    }).join('');
    box.querySelectorAll('[data-ti]').forEach(el => el.onclick = () => { takeIdx = Number(el.dataset.ti); renderSide(); renderSegs(); paintStage(); });
    /* 武装态按 takeId 挂回来：这一列每次进度回调都整块重画（见 paintShotState），
       不挂回来的话「再点一下就真删」永远等不到第二次点击。 */
    Confirm.restoreArmed(k => box.querySelector('[data-a="deltake"][data-tid="' + k + '"]'));
    /* 「再来 N 次」走公共下拉组件（原来是裸 select + 一串行内样式） */
    Dropdowns.build(box);
    /* 上面刚把这一列整块换掉了 —— 新节点的 onclick 是空的，而这一列里的
       ⬇ / 不等了 / ✕ / 再重拍一次 全靠 `bindSideCtl` 统一接线（它绑的是 `#side` 里所有 [data-a]）。
       `renderSide` 本来就是「先 renderTakes 后 bindSideCtl」，但另外两条路不是：
         · `paintShotState`（每次进度回调 sayShot 都走）只调 renderTakes；
         · `refreshShot` 是 paintSlots（里面已经绑过一次）→ renderTakes 又把节点换掉。
       于是每拍完一条、每次进度刷新，那几个按钮都是死的：点第一下没反应，
       点击冒泡到外层 `[data-ti]` 那一行 → `renderSide()` → 这才重新绑上，**第二下才生效**。
       补在这里 = 任何重建这一列的路径都必然绑完；不在这里另写一份绑定，就是把同一个接线做两遍。 */
    const side = $('side');
    if (side) bindSideCtl(side, sh);
  }
  /* 这一条的详情：平台报了什么错、这一趟实际发出去的参数说明、以及「再拍」的口子。
     这里**不判断画面好不好** —— 一条片子像不像那个角色只有用户自己看得见，
     项目判了也只是一句没人能核对的结论，索性照实说平台给了什么。 */
  function takeDetail(t) {
    const sh = shOf(t);
    const left = takesLeft(sh);
    const others = ((sh && sh.takes) || []).filter(x => x.state === 'done').length;
    const warn = t.state === 'failed' ? `<div class="dr-box warn dr-mt8">
        <h4>⚠ 这一条没拍成</h4>
        <p>${others ? '已经有 ' + others + ' 条拍成了，' : ''}原因写在上面那一行。可以直接再重拍一次，也可以先改台词、换平台再试。</p>
        <div class="btn-row dr-row6">
          <button class="tool acc" data-a="reshoot" data-more="1" data-n="1" ${left ? '' : 'disabled title="已经拍到上限了"'}>再重拍一次</button>
          <span class="dr-more"><select id="moreTimes" title="再重拍几次">
            ${Array.from({ length: Math.max(1, left) }, (_, i) => `<option value="${i + 1}">再来 ${i + 1} 次</option>`).join('')}
          </select></span>
        </div>
        <p>每重拍一次都会再出一段画面，各自单独留在记录里；这一段最多 ${D.maxTakes()} 次，不要的那次可以在上面的记录里删掉再拍。</p>
      </div>` : '';
    return `<div class="dr-takedet">
      ${t.error ? `<div class="dr-why">${D.esc(t.error)}</div>` : ''}
      ${(t.notes || []).length ? `<div class="ui-hint">${D.esc(t.notes.join('；'))}</div>` : ''}
      ${warn}</div>`;
  }
  const shOf = t => (cur.shots || []).find(s => (s.takes || []).some(x => x.id === t.id)) || null;
  /* 把某一次拍摄单独下载成一个 mp4。
     地址取 D.Pipe.takeVideo（过期回源在那条链上，页面不自己拼），
     文件名走 D.Pipe.takeName（哪一集·哪一段·第几次，剧名里的保留字符也在那里洗掉）。
     走 Wb.save：先探一次 HTTP 再取字节，404 有一句人话，而不是浏览器静默失败。 */
  async function dlTake(sh, takeId) {
    const t = (sh.takes || []).find(x => x && x.id === takeId);
    if (!t) return toast('这一次已经不在了', 'err');
    const url = D.Pipe.takeVideo(cur, sh, t);
    if (!url) return toast('这一条现在没有画面（要么没拍成，要么地址过期了还没回源）—— 先在拍片记录里重拍或换一条', 'err');
    const name = D.Pipe.takeName(cur, sh, t) + '.mp4';
    try { await Wb.save(url, name); }
    catch (err) { toast('没下下来：' + ((err && err.message) || err), 'err', 6000); }
  }
  /* 删掉一次拍摄（拍片记录里那一行的 ✕）。**就地二次确认**：✕ 原地变成「真删?」，
     再点一下才真删 —— 拍片记录是连着删好几条的地方，每删一条弹一次窗会把列表节奏打断，
     而删完要接着看的那一条正好被窗挡在后面。
     本机存下来的那个视频文件不动（收藏、资产库、别的段可能还在用）——
     真正动数据的是 Drama.Shots.dropTake（连同把剩下几次的次序重排）。 */
  function delTake(sh, takeId, btn) {
    const ts = sh.takes || [];
    const t = ts.find(x => x && x.id === takeId);
    if (!t) return toast('这一次已经不在了', 'err');
    const no = t.no || 1;
    /* 「还在拍」这一条判据必须和 `Drama.Shots.dropTake`（drama.js）**一模一样** ——
       它与 `runningTakes` 都带 `&& !t.abandoned`，这里原来漏了：
       用户按过「不等了」（abandoned）之后数据层是放行的，界面却还拦着，
       于是弹出一句自相矛盾的话「第 N 次还在拍（不等了），等它有结果再删」——
       那一条**永远等不到结果**，于是这颗 ✕ 从此一直按不动。 */
    if (t.taskId && !t.abandoned && t.state !== 'done' && t.state !== 'failed') {
      return toast('第 ' + no + ' 次还在拍（' + (t.stage || '任务在平台上跑着') + '），等它有结果再删 —— 删了任务号就接不回来', 'err');
    }
    /* 只说**删了这一条会连带发生什么**，别的（文件不删）不在这几秒里说 */
    const note = sh.chosen === t.id
      ? '这一段现在选用的就是它 —— 删掉之后自动改用还剩下的最后一条通过记录。' : '';
    if (Confirm.arm(btn, '真删?', { key: takeId, note: note, ms: 4000 })) return;
    const r = D.Shots.dropTake(cur, sh.id, takeId);
    if (!r.ok) return toast(r.why, 'err');
    if (takeIdx > r.at) takeIdx--;
    const rest = (sh.takes || []).length;
    if (takeIdx > rest - 1) takeIdx = Math.max(0, rest - 1);
    stopPlayer();
    save(); renderSide(); renderSegs(); paintStage();
    toast('删掉了第 ' + r.removed + ' 次拍摄，剩下几次的次序已经重排');
  }

  /* 机位：这一段有哪些镜头可选（从它自己的镜头表里挑），选中就改这一段的机位描述。
     机位直接进视频提示词，所以别只显示一个词 —— 要连景别与运镜一起给。 */
  const CAMERAS = [
    { id: '固定镜头', desc: '镜头不动' },
    { id: '缓慢推近', desc: '景别从中景缓缓收到特写' },
    { id: '缓慢拉远', desc: '景别从特写缓缓退到全景' },
    { id: '手持跟随', desc: '跟着人物移动，带一点晃动' },
    { id: '固定特写', desc: '锁在人物脸上，不动' },
    { id: '过肩', desc: '越过一侧肩膀看对方的反应' },
    { id: '俯拍', desc: '自上而下，看清人物与地面的关系' },
  ];
  /* 机位从 CAMERAS 里挑一个 —— 这是「几个选项」，走公共层的 Confirm.choose，
     不再自己拼一排 .ui-pill（那一排的选中态、键盘操作、关闭又是一份实现）。
     **这一步现在只是补充**：真正能「看着图挑」的是候选图那一排（`camCandsHTML`）——
     文字只能让人知道 AI 会怎么拍，出图才看得出差别。 */
  async function pickCamera(sh) {
    /* 已经有候选图就直接跳到那一排 —— 出图是花钱的，藏在「点机位才看得到」后面等于白出。
       没有候选图时还是从 CAMERAS 那几档里挑一个词（不花钱、先给个方向）。 */
    const box = document.querySelector('.dr-cams');
    if ((sh.camCands || []).length && box) {
      box.scrollIntoView({ block: 'center', behavior: 'smooth' });
      box.classList.add('dr-hit');
      setTimeout(() => box.classList.remove('dr-hit'), 2600);
      return;
    }
    const cur2 = (sh.shots && sh.shots[0] && sh.shots[0].camera) || '';
    const v = await Confirm.choose({
      title: '机位',
      sub: '机位会写进这一段的视频提示词，AI 按它拍' + (cur2 ? '　·　现在用的是「' + cur2.split('，')[0] + '」' : '　·　这一段还没设机位')
        + '　·　想**看着图挑**，点下面那颗「出 N 个机位图」',
      options: CAMERAS.map(c => ({ label: c.id, hint: c.desc, value: c.id })),
      cancelLabel: '不改',
    });
    if (!v) return;
    applyCamera(sh, v);
  }
  /* 机位候选那一排（2026-10）。标记走 Drama.Cast.picCandsHTML 那一份（两页共用），
     只是这里的「用这一张」是 `usecam` 而不是 `usecand` —— 挑中一张机位图要写的是
     **这一段的镜头描述**，不是换某张素材图，写错了会静悄悄地把参考图换掉。
     出图张数读 `camN` 那一档（与素材候选分开设：机位是每段一次，成本量级不同）。 */
  function camCandsHTML(sh) {
    const n = candCount('camN');
    const busy = genHas('cam', sh.id);
    const now = (sh.shots && sh.shots[0] && sh.shots[0].camera) || '';
    const nowLabel = String(now).split('，')[0] || '';
    const list = (sh.camCands || []).filter(x => x && x.src);
    const tail = '<button class="ui-linkbtn" data-a="gencam"' + (busy ? ' disabled' : '') + '>'
      + (list.length ? '再出 ' + n + ' 个机位' : '出 ' + n + ' 个机位图') + '</button>';
    return (busy
      ? `<div class="ui-cands"><span class="lab">机位候选</span>${D.Cast.waitHTML(genMsg('cam', sh.id) || '正在出机位图…')}${tail}</div>`
      /* `attr: 'data-a'`：这一排摆在**右栏**，而右栏是 `bindSideCtl` 按 `data-a` 派发的。
         不写这一项就是 `data-act`（角色卡 / 素材库那边的那份），右栏一个都不接 ——
         表现是格子摆得好好的、点「用这一张」什么也不会发生。 */
      : D.Cast.picCandsHTML(list, '', { act: 'usecam', attr: 'data-a', label: '机位候选', name: '', tail: tail }))
      + (sh.camErr ? `<div class="ui-note err">这一批里有没出来的：${D.esc(String(sh.camErr).slice(0, 160))}</div>` : '')
      + (sh.camNote ? `<div class="ui-hint">机位图：${D.esc(String(sh.camNote).slice(0, 140))}</div>` : '')
      + (now ? `<div class="ui-hint">现在用的机位：<b>${D.esc(nowLabel)}</b>（来自上面的候选图，或在镜头里直接改）</div>` : '');
  }
  /* 出 N 张机位图。一次调用 = 一次文字 AI + N 次生图，都要钱，所以过 genRun 闸门并把
     逐张进度摆在段上（`onStage`）—— 中途失败要能看出是「文字 AI 没想到方案」还是「生图被拒」。 */
  async function genCameraCands(sh) {
    let made = 0, failed = 0, err = '';
    await genRun('cam', sh.id, '正在出机位图…', async () => {
      const r = await D.Pipe.drawCameras(REG, cur, sh, {
        onStage: m => genSet('cam', sh.id, m),
      });
      made = r.made || 0; failed = r.failed || 0;
    }, () => { save(); renderSide(); });
    if (failed) toast('出了 ' + made + ' 个机位，' + failed + ' 个没出来（' + (String(cur.shots.find(x => x && x.id === sh.id).camErr || '').slice(0, 120) || '原因不明')
      + '）—— 那一条写在机位候选下面', 'err', 7000);
  }
  /* 挑一个机位：把它那一句画面描述写进这一段的每一个镜头（applyCamera 那条路复用），
     同时把它那张图记成这一段的「机位参考图」—— 拍摄时它会跟着发过去，
     这样视频 AI 拍到的构图与用户在候选图里挑的是同一张。 */
  function applyCameraCand(sh, src) {
    const c = (sh.camCands || []).find(x => x && x.src === src);
    if (!c) return;
    sh.camShot = src;
    const cam = String(c.label || '').trim();
    sh.shots = sh.shots && sh.shots.length ? sh.shots : [{ desc: sh.openDesc || sh.title || '', camera: '', sec: 3 }];
    sh.shots.forEach(k => { k.camera = (cam ? cam + '，' : '') + String(c.desc || '').slice(0, 120); });
    save(); render(); toast('机位用「' + (cam || '这一张') + '」', 'ok');
  }
  /* 把机位写进这一段的每一个镜头（没有镜头就建一个） */
  function applyCamera(sh, camId) {
    const c = CAMERAS.find(x => x.id === camId);
    sh.shots = sh.shots && sh.shots.length ? sh.shots : [{ desc: sh.openDesc || sh.title || '', camera: '', sec: 3 }];
    sh.shots.forEach(k => { k.camera = camId + (c ? '，' + c.desc : ''); });
    save(); render();
    toast('机位改成「' + camId + '」');
  }

  /* 一句话让 AI 改这一段（参考产品那句「一句话让 AI 改这一段，比如「她更慌张一点」」）
     —— 一个输入框，走公共层的 PromptForm（自己拼 textarea 的话，「关掉时把节点 remove 掉、
     await 之后再 getElementById 取到 null」这一类坑还要再踩一次）。 */
  async function aiFixShot(sh) {
    const typed = (($('fixHint') || {}).value || '').trim();
    const out = await PromptForm.open({
      title: '一句话让 AI 改这一段',
      sub: '会改这一段的开头画面描述与镜头描述，台词不动',
      okLabel: '让 AI 改',
      fields: [{ key: 'q', type: 'textarea', value: typed,
        placeholder: '比如：这一位更慌张一点 / 镜头再近一些 / 灯光更冷',
        hint: '写一句就行。改完可以直接重拍这一段看效果。' }],
      validate: v => v.q ? '' : '先写一句你想改什么',
    });
    if (!out) return;
    const q = out.q;
    const ok = await genRun('fix', sh.id, 'AI 正在按你说的改这一段…', async () => {
      const old = {
        open: sh.openDesc || '', 镜头: (sh.shots || []).map(k => k.desc + (k.camera ? '（' + k.camera + '）' : '')).join('；'),
      };
      /* 指令在 `TextAI.DEF.drama_retouch`（设置页「拍短剧 · 拍摄与画面」里能改）。
         它要的是 JSON，页面按 `TextAI.parseJson` 解 —— 指令里那句「只输出 JSON」是**契约**，
         用户改的时候得留着，所以设置页那一格的说明里写明了。 */
      const sys = TextAI.prompt('drama_retouch');
      const txt = await TextAI.chat(REG, sys, '当前写法：\n' + JSON.stringify(old) + '\n\n修改要求：' + q, {});
      const parsed = (window.TextAI && TextAI.parseJson) ? TextAI.parseJson(txt) : null;
      if (!parsed || !parsed.openDesc) throw new Error('AI 没给出可用的改法（' + String(txt || '').slice(0, 60) + '…）');
      sh.openDesc = String(parsed.openDesc).slice(0, 400);
      if (Array.isArray(parsed.shots) && parsed.shots.length) {
        sh.shots = parsed.shots.slice(0, 5).map(k => ({ desc: String(k.desc || '').slice(0, 200),
          camera: String(k.camera || '').slice(0, 60), sec: Math.max(1, Math.min(10, Number(k.sec) || 3)) }));
      }
      save();
    }, () => renderSide());
    if (ok) toast('改好了，觉得不对可以直接重拍这一段');
  }

  async function sideAct(sh, a, el, ev) {
    try {
      if (a === 'subtoggle') {
        /* 展开 / 收起这一镜。只记一个展开项：这一段最多五镜，全展开会把右栏撑成一篇长文，
           而用户一次只会盯着一镜改。改的是哪一镜要看得见 —— 收起时标题那行就写着景别·机位·秒。 */
        const k = Number(el.dataset.k);
        const key = sh.id + ':' + k;
        openShotKey = openShotKey === key ? '' : key;
        paintSubShots(sh);
        return;
      }
      if (a === 'subai') {
        const k = (sh.shots || [])[Number(el.dataset.k)];
        if (!k) return;
        const was = String(k.desc || '');
        if (!was.trim()) return toast('这一镜还没写画面，先写一句再让 AI 改', 'err');
        const sc = (cur.scenes || []).find(x => x && x.id === sh.sceneId) || {};
        el.disabled = true;
        try {
          /* 指令在 `TextAI.DEF.drama_subshot`（设置页可改）。`{size}` `{camera}` 传的是
             用户已经选定的值 —— 模型照抄即可，程序随后把它们原样拼在描述后面，
             两边各写一套就会出现「下拉里选的中景、提示词里写的是特写」。 */
          const one = await TextAI.chat(REG,
            D.Pipe.fillTpl(TextAI.prompt('drama_subshot'), {
              desc: was,
              size: k.size || '（用户还没定）',
              camera: k.camera || '（用户还没定）',
              sec: k.sec ? String(k.sec) : String((D.Pipe.shootFields(REG, cur, sh) || {}).dur || ''),
              cast: (sh.chars || []).map(id => ((cur.characters || []).find(c => c && c.id === id) || {}).name || '').filter(Boolean).join('、') || '（无）',
              scene: sc.desc || sc.name || '（无）',
            }),
            was + '\n场景：' + (sc.desc || sc.name || ''), {});
          const t = String(one || '').trim().replace(/^["'「]|["'」]$/g, '');
          if (t.length < 4) { toast('AI 这次没给出能用的句子，保持原样', 'err'); return; }
          k.desc = t; save(); paintSubShots(sh);
          toast('改好了，觉得不对可以直接在框里改回来');
        } finally { el.disabled = false; }
        return;
      }
      if (a === 'startimg' || a === 'endimg' || a === 'addref') {
        /* 参考图的张数上限 / 收什么类型都来自当前视频模型的声明（D.Pipe.refRule），
           以前这里写死 multiple + 最多 4 张 + slice(0,4)，三个数都是本项目自己编的。 */
        const rl = a === 'addref' ? (D.Pipe.refRule(REG, cur) || { max: 0 }) : null;
        const room = rl ? rl.max - (sh.refImgs || []).length : 0;
        if (rl && !rl.max) return toast('当前选的视频模型不收参考图（没声明这一项）—— 加了也不会带上', 'err');
        if (rl && room <= 0) return toast('参考图已经满了（这个模型最多 ' + rl.max + ' 张）', 'err');
        const got = await AssetPicker.open({ types: ['图片'], multiple: room > 1, limit: room || 1,
          rule: a === 'addref' ? Object.assign({}, rl, { max: room }) : undefined,
          title: a === 'startimg' ? '选开头画面' : a === 'endimg' ? '选结尾画面' : '加参考图' });
        if (!got || !got.length) return;
        if (a === 'startimg') { sh.startImg = got[0].src; sh.openErr = ''; }
        else if (a === 'endimg') sh.endImg = got[0].src;
        else sh.refImgs = (sh.refImgs || []).concat(got.map(x => x.src)).slice(0, rl.max);
        save(); refreshShot(sh);
      }
      else if (a === 'delref') {
        (sh.refImgs || []).splice(Number(el.dataset.ri), 1);
        save(); renderSide();
      }
      /* 从这一段移走一位角色：只是这一段不再有他，**不删角色**（脸上的图、声音、台词都留着）。
         **要二次确认**（用户要求）：以前点一下就走，而这一格是 44px 的圆 + 10px 的 ✕，
         手指一滑人就没了，唯一的补救是翻上面那个下拉再手动加回来 —— 一次误触变成两趟操作。
         用**原地武装**而不是弹窗：这一步不丢任何东西、也没有要选的（判据与 delChar 同源：
         会丢 → 弹窗给出路；不会丢 → 原地武装），弹窗只会平白打断。
         badge 模式：武装的那几秒那张脸必须原样留着（arm 默认用 textContent 覆盖）。
         台词不跟着删：配音是按 whoId 找嗓子的，whoId 不在出场名单里照样找得到（见 dropChar 的注释）。 */
      else if (a === 'delcast') {
        const id = el.dataset.ci;
        const c = (cur.characters || []).find(x => x && x.id === id);
        const nm = (c && c.name) || '这一位';
        const seg = '第 ' + (sh.no || '?') + ' 段';
        if (Confirm.arm(el, '移出', {
          key: 'delcast:' + (sh.id || '') + ':' + id, badge: true,
          hint: '再点一次就把「' + nm + '」从' + seg + '的出场名单移走'
            + '（角色还在本集里，脸与声音都没动）· 点别处或过一会儿自动取消',
        })) return;
        sh.chars = (sh.chars || []).filter(x => x !== id);
        save(); renderSide();
        toast('「' + nm + '」从' + seg + '移走了（角色还在本集里，脸与声音都没动；要加回来用上面那个下拉）');
      }
      else if (a === 'camera') await pickCamera(sh);
      /* 机位候选那两个动作：出 N 张 / 挑一张（挑中的那张还会作这一段的机位参考图）。 */
      else if (a === 'gencam') await genCameraCands(sh);
      else if (a === 'usecam') applyCameraCand(sh, el.dataset.src);
      /* 画失败之后**必须还有一条重画的路**：以前只能回上一步按「出预演」（整轮），
         而那一段的空格子点下去开的是素材库 —— 库里没有图就是一条死路，
         界面上只剩一个不知道为什么会空的方块。 */
      else if (a === 'redoopen') await genRun('open', sh.id, '正在重画第 ' + sh.no + ' 段的开头画面…',
        async () => { await paintOpenImg(sh, cur); save(); },
        () => { paintSlots(sh); paintSeg(sh); });
      else if (a === 'aifix') await aiFixShot(sh);
      else if (a === 'aiopt2') {
        await genRun('opt', sh.id, 'AI 正在优化开头画面描述…', async () => {
          /* 指令在 `TextAI.DEF.drama_open`（以前是这行里写死的一句话，用户改不到）。 */
          sh.openDesc = await TextAI.chat(REG,
            D.Pipe.fillTpl(TextAI.prompt('drama_open'), {
              desc: sh.openDesc || sh.title || '',
              cast: (sh.chars || []).map(id => ((cur.characters || []).find(c => c && c.id === id) || {}).name || '').filter(Boolean).join('、') || '（无）',
              scene: (((cur.scenes || []).find(s => s.id === sh.sceneId) || {}).desc || ''),
            }),
            (sh.openDesc || sh.title) + '\n场景：' + (((cur.scenes || []).find(s => s.id === sh.sceneId) || {}).desc || ''), {});
          save();
        }, () => paintText($('side'), 'openDesc', sh.openDesc));
      }
      else if (a === 'shoot1') await shootOne(sh, 1, false);
      /* 这里不能写裸的 `side`：renderSide 里的同名 const 不在这个函数作用域内，
         现在能跑只是因为浏览器把 id="side" 挂成了隐式全局（window.side）—— 换个 id 就 ReferenceError。 */
      else if (a === 'reshoot') {
        /* 次数只认**这个按钮自己**的那一份，两处绝不串台：
           · 详情块里的「再重拍」与「再来 N 次」下拉挨在一起（按钮带 data-more）—— 下拉显式选了几次就几次；
           · 段标题上的「重拍这段」是另一个按钮，它身上写的是 data-n。
           以前两个按钮都去读 #moreTimes：用户在某一条里选了「再来 3 次」，回头点段标题那个按钮
           就凭空多开两条真任务 —— 那不是「重拍这一段」，是替用户决定花三份钱。 */
        const sel = el && el.dataset.more ? document.getElementById('moreTimes') : null;
        const n = sel ? (Number(sel.value) || 1) : (Number(el && el.dataset.n) || 0);
        /* 一次开 N 条 = 各自一条真任务、各自计费。开之前说清楚，别让「重拍这段」四个字
           悄悄变成 N 倍账单（一次拍完也是这一段反复重拍的本意，所以不禁，只是不许默认发生）。 */
        if (n > 1 && !await Confirm.ask({
          title: '这一段一次拍 ' + n + ' 次？',
          /* 纯文本：Confirm.ask 的正文走 textContent，写 <b> 会原样显示成一串标签 */
          body: '每一次都会单独开一条任务、各出一段画面，一共 ' + n + ' 条。拍完在下面的「拍片记录」里能逐条删掉重拍。',
          okLabel: '就拍 ' + n + ' 次',
        })) return;
        if (n > 0) return await shootOne(sh, n, false);
        /* 走到这里 = 这一格没写还剩几次：按 1 次拍，但**说一声**，别让用户以为拍了 N 次 */
        toast('这一格没写还能拍几次，先按 1 次拍；要一次拍几遍，用这一条展开后的「再重拍」', 'err');
        return await shootOne(sh, 1, false);
      }
      else if (a === 'deltake') {
        /* 拍片记录里那一行的 ✕：这一格是「查看/切换这一条」，点 ✕ 不该顺手把选中态也换掉。
           传 el 是为了就地二次确认把它自己变成「真删?」。 */
        if (ev && ev.stopPropagation) ev.stopPropagation();
        delTake(sh, el && el.dataset.tid, el);
      }
      else if (a === 'dltake') {
        if (ev && ev.stopPropagation) ev.stopPropagation();
        await dlTake(sh, el && el.dataset.tid);
      }
      else if (a === 'abandon') {
        if (ev && ev.stopPropagation) ev.stopPropagation();
        const r = await D.Shots.abandon(REG, cur, sh.id, el && el.dataset.tid);
        if (!r.ok) return toast(r.why, 'err');
        save();
        /* 撤单不保证成功（有的平台压根没有这个接口）—— 撤不掉就照实说，
           别让「不等了」在界面上看着像「平台上那条已经没了」。 */
        if (r.note) toast(r.note, 'err', 6000);
        else toast(r.cancelled ? '不等了，那条任务已经在平台上撤单' : '不等了', 'ok');
        renderSide(); renderSegs(); paintStage();
      }
      else if (a === 'addline') {
        const who = (cur.characters || [])[0];
        /* whoId 一起写上：配音是按 whoId 找人挑音色的（只写名字就是一句没嗓子的台词） */
        sh.lines = sh.lines || []; sh.lines.push({ who: who ? who.name : '旁白', whoId: who ? who.id : '', text: '' });
        save(); renderSide();
      }
      /* ---------- 这一段本身的位置 / 份数 / 去留（数组顺序就是成片顺序，Drama.Shots 只动数据） ---------- */
      else if (a === 'moveup' || a === 'movedn') {
        const r = D.Shots.moveShot(cur, sh.id, a === 'moveup' ? -1 : 1);
        if (!r.ok) return toast(r.why, 'err');
        shotIdx = r.at; takeIdx = 0;
        save(); render();
        toast('这一段现在是第 ' + (r.at + 1) + ' 段（成片就按这个顺序拼）');
      }
      else if (a === 'dupshot') {
        const r = D.Shots.duplicateShot(cur, sh.id);
        if (!r.ok) return toast(r.why, 'err');
        shotIdx = r.at; takeIdx = 0;
        save(); render();
        toast('复制到第 ' + (r.at + 1) + ' 段了 —— 带过来的是写法（画面描述、台词、镜头、参考素材），'
          + '这一段还没拍过，要画面就按「拍这一段」', 'ok');
      }
      else if (a === 'delshot') {
        /* 正在本机这一轮里跑着的那一段（画开头画面 / 配音 / 拍摄）先不给删 ——
           这一层是**页面自己的账**（genHas），数据层看不到；而平台任务号那种在跑的
           由 dropShot 自己拒（与 dropTake / remove 同一判据）。两处都拦得住，才谈得上
           「就地确认」可以不给弹窗。 */
        const inflight = ['open', 'dub', 'shoot'].find(k => genHas(k, sh.id));
        if (inflight) {
          return toast('第 ' + sh.no + ' 段现在还在跑（' + (genMsg(inflight, sh.id) || '正在生成')
            + '）—— 先按底栏「停下」或等它出结果，删了就接不回来了', 'err', 6000);
        }
        const shots = (sh.takes || []).filter(t => t && (t.video || t.videoUrl)).length;
        const last = (cur.shots || []).length <= 1;
        /* 就地二次确认：按钮原地变成「确认删掉」，再点一下才真删。
           后果只写这次删除**真正会连带发生**的：连带几条拍摄、是不是最后一段。 */
        const note = (shots ? '会连带去掉它拍过的 ' + shots + ' 条（本机文件不动，收藏与资产库里的还在）。' : '')
          + (last ? '这是最后一段 —— 删掉之后这一集就没有段落了。' : '');
        if (Confirm.arm(el, last ? '确认删掉（全剧最后一段）' : '确认删掉', { note: note })) return;
        const r = D.Shots.dropShot(cur, sh.id);
        if (!r.ok) return toast(r.why, 'err');
        shotIdx = (cur.shots || []).length ? Math.max(0, r.at) : 0; takeIdx = 0;
        stopPlayer();
        save(); render();
        toast('删掉了第 ' + r.removed + ' 段，后面的段号已经接着排好');
      }
    } catch (e) { toast(e.message, 'err'); render(); }
  }

  /* ---------- 舞台 / 播放（预演 = 画面 + 配音 + 字幕，本机实时合成） ---------- */
  /* 「整集连放」：把**已经拍出来的那些段**按段号连着放一遍（2026-10 用户要求：
     「拍成片界面应该展示 ai 生成后的实际生成后的视频」）。
     以前第 4 步只能一段一段点着看，段落条一长就找不到「整集长什么样」——
     而导出成片要跑几十秒的 ffmpeg，看一眼还得先渲一遍。
     这里**只播平台出的原片**（不混配音、不烧字幕进画面，字幕仍走舞台上那一行），
     与导出成片是两条路：导出那份是**渲出来的一个文件**（混音、烧字幕、拼接），
     连放只是把已有的原片接起来看，两者不能互相顶替。
     没拍的那几段照常在列表里标着「还没拍」—— 连放只走有画面的段，不拿预演画面凑数。 */
  let allList = [], allAt = -1, allOn = false;
  const playedShots = () => (cur.shots || []).filter(sh => {
    const t = takeAt(sh);
    return sh && t && t.videoUrl && t.state !== 'failed';
  });
  function playAll() {
    allList = playedShots();
    if (!allList.length) { toast('还没有拍出来的段 —— 先点「开始拍」或拍某一段', 'err'); return; }
    const miss = (cur.shots || []).length - allList.length;
    allAt = 0; allOn = true;
    gotoIdx(cur.shots.indexOf(allList[0]));
    stageMedia();
    const v = $('vid');
    if (v) v.play().catch(() => {});
    toast('整集连放：' + allList.length + ' 段' + (miss ? '（还有 ' + miss + ' 段没拍，跳过了）' : ''), 'ok', 4200);
  }
  function stopAll() { allOn = false; allAt = -1; }
  /* 连放时舞台跟着换段：段号、`#side` 那一条高亮、时间轴与字幕全部跟着切。
     `gotoIdx` 走的是段落条那一条现成的路（`renderSegs` / `renderSide` 都重画），
     别在这里自己再写一份「切段」—— 两份切法迟早有一处漏掉高亮。 */
  function gotoIdx(i) {
    if (i < 0 || i >= (cur.shots || []).length) return;
    shotIdx = i; renderSegs(); renderSide();
  }
  function stageMedia() {
    const sh = curShot(), box = $('stageMedia'); if (!box || !sh) return;
    const t = takeAt(sh);
    /* 正在播的那一条不要动：重画会重建 <video>，片子从头开始
       （「画面闪一下又回到开头」就是这么来的）。 */
    if (autoplay && box.querySelector('video')) return;
    /* 判据是「这一段有没有拍出画面」，**不是** cur.step === 3。
       原来写 `!isPreview()`：第 3 步（看预演）永远算预演，于是「拍这一段」花五分钟、真的花钱拍出来，
       舞台还是那张开头画面，用户看不到刚才拍的那条 —— 得先切到第 4 步才看得到。
       「点一下拍完却没反应」是这一页最贵的一种体验问题，而它只是一行多余的 step 判断。
       预演仍然在：这一段还没拍过时走下面那段（开头画面 + 配音 + 字幕，本机实时合成）。 */
    if (t && t.videoUrl && t.state !== 'failed') {
      /* 地址取用只走 Drama.Pipe.takeVideo（它与导出、EDL 用的是同一份），页面不自己读 videoUrl */
      box.innerHTML = `<video id="vid" playsinline preload="metadata" src="${D.esc(D.Pipe.takeVideo(cur, sh, t))}"></video>`;
      const v = $('vid');
      v.ontimeupdate = () => { playerT = v.currentTime; paintSubs(t); paintTime(v.duration || t.sec); };
      v.onloadedmetadata = () => paintTime(v.duration);
      v.onplay = () => { autoplay = true; };
      v.onpause = () => { autoplay = false; };
      /* 整集连放：这一段放完就接着下一段（`allList` 只装已经拍出画面的段）。
         手动点「下一段」或按 → 也会顺带退出连放 —— 那是「我想自己看某一段」的意思，
         留着连放状态就���被强行拽回下一段。 */
      v.onended = () => {
        iconSet($('cPlay'), 'play', 15);
        if (!allOn) return;
        if (allAt + 1 >= allList.length) { stopAll(); autoplay = false; toast('整集放完了', 'ok'); return; }
        allAt++;
        const nx = allList[allAt];
        if (!nx) { stopAll(); return; }
        gotoIdx(cur.shots.indexOf(nx));
        autoplay = false;                 // 让 stageMedia 真的重建 <video>（它见到 video 就直接返回）
        stageMedia();
        const nv = $('vid');
        if (nv) { nv.play().catch(() => { toast('浏览器拦了自动播放，点一下播放键', 'err'); }); }
      };
      sh.__total = t.sec || sh.wantSec || 8;
      return;
    }
    /* 预演：静态开头画面 + 字幕轨（配音齐了就连着播） */
    /* 这一段没拍出画面，而连放正开着：把连放停掉并说明**为什么停**。
       静默停掉的表现是「连放到一半画面卡住了」，用户以为是视频坏了。 */
    if (allOn) { stopAll(); toast('连放在这一段停了：它还没有拍出画面', 'ok', 3600); }
    const subs = (t && t.lines && t.lines.length) ? D.Subs.takeSubs(sh, t) : D.Subs.previewSubs(sh);
    const total = subs.length ? subs[subs.length - 1].end + 0.4 : (sh.wantSec || 8);
    box.innerHTML = sh.startImg ? `<img id="vidImg" src="${D.esc(Api.mediaSrc(sh.startImg))}">`
      : (genHas('open', sh.id) ? waitHTML('这一段的开头画面正在画\n画好会自动出现在这里')
        : '<div class="dr-noimg">还没画开头画面</div>');
    sh.__subs = subs; sh.__total = total;
  }
  /* 字幕轨缓存 + 逐帧早退（D4）。`D.Subs.takeSubs` 每次都新建一个数组和一批新对象，
     于是「这一帧该显示的那一句与上一帧是不是同一句」根本没法比 —— 对象每次都是新的，
     结果就是**每一帧都无条件 `el.innerHTML = …`**（浏览器重新 parse 字符串、拆节点、换 DOM），
     60 Hz 不间断，而绝大多数帧的台词一个字都没变。这里做两件事：
       ① 按内容指纹缓存字幕轨 —— 只有台词/说话人/时间轴真的变了才重算；
       ② 记住上一帧那个 `hit` 的**引用**，同一个就直接 return，不碰 DOM。
     指纹只取真正决定字幕的那几个字段；真实数据单段最多 5 句，这点成本远小于一次 innerHTML 解析。
     §J：字幕轨推算仍然只有 `D.Subs` 这一份，这里只是把它**算一次**再多次读，没有另写一份。 */
  let subsKey = '', subsCache = [];
  const subsFp = arr => (arr || []).map(l => [l.text || '', l.who || '', l.start, l.end, l.dur].join('\u0001')).join('\u0002');
  let lastSubHit = null;
  function paintSubs(t) {
    const el = $('subs'); if (!el) return;
    const sh = curShot(); if (!sh) return;
    const useTake = !!(t && t.lines && t.lines.length);
    const key = sh.id + '|' + (t ? t.id : '') + '|' + (useTake ? 'T' + subsFp(t.lines) : 'S' + subsFp(sh.lines));
    let subs;
    if (key === subsKey) subs = subsCache;
    else { subsKey = key; subs = subsCache = useTake ? D.Subs.takeSubs(sh, t) : (sh.__subs || D.Subs.previewSubs(sh)); }
    const hit = D.Subs.activeAt(subs, playerT);
    if (hit === lastSubHit) { el.hidden = !hit; return; }     // 同一句：一个字都不改
    lastSubHit = hit;
    if (!hit) { el.hidden = true; return; }
    el.hidden = false;
    el.innerHTML = (hit.speaker ? `<span class="who">${D.esc(hit.speaker)}：</span>` : '') + D.esc(hit.text);
  }
  const mmss = s => String(Math.floor((s || 0) / 60)).padStart(2, '0') + ':' + String(Math.floor((s || 0) % 60)).padStart(2, '0');
  function paintTime(dur) { const el = $('tm'); if (el) el.textContent = mmss(playerT) + ' / ' + mmss(dur || (curShot() || {}).__total || 0); }
  function paintStage() {
    const sh = curShot(), t = sh ? takeAt(sh) : null;
    stageMedia();
    const badge = $('stageBadge');
    if (badge) {
      /* 角标跟着舞台**真正在放什么**说话（判据与 stageMedia 同一份：有没有拍出画面）：
         原来只看 step，第 3 步哪怕刚拍完也压着「先画一张开头画面，再看预演」——
         片子就在那儿，角标却说没有。 */
      if (t && t.videoUrl && t.state !== 'failed') { badge.hidden = true; }
      else if (t && t.state === 'failed') { badge.hidden = false; badge.textContent = '这一段还没拍好'; }
      else if (isPreview()) { badge.hidden = false; badge.textContent = sh && sh.startImg ? '预演：开头画面 + 配音 + 字幕（本机合成）' : '先画一张开头画面，再看预演'; }
      else { badge.hidden = true; }
    }
    paintSubs(t); paintTime();
  }
  function bindStage() {
    /* 三个走带按钮点完就 blur：快捷键**只认焦点所在**（下面的规则③），
       不 blur 的话点完「下一段」焦点还留在那颗钮上，接着按空格会去重新点它而不是播放 ——
       用户看着就是「空格没反应」。 */
    const tb = b => { b.onclick = () => { b.blur(); togglePlay(); }; };
    tb($('cPlay')); tb($('playBtn'));
    const nb = (b, d) => { b.onclick = () => { b.blur(); gotoShot(d); }; };
    nb($('cPrev'), -1); nb($('cNext'), 1);
    /* 「整集连放」：再点一下就是停。手动按 ← → 时 `gotoShot` 里也会退掉连放状态
       （那是「我想自己看某一段」的意思），所以这里只需要管这一颗钮。 */
    const ab = $('cAll');
    if (ab) ab.onclick = () => { ab.blur(); if (allOn) { stopAll(); stopPlayer(); paintStage(); toast('整集连放停了'); } else playAll(); };
    bindStageKeys();
    paintStage();
  }
  /* 切到第 i 段：到头/到尾就**停在原地**，不发提示也不弹窗（连着按 ← 是在倒着看片，
     每次到头都吵一下等于没法用）。 */
  function gotoShot(dir) {
    /* 手动切段 = 用户要自己看某一段，连放就该让位。不退的话会在下一段结束时
       把他拽回连放队列里 —— 「我按了下一段，它自己又跳回去了」。 */
    if (allOn) { stopAll(); }
    stopPlayer();
    const n = (cur.shots || []).length;
    const j = Math.max(0, Math.min(n - 1, shotIdx + dir));
    if (j === shotIdx) return;
    shotIdx = j; takeIdx = 0; render();
  }
  /* 舞台快捷键：空格 = 播放/暂停，← / → = 上/下一段。
     四条放行规则，缺一条就会变成最招人烦的那几种毛病：
     ① 焦点在能打字的地方（input / textarea / select / contenteditable）一律放行 ——
        那正是用户要改画面描述、台词、场景下拉的时候；输入框里敲空格本来就该是空格，
        在 <select> 上按方向键更是在换选项，不是切段。中文选词上屏那一下还会再触发一次
        keydown，所以 isComposing / keyCode 229 也要放行。
     ② 带 Ctrl / Alt / Meta 一律放行：那是浏览器与系统的，不该被页面抢走。
     ③ 焦点在 button / a / summary 上也放行：空格与回车是「激活这个控件」的键。
        刚点过「删掉这一次」时焦点正落在那颗钮上 —— 那时按空格应该是**确认删除**，
        被这里抢去播放的话，这个最要命的交互就被悄悄改掉了。
     ④ 灯箱开着、或有 <dialog> 弹窗（确认框 / 前置条件清单）时一律放行：
        ← → 在灯箱里是**翻候选**，两处一起响应就是「翻着候选、背后的段也换了」。
     绑定在 document 上（舞台是可点区域不是可聚焦控件），只在舞台真的存在时才有意义
     —— 第 1、2 步没有舞台，所以每一步都要重新绑一次。 */
  function bindStageKeys() {
    document.onkeydown = e => {
      if (e.isComposing || e.keyCode === 229) return;
      if (e.ctrlKey || e.altKey || e.metaKey) return;
      const a = document.activeElement;
      if (a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.tagName === 'SELECT'
        || a.tagName === 'BUTTON' || a.tagName === 'A' || a.tagName === 'SUMMARY' || a.isContentEditable)) return;
      if (!cur || !$('stage')) return;
      if (window.Wb && Wb.lightbox && Wb.lightbox.isOpen()) return;
      if (document.querySelector('dialog[open]')) return;
      if (e.key === ' ' || e.key === 'Spacebar') { e.preventDefault(); togglePlay(); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); gotoShot(-1); }
      else if (e.key === 'ArrowRight') { e.preventDefault(); gotoShot(1); }
    };
  }
  function togglePlay() { autoplay ? stopPlayer() : startPlayer(); }
  /* 预演时间轴按**真实时间**走（performance.now 的帧间隔）。以前是每帧 +0.05 秒 ——
     60Hz 屏上等于 3 倍速：字幕提前换、配音还没念完字就跳下一句。 */
  function startPlayer() {
    const sh = curShot(); if (!sh) return;
    autoplay = true;
    iconSet($('cPlay'), 'pause', 15);
    $('playBtn').style.display = 'none';
    playerT = playerT || 0;
    playerClock = performance.now();
    const tick = now => {
      if (!autoplay) return;
      const total = (curShot() || {}).__total || 8;
      playerT += Math.min(0.25, (now - playerClock) / 1000);
      playerClock = now;
      if (playerT >= total) { playerT = 0; if (isPreview()) playPreviewAudio(); }
      paintSubs(takeAt(curShot()));
      paintTime(total);
      playerTimer = requestAnimationFrame(tick);
    };
    cancelAnimationFrame(playerTimer); playerTimer = requestAnimationFrame(tick);
    if (isPreview()) playPreviewAudio();
  }
  function stopPlayer() {
    autoplay = false; cancelAnimationFrame(playerTimer);
    /* 时间轴归零：切段 / 换一条 / 整页重画都走这里。以前留着上一段的进度 ——
       看完第 3 段 6 秒再切到没成片的第 5 段按 ▶，预演从中段开始、字幕整段错位。 */
    playerT = 0;
    stopPreviewAudio();
    const v = $('vid'); if (v) v.pause();
    iconSet($('cPlay'), 'play', 15);
    const p = $('playBtn'); if (p) p.style.display = '';
  }
  function stopPreviewAudio() {
    previewTimers.forEach(clearTimeout); previewTimers = [];
    previewAudios.forEach(a => { try { a.pause(); } catch {} }); previewAudios = [];
  }
  /* 预演的配音按**每句的真实起点**排着放（take.lines 里每句都有 start/audio —— 字幕轨就是按它们排的）。
     以前只放第一句，后面的台词全没声，「预演 = 画面 + 配音 + 字幕」只剩画面和字幕在动。 */
  function playPreviewAudio() {
    stopPreviewAudio();
    const sh = curShot(), t = sh ? takeAt(sh) : null;
    if (!t || !t.lines || !t.lines.length) return;
    const base = playerT;
    for (const l of t.lines) {
      if (!l.audio) continue;
      const delay = Math.max(0, (Number(l.start) || 0) - base) * 1000;
      previewTimers.push(setTimeout(() => {
        if (!autoplay) return;
        const a = new Audio(l.audio);
        previewAudios.push(a);
        a.play().catch(() => {});
      }, delay));
    }
  }

  /* ---------- 步骤 3：出预演（画开头画面 + 配音） ---------- */
  async function toPreview() {
    stopFlag = false;
    /* 预演前检查：没有台词的段先不挡路（让用户先看画面），但缺脸 / 缺声音要说清。
       「缺什么」只有 `D.Pipe.prereqs` 这一份判定 —— 它按**每位角色自己**的定音色方式现算
       （走复刻的缺参考音频、走描述的没写声音描述、走预设的没挑音色），这里只负责把它分成两句话说；
       压根没配语音接口时不该一段一段报错 —— 预演照旧有画面和字幕，只提一次。 */
    /* 同 shootLoop：这一轮也要跑好几分钟（逐段画开头画面 + 逐句配音），
       期间「‹ 返回」不拦人。用裸 `save()` 的话，用户切去另一部之后，
       这里存的是**新打开的那一集**，刚才画出来的画面与配好的音全留在内存里 —— 刷新即没，
       而配音是已经花过钱的。 */
    const mine = cur;
    const pre = D.Pipe.prereqs(mine, null, REG);
    const faceMissing = pre.filter(p => p.key === 'face').map(p => p.who).join('、');
    const voiceRows = pre.filter(p => p.key === 'voice');
    if (faceMissing) toast('⚠ ' + faceMissing + ' 的脸还没画，预演里将显示占位画面');
    const dub = D.Pipe.ttsWays(REG, mine.opts).ok;
    if (!dub) toast('⚠ 还没配语音接口（' + (voiceRows[0] ? voiceRows[0].why : '这个平台没有能定音色的型号') + '），这次预演只有画面和字幕（字幕按台词估时排）');
    else if (voiceRows.length) toast('⚠ 这几位的音色还没定，那几段配音会失败：' + voiceRows.map(p => p.why).join('；'));
    /* **先进第 3 步，再逐段生成**：以前这里是「整轮跑完才 render」，用户在十几秒里
       对着一个转圈的整屏，看不到分镜、也不能先改台词或挑已有的图。现在画面/配音好一段
       就在那一段上顶掉占位（segInner / pickHTML 都读 GEN 的账），文字早就在界面上了。 */
    mine.step = 3; saveOf(mine); if (cur === mine) enterStep(3);
    const shots = (mine.shots || []).slice();
    genSet('preview', null, '正在出预演：开头画面' + (dub ? '、配音' : '') + '，共 ' + shots.length + ' 段');
    /* 「一段要做什么」与「一段做完没有」的两份判据，串行与并发跑的是同一份 ——
       分成两处各写一遍，并发那一版就一定会漏掉「已经配好、台词没动过就别重配」，
       表现是用户为了看个预演，把全片的配音又合成了一遍（每一句都是一次真的钱）。 */
    const openDone = sh => !!(sh.startImg || genHas('open', sh.id));
    const dubTarget = (sh) => {
      sh.takes = sh.takes || [];
      let t = sh.takes[0];
      if (!t) { t = D.newTake({ no: 1 }); sh.takes.push(t); saveOf(mine); }
      /* 已经配好、且台词没动过的段落**不重复合成**（每一句都是一次真的语音调用）。
         判据用 lineDrift：台词改过了就得重配，否则界面写着新台词、发出去的还是旧那几句。 */
      const ok = (t.state === 'done' || t.state === 'dubbed') && t.lines && t.lines.length
        && !D.Pipe.lineDrift(sh, t);
      return ok ? null : t;
    };
    /* 开头画面：段与段之间互不依赖，**一次全并发提交**（生图限流上限 `FILL_CONC`）。
       以前是一段画完再画下一段：8 段各十几秒，用户看着像「只画了一个就卡住了」。 */
    const needOpen = shots.filter(sh => !openDone(sh));
    await D.Pipe.runPool(needOpen, FILL_CONC, async (sh) => {
      if (stopFlag) return;
      /* 画不出来就留空，预演用纯字幕 —— 但要说一句，别让人以为页面坏了 */
      await genUnit('open', sh.id, '画第 ' + sh.no + ' 段的开头画面…', async () => {
        try { await paintOpenImg(sh, mine); }
        catch (e) { toast('第 ' + sh.no + ' 段开头画面没画成：' + ((e && e.message) || e) + '（预演改用纯字幕）', 'err'); }
        saveOf(mine);
      }, () => refreshShot(sh));
    });
    if (stopFlag) { genClear('preview', null); toast('收到，剩下的段没再自动出预演 —— 那几段按现在的素材预演', 'ok'); stopFlag = false; saveOf(mine); if (cur === mine) enterStep(3); return; }
    /* 配音：同样**一次全并发提交**。用户要的是「点一下出预演，全部配音都出来」，
       串行逐段等着时 8 段就是 8 倍时间，而且中途关掉就只配了一半。 */
    if (dub) {
      const plan = shots.map(sh => ({ sh: sh, t: dubTarget(sh) })).filter(x => x.t);
      await D.Pipe.runPool(plan, DUB_CONC, async (x) => {
        if (stopFlag) return;
        await genUnit('dub', x.sh.id, '第 ' + x.sh.no + ' 段配音…',
          () => D.Pipe.dubShot(REG, mine, x.sh, x.t, m => {
            genSet('dub', x.sh.id, '第 ' + x.sh.no + ' 段 · ' + m);
            paintShotState(x.sh);
          }),
          () => { saveOf(mine); paintShotState(x.sh); });
        if (x.t.state === 'failed') toast('第 ' + x.sh.no + ' 段配音没成功：' + (x.t.error || '') + '（预演还有画面和字幕）', 'err');
      });
    }
    genClear('preview', null);
    if (stopFlag) toast('收到，剩下的段没再自动出预演 —— 那几段按现在的素材预演', 'ok');
    stopFlag = false;
    /* 出完预演落在**第 3 步（看预演）**：那儿才是「开始拍」按钮所在的地方。
       以前这里写成 4，于是出完预演直接落到「拍成片」—— 既没让人看预演，
       也按不到开始拍（只能自己去点顶栏那个步骤）。 */
    saveOf(mine);
    if (cur === mine) enterStep(3);
    if (!(mine.shots || []).length) toast('还没有可拍的段');
  }
  async function paintOpenImg(sh, drama) {
    await D.Pipe.drawOpen(REG, drama || cur, sh);
  }

  /* ---------- 步骤 4：拍摄 ---------- */
  /* 拍摄前置条件清单：返回 true = 有缺的东西（弹窗已经开了，调用方要停下）。
     每一条都写清「是谁缺什么」和「为什么现在缺会白拍一次」，并直接把人送到能补的地方。
     按钮**按缺的东西分类各给一条**（去认角色 / 去改台词 / 去设置），不再只认 fix==='cast'：
     混在一起时（一位角色没画脸 + 某段台词空着）弹窗列出两条问题、按钮却只把人丢进角色页，
     台词那条永远指不到地方 —— 点了跟没点一样。 */
  function flashTo(el) {
    if (!el || !el.scrollIntoView) return;
    try { el.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (e) { el.scrollIntoView(); }
    el.classList.add('dr-hit');
    setTimeout(() => el.classList.remove('dr-hit'), 2600);
  }
  /* 跳到左栏里的另一页：套在外壳里就改**顶层**的 hash（app.js 认 hashchange），
     直接打开这一页（没套外壳）就整页跳过去。 */
  function gotoPage(p) {
    const top = window.top;
    if (top && top !== window && top.location) { try { top.location.hash = '#' + p; return; } catch (e) {} }
    location.href = p;
  }
  function showPrereq(list, shot) {
    if (!list || !list.length) return false;
    const acts = [];
    const add = (label, go) => { if (!acts.some(a => a.label === label)) acts.push({ label, go }); };
    /* 「还没定音色」是这一页最常见的一道卡：给它一条**直接补**的路（就地跑 AI 定音色），
       而不是只把人丢到第 2 步去找那颗按钮 —— 十几张角色卡里找一位缺声音的，等于没指路。 */
    if (list.some(x => x.key === 'voice') && D.aiVoiceOn() && !genHas('aivoice', null)) {
      add('AI 定音色', () => runAiVoice());
    }
    for (const x of list) {
      if (x.fix === 'settings') { add('去设置', () => gotoPage('settings.html')); continue; }
      if (x.fix === 'cast') {
        const cid = x.cid;
        add('去认角色', () => {
          cur.step = 2; save(); enterStep(2);
          const c = (cur.characters || []).find(k => k.id === cid);
          flashTo(c ? castCard(c) : null);
        });
        continue;
      }
      const sh = x.shot || shot;
      if (sh) add('去改台词', () => {
        const i = (cur.shots || []).indexOf(sh);
        if (i < 0) return;
        shotIdx = i; takeIdx = 0; render();
        /* 真正要改的地方是右栏那一格的台词区，不是左边的段条 —— 闪错地方等于没指路 */
        flashTo($('lineBox') || body.querySelector('.dr-seg[data-i="' + i + '"]'));
      });
    }
    /* 就地展开在底栏上面（2026-10 去掉弹窗）：这一张清单是给「现在就想去补」的人看的，
       弹窗一关那几行就没了，而人正要去点的就是其中某一行。 */
    panelShow('prereq', { list, acts });
    return true;
  }
  /* 「没成的段」= 拍过、但手上没有一条拍成的（或者选用的那条自己就是没成的那条）。
     一次都没拍过的段不算 —— 那是「开始拍」的活，混进来会让人以为「重拍没成的」也该把没拍的补上。
     判据放在**一处**（`isFailedShot`），按钮摆不摆、点下去拍哪几段、清单里那行提示全读它。 */
  const isFailedShot = sh => {
    const ts = sh.takes || [];
    const chosen = ts.find(x => x && x.id === sh.chosen);
    if (chosen && chosen.state === 'done') return false;
    return ts.some(x => x && x.state === 'failed');
  };
  const failedShots = () => (cur.shots || []).filter(sh => sh && isFailedShot(sh));
  /* 按段号重拍 —— 「重拍没过的」与清单里那条共用这一份（同一个确认、同一套上限判断、
     同一套链调度）。两处各写一遍的话，迟早会出现「一个入口会重拍被拍满的段、另一个不会」。 */
  const STALE_WHAT = '接的还是上一段的旧末帧';
  async function reshootShots(nos, what) {
    const list = (cur.shots || []).filter(sh => sh && nos.indexOf(sh.no) >= 0);
    if (!list.length) return;
    const capped = list.filter(sh => takesLeft(sh) <= 0);
    const tail = what === STALE_WHAT
      ? '拍完每一段会重新接上前面那一段的末帧。' : '';
    if (!capped.length && !await Confirm.ask({
      title: '重拍第 ' + list.map(sh => sh.no).join('、') + ' 段？',
      body: '第 ' + list.map(sh => sh.no).join('、') + ' 段' + (what ? what + '，' : '')
        + '现在各重拍一次。每一段都会单独开一条任务、各出一段画面。' + tail,
      okLabel: '就重拍这 ' + list.length + ' 段',
    })) return;
    if (capped.length && !await Confirm.ask({
      title: '其中 ' + capped.length + ' 段已经拍到上限',
      body: '第 ' + capped.map(sh => sh.no).join('、') + ' 段已经拍满 ' + D.maxTakes() + ' 次，这次不会动它们'
        + '（先在拍片记录里删掉一条没用的记录，或改台词/补条件）。剩下的要接着重拍吗？',
      okLabel: '重拍剩下的',
    })) return;
    const set = new Set(list.filter(sh => takesLeft(sh) > 0).map(sh => sh.id));
    if (!set.size) return toast('这些段都拍到上限了 —— 先在拍片记录里删掉一条没用的记录', 'err');
    if (cur.step < 3) cur.step = 3;
    save();
    return shootAll(sh => set.has(sh.id), true);
  }
  /* 一键重拍没过的那几段（底栏那个按钮）。每一段一条真任务，所以先问清是哪几段。 */
  async function reshootFailed() {
    const list = failedShots();
    if (!list.length) return toast('现在没有没拍成的段', 'ok');
    return reshootShots(list.map(sh => sh.no), '拍过但没拍成');
  }

  /* 拍摄进度只记在**这一段**那一格账上：两条链并发时各写各的，底栏那一行由 genLine()
     现拼（以前是一句全局 busy —— 后写的把先写的盖掉，看到的永远是最后那一句，
     而且为了改这一句话要把整页重画，正在播的片子从头开始）。
     传 null = 这一段忙完了，从账上撤掉。 */
  function sayShot(sh, text) {
    if (text == null) genClear('shoot', sh.id);
    else genSet('shoot', sh.id, '第 ' + sh.no + ' 段 · ' + text);
    paintShotState(sh);
  }
  /* 批量拍摄按**场景链**调度（D.Pipe.chainPlan 读文字 AI 给每段写的 link）：
       · link=auto 的段串成一条链 —— 后一段要等前一段拍完才取得到它的最后一帧，所以链内串行；
       · 链与链之间没有依赖，一次并发 PARALLEL_CHAINS 条（画幅/场景不同的那些段就同时拍）。
     `pick` = 这一轮要拍哪几段。不传就是「还没选定画面的都拍」（原来的「开始拍」）；
     「重拍没过的那几段」传自己的判据进来 —— **调度、接帧、并发、停下、收尾全是同一份**，
     另写一遍就会出现「批量能接帧、单段不能」这种只有一条路走得通的情况。 */
  async function shootAll(pick, confirmed) {
    const why = genWhy('batch', null); if (why) return toast(why, 'err');
    /* **先把这一集抓住**（与 resumePending / healTakeUrls 同一个写法）：这一轮可能要跑好几分钟，
       期间「‹ 返回」并没有被拦住（#btnBack 只 stopPlayer，不问有没有在拍），用户完全可以
       回列表挑另一部打开。那时 `cur` 已经换人 —— 收尾再摸 `cur` 就会把**新打开的那一集**
       推进到第 4 步，而这一轮拍出来的东西一个字没落盘（钱花了，刷新即没）。 */
    const mine = cur;
    if (showPrereq(D.Pipe.prereqs(mine, null, REG))) return;
    stopFlag = false;
    const todo = pick || (sh => !sh.chosen);
    /* 链要**整条留着**（只在循环里跳过不拍的那些段）：把已经拍好的段从链里抽掉，
       「上一段」就接错了 —— 1|2|3 里 2 早拍好了，3 会去取 1 的最后一帧。 */
    const chains = D.Pipe.chainPlan(mine).map(c => c.shots).filter(l => l.some(todo));
    const total = chains.reduce((n, l) => n + l.filter(todo).length, 0);
    if (!total) {
      toast((mine.shots || []).length ? '每一段都已经有了选定的画面' : '还没有段落 —— 先在下面那一格「＋ 加一段」', 'err'); return;
    }
    /* 一次「开始拍」= `total` 条真任务、各自计费 —— 这是全站最贵的一个按钮，原来却**一点确认都没有**：
       75 段的一集点一下就是 75 条真任务开出去，用户没有机会知道自己刚点了什么。
       单段连拍（`n > 1`，见 reshoot 那处）与「重拍没成的 N 段」（`reshootShots`）都有 `Confirm.ask`，
       唯独这条最贵的没有。判据与那两处同一条：**多于一条就要先问**，一条不问（一段就是一条任务，
       界面上也数得出来，多问一次只是骚扰）。
       正文走 textContent，所以只能写纯文本，不能塞 <b>。
       `reshootShots` 自己已经问过了 → 由它传 confirmed 进来，别让人连点两下弹两次框。 */
    if (!confirmed && total > 1 && !await Confirm.ask({
      title: '开始拍这 ' + total + ' 段？',
      body: '每一段都会单独开一条任务、各出一段画面，这一轮一共 ' + total + ' 条。'
        + (chains.length > 1
          ? '分 ' + chains.length + ' 条链，最多同时 ' + Math.min(D.Pipe.PARALLEL_CHAINS, chains.length) + ' 条。'
          : '这几段要接上一段的最后一帧，只能一段接一段拍（慢一些，但接得上）。')
        + '拍完每一段的「拍片记录」里能逐条看、逐条删掉重拍；中途想停就按「停下」，'
        + '已经交出去的那几条会继续在平台跑完。',
      okLabel: '就拍这 ' + total + ' 段',
    })) return;
    /* 整轮记一条账（拦住建「再点一次开始拍」= 同一批再花一次钱），每段自己的进度各记各的，
       底栏那一行由 genLine() 把它们拼出来。 */
    genSet('batch', null, '要拍 ' + total + ' 段，分 ' + chains.length + ' 条链' +
      (chains.length > 1 ? '（一次并发 ' + Math.min(D.Pipe.PARALLEL_CHAINS, chains.length) + ' 条）' : '（全程需要接续，只能一段接一段拍）'));
    let i = 0;
    const worker = async () => {
      while (i < chains.length && !stopFlag) {
        const list = chains[i++];
        for (let k = 0; k < list.length; k++) {
          if (stopFlag) break;
          const sh = list[k];
          /* 这一轮不管它：已选定画面的段在「开始拍」里是不动的（它仍然当下一段的「上一段」，
             「重拍没过的那几段」里则是不在这一批的那些段）—— 两种都只跳过，链上的位置不动。 */
          if (!todo(sh)) continue;
          /* 首尾帧接续：取**排在前面的那一段选用的那一条**的最后一帧，存成本机资产。
             取不到（上一段没拍成、没画面、或者换了场景本来就不接）就用本段的开头画面拍。
             判据（要不要接、接谁）在 D.Pipe.linkSource 一处 —— 批量与单段重拍都读它，
             两边各判一次就会出现「批量接得上、重拍这一段接不上」这种只在某一条路上犯的错。 */
          let link = '', linkFrom = '';
          const ls = D.Pipe.linkSource(mine, sh);
          if (ls && ls.take && ls.take.state === 'done') {
            sayShot(sh, '取第 ' + ls.prev.no + ' 段最后一帧…');
            try { link = await D.Pipe.takeLastFrame(mine, ls.prev, ls.take); linkFrom = ls.take.id; }
            catch (e) { sayShot(sh, '取帧失败（' + e.message + '）'); }
          }
          await shootOne(sh, 1, true, link, linkFrom);
        }
      }
    };
    try {
      await Promise.all(Array.from({ length: Math.min(D.Pipe.PARALLEL_CHAINS, chains.length) }, worker));
    } finally {
      genClear('batch', null);
      (mine.shots || []).forEach(sh => genClear('shoot', sh.id));
    }
    if (stopFlag) toast('收到，剩下的段没再派出去 —— 已经交出去的那几条还在平台跑，回来会自动接上', 'ok');
    stopFlag = false;
    /* 拍完要走到「拍成片」那一步 —— 不然用户还停在看预演，
       拍出来的每一条根本没有地方显示（参考产品拍完就切到成片那一步）。
       **但只在这一集还开着的时候**：用户中途切去别的集了，把**那一集**推到第 4 步
       会把人家的界面改掉，而这一轮拍的东西也不该记到它头上。 */
    saveOf(mine);
    if (cur === mine) {
      if (mine.step < 4) { mine.step = 4; saveOf(mine); }
      enterStep(4);
    }
  }
  /* 拍一条（times 次）：
       · 批量拍摄（stopWhenPass）—— 闸门已经由 shootAll 过过一次，这里直接干活
       · 界面点「拍这一段 / 再重拍」—— 走 genRun，闸门按**这一段**记，正在拍时再点只拦这一段 */
  async function shootOne(sh, times, stopWhenPass, linkFrame, linkFrom) {
    const mine = cur;   // 用户中途切集时，下面那句「后面几段接旧末帧」不该在别人的界面上弹（见 shootAll 的同一段说明）
    if (stopWhenPass) return shootLoop(sh, times, true, linkFrame, linkFrom);
    const r = await genRun('shoot', sh.id, '拍第 ' + sh.no + ' 段…',
      () => shootLoop(sh, times, false), () => refreshShot(sh));
    /* 单段重拍完**当场**说后面几段接的已经不是它了：批量重拍时后面几段会一起重拍（自然接上），
       单段重拍不会 —— 那一瞬间是唯一能说清这件事的时机，隔到导出就只剩一条有接缝的成片了。
       用户中途切到别的集就别弹了：这句话问的是**这一集**的后续段，在别人的界面上冒出来没有意义。 */
    if (r && cur === mine) askStale();
    return r;
  }
  /* 后面几段接的还是旧末帧 → 给一条能直接重拍的路（判据与算法都在 D.Pipe.staleChains 一处）。
     只报不拦：接不接得上由用户定，所以这一块**不弹窗** —— 弹窗一关这句话就没了，
     而它讲的是「下一次导出会带着接缝」，人在底栏看得见它才叫提醒（正文在 stalePanelHTML）。 */
  function askStale() {
    const stale = D.Pipe.staleChains(cur);
    if (!stale.length) return;
    panelShow('stale', { nos: stale.map(s => s.no) });
  }
  async function shootLoop(sh, times, stopWhenPass, linkFrame, linkFrom) {
    /* 这一集在开拍**之前**抓住（与 resumePending / healTakeUrls / shootAll 同一个写法）：
       下面每一个 save() 与每一次数据层调用都必须落在**拍的是哪一集**上。
       用裸 `save()`（= 存 cur）的话，用户中途按「‹ 返回」再打开另一部，这一段刚拍出来的
       take 就只留在内存里 —— 钱已经扣了，刷新一下全没。 */
    const mine = cur;
    /* 单段拍摄同样先看前置条件（手动点「拍这一段」时最容易踩） */
    if (!stopWhenPass && showPrereq(D.Pipe.prereqs(mine, sh, REG), sh)) return;
    /* linkFrame：批量拍摄由 shootAll 按链算好传进来（传空串就是「这一段不接」）。
       单段重拍没传（undefined）时自己找**排在前面的那一段**取最后一帧 —— 否则「重拍第 3 段」
       拍出来接不上第 2 段。判据仍走 D.Pipe.linkSource（要不要接、跨不跨场景都只判一次），
       linkFrom 一路带着：只记地址的话，「后面第 4 段接的还是第 3 段上一版的末帧」这件事就查不出来。 */
    if (linkFrame === undefined) {
      const ls = D.Pipe.linkSource(mine, sh);
      const pt = ls ? ls.take : null;
      if (pt && pt.state === 'done') {
        sayShot(sh, '取第 ' + ls.prev.no + ' 段最后一帧…');
        try { linkFrame = await D.Pipe.takeLastFrame(mine, ls.prev, pt); linkFrom = pt.id; } catch (e) { linkFrame = ''; linkFrom = ''; }
      } else { linkFrame = ''; linkFrom = ''; }
    }
    stopPlayer();
    const batch = !!stopWhenPass;
    try {
      for (let k = 0; k < Math.max(1, times || 1); k++) {
        const cap = D.maxTakes();
        if ((sh.takes || []).length >= cap) { toast('这一段已经拍到上限 ' + cap + ' 次了'); break; }
        const take = D.newTake({ no: (sh.takes || []).length + 1, linkFrame: linkFrame || '', linkFrom: linkFrom || '' });
        sh.takes = sh.takes || []; sh.takes.push(take);
        if (!batch) takeIdx = sh.takes.length - 1;   // 并发时两条链抢同一个侧栏选中没有意义
        saveOf(mine); paintShotState(sh);
        const say = s => sayShot(sh, s);
        try {
          say('配音…');
          await D.Pipe.dubShot(REG, mine, sh, take, m => { say(m); }); saveOf(mine);
          say('拍摄…');
          /* 第四个回调：提交一拿到任务号就立刻写盘。以前要等整条拍完才 put，
             中途关掉网页就丢了任务号 —— 回来只能重新提交，等于又扣一次钱。 */
          await D.Pipe.shoot(REG, mine, sh, take, s => { say(s); }, () => saveOf(mine));
        } catch (e) {
          /* 用户在拍片记录里按了「不等了」：这不是失败，是他自己收的手 ——
             记成 failed 会让段条显示「没拍成」，还占掉重拍上限里的一次。 */
          if (e && e.abandoned || (take && take.abandoned)) {
            take.state = 'abandoned'; take.stage = '不等了'; take.error = '';
          } else { take.state = 'failed'; take.error = e.message; toast('第 ' + sh.no + ' 段：' + e.message, 'err'); }
        }
        saveOf(mine);
        /* 这一条**拍完就收工** —— 不在这儿自动重来。重拍是花钱动作，
           一次失败就默默再来一条，等于替用户点了几次他没点的按钮（最多能连着扣 maxTakes 次）。
           `times` 只在用户明确点了「再来 N 次」时才大于 1，那是他自己要的次数。 */
        if (take.state !== 'done' && !batch) break;   // 没拍成：单段就停在这儿，交给界面决定
      }
    } finally {
      /* 这一段忙完就把它那一格进度从账上撤掉：批量那一轮里没人替它撤
         （单段那条虽然由 genRun 的 finally 兜底，但提前撤掉能让底栏那一行早点干净） */
      genClear('shoot', sh.id);
      if (batch) paintShotState(sh); else refreshShot(sh);
    }
  }
  /* 打开页面时接上没等完的活（提交时就把任务号写盘了，所以不重复提交、不重复扣费） */
  async function resumePending() {
    if (!cur) return;
    /* **先把这一集抓住**：这一趟可能跑好几分钟（每条都有一轮超时上限），
       期间用户完全可以切去别的集、或者干脆回列表挑另一部 —— 结束时再摸 `cur`
       存下去的就已经是新打开的那一集，这一轮接回来的结果整批丢失。
       底下每一处收尾都只认 `mine`。 */
    const mine = cur;
    const pending = [];
    for (const sh of (mine.shots || [])) for (const t of (sh.takes || [])) {
      /* 已经按过「不等了」的跳过：刷新回来也不该又把它等一遍 */
      if (t && t.taskId && !t.abandoned && t.state !== 'done' && t.state !== 'failed') pending.push({ sh: sh, t: t });
    }
    if (!pending.length) return;
    /* 这一趟不重新提交任务，只是接着等平台回话（重新提交 = 又扣一次钱），
       所以它**只挡拍摄那一路**（见 genWhy 的两档），画脸/试听/角色资产照常可用。 */
    genSet('resume', null, '上次有 ' + pending.length + ' 条没等完，正在接着等…');
    let r = [];
    try {
      r = await D.Pipe.resumeAll(REG, mine, s => {
        genSet('resume', null, '接着等：' + s);
        /* 段条那颗格子只换内容、不重画整条：接线在 .dr-seg 自己身上，不会被冲掉。
           用户已经切走时不碰界面（那一集不在眼前，画了也是白画）。 */
        if (cur !== mine) return;
        (mine.shots || []).forEach(sh => paintSeg(sh));
        const now = curShot(); if (now) paintStateTag(now);
      }, () => stopFlag);
    } catch {}
    genClear('resume', null);
    saveOf(mine);
    /* 还在看这一集才重画；已经切走就别把人从别的集拽回来 */
    if (cur === mine) enterStep(mine.step);
    /* 问不通平台**不等于任务失败**（网络、平台抽风、任务太久不刷新）——
       但也不能一个字不说让人看着「拍摄中」干等：说清楚有几条没接上、刷新还能再接。 */
    const stuck = [];
    for (const sh of (mine.shots || [])) for (const t of (sh.takes || [])) {
      if (t && t.taskId && !t.abandoned && t.state !== 'done' && t.state !== 'failed') stuck.push(t);
    }
    if (stuck.length) {
      toast('还有 ' + stuck.length + ' 条没接上（' + (r && r.stopped ? '你按了停下，剩下的留到下次' : '多半是这一家平台暂时问不通') + '）—— '
        + '这不代表任务失败了，刷新这一页还能接着等；要是不想等了，在拍片记录里点「不等了」', 'err', 7000);
    }
  }
  /* 拍完的段存的是当时的**签名外链**（VGENV 的 OSS 只管一天）。放着不管，隔几天回来这一集
     就是「播放器黑屏、导出时代理取不到字节」。过期判定与整批回源都在 assetlib.js 的
     Api.healMedia 里（Drama.Pipe.healTakes 只把换到的地址写回 take），页面只管落盘重画。 */
  async function healTakeUrls() {
    if (!cur) return;
    /* 同 resumePending：回源是网络活，用户可能中途就切去别的集了。
       收尾只认 `mine`，否则 `save()` 存的是新打开的那一集，换好的地址整批丢在内存里。 */
    const mine = cur;
    let timer = 0;
    const repaint = () => { clearTimeout(timer); timer = setTimeout(() => { saveOf(mine); if (cur === mine) render(); }, 400); };
    const n = await D.Pipe.healTakes(mine, repaint);
    clearTimeout(timer);
    if (n) {
      saveOf(mine);
      if (cur === mine) render();
      toast('已换新 ' + n + ' 条片子的外链地址', 'ok');
    }
  }

  /* 做下一集：先问「这一集的人和场景带多少过去」（默认值取设置页那一项），
     然后**当场把新的一集建好**并停在入口页等写故事。
     为什么不是「回到入口页再新建一部」：故事写在入口页那一个大输入框里，而 `startStory`
     原来每次都新建一部 —— 拷过来的角色与场景就成了孤儿，界面说的「接着用」根本没生效。
     现在把这一集记在 `nextDraft`，「开始」落在它上面拆分镜，`castNote` 那份「已经定下了这些人/场景」
     才真的喂给文字 AI（AI 用回同名 → normalizeScript 复用那一张脸、那一个声音、那张场景图）。 */
  async function nextEpisode() {
    const prev = cur;
    const chars = (prev.characters || []).filter(c => c && c.name);
    const scenes = (prev.scenes || []).filter(s => s && s.name);
    /* 道具（2026-10）跟场景同一档：它是「整集一份、每段都带」的东西，下一集接着用才对 ——
       不带过去的话，新故事里那件道具要么消失、要么被 AI 另编一个同名近似的。 */
    const props = (prev.props || []).filter(p => p && p.name);
    let way = D.nextInherit();
    if (chars.length || scenes.length || props.length) {
      const OPTS = [
        { value: 'all', label: '角色、场景与道具都沿用', hint: '人、地方和关键物件接着用；剧情里要新增的自己再起名字' },
        { value: 'char', label: '只沿用角色', hint: '场景与道具重新画' },
        { value: 'none', label: '全新（都不带）', hint: '角色、场景与道具都重新生成' },
      ].map(o => Object.assign({}, o, { label: o.label + (o.value === way ? '（默认）' : '') }));
      const pick = await Confirm.choose({
        title: '做下一集：这一集的东西带多少过去？',
        sub: '下一集是新故事；画幅 / 画质 / 模型 / 配乐照这一集沿用',
        options: OPTS,
      });
      if (!pick) return;
      way = pick;
    }
    const d = D.newDrama({ title: '', opts: Object.assign({}, prev.opts, { bgm: prev.opts.bgm, nextOf: prev.id }) });
    if (way !== 'none') {
      if (way === 'all') {
        for (const s of scenes) d.scenes.push(D.newScene({ name: s.name, desc: s.desc, img: s.img, time: s.time, group: s.group }));
        /* 在库的那些同样读库里最新的一份（场景换了描述或预览图，下一集不该拿旧的） */
        for (const n of d.scenes) {
          const src = n.libId ? D.Lib.get(n.libId) : null;
          if (!src) continue;
          n.desc = src.look || n.desc;
          n.img = src.face || n.img;
          n.group = src.group || n.group;
        }
        for (const p of props) {
          d.props.push(D.newProp({ name: p.name, look: p.look, bio: p.bio, face: p.face, group: p.group }));
        }
        /* 道具同样读库里最新的一份：图换了或描述改了，下一集不该拿旧的。 */
        for (const n of d.props) {
          const src = n.libId ? D.Lib.get(n.libId) : null;
          if (!src) continue;
          n.look = src.look || n.look;
          n.face = src.face || n.face;
          n.group = src.group || n.group;
        }
      }
      for (const c of chars) {
        d.characters.push(D.newChar(Object.assign({}, c, {
          id: D.uid('c'), faces: (c.faces || []).slice(), assets: Object.assign({}, c.assets),
          inLib: !!c.inLib, libId: c.libId, group: c.group || '',
        })));
      }
      /* 在库的那些读**库里最新的一份**：上一集可能又改过外貌、重新定了音色或换了参考音频 */
      for (const n of d.characters) {
        const src = n.libId ? D.Lib.get(n.libId) : null;
        if (!src) continue;
        n.look = src.look || n.look;
        n.face = src.face || n.face;
        n.faces = (src.faces || []).length ? src.faces.slice() : n.faces;
        n.assets = Object.assign({}, src.assets, n.assets);
        n.voice = src.voice || n.voice;
        n.voiceName = src.voiceName || n.voiceName;
        n.voiceNote = src.voiceNote || n.voiceNote;
        n.refAudio = src.refAudio || n.refAudio;
        n.refAudioName = src.refAudioName || n.refAudioName;
        n.voiceMode = src.voiceMode || n.voiceMode;
      }
    }
    d.step = 1; d.shots = [];
    D.put(d); D.setActive(d.id);
    nextDraft = d.id;
    cur = null; shotIdx = 0; takeIdx = 0;
    render();
    toast(way === 'none' ? '下一集开好了（全新的一集）：写个故事就能拆'
      : '下一集开好了：' + (way === 'all'
        ? '角色 ' + chars.length + ' 位、场景 ' + scenes.length + ' 个、道具 ' + props.length + ' 件接着用'
        : '角色 ' + chars.length + ' 位接着用') + '，写个故事就能拆', 'ok');
  }

  /* ---------- 出整集 ---------- */
  /* 成片清单：渲之前先核对「每一段会用上哪一次」。
     为什么要有：段条只写「已选用」、右栏芯片也不写是第几次，唯一的出处是拍片记录里
     那一行「用这一条」—— 而清单是渲完几十秒才看得见的东西。清单把
     「这一段是在改台词之前拍的」摆在明面上（edlCheck.warns）。
     点任意一行跳到那一段，并把右栏展开到它 —— 核对完就能直接改。
     内容在 edlPanelHTML（与底栏那一块同一份实现），这里只管开合。 */
  function showEdl() { panelToggle('edl'); }
  async function exportFinal() {
    const why = genWhy('render', null); if (why) return toast(why, 'err');
    stopPlayer();
    /* 渲染要几十秒到几分钟，中途「‹ 返回」照样不拦人 —— 抓住开渲的是哪一集，
       不然渲完那一句 save() 存的是**新打开的那一集**，而 finalStamp 记在原来那一部上，
       结果是「成片渲出来了，下次打开它还是一份旧的，而且没法解释为什么」。 */
    const mine = cur;
    /* 先当面试一遍：缺哪几段就当场摊开让人去补，别等提交渲染才回一句笼统的错 */
    const edl = D.Pipe.edlCheck(mine);
    if (edl.missing.length) return showMissing(edl.missing);
    pendingMissing = null; pendingMissingFor = '';   /* 走到这里说明这一段一次都齐了：上一次那份清单别再挂着 */
    if (!edl.clips.length) return toast('还没有拍好的段落', 'err');
    /* 进度只改底栏那一行（genSet 里就做了），不重画整页也不重画整条底栏：
       渲染动辄几十秒，每来一句进度就把界面重建一次，人正想点的地方就跳走了。 */
    genSet('render', null, '提交渲染…');
    stopFlag = false;
    try {
      await D.Pipe.render(mine, (s) => genSet('render', null, s), REG, () => stopFlag);
      saveOf(mine);
      genClear('render', null);
      lastRenderErr = null; lastRenderErrFor = '';
      if (cur === mine) render();
      toast('成片好了，可以下载了');
    } catch (e) {
      genClear('render', null); if (cur === mine) render();
      /* 用户自己按的「停下」不是出错：说清楚 ffmpeg 已经撤了，别弹一个「出整集没成功」。 */
      if (e && e.cancelled) { toast('已取消渲染（本机的 ffmpeg 已经撤掉了）', 'ok'); return; }
      showRenderErr(e.message);
    }
  }
  /* 「进不了成片的段」清单：2026-10 依用户要求去弹窗 —— 一句话 toast + 跳到第一段，
     明细留在 `pendingMissing` 里，由底栏**常驻**画出来（红条逐段写清为什么进不去），
     直到某一次导出真的过了这道检查、或用户点「知道了」才清。
     只靠那句 toast 的话，用户看到的就是「点了导出，没反应」。 */
  let pendingMissing = null, pendingMissingFor = '';
  function showMissing(missing) {
    pendingMissing = missing; pendingMissingFor = cur.id;
    const no = (missing[0] && missing[0].no) || 0;
    const sh = (cur.shots || []).find(x => x.no === no);
    if (sh) { shotIdx = (cur.shots || []).indexOf(sh); takeIdx = 0; }
    const head = '有 ' + missing.length + ' 段还进不了成片（' + missing.map(m => '第 ' + m.no + ' 段').join('、') + '）—— 已经带你跳到第 ' + no + ' 段';
    cur.step = 4; save(); render();
    toast(head, 'err');
  }
  /* 渲染失败：不再弹窗，直接 toast 出真实原因；同一时间把 lastRenderErr 留着，
     底栏常驻一条红字写明「上一次为什么没成」，直到下一次成功导出或点「知道了」才清。 */
  let lastRenderErr = null, lastRenderErrFor = '';
  function showRenderErr(msg) {
    lastRenderErr = String(msg || '未知错误');
    lastRenderErrFor = cur ? cur.id : '';
    if (cur) render();
    toast('出整集没成功：' + lastRenderErr, 'err');
  }
  /* 字幕单独下载：成片画面里已经烧了字，这份是给「要改台词 / 要配别的播放器」用的 */
  function downloadSrt() {
    const subs = D.Subs.dramaSubs(cur);
    if (!subs.length) return toast('还没有字幕（先拍出带台词的段落）', 'err');
    const blob = new Blob([D.Subs.toSrt(subs)], { type: 'text/plain;charset=utf-8' });
    /* 下载全站只有 Net.save 这一份（createObjectURL + <a download> + 回收）。
       以前这里自己拼了一遍：不 append 到 body、不回收 URL，浏览器里会留一份没释放的对象地址。 */
    Net.save(blob, D.Pipe.fileSafe(cur.title) + '.srt');
    toast('字幕 ' + subs.length + ' 条已下载');
  }
  /* 整集剧本（.txt）：成片 mp4 只有画面，「这份片子到底是什么」得靠这一份才留得下来。
     正文拼在数据层 D.Pipe.scriptText（纯读、好单测），这里只负责变成文件下载 ——
     走 Net.save 这一份公共实现，文件名与成片/字幕/单段同一套 fileSafe 规则。 */
  function exportScript() {
    const txt = D.Pipe.scriptText(cur, REG);
    if (!txt) return toast('这一集还是空的，没东西可导', 'err');
    Net.save(new Blob([txt], { type: 'text/plain;charset=utf-8' }), D.Pipe.fileSafe(cur.title) + '_剧本.txt');
    toast('剧本已下载（' + ((cur.shots || []).length) + ' 段）');
  }
  /* `paintBottom`（= renderTop + renderBottom）原来在这儿，**零调用**：
     每个调用点都是按需要单独调 renderTop() / renderBottom()（分开是为了只重画其中一栏）。
     留一个没人调的「两个都画」的入口，下一个人很可能误用它把整页重画一遍。 */

  /* 文字 AI 熔断的照实播报：熔断期间润色被跳过了，用户看到的就是「我写的设定原文出图了」——
     沉默兜底就是骗人，所以要写明三件事：跳过的只是润色（生图 / 配音 / 拍视频照旧）、
     大概多久自动再试、以及一个立刻再试一次的出口。判据在 drama.js，页面不自己数失败。 */
  function paintAiBar() {
    const el = $('aiBar'); if (!el) return;
    /* `aiState` / `aiRetry` 在 **Drama.Pipe**（熔断是「一次操作」不是「一个配置」）。
       以前这里写的是 `D.aiState`，而那一项压根不存在 —— `D.aiState ? … : { ok: true }` 的兜底
       每次都走进去，于是这一栏**永远 hidden、那颗「现在再试一次」按钮从来没被挂上过**。
       熔断真触发时用户看到的是「提示词没润色，也不说是为什么、更没有出口」。 */
    const st = D.Pipe.aiState();
    if (st.ok) { el.hidden = true; el.innerHTML = ''; return; }
    const mins = Math.max(1, Math.ceil((st.leftMs || 0) / 60000));
    el.hidden = false;
    el.innerHTML = `${ic('clock', 14)}<span>文字 AI 连续问不通，暂时不再润色提示词（生图 / 配音 / 拍视频不受影响）——
      出图直接用你写的设定原文。约 ${mins} 分钟后再自动试。</span>
      <button class="ui-linkbtn" id="aiBarRetry">现在再试一次</button>`;
    const b = $('aiBarRetry');
    if (b) b.onclick = () => { D.Pipe.aiRetry(); paintAiBar(); toast('已重新接通文字 AI，下一次润色会真去问'); };
  }

  /* ---------- 总渲染 ---------- */
  function render() {
    stopPlayer();
    paintAiBar();
    paintProxyBar(); paintProxyBarBind();
    if (!cur) { nextDraft = pendingDraft(); renderEntry(); return; }
    renderTop(); renderBottom();
    /* 第 1 步通常是「AI 导演正在拆」那块转屏；但两种情况下**不该**是转屏：
       ① 「做下一集」那一集在**故事还没写**的时候也停在第 1 步 —— 那时该看到入口页；
       ② 这一集**已经拆过了**（角色/场景/分段都在），用户从第 3、4 步点回「1 讲故事」看一眼故事 ——
          没有任何拆分在跑，却摆一块「AI 导演正在读故事、拆分镜」永远转下去。底栏在第 1 步是 hidden、
          「停下」又要求 step>=2，于是**除了再点一次顶栏没有第二个出口**，看着就像页面卡死了。
          刷新也救不回来：`step` 早就存成 1 了，每次打开都落进这一屏。 */
    if (cur.step === 1 && nextDraftOf(cur)) { nextDraft = cur.id; renderEntry(); return; }
    if (cur.step === 1) { if (genHas('split')) renderBusyStep(); else renderRewound(); }
    else if (cur.step === 2) renderCast();
    else renderStage();
  }
  /* 「已经拆过、又被点回第 1 步」那一屏。**但它有两种来路，说法不能一样**：
       ① 真的拆出过东西（角色/场景/分段至少有一项）—— 用户只是回来看一眼，
          原文只读 + 一个「回到第 N 步」的出口就够了。
       ② 故事写了、**结果一个都没拆出来**（关掉页面 / 断网 / 拆分报错都停在这儿）。
          以前这一屏无条件写「这一步已经拆过了」—— 对着 0 角色 0 场景 0 段说「已经拆过了」
          是假话；更要命的是它**是个死胡同**：唯一那颗按钮把人送去一个空的第 2 步，
          故事还在这儿却什么都做不了，只能回列表删掉重写。
          所以这一支照实说「没拆出来」，并把「重新拆剧本」摆出来（**带确认**：
          它要花钱，而且会整份换掉下面的角色/场景/分段）。
     ①那一支仍然**不**给「重新拆剧本」—— 那次花钱动作加在「我只是回来看一眼」的页面上太容易误触。 */
  function renderRewound() {
    const nChar = (cur.characters || []).filter(c => c && c.name).length;
    const nScene = (cur.scenes || []).filter(s => s && s.name).length;
    const nShot = (cur.shots || []).length;
    const done = nChar + nScene + nShot > 0;
    /* 回哪一步：它其实走到哪儿就回哪儿 —— 拍过就 4，有分段就 3，再不济有角色就 2。 */
    const shot = (cur.shots || []).find(sh => sh && (sh.takes || []).length);
    const back = shot ? 4 : (nShot ? 3 : 2);
    const STEP_CN = ['', '讲故事', '认角色', '看预演', '拍成片'];
    body.className = '';
    if (!done) {
      body.innerHTML = `<div class="wrap">
        <div class="ui-note err">故事写了，但剧本<b>没拆出来</b> —— ${nChar} 位角色、${nScene} 个场景、${nShot} 段。
          多半是拆到一半关掉了页面、断了网，或者那次调用报错了。
          下面这段原文还在，重新拆一次就能接着往下走。</div>
        <div class="dr-plain">${D.esc(cur.story || '（这一集没有存下故事原文 —— 那就回列表重写一段）')}</div>
        <div class="btn-row">
          ${cur.story ? '<button class="tool acc" id="btnResplit">重新拆剧本</button>' : ''}
          <button class="tool" id="btnBackStep">回到短剧列表</button>
        </div></div>`;
      const rs = $('btnResplit');
      if (rs) rs.onclick = () => {
        /* 花钱动作：就地二次确认，说清它会换掉什么。
           这一支里下游一定是空的，所以直接说「下面什么都没有」——
           写死三个 0 的话，条件一旦放宽就成了一句假话。 */
        if (Confirm.arm(rs, '确认重新拆', {
          note: '要再调一次文字 AI 拆剧本。下面角色、场景、分段都还是空的，会被这次的结果整份填上。',
        })) return;
        runSplit(cur.story);
      };
      const bs2 = $('btnBackStep');
      if (bs2) bs2.onclick = () => { stopPlayer(); cur = null; render(); };
      return;
    }
    body.innerHTML = `<div class="wrap">
      <div class="ui-note info">这一步已经拆过了，没有正在跑的拆分 —— ${nChar} 位角色、${nScene} 个场景、${nShot} 段都还在下面几步里。
        故事原文在这里，只读。</div>
      <div class="dr-plain">${D.esc(cur.story || '（这一集没有存下故事原文）')}</div>
      <div class="btn-row">
        <button class="tool acc" id="btnBackStep">回到第 ${back} 步 · ${D.esc(STEP_CN[back])}</button>
      </div></div>`;
    const bs = $('btnBackStep');
    if (bs) bs.onclick = () => { cur.step = back; save(); enterStep(back); };
  }
  function renderBusyStep() {
    body.className = 'dr-busy';
    body.innerHTML = `<div class="dr-spin"></div>
      <div class="big" id="busyBig">${D.esc(genLine() || 'AI 导演正在读故事、拆分镜')}</div>
      <div class="mid">拆成分场剧本：谁、在哪、说什么</div>
      <div class="sm">给每个角色画脸、设计声音<br>一般一两分钟。</div>
      <div id="busyLive" hidden></div>
      <!-- 「你写的故事」也用公共折叠件（.adv / .adv-head / .adv-body / .chev），
           与入口页的高级设置、三个工作台同一套外壳；以前这里是页面自写的 <details>。 -->
      <div class="adv closed" id="advStory">
        <div class="adv-head" id="advStoryHead">
          <h2>你写的故事</h2>
          <span class="sum"><span id="advStorySum"></span><span class="chev">${ic('chevronDown', 12)}</span></span>
        </div>
        <div class="adv-body"><div class="dr-plain">${D.esc(cur.story || '')}</div></div>
      </div>`;
    const n = String(cur.story || '').trim().length;
    $('advStorySum').textContent = n ? n + ' 字' : '（没存下故事原文）';
    $('advStoryHead').onclick = () => {
      const adv = $('advStory'); if (!adv) return;
      adv.classList.toggle('closed');
      try { localStorage.setItem('dr_story_open', JSON.stringify(!adv.classList.contains('closed'))); } catch {}
    };
    /* 开合状态本机记住（和入口页 dr_adv_open 同一条约定）：
       拆剧本要等十几秒，人多半会展开看一眼自己写了什么，下次再进来不该又收回去。 */
    try { $('advStory').classList.toggle('closed', !JSON.parse(localStorage.getItem('dr_story_open') || 'false')); } catch {}
  }

  /* 回到短剧列表：**不**清掉「当前是哪一部」。
     列表只是个视图，不是状态变化 —— 以前这里顺手 `D.setActive('')`，
     于是「点一下返回看看列表」就把在拍哪部剧忘了：关掉页面再打开直接落在入口页，
     刚拍到一半的那部要找回来得在列表里翻。
     清 active 只剩两处该做的事：这一部被**删掉**了（列表里删卡），以及拆剧本失败、
     把半截的那一部整个删掉重来（startStory 的 catch）。
     下面那行 `cur = null` 是**内存**里的，让列表渲染出来；`cur` 在下次 boot 时
     由 `D.activeId()` 现取，所以「关掉再打开回到这一部」是自动的。 */
  $('btnBack').onclick = () => { stopPlayer(); cur = null; render(); };
  $('btnRename').onclick = async () => {
    /* 改名走公共表单弹窗：浏览器自带的 prompt 输入框是另一套外观，还挡在页面正中 */
    const v = await PromptForm.open({ title: '改个名字', okLabel: '改好', fields: [
      { key: 'name', label: '短剧名字', type: 'text', value: cur.title || '', placeholder: '给这一集起个名字' }] });
    const n = v && v.name;
    if (n && n.trim()) { cur.title = n.trim().slice(0, 40); save(); render(); }
  };
  /* 让右侧 AI 助手看得见「这一页此刻在干什么」（overview 里的「当前界面」）：
     只递读数，不给它任何改数据的手 —— 它要动这一集还得用户自己按按钮。
     助手现在挂在外壳那一层，读的是本页 window 上的这个快照（不再依赖页面自己加载 ai-chat.js）。 */
  window.__acPageCtx = () => {
    if (!cur) return { 界面: '拍短剧 · 短剧列表（还没打开某一集）', 本机有几部: D.list().length };
    const sh = curShot();
    const o = cur.opts || {};
    return {
      界面: '拍短剧 · 第 ' + cur.step + ' 步', 名称: cur.title, 段数: (cur.shots || []).length,
      正在看: sh ? '第 ' + sh.no + ' 段 ' + (sh.title || '') : '（没有选中段）',
      正在生成: GEN.size ? Array.from(GEN.keys()).slice(0, 12) : '没有',
      进度: genLine() || statusOf(cur),
      选中的模型: { 视频: o.videoModel || '（没选）', 生图: o.imgModel || '（没选）', 语音: o.ttsModel || '（没选）' },
      拍摄: '每点一次只发一条任务，不自动重试；每段最多 ' + D.maxTakes() + ' 次（次数在设置页改）',
    };
  };

  boot();
})();
</script>
</body>
</html>
