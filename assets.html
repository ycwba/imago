<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('dir_theme')||'light'}catch(e){}</script>
<script src="ui.js"></script>
<script src="workbench.js"></script>
<script src="assetlib.js"></script>
<script src="sidebar.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>资产库 · 拾帧</title>
<link rel="stylesheet" href="ui.css">
<style>
  :root { --bg:#f2f3f9; --panel:#fff; --panel2:#f3f4f9; --line:#e4e6f0; --txt:#23262f; --sub:#8a8fa3; --acc:#6957e8; --ok:#16a34a; --err:#dc2626; --warn:#d97706; --input:#f6f7fb; --pri:#7c5cff;
    /* 日期选择器的日历图标（mask 用，只看形状不看颜色） */
    --dp-cal: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' fill='none' stroke='%23000' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='2.2' y='3.5' width='11.6' height='10.3' rx='1.7'/%3E%3Cpath d='M2.2 6.7h11.6M5.5 2.2v2.6M10.5 2.2v2.6'/%3E%3C/svg%3E"); }
  html[data-theme="dark"] { --bg:#0b0d13; --panel:#141722; --panel2:#191d2b; --line:#262b3d; --txt:#eef0f6; --sub:#8f97ab; --acc:#6c8cff; --ok:#4ade80; --err:#ff7a7a; --warn:#fbbf24; --input:#0f1219; --pri:#7c5cff; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--txt); min-height: 100vh; }
  .page-main { padding: 24px 32px; }
  /* 窄窗口：收紧留白，日期区间等筛选控件允许折行 */
  @media (max-width: 760px) {
    .page-main { padding: 16px 14px; }
    .filters { gap: 8px; }
    .daterange { flex-wrap: wrap; }
    .datepick { width: 108px; }
  }
  h1 { font-size: 22px; margin-bottom: 6px; }
  .desc { font-size: 13px; color: var(--sub); margin-bottom: 18px; }
  .filters { display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; }
  .frow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .frow .flabel { font-size: 12px; color: var(--sub); flex: 0 0 64px; }
  .chip { font-size: 12.5px; padding: 5px 13px; border-radius: 4px; border: 1px solid var(--line); background: var(--panel); color: var(--txt); cursor: pointer; transition: all .12s; }
  .chip:hover { border-color: var(--acc); }
  .chip.active { background: var(--acc); color: #fff; border-color: var(--acc); }
  .frow input { padding: 7px 12px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); color: var(--txt); font-size: 13px; outline: none; width: 240px; }
  .frow input:focus { border-color: var(--acc); }
  .frow .sp { flex: 1; }
  .toolbar { gap: 8px; justify-content: flex-end; }   /* 基础形态（flex/间距/控件高度）在 ui.css */
  /* 日期区间：紧凑一组；外观走公共规范（描边/圆角/主题色），点击打开站内日期弹层。
     注意：这里不能加 overflow:hidden —— 日期弹层 .dp-pop 就挂在本元素内部定位，裁掉就点不出来了 */
  .frow .daterange { display: inline-flex; align-items: center; gap: 6px; flex: 0 0 auto; }
  .frow .daterange .dsep { color: var(--sub); font-size: 12px; line-height: 1; flex: 0 0 auto; }
  .frow .datepick { position: relative; display: inline-flex; align-items: center; width: 116px; height: 32px;
    border: 1px solid var(--line); border-radius: 4px; background: var(--panel); cursor: pointer;
    transition: border-color .15s; }
  .frow .datepick:hover { border-color: var(--acc); }
  .frow .datepick:focus-within { border-color: var(--acc); }
  .frow .datepick input[type="date"] { position: absolute; inset: 0; width: 100%; height: 100%;
    opacity: 0; border: 0; padding: 0; margin: 0; cursor: pointer; pointer-events: none; }
  .frow .datepick .dp-face { pointer-events: none; display: flex; align-items: center; gap: 6px;
    width: 100%; padding: 0 9px; font-size: 12.5px; color: var(--txt); white-space: nowrap; }
  .frow .datepick .dp-face.ph { color: var(--sub); }
  /* 日历图标：mask + currentColor 跟随主题色；挂在伪元素上，paintDateFaces 改 textContent 也抹不掉 */
  .frow .datepick .dp-face::after {
    content: ''; margin-left: auto; flex: 0 0 14px; width: 14px; height: 14px;
    background: currentColor; opacity: .55;
    -webkit-mask: var(--dp-cal) center / 14px 14px no-repeat;
    mask: var(--dp-cal) center / 14px 14px no-repeat;
  }
  .frow .datepick:hover .dp-face::after { opacity: .85; }
  /* 展示样式切换的样式（.viewtoggle）与分页信息（.pginfo）在 ui.css 里，收藏页共用同一份 */
  /* 列表卡片：与图片工作台 / 视频工作台同款 */
  /* 列表容器：卡片/紧凑的容器形态不同（流式 / 方块网格）。
     注意：要写成 #grid.view-x（ID+类）——#grid 自身的 display 优先级更高，只用类选择器会盖不过它 */
  #grid { display: flex; flex-direction: column; gap: 10px; }
  #grid .task { margin-bottom: 0; }                 /* 间距统一由容器 gap 控制 */
  #grid .task { content-visibility: auto; contain-intrinsic-size: auto 120px; }   /* 视口外的卡片跳过布局绘制，长列表更快 */
  /* ---------- 展示样式：卡片（默认，纵向大卡片） ---------- */
  #grid.view-card { display: flex; flex-direction: column; gap: 12px; }
  /* ---------- 展示样式：紧凑（方块网格） ---------- */
  #grid.view-compact { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; align-items: start; }
  .view-compact .task { display: block; padding: 0; overflow: hidden; border-radius: 8px; }
  .view-compact .task .timg { width: 100%; height: 124px; border-radius: 0; border: 0; border-bottom: 1px solid var(--line); }
  .view-compact .task .tmain { padding: 8px 9px 9px; }
  .view-compact .task .meta1 { font-size: 10.5px; }
  .view-compact .task .date { display: none; }
  .view-compact .task .tprompt { font-size: 12px; margin: 3px 0 0; -webkit-line-clamp: 2; display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; }
  .view-compact .task .meta2,
  .view-compact .task .acts,
  .view-compact .task .cdet { display: none; }
  .view-compact .task:hover { transform: translateY(-2px); }
  .task { display: flex; gap: 13px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; padding: 12px; }
  .task .timg { width: 132px; height: 96px; border-radius: 6px; overflow: hidden; flex: 0 0 auto;
    background: var(--panel2); cursor: zoom-in; display: flex; flex-direction: column;
    align-items: center; justify-content: center; color: var(--sub); font-size: 11px; align-self: flex-start; }
  .task .timg img, .task .timg video { width: 100%; height: 100%; object-fit: cover; }
  /* 音频资产：音符方块（点击在灯箱里播放） */
  .task .timg.audio { background: linear-gradient(135deg, rgba(108,140,255,.16), rgba(160,108,255,.16)); color: var(--acc); }
  .task .timg.audio .note-ic { font-size: 26px; line-height: 1; }
  .task .timg.audio .dur { font-size: 10.5px; color: var(--sub); margin-top: 4px; }
  .task .tmain { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .task .meta1 { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--sub); }
  .task .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); display: inline-block; }
  .task .dot.run { background: #fbbf24; animation: blink 1.2s infinite; }
  .task .dot.fail { background: var(--err); }
  @keyframes blink { 50% { opacity: .3; } }
  .spin-dot { width: 18px; height: 18px; border: 2px solid var(--line); border-top-color: var(--acc);
    border-radius: 50%; animation: rot .8s linear infinite; display: inline-block; margin-bottom: 4px; }
  @keyframes rot { to { transform: rotate(360deg); } }
  .task .date { margin-left: auto; }
  .favnote { font-size: 11.5px; color: var(--acc); margin: 2px 0 4px; word-break: break-word; }
  .localtag { display: inline-block; margin-left: 6px; padding: 0 5px; font-size: 10px; line-height: 16px; vertical-align: 1px;
    color: var(--sub); border: 1px solid var(--line); border-radius: 3px; background: var(--panel2); }
  .task .tprompt { font-size: 13px; line-height: 1.5; margin: 5px 0; color: var(--txt);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .task .meta2 { font-size: 12px; color: var(--sub); }
  .task .acts { margin-top: auto; display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
  /* 详情展开：中性描边小卡片（样式来自 ui.css 公共规则，这里只覆盖字号） */
  .cdet { font-size: 11.5px; }
  .asset .meta .cancel { color: var(--err); cursor: pointer; }
  .badges { display: flex; gap: 5px; flex-wrap: wrap; }
  .badge { font-size: 10.5px; padding: 1px 7px; border-radius: 3px; background: var(--panel2); color: var(--sub); }
  .badge.acc { color: var(--acc); background: rgba(105,87,232,.1); }
  .badge.run { color: var(--warn); background: rgba(217,119,6,.1); }
  .badge.fail { color: var(--err); background: rgba(220,38,38,.08); }
  .badge.done { color: var(--ok); background: rgba(74,222,128,.1); }
  .empty { color: var(--sub); font-size: 14px; text-align: center; padding: 60px 0; grid-column: 1/-1; }
  .pginfo { font-size: 12px; min-width: 90px; }   /* 基础样式在 ui.css，这里只按本页需要微调 */
  /* 详情展开：中性描边小卡片（样式来自 ui.css 公共规则，这里只覆盖字号） */
  .cdet { font-size: 11.5px; }
  .det-refs { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; max-height: 240px; overflow-y: auto; }
  .det-refs img { width: 100%; height: 84px; object-fit: cover; border-radius: 5px; border: 1px solid var(--line); cursor: zoom-in; }
  .det-refs img:hover { border-color: var(--acc); }
  .det-k { font-size: 12px; color: var(--sub); margin: 8px 0 6px; }
  /* 灯箱：避开左侧栏（--sbw 由 sidebar.js 设置） */
    color: #fff; padding: 8px 16px; border-radius: 5px; font-size: 12.5px; display: flex; gap: 12px; align-items: center; max-width: 90vw; flex-wrap: wrap; }
    color: #e5e7eb; padding: 12px 16px; border-radius: 6px; font-size: 12.5px; max-width: 70vw; max-height: 40vh; overflow-y: auto; display: none; white-space: pre-wrap; }
  /* 灯箱等公共组件样式统一来自 ui.css */
</style>
</head>
<body>
<div class="page-main">
  <h1>资产库</h1>

  <div class="filters">
    <div class="frow"><span class="flabel">大类型</span><span id="fType"></span>
      <span class="flabel" style="margin-left:14px">搜索</span><input id="search" placeholder="提示词 / 资产ID / 任务ID…">
      <button class="ghost" id="searchBtn" title="立即按当前关键词筛选（输入时也会自动筛）" style="flex:0 0 auto">搜索</button>
      <button class="ghost" id="aiSearchBtn" title="按左边搜索框里写的描述做 AI 检索（翻译成筛选条件就地过滤）" style="flex:0 0 auto">AI 检索</button>
      <span id="aiChip"></span>
    </div>
    <div class="frow"><span class="flabel">日期</span><span id="fDate"></span>
      <span class="daterange">
        <span class="datepick" data-dp="dFrom">
          <input type="date" id="dFrom" title="起始日期">
          <span class="dp-face ph" id="dpFromFace">起始</span>
        </span>
        <span class="dsep">→</span>
        <span class="datepick" data-dp="dTo">
          <input type="date" id="dTo" title="结束日期">
          <span class="dp-face ph" id="dpToFace">结束</span>
        </span>
      </span>
      <button class="ghost" id="dClear">清除日期</button>
    </div>
    <div class="frow"><span class="flabel">API 平台</span><span id="fProv"></span></div>
    <div class="frow"><span class="flabel">状态</span><span id="fStatus"></span>
      <span class="sp"></span>
      <span class="toolbar">
        <button class="ghost" id="multiBtn" title="进入多选：点卡片勾选，可批量下载"><span data-icon="checkBox" data-size="13"></span> 多选</button>
        <button class="ghost" id="reloadBtn" title="重新从各平台取回列表"><span data-icon="refresh" data-size="13"></span> 重新加载</button><button class="ghost" id="cancelAllBtn" title="取消所有排队/生成中的任务"><span data-icon="stop" data-size="13"></span> 取消全部进行中</button>
        <button class="ghost" id="pgPrev" style="display:none">‹ 上一页</button><span class="pginfo" id="pgInfo" style="display:none"></span><button class="ghost" id="pgNext" style="display:none">下一页 ›</button>
        <input type="number" id="gotoPage" min="1" placeholder="跳页">
        <button class="ghost" id="gotoBtn">跳转</button>
        <span id="cnt" class="info"></span>
        <span class="viewtoggle" id="fView" role="group" aria-label="展示样式切换"></span></span>
    </div>
  </div>

  <!-- 加载失败提示（断网 / 密钥失效时不再伪装成「没有匹配的资产」） -->
  <div id="loadErr"></div>

  <!-- 批量操作条：点工具栏「多选」后出现 -->
  <div class="bulkbar" id="bulkBar" style="display:none">
    <span class="bk-cnt" id="bulkCnt">已选 0 项</span>
    <button class="ghost" id="bulkAll">全选当前列表</button>
    <button class="ghost" id="bulkClear">取消选择</button>
    <button class="ghost" id="bulkDown">⤓ 批量下载</button>
    <span class="bk-tip" id="bulkTip"></span>
    <span class="sp" style="flex:1"></span>
    <button class="ghost" id="multiExit">退出多选</button>
  </div>

  <div class="grid" id="grid"><div class="empty">加载中…</div></div>
  <div id="gridEnd" style="height:1px"></div>   <!-- 滚动到这里的哨兵：自动续拉下一批 -->
</div>

<div id="lightbox">
  <button class="lb-btn" id="lbPrev">‹</button>
  <div id="lbStage"></div>
  <button class="lb-btn" id="lbNext">›</button>
  <div id="lbBar"><span id="lbCount"></span><span id="lbInfo"></span></div>
</div>

<script>
'use strict';
const $ = id => document.getElementById(id);
const fmtMicros = m => '¥' + (Number(m || 0) / 1e6).toFixed(2);
const fmtSize = b => { if (b == null || isNaN(Number(b))) return ''; const n = Number(b), u = ['B','KB','MB','GB']; let i = 0, v = n; while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; } return (i ? v.toFixed(1) : v) + ' ' + u[i]; };
function ratioText(w, h) { if (!w || !h) return ''; const g2 = (a, b) => b ? g2(b, a % b) : a; const g = g2(w, h) || 1, r1 = w / g, r2 = h / g; return (r1 <= 40 && r2 <= 40) ? r1 + ':' + r2 : (w / h).toFixed(2) + ':1'; }
const fileToDataURL = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(b); });

/* ---------- 数据拉取与归一化 ----------
   条目结构：{ kind:'asset'|'task', id, type('图片'|'视频'), providerName, provider, format,
              prompt, src, dl, ts, status('done'|'running'|'queued'|'failed'), size?, duration? } */
let assets = [];
/* 增量加载状态：游标只前进不回头，「加载更多」只取新页，不再从头重拉 */
let cursors = {};             // 不透明游标（AssetLib 返回什么就原样传回，平台无关）
let hasMoreFlag = true;       // 还有没有下一页（由 AssetLib 按 registry 声明判定）
let noCacheOnce = false;      // 手动「重新加载」时让服务端跳过列表短缓存
let seenIds = new Set();       // 跨批次去重（同一资产只建一次对象）
let loadedPages = 0;           // 每平台已加载页数（跳页换算/进度显示用）
let loadGen = 0;               // 「重新加载」时 +1：过期的异步批次直接丢弃
let loadChain = Promise.resolve();
const hasMore = () => hasMoreFlag;
/* 平台筛选项随数据增长重建（数据分批到达，平台可能后出现；值没变就不重绘，避免打断操作） */
let provSig = '';
function refreshProviderChips() {
  const sig = uniq('providerName').join('|');
  if (sig === provSig) return;
  provSig = sig;
  renderFilters();
}
/* 首屏缓存（sessionStorage）：刷新/重进页面先把上次的列表秒画出来，
   接口随后返回的新数据按条目覆盖上去，避免每次都干等平台接口（SparkCine 列表可能要好几秒） */
const CACHE_KEY = 'assets_cache_v1';
/* 首屏缓存放 localStorage：新开标签页 / 重开浏览器都能立刻画出上次的内容（sessionStorage 换标签页就没了）。
   **只缓存已完成（asset / 成功 / 失败）的条目**：缓存里留着「生成中/排队中」的快照，
   下次打开会把早已完成的旧状态当成现状显示成一条永远不动的假任务
   （新数据往往还没覆盖到它，因为它在后面几页）。未完成的状态一律等接口回来说话。 */
const cacheable = e => !!e && (e.kind === 'asset' || e.status === 'done' || e.status === 'failed' || e.status === 'succeeded');
function readCache() {
  try {
    const raw = localStorage.getItem(CACHE_KEY) || sessionStorage.getItem(CACHE_KEY);
    const c = JSON.parse(raw || 'null');
    const arr = (c && Array.isArray(c.entries)) ? c.entries : [];
    return arr.filter(cacheable);
  } catch { return []; }
}
function writeCache(list) {
  const keep = (list || []).filter(cacheable);
  const payload = JSON.stringify({ ts: Date.now(), entries: keep.slice(0, 200) });
  try { localStorage.setItem(CACHE_KEY, payload); }
  catch { try { sessionStorage.setItem(CACHE_KEY, payload); } catch {} }
}
const entryKey = e => (window.AssetLib && AssetLib.entryKey) ? AssetLib.entryKey(e)
  : [e.kind || '', e.id || e.assetId || e.genId || '', e.assetId || ''].join('|');
/* 合并 / 去重统一走 AssetLib（assetlib.js），页面不再各写一份：
   · 同一个产物只留一条（老缓存里可能同时存在「本地占位」和「已完成」两条），取信息更全的；
   · 收敛「任务 → 产物」跃迁造成的重复卡：列表接口先返回 kind:'task'（生成中），
     下一批返回 kind:'asset'（已完成），genId 相同但 key 不同 —— 只按 key 去重会同时留下两张卡；
   · 多图任务（同 gen_id 不同 asset_id）不受影响，本来就该是多条。 */
function mergeEntries(base, add) {
  return (window.AssetLib && AssetLib.mergeEntries) ? AssetLib.mergeEntries(base, add) : base.concat(add);
}
/* 分批加载：每次让每个平台再拉 pages 页，page 一到就 onBatch 渲染（先到先显示） */
let loadingNow = 0;            // 正在进行的加载批次数（界面上提示「加载中…」用）
let loadErrors = {};           // 各来源的加载失败原因（{ 平台key: 错误 }）：断网/密钥失效要看得见
function loadErrorsText() {
  const ks = Object.keys(loadErrors || {});
  if (!ks.length) return '';
  return '<div class="empty" style="color:var(--warn,#d97706)">部分内容加载失败：<br>'
    + ks.map(k => esc(String(k)) + '：' + esc(String(loadErrors[k]))).join('<br>')
    + '<br><br>（检查网络与密钥，或点「重新加载」重试）</div>';
}
/* 有来源读取失败时先不要再自动续拉：more 保持 true（界面能重试），
   但连着重试同一个失败来源只会把上游打得更死 —— 等用户点「重新加载」或「加载更多」。 */
const loadFailed = () => Object.keys(loadErrors || {}).length > 0;
function paintLoadErrors() {
  const box = $('loadErr');
  if (!box) return;
  const txt = loadErrorsText();
  box.innerHTML = txt ? '<div class="hint" style="color:var(--warn,#d97706);margin:6px 0">'
    + Object.keys(loadErrors).map(k => esc(String(k)) + ' 加载失败：' + esc(String(loadErrors[k]))).join('；') + '</div>' : '';
}

/* ---------- 多选（工具栏「多选」按钮开启） ----------
   资产库的内容是**实时从各平台接口拉回来的**，所以这里只提供「批量下载」——
   云端素材删不得（本机没存东西），本机生成的素材（如语音）有各自卡片上的删除按钮。
   多选默认关闭：平时点卡片是打开预览，不会误勾。 */
let multiMode = false;
const selected = new Set();          // 选中的条目 key
const selKeyOf = a => [a.provider, a.assetId || a.id || a.genId].join('|');
function setMultiMode(on) {
  multiMode = !!on;

function fetchMore(pages) {

        seen: seenIds, out: assets,
        onBatch: list => { if (gen !== loadGen) return; assets = mergeEntries(assets, list); refreshProviderChips(); renderGrid(); },
      });
      if (gen !== loadGen) return;      // 期间点过「重新加载」：这批结果作废
      assets = mergeEntries(assets, res.entries);
      // 「条目即资产」的本地来源（一页即全量）：以服务端为准，清掉缓存里已被删掉的旧条目
      // （在语音工作台/别的标签页删过文件时，这里也能自愈）
      for (const src of Api.listSources()) {
        if (!src.spec || !src.spec.selfAsset) continue;
        try {
          const keys = await AssetLib.liveKeys(src.prov);
          if (keys) assets = assets.filter(x => x.provider !== src.key || keys.has(String(x.assetId || x.id)));
        } catch (e2) { /* 读不到就不清 */ }
      }
      cursors = res.cursors;

      // 「没有匹配的资产」，让人以为数据没了
      loadErrors = res.errors || {};
      paintLoadErrors();
    } finally {
      loadingNow = Math.max(0, loadingNow - 1);
      if (gen === loadGen) renderGrid();
    }
  };
  loadChain = loadChain.then(run, run).catch(e => {
    loadErrors = { '加载': e && e.message ? e.message : String(e) };
    paintLoadErrors();

const F = { type: '全部', provider: '全部', status: '全部', q: '', from: '', to: '' };

const PAGE_SIZE = Math.max(1, Number(localStorage.getItem('page_size_assets') || 24));

/* 删除本地落盘的素材：防连锁（同一资产只发一次请求，删完立刻从列表移除） */

  await AssetLib.remove(a);
  assets = assets.filter(x => assetKeyOf(x) !== key);
  assetCardEls.delete(key);
  selected.delete(selKeyOf(a));     // 多选集合也要清：否则批量条还把它算成「已选」，数量对不上
  writeCache(assets);
  tally.run(true);          // 少了一条：后台重数总数（单飞 + 到点再补一趟，不会为一次删除打爆平台）
  return true;
}
async function deleteLocalAsset(a, btn) {
  const key = assetKeyOf(a);
  if (deletingIds.has(key)) return;
  if (!assets.some(x => assetKeyOf(x) === key)) { toast('这条素材已经不在列表里了'); return; }   // 已经删过了
  deletingIds.add(key);
  const label = btn.dataset.old || btn.textContent;
  btn.disabled = true; btn.textContent = '删除中…';
  try {
    await removeEntry(a);
    refreshProviderChips(); renderGrid();
    toast('✓ 已删除这条本地素材');

    btn.disabled = false; btn.textContent = label;
    toast('删除失败：' + e2.message);

  const raw = `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())} ${p || 'file'}.${ext}`;

  if (dir && await verifyPerm(dir)) return dir;
  if (!window.showDirectoryPicker) throw new Error('当前浏览器不支持选择文件夹，请用 Chrome/Edge');
  if (interactive) { dir = await window.showDirectoryPicker({ id: 'skLib_' + key, startIn: 'desktop', mode: 'readwrite' }); await idbSet(key, dir); return dir; }

  const idx = assets.slice(0, 300).map(a => ({
    类型: a.type, 提示词: (a.prompt || '').slice(0, 90), 时长: a.duration || null, 平台: a.providerName,
    模型: a.model || '', 资产ID: a.assetId || '', 任务ID: a.genId || '',
    备注: favNote(a),
    日期: AssetLib.tsMs(a.ts) ? new Date(AssetLib.tsMs(a.ts)).toISOString().slice(0, 10) : null,
  }));
  // 我的收藏（含备注）：AI 可以用它理解“我收藏的那个…”这类说法
  const favs = window.Fav ? Fav.text(60) : [];
  const sys = '你是素材检索助手。把用户需求翻译成筛选条件，只返回 JSON，不要解释或代码块：'
    + '{"keywords":["关键词"],"type":"图片|视频|音乐|任意","after":"YYYY-MM-DD 或 null","before":"YYYY-MM-DD 或 null","minDuration":0,"maxDuration":null,"order":"asc|desc","limit":60,"summary":"一句话"}'
    + '。注意：可用素材里带了「资产ID/任务ID」，如果用户给的是 ID，请把该 ID 原样放进 keywords 里。';
  const btn = $('aiSearchBtn');
  const old = btn.textContent;
  btn.disabled = true; btn.textContent = '检索中…';
  try {
    const reg = await Api.registry();
    const out = await TextAI.chat(reg, sys, JSON.stringify({ 需求: v.q, 可用素材样例: idx, 我的收藏: favs }));
    const j = TextAI.parseJson(out);
    if (!j) throw new Error('AI 没有给出可用的检索条件');
    FAI = { desc: v.q, cond: j };
    /* 搜索框里的原话已经翻译成 AI 条件了：关键词必须清掉，否则「整句描述」还会再 AND 过滤一遍，
       而整句几乎不可能是某条提示词的子串 —— 结果就是永远 0 条。条件本身显示在下面那行提示里。 */
    if (box) box.value = '';
    F.q = '';
    toast('AI 检索条件已生效（原话：' + v.q.slice(0, 24) + '），清空条件点下面的 ✕');
  } catch (e) {
    toast('AI 检索失败：' + e.message);
  } finally {
    btn.disabled = false; btn.textContent = old;
  }
  paintAiChip();
  renderGrid();
}
$('aiSearchBtn').onclick = () => runAiSearch();

/* ---------- AI 检索：自然语言 → 筛选条件 → 就地过滤 ---------- */
function paintAiChip() {
  const el = $('aiChip');
  if (!el) return;
  el.innerHTML = FAI
    ? `<span class="ai-chip">${icon('sparkles', 12)} ${FAI.desc.slice(0, 22)}${FAI.cond.summary ? ' · ' + FAI.cond.summary : ''}<button id="aiClear" title="清除 AI 条件">✕</button></span>`
    : '';
  const c = $('aiClear');
  if (c) c.onclick = () => { FAI = null; paintAiChip(); renderGrid(); };
}

async function reload() {
  loadGen++;                                   // 让正在飞的旧批次作废
  seenIds = new Set();
  cursors = {}; hasMoreFlag = true;
  assetsPage = 0; loadedPages = 0;
  const b = $('reloadBtn'); const old = b.innerHTML;
  b.disabled = true; b.title = '正在加载…';        // 只改禁用态与提示，不改文字（文字一变，右侧那排按钮就跟着挪）
  noCacheOnce = true;                              // 手动刷新要拿最新，绕过服务端列表短缓存
  try { await load(); } finally { b.disabled = false; b.title = '重新加载（跳过服务端短缓存）'; b.innerHTML = old; }
}
$('pgPrev').onclick = () => { if (assetsPage > 0) { assetsPage--; renderGrid(); } };
$('pgNext').onclick = async () => {
  assetsPage++;
  const b = $('pgNext'); b.disabled = true; b.textContent = '加载中…';
  try {
    // 已加载数据不够这一页时，继续往后拉（游标续拉，不重头取）
    while (filteredAll().length < (assetsPage + 1) * PAGE_SIZE && hasMore() && !loadFailed() && loadedPages < 40) await fetchMore(2);
  } catch {}
  b.disabled = false; b.textContent = '下一页 ›';
  renderGrid();
};
$('gotoBtn').onclick = () => gotoPageInput();
$('gotoPage').addEventListener('keydown', e => { if (e.key === 'Enter') gotoPageInput(); });
async function gotoPageInput() {
  const n = Math.max(1, Math.floor(Number($('gotoPage').value) || 1)) - 1;
  const b = $('gotoBtn'); b.disabled = true; b.textContent = '跳转中…';
  try {
    if (PAGE_MODE === 'page') {
      while (filteredAll().length < (n + 1) * PAGE_SIZE && hasMore() && !loadFailed() && loadedPages < 40) await fetchMore(2);
      assetsPage = Math.min(n, Math.max(0, Math.ceil(filteredAll().length / PAGE_SIZE) - 1));
    } else {
      // 动态加载：跳页按加载批次推进（每批 2 页，每页 100 条）
      const want = Math.ceil(((n + 1) * PAGE_SIZE) / 100);
      while (loadedPages < want && hasMore() && !loadFailed() && loadedPages < 40) await fetchMore(2);
    }
  } catch {}
  b.disabled = false; b.textContent = '跳转';
  renderGrid();
}
/* 滚到列表底部自动续拉（动态加载模式）：不用点按钮也会一部分一部分地长出来 */
let autoBusy = false;
const nearBottom = () => $('gridEnd').getBoundingClientRect().top < window.innerHeight + 300;
async function autoLoadMore() {
  if (autoBusy || PAGE_MODE === 'page' || !hasMore()) return;
  autoBusy = true;
  try {
    // 一屏没填满就继续拉下一批，直到填满或数据取完（最多 40 页，防失控）
    let guard = 0;
    while (hasMore() && !loadFailed() && guard++ < 20 && nearBottom()) await fetchMore(2);
  } catch {}
  autoBusy = false;
}
if ('IntersectionObserver' in window) {
  new IntersectionObserver(es => { if (es.some(e => e.isIntersecting)) autoLoadMore(); }, { rootMargin: '300px' })
    .observe($('gridEnd'));
} else {
  window.addEventListener('scroll', () => { if (nearBottom()) autoLoadMore(); }, { passive: true });
}
$('reloadBtn').onclick = reload;
$('cancelAllBtn').onclick = async () => {
  const rs = assets.filter(a => a.kind === 'task' && ['running', 'queued'].includes(a.status));
  const btn = $('cancelAllBtn');
  if (!rs.length) { btn.textContent = '没有进行中的任务'; setTimeout(() => { btn.textContent = '⏹ 取消全部进行中'; }, 1800); return; }
  if (!btn.dataset.armed) {                        // 页内二次确认：按钮自己变成确认态
    btn.dataset.armed = '1';
    btn.dataset.old = btn.textContent;
    btn.textContent = '确认取消 ' + rs.length + ' 个？';
    setTimeout(() => { btn.dataset.armed = ''; if (btn.isConnected) btn.textContent = btn.dataset.old; }, 3000);
    return;
  }
  btn.dataset.armed = '';
  btn.textContent = '取消中…';
  await Promise.allSettled(rs.map(a => AssetLib.cancel(a)));
  await reload();
  btn.textContent = btn.dataset.old || '⏹ 取消全部进行中';
};
async function load() {
  if (window.Dropdowns) Dropdowns.build(document);
  renderFilters();
  if (!REG.providers.length) await loadReg();
  if (!assets.length) {                        // 首屏：先把上次缓存秒画出来，网络数据到了再逐条覆盖
    const cached = readCache();
    if (cached.length) { assets = cached; refreshProviderChips(); renderGrid(); }
  }
  await fetchMore(1);          // 第一批：每平台先拉 1 页，尽快把内容显示出来
  fetchMore(1);                // 第二批后台补齐；再往后的由滚动/「加载更多」按需拉
  tally.run(true);             // 后台数总数（首屏与「重新加载」都走这里，数完分页文案才不带加号）
}
(async () => {
  await load();
  /* 视频缩略图首帧缓存（IndexedDB）：读出来直接当图片用 —— 不必每张卡都去取一次视频元数据 */
  Wb.thumbs.hydrate().then(n => { if (n) { try { renderGrid(); } catch {} } }).catch(() => {});
})();
</script>
