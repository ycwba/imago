<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('dir_theme')||'light'}catch(e){}</script>
<title>素材库 · 拾帧</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236d5cf5'/%3E%3Ctext x='16' y='22' font-family='system-ui,-apple-system,Segoe UI,sans-serif' font-size='15' font-weight='700' fill='%23fff' text-anchor='middle'%3EAI%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="ui.css">
<style>
  
  /* 本页**有意**与全站不同的一条：深色下的强调色更亮一点（素材库卡片密度高，
     深底上 #7c5cff 那些数字偏暗）。**只留真正不同的这一条** ——
     其余公共变量一律跟 ui.css 走（原来这里还写过 --thumbbg:#1b1f2c，
     与导演台的 #39415a 不是同一个颜色，同一个「缩略图占位底色」两页两个色，见 ui.css 顶部的说明）。 */
  html[data-theme="dark"] { --pri:#9d8bff; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--txt); min-height: 100vh; }
  .page-main { padding: 30px 40px 60px; }
  h1 { font-size: 24px; margin: 0 0 8px; display: flex; align-items: center; gap: 8px; }
  .desc { font-size: 14px; color: var(--sub); line-height: 1.7; max-width: 860px; }
  /* .toolbar 的 flex / 间距 / 换行在 ui.css（公共一份）；.toolbar2、.toolbar3 公共里没有，还在这里。 */
  .toolbar { margin: 20px 0 6px; }
  .toolbar2, .toolbar3 { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .toolbar2 { margin: 0 0 6px; }
  .toolbar3 { margin: 0 0 16px; }
  .toolbar3 .sp { flex: 1; }   /* .toolbar / .toolbar2 的那两条已收进 ui.css */
  .toolbar input[type=search] { flex: 0 1 300px; }   /* 盒子的样式在 ui.css，这里只留本页的宽度 */
  /* 型号这两个下拉：没有当前某一集的 opts，就按本页选的型号出图 / 出声音（存 char_opts） */
  .pick { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--sub); }
  /* 「画风」输入框与它的 .pick input 样式已于 2026-10 一并删掉（画风只属于每一集自己）。 */
  /* 卡片上那句失败原因（一次出齐时不弹一串 toast，原因留在没出来的那一张上） */
  .card .why { font-size: 11.5px; color: var(--err); line-height: 1.5; }
  /* 分组那一排只有一个「看哪一组」的下拉（「把整组加进某一集」那颗按钮已删，见下面 paintGroups） */
  .grp { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--sub); }
  .grp select { min-width: 120px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(268px, 1fr)); gap: 16px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; position: relative;
    display: flex; flex-direction: column; transition: border-color .15s, box-shadow .15s; }
  .card:hover { border-color: var(--acc); box-shadow: 0 6px 20px rgba(0,0,0,.09); }
  .card .thumb { height: 150px; background: var(--thumbbg); display: flex; align-items: center; justify-content: center;
    overflow: hidden; cursor: zoom-in; }
  .card .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card .thumb .none { color: var(--sub); font-size: 12px; text-align: center; line-height: 1.6; padding: 0 10px; }
  /* 有预览图时这一格是「看大图」，没有时是「自己挑一张」—— 两种手感要看得出来 */
  .card .thumb[data-a="pickface"] { cursor: copy; }
  .card .body { padding: 9px 11px 11px; display: flex; flex-direction: column; gap: 6px; }
  .card .nm { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .card .tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .card .bio { font-size: 12.5px; color: var(--sub); line-height: 1.55; }
  .card .assets { display: flex; gap: 6px; flex-wrap: wrap; }
  .card .assets .th { width: 46px; height: 46px; border: 1px solid var(--line); border-radius: 6px; overflow: hidden;
    background: var(--panel2); cursor: zoom-in; position: relative; }
  .card .assets .th img { width: 100%; height: 100%; object-fit: cover; display: block; }
  /* 资产是**列表**了：一张一个缩略图，底下压一行类型标签 ——
     否则三张图并排全是脸，用户分不清哪张是三视图、哪张是表情表。 */
  .card .assets .th i { position: absolute; left: 0; right: 0; bottom: 0; font-style: normal;
    font-size: 9.5px; line-height: 1.3; text-align: center; color: #fff; background: rgba(0,0,0,.62); }
  /* 资产列表里的一张：缩略图 + **名字输入框** + 关联道具多选 + 重出 + 去掉。竖着排，别挤成一行。 */
  .ui-asset { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; width: 100%;
    padding: 6px 0; border-top: 1px solid var(--line); }
  .ui-asset:first-of-type { border-top: 0; }
  .ui-asset .ui-cand b { font-weight: 600; font-size: 12px; }
  .ui-props { display: flex; flex-direction: column; gap: 3px; width: 100%; }
  .ui-proprow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 11.5px; }
  .ui-proprow > b { color: var(--sub); font-weight: 600; min-width: 52px; }
  .ck.sm { display: inline-flex; align-items: center; gap: 3px; font-size: 11.5px; font-weight: 400; }
  /* 「加一张角色资产」那一行的三个输入：名字 / 模板 / 自定义描述。
     宽度按内容分档，不给死 —— 自定义描述那一格要能写一句完整的话。
     禁用的那一格（没选「自定义」时）**保持可见**：藏了会让人以为没这个功能。 */
  .ui-inp:disabled { opacity: .5; cursor: default; }
  .ui-inp[data-a="assetname"] { flex: 0 1 168px; }
  .ui-inp[data-a="assetwhat"] { flex: 1 1 200px; }
  .ui-asset .ui-inp[data-a="assetrename"] { flex: 0 1 168px; }
  .card .acts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 2px; align-items: center; }
  .card .acts .sp { flex: 1; }   /* 编辑区那一行把「去掉参考音频」顶到行尾 */
  .card .acts .tool { padding: 4px 10px; font-size: 11.5px; }   /* .ghost 已收进 ui.css */
  /* 就地展开的编辑区（名字 / 类型 / 分组 / 描述 / 声音）——不弹新窗，改完即存 */
  .card .edit { border-top: 1px solid var(--line); padding: 10px 11px 12px; display: flex; flex-direction: column; gap: 8px; }
  /* 展开中那一张要认得出来：卡片一大排，光看哪块多了输入框不够（编辑区在卡片底部，常在屏幕外） */
  .card.open { border-color: var(--acc); box-shadow: 0 0 0 2px rgba(108,140,255,.18); }
  /* 编辑区顶行：一句「在改谁」+ 收起。收起必须在这一块里就能按到 ——
     只有卡片中部那颗「编辑」能收起时，长编辑区滚到底就收不掉。 */
  .card .edit .eh { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--sub); }
  .card .edit .eh > .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .edit label { font-size: 12px; color: var(--sub); }
  .card .edit input, .card .edit textarea { width: 100%; border: 1px solid var(--line); border-radius: 7px;
    padding: 6px 8px; background: var(--input); color: var(--txt); font: inherit; font-size: 12.5px; resize: vertical; outline: none; }
  /* 勾选框不吃上面那条 width:100%（否则一颗勾被拉成一整条灰块） */
  .card .edit input[type=checkbox] { width: auto; padding: 0; height: auto; accent-color: var(--acc); }
  .card .edit label.ck { display: flex; align-items: flex-start; gap: 7px; line-height: 1.5; }
  .card .edit label.ck input { margin-top: 2px; }
  .card .edit input:focus, .card .edit textarea:focus { border-color: var(--acc); }
  /* 编辑区的小节标题：把原来一长条 label 分成「基本信息 / 描述 / 画面 / 声音」几组。
     `.edit` 是 flex column + gap:8px，所以这里只补「上面多留一点」的那一点边距。 */
  .card .edit .ed-sec { margin: 6px 0 -2px; font-size: 11px; font-weight: 600; color: var(--sub); letter-spacing: .05em; }
  /* 一节里并排的几颗按钮（画面那两颗、声音那两颗） */
  .card .edit .ed-acts { display: flex; flex-wrap: wrap; gap: 8px; }
  .empty { line-height: 1.9; }   /* 其余交给 ui.css 的 .empty（字号跟公共的 13px） */
  .busy { font-size: 12px; color: var(--acc); }
  /* 列表档：横条一行一位，缩略图在左、信息在右 */
  .grid.view-list .card { flex-direction: row; align-items: stretch; }
  .grid.view-list .card .thumb { width: 150px; height: auto; flex: 0 0 150px; border-right: 1px solid var(--line); }
  /* 展开编辑区后整张卡有一人多高：缩略列是 stretch 的，不压一下就会把预览图拉成一条几倍高的色块
     （object-fit:cover 只会把它放大到失真，不会留白）。让图钉在上沿、保持收起时那 150px。 */
  .grid.view-list .card.open .thumb { align-items: flex-start; }
  .grid.view-list .card.open .thumb img,
  .grid.view-list .card.open .thumb .none { height: 150px; }
  .grid.view-list .card.open .thumb .none { display: flex; align-items: center; justify-content: center; }
  .grid.view-list .card .main { flex: 1; min-width: 0; }
  @media (max-width: 760px) { .page-main { padding: 18px 14px 40px; }
    .grid.view-list .card { flex-direction: column; } .grid.view-list .card .thumb { width: auto; flex: 0 0 auto; height: 150px; } }
</style>
</head>
<body>
<div class="page-main">
  <h1><span id="tic"></span>素材库</h1>
  <div class="desc">可复用的<b>角色</b>、<b>场景</b>与<b>道具</b>：预览图、描述、声音与角色资产都在这里改一次，
    导演台选参考图、生成工作台出图出配音都直接用这一份，不必每处重画。</div>

  <div class="toolbar">
    <div class="chips" id="chips"></div>
    <input type="search" id="q" placeholder="搜索素材">
    <button class="tool acc" id="aiFindBtn" title="把搜索框那句话交给文字 AI，由它从整个库里挑最合适的几条"></button>
    <span id="aiChip"></span>
    <span class="cnt" id="cnt"></span>
  </div>
  <div class="toolbar2">
    <span class="grp">分组<span id="grpPick"></span></span>
    <button class="tool" id="btnFill" title="把当前这一档里还没有预览图、角色还缺三视图的素材一次交给生图平台"></button>
    <button class="tool" id="btnLocal" title="把当前这一档里「本机还没有那份字节」的图与参考音频取回本机资产库存一份：换机器、外链过期、关掉网页都不影响它们。存好的那一份同时记进本机镜像索引，生成工作台与资产库也认得。"></button>
    <span class="sp"></span>
    <span class="busy" id="busy"></span>
    <button class="ghost" id="btnStop" hidden>停下</button>
    <span class="viewtoggle" id="fView"></span>
    <button class="tool" id="btnNew"></button>
  </div>
  <div class="toolbar3">
    <span class="pick">出图型号<span id="imgPick"></span></span>
    <span class="pick">出图张数<span id="candPick"></span></span>
    <span class="pick">语音型号<span id="ttsPick"></span></span>
  </div>

  <div class="grid" id="grid"></div>
  <div id="gridEnd" style="height:1px"></div>
  <div class="pager-row" id="pagerRow">
    <button class="ghost" id="pgPrev">‹ 上一页</button>
    <span class="pginfo" id="pgInfo"></span>
    <button class="ghost" id="pgNext">下一页 ›</button>
  </div>
</div>
<datalist id="grpList"></datalist>

<script src="ui.js"></script>
<script src="workbench.js"></script>
<script src="sidebar.js"></script>
<script src="ident.js"></script>
<script src="assetlib.js"></script>
<script src="chars.js"></script>
<script>
(function () {
  const $ = id => document.getElementById(id);
  const D = window.Chars, esc = s => window.esc(s);
  const AK = D.Cast.ASSET_KINDS;
  let REG = null;
  let filter = 'all';
  let group = '';                 // '' = 全部组；'__none' = 未分组
  let aiPick = null, aiWhy = '';   // AI 挑出来的一批（id 集合）+ 它自报的理由
  let aiRank = null;               // AI 给的次序（id → 名次，最合适的排 0）；只有它挑过才照这个名次排
  /* ---------- 顺序只有两种，界面上一颗都挑不了 ----------
     AI 挑过 → 照它给的名次排（最合适的在前）；没挑过 → 按名称 A→Z。
     以前这里有一排排序芯片（名称 / 类型 / 分组 / 时间），档位存 `dir_char_sort`，
     那是个纯显示偏好；这一页真正常用的找法是上面的类型芯片、分组那一排与搜索框。
     类型仍走 D.libKindOf 那一份判据，不按字段形状猜 —— 库里那条「还没写过外貌的角色」
     读回来就没有 look，按形状猜会把角色认成场景（这个坑 AGENTS.md 里点名过）。 */
  const aiRankOf = c => (aiRank && aiRank.has(c.id) ? aiRank.get(c.id) : Number.MAX_SAFE_INTEGER);
  function orderItems(items) {
    if (aiRank) return items.slice().sort((a, b) => aiRankOf(a) - aiRankOf(b));
    /* 'zh' 要显式写：不带 locale 时按**浏览器默认**排，中文机上是拼音、英文机上就成了按码位排 ——
       同一份库在两台机器上顺序不一样。素材库分组那一排（chars.js 的 groups）用的就是 'zh'。 */
    return items.slice().sort((a, b) => String(a.name || '').trim().localeCompare(String(b.name || '').trim(), 'zh'));
  }
  let openId = '';                 // 哪一张卡展开了编辑区
  let busyMsg = '';
  /* 「一次出齐」这一轮的两位状态：按过停下（不再开新的任务）、这一轮有没有停下可言。
     声明在这一排而不是批量那一段里 —— paintBusy 每次记账都要读它们，
     而 boot 之前若有别处调 paintBusy，`let` 还没执行到就会撞 TDZ。 */
  let stopFlag = false, fillStoppable = false;
  /* 「存回本机」那颗按钮也在读这份状态（paintBusy 每次记账都要重画它），同理提前声明。 */
  let localBusy = false;
  let renderSeq = 0;
  const viewItems = [];            // 当前视图的素材（灯箱翻页范围）
  const media = [];                // 当前视图能点开看的图（预览图 + 各资产）

  /* 这一页没有「某一集」，所以出图 / 出声音用的型号在本页选一下（存 char_opts）。
     传进 Chars.Pipe 时套成 drama 的样子（那些函数只读 opts.imgModel / opts.ttsModel / opts.ratio）。 */
  let opts = { imgModel: '', ttsModel: '', ratio: '9:16', style: '' };
  try { opts = Object.assign(opts, JSON.parse(localStorage.getItem('char_opts') || '{}')); } catch (e) {}
  /* 出图与配音那两条流水线照旧吃一个「一集」当参数（它们要读 opts.imgModel / ttsModel / ratio，
     也需要一个角色数组来收结果）。素材库页没有「一集」，所以现搭一个壳传进去 ——
     数据层的 assignVoices 不再把它写回任何地方（没有宿主可写）。 */
  const fakeDrama = () => ({ opts: opts, characters: [], scenes: [], shots: [] });
  function saveOpts() { try { localStorage.setItem('char_opts', JSON.stringify(opts)); } catch (e) {} }
  function setBusy(m) { busyMsg = m; paintBusy(); }
  /* 底栏一句话 + 「停下」那颗按钮 + 批量那颗按钮的可用性，都跟着这份记账走：
     三处读同一张表，就不会出现「圈还在转、按钮已经能点」或反过来。 */
  function paintBusy() {
    const el = $('busy'); if (el) el.textContent = genLine() || busyMsg;
    const b = $('btnStop'); if (b) b.hidden = !(genHas('fill', null) && fillStoppable);
    paintFillBtn();
    paintLocalBtn();
  }
  /* 谁在生成：一张表记「这一条的哪一项正在出」（预览图 / 某一类设定图 / 声音候选）。
     三样事都读它：格子里的占位圈、按钮的禁用态、重复点同一项的闸门 —— 白花一次钱就在这一处拦。
     不同条、不同项并发照旧放行，它们本来就互不相干。 */
  const GEN = new Map();
  const gKey = (kind, id) => kind + '#' + id;
  /* 出图表单那一行（名字 / 模板 / 要画什么）的草稿，按素材 id 存。
     它必须存在页面这一层：出完一张会重画这张卡（`paintCard`），
     以前那三个输入框的值与焦点全被抹掉 —— 用户正在打「雨天造型」，
     上一次出的结果一回来，字没了，模板也跳回第一项。 */
  const DRAFT = new Map();
  const draftOf = id => DRAFT.get(id) || { name: '', tpl: '', what: '' };
  function genSet(kind, id, msg) { GEN.set(gKey(kind, id), msg); paintBusy(); }
  function genClear(kind, id) { GEN.delete(gKey(kind, id)); paintBusy(); }
  function genHas(kind, id) { return GEN.has(gKey(kind, id)); }
  function genMsg(kind, id) { return GEN.get(gKey(kind, id)) || ''; }
  function genLine() { return Array.from(GEN.values()).filter(Boolean).join('　｜　'); }
  /* 「这一项上一次没出来，为什么」也按「哪一条的哪一项」记，与 GEN 同一套键。
     记在页面上而不是素材对象上：这一轮的失败是**这一轮的**账（出图失败、平台超时），
     落进库里就变成一条永久挂着、又不跟着重试清掉的旧话；数据层只留两条真需要跨页的
     （`voiceErr` / `voiceAuto`，见 `Chars.Lib.save` 的拷贝清单）。
     批量那一轮尤其需要它 —— 40 条里砸 3 条，toast 会连着响三声把界面淹了，
     而真正该看的那句话得留在这几张卡上。 */
  const ERR = new Map();
  function errSet(kind, id, msg) { const k = gKey(kind, id); if (msg) ERR.set(k, msg); else ERR.delete(k); }
  /* 这一条卡上**所有**的失败原因，一条一行。以前这里只查 `asset#<那一张的 id>` 一种键，
     于是「AI 出这一张」（键是 `asset#new:模板:名字`）与批量那一轮「预览图没出来所以跳过三视图」
     （键是 `asset#three`）两句永远不显示 —— 用户看到的只是「点了没反应」。
     键的第二段就是这一条的 id，所以按尾缀取这一条的整份账，不再猜键名。 */
  function errsHTML(c) {
    const tail = '#' + c.id, out = [];
    for (const [k, msg] of ERR) {
      if (!k.endsWith(tail) || !msg) continue;
      out.push('<div class="why">' + esc(errLabel(k.slice(0, k.length - tail.length), c)) + '：' + esc(msg) + '</div>');
    }
    return out.join('');
  }
  /* 记账键的第一段翻成人话（就是这一项在界面上叫什么）。 */
  function errLabel(kind, c) {
    if (kind === 'face') return '这张' + picWord(c);
    if (kind === 'voice') return '试听';
    if (kind === 'voicecands') return '声音候选';
    if (kind.indexOf('asset#new:') === 0) {
      const rest = kind.slice('asset#new:'.length), i = rest.indexOf(':');
      return (i < 0 ? '' : rest.slice(i + 1)) || D.Cast.assetLabel(c, i < 0 ? rest : rest.slice(0, i)) || '这张角色资产';
    }
    if (kind.indexOf('asset#') === 0) {
      const id = kind.slice('asset#'.length);
      const a = D.Cast.assetById(c, id);
      return (a && D.Cast.assetName(a)) || D.Cast.assetLabel(c, id) || '这张角色资产';
    }
    return '这一项';
  }
  /* 这一条身上有没有一项正在生成（删掉它之前要问一句：收尾那一次写库会把刚删的这条写回去）。 */
  function genOn(c) {
    const tail = '#' + c.id;
    for (const k of GEN.keys()) if (k.endsWith(tail)) return k.slice(0, k.length - tail.length);
    return '';
  }
  /* 存这一条 —— 全页写库的唯一出口。
     `Lib.save` 有两种「没存进去」：配额撞满（写了、其实没落盘）与库里那份读不出来
     （**一个字都不写**，写下去就把整库洗成一条）。两种原因都由数据层留着，这里取一次、
     照实说，不让人对着「改完就地存」那句话以为已经保存了。 */
  let libWarnedAt = 0;
  function libSave(c) {
    const saved = D.Lib.save(c, { exact: true });
    const e = D.Lib.writeError();
    if (e) {
      const now = Date.now();
      if (now - libWarnedAt > 8000) { libWarnedAt = now; Toast.err(e, 9000); }
      return null;
    }
    return saved;
  }
  const src = s => Api.mediaSrc(s);
  /* ---------- 「切页不丢」：把正在跑的出图任务号落盘 ----------
     外壳换页会把这一页的 JS 整个丢掉，但**平台那边的任务还在跑**。以前回来之后占位没了、
     图也没了，只能重花一次钱；现在拿到任务号就存下来，下次打开这一页把它们认领回来接着等
     （`D.AiGen.adopt`，不重发请求）。
     形状：{ 'bus#条目id': { kind, id, at, label, tasks: [{ prov, id }] } }
     用 localStorage 而不是 Store：这是本机一次性的临时状态，不该跟着云同步走。 */
  const PEND = (() => {
    let m = {};
    try { m = JSON.parse(localStorage.getItem('char_pending') || '{}') || {}; } catch (e) { m = {}; }
    const save = () => { try { localStorage.setItem('char_pending', JSON.stringify(m)); } catch (e) {} };
    return {
      get(k) { return m[k]; },
      set(k, rec) { m[k] = rec; save(); },
      del(k) { if (m[k]) { delete m[k]; save(); } },
      all() { return Object.keys(m).map(k => ({ key: k, rec: m[k] })); },
    };
  })();
  /* 交给 D.Pipe 的 onTask：拿到任务号就记进待认领表。
     `genRun` 在跑之前把它设成当前那一条的记录器（见 genRun），所以生成函数里
     只要原样把 `onTask: onTaskHook` 传下去就行，不必每处各写一遍 id 与 bus。 */
  let curPend = null;
  /* 每轮一个**绑定好的**记录器：`genRun` 把它当参数递给生成函数。
     为什么不能只靠 `curPend` 这个全局游标 —— 「一次出齐这一档」是 runPool 并发 6 路
     （:1226），每个 worker 的 genRun 都会把全局改写成自己，await 期间又被下一路覆盖，
     于是 onTaskHook 读到的是**最后启动那一条**的记录，任务号写进别人的键，
     切页回来认领时 A 的图挂到 B 的卡上。靠参数传下去就没有「当前是谁」这回事了。 */
  const pendHook = rec => info => {
    if (!rec || !info || !info.id) return;
    const cur = PEND.get(rec.key) || { kind: rec.kind, id: rec.id, at: 0, label: '', tasks: [] };
    cur.at = Date.now();
    cur.label = rec.label || cur.label;
    if (!cur.tasks.some(t => String(t.id) === String(info.id))) {
      cur.tasks.push({ prov: (info.prov && info.prov.id) || '', id: info.id });
    }
    PEND.set(rec.key, cur);
  };
  const onTaskHook = info => pendHook(curPend)(info);
  /* 回来把上次没等完的出图认领回来：不重发请求，只接着等，拿到就按**与正常出图同一套规则**
     写回（预览图进 faces、没有主图就顶上；资产追加一张）。半小时以前的不再打扰（平台多半已经清了）。 */
  async function resumePending() {
    const stale = 30 * 60 * 1000;
    let done = 0, lost = 0;
    const jobs = [];
    for (const { key, rec } of PEND.all()) {
      if (!rec || !Array.isArray(rec.tasks) || !rec.tasks.length) { PEND.del(key); continue; }
      if (Number(rec.at) < Date.now() - stale) { PEND.del(key); continue; }
      const c = D.Lib.list().find(x => x && x.id === rec.id);
      if (!c) { PEND.del(key); continue; }
      jobs.push({ key, rec, c });
    }
    /* 并发认领（与「一次出齐」同一套池子、同一个上限 FILL_CONC）：
       逐条串行等的时候，一条还没出图的能把整趟拖住五分钟（AiGen.wait 的单条上限），
       二十几条待认领就是二十几分钟 —— 而排在后面的那些连「正在取回」都还没摆出来，
       看着就像「上次那批图没了」。正常出图那一趟本来就是并发跑 AiGen 的，
       认领这一趟不该比它更占上游，所以沿用同一个上限，不另编一个数。
       每条任务**内部**仍然串行：一个 rec 里的几条是同一档候选，收齐了才一次写回。 */
    await D.Pipe.runPool(jobs, FILL_CONC, async job => {
      const { key, rec, c } = job;
      genSet(rec.kind, rec.id, '正在取回上次没等完的出图…');
      paintCard(c);
      const got = [];
      for (const t of rec.tasks) {
        try {
          const e = await D.AiGen.adopt(t.prov, t.id, { want: 1 });
          (e.entries || [e]).filter(x => x && x.src).forEach(x => got.push(x.src));
        } catch (e2) { /* 取不回来的那条不打断其余的；下面照实说 */ }
      }
      genClear(rec.kind, rec.id);
      PEND.del(key);
      if (!got.length) { lost++; paintCard(c); return; }
      const bus = String(rec.kind || '');
      if (bus === 'face') {
        const old = (c.faces || []).slice();
        c.faces = got.map((s2, i) => ({ src: s2, name: '第 ' + (old.length + i + 1) + ' 张' })).concat(old).slice(0, D.FACE_CAP);
        if (!D.picOf(c)) D.setPic(c, got[0]);
      } else if (bus.indexOf('asset#new:') === 0) {
        D.Cast.addAsset(c, { name: rec.label || '', tpl: bus.slice('asset#new:'.length), src: got[0] });
      } else if (bus.indexOf('asset#') === 0) {
        const a = D.Cast.assetById(c, bus.slice('asset#'.length));
        if (a) { a.src = got[0]; D.Cast.assetsSave(c, D.Cast.assetsOf(c)); }
      }
      libSave(c);
      done++;
      paintCard(c);
    });
    if (done) Toast.ok('取回了 ' + done + ' 条上次没等完的出图（切页之前发出去的，任务一直在平台上跑）', 6000);
    if (lost) Toast.warn('有 ' + lost + ' 条上次的出图没取回来（平台可能已经清了那条任务），在编辑区里重出一次即可', 8000);
  }
  /* 编辑区打字时的落盘：700ms 防抖（见 bindCard 的 data-f 那一圈）。
     只留一个计时器：同时只可能有一个编辑区开着（`openId`），不必按条目分桶。 */
  let fieldTimer = null;
  function queueFieldSave(c) {
    clearTimeout(fieldTimer);
    fieldTimer = setTimeout(() => { libSave(c); }, 700);
  }
  const isScene = x => D.isSceneItem(x);
  const isProp = x => D.isPropItem(x);
  /* 「这一条会不会说话」只有这一份判据（D.Cast.isVoiced）—— 场景与道具不出声。
     以前卡片、编辑区、筛选、灯箱各写一遍 `!isScene(c) && !isProp(c)`，漏一处就多一块音色控件，
     而道具根本没有声音（`voiceTag` / `voiceRowHTML` 自己在数据层就返回空串，这里只是省掉判断）。 */
  const voiced = x => D.Cast.isVoiced(x);
  /* 「现在**能选哪几个出图模板**」读 D.Cast 一份判据，页面不自己列。
     角色资产本身是**扁平的、名字自己起**的列表（任意种类、不限张数），
     这里管的是「点『AI 出』时用哪段提示词」。场景与道具没有资产子项。 */
  const assetTpls = c => D.Cast.assetTplsOf(c);
  /* 「一次出几张」= 设置页「素材库」那张卡的 candN（可配 1~8）再夹生图型号声明的
     `max_outputs`（chars.js 的 `Pipe.candCount` 一处判据）。**两页读的是同一个数** ——
     素材库里攒下的候选会跟着角色拉进某一集，两个页面对「几张」各有一套定义就会出现
     「这边出 3 张、那边只出 1 张」。`ONE` 保留给「明确只要一张」的那些调用
     （失败重试、批量补画），它们不是候选场景。 */
  const ONE = 1;
  const candCount = () => Math.max(ONE, Number(D.candCount(REG, opts)) || ONE);
  /* 按钮文案里的张数：**只在多于 1 张时才写出来**（1 张时说「出预览图」本来就是一张）。
     一律现算 `candCount()` —— 文案上的数与真正发出去的数量必须是同一个数。 */
  const nSuffix = () => { const n = candCount(); return n > 1 ? ' ' + n + ' 张' : ''; };
  /* 「再画 N 张」那颗按钮：张数与文案都现算（设置改了、平台换了上限，按钮跟着变）。 */
  function moreCandsBtn(kind, dis) {
    const n = candCount();
    return `<button class="ui-linkbtn" data-a="morecand" data-k="${esc(kind)}"${dis ? ' disabled' : ''}>`
      + (n > 1 ? '再画 ' + n + ' 张候选' : '再画 1 张') + '</button>';
  }
  /* 一份字段表：主图与角色资产各处的「再画 N 张 / 用这一张」完全同构，候选都攒在
     `x.faces` / `x.assetCands[tpl]`。
     ⚠ 资产是**扁平列表**了（任意种类、不限张数、每张一个名字），
        所以资产的候选**不再进这张表** —— 那套是「每一类一个候选排」，
        与「一张图一个名字」冲突。资产出图走编辑区里那一行自己的表单。 */
  const CANDK = {
    face: { bus: 'face', lab: '预览图',
      gen: x => D.Pipe.drawPreview(REG, fakeDrama(), x, { onTask: onTaskHook }),
      got: x => D.picOf(x), set: (x, v) => D.setPic(x, v) },
  };
  /* 场景 / 道具的主图与角色同一条路（`drawPreview` 按类型自己判），只是那张在用的字段
     是 `img`（场景）而不是 `face`，所以这里补两个别名指向同一份实现。 */
  CANDK.img = { bus: 'face', lab: '场景图', gen: x => D.Pipe.drawPreview(REG, fakeDrama(), x, { onTask: onTaskHook }),
    got: x => x.img, set: (x, v) => { x.img = v; } };
  CANDK.prop = { bus: 'face', lab: '道具图', gen: x => D.Pipe.drawPreview(REG, fakeDrama(), x, { onTask: onTaskHook }),
    got: x => x.face, set: (x, v) => { x.face = v; } };
  /* 这一条的主图属于哪一档（角色=face / 场景=img / 道具=prop） */
  const mainKind = c => isScene(c) ? 'img' : isProp(c) ? 'prop' : 'face';
  /* 出 N 张新候选，**不动已经选中的那张**（不传 replace）：挑还没挑就被人换掉，
     比「只能一次出一张」更糟 —— 用户花钱攒的那一排会白攒。 */
  async function moreCands(c, kind) {
    const k = CANDK[kind]; if (!k) return;
    await genRun(k.bus, c.id, c, '正在给「' + c.name + '」出 ' + candCount() + ' 张' + k.lab + '候选…',
      () => k.gen(c));
  }
  function useCand(c, kind, src) {
    const k = CANDK[kind]; if (!k || !src) return;
    k.set(c, src);
    /* 存不进去时（`libSave` 已经把原因弹出来了）不再补一句「这条现在用这张」——
       那一句在这个分支里是假话：画面上选了、库里没动，刷新就退回原来那张。 */
    const ok = !!libSave(c);
    paintCard(c);
    if (!ok) return;
    toast('这条现在用这张。已经拍过的段还是旧参考图，要生效得重拍那一段', 'ok', 4200);
  }
  /* 跑一份生成：记账 → 只重画这一张卡（整页 render 会连编辑区一起收起）→ 跑 → 撤账再重画。
     `quiet` 给批量那一轮用：原因写在这张卡上（errSet + 卡片红字），不再一条一声 toast。 */
  async function genRun(kind, id, c, msg, fn, quiet, label) {
    if (genHas(kind, id)) { if (!quiet) Toast.err('这一项正在生成中，好了会自动出现，不用再点一次'); return false; }
    genSet(kind, id, msg); errSet(kind, id, ''); paintCard(c);
    /* 这一轮的任务号记到哪个条目上（见 PEND / onTaskHook）：生成函数里把 `onTask: onTaskHook`
       原样传下去，拿到号就落盘 —— 切页之后回来能认领。
       `label` 只在「切页后要凭它给新资产起名」时才用得到（资产那一行填的名字）。 */
    const prevPend = curPend;
    curPend = { key: kind + '#' + id, kind: kind, id: id, label: label || '' };
    /* 并发的那几处（fillRest 的 runPool）要拿**这一轮自己的**记录器，见上面 pendHook 的说明；
       顺序执行的调用点继续用全局 onTaskHook 也一样对。 */
    const hook = pendHook(curPend);
    let err = '';
    try { await fn(hook); } catch (e) { err = (e && e.message) || String(e); }
    curPend = prevPend;
    genClear(kind, id);
    /* 这一轮已经结束了（成没成都一样），从待认领表里摘掉：留着的话下次开页面会去等一个
       早就收完的任务，白转一圈。 */
    PEND.del(kind + '#' + id);
    /* 砸了也要写库：这一轮可能已经改动了候选/时间戳，只把原因记在页面上。 */
    libSave(c);
    errSet(kind, id, err);
    paintCard(c);
    if (err && !quiet) Toast.err(err);
    return !err;
  }
  /* 只重画这一条卡。人正在这张卡里打字（名字 / 描述 / 声音描述）时也要重画 ——
     不然「生成完会自动出现」就落空了；做法是重画后把焦点与光标位置还给原来那一格。 */
  function paintCard(c) {
    /* 「一次出齐」那条按整档现算，不只这张卡 —— 这张卡补上了预览图、勾了「只出声」，
       那颗按钮上的数字与 title 就得当场跟着变，否则界面说的是上一轮的缺口。
       放在最前面：下面几处提前 return（卡片不在当前视图 / 正在打字）都不能把它跳过。 */
    paintFillBtn();
    paintLocalBtn();
    const el = document.querySelector('.card[data-id="' + c.id + '"]');
    if (!el) return;
    const a = document.activeElement;
    const back = a && a !== document.body && el.contains(a) ? String(a.dataset.f || a.dataset.act || '') : '';
    const pos = back && typeof a.selectionStart === 'number' ? a.selectionStart : -1;
    el.innerHTML = cardHTML(c);
    bindCard(el, c);
    if (!back) return;
    const nx = el.querySelector('[data-f="' + back + '"], [data-act="' + back + '"]');
    if (!nx) return;
    nx.focus();
    if (pos >= 0 && nx.setSelectionRange) { try { nx.setSelectionRange(pos, pos); } catch (e) {} }
  }

  /* ---------- 顶部筛选 ---------- */
  /* 三种类型各一档（与库里那三种平级，道具是 2026-10 加的），后面三个是「还缺什么」的缺口档。
     缺口档的名字跟着现在的功能走。`noasset` = 角色**一张角色资产都还没有**
     （以前叫「缺三视图」，是按类别数的；现在资产任意种类、不限张数，
      按「有没有」数才对 —— 否则用户加了一张「雨天造型」之后这一档还会说他缺三视图）。 */
  const FILTERS = [['all', '全部'], ['actor', '角色'], ['scene', '场景'], ['prop', '道具'],
    ['nopic', '还没有预览图'], ['noasset', '还没有角色资产'], ['novoice', '还没有声音']];
  function match(c, f) {
    if (f === 'all') return true;
    if (f === 'actor' || f === 'scene' || f === 'prop') return (D.libKindOf(c)) === f;
    if (f === 'nopic') return !D.voiceOnlyOf(c) && !D.picOf(c);
    /* `nothree` 是**旧档名**：老用户浏览器里存的就是它，直接认掉，
       别让人升级后看着「没筛选生效」—— 删一个键就等于把他们的筛选丢掉。 */
    if (f === 'noasset' || f === 'nothree') return !isProp(c) && !isScene(c) && !D.voiceOnlyOf(c) && D.Cast.assetTplsOf(c).length && !D.Cast.assetsOf(c).length;
    return voiced(c) && !c.refAudio && !c.voice && !String(c.voiceNote || '').trim();
  }
  /* 芯片行走 ui.js 的 Chips（与资产库 / 收藏 / 用量同一份）；这里只给「这一档有多少条」。 */
  function paintChips() {
    const all = D.Lib.list();
    window.Chips.render($('chips'), FILTERS, filter,
      v => { filter = v; resetPaging(); render(); },
      { count: v => all.filter(c => c && match(c, v)).length });
  }
  function paintAiChip() {
    const el = $('aiChip'); if (!el) return;
    el.innerHTML = aiPick
      ? `<span class="ai-chip">${window.icon ? icon('sparkles', 12) : ''} AI 挑的 ${aiPick.size} 条`
        + `${aiWhy ? ' · ' + esc(aiWhy) : ''}<button id="aiClear" title="清除 AI 结果，回到完整名单">${window.icon('close', 11)}</button></span>`
      : '';
    const c = $('aiClear'); if (c) c.onclick = clearAiPick;
  }
  /* 撤掉 AI 条件：三个字段一起清（以前 Escape 那条只清 aiPick / aiWhy，
     留下 aiRank 会让顺序那一趟把每一条都算成没名次，整列却还挂在 AI 的话上）。
     清完退回按名称 A→Z —— 这一页没有可挑的档位了。 */
  function clearAiPick() {
    aiPick = null; aiWhy = ''; aiRank = null;
    resetPaging(); render();
  }

  /* ---------- 分组：这一页只负责「看哪一组」 ----------
     以前这里有两个按钮（工具条上的「整组加入这一集」与每张卡上的「加入当前这一集」），
     它们都要求「拍短剧页当前正打开着一集」（D.activeId()）——
     可这一页根本显示不出当前开着哪一集，于是要么点出「还没有打开的一集」的报错，
     要么默默改了一集你压根没在拍的东西。这类按钮是「不该有的按钮」：
     同样的事拍短剧页有一个更好的入口（挑选弹窗，支持多选、整组、删除、就地新建，
     目标集就在标题栏写着）。2026-10 拍短剧页整体删除，这一页就是素材库的唯一入口 ——
     分组现在纯粹是「筛与查」的手段。 */
  function paintGroups() {
    const gs = D.Lib.groups();
    const none = D.Lib.list().filter(c => c && !String(c.group || '').trim()).length;
    const el = $('grpPick'); if (!el) return;
    el.innerHTML = '<select id="grpSel"><option value=""' + (group ? '' : ' selected') + '>全部组</option>'
      + gs.map(g => `<option value="${esc(g.name)}"${group === g.name ? ' selected' : ''}>${esc(g.name)}（${g.n}）</option>`).join('')
      + (none ? `<option value="__none"${group === '__none' ? ' selected' : ''}>未分组（${none}）</option>` : '')
      + '</select>';
    const sel = $('grpSel');
    sel.onchange = () => { group = sel.value; resetPaging(); render(); };
    if (window.Dropdowns) Dropdowns.build(el);
    $('grpList').innerHTML = gs.map(g => `<option value="${esc(g.name)}">`).join('');
  }

  /* ---------- 展示样式与分页（与收藏页同一套公共实现） ---------- */
  const PAGE_MODE = (function () { try { return localStorage.getItem('page_mode_chars') === 'more' ? 'more' : 'page'; } catch (e) { return 'page'; } })();
  const PAGE_SIZE = Math.max(1, Number(localStorage.getItem('page_size_chars') || 18) || 18);
  let morePages = 1;
  const viewToggle = Wb.viewToggle.create({
    el: 'fView', key: 'dir_char_view',
    views: [['list', '列表', Wb.viewToggle.ROWS], ['compact', '紧凑', Wb.viewToggle.GRID]],
    onPick: applyView,
  });
  function applyView() {
    const g = $('grid'); if (!g) return;
    g.classList.remove('view-list', 'view-compact');
    g.classList.add('view-' + ((viewToggle && viewToggle.value) || 'list'));
  }
  const shownCount = () => PAGE_MODE === 'more' ? Math.min(viewItems.length, morePages * PAGE_SIZE) : viewItems.length;
  function pageItems() { return PAGE_MODE === 'more' ? viewItems.slice(0, shownCount()) : pager.slice(viewItems); }
  function resetPaging() { morePages = 1; pager.setPage(0); }
  const pager = Wb.pager.create({
    mode: PAGE_MODE, pageSize: PAGE_SIZE,
    items: () => viewItems,
    hasMore: () => PAGE_MODE === 'more' && shownCount() < viewItems.length,
    render: () => render(),
  });
  pager.bindButtons();

  /* ---------- 灯箱与详情（同一个公共组件，条目形状按收藏页那套来） ---------- */
  Wb.detail.init({
    prompt: it => it.item ? D.descOf(it.item) : '',
    status: () => '素材库',
    rows: it => [
      ['名字', it.item ? it.item.name : ''],
      ['类型', it.item ? D.LIB_KINDS[D.libKindOf(it.item)] : ''],
      ['分组', (it.item && it.item.group) || '未分组'],
      ['这一张', it.label || ''],
      /* 场景没有「人设」这一栏（它没有 bio 那层意思），道具那栏叫「用途」——
         摆一格空的「人设」是在报一件界面上根本没有的事。 */
      ['人设 / 用途', (it.item && it.item.bio) || ''],
      [D.isPropItem(it.item) ? '道具描述' : D.isSceneItem(it.item) ? '场景描述' : '外貌', D.descOf(it.item) || ''],
      /* 资产那一行对场景 / 道具是空的（D.Cast.assetNames 现在对它们返回空串），
         那一行整个不出现 —— 见 assetNames 那段：说「还没画」是报一件不存在的事。 */
      ['资产', it.item ? D.Cast.assetNames(it.item) : ''],
    ],
  });
  Wb.lightbox.init({
    list: () => media,
    keyOf: it => it.key,
    srcOf: it => src(it.s),
    nameOf: it => D.Pipe.fileSafe(it.name || '素材图', 60),
    kindOf: () => 'image',
    info: it => [it.name, it.item ? D.Cast.assetNames(it.item) : ''],
  });

  /* 标题那一行与描述那一行单独成函数：编辑区里改完名字 / 分组 / 描述，只需把这两行就地换掉。
     整页 render 在这条路上是错的 —— 输入框 blur 先于按钮 click 触发，重建 DOM 会把刚点下去的
     「收起」那颗按钮换成一个新节点，click 永远不发（表现就是「点了收起没反应」）。 */
  function nmInner(c) {
    return `${esc(c.name)}<span class="ui-tag">${D.LIB_KINDS[D.libKindOf(c)]}</span>`
      /* 场景的时段直接进这张图的提示词（`drawPreview` 里那句「…的光线」），
         所以它和类型一样是「一眼就该看见」的身份，不该藏在编辑区里。 */
      + (isScene(c) && c.time ? `<span class="ui-tag">${esc(c.time)}</span>` : '')
      + (!isScene(c) && !isProp(c) && D.voiceOnlyOf(c) ? '<span class="ui-tag">只出声</span>' : '')
      + (c.group ? `<span class="ui-tag">${esc(c.group)}</span>` : '');
  }
  function bioInner(c) {
    return esc(c.bio || '') + (c.bio && c.look ? '<br>' : '') + esc((c.look || '').slice(0, 80));
  }
  /* 就地更新那两行（只换 .nm / .bio 里的内容，不碰按钮与输入框）。
     编辑区顶行那句「编辑「谁」」跟着一起换：改完名字后它还写着旧名，等于同一张卡上两个名字。 */
  function paintHeads(c) {
    const el = document.querySelector('.card[data-id="' + c.id + '"]'); if (!el) return;
    const nm = el.querySelector('.nm'), bio = el.querySelector('.bio'), eh = el.querySelector('.edit .eh > .t');
    if (nm) nm.innerHTML = nmInner(c);
    if (bio) bio.innerHTML = bioInner(c);
    if (eh) eh.textContent = '编辑「' + (c.name || '这条素材') + '」· 改完就地存';
  }
  /* blur 十有八九是「松手要按下面另一颗按钮」按出来的，而标题那一行改字数会把卡片撑高一截：
     那一刻重排，鼠标底下的元素就换了（实测：点「用这一张」结果点在候选缩略图上 ——
     click 派发给 mousedown 与 mouseup 两个目标的共同祖先）。数据在 blur 时已经存好，
     所以这一行等这颗按钮松手之后再补画；没人松手（Tab 换格、程序化 blur）时 400ms 兜底。 */
  let headPend = null, headTimer = 0;
  function flushHeads() {
    clearTimeout(headTimer); headTimer = 0;
    const c = headPend; headPend = null;
    if (c) paintHeads(c);
  }
  function queueHeads(c) {
    headPend = c;
    clearTimeout(headTimer);
    headTimer = setTimeout(flushHeads, 400);
  }
  document.addEventListener('pointerup', () => setTimeout(flushHeads, 0), true);

  /* 这一条身上那几张图叫什么：道具只有「预览图」一个说法，角色才有「三视图」这一档。
     场景与道具没有资产子项，所以 `picWord` 之外不该再冒出「多角度 / 陈设细节」这类词。 */
  function picWord(c) { return isProp(c) ? '道具图' : '预览图'; }
  /* 三种类型各自「这一栏叫什么、给个什么例子、建完提醒什么」在 `chars.js` 的 `KIND_FIELDS`
     （现读 `D.Lib.kindF`）—— 新建一条素材也归了数据层那一份（`D.Lib.newForm`），
     表单与这一页都走它，措辞表留在页面里就成了第二份。
     ⚠ 那张表**只管措辞**。「这一类到底有没有声音 / 时段 / 角色资产」仍然问 `voiced` /
        `isScene` / `isProp` 那三份判据（数据层的字段形状说的），不在表里再立一套 ——
        两处各判一次就会出现「表说场景没时段、编辑区却画出来了」。 */
  const kindF = k => D.Lib.kindF(k);
  /* 「能搜到哪些字」的表在 `D.Lib.SEARCH_FIELDS`（素材库页、框上那句说明、AI 助手三处共用一份）；
     这一页不另列一份 —— 以前这一页只查名字 / 人设 / 外貌 / 分组，卡片上写着「深夜」「琪琪的常服」
     却搜不出来。 */
  /* 主图下面那一排候选。角色 / 场景 / 道具三类同构（候选都攒在 `c.faces`，在用的那张另存
     `face` 或 `img`），所以一份渲染；`kind` 由 `mainKind(c)` 判。
     `busy` 时整排换成占位格：出着 3 张却只看见 1 张是不能接受的，反过来「3 张在排队」
     也得看得见，否则会以为卡住了。按钮留着但禁用 —— 只剩一个转圈看着像「这个入口没了」。
     ⚠ `tail`（那颗「再画 N 张」，**按张计费**）只在编辑区里给。
       收起态只留「用这一张」与点开看大图 —— 挑一张、翻一张都不花钱，
       而生成入口摆在浏览屏上就是「往下滚一屏顺手点掉一颗，钱已经花了」。
       （`genBtns` 只堵住了卡片底部那一处来源，这一排是**第二个**来源。） */
  function mainCandsHTML(c, pw, busy, editOpen) {
    const kind = mainKind(c);
    const n = candCount();
    const list = (c.faces || []).filter(x => x && x.src);
    const tail = editOpen ? moreCandsBtn(kind, false) : '';
    return busy
      ? `<div class="ui-cands"><span class="lab">${esc(pw)}候选</span>${D.Cast.waitHTML('正在出 ' + n + ' 张')}${editOpen ? moreCandsBtn(kind, true) : ''}</div>`
      : D.Cast.picCandsHTML(list, D.picOf(c), { act: 'usecand', del: 'canddel', label: pw + '候选', name: c.name,
          extra: ' data-k="' + kind + '"', tail: tail });
  }
  function cardHTML(c) {
    const sc = isScene(c), pr = isProp(c);
    const pw = picWord(c);
    const pic = D.picOf(c);
    /* 角色资产现在是**一个扁平列表**（任意种类、不限张数、每张自己一个名字）——
       缩略图按列表逐张摆，每张带上它自己的名字。旧写法 `Object.keys(assets)`
       遍历字典，每个 kind 只有一个坑位，多张时只能看到其中一张。 */
    const assetList = D.Cast.assetsOf(c);
    /* 关联道具的名字要显示在缩略图的 title 上，所以要能看到整份库里的道具 */
    const libProps = D.Lib.list().filter(x => x && isProp(x));
    const editOpen = openId === c.id;
    const faceBusy = genHas('face', c.id);
    /* 试听：编辑区开着时不摆这一颗 —— 下面那块声音控件里本来就有同一件事（同一句话不能说两遍）。 */
    const hasVoice = voiced(c) && !!(c.voice || c.voiceName || String(c.voiceNote || '').trim() || c.refAudio);
    /* 只出声的那一位不进画面：出图的两个入口对它是纯噪音（同样不给它画脸），
       所以这里连按钮都不画，而不是画一颗点了什么都不发生的按钮。 */
    const vo = voiced(c) && D.voiceOnlyOf(c);
    /* 生成中**先占位**（哪怕这一条已经有旧图）：旧图一动不动地留在那里，
       人分不清「点了没反应」和「正在出」；出完 genRun 会重画这一张卡，新图自动换上。
       占位期间不给 data-a —— 那时候点开的是**旧图**，会让人以为新图已经出来了。 */
    const thumb = vo
      ? `<div class="thumb" title="只出声：这一位不出画面，所以不必有${esc(pw)}（要让它出镜就在编辑区把勾去掉）"><div class="none">只出声<br>不出镜</div></div>`
      : `<div class="thumb"${faceBusy ? '' : ` data-a="${pic ? 'zoomface' : 'pickface'}"`} title="${faceBusy
        ? '正在出' + esc(pw) + '：出来会自动换上'
        : pic ? pw + '：点一下看大图'
          : '还没有' + pw + '：点这里从资产库 / 我的收藏 / 本机文件挑一张，或点「编辑」后按「AI 出' + pw + '」'}">
        ${faceBusy ? `<div class="none">${D.Cast.waitHTML('正在出' + pw)}</div>`
          : pic ? `<img src="${esc(src(pic))}" alt="">`
            : `<div class="none">还没有${esc(pw)}<br>点这里自己挑一张</div>`}</div>`;
    /* **收起状态下不摆任何生成按钮**（用户要求）。
       以前这一行摆着「AI 重出预览图 / AI 重出三视图 / AI 出表情表 / AI 出服装」四颗 ——
       每一颗都是**花钱动作**，而素材库这一屏是给人「浏览素材」的：
       往下滚一屏就顺手点掉一颗，钱已经花了。生成入口**只在编辑区里**，
       那里能一次看清这一位缺什么、要用哪一段描述、出几张。 */
    const genBtns = '';
    return `${thumb}
      <div class="main"><div class="body">
        <div class="nm">${nmInner(c)}</div>
        <div class="tags">
          ${D.Cast.voiceTag(c)}
          ${/* 导演台里有多少个镜头写了 @这个名字（见上面 loadRefUse）。引用是按名字对上的，
               改了名这里就归零 —— 那正是「提示词里的 @旧名 已经对不上了」的信号。
               ⚠ 这段注释在模板串里，一个反引号都不能有（会当场闭合模板串 → 整页白屏）。 */
            refTag(c)}
          ${editOpen ? `<button class="ui-linkbtn" data-a="play"${genHas('voice', c.id) ? ' disabled' : ''}>试听</button>` : ''}
        </div>
        <div class="bio">${bioInner(c)}</div>
        ${assetList.length ? `<div class="assets">${assetList.map(a => {
          const lab = D.Cast.assetName(a);
          const ps = (a.propIds || []).map(pid => libProps.find(p => p && p.id === pid)).filter(Boolean).map(p => p.name);
          return `<div class="th" data-a="zoom" data-src="${esc(a.src)}" data-label="${esc(c.name + ' · ' + lab)}" title="${esc(lab)}${ps.length ? '（连带 ' + esc(ps.join('、')) + '）' : ''}：点开看大图"><img src="${esc(src(a.src))}" alt=""><i>${esc(lab)}</i></div>`;
        }).join('')}</div>` : ''}
        ${errsHTML(c)}
        ${vo ? '' : mainCandsHTML(c, pw, faceBusy, editOpen)}
        <div class="acts">
          <button class="ghost" data-a="edit">${editOpen ? '收起' : '编辑'}</button>${genBtns}
          ${/* 「拿去生成」不是花钱动作（它只是跳过去把这张图放进参考槽），所以收起状态也摆着。
             只在真有一张图时画 —— 没有图就摆一颗按钮，点过去工作台那头什么也收不到。 */
            pic ? `<button class="ghost" data-a="reuse" data-src="${esc(pic)}" data-name="${esc(c.name || '')}" title="带着这张${esc(pw)}去生成工作台，放进参考图那一栏">拿去生成</button>` : ''}
          <button class="ghost danger" data-a="del">从库里删掉</button>
        </div>
      </div>
      ${editOpen ? editHTML(c) : ''}
      </div>`;
  }
  /* 编辑区就地展开（不弹新窗）：名字 / 类型 / 分组 / 描述 / 时段（场景）/ 只出声（角色）/ 声音 / 角色资产。
     每一类**按类型给字段**，不给的就不画：
       角色 = 描述 + 人设 + 只出声 + 声音 + 角色资产
       场景 = 描述 + 时段（没有声音，也没有资产子项）
       道具 = 描述 + 用途（没有时段、没有声音、没有资产：它只有一张图就是它自己） */
  function editHTML(c) {
    const sc = isScene(c), pr = isProp(c);
    const kf = kindF(D.libKindOf(c));
    const pw = picWord(c);
    const vo = !sc && !pr && D.voiceOnlyOf(c);
    /* 「点『AI 出』时能选哪几个模板」与出图表单读的是同一份（`assetTpls`）。 */
    const tpls = assetTpls(c);
    const list = D.Cast.assetsOf(c);
    const libProps = D.Lib.list().filter(x => x && isProp(x));
    /* 角色资产：**一个扁平列表**，任意种类、不限张数、每张自己一个名字。
       每一行 = 缩略图 + **名字输入框**（可就地改）+ 关联道具多选 + 重出 + 去掉。
       关联道具（用户要求）：这一张图上带着哪几件东西 —— 换衣服那张要把那顶帽子一起
       算进这一位的道具，拍摄时才会跟着人走。挑法是多选，不是「这一张属于某件道具」，
       因为同一张图可能同时带两件（风衣 + 围巾）。

       ⚠ 这一整段全是 `const`，**拼模板之前必须全部算完**：模板里用到谁，谁就得先声明。
       2026-10 出过一次真实事故 —— `assetListHTML` 里用了下面才声明的 `anTxt`，
       而它包在 `list.length ?` 里：只有「有角色资产的条目」点编辑时抛 TDZ，
       整张卡当场从列表里消失（连它后面那几张也一起不画了）。
       新增片段时一律加在这个注释块下面、return 之前。 */
    const dr = draftOf(c.id);
    const drTpl = tpls.includes(dr.tpl) ? dr.tpl : (tpls[0] || 'custom');
    /* 资产这一档**固定一张**，不跟「出图张数」走：这些图拍摄时都会作为参考图发给视频 AI
       （按平台声明的上限截），一次出 3 张就是 3 张几乎一样的参考图去抢那几个位置 ——
       数量越多反而越差。所以按钮上写「这一张」，提交也是 1 张。 */
    const anTxt = '这一张';
    const assetListHTML = list.length ? '<div class="ui-cands"><span class="lab">角色资产 ' + list.length + ' 张</span>'
      + '<div class="ui-assets">' + list.map(a => {
        const lab = D.Cast.assetName(a);
        const opts = libProps.map(p => `<label class="ck sm" title="这一张图上带着「${esc(p.name)}」"><input type="checkbox" data-a="assetprop" data-id="${esc(a.id)}" data-pid="${esc(p.id)}"${(a.propIds || []).includes(p.id) ? ' checked' : ''}>${esc(p.name)}</label>`).join('');
        return `<div class="ui-asset" data-aid="${esc(a.id)}">`
          + `<span class="ui-cand"><img src="${esc(src(a.src))}" data-a="zoom" data-src="${esc(a.src)}" data-label="${esc(c.name + ' · ' + lab)}" alt=""></span>`
          + `<input class="ui-inp" data-a="assetrename" data-id="${esc(a.id)}" maxlength="24" value="${esc(lab)}" title="这一张叫什么（改了立刻存）">`
          + `<button class="ui-linkbtn" data-a="assetregen" data-id="${esc(a.id)}" title="照着同一个提示词再出一张，换掉这一张">重出${anTxt}</button>`
          + `<button class="ui-linkbtn" data-a="reuse" data-src="${esc(a.src || '')}" data-name="${esc(lab)}" title="带着这一张去生成工作台，放进参考图那一栏">拿去生成</button>`
          + `<button class="ui-linkbtn" data-a="assetclear" data-id="${esc(a.id)}" data-label="${esc(lab)}">去掉这一张</button>`
          + (libProps.length ? '<span class="ui-props">' + opts + '</span>' : '<span class="ui-hint sm">素材库里还没有道具，点右上「新建素材」加一条（类型选「道具」）</span>')
          + '</div>';
      }).join('') + '</div>'
      + '<div class="ui-hint sm">这些图拍摄时都会作为参考图发给视频 AI（按平台声明的上限截，超出的会点名哪几张没发）。</div>'
      + '</div>' : '';
    /* 出图表单：名字 / 模板 / 自定义描述 一次填一遍。模板只是**出图时**选一次，
       存下来的只是一张有名字的角色资产 —— 所以界面上没有「三视图」「表情表」这些分栏。
       三个值都从 `DRAFT` 里取（不是空着重画）：出完一张会重画这张卡，
       正在打的字与挑好的模板不能跟着没。
       `!vo`：勾了「只出声」的这一位不出画面，入口就不摆（下面那句提示就是这么说的，
       以前照样摆着 —— 提示与界面互相打脸）。 */
    const assetGenHTML = (tpls.length && !vo) ? '<div class="ui-cands"><span class="lab">加一张角色资产</span>'
      + `<input class="ui-inp" data-a="assetname" maxlength="24" value="${esc(dr.name)}" placeholder="这一张叫什么（填了就按它画，留空用模板名）">`
      + `<select data-a="assettpl">${tpls.map(k => `<option value="${esc(k)}"${k === drTpl ? ' selected' : ''}>${esc(D.Cast.assetLabel(c, k) || k)}</option>`).join('')}</select>`
      + `<input class="ui-inp" data-a="assetwhat" maxlength="60" value="${esc(dr.what)}" placeholder="选「自定义」时写清楚要画什么，例：雨天造型、侧脸特写">`
      + `<button class="ghost mini" data-a="assetgen">AI 出${anTxt}</button>`
      + `<button class="ui-linkbtn" data-a="assetpick2">＋ 自己传一张</button>`
      + '</div>' : '';
    /* 正在出的那几张（新加的与重出的）在资产这一块各给一行占位：以前只有底栏那一句在转，
       这一格里看不出「正在画哪一张」，看着像点了没反应，于是再点一次 = 白花一次钱。 */
    const waitRows = (() => {
      const tail = '#' + c.id, out = [];
      for (const [k, msg] of GEN) {
        if (k.indexOf('asset#') !== 0 || !k.endsWith(tail)) continue;
        out.push('<div class="ui-asset sm">' + D.Cast.waitHTML((msg || '正在出') + '…') + '</div>');
      }
      return out.join('');
    })();
    /* 主图那两颗按钮：摆在「画面」这一节里，而不是编辑区最底下 ——
       它们动的是这一条的主图，与「去掉参考音频」不是一类事。 */
    const picBtns = vo ? '' : `<button class="ghost" data-a="face"${genHas('face', c.id) ? ' disabled' : ''}>${genHas('face', c.id) ? '正在出' + pw : (D.picOf(c) ? 'AI 重出' : 'AI 出') + nSuffix() + pw}</button>`
      + `<button class="ghost" data-a="pickface" title="从资产库 / 我的收藏 / 本机文件里挑一张当${esc(pw)}（不靠生成，直接拿现成的）">${D.picOf(c) ? '换一张' + pw : '自己传' + pw}</button>`;
    return `<div class="edit" data-edit="${esc(c.id)}">
      <div class="eh"><span class="t">编辑「${esc(c.name || '这条素材')}」· 改完就地存</span>
        ${refTag(c)}
        <button class="ui-linkbtn" data-a="closeedit" title="收起这一块的编辑区（按 Esc 也一样）">收起</button></div>

      <div class="ed-sec">基本信息</div>
      <label>名字<input data-f="name" value="${esc(c.name || '')}" maxlength="20"></label>
      <label>类型<select data-f="kind">${Object.keys(D.LIB_KINDS).map(k =>
        `<option value="${k}"${D.libKindOf(c) === k ? ' selected' : ''}>${D.LIB_KINDS[k]}</option>`).join('')}</select></label>
      <label>分组（可留空；素材库页能按整组筛与查找）<input data-f="group" list="grpList" value="${esc(c.group || '')}" maxlength="20" placeholder="例：校园篇主要角色"></label>

      <div class="ed-sec">描述</div>
      <label>${kf.look.lab}<textarea data-f="look" rows="3">${esc(c.look || '')}</textarea></label>
      ${sc ? `<label>${kf.time.lab}<select data-f="time" title="${esc(kf.time.hint)}">${D.Cast.timeOptsHTML(c)}</select></label>` : ''}
      <label>${kf.bio.lab}<input data-f="bio" value="${esc(c.bio || '')}"></label>
      ${voiced(c) ? `<label class="ck"><input type="checkbox" data-f="voiceOnly"${D.voiceOnlyOf(c) ? ' checked' : ''}>`
        + ' 只出声（不出镜）—— 这一位不需要' + pw + '与角色资产，拉进某一集时按旁白处理</label>' : ''}
      ${vo ? '<div class="ui-hint">这一位勾了「只出声」：不出画面，所以' + pw + '与角色资产的入口都不给它摆（想让它出镜就把上面那个勾去掉）。老库里已经存着的图还在下面，能看也能去掉。</div>' : ''}
      ${pr ? '<div class="ui-hint">道具只有这一张图：没有角色资产，也不出声。拍摄时它的图会作为参考图发给视频 AI，名字与描述进这一段的提示词。</div>' : ''}

      ${vo ? '' : `<div class="ed-sec">画面</div><div class="ed-acts">${picBtns}</div>`}
      ${assetListHTML}${waitRows}${assetGenHTML}

      ${voiced(c) ? `<div class="ed-sec">声音</div>${D.Cast.voiceRowHTML(REG, opts, c, { waiting: genMsg('voicecands', c.id) })}`
        + `<div class="ed-acts"><button class="ghost danger" data-a="refclear" ${c.refAudio ? '' : 'disabled'} title="清掉这一位复刻用的那段参考音频">去掉参考音频</button></div>` : ''}
    </div>`;
  }

  function bindCard(card, c) {
    /* 声音那一块（试听 / 音色胶囊 / 复刻上传）的标记来自 Chars.Cast.voiceRowHTML，
       它用的是 data-act；本页自己的动作是 data-a。两套都要绑，漏一套就是
       「点音色胶囊没反应」—— 标记只有 Chars.Cast 这一份，页面只绑自己的 data-act。 */
    const act = (el, fn) => { el.onclick = async e => { e.stopPropagation(); try { await fn(el); } catch (err) { Toast.err(err.message || String(err)); setBusy(''); } }; };
    const acts = {
      edit: async () => { toggleEdit(c.id); },
      closeedit: async () => { toggleEdit(c.id, false); },
      /* 主图：一次一张。`replace: true` 是必须的 —— 数据层只在**还没有图**时才写 pic，
         而这一颗按钮在已经有图时写着「AI 重出」，不覆盖就等于点下去没反应。 */
      face: async () => {
        const pw = picWord(c);
        /* 出几张跟着「出图张数」走（= 设置页那一项）：第 1 张顶上当当前图，其余进候选让你换。
           以前这里写死 `count: ONE`，而同一个页面上的「再画 N 张候选」按设置出 N 张 ——
           两个按钮对「几张」各有一套说法，用户只能猜。 */
        await genRun('face', c.id, c, '正在出「' + c.name + '」的' + pw + '（' + candCount() + ' 张）…',
          () => D.Pipe.drawPreview(REG, fakeDrama(), c, { count: candCount(), replace: true, onTask: onTaskHook }));
      },
      /* 候选排那两个动作。主图走 CANDK，`data-k` 指明是哪一档
         （主图那排 `picCandsHTML` 带的 extra 已经写好了）。资产不再有候选排。 */
      morecand: async el => { await moreCands(c, el.dataset.k || mainKind(c)); },
      usecand: async el => { useCand(c, el.dataset.k || mainKind(c), el.dataset.src); },
      /* 删掉一张候选（用户要求）：攒了一排不满意的得能一张张清掉，
         以前只能「用这一张」或整个重出，挑剩下的永远留在那儿。
         删的正好是**在用的那张**时把当前图顺位挪到剩下第一张，一张不剩就清空 ——
         否则 picOf 会指着一张已经不在的图（界面上是破图 + 出图按钮还写着「已有」）。 */
      /* 删候选的规则走数据层那一份（D.Cast.dropFaceCand）。
         以前这里是页面自己写的一套：两边各删一次，规则（删掉正在用的那张要不要顺位递补）
         就有了两份，改一处就会在另一个页面上失效。 */
      canddel: async el => {
        const k = CANDK[el.dataset.k || mainKind(c)]; if (!k) return;
        const r2 = D.Cast.dropFaceCand(c, el.dataset.src, { got: k.got, set: k.set });
        if (!r2.ok) return toast(r2.why, 'err');
        const ok = !!libSave(c);
        paintCard(c);
        if (ok) toast('删掉了这一张候选' + (r2.left ? '，还剩 ' + r2.left + ' 张' : '（这一类清空了）'), 'ok');
      },
      /* 候选排里的缩略图（picCandsHTML 用 data-act="zoom"）。两页共用那份标记，
         所以点开看大图这一件事也得在这边接上 —— 不接就是一张点不开的小图。
         它带的是 `data-name`（chars.js 拼的「名字 · 第 N 张」），本页 openZoom 读 `data-label`。 */
      zoom: async el => { openZoom(c, el.dataset.label || el.dataset.name || '图', el.dataset.src); },
      /* 就地二次确认（公共层的 Confirm.arm）：删除按钮原地变成「确认删掉」，
         再点一下才真删 —— 素材库里常常连着清掉几位，弹一次窗就打断一次。 */
      del: async el => {
        /* 提示会被错过，拒不会：这一条身上还有活在跑时删掉它，
           那一轮收尾会照旧 `Lib.save` 一次 —— 刚删的素材又被写回库里，
           而用户已经以为删掉了（界面当时确实消失，因为整页重画过）。 */
        const busy = genOn(c);
        if (busy) return Toast.err('这一条正有一项在生成（' + errLabel(busy, c) + '），等它出来或按「停下」再删 —— 现在删掉，那一轮收尾会把它写回库里');
        if (Confirm.arm(el, '确认删掉', {
          note: '本机存的参考音频会一起删掉；已经拉进某一集的那条不受影响',
        })) return;
        if (c.refAudio) await D.Pipe.clearRefAudio(c);
        /* 数据层在「库里那份读不出来」时会整批停手（一个字都不写），配额撞满则是「想删、没落盘」；
           两种原因都由它留着，这里取一次照实说，并且**不把这张卡从界面上摘掉** ——
           库里那条还在，画面上却没了就是骗人，下一次任何一次写库还会把它带回来。 */
        const gone = D.Lib.remove(c.id);
        const e = D.Lib.writeError();
        if (e) Toast.err(e, 9000);
        if (gone) { ERR.forEach((v, k) => { if (k.endsWith('#' + c.id)) ERR.delete(k); }); openId = ''; render(); }
      },
      /* 拿去生成工作台当参考图。素材库里存的**只是这张图的本机地址**（角色资产与预览图都是），
         没有平台资产号 —— 载荷那一层（`Wb.reuse.go`）会从 `/asset/<号>` 形式的地址里认回数来，
         工作台那头因此不必再回取一遍字节；别的形式的地址就走取字节那条路。
         不带提示词：这一颗的意图是「用这张图」，把外貌描述糊进提示框会盖掉用户正写着的那句。 */
      reuse: el => {
        const s = el.dataset.src || '';
        if (!s) return Toast.err('这一条还没有图，先在编辑区挑一张或让 AI 出一张');
        Wb.reuse.go({ from: 'chars', mtype: '图片', src: s, name: el.dataset.name || c.name || '' });
      },
      /* 统一选择器：资产库 / 我的收藏 / 本地上传三个入口在同一块界面里 */
      pickface: async () => {
        const pw = picWord(c);
        const got = await AssetPicker.open({ types: ['图片'], multiple: false, limit: 1,
          title: '给「' + c.name + '」选一张' + pw,
          note: isProp(c) ? '道具图就是道具自己：挑一张最像的，拍每一段时它都会作为参考图发出去'
            : pw + '是三视图与拍摄时认脸的凭据，挑一张最像的' });
        if (got && got[0]) { const s = await durablePic(got[0], c.name + '-' + pw); if (s) { D.setPic(c, s); keep(c, true); } }
      },
      /* 「＋ 自己传一张」：落进**扁平的资产列表**，名字/模板取那一行表单上写的。 */
      assetpick2: async el => {
        const box = el.closest('.ui-cands') || card;
        const nm = (box.querySelector('[data-a="assetname"]') || {}).value || '';
        const tpl = (box.querySelector('[data-a="assettpl"]') || {}).value || 'custom';
        const got = await AssetPicker.open({ types: ['图片'], multiple: false, limit: 1,
          title: '给「' + c.name + '」加一张角色资产', note: '不靠生成，直接用现成的这一张' });
        if (got && got[0]) { const s = await durablePic(got[0], c.name + '-' + (nm.trim() || got[0].name || '资产')); if (s) { D.Cast.addAsset(c, { name: nm.trim(), tpl: tpl, src: s }); keep(c, true); } }
      },
      /* 「AI 出这一张」：名字 / 模板 / 自定义描述三样都从**那一行**里读（按钮不带参数，
         读的是表单上的值）。出完是**追加**一张，不是换掉谁。 */
      assetgen: async el => {
        const box = el.closest('.ui-cands') || card;
        const nm = (box.querySelector('[data-a="assetname"]') || {}).value || '';
        const tpl = (box.querySelector('[data-a="assettpl"]') || {}).value || 'three';
        const what = (box.querySelector('[data-a="assetwhat"]') || {}).value || '';
        if (tpl === 'custom' && !what.trim()) { Toast.err('选「自定义」要写清楚要画什么，例：雨天造型、侧脸特写'); return; }
        const lab = nm.trim() || D.Cast.assetLabel(c, tpl) || '资产';
        /* 固定 1 张（见上面 anTxt 那段）：这些图拍摄时都会当参考图发出去，多出几张只会互相抢位置。 */
        const n = ONE;
        /* 闸门键只用「新加一张 + 模板」，**不带名字**：以前把名字拼进键里，于是
           改一下名字再点一次就是另一个键 —— 「这一项正在生成」那道拦白花的闸门根本没关上，
           同一张图会被发出去两次。名字只在进度那句话里说。 */
        const ok = await genRun('asset#new:' + tpl, c.id, c,
          '正在出「' + c.name + '」的' + lab + '…',
          () => D.Pipe.drawCharAsset(REG, fakeDrama(), c, tpl, { count: n, name: nm.trim(), what: what.trim(), onTask: onTaskHook }),
          false, lab);
        /* 出成了就把这一行的名字/描述清空（它已经变成列表里那张有名字的资产），
           模板留着 —— 连着出几张同类的最常见，不用每次重挑。 */
        if (ok) DRAFT.set(c.id, { name: '', tpl: tpl, what: '' });
      },
      /* 「重出这一张」：照**同一张**的模板与名字再出，换掉它（replaceId 指着具体那一张）。
         不指的话就是新增一张，界面上看着像「点了没反应」。 */
      assetregen: async el => {
        const a = D.Cast.assetById(c, el.dataset.id);
        if (!a) return Toast.err('这一张已经不在了');
        const lab = D.Cast.assetName(a);
        await genRun('asset#' + a.id, c.id, c, '正在重出「' + c.name + '」的' + lab + '…',
          () => D.Pipe.drawCharAsset(REG, fakeDrama(), c, a.tpl, { count: ONE, name: lab, replaceId: a.id, onTask: onTaskHook }));
      },
      /* 去掉**这一张**（资产是列表，去掉的是某一张而不是整类）。 */
      assetclear: async el => {
        const id = el.dataset.id; if (!id) return;
        const lab = el.dataset.label || '这一张';
        if (Confirm.arm(el, '确认去掉' + lab, { note: '素材库里这一张会空出来；已经拉进某一集的那条不受影响' })) return;
        D.Cast.removeAsset(c, id);
        keep(c, true);
        Toast.ok('去掉了「' + c.name + '」的' + lab);
      },
      /* 关联道具：这一张图上带着哪几件东西。多选 —— 同一张图可能同时带两件
         （风衣 + 围巾），所以不能用「这一张属于某一件」的单选判据。 */
      assetprop: async el => {
        const a = D.Cast.assetById(c, el.dataset.id);
        if (!a) return Toast.err('这一张已经不在了');
        const pid = el.dataset.pid;
        const now = (a.propIds || []).slice();
        const i = now.indexOf(pid);
        if (el.checked) { if (i < 0) now.push(pid); } else if (i >= 0) now.splice(i, 1);
        D.Cast.setAssetProps(c, a.id, now);
        keep(c, true);
      },
      refclear: async () => { await D.Pipe.clearRefAudio(c); keep(c, true); },
      play: async () => {
        /* 试听会真的合成一小段，所以记在 `voice#这一条` 上：正在合成时再点第二次就是合成两遍 */
        await genRun('voice', c.id, c, '正在合成「' + c.name + '」的试听…', async () => {
          const r = await D.Cast.preview(REG, opts, c, { onStage: m => genSet('voice', c.id, m) });
          if (r.why) Toast.err(r.why);
          else if (r.label) Toast.ok('试听：' + r.label);
        });
      },
      voice: async el => { c.voice = el.dataset.vid; c.voiceName = D.Cast.voiceName(REG, opts, c.voice, c.voiceMode); keep(c, true); },
      /* 这一位用哪种方式出声（预设 / 描述 / 复刻）：整块重画，控件跟着方式换 */
      voiceway: async el => {
        const w = D.Pipe.setVoiceWay(REG, opts, c, el.dataset.way);
        c.voiceBy = ''; c.voiceName = D.Cast.voiceName(REG, opts, c.voice, w.mode);
        keep(c, true);
        if (w.fellback) Toast.err('这个平台没有「' + D.Cast.wayLabel(el.dataset.way) + '」的型号，这一位现在按「' + D.Cast.wayLabel(w.mode) + '」出声');
      },
      refaudio: async () => { await pickRefAudio(c); },
      /* 「没定成声音」那一行上的重试：清掉上一轮原因再问 AI 一次，判据同走 Pipe.autoVoice */
      revoice: async () => {
        await genRun('voicecands', c.id, c, '正在按人设定「' + c.name + '」的声音…', async () => {
          const r = await D.Pipe.autoVoice(REG, fakeDrama(), c, {
            cands: true,
            onStage: m => genSet('voicecands', c.id, m),
            onCands: (i, tot) => genSet('voicecands', c.id, '正在给「' + c.name + '」合成第 ' + i + ' / ' + tot + ' 条试听…'),
          });
          if (!r.ok) { c.voiceErr = r.why || '没定成'; c.voiceAuto = ''; }
        });
      },
      /* 声音候选：一次合成几条试听。预设那一位挑一条=真的换音色；
         描述 / 复刻那一位没有音色清单，那一排里压根不给「用这一条」（见 D.Cast.voiceCandsHTML）。 */
      vgen: async el => {
        const n = Math.max(1, Number(el.dataset.n) || 2);
        await genRun('voicecands', c.id, c, '正在给「' + c.name + '」出 ' + n + ' 条试听…',
          () => D.Pipe.voiceCands(REG, opts, c, {
            onStep: (i, tot, nm) => genSet('voicecands', c.id,
              '正在出「' + c.name + '」第 ' + i + ' / ' + tot + ' 条' + (nm ? '（' + nm + '）' : '') + '…')
          }));
      },
      vplay: async el => {
        /* 播本机已经存着的那一段：不再合成、不再花一次，所以不过闸门 */
        const r = await D.Cast.playAsset(el.dataset.src);
        if (r.why) Toast.err(r.why);
      },
      /* 拿这一条**已经生成**的音频去做复刻：同一份判据与同一份改法都在 `Pipe.cloneFromCands`，
         调用方各写一份的话迟早对不上（素材库页切了方式、别处还按描述生成）。 */
      vclone: async el => {
        const r = D.Pipe.cloneFromCands(REG, opts, c, el.dataset.src, el.dataset.name);
        if (!r.ok) { Toast.err(r.why); return; }
        keep(c, true);
        Toast.ok('这一位以后按「' + r.name + '」这个声音念（复刻），拉进下一集也是它', 6000);
        render();
      },
      vuse: async el => {
        c.voice = el.dataset.vid;
        c.voiceName = el.dataset.vname || D.Cast.voiceName(REG, opts, c.voice, c.voiceMode);
        keep(c, true);
        Toast.ok('这一位以后按「' + (c.voiceName || c.voice) + '」念');
      },
    };
    const bind = (el, a) => { if (acts[a]) act(el, acts[a]); };
    /* 出图表单那三格只是**填**的（按钮点下去时才读），不进点击动作 ——
       进去的话点一下输入框就等于触发一个空动作。但要把值抄进 `DRAFT`：
       出完一张会重画这张卡，不抄的话正在打的字与挑好的模板一起没。 */
    const nmIn = card.querySelector('[data-a="assetname"]');
    const tplSel = card.querySelector('[data-a="assettpl"]');
    const whatIn = card.querySelector('[data-a="assetwhat"]');
    const syncDraft = () => DRAFT.set(c.id, {
      name: (nmIn || {}).value || '', tpl: (tplSel || {}).value || '', what: (whatIn || {}).value || '',
    });
    [nmIn, tplSel, whatIn].forEach(x => {
      if (!x) return;
      x.addEventListener('input', syncDraft); x.addEventListener('change', syncDraft);
    });
    card.querySelectorAll('[data-a]').forEach(el => {
      const a = el.dataset.a;
      if (a === 'zoom' || a === 'zoomface') {
        el.onclick = e => { e.stopPropagation(); openZoom(c, a === 'zoomface' ? picWord(c) : (el.dataset.label || '图'), el.dataset.src || D.picOf(c)); };
        return;
      }
      if (a === 'assetname' || a === 'assetwhat' || a === 'assettpl' || a === 'assetrename') return;
      bind(el, a);
    });
    /* 选「自定义」时才启用下面那格：两者的关系写在 placeholder 上，
       但禁用的那一格是**看得见**的（而不是藏起来）—— 藏了用户会以为没有这个功能。
       （`tplSel` / `whatIn` 就是上面抄草稿的那两个，不再查一遍。） */
    if (tplSel && whatIn) {
      const syncWhat = () => {
        const custom = tplSel.value === 'custom';
        whatIn.disabled = !custom;
        whatIn.placeholder = custom ? '写清楚要画什么，例：雨天造型、侧脸特写' : '（只有选「自定义」时才用这一格）';
      };
      tplSel.onchange = syncWhat; syncWhat();
    }
    /* 改名走 `onchange`（敲完离开输入框才存）：走 onclick 的话，
       用户改完名字直接点「去掉」，存的是还没改的那一份。 */
    card.querySelectorAll('[data-a="assetrename"]').forEach(inp => {
      inp.onchange = () => {
        const nm = String(inp.value || '').trim();
        const a = D.Cast.assetById(c, inp.dataset.id);
        if (!a) return;
        if (!nm) { inp.value = D.Cast.assetName(a); Toast.err('名字不能是空的：这是角色资产，没名字就分不清是哪一张'); return; }
        if (nm === D.Cast.assetName(a)) return;
        D.Cast.setAssetName(c, a.id, nm); keep(c, true);
        Toast.ok('这一张改叫「' + nm + '」');
      };
    });
    /* voicenote 是输入框（design 型号的声音描述）：走 oninput，不参与点击动作，
       否则点一下输入框等于触发一个空动作。 */
    card.querySelectorAll('[data-act]').forEach(el => {
      if (el.dataset.act === 'voicenote') {
        el.oninput = () => { c.voiceNote = el.value; };
        el.onblur = () => { libSave(c); };
        el.onclick = e => e.stopPropagation();
        return;
      }
      bind(el, el.dataset.act);
    });
    /* 编辑区的类型下拉先过公共下拉组件（.dd 由它包，页面只给裸 select），
       再绑 data-f 的原生 change —— Dropdowns 的选项就是靠派发 change 通知我们的。 */
    if (window.Dropdowns) Dropdowns.build(card);
    card.querySelectorAll('[data-f]').forEach(el => {
      const ck = el.type === 'checkbox';
      const k = el.dataset.f;
      /* 名字在**聚焦那一刻**先记一份：oninput 会实时把 c.name 改成新值，
         等 blur 再想问「原来叫什么」就已经没了 —— 而改名要拿旧名去查 @ 引用。 */
      let nameBefore = '';
      if (k === 'name') el.onfocus = () => { nameBefore = String(c.name || '').trim(); };
      const save = async () => {
        const wasKind = D.libKindOf(c);
        /* 勾选框的 `value` 恒是 "on"，要读的是 `checked` —— 少这一条，「只出声」会把 true 存成字符串 */
        c[k] = ck ? el.checked : (el.value.trim ? el.value.trim() : el.value);
        /* 换类型要先查重名。库里「同类型 + 同名」= 同一条（新建时正是这句拦的），
           而这一页把角色「天台」改成场景、库里已有一条场景「天台」，就会攒出两条一模一样的素材 ——
           之后「加入这一集」到底并进哪一条没人说得清。判据与 `Lib.save` 里那条完全一样。 */
        if (k === 'kind' && D.libKindOf(c) !== wasKind) {
          const to = c.kind;
          if (D.Lib.list().some(x => x && x.id !== c.id && x.name === c.name && D.libKindOf(x) === to)) {
            c.kind = wasKind; el.value = wasKind;
            Toast.err('素材库里已经有「' + c.name + '」这条' + (D.LIB_KINDS[to] || '同类') + '了：换成这一类就是两条一样的素材。先把名字改掉再换类型', 7000);
            return k;
          }
        }
        /* 改名会让导演台提示词里的 @旧名 再也对不上（引用是**按名字**对上的，见 loadRefUse）：
           有引用就先问一句，别让人改完名才发现那些镜头指着一个不存在的东西。
           取消就把输入框与数据一起退回去。 */
        if (k === 'name' && nameBefore && String(c.name || '').trim() !== nameBefore) {
          const n = refUse.get(nameBefore) || 0;
          if (n) {
            const ok = await Confirm.ask({
              title: '这个名字有 ' + n + ' 处引用',
              body: '导演台里有 ' + n + ' 个镜头的提示词写着 @' + nameBefore + '，引用是按名字对上的 —— '
                + '改成新名字之后，那些 @' + nameBefore + ' 就指不到这一条了。仍然改吗？',
              okLabel: '改名',
            });
            if (!ok) { c.name = nameBefore; el.value = nameBefore; queueHeads(c); return k; }
          }
        }
        const saved = libSave(c);
        /* 名字这一项库里有它自己的规矩（不许空、裁到 20 字）：清空它时库里退回旧名，
           输入框却还摆着空白 —— 以库里那份为准写回，否则「界面空的、库里有人」。
           `libSave` 返回 null 是「这一笔没存进去」（原因它已经弹过了），那就更不该改输入框。 */
        if (k === 'name' && saved) { c.name = saved.name; el.value = saved.name; nameBefore = saved.name; }
        return k;
      };
      if (el.tagName === 'SELECT') el.onchange = () => { save(); render(); };
      else if (ck) {
        /* 勾一下就把整张卡重画：出预览图 / 设定图那几颗按钮要当场消失或回来，
           等 blur（点别处才来）会让人以为勾了没反应。 */
        el.onchange = () => { save(); paintCard(c); paintChips(); };
      }
      else {
        /* 打字时也落盘（700ms 防抖）：以前只在 blur 存，打完字直接关页面 / 切页那一笔就没了。
           **名字不在这一列** —— 它要等 blur 时那次「改名会断开 @ 引用」的确认。 */
        el.oninput = () => { c[k] = el.value; if (k !== 'name') queueFieldSave(c); };
        /* blur 只写库（标题那一行等松手后补画，见 queueHeads）：这里整页 render 会吃掉「收起」
           那颗按钮的 click（blur 在 mousedown 时就触发了，重建 DOM 后点下去的那颗按钮已经换成新节点）。 */
        el.onblur = () => { clearTimeout(fieldTimer); save(); queueHeads(c); };
      }
      el.onclick = e => e.stopPropagation();
    });
  }
  /* `genAsset` 随「每一类一颗按钮」一起删掉了：角色资产现在是一个扁平列表，
     出图走编辑区里那一行自己的表单（`assetgen`），换一张走 `assetregen`。
     留着一个按 kind 记账的函数，就还能通过它改出界面上不存在的东西 —— 第二份实现。 */

  /* 「画风」这一格**已于 2026-10 删掉**：它是整页一份的出图取向，与「这一位长什么样」是两件事，
     却会长成「素材库自己有一套画风、生成时又有一套」——同一个名字两个地方各填各的，
     出来的图色调对不上，而界面上没有任何一处说明它们是两套。
     现在**只按每条素材自己的外貌 / 场景描述出图**（也就是原来「留空」那一种）。
     这一页的画风不动：它走 `episodeStyle`（chars.js），
     两边从来不互相读。 */

  /* ---------- 一次出齐这一档 ----------
     批量只补「这张卡上本来就该有的两样东西」：缺预览图的补预览图，缺三视图／多角度的补那一类。
     表情／服装／道具不进批量 —— 拍摄时 planMaterials 只把预览图与三视图当参考图发出去，
     那三类是给人自己看的，替用户连点四次不该点的生成是白花力气。
     并发 6 的理由是上游速率限制普遍在个位数并发上，再高就是「排了 8 条、
     界面转 8 个圈、其实前 6 条还没跑完」那种假繁忙）；池子本身在数据层（D.Pipe.runPool）。
     worker 按**素材**取、一条素材内部两步串行 —— runPool 的队列不保证同一素材两次的先后，
     而三视图必须等它的预览图先落盘才能照着画。 */
  const FILL_CONC = 6;
  /* 批量只补「这一条本来就该有的两样东西」：缺主图的补主图，**角色**还没有「三视图」这张资产的补上。
     场景与道具没有角色资产（`assetTpls` 那一份判据），所以它们只算主图这一件事 ——
     以前这里写死 `!(x.assets && x.assets.three)`，于是每个场景、每件道具都被算成「缺三视图」，
     按钮上的次数会莫名多出一截，点下去还会挨个报错。
     ⚠ 判据走 `assetsOf`（唯一读入口）：直接摸 `x.assets.three` 在**列表**形状下恒为 undefined，
       于是「有没有三视图」永远算成「没有」，每次点批量都要把全部角色重画一遍。 */
  function fillPlan() {
    const jobs = [];
    let face = 0, three = 0, usable = 0;
    viewItems.forEach(x => {
      if (!x || D.voiceOnlyOf(x)) return;
      usable++;
      const f = !D.picOf(x);
      const t = !!assetTpls(x).length && !D.Cast.assetsOfTpl(x, 'three').length;
      if (!f && !t) return;
      if (f) face++;
      if (t) three++;
      jobs.push({ c: x, face: f, three: t });
    });
    return { jobs, face, three, tasks: face + three, usable };
  }
  function paintFillBtn() {
    const b = $('btnFill'); if (!b) return;
    /* 能力声明回来之前不许说「你没配生图平台」—— 用户什么都没做错，只是还没读到。 */
    if (!REG) { b.disabled = true; b.textContent = '一次出齐这一档'; b.title = '正在读平台能力声明…'; return; }
    if (genHas('fill', null)) { b.disabled = true; b.textContent = '正在出齐这一档…'; return; }
    if (!D.Pipe.pickProvModel(REG, 'image', opts.imgModel, 'text_to_image')) {
      b.disabled = true; b.textContent = '一次出齐这一档';
      b.title = '现在没有可用的生图平台：到设置页填一把密钥，或在右边「出图型号」里挑一个';
      return;
    }
    const p = fillPlan();
    b.disabled = !p.tasks;
    b.textContent = p.tasks ? '一次出齐这一档（' + p.tasks + ' 次）' : '一次出齐这一档';
    b.title = p.tasks
      ? '这一档里 ' + p.face + ' 条还缺预览图／道具图、' + p.three + ' 位角色还缺三视图：每一条发一次生图请求，'
        + '一次出一张。中途可以按「停下」'
      : (p.usable ? '这一档里的预览图与三视图都齐了，没有要补的'
        : (p.usable === 0 && viewItems.length ? '这一档里只有「只出声」的素材，它们不出画面' : '这一档里没有素材'));
  }
  async function fillRest() {
    if (genHas('fill', null)) return;
    const p = fillPlan();
    if (!p.tasks) { Toast.ok(viewItems.length ? '这一档没有要补的图' : '这一档里还没有素材'); return; }
    /* 多于一条真任务就先问（一条不问，多条先问）。
       确认排在能力判据之后 —— paintFillBtn 已经按判据把按钮焊死过一轮了。 */
    if (p.tasks > 1 && !await Confirm.ask({
      title: '一次出齐这一档',
      body: '这一档里有 ' + p.face + ' 条还缺预览图／道具图、' + p.three + ' 位角色还缺三视图，'
        + '一共发 ' + p.tasks + ' 次生图请求（每次出一张）。'
        + '中途可以按「停下」，但已经发出去的那些收不回来，平台那边会照样跑完。',
      okLabel: '开始出',
    })) return;
    stopFlag = false;
    /* 一条任务的回合没有「停下」可言（发都发了，等就是了）—— 摆一颗点了不改变任何事的按钮，
       比不摆更糟。多于一项时才给出口。 */
    fillStoppable = p.jobs.length > 1;
    const bStop = $('btnStop'); if (bStop) bStop.disabled = false;
    let done = 0;
    /* 进度按**素材条目**数（jobs），不按请求条数（tasks）：一条素材可能要两次，
       用 tasks 当分母的话这一句永远到不了头。 */
    genSet('fill', null, '一次出齐：0 / ' + p.jobs.length + ' 条…');
    try {
      await D.Pipe.runPool(p.jobs, FILL_CONC, async (j) => {
        if (stopFlag) return;
        const c = j.c;
        if (j.face) await genRun('face', c.id, c, '', hook => D.Pipe.drawPreview(REG, fakeDrama(), c, { count: ONE, onTask: hook }), true);
        if (stopFlag) return;
        if (j.three) {
          if (!D.picOf(c)) {
            /* 预览图这一步没成，硬发第二步只会得到一张照着旧图（或什么都没有）画的三视图 ——
               别让用户以为两张都出来了。原因写在卡上，不弹一串 toast。 */
            errSet('asset#three', c.id, '预览图这次没出来；三视图要照着它画，所以这一步跳过了');
            paintCard(c);
          } else {
            await genRun('asset#three', c.id, c, '', hook => D.Pipe.drawCharAsset(REG, fakeDrama(), c, 'three', { count: ONE, onTask: hook }), true);
          }
        }
        done++;
        /* 每条消息都空着，进度就只有这一句（40 条的批量把 genLine 拼成一片墙就没法看了）。
           分母用 jobs.length（素材条目数），不是 p.tasks（请求条数）：一条素材可能要发两次，
           用请求数当分母，这一句永远到不了头（1231 那句注释说的就是这件事）。 */
        if (genHas('fill', null)) genSet('fill', null, '一次出齐：' + done + ' / ' + p.jobs.length + ' 条…');
      });
    } finally {
      fillStoppable = false;
      genClear('fill', null);
      render();
    }
  }
  /* ---------- 「存回本机」：把这一档里本机还没有那份字节的地址取回本机 ----------
     这一页为什么不受「不显示云端任务」那一挡影响、却要单独有这么一颗按钮：
     素材库存的是人自己攒的角色与场景，按「本机有没有副本」把它们藏掉，用户看到的只是
     「我的库空了一半」—— 判据的副作用不该糊在人的数据上。所以这一页照旧全画，
     只给一条把字节真正取回本机的路，存不存由人决定。
     落盘走 `AssetLocal.pull`（与后台自动镜像同一条链：同一份身份判据、同一道去重、
     同一份按类型另存），所以存好之后生成工作台与资产库立刻也认得这一份，不用在那两页再存一遍。
     ⚠ 它与 `durablePic` 不是同一件事：那一颗服务「当场挑来的那一张」（本地文件 / 刚生成的，
        没有来源身份可记，只要一个记得住的地址）；这一颗服务「库里已经存着的一个外链地址」
        （要的是把那份字节取回来、并按这条地址的身份记账）。 */
  function localSlots(c) {
    const out = [];
    const k = CANDK[mainKind(c)];
    if (k) { const v = k.got(c); if (v) out.push({ lab: k.lab, src: v, set: x => k.set(c, x) }); }
    if (c.refAudio) out.push({ lab: '参考音频', src: c.refAudio, set: x => { c.refAudio = x; } });
    const list = D.Cast.assetsOf(c);
    list.forEach((a, i) => out.push({
      lab: a.name || '资产', src: a.src,
      /* 写回按**这一份 list** 的下标：老字典形状的 `assetsOf` 每次读都现造一批新 id，
         两次读出来的不是同一个列表，按下标改第二次读的那一份就会改到别的东西上。 */
      set: x => { list[i] = { ...list[i], src: x }; D.Cast.assetsSave(c, list); },
    }));
    /* `hasLocalAddr` 是唯一的「本机有没有这份字节」判据（收藏那颗按钮读的也是它）：
       `/asset/la_xxx` 与「索引里认得出的那条外链」都算已经有，一条都不许多下一遍。 */
    return out.filter(s => s.src && !AssetLocal.hasLocalAddr(s.src));
  }
  function localPlan() {
    const jobs = [];
    viewItems.forEach(c => { if (c) localSlots(c).forEach(s => jobs.push({ c, lab: s.lab, src: s.src, set: s.set })); });
    return jobs;
  }
  /* `localBusy` 声明在上面（paintBusy 会读它）。 */
  function paintLocalBtn() {
    const b = $('btnLocal'); if (!b) return;
    if (localBusy) { b.disabled = true; b.textContent = '正在存回本机…'; return; }
    const n = localPlan().length;
    b.disabled = !n;
    b.textContent = n ? '存回本机（' + n + '）' : '存回本机';
    b.title = n
      ? '这一档里有 ' + n + ' 个格子的字节还不在本机（外链一过期就是破图）：逐张取回本机资产库，'
        + '存好就换成本机地址。已经在本机的一条都不会重下。'
      : (viewItems.length ? '这一档筛出来的图与参考音频，本机都已经有了，不用再存'
        : '这一档里还没有素材');
  }
  async function pullLocal() {
    if (localBusy) return;
    const jobs = localPlan();
    if (!jobs.length) { Toast.info(viewItems.length ? '这一档要存的本机都已经有了' : '这一档里还没有素材'); return; }
    localBusy = true;
    paintLocalBtn();
    let ok = 0, kept = 0, busy = 0, cant = 0, done = 0;
    const fails = [], dirty = new Set();
    const wait = [];
    const mark = () => setBusy('存回本机：' + done + ' / ' + jobs.length + ' 个…');
    for (const j of jobs) {
      let out = null;
      const st = AssetLocal.pull({ url: j.src, rawSrc: j.src, prompt: (j.c.name || '素材') + '-' + j.lab }, {
        force: true,                     // 「自动存本机」没开也照存：这是用户当下点下去的
        cb: (err, r) => {
          done++; mark();
          if (err) { if (r && r.skip) cant++; else fails.push((j.c.name || '这条素材') + ' 的' + j.lab + '：' + err.message); }
          else if (r && r.kept) kept++;
          else if (r && r.id) {
            ok++;
            j.set('/asset/' + encodeURIComponent(r.id) + '?v=2');   // 库里那格换成能记住的本机地址
            dirty.add(j.c);
          }
          if (out) out();
        },
      });
      if (st === 'queued') wait.push(new Promise(rz => { out = rz; }));
      else if (st === 'busy') { busy++; done++; }
      else if (!st) { cant++; done++; }
    }
    await Promise.all(wait);
    /* 存进去的地址一定要落盘：上面那些 `set` 只改了内存里的对象，
       不 libSave 的话界面看着已经换成本机地址、刷新又退回那条外链（而那条多半已经过期）。 */
    let lost = 0;
    dirty.forEach(c => { if (!libSave(c)) lost++; });
    localBusy = false;
    setBusy('');
    render();
    const bits = [];
    if (ok) bits.push('已存回本机 ' + ok + ' 个');
    if (kept) bits.push('本机早就有 ' + kept + ' 个');
    if (busy) bits.push('后台那一轮正在存 ' + busy + ' 个，没重复排');
    if (cant) bits.push('有 ' + cant + ' 个存不了（比本机镜像的上限还大，或手上只剩一个转发地址、取不到原始外链）');
    if (fails.length) bits.push('有 ' + fails.length + ' 个没成：' + fails.slice(0, 2).join('；') + (fails.length > 2 ? ' 等' : ''));
    if (lost) bits.push('有 ' + lost + ' 条没写进库，那几格刷新会退回外链（保存为什么失败见上面那条提示）');
    if (fails.length || cant || lost) Toast.err(bits.join(' · ') || '一个都没存进本机');
    else if (ok) Toast.ok(bits.join(' · '));
    else Toast.info(bits.join(' · ') || '这一档没有需要存的');
  }

  /* 挑来的图先落成本机资产再记进库。两种「当场能用、过后就没了」的地址不能直接存：
     本地上传那一张是 `blob:`（刷新即失效），资产库 / 收藏那一张多半是包着签名外链的 `/getv`（外链只管一天）——
     而库里存的是字符串地址，记成这两种等于把一张已经不存在的图写进库，第二天卡片是破图。
     取字节与落盘那一步只有 `AssetTransfer.toLocalAsset` 一份，这里只补这一页怎么说。 */
  async function durablePic(it, name) {
    if (!it) return '';
    setBusy('正在把这一张存进本机资产…');
    try {
      const r = await AssetTransfer.toLocalAsset(it.file || it.dl || it.src || it.url, { name, from: it.provider || 'picker' });
      return r.src;
    } catch (e) {
      setBusy('');
      Toast.err('这一张存不进素材库：' + ((e && e.message) || e));
      return '';
    }
  }
  /* 改完一条：只写库 + 重画（keepOpen=true 时连展开的编辑区一起留着，声音那几项改完还要接着点）。
     {exact:true} 是这一页的身份：改的就是库里那一条本身，空值要真的写进去（清空分组、删掉描述）。 */
  function keep(c, keepOpen) {
    libSave(c);
    if (!keepOpen) openId = '';
    setBusy('');
    /* 编辑区还开在这一张上：只重画这一张 —— 整页 render 会把光标位置、滚动位置一起弄丢，
       而人多半正要在这张卡上接着点（挑一张候选、再听一次）。筛选计数还是现算一遍。 */
    if (openId === c.id) { paintCard(c); paintChips(); }
    else render();
  }
  /* 展开 / 收起编辑区（按 id，Esc 那条手上没有对象）。展开时把这一张滚进视野：靠下的卡片
     展开后编辑区整块在屏幕外，看着就像「点了编辑什么也没发生」。 */
  function toggleEdit(id, force) {
    const on = force == null ? openId !== id : !!force;
    openId = on ? id : '';
    render();
    if (!on) return;
    const el = document.querySelector('.card[data-id="' + id + '"]');
    if (el) el.scrollIntoView({ block: 'nearest' });
  }

  /* 打开一张图。`label` 是这一张叫什么（三视图 / 道具图 / 预览图…），
     拼出来是「小雅 · 三视图」。找不到就在灯箱里现开一张（当前视图没收录它时）。 */
  function openZoom(c, label, s) {
    if (!s) { Toast.err('这一条还没有这张图'); return; }
    const i = media.findIndex(x => x.s === s);
    if (i >= 0) Wb.lightbox.open(media[i]);
    else Wb.lightbox.open({ key: 'char:' + c.id + ':' + s, s, name: c.name + ' · ' + (label || '图'), item: c });
  }

  /* 参考音频：类型 / 大小上限都现读这个语音型号的能力声明（D.Cast.refAudioRule） */
  async function pickRefAudio(c) {
    const rr = D.Cast.refAudioRule(REG, opts);
    const got = await AssetPicker.open({ types: rr.types, multiple: false, limit: 1,
      title: '给「' + c.name + '」选一段参考音频', rule: rr.rule, upload: rr.upload });
    if (!got || !got.length) return;
    setBusy('正在读这段参考音频…');
    const it = got[0];
    const b = it.file || await Net.blob(it.dl || it.src, { timeout: 120000 });
    if (rr.rule.maxBytes && b.size > rr.rule.maxBytes) { setBusy(''); return Toast.err('参考音频太大：上限 ' + Math.round(rr.rule.maxBytes / 1048576) + ' MB'); }
    await D.Pipe.saveRefAudio(c, b, (it.prompt || it.name || '参考音频').slice(0, 20));
    keep(c, true);
    Toast.ok('参考音频挂上了，可以试听；视频模型有「参考音频」槽位时也会一起发过去');
  }

  /* ⚠ 「把这一条加进某一集」随拍短剧页一起删除了（合并规则原本在 Chars.Lib.pullInto，
     那是「剧侧 ↔ 库」两套数据的对齐，页面一删就没有第二套数据要对齐了）。
     2026-10 起素材库是**就地编辑**的唯一数据源，导演台与工作台直接引用它。 */

  /* 表单本身（字段、按类型换措辞、重名拦截）在 `chars.js` 的 `D.Lib.newForm` 一份 ——
     当年拍短剧的挑选弹窗里那颗「＋ 新建素材」自己写了第二份，漂成了旧措辞、还漏了场景的「时段」一行。

     「先出后选再创建」是这条流程现在的样子（用户要求）：
       ① 填名字 / 类型 / 描述（也可以顺手挑一张现成的图）；
       ② **当场出图与出声**，过程中这一格显示占位符（不是转圈，是「这一格正在长出来」）；
       ③ 在一个挑选弹窗里**预览并挑选**满意的图与音色，可以重出、可以只用文字直接建；
       ④ 挑完才点「创建素材」—— 这时候才写库。
     为什么是这个顺序：以前是「先建档、再出图」，于是用户要么接受一张没挑选过的图，
     要么手动再重出一次（多花一次生成），而「重出」这一下在素材还没建的时候根本做不到。
     `newForm({onlyFields})` 只做校验与归一（不写库），`Lib.commitForm` 是唯一写库的那一下。 */
  async function newChar() {
    const r = await D.Lib.newForm({ group: group === '__none' ? '' : group, onlyFields: true });
    if (!r) return;                              // 用户按了取消
    if (r.error) return Toast.err(r.error);
    const f = r.fields;
    const kind = r.kind;

    /* 能不能生成：出图要一个描述 + 一个能用的图片模型；出声只对角色有效。
       凑不齐就走「只用文字创建」那条 —— 不在这里把用户退回表单（他填的东西会丢）。 */
    const look = String(f.look || '').trim();
    /* 「有没有能用的生图型号」判据是 `D.Pipe.pickProvModel` 一份（这一页 1188 行那一处也是它）——
       自己再判一遍「opts.imgModel 非空 / 注册表里有这一类」就会与真正出图的那次走偏。 */
    const canPic = !!look && !!D.Pipe.pickProvModel(REG, 'image', opts.imgModel, 'text_to_image');
    const canVoice = kind === 'actor' && D.aiVoiceOn();
    if (!f.pic && !canPic && !canVoice) {
      /* 一张图与一把嗓子都出不来：不必走过场，直接问一句要不要就用文字建。
         这是最省事的一种结局，不该让用户对着一个空弹窗。 */
      const yes = !window.Confirm || await Confirm.ask({
        title: '这一条只能存文字',
        body: (look ? '现在没有可用的生图平台（设置页填一把密钥，或在上面「出图型号」里挑一个）' : '还没写描述（出图靠它）')
          + (kind === 'actor' ? '；「让 AI 给角色定音色」那个开关也没开' : '')
          + '，所以这次出不了图。仍然要把它存进素材库吗？',
        okLabel: '只用文字创建', cancelLabel: '回去补',
      });
      if (!yes) return;
      return commitNew(f, kind, { pic: f.pic || '' });
    }

    /* 一个临时的对象：**不写库**，出图与出声都长在它身上（drawPreview / assignVoices
       都只读它的字段、就地写 faces 与音色 —— 判据是同一套，不需要为预览另做一份）。 */
    const tmp = {
      id: 'draft_' + Date.now().toString(36), kind: kind,
      name: f.name, group: f.group, look: f.look, bio: f.bio,
      desc: kind === 'scene' ? f.look : '', time: kind === 'scene' ? f.time : '',
      faces: [], voice: '', voiceName: '', voiceNote: '', voiceMode: '',
    };

    /* 生成过程中这一格显示什么：占位符（跟卡片上「正在出」的那一档同一套形状），
       不是一句 toast。用户点完「生成」之后界面必须**立刻**变 ——
       否则「我点了，怎么没反应」和「正在生成」之间那几秒是最容易以为坏了的时候。 */
    const host = document.createElement('div');
    host.className = 'ui-draft';
    host.innerHTML = draftPlaceholder(f.name, kind, { pic: !!canPic, voice: canVoice });
    document.body.appendChild(host);

    const state = { pic: f.pic || '', faces: [], voice: null, busy: { pic: !!canPic, voice: canVoice } };
    /* 出图与出声**并排跑**：两个都只花钱不写库，谁先完谁先落在 state 上。
       串行的话用户要多等一份钱的时间，而这两件事互不依赖。 */
    const jobs = [];
    if (canPic) {
      jobs.push((async () => {
        await genRun('face', tmp.id, tmp, '正在出「' + f.name + '」的预览图…',
          () => D.Pipe.drawPreview(REG, fakeDrama(), tmp, { count: candCount(), onTask: onTaskHook }));
        state.faces = (tmp.faces || []).slice();
      })());
    }
    if (canVoice) {
      jobs.push((async () => {
        /* assignVoices 要的是「一集的角色」，所以现搭一个只装这一位的壳
           （D.toEpisodeChar 是库→剧侧那一份字段映射，只有它一份）。 */
        const shell = Object.assign(fakeDrama(), { characters: [D.toEpisodeChar(Object.assign({}, tmp, { kind: 'actor' }))] });
        await genRun('voice', tmp.id, tmp, '正在按人设定「' + f.name + '」的声音…',
          () => D.Pipe.assignVoices(REG, shell, { only: [f.name] }));
        const one = shell.characters[0] || {};
        if (one.voice || one.refAudio || String(one.voiceNote || '').trim()) {
          state.voice = { voice: one.voice, voiceName: one.voiceName, voiceNote: one.voiceNote,
            voiceMode: one.voiceMode, refAudio: one.refAudio, refAudioName: one.refAudioName, voiceBy: 'ai' };
        }
      })());
    }
    await Promise.allSettled(jobs);
    /* 一张都没出来也要说清为什么 —— 不然用户面对一个空弹窗，只能猜是不是坏了。 */
    const why = [];
    if (canPic && !state.faces.length) why.push('图没出来' + (look ? '' : '（没写描述）'));
    if (canVoice && !state.voice) why.push('声音没定出来');
    host.remove();

    const picked = await pickDraft(f, kind, state, why);
    if (!picked) return;                            // 用户取消：什么也不写
    return commitNew(f, kind, picked);
  }

  /* 生成过程中的占位符。形状刻意照抄卡片里「正在出」那一档（同一份 `ui-cands` / `.ui-wait`）——
     占位符与真正生成中的候选长得一样，用户才认得出「这就是它在长的样子」。 */
  function draftPlaceholder(name, kind, want) {
    /* 形状照 ui.css 的 `.ui-wait.fill`（那一档就是「铺满一格正在长」）：
       自建一个 `.ui-thumb` 会在九页里长出第二份「缩略图该多大」的判据。 */
    const one = (lab) => '<div class="ui-cand"><div class="ui-wait fill" style="width:76px;height:76px">'
      + '<i></i><span>' + lab + '…</span></div></div>';
    return '<div class="ui-pick"><div class="ui-hint" style="margin-bottom:8px">'
      + '正在给「' + D.esc(name) + '」准备 ' + (want.voice ? '图与声音' : '图')
      + ' —— 出好了会让你挑；这一步还没存进素材库</div>'
      + '<div class="ui-cands">' + (want.pic ? one('图') : '') + (want.voice ? one('声音') : '') + '</div></div>';
  }

  /* 「这把嗓子现在能不能试听」—— 有参考音频（复刻）或已经是资产地址的才真能播。
     音色描述与预设音色要等素材建好、配音跑过一次之后才有音频。
     判据只有这一处（挑选窗里那个键的 disabled 与那句提示都读它）。 */
  const canPlayNow = st => !!(st && st.voice && (st.voice.refAudio || st.voice.voice));
  /* 挑选弹窗：预览 + 选。返回 null = 取消（什么也不写），返回 { pic, faces, voice } = 按这个建。
     这一格是「用户唯一能看到结果的地方」，所以图要点开能放大、声音要能试听 ——
     只摆一排缩略图让人凭想象挑，等于没有挑选。 */
  async function pickDraft(f, kind, state, why) {
    const body = document.createElement('div');
    body.className = 'ui-pick';
    let chosen = state.faces.length ? 0 : -1;      // 默认选第一张出得最好的
    let useTextOnly = !state.faces.length && !state.voice;

    const draw = () => {
      const pw = D.picWord ? D.picWord(f) : '预览图';
      const secPic = state.faces.length
        ? '<div class="ui-sec">挑一张' + D.esc(pw) + '（第 ' + (chosen + 1) + ' / ' + state.faces.length + ' 张）</div>'
          + '<div class="ui-cands">' + state.faces.map((x, i) =>
            '<div class="ui-cand' + (i === chosen ? ' on' : '') + '" data-pi="' + i + '" title="点一下就选它">'
            + '<img src="' + D.esc(x.src) + '" alt="第 ' + (i + 1) + ' 张">'
            + '<span class="t">第 ' + (i + 1) + ' 张</span></div>').join('') + '</div>'
          + '<div class="btn-row"><button class="ghost" id="pdOpen">放大看这一张</button>'
          + '<button class="ghost" id="pdAgain">再出几张</button></div>'
        : '<div class="ui-sec">' + D.esc(pw) + '</div><div class="ui-hint">'
          + (why.length && why[0].indexOf('图') >= 0 ? why[0] + '。' : '这次没出图（已经有图或描述还没写）。')
          + '你可以只用文字创建，之后在编辑区里点「AI 出' + D.esc(pw) + '」再出。</div>';
      const secVoice = kind === 'actor'
        ? '<div class="ui-sec">声音</div>' + (state.voice
          ? '<div class="ui-box" id="pdVoice"><div class="ui-hint">'
          + (state.voice.voiceMode === 'clone' ? '复刻这一位的参考音频' : (state.voice.voiceNote ? '音色描述：' + state.voice.voiceNote : '预设音色：' + (state.voice.voiceName || state.voice.voice || '')))
          + '</div><div class="btn-row"><button class="ghost" id="pdPlay">试听</button>'
          + '<button class="ghost" id="pdVoiceAgain">让 AI 换一个</button></div>'
          + (canPlayNow(state) ? '' : '<div class="ui-hint">音色描述与预设音色要等素材建好、拿到预览音频之后才能试听</div>')
          + '</div>'
          : '<div class="ui-hint">'
          + (why.length && why.some(x => x.indexOf('声音') >= 0) ? why.find(x => x.indexOf('声音') >= 0) + '。' : '这次没定音色（设置里那个开关没开）。')
          + '仍然可以只用文字创建，之后在编辑区里点「AI 定音色」。</div>')
        : '';
      body.innerHTML = secPic + secVoice
        + '<div class="ui-hint" style="margin-top:10px">挑完点下面的「创建素材」才写进素材库；'
        + '直接关掉这一窗则什么都不会保存。</div>';
      body.querySelectorAll('[data-pi]').forEach(el => {
        el.onclick = () => { chosen = Number(el.dataset.pi); useTextOnly = false; draw(); };
      });
      const ag = $('pdAgain');
      if (ag) ag.onclick = async () => { useTextOnly = false; await againPic(); };
      const op = $('pdOpen');
      if (op) op.onclick = () => {
        /* 放大看：lightbox.open 是 (item, listOverride)，不是 (list, index) ——
           顺序传错的话它会在 listOverride 里找 item（找不到就把 list 换成 [item]），
           结果是「能打开、但翻页没了」。传整份列表进去，翻页就还在。 */
        const x = state.faces[chosen];
        if (!x) return;
        const items = state.faces.map(f2 => ({ src: f2.src, label: f.name }));
        Wb.lightbox.open(Object.assign({ key: 'draft:' + f.name + ':' + chosen }, items[chosen]), items);
      };
      /* 「试听」只在**有参考音频**时才是真的能播（复刻模式）：`Cast.playAsset` 播的是素材地址，
         而「音色描述 / 预设音色」根本还没有音频 —— 给它摆一颗「试听」按钮，
         点下去只能报一句「还没出声」，那是又一个兑现不了的承诺。
         所以：复刻的给真的试听键；设计/预设的那一档给「保存后到编辑区试听」这句话。 */
      const canPlay = !!(state.voice && (state.voice.refAudio || state.voice.voice));
      const pb = $('pdPlay');
      if (pb && !canPlay) { pb.disabled = true; pb.title = '音色描述 / 预设音色要等素材建好、拿到预览音频之后才能试听'; }
      if (pb) pb.onclick = async () => {
