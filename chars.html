        try { await D.Cast.playAsset(state.voice.refAudio || state.voice.voice); }
        catch (e) { Toast.err('试听没出声：' + ((e && e.message) || e)); }
      };
      const va = $('pdVoiceAgain');
      if (va) va.onclick = async () => { useTextOnly = false; await againVoice(); };
    };
    /* 重出与换音色都只改state，然后重画这一格 —— 挑选窗一直开着，用户能来回比。 */
    const againPic = async () => {
      const look2 = String(f.look || '').trim();
      if (!look2) return Toast.warn('出图要靠上面那段描述 —— 先补一句');
      if (!D.Pipe.pickProvModel(REG, 'image', opts.imgModel, 'text_to_image')) {
        return Toast.warn('现在没有可用的生图平台：到设置页填一把密钥，或在右边「出图型号」里挑一个');
      }
      const tmp2 = { id: 'draft_pic', kind, name: f.name, look: f.look, desc: kind === 'scene' ? f.look : '',
        time: kind === 'scene' ? f.time : '', faces: [] };
      const old = state.faces.slice();
      const okk = await genRun('face', 'draft_pic', tmp2, '正在再出几张…',
        () => D.Pipe.drawPreview(REG, fakeDrama(), tmp2, { count: candCount(), onTask: onTaskHook }));
      const got = (tmp2.faces || []).slice();
      if (got.length) { state.faces = old.concat(got); chosen = old.length; draw(); }
      else { Toast.warn('这次没出成（生成失败或被拒绝了）—— 可以再试一次，或直接只用文字创建', 8000); draw(); }
    };
    const againVoice = async () => {
      if (!D.aiVoiceOn()) return Toast.warn('设置里「让 AI 给角色定音色」没开');
      const shell2 = Object.assign(fakeDrama(), { characters: [D.toEpisodeChar({ id: 'd', kind: 'actor', name: f.name, look: f.look, bio: f.bio })] });
      await genRun('voice', 'draft_voice', { id: 'draft_voice' }, '正在换一个音色…',
        () => D.Pipe.assignVoices(REG, shell2, { only: [f.name] }));
      const one2 = shell2.characters[0] || {};
      if (one2.voice || one2.refAudio || String(one2.voiceNote || '').trim()) {
        state.voice = { voice: one2.voice, voiceName: one2.voiceName, voiceNote: one2.voiceNote,
          voiceMode: one2.voiceMode, refAudio: one2.refAudio, refAudioName: one2.refAudioName, voiceBy: 'ai' };
        draw();
      } else Toast.warn('这次没定成 —— 可以再试一次，或直接只用文字创建', 8000);
    };
    draw();

    if (!window.Confirm || !Confirm.choose) return { pic: '', faces: [], voice: null };
    const pick = await Confirm.choose({
      title: '挑一下，再创建「' + f.name + '」',
      bodyNode: body,
      options: [{ value: 'ok', label: '创建素材', hint: (state.faces.length && chosen >= 0 ? '用第 ' + (chosen + 1) + ' 张图' : '不带图')
          + (state.voice ? ' · 带刚定的那把嗓子' : '') },
      { value: 'text', label: '只用文字创建', hint: '不带图也不带声音，之后随时能补' }],
      cancelLabel: '取消（什么也不保存）',
    });
    if (pick === 'text') return { pic: '', faces: [], voice: null };
    if (!pick) return null;
    if (useTextOnly) return { pic: '', faces: [], voice: null };
    const chosenSrc = chosen >= 0 && state.faces[chosen] ? state.faces[chosen].src : '';
    return { pic: chosenSrc || f.pic || '', faces: state.faces, voice: state.voice };
  }

  /* 真的建档。**这是整个流程里唯一写库的一下**（`Lib.commitForm`）。
     写完之后才做「把这一张露出来」那几件事：四道筛选可能挡住它、
     名单按拼音排可能落在别的页上。 */
  async function commitNew(f, kind, picked) {
    const c = D.Lib.commitForm(Object.assign({}, f, {
      pic: (picked && picked.pic) || f.pic || '',
      faces: (picked && picked.faces) || [],
      voice: (picked && picked.voice) || null,
    }));
    if (c && c.error) return Toast.err(c.error);
    const saved = c.item;
    /* 建完得真看得见这一张。这一页有四道筛选（类型档 / 分组 / 搜索框 / AI 挑的那批），
       新建的那一条多半落在当前这一档之外 —— 于是 toast 说「编辑区已经打开」，
       画面上却一张卡都没有（编辑区开在一条被筛掉的素材上）。哪一道把它挡住了就松开哪一道，并照实说。 */
    const hid = [];
    if (!match(saved, filter)) {
      filter = D.libKindOf(saved);
      hid.push('类型档切到「' + (D.LIB_KINDS[filter] || filter) + '」');
    }
    const g = String(saved.group || '').trim();
    if (group && g !== (group === '__none' ? '' : group)) { group = g || '__none'; hid.push('分组跟着切过去'); }
    const qq = $('q').value.trim();
    if (qq && !D.Lib.hayOf(saved).includes(qq.toLowerCase())) { $('q').value = ''; hid.push('清空了搜索框'); }
    if (aiPick && !aiPick.has(saved.id)) { aiPick = null; aiWhy = ''; hid.push('退出「AI 挑的那批」'); }
    const bits = ['编辑区已经打开——' + c.tip];
    if (picked && picked.faces && picked.faces.length > 1) bits.push('刚才挑的是第几张可以随时换');
    Toast.ok('建好了：' + saved.name + '。' + bits.join('；') + (hid.length ? '（' + hid.join('、') + '，不然这一张不在当前这一档里）' : ''));
    openId = saved.id; resetPaging(); await render();
    /* 名单是按**名字拼音**排的（见 orderItems），新建的那一条可能落在任何一页 ——
       只写一句「编辑区已经打开」，人却在当前这一页上找不到它。
       先把显示窗口撑到它那一格（动态加载）/ 跳到它所在那一页（翻页模式），再重画一次。 */
    if (revealItem(saved.id)) await render();
    const mine = document.querySelector('.card[data-id="' + saved.id + '"]');
    if (mine && mine.scrollIntoView) mine.scrollIntoView({ block: 'center' });
  }
  /* 把某一条拉进当前显示范围。返回 true = 分页窗口动过，调用方要重画一次。 */
  function revealItem(id) {
    const i = viewItems.findIndex(x => x && x.id === id);
    if (i < 0) return false;                       // 被筛选挡在外面（调用方已经松过筛选，正常到不了这）
    if (PAGE_MODE === 'more') {
      const want = Math.ceil((i + 1) / PAGE_SIZE);
      if (want <= morePages) return false;
      morePages = want;
      return true;
    }
    if (pager.page === Math.floor(i / PAGE_SIZE)) return false;
    pager.setPage(Math.floor(i / PAGE_SIZE));
    return true;
  }

  /* ---------- AI 找素材：话就写在搜索框里，结果就地筛这份名单（角色 / 场景 / 道具三种都算） ---------- */
  /* 型号下拉与生成工作台同一套二级菜单（组头 = 平台显示名，选项文字 = 平台真正的调用名，
     友好名放 title），数据源现读注册表：以前选项文字写着「MiMo TTS（音色设计）」那种整串，
     看着像型号自带的能力说明，和别的页面对不上。 */
  function paintModelPicks() {
    const mk = (host, kind, mode, val, onpick, hint) => {
      const el = $(host); if (!el) return;
      el.innerHTML = D.Pipe.modelSelectHTML(REG, { id: 'sel_' + host, kind: kind, mode: mode, value: val, emptyText: hint });
      const s = el.querySelector('select');
      if (s) s.onchange = () => { onpick(s.value); };
      if (window.Dropdowns) Dropdowns.build(el);
    };
    mk('imgPick', 'image', 'text_to_image', opts.imgModel,
      v => { opts.imgModel = v; saveOpts(); render(); }, '没配生图平台');
    mk('ttsPick', 'audio', 'text_to_speech', opts.ttsModel,
      v => { opts.ttsModel = v; saveOpts(); render(); }, '没配语音平台');
    paintCandPick();
  }
  /* 「出图张数」：写的是**设置页那一项同一个键**（`D.SET.candN.key` = char_cand_n），
     改哪边两边都变 —— 素材库里攒的候选会跟着角色拉进某一集，两页各存一份就会
     「这边出 3 张、那边 1 张」。只建一次（选项 1~8 是固定的），之后只同步值，
     免得每次 render 都重建一个 select（下拉开着的时候会被拆掉）。 */
  let candSelBuilt = false;
  function paintCandPick() {
    const host = $('candPick'); if (!host) return;
    const it = D.SET.candN;
    const lo = Number(it.min) || 1, hi = Number(it.max) || 8;
    if (!candSelBuilt) {
      candSelBuilt = true;
      host.innerHTML = '<select id="candSel">'
        + Array.from({ length: hi - lo + 1 }, (_, i) => lo + i)
          .map(n => '<option value="' + n + '">' + n + ' 张</option>').join('')
        + '</select>';
      const s = $('candSel');
      if (s) s.onchange = () => {
        try { localStorage.setItem(it.key, String(Number(s.value) || Number(it.def))); } catch (e) {}
        render();                    // 按钮文案、候选排的占位张数都跟着变
      };
      if (window.Dropdowns) Dropdowns.build(host);
    }
    const sel = $('candSel'); if (!sel) return;
    const raw = String(Number(D.setting('candN')) || Number(it.def));
    if (sel.value !== raw) { sel.value = raw; if (window.Dropdowns) Dropdowns.sync(sel); }
    /* 实际张数还要被生图型号声明的 `max_outputs` 夹住（`candCount` 那一处判据）——
       夹住了就照实说，否则「设了 3 张、只出 1 张」又成了另一种文案不一致。 */
    const real = candCount();
    sel.title = '一次出几张预览图候选（角色 / 场景 / 道具的主图）。'
      + (real < Number(raw) ? '当前生图型号最多一次出 ' + real + ' 张，所以实际是 ' + real + ' 张。' : '')
      + '与设置页「角色 / 场景 / 道具 一次出几张候选」是同一个设置。'
      + '「加一张角色资产」与「一次出齐这一档」不受它影响，都固定出 1 张。';
    host.title = sel.title;
  }

  async function runAiFind() {
    const box = $('q');
    const q = (box.value || '').trim();
    const all = D.Lib.list();
    if (!all.length) { Toast.err('素材库还是空的，先点右边「新建素材」'); return; }
    if (q.length < 2) { Toast.err('先在搜索框写要什么样的素材（至少两个字），再点 AI 找'); box.focus(); return; }
    const btn = $('aiFindBtn'), old = btn.innerHTML;
    btn.disabled = true; btn.textContent = 'AI 正在挑…';
    let msg = '';
    try {
      /* 三种类型都在这一份名单里（2026-10 加了道具），所以这段提示词不能再说「挑几位角色」——
         需求写「一把伞」时，它要能挑出道具那一档。类型也照实告诉它：场景是地方不是人、道具是物件。 */
      const sys = '你是选角导演：用户会用一句话描述需求，你要从他收藏的素材里挑最合适的几条。\n'
        + '规则：\n1. 只输出 JSON，不要解释、不要 markdown：{"ids":["素材ID"],"summary":"一句话说明按什么挑的"}\n'
        + '2 优先级：外貌/描述 > 一句话人设/用途 > 类型（角色出镜、场景是地方不是人、道具是物件）。\n'
        + '3. 宁缺毋滥：没有合适的就返回空数组。\n4. summary 说清你的理解，界面会显示给用户。';
      const txt = await TextAI.chat(REG, sys, JSON.stringify({ 需求: q, 素材库: all.map(c => ({
        id: c.id, 名字: c.name, 类型: D.LIB_KINDS[D.libKindOf(c)], 分组: c.group || '', 人设: c.bio || '', 描述: c.look || '',
      })) }));
      const j = TextAI.parseJson(txt) || {};
      const ids = (Array.isArray(j.ids) ? j.ids : []).filter(x => D.Lib.get(x));
      aiPick = ids.length ? new Set(ids) : null;
      aiRank = ids.length ? new Map(ids.map((k, i) => [k, i])) : null;
      aiWhy = ids.length ? String(j.summary || '').slice(0, 40) : '';
      if (ids.length) {
        box.value = '';        // 原话已翻成 id，留着会再 AND 一遍（几乎必然 0 位）
        /* AI 返回的 ids 顺序本身就是「最合适在前」，aiRank 记下来就照着排 ——
           以前这份顺序被整份丢掉，aiPick 只当集合用。 */
      }
      filter = 'all';
      msg = ids.length ? '' : 'AI 没挑到合适的（换个说法再试）';
    } catch (e) { msg = 'AI 找素材失败：' + e.message; }
    finally { btn.disabled = false; btn.innerHTML = old; }
    resetPaging(); render();
    if (msg) $('cnt').textContent = msg;
  }

  /* ---------- 「这一条被导演台几个镜头引用了」 ----------
     导演台的提示词里可以打 `@名字` 引用素材库（见 director.html 的 mention 那一段），
     引用是**按名字**对上的。素材库这边把它数出来，卡片上就能一眼看出「这一条还有没有在用」——
     尤其是改了名之后：`@旧名` 就再也对不上了，这里会立刻归零。
     数据在导演台工作区（IndexedDB director_db / kv 的 workspace 键），与素材库同一个源，
     只读；读不到（没打开过导演台 / 库还没建）就当 0，不弹任何错。 */
  let refUse = new Map(), refUseAt = 0;
  async function loadRefUse() {
    if (Date.now() - refUseAt < 5000) return refUse;      // 5 秒一份：一次 render 只读一次盘
    const map = new Map();
    try {
      const ws = await Kv.at('ws').get('workspace');
      const shots = [];
      ((ws && ws.projects) || []).forEach(p => ((p && p.scenes) || []).forEach(sc =>
        ((sc && sc.shots) || []).forEach(sh => { if (sh) shots.push(sh); })));
      /* 与 director.html 的 mentionAt 同一套词法：@ 起一个新词（前面不能是字母 / 数字，
         否则邮箱 a@b.com 也会被算成引用），名字里不能有空白。
         注意**不能**要求「@ 前面是空白」—— 中文句子不打空格，那样一个都数不到。 */
      const re = /(^|[^A-Za-z0-9._%+-])@([^\s\u3000@，。；、,.!?！？：:（）()【\[\]「」『』"']{1,24})/g;
      shots.forEach(sh => {
        const txt = String(sh.prompt || '');
        if (txt.indexOf('@') < 0) return;
        const names = new Set();
        let m;
        re.lastIndex = 0;
        while ((m = re.exec(txt))) names.add(m[2]);
        names.forEach(n => map.set(n, (map.get(n) || 0) + 1));
      });
    } catch (e) { /* 读不到就当没有引用 */ }
    refUse = map; refUseAt = Date.now();
    return map;
  }
  /* 「导演台里有几个镜头写了 @这个名字」那枚小标签。卡片与编辑区**共用这一份** ——
     两处各拼一遍迟早写成两种说法。 */
  function refTag(c) {
    const n = refUse.get(String((c && c.name) || '')) || 0;
    if (!n) return '';
    return '<span class="ui-tag" title="导演台的提示词里有 ' + n + ' 个镜头写了 @' + esc(c.name) + '">被 ' + n + ' 镜引用</span>';
  }

  async function render() {
    await loadRefUse();          // 卡片上的「被 N 镜引用」要用它（5 秒缓存，不会每轮都读盘）
    const seq = ++renderSeq;
    paintChips(); paintAiChip(); paintGroups(); paintModelPicks(); applyView();
    const q = $('q').value.trim();
    const all = D.Lib.list();
    const items = orderItems(all.filter(c => c && match(c, filter)
      && (!group || String(c.group || '').trim() === (group === '__none' ? '' : group))
      && (!q || D.Lib.hayOf(c).includes(q.toLowerCase()))
      && (!aiPick || aiPick.has(c.id))));
    viewItems.length = 0; media.length = 0;
    items.forEach(c => {
      viewItems.push(c);
      const pic = D.picOf(c);
      if (pic) media.push({ key: 'char:' + c.id + ':face', s: pic, name: c.name + ' · ' + picWord(c), label: picWord(c), item: c });
      /* 灯箱翻页范围用**存着的每一张**（含老库里那些已经不再出图类别的），
         不是「现在能出哪几类」—— 前者要收进去老素材，否则那些图在灯箱里点不到了。
         资产是列表：逐张收，`key` 带资产 id，所以同一个 kind 的两张在灯箱里是**两页**而不是互相顶掉。 */
      D.Cast.assetsOf(c).forEach(a => {
        const lab = D.Cast.assetLabel(c, a.kind) || '图';
        media.push({ key: 'char:' + c.id + ':a:' + a.id, s: a.src, name: c.name + ' · ' + lab, label: lab, item: c });
      });
    });
    $('cnt').textContent = items.length ? '共 ' + items.length + ' 条' : '';
    /* 「一次出齐」的张数说的是**这一档**（筛选 + 分组 + 搜索之后的全部），不是当前这一页：
       分页只决定画哪几张卡，批量该补几条不能跟着翻页变。 */
    paintFillBtn();
    /* 「存回本机」的张数同一套口径：按这一档筛出来的格子算，换筛选/换档都要跟着重算。 */
    paintLocalBtn();
    const grid = $('grid');
    if (!items.length) {
      grid.innerHTML = '<div class="empty">' + (all.length ? '这一档下没有东西。换个筛选条件、换个组，或清空搜索框。'
        : '素材库还是空的。<br>点右上「新建素材」把用顺的人和场景留下 —— 建好之后导演台选参考图、生成工作台出图出配音都会直接用它。') + '</div>';
      $('pagerRow').style.display = 'none';
      return;
    }
    $('pagerRow').style.display = '';
    pager.update();
    grid.innerHTML = '';
    for (const c of pageItems()) {
      if (seq !== renderSeq) return;
      const card = document.createElement('div');
      card.className = 'card' + (openId === c.id ? ' open' : '');
      card.dataset.id = c.id;
      /* 一条画不出来**不能让整页空掉**：以前 cardHTML 抛一次异常，这个 for 就断在这里，
         而 grid 上面刚清空过 —— 后面那些条目一张都不再追加，界面上看着就是
         「点了编辑，卡片消失了」（2026-10 真实发生过：编辑区里一个 TDZ 引用，
         只在「有角色资产的条目」上触发）。
         现在把坏的那一条画成一张说明卡，其余照常画。 */
      try {
        card.innerHTML = cardHTML(c);
        bindCard(card, c);
      } catch (e) {
        console.error('[chars] 这一条画不出来：', e, c);
        card.innerHTML = '<div class="edit"><div class="eh"><span class="t">这一条画不出来</span></div>'
          + '<div class="ui-hint">' + esc((c && c.name) || '（这一条没有名字）') + '：'
          + esc((e && e.message) || String(e))
          + '<br>其余条目不受影响；这一条的数据还在库里，刷新一下再看看。</div></div>';
      }
      grid.appendChild(card);
    }
  }

  async function boot() {
    $('tic').innerHTML = window.icon ? icon('layers', 20) : '';
    $('btnNew').innerHTML = (window.icon ? icon('plus', 13) : '') + ' 新建素材';
    $('aiFindBtn').innerHTML = (window.icon ? icon('sparkles', 14) : '') + ' AI 找素材';
    $('btnNew').onclick = newChar;
    $('aiFindBtn').onclick = runAiFind;
    $('btnFill').onclick = fillRest;
    $('btnLocal').onclick = pullLocal;
    /* 停下不撤回已经发出去的请求（那些钱已经花了、平台正在跑），只是不再开新的：
       按下去那句要说清这一点，否则人以为整批停了。 */
    $('btnStop').onclick = () => {
      if (!genHas('fill', null)) return;
      stopFlag = true;
      genSet('fill', null, '正在停下：已经发出去的那 ' + Math.max(0, GEN.size - 1) + ' 条收不回来，等它们跑完这一批就不再发新的');
      $('btnStop').disabled = true;
    };
    /* 画风那一格已删（2026-10，见上面 paintStyleWhy 留下的那段说明）：不再有 fStyle 输入框要接线。 */
    /* char_opts.style 是旧版留下的值，**读得到但不再用** —— 直接从内存里抹掉，
       免得以后谁翻到它以为素材库还认这一项（真正的画风是每一集自己的 opts.style）。 */
    if (opts.style) { delete opts.style; try { saveOpts(); } catch (e) {} }
    /* 框上那句说明由那张字段表现拼：判据加一栏它就跟着多一栏，不用记着改两处。 */
    $('q').placeholder = '搜' + D.Lib.SEARCH_FIELDS.map(f => f[0]).join(' / ');
    $('q').oninput = () => { resetPaging(); render(); };
    $('q').addEventListener('keydown', e => { if (e.key === 'Escape') { $('q').value = ''; clearAiPick(); } });
    /* Esc 收起正开着的编辑区（改到一半想收手不用滚回去找那颗按钮）。
       搜索框自己的 Escape（清关键词）与弹窗 / 灯箱的 Escape 都不抢。
       灯箱开没开只认 `#lightbox` 的 display（Wb.lightbox 就是这么判的，`#lbStage` 永远没有 hidden，
       拿它当判据等于「Esc 永远被灯箱吃掉」）。 */
    document.addEventListener('keydown', e => {
      if (e.key !== 'Escape' || !openId) return;
      if (e.target && e.target.id === 'q') return;
      if (document.querySelector('dialog[open]')) return;
      const lb = document.getElementById('lightbox');
      if (lb && lb.style.display === 'flex') return;
      toggleEdit(openId, false);
    });
    try { REG = await Api.registry(); } catch (e) { REG = { providers: [] }; Toast.err('读注册表失败：' + e.message); }
    render();
    /* 把上次切页时没等完的出图认领回来（见 resumePending）：不阻塞首屏，画完再悄悄去收。 */
    resumePending();
    /* 滚到底自动续拉：触发机制走 Wb.pager.sentinel（全站一份，哨兵 + IntersectionObserver + scroll 回退）。
       守卫与「续拉之后做什么」是本页自己的账：翻页模式下不续、已经画完也不续。 */
    Wb.pager.sentinel('gridEnd', () => {
      if (PAGE_MODE !== 'more' || shownCount() >= viewItems.length) return;
      morePages++; render();
    });
  }
  /* 素材库写盘只走 Chars.Lib（内部是 Kv + localStorage），另一个标签页开着这一页
     存进库时这里要能跟着刷新 —— storage 事件是浏览器给跨标签页的那一条通道。 */
  window.addEventListener('storage', e => { if (!e.key || e.key === 'char_lib') render(); });
  boot();
  /* 助手在别处改了素材库（`RUN save_char` / `remove_char`）之后调它重画 ——
     有了它，助手说一句「已存进素材库」时界面**当场**就变了；
     没有的话用户得自己刷新才看得见，而「它说存了、界面上没有」是最坏的一种。
     助手那边是 `frameWin().__charsChanged()`（见 ai-chat.js 的 runChar / runRemoveChar）。 */
  window.__charsChanged = () => { try { render(); } catch (e) {} };
})();
</script>
</body>
