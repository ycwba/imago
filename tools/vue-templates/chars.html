<div class="page-main chars-page page-shell" ref="rootEl">
  <header class="phead">
    <div class="phead-id"><h1 class="phead-h1">素材库</h1></div>
    <div class="phead-meta"><span class="phead-chip">{{ libraryCount }} 项素材</span></div>
    <span class="phead-sub"></span>
    <div class="phead-acts">
      <button class="pri" type="button" ref="btnNewEl" v-html="newBtnHtml" @click="newChar"></button>
    </div>
  </header>

  <div class="mat" ref="matEl" :class="{ 'has-insp': !!inspId, 'rail-open': railOpen }">
    <button v-if="railOpen" class="mat-scrim" type="button" aria-label="关闭目录" @click="railOpen = false"></button>
    <aside class="mat-rail" aria-label="素材目录">
      <div class="rail-top">
        <div class="rail-h1">目录</div>
        <button class="ghost rail-close" type="button" @click="railOpen = false">收起</button>
      </div>
      <div class="rail-scroll" ref="railScrollEl"></div>
      <div class="rail-sub" ref="railSubEl" role="status"></div>
    </aside>

    <section class="mat-stage" aria-label="素材列表">
      <header class="mat-head">
        <button class="ghost rail-toggle" type="button" ref="railToggleEl" :aria-expanded="railOpen" @click="railOpen = !railOpen">目录</button>
        <div class="toolbar" ref="toolbarEl"></div>
      </header>
      <div class="mat-caption">
        <div class="mat-heading"><h2>{{ scopeTitle }}</h2><span class="mat-count" role="status">{{ cntText }}</span></div>
        <div class="mat-view">
          <button class="ghost" type="button" ref="btnMultiEl" :class="{ active: multi }" :aria-pressed="multi" @click="toggleMulti()">{{ multi ? '退出多选' : '多选' }}</button>
        </div>
      </div>

      <div class="mat-scroll">
        <div class="bulkbar" v-show="multi">
          <span class="bk-cnt">已选 {{ batchCount }} 项</span>
          <button class="tool" type="button" :disabled="!batchCount || batchBusy" @click="batchFillPics">补预览图</button>
          <button class="tool" type="button" :disabled="!batchCount || batchBusy" @click="batchFillAssets">补角色资产</button>
          <button class="tool" type="button" :disabled="!batchCount || batchBusy" @click="batchFillVoices">AI 定声音</button>
          <input class="ui-inp bk-grp" v-model="batchGroup" maxlength="20" aria-label="批量分组" placeholder="分组名称（留空清除）">
          <button class="ghost" type="button" :disabled="!batchCount || batchBusy" @click="batchSetGroup">应用分组</button>
          <span class="sp"></span>
          <span class="bk-tip" role="status">{{ batchText }}</span>
          <button class="ghost danger" type="button" :disabled="!batchCount || batchBusy" @click="batchRemove">删除</button>
          <div class="bk-gen">
            <span class="bk-gen-l">出图</span><span class="bk-gen-sel" ref="bkImgPickEl"></span>
            <span class="bk-gen-l">声音</span><span class="bk-gen-sel" ref="bkTtsPickEl"></span>
          </div>
        </div>

        <div v-if="failed" class="empty" role="alert">{{ failed }} <button class="ghost mini" type="button" @click="retryLoad">重试</button></div>
        <div v-else-if="!ready" class="empty" role="status"><span class="ui-wait"></span> 加载中…</div>
        <div class="mat-grid" ref="gridEl" v-show="ready && !failed"
          @click="onGridClick" @dragstart="onGridDragStart" @dragend="onGridDragEnd">
          <div v-if="ready && !cards.length" class="empty" v-html="emptyHtml"></div>
          <div v-for="card in cards" :key="card.id" class="card card-surface mcard" draggable="true"
            tabindex="0" role="group" :aria-labelledby="'chars-name-' + card.id"
            @keydown.enter.self="activateCard(card.id)" @keydown.space.self.prevent="activateCard(card.id)"
            :class="{ sel: inspId === card.id, multi: multi, picked: isPicked(card.id) }"
            :data-id="card.id" v-html="card.html"></div>
        </div>
        <div id="gridEnd" ref="gridEndEl" style="height:var(--sp-2)"></div>
        <div class="pager-row" ref="pagerRowEl" :style="{ display: pagerVisible ? '' : 'none' }"></div>
      </div>
    </section>
    <button v-if="inspId" class="mat-scrim mat-insp-scrim" type="button" aria-label="关闭素材信息" @click="inspId = ''"></button>
    <aside class="mat-insp" ref="inspEl" aria-label="素材信息"></aside>
  </div>
  <datalist ref="grpListEl"></datalist>
</div>
