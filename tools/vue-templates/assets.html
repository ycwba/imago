
    <div class="page-main assets-page page-shell" ref="pageEl">
      <!-- ══ 页头 ══
           标题 + **状态三档**（在制 / 失败 / 结果未知：每一档带条数，点一下就筛；
           计数为 0 的那一档不画）+ 找东西 + 换档。
           状态从筛选行提到页头，是这一稿的核心：它不是「第五颗筛选项」，
           是「这批东西现在怎么样」的第一眼事实。 -->
      <header class="as-head">
        <div class="as-head-1">
          <h1 class="page-h1">资产库</h1>
          <div class="as-sum" id="asSum" ref="asSumEl" role="group" aria-label="按任务状态筛选"></div>
        </div>
        <div class="as-head-2">
          <div class="as-head-tools" ref="headToolsEl"></div>
          <span class="sp" style="flex:1"></span>
          <span class="as-head-acts">
            <span class="viewtoggle" id="fView" ref="viewEl" role="group" aria-label="展示样式切换"></span>
            <button class="ghost" id="multiBtn" :class="{ active: multiMode }" title="进入多选：点卡片勾选，可批量下载、存回本机" @click="toggleMulti"><span data-icon="checkBox" data-size="13"></span> 多选</button>
            <button class="ghost" id="reloadBtn" :disabled="reloadDisabled" :title="reloadTitle" @click="reload"><span data-icon="refresh" data-size="13"></span> 刷新</button>
            <button class="ghost" id="cancelAllBtn" ref="cancelAllBtn" title="取消所有排队/生成中的任务" @click="cancelAll"><span data-icon="stop" data-size="13"></span> 取消全部进行中</button>
          </span>
        </div>
      </header>

      <!-- ══ 一行筛选 ══
           类型（带条数）+ 平台 + 时间。
           平台从一个下拉走（平台涨到十几家时，一行十几颗芯片会把整行撑开）；
           时间也是一个下拉（预设），选「自定义区间」时后面才露出起止日期。 -->
      <div class="as-filters">
        <span class="chips" id="asType" ref="asTypeEl" role="group" aria-label="按类型筛选"></span>
        <label class="as-sel"><span>平台</span>
          <select class="ui-inp" id="asProv" ref="asProvEl" aria-label="按平台筛选"></select></label>
        <label class="as-sel"><span>时间</span>
          <select class="ui-inp" id="asTime" ref="asTimeEl" aria-label="按时间筛选">
            <option value="0">全部时间</option>
            <option value="1">今天</option>
            <option value="7">近 7 天</option>
            <option value="30">近 30 天</option>
            <option value="custom">自定义区间</option>
          </select></label>
        <span class="as-range" id="asRange" v-show="timeMode === 'custom'">
          <span class="datepick" @click="openDatePicker('from', $event)">
            <input type="date" id="dFrom" ref="dFromEl" title="起始日期" :value="F.from" @change="onDateChange('from')">
            <span class="dp-face" :class="{ ph: !F.from }" id="dpFromFace">{{ faceFrom }}</span>
          </span>
          <span class="dsep">→</span>
          <span class="datepick" @click="openDatePicker('to', $event)">
            <input type="date" id="dTo" ref="dToEl" title="结束日期" :value="F.to" @change="onDateChange('to')">
            <span class="dp-face" :class="{ ph: !F.to }" id="dpToFace">{{ faceTo }}</span>
          </span>
          <button class="ghost" id="dClear" @click="clearDates">清除日期</button>
        </span>
        <span class="sp" style="flex:1"></span>
      </div>

      <div ref="loadErrEl" id="loadErr"></div>

      <!-- 多选条（与生成工作台同一套公共件）。「存回本机」是**多选才出现**的动作，
           存的是**勾选的那几条**（不是整屏）：不多选就点它，等于「把这一屏都存一遍」。 -->
      <div class="bulkbar" id="bulkBar" v-show="multiMode">
        <span class="bk-cnt" id="bulkCnt">{{ bulkCountText }}</span>
        <button class="ghost" id="bulkAll" :disabled="bulkAllDisabled" @click="bulkAll">{{ bulkAllText }}</button>
        <button class="ghost" id="bulkClear" @click="bulkClear">取消选择</button>
        <button class="ghost" id="bulkDown" :disabled="bulkDownDisabled" @click="bulkDownload"><span data-icon="download" data-size="13"></span> 批量下载</button>
        <button class="ghost" id="bulkFavAdd" :disabled="bulkFavAddDisabled" title="把勾选的那些产物加入「我的收藏」" @click="assetsBulkFavAdd"><span data-icon="star" data-size="13"></span> 收藏</button>
        <button class="ghost" id="bulkFavRemove" :disabled="bulkFavRemoveDisabled" title="把勾选的那些从「我的收藏」里移出" @click="assetsBulkFavRemove"><span data-icon="starFill" data-size="13"></span> 取消收藏</button>
        <button class="ghost" ref="pullLocalBtn" id="pullLocalBtn" title="把勾选的那些产物存回本机（「优先用本机文件」才有东西可用，外链过期也不再是破图）" @click="pullLocalPage"></button>
        <span class="bk-tip" id="bulkTip">{{ bulkTipText }}</span>
        <span class="sp" style="flex:1"></span>
        <button class="ghost" id="multiExit" @click="exitMulti">退出多选</button>
      </div>

      <div v-if="failed" class="empty">{{ failed }} <button class="ghost mini" @click="retryLoad">重新加载本页</button></div>
      <div class="grid" id="grid" ref="gridEl" v-show="!failed"><div class="empty">加载中…</div></div>
      <div id="gridEnd" ref="gridEndEl" style="height:1px"></div>
      <!-- 翻页行在**页底**（收藏 / 素材库 / 工作台同一处）：以前它挤在顶部那条筛选行里，
           一排按钮（多选 / 刷新 / 存回本机 / 取消全部）后面还跟着翻页与跳页，跨页时位置全不一样。 -->
      <div class="assets-pager">
        <span class="pager-row" ref="pagerBtnsEl" v-show="isPageMode && pagerReady"></span>
        <input type="number" id="gotoPage" ref="gotoPageEl" min="1" placeholder="跳页" @keydown.enter="gotoPageInput">
        <button class="ghost" id="gotoBtn" :disabled="gotoBusy" @click="gotoPageInput">{{ gotoBtnText }}</button>
        <span id="cnt" class="info">{{ cntText }}</span>
      </div>
    </div>
