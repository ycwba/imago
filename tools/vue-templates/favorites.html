
    <div class="page-main fav-page page-shell" ref="rootEl">
      <!-- 统一页头（全站唯一一份 .phead）：身份 + 上下文（总数）+ 说明 + 页面级动作。
           筛选与视图切换留在下面那两行 —— 页头放「这页能干什么」，工具条放「怎么看这页」。 -->
      <header class="phead">
        <div class="phead-id">
          <h1 class="phead-h1">我的收藏</h1>
        </div>
        <div class="phead-meta"><span class="phead-chip" v-show="favTotal">{{ favTotal }} 条</span></div>
        <div class="phead-acts">
          <button class="ghost" id="multiBtn" :class="{ active: multiMode }" @click="toggleMulti"><span data-icon="checkBox" data-size="13"></span> 多选</button>
          <button class="ghost" :disabled="uploading" @click="pickFiles" v-html="uploadHtml"></button>
          <input type="file" multiple hidden ref="fileEl" @change="onFiles">
        </div>
      </header>

      <!-- 类型筛选（带条数）：公共件 Wb.kindFilter —— 与生成工作台、资产库同一副分段控件。
           独立一行放在工具条上面：类型档在上、搜索行在下（工作台也是这个次序）。 -->
      <div class="fav-kinds">
        <div class="ui-seg" ref="kindEl" role="group" aria-label="按类型筛选"></div>
      </div>

      <!-- 筛选行：搜索 + AI 找素材（公共件 Wb.filterBar） -->
      <div class="toolbar" ref="toolbarEl"></div>

      <!-- 平台 + 时间（与资产库一样的两种）+ 摆法 -->
      <div class="fav-filters">
        <label class="fav-sel"><span>平台</span>
          <select class="ui-inp" ref="favProvEl" aria-label="按平台筛选"></select></label>
        <label class="fav-sel"><span>时间</span>
          <select class="ui-inp" ref="favTimeEl" aria-label="按收藏时间筛选">
            <option value="0">全部时间</option>
            <option value="1">今天</option>
            <option value="7">近 7 天</option>
            <option value="30">近 30 天</option>
          </select></label>
        <span class="sp" style="flex:1"></span>
        <span class="viewtoggle" ref="viewEl"></span>
        <button class="ghost" ref="pullBtn" @click="pullLocal"></button>
      </div>

      <!-- 多选条：与资产库同一套公共件（.bulkbar）。「移出收藏」这种破坏性动作
           收在这一行里，不在每张卡上喊。 -->
      <div class="bulkbar" id="bulkBar" v-show="multiMode">
        <span class="bk-cnt" id="bulkCnt">{{ bulkCountText }}</span>
        <button class="ghost" id="bulkAll" :disabled="bulkAllDisabled" @click="bulkAll">{{ bulkAllText }}</button>
        <button class="ghost" id="bulkClear" @click="bulkClear">取消选择</button>
        <button class="ghost" id="bulkDown" :disabled="bulkDownDisabled" @click="bulkDownload"><span data-icon="download" data-size="13"></span> 批量下载</button>
        <button class="ghost danger" id="bulkDrop" :disabled="bulkFavRemoveDisabled" @click="bulkDrop"><span data-icon="starFill" data-size="13"></span> 取消收藏</button>
        <span class="bk-tip" id="bulkTip">{{ bulkTipText }}</span>
        <span class="sp" style="flex:1"></span>
        <button class="ghost" id="multiExit" @click="exitMulti">退出多选</button>
      </div>

      <div v-if="failed" class="empty">{{ failed }} <button class="ghost mini" @click="retryLoad">重试</button></div>
      <div v-else-if="!ready" class="empty"><span class="spin-dot"></span> 加载中…</div>
      <div v-else class="grid" ref="grids" :class="'view-' + view">
        <div v-if="!viewItems.length" class="empty">{{ emptyWhy }}</div>
        <!-- 显式分行：紧凑档（网格）里展开的内容要插在**它那一行的下面**，
             格子长高会把同一行别的格子底下留出空洞 —— 网格最怕这种。
             清单档一行一条，不需要分组。 -->
        <template v-for="(row, ri) in rows" :key="'r' + ri">
          <div class="fav-row">
            <div v-for="it in row" :key="it.key" class="card card-surface fav-card" draggable="true" :data-key="it.key"
              :class="{ 'is-open': openKey === it.key }"
              @dragstart="onCardDragStart($event, it)" @dragend="onCardDragEnd($event)">
              <!-- 多选框：与资产库同一件（.pick），勾选后走批量条 -->
              <div v-if="multiMode" class="pick" :class="{ on: favPicked(it) }" role="checkbox" tabindex="0"
                :aria-checked="favPicked(it) ? 'true' : 'false'" aria-label="勾选这条"
                @click.stop="togglePick(it)" @keydown="onPickKey($event, it)"></div>
              <div class="thumb card-shell-media" @click="openLb(it)" v-html="thumbHtml(it)"></div>
              <div class="body card-shell-body">
                <!-- 备注在这一页最要紧（产品自己的 AI 挑素材规则：备注 > 名称 > 类型），
                     所以它在标题**上面**，做成一条带子；没写的留一条虚线空位。 -->
                <div class="note">
                  <textarea :value="it.note || ''" rows="1" @input="onNote(it, $event)" @blur="flushNote(it)" @click.stop
                    placeholder="＋ 写备注"></textarea>
                </div>
                <div class="t" @click="openLb(it)">{{ titleOf(it) }}</div>
                <div class="m">{{ metaOf(it) }}</div>
                <div class="acts card-shell-actions">
                  <button v-if="canReuse(it)" class="ghost" @click.stop="reuse(it)">复用</button>
                  <button class="ghost" :disabled="!!dlBusy[it.key]" @click.stop="download(it)">{{ dlMsg[it.key] || '下载' }}</button>
                  <button class="ghost fav-open" @click.stop="toggleFavDetail(it)">{{ openKey === it.key ? '收起' : '详情' }}</button>
                  <button class="ghost danger fav-drop" @click.stop="dropItem(it)">取消收藏</button>
                </div>
                <!-- 详情就地展开（公共件 .exp）：清单档里那张卡自己长高，
                     紧凑档里它落在下面那条带子上（.band）。 -->
                <div class="exp"><div class="exp-in"><div class="exp-body">
                  <div class="cdet"></div>
                </div></div></div>
              </div>
            </div>
          </div>
          <!-- 紧凑档的展开带子：整行宽，插在它那一行的下面，一根连线指回那个格子 -->
          <div v-if="bandItem(row)" class="band" :data-for="bandItem(row).key">
            <span class="band-tether"></span>
            <div class="band-in">
              <div class="band-hd">
                <span class="t">{{ bandItem(row).prompt || bandItem(row).name }}</span>
                <span class="sp"></span>
                <button class="ghost fav-open" @click.stop="closeDetail">收起</button>
              </div>
              <div class="cdet"></div>
            </div>
          </div>
        </template>
      </div>

      <div id="gridEnd" ref="gridEnd" style="height:1px"></div>
      <div class="pager-row" id="pagerRow" ref="pagerRow" :style="{ display: pagerVisible ? '' : 'none' }"></div>
    </div>
