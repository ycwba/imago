
    <!-- 建模台：整页不滚（页头 + 三栏），与导演台同一副外壳契约。
         三栏里的内容几乎全是命令式渲染（库卡片、视口、对象树、时间线），
         模板只留宿主与页头那几格文字 —— 与工作台/素材库同一种做法：
         动态区域由脚本灌 innerHTML，Vue 不接管它们的子节点。 -->
    <div class="page-main model-page" ref="pageEl">
      <header class="phead">
        <div class="phead-id">
          <h1 class="phead-h1">建模台</h1>
        </div>
        <div class="phead-meta">
          <span class="phead-chip" data-r="mmName">未命名白膜</span>
          <span class="phead-chip" data-r="mmDirty">新建</span>
        </div>
        <span class="phead-sub" data-r="mmSub">一句话生成白膜，调好机位再出图或出片</span>
        <div class="phead-acts">
          <button class="ghost" type="button" data-r="mmSave"><span data-icon="download" data-size="13"></span> 保存</button>
          <button class="ghost" type="button" data-r="mmSaveAs"><span data-icon="box" data-size="13"></span> 另存为</button>
          <button class="ghost" type="button" data-r="mmImport"><span data-icon="upload" data-size="13"></span> 导入</button>
          <button class="ghost" type="button" data-r="mmExport"><span data-icon="download" data-size="13"></span> 导出</button>
        </div>
      </header>

      <div class="mm-layout">
        <!-- 左栏：场景 / 白膜库两页签。栏宽可拖，拖动条由 Wb.split 提供。 -->
        <aside class="mm-rail" data-r="mmRail">
          <div class="mm-rail-tabs" data-r="mmRailTabs" role="tablist" aria-label="左栏"></div>
          <div class="mm-rail-body">
            <div class="mm-pane" data-r="mmScenePane">
              <div class="mm-scenes" data-r="mmScenes"></div>
              <div class="mm-tree-acts" data-r="mmTreeActs" role="toolbar" aria-label="实体操作"></div>
              <div class="mm-tree" data-r="mmTree" role="tree" aria-label="场景实体"></div>
            </div>
            <div class="mm-pane" data-r="mmLibPane" hidden>
              <div class="mm-library-bar" data-r="mmLibraryBar"></div>
              <div class="mm-rail-head">
                <input class="search" data-r="mmSearch" type="search" placeholder="搜模型名…" aria-label="搜模型">
              </div>
              <div class="mm-groups" data-r="mmGroups" role="group" aria-label="模型库"></div>
              <div class="mm-cards" data-r="mmCards"></div>
            </div>
          </div>
          <input type="file" data-r="mmFileJson" accept=".json,application/json" hidden>
          <input type="file" data-r="mmFileModelJson" accept=".json,application/json" hidden>
          <input type="file" data-r="mmFileSceneJson" accept=".json,application/json" hidden>
          <input type="file" data-r="mmFile3d" accept=".fbx,.obj,.glb,.gltf" hidden>
          <input type="file" data-r="mmImgInput" accept="image/*" multiple hidden>
        </aside>

        <!-- 中栏：工具条 + 视口 + 固定出片条 + 底部轨道坞 -->
        <section class="mm-stage">
          <div class="mm-tools" data-r="mmTools" role="toolbar" aria-label="视口工具"></div>
          <div class="mm-viewport" data-r="mmViewport" tabindex="0" aria-label="三维视口"></div>
          <div class="mm-out" data-r="mmOut" hidden></div>
          <div class="mm-dock" data-r="mmDock"></div>
        </section>

        <!-- 右栏：AI / 属性 / 机位三档 -->
        <aside class="mm-side">
          <div class="mm-side-tabs" data-r="mmSideTabs" role="tablist" aria-label="右栏"></div>
          <div class="mm-side-body" data-r="mmSideBody"></div>
        </aside>
      </div>
    </div>
