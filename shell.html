<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>AI 创作工作台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236d5cf5'/%3E%3Ctext x='16' y='22' font-family='system-ui,-apple-system,Segoe UI,sans-serif' font-size='15' font-weight='700' fill='%23fff' text-anchor='middle'%3EAI%3C/text%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('dir_theme')||'light'}catch(e){}</script>
<link rel="stylesheet" href="ui.css">
<style>
  /* 主题变量：各页面在自己 <style> 里各写一份，外壳也要有一份，否则侧栏取不到颜色 */
  :root {
    --bg:#f2f3f9; --panel:#ffffff; --panel2:#f3f4f9; --line:#e4e6f0;
    --txt:#23262f; --sub:#8a8fa3; --acc:#6957e8; --acc2:#8b5cf6; --ok:#16a34a; --warn:#d97706; --err:#dc2626; --pri:#7c5cff; --input:#f6f7fb;
  }
  html[data-theme="dark"] {
    --bg:#0b0d13; --panel:#141722; --panel2:#191d2b; --line:#262b3d;
    --txt:#eef0f6; --sub:#8f97ab; --acc:#6c8cff; --acc2:#a06cff; --ok:#4ade80; --warn:#fbbf24; --err:#ff7a7a; --pri:#7c5cff; --input:#0f1219;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--txt); overflow: hidden; }
  /* 内容区在 iframe 里：切页只换 iframe，侧栏不动、不闪
     （iframe 是替换元素，width:auto 会退回默认 300px，必须显式算宽度） */
  #appFrame { position: fixed; top: 0; left: var(--sbw, 66px); width: calc(100% - var(--sbw, 66px)); height: 100%;
    border: 0; display: block; background: var(--bg); transition: left .18s ease, width .18s ease; }
  html.sb-open #appFrame { left: 200px; width: calc(100% - 200px); }
  /* 窄窗口（≤1100px）里侧栏展开是浮层：sidebar.js 此时不把 --sbw 改成 200px，
     内容区也不让位 —— 小窗本来就窄，再被侧栏吃掉 200px 就更没法用了。 */
  html.sb-narrow.sb-open #appFrame { left: var(--sbw, 66px); width: calc(100% - var(--sbw, 66px)); }
</style>
</head>
<body>
<iframe id="appFrame" name="appFrame" title="工作区"></iframe>
<script>window.__SB_SHELL = true;</script>
<script src="ui.js"></script>
<!-- AI 助手那一层（workbench / drama / ai-chat，约 608 KB）**按需加载**（L2）：
     外壳为了「切页不重建的助手」预先带上了它们，而每个内容页在 iframe 里又把其中几份各加载
     一遍 —— 为一个大多数时候不会打开的功能，首屏白付这 608 KB 的下载与执行。
     真正立刻要用的只有下面这几份：ui.js（公共组件）、ident.js + assetlib.js（侧栏余额与
     注册表都要它）、sidebar.js、app.js。助手那三份在浏览器空闲时再插进来（见下面那段），
     顺序不能变 —— ai-chat.js 要用 Wb / Drama，且它自己会做「公共层没齐就不装」的守卫。 -->
<script src="ident.js"></script>
<script src="assetlib.js"></script>
<script src="sidebar.js"></script>
<script src="app.js"></script>
<script>
/* 空闲时补上 AI 助手那一层。用 requestIdleCallback（带超时兜底）而不是立刻 <script src>：
   首屏的关键路径只剩上面那几份，悬浮球晚几百毫秒出现 —— 而「切页不重建的抽屉、
   球上的未读小圆点、出结果的通知」全都不变（它们本来也要等这几个脚本到位才开始跑，
   而这几百毫秒里既没有任务可看护、也没人点得到球）。不引占位球，就不会多出一套
   和真球不一样的位置/拖动/角标行为。 */
(function () {
  var files = ['workbench.js', 'drama.js', 'ai-chat.js'];
  var started = false;
  function load() {
    if (started) return; started = true;
    files.reduce(function (p, f) {
      return p.then(function () { return new Promise(function (res) {
        var s = document.createElement('script'); s.src = f; s.onload = res; s.onerror = res;
        document.head.appendChild(s);
      }); });
    }, Promise.resolve());
  }
  window.__sbLoadAssistant = load;   // 万一有别的入口要提前拉起它（目前全项目没有调用者）
  if (window.requestIdleCallback) window.requestIdleCallback(load, { timeout: 1200 });
  else setTimeout(load, 400);
})();
</script>
</body>
</html>
