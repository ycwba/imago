<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图片工作台 · 拾帧</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem('dir_theme')||'light'}catch(e){}</script>
<link rel="stylesheet" href="ui.css">
<style>
  :root {
    --bg:#f2f3f9; --panel:#ffffff; --panel2:#f3f4f9; --line:#e4e6f0;
    --txt:#23262f; --sub:#8a8fa3; --acc:#6957e8; --acc2:#8b5cf6; --ok:#16a34a; --err:#dc2626; --pri:#7c5cff; --input:#f6f7fb;
  }
  html[data-theme="dark"] {
    --bg:#0b0d13; --panel:#141722; --panel2:#191d2b; --line:#262b3d;
    --txt:#eef0f6; --sub:#8f97ab; --acc:#6c8cff; --acc2:#a06cff; --ok:#4ade80; --err:#ff7a7a; --input:#0f1219;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(900px 500px at 85% -5%, rgba(108,140,255,.14), transparent 60%),
      radial-gradient(700px 500px at -10% 100%, rgba(160,108,255,.10), transparent 60%),
      var(--bg);
    color: var(--txt); min-height: 100vh;
  }
  header {
    position: sticky; top: 0; z-index: 5; backdrop-filter: blur(12px);
    background: var(--panel); border-bottom: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between;
    padding: 13px 28px;
  }
  .logo { font-size: 17px; font-weight: 700; letter-spacing: .4px; }
  .logo em { font-style: normal; background: linear-gradient(90deg, var(--acc), var(--acc2));
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  .refresh { width: 22px; height: 22px; padding: 0; border: 0; border-radius: 50%;
    background: transparent; color: var(--sub); font-size: 13px; cursor: pointer;
    transition: transform .5s, color .15s; line-height: 22px; }
  .refresh:hover { color: var(--acc); }
  .refresh.spin { animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* 两栏布局（.layout / .col-left / .col-right #result / 滚动条）在 ui.css 的
     「工作台共用布局」里统一定义：三页必须同宽，不要在这里再抄一份。 */
  /* 更窄的窗口：收紧留白、缩小磁贴与缩略图，卡片动作换行更好点
     （.btn-row / .tool 的窄屏收敛在 ui.css 里，三台一起） */
  @media (max-width: 720px) {
    textarea { min-height: 118px; font-size: 13.5px; }
    .mat { width: 54px; height: 54px; }
    .thumb { width: 56px; height: 56px; }
    .pinl { padding: 8px; }
    .pinl-ft { gap: 6px; }
    .task .acts { gap: 6px; }
    .task .acts .ghost { padding: 5px 9px; font-size: 11.5px; }
  }

  /* ---- 左栏 ---- */
  .prompt-box {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 6px 6px 0; transition: border-color .15s;
  }
  .prompt-box.over { border-color: var(--acc); }
  textarea {
    width: 100%; min-height: 150px; padding: 12px; background: transparent; color: var(--txt);
    border: 0; border-radius: 8px; font-size: 14px; font-family: inherit; outline: none; resize: vertical;
  }
  textarea::placeholder { color: var(--sub); }
  /* .btn-row / .tool 动作磁贴行统一在 ui.css（三台同款同尺寸） */
  /* 参考图缩略图：上传几张就显示几张（.thumbs:empty 时整行不占位） */
  .thumbs-cap { font-size: 11px; color: var(--sub); padding: 0 6px 6px; }
  .thumbs-cap:empty { display: none; }
  .thumbs { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 6px 10px; }
  .thumbs:empty { display: none; }
  .thumb { position: relative; width: 64px; height: 64px; border-radius: 6px; overflow: hidden;
    border: 1px solid var(--line); cursor: grab; transition: transform .12s, border-color .12s; background: var(--panel2); }
  .thumb:hover { border-color: var(--acc); transform: translateY(-2px); }
  .thumb.dragging { opacity: .35; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
  /* 缩略图读不出来（地址过期 / 文件损坏）：给个明确占位，别让用户以为没上传 */
  .thumb.broken img { display: none; }
  .thumb.broken::after { content: '读不到预览'; position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: center; font-size: 9.5px; color: var(--err); background: rgba(220,38,38,.08); }
  .thumb .rank { position: absolute; left: 3px; top: 3px; padding: 0 5px; border-radius: 4px;
    background: rgba(0,0,0,.7); color: #fff; font-size: 10px; line-height: 15px; }
  .thumb .taglib { position: absolute; left: 3px; bottom: 3px; font-size: 9px; padding: 1px 4px;
    border-radius: 3px; background: rgba(0,0,0,.62); color: #fff; }
  .thumb button { position: absolute; top: 2px; right: 2px; width: 16px; height: 16px; padding: 0;
    border: 0; border-radius: 50%; background: rgba(0,0,0,.65); color: #fff; font-size: 10px;
    line-height: 16px; cursor: pointer; }

  .adv { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; margin-top: 16px; }
  .adv-head { display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px; cursor: pointer; user-select: none; }
  .adv-head h2 { font-size: 13.5px; font-weight: 600; }
  .adv-head .sum { font-size: 12px; color: var(--sub); display: flex; align-items: center; gap: 6px; }
  .adv-head .chev { transition: transform .2s; color: var(--sub); font-size: 11px; }
  .adv.closed .chev { transform: rotate(-90deg); }
  .adv.closed .adv-body { display: none; }
  .adv-body { padding: 4px 16px 16px; border-top: 1px solid var(--line); }
  label { display: block; font-size: 12px; color: var(--sub); margin: 12px 0 5px; }
  select, input {
    width: 100%; padding: 9px 11px; background: var(--input); color: var(--txt);
    border: 1px solid var(--line); border-radius: 6px; font-size: 13.5px; font-family: inherit; outline: none;
    transition: border-color .15s, background .15s;
  }
  select:focus, input:focus { border-color: var(--acc); }
  select {
    appearance: none; -webkit-appearance: none; cursor: pointer;
    background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%238f97ab' stroke-width='1.6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E");
    background-repeat: no-repeat; background-position: right 11px center; padding-right: 28px;
  }
  select:hover { border-color: var(--acc); background-color: var(--panel2); }
  select option { background: var(--panel2); color: var(--txt); }
  /* 自定义下拉 */
  .dd { position: relative; }
  .dd select { display: none; }
  .dd-btn {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    width: 100%; padding: 9px 11px; background: var(--input); color: var(--txt);
    border: 1px solid var(--line); border-radius: 6px; font-size: 13.5px;
    cursor: pointer; transition: border-color .15s, background .15s; user-select: none;
  }
  .dd-btn:hover { border-color: var(--acc); background-color: var(--panel2); }
  .dd.open .dd-btn { border-color: var(--acc); }
  .dd-btn .arw { transition: transform .18s; flex: 0 0 auto; }
  .dd.open .dd-btn .arw { transform: rotate(180deg); }
  .dd-btn .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dd-list {
    position: absolute; left: 0; right: 0; top: calc(100% + 6px); z-index: 40;
    background: var(--panel2); border: 1px solid var(--line); border-radius: 6px;
    box-shadow: 0 12px 32px rgba(0,0,0,.5); padding: 5px; max-height: 264px; overflow-y: auto;
    opacity: 0; transform: translateY(-4px) scale(.98); pointer-events: none;
    transition: opacity .14s, transform .14s;
  }
  .dd.open .dd-list { opacity: 1; transform: none; pointer-events: auto; }
  .dd-opt {
    display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 5px;
    font-size: 13px; color: var(--txt); cursor: pointer; transition: background .12s;
  }
  .dd-opt:hover { background: rgba(108,140,255,.12); }
  .dd-opt .chk { visibility: hidden; color: var(--acc); font-size: 12px; }
  .dd-opt.sel { color: var(--acc); background: rgba(108,140,255,.08); }
  .dd-opt.sel .chk { visibility: visible; }
  .sel-hint { font-size: 11px; color: var(--sub); margin-top: 4px; min-height: 14px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .costbar { display: flex; justify-content: space-between; align-items: center; margin-top: 16px;
    padding: 10px 13px; background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; font-size: 12.5px; }
  .costbar b { color: var(--acc); font-size: 15px; }
  .costbar .note { color: var(--sub); font-size: 11.5px; }

  /* 生成按钮、#status、#goWhy 的样式在 ui.css 的「工作台共用布局」里（三页一份），这里不再抄 */
  .err { color: var(--err); }
  .ok { color: var(--ok); }

  /* ---- 右栏：任务列表 ----
     .tasks-head / .tab / .sp / .pginfo / .pgroup 全部用 ui.css 的那一份（三个工作台共用一套）；
     以前这里又抄了一遍还改了数值，导致本页的表头间距、页码宽度、搜索框尺寸和另外两页不一致。 */
  .task {
    display: flex; gap: 13px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; padding: 12px; margin-bottom: 12px; animation: pop .3s ease both;
  }
  @keyframes pop { from { opacity: 0; transform: translateY(6px); } }
  .task .tmedia { display: flex; gap: 6px; flex: 0 0 auto; align-self: flex-start; }
  .task .timg { width: 128px; height: 96px; border-radius: 6px; overflow: hidden;
    background: var(--panel2); cursor: zoom-in; display: flex; flex-direction: column;
    align-items: center; justify-content: center; color: var(--sub); font-size: 11px; }
  .task .timg img { width: 100%; height: 100%; object-fit: cover; }
  /* 参考图横向层叠：参考图2 藏在参考图1 后面（右移、缩小），整组往下移一点 */
  .task .trefs { position: relative; width: 78px; height: 96px; align-self: flex-start; }
  .task .trefs img { position: absolute; width: 46px; height: 46px; object-fit: cover; border-radius: 5px;
    border: 1px solid var(--line); cursor: zoom-in; top: 26px; }
  .task .trefs img:nth-of-type(1) { left: 0; }
  .task .trefs img:nth-of-type(2) { left: 16px; transform: scale(.92); transform-origin: top left; }
  .task .trefs img:nth-of-type(3) { left: 32px; transform: scale(.84); transform-origin: top left; }
  .task .trefs img:hover { z-index: 30 !important; border-color: var(--acc); }
  .task .trefs img { width: 46px; height: 46px; object-fit: cover; border-radius: 5px;
    border: 1px solid var(--line); cursor: zoom-in; }
  .task .trefs img:hover { border-color: var(--acc); }
  .task .trefs .more { font-size: 10px; color: var(--sub); text-align: center; line-height: 14px; }
  .task .tmain { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .task .meta1 { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--sub); }
  .task .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); display: inline-block; }
  .task .dot.run { background: #fbbf24; animation: blink 1.2s infinite; }
  .task .dot.fail { background: var(--err); }
  @keyframes blink { 50% { opacity: .3; } }
  .spin-dot { width: 18px; height: 18px; border: 2px solid var(--line); border-top-color: var(--acc);
    border-radius: 50%; animation: rot .8s linear infinite; display: inline-block; margin-bottom: 4px; }
  @keyframes rot { to { transform: rotate(360deg); } }
  .task .date { margin-left: auto; }
  .task .tprompt { font-size: 13px; line-height: 1.5; margin: 5px 0; color: var(--txt);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .task .meta2 { font-size: 12px; color: var(--sub); }
  .task .tprompt { cursor: pointer; }
  .task .tprompt:hover { color: var(--acc); }
  .task .acts { margin-top: auto; display: flex; gap: 8px; justify-content: flex-end; }
  .task .acts .ghost { padding: 4px 12px; }
  .empty { color: var(--sub); font-size: 13px; text-align: center; padding: 70px 0; }

      /* 详情展开：中性描边（与视频工作台/资产库同一套观感，不带强调色） */
  .tdetail { margin-top: 10px; }
  .tdetail .det-row { font-size: 12.5px; padding: 3px 0; }
  .tdetail .det-k { margin-top: 10px; }
  .tdetail .det-prompt { max-height: 160px; }
  .task.open .tdetail { display: block; }
      
  .lib-tip { font-size: 12px; color: var(--sub); line-height: 1.6; margin-bottom: 12px; }
  .det-row { display: flex; gap: 12px; font-size: 13px; padding: 4px 0; }
  .det-row .k { color: var(--sub); flex: 0 0 52px; }
  .det-k { font-size: 12px; color: var(--sub); margin: 12px 0 6px; letter-spacing: .5px;
    display: flex; align-items: center; gap: 8px; }
  .det-k .mini { font-size: 11px; padding: 2px 10px; border-radius: 4px; }
  .det-prompt { font-size: 13px; line-height: 1.7; background: var(--panel); border: 1px solid var(--line);
    border-radius: 6px; padding: 10px 12px; max-height: 200px; overflow-y: auto; word-break: break-all; }
  .det-refs { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 8px; }
  .det-refs img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 5px;
    border: 1px solid var(--line); cursor: zoom-in; }
  .det-ids { display: flex; flex-direction: column; gap: 4px; }
  .did { font-family: monospace; font-size: 11.5px; word-break: break-all; cursor: pointer; color: var(--sub); }
  .did:hover { color: var(--acc); }
  .ref .rid { font-size: 10.5px; margin-top: 3px; text-align: center; }
  .ver { font-size: 10.5px; color: var(--sub); opacity: .6; text-align: center; padding: 6px 0 18px; }
  /* 灯箱等公共组件样式统一来自 ui.css */
</style>
<script src="ui.js"></script>
<script src="workbench.js"></script>
<script src="assetlib.js"></script>
<script src="sidebar.js"></script>
</head>
<body class="wb2">
<div class="page-main">
<div class="layout">
  <!-- 左栏 -->
  <div class="col-left">
    <div class="prompt-box" id="promptBox">
      <textarea id="prompt" placeholder="描述人物、动作、场景或感觉…"></textarea>
      <div class="btn-row">
        <!-- 动作行：AI 润色 / 选参考图（统一选择器：资产库 · 收藏 · 本地上传）靠左，一键清空顶到行尾 -->
        <button class="tool acc" id="polishBtn" title="调用文字AI改写提示词（密钥在「设置」配置）"><span class="ic" data-icon="sparkles" data-size="14"></span>AI 润色</button>
        <button class="tool" id="libBtn" title="从资产库 / 收藏 / 本地文件里挑参考图（张数上限按模型能力动态取）"><span class="ic" data-icon="box" data-size="14"></span>选参考图</button>
        <span class="sp"></span>
        <button class="tool danger" id="clearRefs" title="清空提示词与已选参考图"><span class="ic" data-icon="trash" data-size="14"></span>一键清空</button>
      </div>
      <div id="polishInline" hidden></div>
      <div class="hint" id="refHint" style="display:none;font-size:11.5px;color:var(--sub);margin-top:6px"></div>
      <div class="thumbs-cap" id="thumbsCap"></div>
      <div class="thumbs" id="thumbs"></div>
      <!-- 密钥不在页面里展示：在「设置」页填写（或由服务端 .env 注入） -->
    </div>

    <div class="adv" id="adv">
      <div class="adv-head" id="advHead">
        <h2><span data-icon="gear" data-size="14"></span> 高级设置</h2>
        <span class="sum"><span id="advSum">standard · 1:1</span><span class="chev">▼</span></span>
      </div>
      <div class="adv-body">
      <div class="adv-grid">
        <div>
          <label>模型</label>
          <!-- 模型一律来自注册表/能力接口（见 updateModelOptions），这里不写兜底选项：
               上游新增或改名一个图片模型，不用再回来改页面 -->
          <select id="model"></select>
        </div>
        <div id="qualityWrap">
          <label>质量</label>
          <select id="quality">
            <option value="draft">draft · 1积分/张</option>
            <option value="standard" selected>standard · 2积分/张</option>
            <option value="final">final · 5积分/张</option>
          </select>
        </div>
      </div>
      <div class="adv-grid" style="margin-top:10px">
          <div id="ratioWrap">
            <label>画面比例</label>
            <select id="ratio">
              <option value="1:1">方形 1:1</option>
              <option value="16:9" selected>横屏 16:9</option>
              <option value="9:16">竖屏 9:16</option>
              <option value="4:3">横版 4:3</option>
              <option value="3:4">竖版 3:4</option>
              <option value="3:2">横版 3:2</option>
              <option value="2:3">竖版 2:3</option>
              <option value="21:9">超宽 21:9</option>
              <option value="4:5">竖版 4:5</option>
            </select>
            <div class="sel-hint" id="ratioHint"></div>
          </div>
        <div id="countWrap">
          <!-- 这里的选项只是首次渲染前的占位：页面启动后由能力接口给的上限重画（见 updateParamOptions / modelLimits） -->
          <label id="countLabel">数量</label>
          <select id="count">
            <option value="1" selected>1 张</option>
            <option value="2">2 张</option>
            <option value="3">3 张</option>
            <option value="4">4 张</option>
          </select>
        </div>
          <div id="formatWrap">
            <label>格式</label>
            <select id="format">
              <option value="png">png</option>
              <option value="jpeg">jpeg</option>
              <option value="webp">webp</option>
            </select>
          </div>
        </div>
        <div class="costbar">
          <span>预计 <b id="cost">2</b> 积分 <span class="note" id="costNote"></span></span>
          <span class="note" id="mode">文生图</span>
        </div>
        <button class="go" id="go">生成图片</button>
        <div class="hint" id="goWhy"></div>
        <div id="status"></div>
      </div>
    </div>
  </div>

  <!-- 右栏 -->
  <div class="col-right">
    <div class="tasks-head">
      <span class="tab">我的任务</span>
      <span class="sp"></span>
      <span class="pgroup">
        <input id="searchBox" placeholder="搜索提示词 / ID" autocomplete="off" spellcheck="false">
        <button class="ghost" id="searchBtn">搜索</button>
        <span class="pgsep"></span>
        <button class="ghost" id="pgPrev">‹ 上一页</button>
        <span class="pginfo" id="pgInfo">第 1 页</span>
        <button class="ghost" id="pgNext">下一页 ›</button>
        <input type="number" id="gotoPage" min="1" placeholder="跳页">
        <button class="ghost" id="gotoBtn" title="跳转到指定页">跳转</button>
        <!-- 刷新和翻页是一组动作（都只影响这一屏列表），放同一个组里才不会因为换行被拆成两行 -->
        <button class="ghost" id="sync" title="重新从平台取回这一屏列表"><span data-icon="refresh" data-size="13"></span> 刷新</button>
      </span>
    </div>
    <div id="result"></div>
  </div>
</div>
<!-- 灯箱 DOM 由 workbench.js 的 Wb.lightbox 创建（结构全站一份）-->
<div class="ver">v8 · 原生接口 · 经本地代理 · 最新任务置顶 · 详情含参考图</div>

<script>
'use strict';
const $ = id => document.getElementById(id);

/* ============ 配置 ============ */
const PRICE = { draft: 1, standard: 2, final: 5 };
const RATIO_HINT = {
  '1:1':  ['方形 · 头像、图标', ''],
  '16:9': ['宽屏横版 · 视频封面、桌面壁纸', 'land'],
  '9:16': ['竖屏手机 · 短视频、手机壁纸', 'port'],
  '4:3':  ['横版 · 传统照片', 'land'],
  '3:4':  ['竖版 · 人像照片', 'port'],
  '3:2':  ['横版照片 · 相机常用比例', 'land'],
  '2:3':  ['竖版海报 · 印刷常用', 'port'],
  '21:9': ['超宽电影 · 影院级画面', 'land'],
  '4:5':  ['竖版社交 · 小红书/Instagram', 'port'],
  '5:4':  ['横版 · 大画幅', 'land'],
  '2:1':  ['宽幅 · 全景', 'land'],
  '1:2':  ['竖幅 · 手机长图', 'port'],
  '1:3':  ['细长竖幅 · 手机长图', 'port'],
  '3:1':  ['超宽横幅 · 长图/展板', 'land'],
};
const QUALITY_ZH = AiGen.QUALITY_ZH;   // 画质档位中文名只在 assetlib.js 的 AiGen 里有一份
/* 提交/查余额前的密钥检查：键名按当前图片平台的 keyId 现取（Api.key 认 registry 里声明的别名），
   不再写死 sk_key_sparkcine；页面没填密钥时还要问一次代理有没有环境变量（/env-status）。 */
async function ensureImgKey() {
  const p = await imgProvider();
  if (!p) throw new Error('注册路由里没有图片生成平台（kind:"image"）');
  if (Api.key(p) || (await TextAI.envHas(p))) return p;
  throw new Error('未配置 ' + (p.displayName || p.name || '图片') + ' 密钥：请到「设置」页填写，或由服务端 .env 注入');
}

/* ============ API（统一走注册路由）============
   端点、分页参数名、创建请求体全部读 /registry 的声明（proxy.js 的 REGISTRY），
   页面里的调用写法保持不变（/generations、/generations/{id}、/wallet），
   下面只把它们解析到「该平台声明的端点」——换/加平台不用改这个文件。 */
/* 平台解析：Api 尚未拿到注册表时，这里会顺手拉一次 /registry（有缓存，只拉一次） */
async function imgProvider() {
  if (!window.Api) throw new Error('统一接口层未加载（assetlib.js）');
  await Api.registry();
  return Api.prov('image');
}
/* 本工作台对应的平台对象（registry 里 kind:'image' 的那家；没加载到注册表时返回 null） */
function imgProvObj() { return (window.Api && Api.prov('image')) || null; }
/* 这条任务算不算图片台的：SparkCine 的图和视频**共用一个列表接口**，得挑出图片那部分。
   判定按 registry 的 list.media 声明走（前缀、fallback 都在那里）——
   以前这里写死 g.model.startsWith('img-')：上游新增/改名一个图片模型，历史任务就被整批滤没了。 */
function isImageTask(g) {
  const p = imgProvObj();
  return p ? AssetLib.mediaOf(p, g) === '图片' : true;
}
/* 这条任务属于哪个平台对象（详情 / 取消 / 提示词归档都按它找接口，不要再写死某一家） */
function itemProv(g) {
  const p = imgProvObj();
  if (!p) return null;
  const media = AssetLib.mediaOf(p, g);
  return Api.prov((p.mediaProviders && p.mediaProviders[media]) || p.id) || p;
}
/* 当前所选模型属于哪家平台（模型下拉可能列出多家图片平台）；没选到就返回 null，由调用方退回默认 */
function modelProv() {
  const id = ($('model') || {}).value;
  const cur = imgModels().find(x => x.m.id === id);
  return (cur && cur.p) || null;
}
/* 原生请求体 → 标准字段（交给 Api.createBody 按声明重新拼） */
function toStandardFields(body) {
  const p = body.parameters || {};
  return {
    model: body.model, prompt: body.prompt, tier: body.tier,
    duration: p.duration ?? body.duration,
    res: p.resolution ?? body.resolution,
    ar: p.aspect_ratio ?? body.aspect_ratio,
    quality: p.quality ?? body.quality,
    count: p.output_count ?? body.output_count,
    format: p.output_format ?? body.output_format,
    inputs: body.inputs,
  };
}
async function api(path, opts = {}) {
  const prov = await imgProvider();
  if (!prov) throw new Error('注册路由里没有图片生成平台（kind:"image"）');
  const spec = prov.list || {};
  const method = (opts.method || 'GET').toUpperCase();
  const [p, qs] = String(path).split('?');
  const q = new URLSearchParams(qs || '');
  if (p === '/generations' && method === 'GET') {
    // 参数名按声明映射（例如 limit / cursor，不再是写死的 query 名）
    const query = new URLSearchParams();
    const map = { limit: spec.limitParam || 'limit', cursor: spec.cursorParam || 'cursor' };
    q.forEach((v, k) => query.set(map[k] || k, v));
    return Api.request(prov, 'list', { query });
  }
  if (/^\/generations\/[^/]+$/.test(p) && method === 'GET') {
    const id = p.slice('/generations/'.length);
    /* 声明了 pollVia:'list' 的平台（详情端点是 404 空壳）退回列表按任务号找 —— Api.pollTask 里已经
       写好这套（含游标翻页、认 list.map），不要在这里再按 endpoints 猜一次（AGENTS.md：只用统一入口）。 */
    if (String(prov.pollVia || '') === 'list') return (await Api.pollTask(prov, id)).raw;
    return Api.request(prov, (prov.endpoints && prov.endpoints.detail) ? 'detail' : 'poll',
      { id, method: 'GET' });
  }
  if (p === '/generations' && method === 'POST') {
    /* 用**所选模型自己那家**平台建任务：模型下拉按 optgroup 列出了所有图片平台，
       只取「registry 里第一个 kind:image」会在接入第二家时把请求发错家（密钥、字段名都不一样）。 */
    const body = toStandardFields(JSON.parse(opts.body));
    const mp = modelProv() || prov;
    // headers 必须透传（尤其 Idempotency-Key）：漏了它上游直接 400，而且只回一句模糊提示
    return Api.request(mp, (mp.create && mp.create.endpoint) || 'create',
      { method: 'POST', headers: opts.headers, body: Api.createBody(mp, body), log: opts.log });
  }
  if (p === '/wallet' && method === 'GET') {
    return Api.request(prov, 'credits');
  }
  throw new Error('未在注册路由里声明的接口：' + path + '（请检查 proxy.js 的 REGISTRY）');
}

// 让元素可拖拽到左侧输入栏（拖动携带资产 ID）

function addFiles(list) {

/* 参考图上限：优先用所选模型的能力声明（上游 /models 的 reference_image.max） */
/* 当前选中的图片模型（按 id 在完整平台列表里找，不受「有参考图时只列支持参考图的模型」影响） */
function currentImgModel() {
  const id = $('model').value;
  for (const p of (REG?.providers || []).filter(x => x.kind === 'image')) {
    for (const m of (p.models || [])) if (m.id === id) return { p, m };

/* 这个模型收不收参考图（= 能力声明里有没有 reference_image 这个输入 role） */
function refSupported(m) {

  if (!cur) return false;
  if (!window.Capabilities) return true;                    // 没有能力层时不拦（退回老行为）
  return Capabilities.specs(cur).some(sp => sp.role === 'reference_image');

/* 参考图入口随模型能力显隐：模型不支持参考图时，「选参考图」入口直接消失，

/* 加参考图之前统一问一句：不支持就明确拒绝（上传按钮被隐藏了，拖放/程序调用也走这里） */
function canAddRef() {
  if (refSupported()) return true;
  setStatus('<span class="err">当前模型不支持参考图：换一个支持它的模型，或清空参考图</span>');
  return false;
}
/* 当前模型对象（模型下拉里选中的那个） */
function curModelObj() {
  return (imgModels().find(x => x.m.id === $('model').value) || imgModels()[0] || {}).m || null;
}
/* ---------- 生成上限与默认值：唯一来源是「当前模型的能力声明」 ----------
   能力接口（/models 的 allowedValues / maximum / default）优先，registry 声明兜底；
   每次能力刷新都会重算并重画（refreshCapsForCurrentModel → updateParamOptions），
   所以平台改了上限/默认值，界面立刻跟着变 —— 页面里不写死任何数量。
     maxOut  单次请求最多出几张（output_count.maximum；未声明按 1）
     maxRef  参考图最多几张（reference_image 槽位声明的 max：能力接口的 modes.inputs 优先，
             registry 的 inputRoles 兜底；两者都没声明就是 0 = 这个模型没有参考图入口，
             绝不退回「猜一个数」——以前猜 8、导演台猜 9，和平台真实上限对不上）
     defs    平台声明的参数默认值（画质 / 比例 / 格式 / 张数） */
function modelLimits(m) {
  const o = (m && m.options) || {};
  const maxOut = Number(o.max_outputs) > 0 ? Math.max(1, Math.floor(Number(o.max_outputs))) : 1;
  const maxRef = (window.Capabilities && m && m.id) ? Math.max(0, Capabilities.rule(m, 'reference_image').max) : 0;
  return { maxOut, maxRef, defs: o.defaults || {} };
}
function maxRefOf() { return modelLimits(curModelObj()).maxRef; }
/* 选参考图：同平台资产直接带 asset_id（无需重新上传），收藏与本地文件也在这一个弹窗里 */
$('libBtn').onclick = async () => {
  if (!canAddRef()) return;
  const room = Math.max(0, maxRefOf() - picked.length);
  if (!room) { setStatus('<span class="err">参考图已达上限 ' + maxRefOf() + ' 张</span>'); return; }
  const list = await AssetPicker.open({ types: ['图片'], multiple: true, limit: room, title: '选择参考图' });
  if (!list.length) return;
  let local = 0;
  for (const e of list) {
    if (picked.length >= maxRefOf()) break;
    /* 选择器顶部「本地上传」档位挑的文件：本体就在 e.file 上，和拖进输入框的文件走同一条路径
       （放在去重判断之前：本地条目没有 assetId，跟去重条件撞在一起会只加进第一张） */
    if (e.file) { addFiles([e.file]); local++; continue; }
    if (picked.some(x => x.assetId === e.assetId)) continue;
    const item = { assetId: e.assetId, url: e.src, name: (e.prompt || '').slice(0, 14) || '资产', fromLib: true };
    /* 远端签名地址会过期、非本平台 id（本地资产 la_* / 别家平台）不能直接当 asset_id：
       这两种都先取回字节存成本地文件，缩略图与提交都稳 */
    const usableId = window.AssetTransfer && AssetTransfer.isPlatformId(e.assetId);
    if (!usableId || !/^\/asset\//.test(String(e.src || ''))) {
      try {
        const blob = await AssetTransfer.blobOf(e.dl || e.src);
        const f = new File([blob], (item.name || 'ref') + '.png', { type: blob.type || 'image/png' });
        item.file = f; item.url = URL.createObjectURL(f); delete item.assetId; item.fromLib = !e.fromLocal; local++;
      } catch {}
    }
    picked.push(item);
  }
  renderThumbs(); updateMode();
  setStatus('<span class="ok">✓ 已加入 ' + list.length + ' 张参考图' + (local ? '（' + local + ' 张取自本地/外链，已落到本机，缩略图与提交更稳）' : '（直接引用 asset_id，无需上传）') + '</span>');
};
function renderThumbs() {
  const t = $('thumbs');
  const cap = $('thumbsCap');
  if (cap) cap.textContent = picked.length ? `参考图 ×${picked.length}（点缩略图看大图，× 移除）` : '';
  t.innerHTML = '';
  picked.forEach((p, i) => {
    const d = document.createElement('div');
    d.className = 'thumb';
    d.draggable = true;
    d.innerHTML = `${Wb.thumbs.mediaHTML(Api.mediaSrc(p.url), { type: 'image', mediaAttrs: 'onerror="this.parentElement.classList.add(\'broken\')"' })}<span class="rank">${i + 1}</span><button>×</button>${p.fromLib ? '<span class="taglib">资产库</span>' : ''}`;
    // 缩略图接全站共用缓存：命中直接用缓存小图，没命中按原图显示并顺手缩一份（见 Wb.thumbs）
    { const im = d.querySelector('img'); if (im) Wb.thumbs.bind(d, im, Api.mediaSrc(p.url)); }
    d.title = (p.fromLib ? '来自资产库' : '本地上传') + (p.name ? '：' + p.name : '') + ' · 点击查看大图，拖到右侧可调顺序';
    // 注意：缩略图 img 上有 pointer-events:none，点击事件要绑在容器上（排除 × 按钮）
    d.onclick = e => {
      if (e.target.tagName === 'BUTTON') return;
      openPickedViewer(i);
    };
    d.querySelector('button').onclick = e => { e.stopPropagation(); picked.splice(i, 1); renderThumbs(); updateMode(); };
    d.ondragstart = () => { dragIdx = i; d.classList.add('dragging'); };
    d.ondragend = () => { d.classList.remove('dragging'); dragIdx = -1; renderThumbs(); };
    d.ondragover = e => e.preventDefault();
    d.ondrop = e => {
      e.preventDefault();
      if (dragIdx < 0 || dragIdx === i) return;
      const [m] = picked.splice(dragIdx, 1);
      picked.splice(i, 0, m);
      renderThumbs();
    };
    t.appendChild(d);
  });
}

/* ============ 设置 / 费用 ============ */
function updateCost() {
  const n = Math.max(1, Math.floor(Number($('count').value) || 1));
  const m = imgModels().find(x => x.m.id === $('model').value);
  const unit = m?.m?.price?.[$('quality').value] ?? PRICE[$('quality').value] ?? 2;
  $('cost').textContent = unit * n;
  $('costNote').textContent = `（${unit}/张 × ${n} 张）`;

/* 图片模型列表：按「这次需要的输入 role」过滤（参考图 = reference_image）。
   以前按 mode 名（image_edit / text_to_image）过滤，上游换个名字就会筛空。 */
function imgModels() {
  const need = picked.length ? ['reference_image'] : [];
  const provs = (REG?.providers || []).filter(p => p.kind === 'image');
  const groups = (window.Capabilities && Capabilities.modelsFor) ? Capabilities.modelsFor(provs, need) : null;
  if (groups) { const out = []; groups.forEach(g => g.models.forEach(m => out.push({ p: g.p, m }))); return out; }
  return provs.flatMap(p => (p.models || []).map(m => ({ p, m })));
}
/* 就绪判定：提示词 / 有没有模型 / 当前模型支不支持已选的参考图 —— 生成按钮据此禁用并说明 */
function submitBlockReason() {
  if (!$('prompt').value.trim()) return '请输入提示词';
  const models = imgModels();
  if (!models.length) return picked.length ? '没有支持参考图的模型：清空参考图或换个平台' : '没有可用的图片模型';
  if (!picked.length) return '';
  const ok = refSupported();
  return ok ? '' : '当前模型不支持参考图：换一个支持它的模型，或清空参考图';
}
/* 就绪状态交给公共实现（workbench.js 的 Wb.ready）：按钮禁用与悬停说明一直在，
   按钮下方那行原因等用户在左栏真动过手才显示，不要一打开页面就刷屏。 */
function updateGoState() {

}
function updateMode() { $('mode').textContent = picked.length ? `参考图 ×${picked.length}` : '文生图'; updateModelOptions(); updateGoState(); }

/* ---------- 复用（来自资产库的「复用」入口）----------
   读 localStorage.sk_reuse：把提示词与素材填进来；素材是图片就加进参考图。
   若当前模型不支持参考图，imgModels() 会自动只列出支持 image_edit 的模型并切换过去。 */
async function applyReuseFromAssets() {
  let p2 = null;
  try { p2 = JSON.parse(localStorage.getItem('sk_reuse') || 'null'); } catch {}
  if (!p2 || !p2.assetId && !p2.prompt) return;
  localStorage.removeItem('sk_reuse');
  if (p2.prompt) { $('prompt').value = p2.prompt; $('prompt').dispatchEvent(new Event('input')); }
  if (p2.kind !== 'image') {
    setStatus('<span class="err">这条「' + (p2.kind === 'video' ? '视频' : '音频') + '」素材不能在图片工作台用参考，已只填入提示词；如需参考视频/音频请用「视频工作台」</span>');
    return;
  }
  if (!p2.assetId) { setStatus('<span class="ok">✓ 已复用提示词</span>'); return; }
  try {
    const blob = await Net.blob('/asset/' + p2.assetId + '?dl=1&v=2&name=reuse-' + String(p2.assetId).slice(0, 6) + '.png', { timeout: 60000 });
    const file = new File([blob], 'reuse-' + String(p2.assetId).slice(0, 6) + '.png', { type: blob.type || 'image/png' });
    const before = $('model') ? $('model').value : '';
    picked.push({ file, url: URL.createObjectURL(file) });
    renderThumbs();
    updateMode();                 // 有参考图后会切到支持 image_edit 的模型
    const after = $('model') ? $('model').value : '';
    setStatus('<span class="ok">✓ 已复用：提示词' + (before && after && before !== after
      ? ' + 参考图（原模型不支持参考图，已自动切到 ' + after + '）'
      : ' + 参考图 ×' + picked.length) + '</span>');
  } catch (e) {
    setStatus('<span class="err">复用素材失败：' + e.message + '</span>');
  }
}

let REG = null;
async function loadReg() {
  try { REG = await Api.registry(); } catch { REG = { providers: [] }; }

  const outs = (g.outputs || []).map(o => o && o.asset_id).filter(Boolean);
  if (outs.length && /succeed/i.test(st)) {
    const per = (base.credits !== '' && base.credits != null) ? Math.round((Number(base.credits) / outs.length) * 100) / 100 : base.credits;
    return outs.map(aid => Object.assign({}, base, { credits: per, asset_id: aid, state: 'done', src: '/asset/' + aid + '?v=2' }));

  const state = /fail/i.test(st) ? 'failed' : (/cancel/i.test(st) ? 'canceled' : 'running');

}
/* 把接口返回的条目录入列表并画出来（多产物任务的第 2..N 张、重试取回的新任务都走它）。

function insertItems(item, opts) {

    const i = viewItems.indexOf(resolved);
    if (i >= 0) viewItems.splice(i, 1);

function buildItems(data) {
  const items = [];
  for (const g of (data.data || [])) {
    if (!isImageTask(g)) continue;
    const base = { provider: (itemProv(g) || {}).id || '', providerName: provNameOf(g.model), gen_id: g.id, ts: g.completed_at || g.created_at || Date.now(), prompt: g.prompt, quality: g.parameters?.quality, ar: g.parameters?.aspect_ratio, model: g.model, credits: g.credits?.charged ?? g.credits?.held ?? '' };
    if (!['succeeded', 'failed', 'canceled'].includes(g.status)) {
      items.push({ ...base, gen_id: g.id, state: 'running' });
      continue;
    }
    if (g.status !== 'succeeded') { items.push({ ...base, state: 'failed' }); continue; }
    // 多图任务的积分按单张分摊（服务端 charged/held 是任务总额）
    const cnt = (g.output_asset_ids || []).length || 1;
    const cRaw = g.credits?.charged ?? g.credits?.held;
    const per = cRaw != null ? Math.round((Number(cRaw) / cnt) * 100) / 100 : '';

}
/* 累计已取回的条数：翻页模式下 viewItems 只是**当前这一页**（图片台是游标分页，每页各存一份），

function loadedTotal() {
  if (PAGE_MODE === 'more') return viewItems.length;
  let n = 0;
  Object.keys(pageCache).forEach(k => { n += (pageCache[k] || []).length; });
  return n;
}
/* 还有没有下一页（同时决定按钮可点与「共 M+ 页」的加号）：

function hasNextPage() {

  const nx = rawCache[page + 1];

}
function updatePager() {
  if (searchMode) return;   // 搜索模式的按钮状态由 renderSearch 负责
  const has = hasNextPage();

  if (PAGE_MODE === 'more') return;                    // 翻页按钮在动态加载模式下是隐藏的
  $('pgNext').textContent = '下一页 ›';

  $('pgNext').disabled = !has;
}
/* 后台把平台总数数准（数完之前只能显示「共 M+ 页」）：
   走图片台自己的 /generations 游标，一次 limit=100 —— 界面每页才 12 条，
   同样的数据两三个请求就能数完（实测 101 条 = 2 个请求）。
   条数口径用 buildItems：它已经做了本页的模型筛选与「多图任务按产物展开」，
   所以数出来的和右栏卡片一模一样。8 页（约 800 条）是发给平台的上限，
   没数完就 exact=false，界面继续带加号，不会假装数完了。 */
async function countGenerations() {
  const keys = new Set();
  let cursor = '', exact = false;
  for (let i = 0; i < 8; i++) {
    const d = await api('/generations?limit=100' + (cursor ? '&cursor=' + encodeURIComponent(cursor) : ''));
    buildItems(d).forEach(it => keys.add(it.asset_id || ('task:' + it.gen_id)));
    const next = d.next_cursor || '';
    if (!next || next === cursor) { exact = true; break; }   // 游标不前进 = 到底（与列表分页同一个判定）

const tally = Wb.tally(countGenerations);
tally.onDone.push(() => { try { updatePager(); } catch (e) { console.warn('[image-gen] 数完总数后刷新分页文案失败：', e); } });
async function gotoPage(n, append) {
  if (searchMode) { searchMode = false; $('searchBox').value = ''; }
  if (n < 0 || (cursors[n] === undefined && n > 0)) return;
  /* 连点翻页 / 自动续拉时会有好几个请求同时在飞：只有最后一次点的那趟能画界面。
     以前没有这层保护 —— 先 page = n、慢的那个请求后回来，屏幕上就是「页码写着第 3 页、
     内容是第 1 页」，而且接着还会 prefetch 错一页。缓存照常写（下次点它是热数据）。 */
  const g = ++pageGen;
  page = n;
  updatePager();
  if (pageCache[n] && !append) { renderPage(n); return; }
  if (!append) $('result').innerHTML = '<div class="empty">加载中…</div>';
  try {
    let data = rawCache[n];
    if (!data) {
      data = await api('/generations?limit=' + PAGE_SIZE + (cursors[n] ? '&cursor=' + encodeURIComponent(cursors[n]) : ''));
      rawCache[n] = data;
    }
    cursors[n + 1] = data.next_cursor || '';
    pageCache[n] = buildItems(data);
  } catch (e) {
    if (g !== pageGen) return;          // 过期请求的失败不能盖掉当前页
    $('result').innerHTML = `<div class="empty err">加载失败：${e.message}</div>`;
    updatePager();
    return;
  }
  if (g !== pageGen) return;            // 期间又翻页了：这条请求的结果只进缓存，不重画
  if (append) { appendPage(n); return; }
  renderPage(n);
  prefetch(n + 1, g);   // 后台预取下一页，用于"下一页"按钮的智能禁用（仅一次轻量列表请求）
}
// 动态加载模式：把下一页追加到列表底部，不替换已有内容
function appendPage(n) {
  const items = [...(pageCache[n] || [])].sort((a, b) => (b.ts || 0) - (a.ts || 0));
  viewItems = viewItems.concat(items);
  upsert(items);
  list.paint(viewItems);
  morePage = n;
  updatePager();
}
// 预取：只拉列表原始数据，不构建卡片、不请求图片，耗时可忽略
function prefetch(n, gen) {
  if (!cursors[n] || rawCache[n]) return;
  api('/generations?limit=' + PAGE_SIZE + '&cursor=' + encodeURIComponent(cursors[n]))
    .then(d => { rawCache[n] = d; cursors[n + 1] = d.next_cursor || ''; if (gen === undefined || gen === pageGen) updatePager(); })
    .catch(() => {});
}
function renderPage(n) {
  const items = [...(pageCache[n] || [])].sort((a, b) => (b.ts || 0) - (a.ts || 0));
  viewItems = items;   // 预览翻页范围 = 当前视图
  /* 动态加载模式下这等于「已经显示到第 n 页」：不更新续拉指针的话，
     重画第一页之后 morePage 还停在 -1，滚动续拉判断的是 cursors[0]（空串），
     于是永远不再往下拉 —— 界面表现为「动态加载只出一页」。 */
  if (PAGE_MODE === 'more') morePage = n;
  upsert(items);

$('pgPrev').onclick = () => gotoPage(page - 1);
$('pgNext').onclick = () => { searchMode ? continueSearch() : gotoPage(page + 1); };
// 「下载位置」按钮已移除：默认保存文件夹统一在「设置」页配置（句柄存 IndexedDB sk_lib/dir）
$('sync').onclick = async () => {
  const btn = $('sync');
  btn.disabled = true; btn.textContent = '刷新中…';
  Object.keys(pageCache).forEach(k => delete pageCache[k]);
  Object.keys(rawCache).forEach(k => delete rawCache[k]);
  Object.keys(searchCache).forEach(k => delete searchCache[k]);
  cursors.length = 1;
  await gotoPage(0);
  tally.run(true);                  // 总数也重数一趟（后台跑，不等它）
  btn.disabled = false; btn.innerHTML = icon('refresh', 13) + ' 刷新';
};

/* ---- 搜索：点击按钮或回车触发；先搜 2 页，之后每次点「下一页」继续搜 2 页，直到搜完全部 ---- */
let searchSeq = 0;
let searchQ = '', searchResults = [], searchPages = 0, searchCursor = '', searchExhausted = false;
const searchCache = {};   // 搜索专用缓存（limit=50）：与分页的 rawCache（limit=12）隔离，避免游标错乱
const startSearch = () => {
  const q = $('searchBox').value.trim().toLowerCase();
  if (!q) { searchMode = false; renderPage(page); return; }
  searchQ = q; searchResults = []; searchPages = 0; searchCursor = ''; searchExhausted = false;
  searchMode = true;
  continueSearch();
};
const continueSearch = () => continueSearchImpl();
$('searchBtn').onclick = startSearch;
$('searchBox').addEventListener('keydown', e => { if (e.key === 'Enter') startSearch(); });
async function continueSearchImpl() {
  const seq = ++searchSeq;
  const batchEnd = searchPages + 2;   // 每次点按钮多搜 2 页（100 个任务）
  while (searchPages < batchEnd && !searchExhausted) {
    let data = searchCache[searchPages];
    if (!data) {
      try { data = await api('/generations?limit=50' + (searchCursor ? '&cursor=' + encodeURIComponent(searchCursor) : '')); }
      catch (e) { if (seq === searchSeq) setStatus(`<span class="err">搜索失败：${e.message}</span>`); return; }
      searchCache[searchPages] = data;
    }
    searchCursor = data.next_cursor || '';
    for (const g of (data.data || [])) {
      if (!isImageTask(g)) continue;
      const hay = [g.prompt || '', g.id || '', ...(g.output_asset_ids || [])].join(' ').toLowerCase();
      if (!hay.includes(searchQ)) continue;
      const base = { provider: (itemProv(g) || {}).id || '', providerName: provNameOf(g.model), gen_id: g.id, ts: g.completed_at || g.created_at || Date.now(), prompt: g.prompt, quality: g.parameters?.quality, ar: g.parameters?.aspect_ratio, model: g.model, credits: g.credits?.charged ?? g.credits?.held ?? '' };
      if (!['succeeded', 'failed', 'canceled'].includes(g.status)) { searchResults.push({ ...base, gen_id: g.id, state: 'running' }); continue; }
      if (g.status !== 'succeeded') { searchResults.push({ ...base, state: 'failed' }); continue; }
      for (const aid of (g.output_asset_ids || [])) searchResults.push({ ...base, asset_id: aid });
    }
    searchPages++;
    if (!searchCursor) { searchExhausted = true; break; }
  }
  if (seq !== searchSeq) return;
  renderSearch();
}
function renderSearch() {
  searchMode = true;
  const items = [...searchResults].sort((a, b) => (b.ts || 0) - (a.ts || 0));
  viewItems = items;   // 搜索后预览翻页范围 = 搜索结果
  if (!items.length) {
    list.clear();
    $('result').innerHTML = `<div class="empty">已搜 ${searchPages} 页，没有匹配的任务（搜索范围：提示词、任务ID、图片ID）</div>`;
  } else list.paint(items.slice(0, 200));
  upsert(items);
  $('pgInfo').textContent = `已搜 ${searchPages} 页 · 找到 ${items.length}`;
  $('pgPrev').disabled = true;
  $('pgNext').disabled = searchExhausted;
  $('pgNext').textContent = searchExhausted ? '已搜完全部' : '继续搜索 ›';
}
/* ---- 跳转指定页：用页面上的页码输入框，不再弹浏览器对话框 ---- */
$('gotoBtn').onclick = () => gotoPageInput();
$('gotoPage').addEventListener('keydown', e => { if (e.key === 'Enter') gotoPageInput(); });
async function gotoPageInput() {
  const v = $('gotoPage').value;
  if (!v) { setStatus('<span class="err">请输入要跳转的页码</span>'); return; }
  const target = Math.max(1, Math.floor(Number(v) || 1)) - 1;
  if (searchMode) { searchMode = false; $('searchBox').value = ''; }
  $('result').innerHTML = '<div class="empty">定位中…</div>';
  try {
    // 游标分页无法直接跳跃：顺序预取沿途页面的列表数据（轻量请求，不加载图片）
    for (let p = 0; p < target; p++) {
      if (rawCache[p] && cursors[p + 1] !== undefined) continue;
      const d = rawCache[p] || await api('/generations?limit=' + PAGE_SIZE + (cursors[p] ? '&cursor=' + encodeURIComponent(cursors[p]) : ''));
      rawCache[p] = d;
      cursors[p + 1] = d.next_cursor || '';
      if (!d.next_cursor) {
        if (p + 1 < target) { setStatus('<span class="err">一共只有 ' + (p + 1) + ' 页</span>'); }
        break;
      }
    }
  } catch (e) {
    setStatus(`<span class="err">跳转失败：${e.message}</span>`);
    return;
  }
  gotoPage(Math.min(target, cursors.length - 1));
}
function ratioText(w, h) {
  if (!w || !h) return '';
  const gcd = (a, b) => b ? gcd(b, a % b) : a;
  const g = gcd(w, h) || 1, r1 = w / g, r2 = h / g;
  return (r1 <= 40 && r2 <= 40) ? `${r1}:${r2}` : `${(w / h).toFixed(2)}:1`;
}
/* 平台显示名：优先 registry 的 displayName（同一 API 的生图/视频不分开统计） */
const provNameOf = mid => {
  for (const p of (REG?.providers || [])) { const m = p.models?.find(x => x.id === mid); if (m) return p.displayName || p.name; }
  return '';
};
function metaText(s) {
  return [s.providerName, s.quality && (QUALITY_ZH[s.quality] || s.quality),
    s.credits != null && s.credits !== '' ? s.credits + ' 积分' : '',
    s.size ? Wb.fmtSize(s.size) : '',
    s.model, s.ar].filter(Boolean).join(' · ');
}

/* 右栏列表：卡片的复用 / 指纹重绘 / 空态由 workbench.js 的 Wb.cards 统一管
   （视频台、语音台的右栏也走同一份，不再各写一套 DOM 复用逻辑） */
const list = Wb.cards.create({
  box: 'result',
  keyOf: s => Wb.taskKey(s, [s.asset_id, s.gen_id]),   // 一条任务出多张图：asset_id 优先
  sigOf: s => cardSigOf(s),
  paint: (d, s) => paintTask(d, s),           // 卡片内容与交互仍由本页画（paintTask）
  emptyHTML: () => '<div class="empty">这一页没有任务</div>',
});
/* 画（或重画）一张卡片。生成中的任务不再由「每卡一个循环」收尾，
   而是由统一的轮询器更新条目状态后调这里重绘 —— 所以重绘必须可重复调用。 */
function paintTask(d, s) {
  d.dataset.asset = s.asset_id || '';
  d.dataset.gen = s.gen_id || '';
  const date = s.ts ? new Date(s.ts).toLocaleDateString() + ' ' + new Date(s.ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
  const running = s.state === 'running';
  const failed = s.state === 'failed';
  const canceled = s.state === 'canceled';
  const statusText = running ? '生成中' : failed ? '生成失败' : canceled ? '已取消' : '已完成';
  d.innerHTML = `
    <div class="tmedia"><div class="timg">${running ? '<span class="spin-dot"></span>生成中'
      : (failed || canceled) ? statusText : (s.asset_id ? '<span class="spin-dot"></span>取图中…' : '无产物')}</div><div class="trefs"></div></div>
    <div class="tmain">
      <div class="meta1"><span class="dot${running ? ' run' : failed ? ' fail' : ''}"></span><span class="st">${statusText}</span> <span class="date">${date}</span></div>
      <div class="tprompt" title="${(s.prompt || '').replace(/"/g, '&quot;')}">${(s.prompt || '').replace(/</g, '&lt;') || '(无提示词)'}</div>
      ${failed && s.error ? `<div class="terr" title="${String(s.error).replace(/"/g, '&quot;')}">${esc(s.error)}</div>` : ''}
      <div class="meta2">${metaText(s)}</div>
      <div class="acts">${Wb.actsHTML(s, {
        preview: !!s.asset_id, previewLabel: '预览',
        cancel: running && !!s.gen_id,
        retry: (failed || canceled) && !!s.prompt,
      })}</div>
      <div class="tdetail" hidden></div>
    </div>`;
  const imgWrap = d.querySelector('.timg');
  const tp = d.querySelector('.tprompt');
  if (tp) tp.onclick = () => toggleDetail(s, d);
  if (s.asset_id) {
    // 一律走本地代理 /asset/<id>：实时换新链接，永不过期
    const target = '/asset/' + s.asset_id + '?v=2';
    s.src = target;
    // 缩略图走全站共用缓存（workbench.js 的 Wb.thumbs）：命中就是小图秒出；没命中先按原图显示，
    // 加载完顺手缩一份存进去（后台空闲时做，不挡出图）
    const cached = Wb.thumbs.get(target);
    const img = new Image();
    img.onload = () => { imgWrap.innerHTML = ''; imgWrap.appendChild(img); attachAssetDrag(img, s.asset_id); imgWrap.onclick = () => Wb.lightbox.open(s); };
    img.onerror = () => {
      imgWrap.textContent = '图片不可用，点击重试';
      imgWrap.onclick = () => { imgWrap.innerHTML = '<span class="spin-dot"></span>取图中…'; img.src = target + '&r=' + Date.now(); };
    };
    if (cached) img.src = cached;
    else { Wb.thumbs.bind(imgWrap, img, target); img.src = target; }
  }
  renderRefs(d, s);
  /* 动作按钮统一接线（确认弹窗 / 忙碌态 / 失败提示与视频、语音台一致） */
  Wb.bindActs(d, s, {
    fileName: '图片-' + String(s.prompt || 'image').replace(/\s+/g, ' ').trim().slice(0, 18) + '.' + (s.format || 'png'),
    dlUrl: s.asset_id ? ('/asset/' + s.asset_id + '?dl=1') : (s.src || ''),
    onDetail: () => toggleDetail(s, d),
    onPreview: () => Wb.lightbox.open(s),
    onCancel: async () => {
      await Wb.cancelTask(Api.prov(s.provider) || (await imgProvider()), s.gen_id);
      s.state = 'canceled'; saveCache(); paintTask(d, s);
      Toast.ok('已取消');
    },
    onRetry: async () => {
      /* 这条之前是「提交结果未知」的状态时，先刷新列表核对：平台若已受理就直接认回来，不再重复提交。 */
      if (s.maybeSubmitted) {
        try {
          Object.keys(pageCache).forEach(k => delete pageCache[k]);
          Object.keys(rawCache).forEach(k => delete rawCache[k]);
          await gotoPage(0);
          Toast.ok('列表已刷新（若这条已生成，会直接显示出来）');
        } catch (e) { console.warn('[image-gen] 重试前核对列表失败：', e); }
        const go = await Confirm.ask({
          title: '仍然重新生成？', danger: true, okLabel: '重新生成', cancelLabel: '先不生成',
          body: '上一次提交的结果不确定（平台可能已经受理，只是响应丢了）。列表里没查到它时才建议重新生成，否则会重复扣费。',
        });
        if (!go) return;
      }
      Toast.info('已按同样的提示词重新提交，请稍候…');
      /* 提交失败也要留个标记：若是「结果未知」那类（超时 / 连接中断），下次点重试会先核对列表再决定，
         免得把一次其实成功的提交又提交一遍（重复扣费）。 */
      try { await regenItem(s); }

  if (!running && !failed && !canceled && s.gen_id && (!s.ref_ids || !s.size)) {
    api('/generations/' + s.gen_id).then(g => {
      if (g.inputs) s.ref_ids = (g.inputs || []).filter(i => i.role === 'reference_image' && i.media_type === 'image').map(i => i.asset_id);
      const out = (g.outputs || []).find(o => o.asset_id === s.asset_id) || (g.outputs || [])[0];
      if (out && out.byte_length) s.size = Number(out.byte_length);
      saveCache(); if (d.isConnected) { renderRefs(d, s); const m2 = d.querySelector('.meta2'); if (m2) m2.textContent = metaText(s); }
    }).catch(() => {});
  }

  return d;
}
/* 重试用同一条提示词与参数重新提交一个任务（旧条目保留，新条目插到最前） */
async function regenItem(s) {
  const body = { model: s.model || $('model').value, prompt: s.prompt, quality: s.quality, aspect_ratio: s.ar, output_count: 1 };
  const prov = Api.prov(s.provider) || (await imgProvider());   // 条目自带的平台优先；老缓存里没这个字段时按本工作台的平台
  const gen = await Api.create(prov, { model: body.model, prompt: body.prompt, quality: body.quality, ar: body.aspect_ratio, count: 1 });
  await adoptTask(gen.id);     // 同样从接口取回来插卡
  Toast.ok('已重新提交');
}

/* ============ 任务状态轮询（统一轮询器） ============
   以前是「每张卡一个 for(;;) 循环」，只要中间有一次网络抖动，catch 里直接 return ——
   那张卡就永远停在「生成中」，既不重试也不报错。现在改成：一个轮询器扫全部进行中的任务，
   单次失败由轮询器计数并在连续失败时提示，网络恢复后自动继续。 */
/* 单次轮询：把一条任务的最新状态合并回条目（不发 UI，交给 onChange 统一重绘） */
async function pollItem(s) {
  if (!s.gen_id) return;
  let g;
  try {
    g = await api('/generations/' + s.gen_id);
  } catch (e) {
    /* 任务在平台上查不到（404 / 明确说「不存在」：已被清理 / 换了平台 / 任务号失效）：
       本地占位不能一直停在「排队中」，按失败结掉并把原因写在卡片上。
       只认状态码与明确的「不存在」措辞 —— /40[34]/ 在整条消息里找子串会把任务号、
       金额里带 403/404 的普通错误也误判成「已清理」，当场把还能跑的任务结掉。
       403 不当成「已清理」：那多半是限流或鉴权抖一下，任务号还有效，交给轮询器退避重试。
       而且要看连续两轮都查不到才认 —— 单次 404 也可能只是上游那一跳没命中。 */
    const gone = e && (e.status === 404 || /不存在|未找到|not\s*found/i.test(String(e.message || '')));
    if (gone && (s.goneRounds = (s.goneRounds || 0) + 1) >= 2) {
      s.state = 'failed';
      s.error = '平台上找不到这条任务（可能已被清理或过期），可重新生成';
      s.gen_id = null;      // 不再轮询它
    }
    throw e;
  }
  const st = g.status;
  /* 详情响应里没有状态字段（平台把接口降级/改了形状）：抛错让轮询器计数、退避并提示，
     而不是静默空转 —— 否则任务会永远显示「生成中」（VGENV 视频的详情接口就是这样）。 */
  if (!st) throw new Error('平台没返回这条生图任务的状态（详情接口可能已变更）');
  s.goneRounds = 0;
  if (st === 'succeeded') {
    const outs = (g.outputs || []).filter(o => o && o.asset_id);
    /* 状态已成功但产出还是空：上游确实会先标 succeeded、再补 outputs，所以给几轮宽限；
       但宽限要有头 —— 以前这里直接 return，卡片就永远停在「生成中」一声不吭地转圈。 */
    if (!outs.length) {
      if ((s.emptyRounds = (s.emptyRounds || 0) + 1) < 4) return;
      s.state = 'failed';
      s.error = '平台说这一条已经成功，却没有给出任何产物（可能已被清理），可重新生成';
      s.gen_id = null;
      return g;
    }
    s.emptyRounds = 0;
    const first = outs[0];
    s.asset_id = first.asset_id; s.state = 'done';
    if (first.byte_length) s.size = Number(first.byte_length);
    s.src = '/asset/' + s.asset_id + '?v=2';
    s.credits = g.credits?.charged ?? g.credits?.held ?? s.credits;
    /* 一条任务可能出多张图：以前只取 outputs[0]，其余几张要等下一次列表刷新才出现
       （列表拉不到那一页时就永远不出现）。这里就地补出剩余条目 —— 同 gen_id、不同 asset_id，
       dedupeGallery/findSame 都按「产物不同算新条目」处理，不会和第一张合并。 */
    if (outs.length > 1) {
      const extra = [];
      outs.slice(1).forEach(o => {
        const aid = String(o.asset_id);
        if (gallery.some(x => x.asset_id === aid)) return;
        extra.push({
          gen_id: s.gen_id, state: 'done', prompt: s.prompt, quality: s.quality, ar: s.ar,
          providerName: s.providerName, model: s.model, asset_id: aid,
          size: o.byte_length ? Number(o.byte_length) : undefined,
          src: '/asset/' + aid + '?v=2', credits: s.credits, ts: s.ts || Date.now(),
        });
      });
      if (extra.length) extra.forEach(e => insertItems(e, { skipView: searchMode }));
    }
  } else if (st === 'failed' || st === 'canceled') {
    s.state = st === 'failed' ? 'failed' : 'canceled';
    s.error = (g.error && g.error.message) || '';
  }
  if (g.inputs) s.ref_ids = (g.inputs || []).filter(i => i.role === 'reference_image' && i.media_type === 'image').map(i => i.asset_id);
  return g;
}

const imgPoller = Wb.poller({

async function sha256Hex(buf) {
  const h = await crypto.subtle.digest('SHA-256', buf);
  return [...new Uint8Array(h)].map(b => b.toString(16).padStart(2, '0')).join('');
}
async function uploadRef(file, onStage) {
  /* 通用跨平台转存（本地图片 → 所选模型所属平台的资产）；onStage 把上传进度报给状态行。
     必须和建任务用同一家：参考图 id 是平台私有的，传到 A 家再给 B 家的模型引用会直接被判非法。 */
  const mp = modelProv() || (await imgProvider()) || {};
  return await AssetTransfer.toAsset(mp.id, file, { reg: REG, name: file && file.name, onStage });
}

/* ============ 生成（点击后按钮变灰，任务创建成功后恢复，可再次点击）============ */
$('go').onclick = async () => {
  const prompt = $('prompt').value.trim();
  // 统一就绪判定（提示词 / 有无可用模型 / 当前模型支不支持已选参考图）：按钮禁用只是提示，这里再拦一次
  const why = submitBlockReason();
  if (why) { setStatus('<span class="err">' + why + '</span>'); updateGoState(); return; }
  const total = Math.max(1, Math.floor(Number($('count').value) || 1));
  const q = $('quality').value, ar = $('ratio').value;
  /* 第一行就禁用：以前禁用排在 await（密钥探测 / 参考图取字节上传）之后，
     await 期间按钮还能点 → 连点两次就重复建任务、重复扣费。 */
  $('go').disabled = true;
  let ok = true;
  let adopted = false;              // 已把「取回列表」交给后台：提示不能被 finally 清空

  try {
    await ensureImgKey();
    const assetIds = [];
    if (picked.length) {
      setStatus('处理参考图…');
      for (let pi = 0; pi < picked.length; pi++) {
        const p = picked[pi];
        const refLabel = picked.length > 1 ? '参考图 ' + (pi + 1) + '/' + picked.length : '参考图';
        // 上传进度一路报到这里（取回 → 申请地址 → 上传字节，字节进度来自代理）
        const onStage = (st, info) => { const t = uploadStageText(st, info, refLabel); if (t) setStatus(t); };
        // 本平台资产（UUID）直接引用；本地资产 / 别家平台的 id 会被上游判为 Invalid UUID（只回「部分内容需要检查。」）
        if (p.assetId && (!window.AssetTransfer || AssetTransfer.isPlatformId(p.assetId))) { assetIds.push(p.assetId); continue; }
        let file = p.file;
        if (!file) {                       // 只有地址的（资产库/远端链接）：先取回字节，别让它静默丢掉
          const blob = await AssetTransfer.blobOf(p.url || p.src, onStage);
          file = new File([blob], 'ref.png', { type: blob.type || 'image/png' });
        }
        assetIds.push(await uploadRef(file, onStage));
      }
    }
    // 数量已在模型单次上限之内（下拉按能力接口给的上限限制），按单次上限切成多批请求
    const curModel = (imgModels().find(x => x.m.id === $('model').value) || {}).m || {};
    const perReq = modelLimits(curModel).maxOut;
    /* 只提交模型声明了的参数：控件被隐藏（模型没声明）时不再把 DOM 里的旧值带上，
       否则上游会收到一个它不认识的参数（要么报错，要么静默按默认值来，界面数字对不上）。 */
    const declared = (imgModels().find(x => x.m.id === $('model').value) || {}).m || {};
    const dOpts = declared.options || {};
    const params = {};
    if ((dOpts.qualities || []).length) params.quality = q;
    if ((dOpts.aspect_ratios || []).length) params.aspect_ratio = ar;
    if ((dOpts.output_formats || []).length) params.output_format = $('format').value;
    const sendCount = Number(dOpts.max_outputs) > 0;
    const created = [];
    for (let i = 0; i < total; i += perReq) {
      const n = Math.min(perReq, total - i);
      setStatus('创建任务…');
      const gen = await createWithRetry(() => api('/generations', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Idempotency-Key': crypto.randomUUID() },
        // log：归档到提示词文件夹时要写在文件头里的信息（见 PromptLog）
        log: { type: '图片生成', meta: { 画质: q, 画幅: ar, 格式: $('format').value,
          本批张数: n > 1 ? n + ' 张' : '', 参考图: assetIds.length ? assetIds.length + ' 张' : '' } },
        body: JSON.stringify(Object.assign({
          model: $('model').value,
          prompt,
          parameters: sendCount ? Object.assign({}, params, { output_count: n }) : params,
          inputs: assetIds.map(id => ({ role: 'reference_image', asset_id: id }))
        }))
      }));
      if (gen && gen.id) created.push(gen.id);
      loadWallet();
    }
    /* 卡片一律来自平台接口：创建成功后把这些任务取回插进列表（不再造本地占位卡）。
       整批一次 adoptTasks（多条并行取详情，取不回的合起来只兜底刷一次），
       这一步**不阻塞按钮**（详情/列表接口动辄好几秒），界面只提示「取回中」。 */
    setStatus(created.length ? '<span class="ok">✓ 已创建，正在把任务取回列表…</span>' : '');
    adoptTasks(created).then(missing => {
      if (missing.length) setStatus(`<span class="warn">${missing.length} 个任务已提交，但列表里还没查到 —— 点右上角「刷新」再看，别重复生成</span>`);
      else setStatus('');
    }).catch(e => console.warn('[image-gen] 取回新任务出错：', e && e.message));
    tally.run(true);      // 平台上多了任务：总数重数一趟（不猜 +N，完成前后条数本来就不一样）
    /* 取回是后台跑的，finally 里的「成功就清空提示」不能把它写的提示抹掉 */
    adopted = true;
  } catch (e) {
    ok = false;
    /* 提交类失败里有一类最坑：请求已经到达平台、平台也建好了任务，只是响应没回来（超时 / 连接被掐断）。
       只写「失败」会诱导用户再点一次生成 → 平台上多出一条重复任务（还会重复扣费）。
       所以这里明确说「结果未知、平台可能已受理」，并**立刻刷新一次列表**：
       平台上的那条任务会被 buildItems/upsert 并进画廊，用户一眼就能看到它其实建好了。 */
    const maybe = !!(e && (e.maybeSubmitted || /超时|timeout|中断|Failed to fetch|上游响应超时/i.test(String(e.message || ''))));
    setStatus(maybe
      ? `<span class="warn">提交结果未知（${e.message}）：平台可能已受理，正在核对列表…</span>`
      : `<span class="err">失败：${e.message}</span>`);
    if (maybe) {
      /* 核对列表同样放后台（平台列表可能要好几秒），不卡住按钮 */
      Object.keys(pageCache).forEach(k => delete pageCache[k]);     // 丢掉短缓存，确保拿到最新
      Object.keys(rawCache).forEach(k => delete rawCache[k]);
      gotoPage(0)                                                   // 重新拉第一页 → 平台上的那条会被并进列表
        .then(() => { tally.run(true); setStatus(`<span class="warn">提交结果未知（${e.message}）：平台可能已受理 —— 上面列表里有这条任务就是成功了，别重复生成</span>`); })
        .catch(e2 => console.warn('[image-gen] 核对列表失败：', e2));
    }
  } finally {
    updateGoState();         // 按当前条件重新判定（该禁用就保持禁用）
    if (ok && !adopted) setStatus('');   // 任务创建成功：清空提示（取回中的提示由后台流程负责收尾）
  }
};

/* ---------- 动态加载模式（设置 → 分页方式 选「动态加载」时）----------
   翻页按钮隐藏，滚到列表底部附近自动续拉下一批（工具条上不放「加载更多」按钮，免得挤动右边那排）。 */
if (PAGE_MODE === 'more') {
  ['pgPrev', 'pgNext'].forEach(id => $(id).style.display = 'none');
  const imgBox = $('result');
  const imgNearBottom = () => imgBox.scrollHeight - imgBox.scrollTop - imgBox.clientHeight < 400;
  let imgAutoBusy = false;
  const imgAutoLoad = async () => {
    if (imgAutoBusy || PAGE_MODE !== 'more') return;
    if (!cursors[morePage + 1]) return;                    // 没有下一页
    imgAutoBusy = true;
    try { let guard = 0; while (cursors[morePage + 1] && guard++ < 10 && imgNearBottom()) await gotoPage(morePage + 1, true); }
    catch (e) { console.warn('[image-gen] 自动续拉失败：', e); }
    finally { imgAutoBusy = false; }
  };
  imgBox.addEventListener('scroll', () => { if (imgNearBottom()) imgAutoLoad(); }, { passive: true });
  setTimeout(imgAutoLoad, 100);   // 首屏一屏没填满就先补一批
}
/* 分页文案与三个台统一（Wb.pager.infoText）：显示「第 N 页 / 共 M 页」，
   动态加载模式下页数按已加载条数折算；hasMore 由调用方算好传进来（游标 + 预取的下一页是否为空）；
   total 是后台数准的平台总条数（countGenerations），没数准就传 0，文案退回按本地条数折算并带加号。 */
function pagerText(loaded, hasMore) {
  return Wb.pager.infoText({
    mode: PAGE_MODE === 'more' ? 'more' : 'page',
    page: PAGE_MODE === 'more' && morePage >= 0 ? morePage : page,
    loaded, pageSize: PAGE_SIZE,
    total: tally.value(),
    hasMore: hasMore === undefined ? hasNextPage() : !!hasMore,
  });
}

function libName(s) {
  const p = (s.prompt || 'image').replace(/\s+/g, ' ').trim().slice(0, 24);
  const d = new Date(s.ts || Date.now());
  const pad = n => String(n).padStart(2, '0');
  const ext = (s.src.match(/\.(png|jpe?g|webp)(\?|$)/i) || [])[1] || 'png';
  const raw = `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())} ${p || 'image'} [${s.ar || '1:1'}].${ext}`;
  // FS API / Windows 都不允许文件名含 : 等字符，且不能以点或空格结尾
  return raw.replace(/[\\/:*?"<>|\x00-\x1f]/g, '-').replace(/[. ]+$/g, '') || 'image.png';
}


/* ============ 下拉组件 ============
   统一用 ui.js 的公共组件（与视频 / 语音 / 导演台同一套，支持 optgroup 分组、title 悬浮提示）。
   以前这里有一份自己的实现，改一处漏一处（比如分组、悬浮名就不生效）—— 已删除，只留这一行转调。 */

buildDropdowns();                       // 静态下拉先换成公共组件外观（动态重建时各处理再 _ddRebuild）

</script>
